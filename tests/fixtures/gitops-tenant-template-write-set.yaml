# Ledger for tests/test_gitops_tenant_template_write_set.py (tracker: mctlhq/mctl-gitops#1033).
#
# SHRINK-ONLY. Delete rows in the change that removes the reach; adding a row
# needs a reviewer's explicit decision.
#
# template_reach: tenant-class workflow templates (those not submitted into the
#   argo-workflows namespace) and the credential Secrets each can reach, through
#   its own mounts and env references and through templateRef targets.
template_reach:
  deploy-service: [github-actions-pat, mctl-gitops-deploy-key]
  preview-deploy: [github-actions-pat]
  provision-database: [mctl-gitops-deploy-key]
  retire-service: [mctl-gitops-deploy-key]
  rollback-service: [mctl-gitops-deploy-key]
  tpl-git-commit: [mctl-gitops-deploy-key]
# readers: [subject, Role, way] for the subjects that can read the credential
#   Secrets (read:<Secret>, one row per credential), exec or attach into pods
#   (exec), patch or update an existing Pod, whose container images are mutable
#   (pod-modify: core pods patch/update; see POD_MODIFY_RESOURCES in the test),
#   start a pod some other way (workload-create: pods create, Deployments,
#   StatefulSets, ReplicaSets, DaemonSets, Jobs, CronJobs, Argo Workflows,
#   CronWorkflows and WorkflowTemplates; see WORKLOAD_RESOURCES in the test) or
#   obtain another subject's identity or permissions (escalation: serviceaccounts/
#   token create, impersonate on users, groups and serviceaccounts, create, update,
#   patch, bind or escalate on roles, rolebindings, clusterroles and
#   clusterrolebindings; see ESCALATION_RESOURCES in the test), in a tenant
#   namespace that holds the credentials. Resource entries are matched the way the
#   Kubernetes RBAC authorizer matches them ("*", "resource/subresource",
#   "*/subresource"). These rows are expected in every tenant.
#   ServiceAccount subjects are namespace-qualified: `{ns}` stands for the
#   tenant's own namespace, any other namespace is written out. Users and
#   Groups are kind/name.
# readers_by_tenant: extra rows for one tenant, keyed by tenant directory name
#   (platform-gitops/tenants/<name>). A tenant not listed gets the rows above only,
#   so a new tenant that turns on a grant beyond them fails until a reviewer
#   adds the row. An entry for a tenant that no longer exists fails the test:
#   delete it in the change that deletes the tenant.
readers:
  - ["ServiceAccount/mctl-api/mctl-api", mctl-api-workflows, "workload-create"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-helm-deploy, "escalation"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-helm-deploy, "pod-modify"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-helm-deploy, "read:github-actions-pat"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-helm-deploy, "read:mctl-gitops-deploy-key"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-helm-deploy, "workload-create"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-runner, "read:github-actions-pat"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-runner, "read:mctl-gitops-deploy-key"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-runner, "workload-create"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-smoke-verify, "exec"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-smoke-verify, "read:github-actions-pat"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-smoke-verify, "read:mctl-gitops-deploy-key"]
  - ["ServiceAccount/{ns}/argo-workflow-sa", argo-workflow-smoke-verify, "workload-create"]
readers_by_tenant:
  admins:
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-smoke-verify, "exec"]
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-smoke-verify, "read:github-actions-pat"]
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-smoke-verify, "read:mctl-gitops-deploy-key"]
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-smoke-verify, "workload-create"]
  labs:
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-central-restart, "workload-create"]
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-smoke-verify, "exec"]
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-smoke-verify, "read:github-actions-pat"]
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-smoke-verify, "read:mctl-gitops-deploy-key"]
    - ["ServiceAccount/argo-workflows/argo-workflow-sa", argo-workflow-smoke-verify, "workload-create"]
