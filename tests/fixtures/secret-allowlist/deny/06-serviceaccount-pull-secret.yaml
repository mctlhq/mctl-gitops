# The ServiceAccount admission plugin copies puller's imagePullSecrets
# (setup.yaml: ghcr-credentials) into the Pod before validation.
apiVersion: v1
kind: Pod
metadata:
  name: via-sa
  namespace: erpact
spec:
  serviceAccountName: puller
  automountServiceAccountToken: false
  containers:
    - name: c
      image: busybox
