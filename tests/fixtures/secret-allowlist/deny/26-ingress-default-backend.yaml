# expect: may not set spec.defaultBackend
# A rule that passes the pattern, plus a catch-all for every other host:
# only the defaultBackend check refuses this.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catch-all
  namespace: erpact
spec:
  ingressClassName: traefik
  defaultBackend:
    service:
      name: web
      port:
        number: 80
  rules:
    - host: erpact-11112025.mctl.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
