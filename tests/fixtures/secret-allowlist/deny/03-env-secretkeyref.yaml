# expect: container c env/envFrom names a Secret outside
apiVersion: v1
kind: Pod
metadata:
  name: env-db-creds
  namespace: erpact
spec:
  automountServiceAccountToken: false
  containers:
    - name: c
      image: busybox
      env:
        - name: OK
          valueFrom:
            secretKeyRef:
              name: clo-s3
              key: S3_URL
        - name: PG
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
