# expect: every Ingress rule host in this namespace must match
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: no-pattern
  namespace: partial
spec:
  ingressClassName: traefik
  rules:
    - host: erpact-x.mctl.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
