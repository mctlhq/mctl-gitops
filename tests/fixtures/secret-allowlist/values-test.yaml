# Test-only overlay.
# - puller (setup.yaml) is an allowed ServiceAccount, so deny/06 can only be
#   refused for the pull secret it injects, not for itself.
# - partial lists only serviceAccounts and partial-sa only secrets: an entry
#   missing a list must deny with the Forbidden message, not a CEL error, and
#   allow nothing of that kind (deny/10, deny/11, deny/14).
# - loose has an unanchored hostPattern (deny/20).
externalManifestNamespaces:
  # The namespace name is a fixture name: the policy cases below were written
  # against tenant erpact's entry, which bootstrap values no longer carry
  # (the tenant was removed from the cluster), so the entry lives here.
  erpact:
    secrets:
      - clo-s3
      - deployer-git
      - deployer-secret
      - erpact-backup-r2
      - erpact-oidc-zitadel
      - erpact-frappe-users
      - mariadb-root
    serviceAccounts:
      - default
      - puller
    hostPattern: 'erpact-[a-z0-9]([a-z0-9-]*[a-z0-9])?\.mctl\.ai|[a-z0-9]([a-z0-9-]*[a-z0-9])?\.erpact\.online'
  partial:
    serviceAccounts:
      - default
  partial-sa:
    secrets:
      - anything
  # An unanchored pattern: the policy must anchor it itself (deny/20).
  loose:
    serviceAccounts:
      - default
    hostPattern: 'erpact-[a-z0-9]+\.mctl\.ai'
