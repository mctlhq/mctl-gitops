apiVersion: v1
kind: Pod
metadata:
  name: csi-allowed
  namespace: erpact
spec:
  serviceAccountName: default
  automountServiceAccountToken: false
  containers:
    - name: c
      image: busybox
  volumes:
    - name: v
      csi:
        driver: example.csi.k8s.io
        nodePublishSecretRef:
          name: clo-s3
    - name: d
      csi:
        driver: example.csi.k8s.io
