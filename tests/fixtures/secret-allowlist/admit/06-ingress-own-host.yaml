apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: own-hosts
  namespace: erpact
spec:
  ingressClassName: traefik
  rules:
    - host: erpact-11112025.mctl.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
  tls:
    - hosts:
        - erpact-11112025.mctl.ai
