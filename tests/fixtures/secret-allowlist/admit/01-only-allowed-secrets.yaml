apiVersion: v1
kind: Pod
metadata:
  name: all-allowed
  namespace: erpact
spec:
  automountServiceAccountToken: false
  containers:
    - name: c
      image: busybox
      env:
        - name: A
          valueFrom:
            secretKeyRef:
              name: deployer-secret
              key: SECRET
        - name: PLAIN
          value: x
        - name: CM
          valueFrom:
            configMapKeyRef:
              name: some-config
              key: k
      envFrom:
        - secretRef:
            name: clo-s3
        - configMapRef:
            name: some-config
  initContainers:
    - name: i
      image: busybox
      envFrom:
        - secretRef:
            name: mariadb-root
  volumes:
    - name: g
      secret:
        secretName: deployer-git
    - name: p
      projected:
        sources:
          - secret:
              name: mariadb-root
          - configMap:
              name: some-config
          - serviceAccountToken:
              path: token
    - name: e
      emptyDir: {}
