# Fixture for scripts/test-reserved-hosts-policy.sh (mctl-reserved-platform-hosts, #1503).
# The Ingress policy does not normalise case: the API server rejects a non-lowercase host before admission runs. This proves that premise.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: x
  namespace: karabu
spec:
  ingressClassName: traefik
  rules:
  - host: AUTH.mctl.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: svc
            port:
              number: 80
