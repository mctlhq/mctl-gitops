# Fixture for scripts/test-reserved-hosts-policy.sh (reservedDomains: erpact.online owned by erpact).
# Only spec.tls.domains offends.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: x
  namespace: karabu
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`karabu-x.mctl.ai`)
    kind: Rule
    services:
    - name: svc
      port: 80
  tls:
    domains:
    - main: x.erpact.online
