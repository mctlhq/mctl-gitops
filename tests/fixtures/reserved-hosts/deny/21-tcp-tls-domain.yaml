# Fixture for scripts/test-reserved-hosts-policy.sh (mctl-reserved-platform-hosts, #1503).
# Only spec.tls.domains offends, on the IngressRouteTCP kind.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: x
  namespace: karabu
spec:
  entryPoints:
  - websecure
  routes:
  - match: HostSNI(`karabu-db.mctl.ai`)
    services:
    - name: svc
      port: 5432
  tls:
    domains:
    - main: auth.mctl.ai
