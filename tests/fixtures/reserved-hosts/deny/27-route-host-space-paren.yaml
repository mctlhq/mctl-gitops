# Fixture for scripts/test-reserved-hosts-policy.sh (mctl-reserved-platform-hosts, #1503).
# Isolates the count-equality clause: 'Host (' is not matched by the anchored
# literal but is counted as a Host-family matcher.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: x
  namespace: karabu
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`karabu-x.mctl.ai`) && Host (`auth.mctl.ai`)
    kind: Rule
    services:
    - name: svc
      port: 80
