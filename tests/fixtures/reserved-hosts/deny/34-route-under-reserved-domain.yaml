# Fixture for scripts/test-reserved-hosts-policy.sh (reservedDomains: erpact.online owned by erpact).
# traefik ignores case and a trailing dot, so the route host is normalised first.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: x
  namespace: karabu
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`X.Erpact.Online.`)
    kind: Rule
    services:
    - name: svc
      port: 80
