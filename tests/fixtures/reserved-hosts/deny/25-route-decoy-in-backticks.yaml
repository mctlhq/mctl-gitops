# Fixture for scripts/test-reserved-hosts-policy.sh (mctl-reserved-platform-hosts, #1503).
# A Host( at the end of one backtick argument plus the next argument forms a decoy literal; it is not at the top level of the conjunction and its host is not a DNS name.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: x
  namespace: karabu
spec:
  entryPoints:
  - websecure
  routes:
  - match: 'PathPrefix(`/`) && Header(`(Host(`, `)`)'
    kind: Rule
    services:
    - name: svc
      port: 80
