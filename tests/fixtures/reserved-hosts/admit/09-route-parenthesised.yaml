# Fixture for scripts/test-reserved-hosts-policy.sh (mctl-reserved-platform-hosts, #1503).
# The ( anchor admits a parenthesised conjunction with a real top-level Host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: x
  namespace: karabu
spec:
  entryPoints:
  - websecure
  routes:
  - match: (Host(`karabu-x.mctl.ai`) && PathPrefix(`/api`))
    kind: Rule
    services:
    - name: svc
      port: 80
