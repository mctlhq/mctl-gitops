# Ledger for tests/test_gitops_write_credential_holders.py (tracker: mctlhq/mctl-gitops#1033).
#
# SHRINK-ONLY. Every row is one place that refers to the gitops write
# credentials (see tests/gitops_write_set.py for the names). A reference that is
# not listed fails the test; a row whose reference is gone fails it too, so the
# list is edited only by deleting rows in the change that removed the reference.
# Adding a row needs a reviewer's explicit decision, not a convenience edit.
#
# A text mention (a script body, a chart template, a shell script) is one row per
# non-comment line that contains the name, so a second reference in a file that
# is already on the ledger is a new row and fails the test.
#
# static row:   [file, document, template, mechanism, name]
# rendered row: [document, template, mechanism, name], expected from the tenant
#               chart for EVERY tenant values file.
