# Objects the policy test acts on, created for real before the dry-runs.
# Shapes follow the live cluster: ApplicationSet-generated service apps carry
# team=<ns> and project apps; platform apps sit in project default or
# platform without a team label.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karabu-web
  namespace: argocd
  labels:
    team: karabu
    env: apps
  annotations:
    argocd.argoproj.io/tracking-id: "root-app:argoproj.io/Application:argocd/karabu-web"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/helm-charts/base-service
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: karabu
---
# Labelled for karabu but outside project apps: not owned.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karabu-outside-apps
  namespace: argocd
  labels:
    team: karabu
spec:
  project: default
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/helm-charts/base-service
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: karabu
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labs-web
  namespace: argocd
  labels:
    team: labs
    env: apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/helm-charts/base-service
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: labs
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/bootstrap
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-pg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/shared-pg
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: shared-pg
---
# Named after the tenant, but a platform app without a team label. Labelled
# like the live one the tenants ApplicationSet generates; the test script adds
# the ownerReference once the ApplicationSet exists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-karabu
  namespace: argocd
  labels:
    env: platform
    mctl.me/tenant: karabu
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/helm-charts/tenant
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: karabu
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/tracking-id: "root-app:argoproj.io/ApplicationSet:argocd/apps"
spec:
  goTemplate: true
  generators:
    - list:
        elements: []
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: apps
      source:
        repoURL: https://github.com/mctlhq/mctl-gitops.git
        path: platform-gitops/helm-charts/base-service
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .name }}"
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements: []
  template:
    metadata:
      name: "tenant-{{ .name }}"
    spec:
      project: platform
      source:
        repoURL: https://github.com/mctlhq/mctl-gitops.git
        path: platform-gitops/helm-charts/tenant
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .name }}"
---
# The platform workflow tier, which the tenant policies must not match and
# its own policies narrow. Its Role and RoleBinding are taken from
# argo-workflows/config/sa-and-rbac.yaml by the test script.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow-sa
  namespace: argo-workflows
---
# Objects for the platform workflow tier's cases.
#
# A platform app in project platform, like temporal on the live cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/temporal
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
---
# Shaped like a service app (project apps, team=karabu) but not generated by
# the ApplicationSet apps: no ownerReference.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karabu-handmade
  namespace: argocd
  labels:
    team: karabu
spec:
  project: apps
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/helm-charts/base-service
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: karabu
---
# Shaped like tenant-<T> (project platform, mctl.me/tenant) but not
# generated by the ApplicationSet tenants: no ownerReference.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-labs
  namespace: argocd
  labels:
    mctl.me/tenant: labs
spec:
  project: platform
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    path: platform-gitops/helm-charts/tenant
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: labs
---
# An ApplicationSet other than apps and tenants.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openclaw-skills
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements: []
  template:
    metadata:
      name: "{{ .name }}-openclaw-skills"
    spec:
      project: default
      source:
        repoURL: https://github.com/mctlhq/mctl-gitops.git
        path: platform-gitops/openclaw
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .name }}"
---
# What deleting tenant-ttt left behind on the live cluster: the tenant
# chart's Role and RoleBinding in argocd, for a namespace that is gone.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-argocd-ttt
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: mctl-platform
    mctl.me/tenant: ttt
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-argocd-ttt
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: mctl-platform
    mctl.me/tenant: ttt
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: ttt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow-argocd-ttt
---
# Argo CD's own RBAC, which the platform tier must never delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
rules: []
---
# Labelled for a tenant, but not the tenant chart's name.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: karabu-extra
  namespace: argocd
  labels:
    mctl.me/tenant: karabu
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: karabu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-server
---
# The pair the tenant chart renders for a team namespace (<T>-<team>) when
# tenant.teams is set: named after the namespace, labelled with the tenant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-argocd-karabu-web
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    mctl.me/tenant: karabu
rules: []
---
# Labelled karabu, and its name starts with the tenant's, but without the
# hyphen: another tenant's (karaburu) name space, not karabu's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-argocd-karaburu
  namespace: argocd
  labels:
    mctl.me/tenant: karabu
rules: []
