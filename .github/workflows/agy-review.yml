name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: agy-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@0ca555be1bfadf79f76f2fd56a00e91b89806ffe
    permissions:
      contents: read
      pull-requests: write
    with:
      # Aggregated by review-gate.yml (#1040), which evaluates Agy's verdict
      # for merge-readiness -- no longer "reviewed manually until #240"
      # (that proposal is the Tier 3 shepherd's own, separate Agy-gating gap
      # in a different repo and does not block this). blocking: true keeps
      # this reusable workflow's own signal in agreement with review-gate's.
      blocking: true
