name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# No workflow-level concurrency here on purpose: a caller-level group governs
# the whole run, including the job that `uses:` the reusable workflow, so
# `cancel-in-progress: true` here would kill in-flight reviews on every push
# before the callee's own per-repo group (cancel-in-progress: false) applies.
# Concurrency for agy lives in the reusable workflow.

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      # Aggregated by review-gate.yml (#1040), which evaluates Agy's verdict
      # for merge-readiness -- no longer "reviewed manually until #240"
      # (that proposal is the Tier 3 shepherd's own, separate Agy-gating gap
      # in a different repo and does not block this). blocking: true keeps
      # this reusable workflow's own signal in agreement with review-gate's.
      blocking: true
