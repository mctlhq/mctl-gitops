name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: agy-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@0ca555be1bfadf79f76f2fd56a00e91b89806ffe
    permissions:
      contents: read
      pull-requests: write
    with:
      # P1/P2 findings are merge-blocking. The reusable reviewer emits an
      # exact machine-readable verdict and fails closed on reviewer failure or
      # a malformed verdict, so the auto-merge gate can trust this check.
      blocking: true
