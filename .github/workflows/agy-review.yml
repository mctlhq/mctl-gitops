name: Agy PR review

# This caller must run from the default branch. PR-head workflows and free-form
# caller conventions are not trusted instructions for an approving reviewer.
# Activation prerequisites (dedicated App, protected environment, App-bound
# required check) are owned by the canonical shared plan:
# https://github.com/mctlhq/.github/blob/main/docs/plans/agy-formal-reviews.md
# Merge this caller only after the central bootstrap has passed live acceptance.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open non-draft PR to review again
        type: number
        required: true

# The reusable workflow owns concurrency; caller-level cancellation would kill
# reviews already in progress.
permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-formal-review.yml@0eb1c0747a6b53395dc41d501ad0912fa2a92380
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
