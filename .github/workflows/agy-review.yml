name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@0ca555be1bfadf79f76f2fd56a00e91b89806ffe
    permissions:
      contents: read
      pull-requests: write
    with:
      # Staged rollout: Agy evidence is reviewed manually until proposal #240
      # delivers exact-head markers, backfill, and repository-level gating.
      blocking: false
      conventions: |
        Focus on GitOps correctness, Kubernetes and Argo CD manifest safety,
        immutable reviewed workflow pins, proposal requirements/design/tasks
        consistency, idempotent state transitions, ownership and head-SHA
        fencing, bounded retry behavior, and tests for changed executable
        configuration. For documentation-only changes, report concrete
        contradictions or missing acceptance-contract behavior.
