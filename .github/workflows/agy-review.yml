name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: agy-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@f25ff6a4ec43ecd9f58563051835a3abe062c143
    permissions:
      contents: read
      pull-requests: write
    with:
      # Staged rollout: Agy evidence is reviewed manually until proposal #240
      # delivers exact-head markers, backfill, and repository-level gating.
      blocking: false
