name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# No workflow-level concurrency here on purpose: a caller-level group governs
# the whole run, including the job that `uses:` the reusable workflow, so
# `cancel-in-progress: true` here would kill in-flight reviews on every push
# before the callee's own per-repo group (cancel-in-progress: false) applies.
# Concurrency for agy lives in the reusable workflow.

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      # Staged rollout: Agy evidence is reviewed manually until proposal #240
      # delivers exact-head markers, backfill, and repository-level gating.
      blocking: false
