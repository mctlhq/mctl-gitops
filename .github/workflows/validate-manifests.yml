name: Validate Manifests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Also run on main itself. The openclaw version-pin check below exists
  # because of a drift (#1037) that arrives by a path with no pull request in
  # it at all: gitops-bump.yaml and release-deploy.yaml's bump job commit tag
  # bumps DIRECTLY to main under the main-protection ruleset bypass, and their
  # rewrite patterns touch only the image reference, never a mirrored
  # env.OPENCLAW_VERSION. A pull_request-only trigger therefore never sees the
  # thing it was added to catch.
  #
  # This detects rather than prevents — the commit has already landed by the
  # time it runs — so it is the complement to fixing the bump itself, tracked
  # as #1057, not a replacement for it.
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: "0.8.0"
  # Community CRD schema catalog — covers ArgoCD Application, Argo Workflows,
  # ExternalSecrets, CNPG Cluster, etc. that aren't in the core k8s schema set.
  CRD_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: validate-profile-version-bumps.py diffs the changed
          # ExecutionProfiles against the PR's base, and a depth-1 clone has
          # no base to resolve. That script FAILS rather than skips when the
          # base is missing, so a shallow clone here would turn the whole job
          # red rather than quietly checking nothing -- which is the correct
          # direction, but the fetch is what makes it actually run.
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.0
        with:
          version: "v3.16.4"

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Helm lint internal charts
        run: |
          set -euo pipefail
          for chart in platform-gitops/helm-charts/*/ platform-gitops/bootstrap platform-gitops/argocd; do
            echo "== helm lint $chart =="
            helm lint "$chart"
          done

      - name: Render and validate per-service manifests
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          fail=0
          for values in platform-gitops/services/*/*/values.yaml; do
            svc=$(dirname "$values")
            if ! helm template test platform-gitops/helm-charts/base-service -f "$values" > "$tmpdir/render.yaml"; then
              echo "::error::helm template failed for $svc"
              fail=1
              continue
            fi
            if ! kubeconform -strict -summary -schema-location default \
                -schema-location "$CRD_SCHEMA_LOCATION" \
                "$tmpdir/render.yaml"; then
              echo "::error::manifest validation failed for $svc"
              fail=1
            fi
          done
          exit $fail

      - name: Render and validate bootstrap and argocd charts
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          helm template test platform-gitops/bootstrap -f platform-gitops/bootstrap/values.yaml > "$tmpdir/bootstrap.yaml"
          helm template test platform-gitops/argocd -f platform-gitops/argocd/values.yaml > "$tmpdir/argocd.yaml"
          kubeconform -strict -summary -schema-location default \
            -schema-location "$CRD_SCHEMA_LOCATION" \
            "$tmpdir/bootstrap.yaml" "$tmpdir/argocd.yaml"
          # A platform NetworkPolicy placed in a tenant namespace must also be
          # on mctl-tenant-networkpolicy-allowlist, or the API server rejects
          # it at sync while every check above stays green (gitops#1484).
          # --selftest first: a detector never seen to fire is not known to work.
          python3 -m pip install --quiet pyyaml
          scripts/validate-tenant-networkpolicy-allowlist.py --selftest "$tmpdir/bootstrap.yaml"

      # issue-903: otelCollector.eval.enabled is false by default, so this
      # overlay is the only place the eval-namespace/eval-candidates
      # templates and a multi-backend fan-out ever render in CI. Proves the
      # manifests mctlhq/mctl-gitops#1280 will flip on are schema-valid
      # before that PR exists, not after.
      - name: Render and validate the otel-collector eval overlay (issue-903)
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          helm template test platform-gitops/bootstrap \
            -f platform-gitops/bootstrap/values.yaml \
            -f tests/fixtures/otel-eval-candidates.example-values.yaml \
            > "$tmpdir/bootstrap-eval.yaml"
          kubeconform -strict -summary -schema-location default \
            -schema-location "$CRD_SCHEMA_LOCATION" \
            "$tmpdir/bootstrap-eval.yaml"

      # .github#50: both flag states are rendered explicitly with --set, so
      # the assertion does not depend on the committed default (enabled
      # since the owner-approved rollout). On: the usage-writer ExternalSecret
      # and the chart value appear and are schema-valid. Off: neither does.
      - name: Render and validate the usage-writer overlay (.github#50)
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          helm template test platform-gitops/bootstrap \
            -f platform-gitops/bootstrap/values.yaml \
            --set usageWriter.enabled=false > "$tmpdir/off.yaml"
          helm template test platform-gitops/bootstrap \
            -f platform-gitops/bootstrap/values.yaml \
            --set usageWriter.enabled=true > "$tmpdir/on.yaml"
          kubeconform -strict -summary -schema-location default \
            -schema-location "$CRD_SCHEMA_LOCATION" "$tmpdir/on.yaml"
          for marker in 'name: mctl-api-usage-writer' 'usageWriterTokenSecret: mctl-api-usage-writer' 'property: usage-writer-token'; do
            grep -qF "$marker" "$tmpdir/on.yaml" || { echo "::error::flag on: missing '$marker'"; exit 1; }
            if grep -qF "$marker" "$tmpdir/off.yaml"; then echo "::error::flag off: '$marker' rendered"; exit 1; fi
          done

      # mctlhq/mctl-gitops#1405: same both-states shape as the usage-writer
      # overlay above. On: the mctl-api-surface-telegram ExternalSecret and
      # the chart value appear and are schema-valid. Off: neither does.
      - name: Render and validate the surface-telegram overlay (issue-1405)
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          helm template test platform-gitops/bootstrap \
            -f platform-gitops/bootstrap/values.yaml \
            --set surfaceTelegramToken.enabled=false > "$tmpdir/off.yaml"
          helm template test platform-gitops/bootstrap \
            -f platform-gitops/bootstrap/values.yaml \
            --set surfaceTelegramToken.enabled=true > "$tmpdir/on.yaml"
          kubeconform -strict -summary -schema-location default \
            -schema-location "$CRD_SCHEMA_LOCATION" "$tmpdir/on.yaml"
          for marker in 'name: mctl-api-surface-telegram' 'surfaceTelegramTokenSecret: mctl-api-surface-telegram' 'property: telegram-token'; do
            grep -qF "$marker" "$tmpdir/on.yaml" || { echo "::error::flag on: missing '$marker'"; exit 1; }
            if grep -qF "$marker" "$tmpdir/off.yaml"; then echo "::error::flag off: '$marker' rendered"; exit 1; fi
          done

      # mctlhq/mctl-portal#126: same both-states shape. On: both
      # surface-portal ExternalSecrets, the mctl-api chart value and the
      # backstage env appear and are schema-valid. Off: none does.
      - name: Render and validate the surface-portal overlay (portal#126)
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          helm template test platform-gitops/bootstrap \
            -f platform-gitops/bootstrap/values.yaml \
            --set surfacePortalToken.enabled=false > "$tmpdir/off.yaml"
          helm template test platform-gitops/bootstrap \
            -f platform-gitops/bootstrap/values.yaml \
            --set surfacePortalToken.enabled=true > "$tmpdir/on.yaml"
          kubeconform -strict -summary -schema-location default \
            -schema-location "$CRD_SCHEMA_LOCATION" "$tmpdir/on.yaml"
          for marker in 'name: mctl-api-surface-portal' 'name: backstage-surface-portal' 'surfacePortalTokenSecret: mctl-api-surface-portal' 'property: portal-token' 'name: MCTL_SURFACE_PORTAL_TOKEN' 'surfaceToken: ${MCTL_SURFACE_PORTAL_TOKEN}'; do
            grep -qF "$marker" "$tmpdir/on.yaml" || { echo "::error::flag on: missing '$marker'"; exit 1; }
            if grep -qF "$marker" "$tmpdir/off.yaml"; then echo "::error::flag off: '$marker' rendered"; exit 1; fi
          done

      # issue-1409: the usage pricing ConfigMap renders unconditionally (no
      # flag, unlike the two overlays above) since it is inert until a
      # companion mctl-api chart change (cross-repo, tracked separately)
      # wires a mount to it. This validates the committed rate card itself
      # (mirroring usage.NewCatalog's own checks, mctlhq/mctl-api) and that
      # the rendered ConfigMap's catalog.json is byte-identical to it.
      - name: Validate the usage pricing catalog (issue-1409)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate-usage-pricing-catalog.py --selftest
          python3 scripts/validate-usage-pricing-catalog.py

      - name: Validate platform skill registry
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/validate-platform-skills.py
          # Fails when a hand edit to catalog/bindings leaves a tenant's
          # generated/platform-skills-values.yaml stale or orphaned. Lives in
          # this PR (not the plumbing one) so the gate never precedes the
          # workflows that keep the generated files in sync.
          scripts/materialize-openclaw-platform-skills.py --check

      - name: Validate agent platform catalog
        run: |
          python3 -m pip install --quiet pyyaml jsonschema
          # --selftest also replays scripts/tests/fixtures/agent-platform/
          # {valid,invalid} so a change that silently weakens a check (e.g.
          # a reference no longer failing closed) fails CI even though the
          # real platform-gitops/agent-platform/ catalog itself is fine.
          scripts/validate-agent-platform.py --selftest

      - name: Check every changed ExecutionProfile bumped its version
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          # --selftest first, same reason as the interpolation check below: a
          # detector that has never been seen to fire is not known to work. It
          # builds a throwaway repository and asserts all four branches --
          # unbumped edit fires, bumped edit does not, a new profile does not,
          # and an unresolvable base RAISES instead of passing.
          scripts/validate-profile-version-bumps.py --selftest
          scripts/validate-profile-version-bumps.py

      - name: Check openclaw image.tag and OPENCLAW_VERSION stay in sync
        run: |
          set -euo pipefail
          # --selftest first, same reason as the other detectors in this job:
          # a checker that has never been seen to fire is not known to work.
          # gitops#1037: admins/labs had image.tag bumped without the paired
          # OPENCLAW_VERSION env update, per the "Image bump recipe" in
          # k8s.md ("both must stay in sync on every bump").
          scripts/validate-openclaw-version-pin.py --selftest
          scripts/validate-openclaw-version-pin.py

      - name: Check the implementation admission worker stays a single replica
        run: |
          set -euo pipefail
          # --selftest first, as for every detector in this job. The
          # invariant (mctl-agents#395, #1285): max_concurrent_activities is
          # a per-process limit, so capacity on mctl-dev-loop-implement is
          # replicas × N. One replica is what makes N mean N; this fails the
          # PR that scales it instead of raising N.
          scripts/validate-implement-worker-singleton.py --selftest
          scripts/validate-implement-worker-singleton.py

      - name: Validate Argo local workdir invariants
        run: scripts/validate-local-workdir.py

      - name: Validate agent pod security context
        run: |
          set -euo pipefail
          scripts/validate-agent-pod-security.py --selftest
          scripts/validate-agent-pod-security.py

      # A proposal committed as `accepted` while demanding an approval it does
      # not carry is unrunnable by every supported path, and nothing fails on
      # it: the approve operation and the implementer both exit 0. One sat in
      # agents-state for five weeks (mctl-agents#349). mctl-agents#358 guards
      # its own writers; only a gate here can refuse YAML committed straight
      # into this repo. --selftest first, same reason as the other detectors:
      # a guard never seen to fail is not known to work.
      - name: Validate agents-state approval records
        run: |
          set -euo pipefail
          scripts/validate-agents-state-approval.py --selftest
          scripts/validate-agents-state-approval.py

      - name: Check for shell interpolation of workflow parameters
        run: |
          set -euo pipefail
          # --selftest first: a checker that has never been seen to fail is
          # not known to work. It builds a template that interpolates a
          # parameter and asserts the detector fires on it.
          scripts/validate-shell-param-interpolation.py --selftest
          scripts/validate-shell-param-interpolation.py

      - name: Check for shell interpolation of yq expressions
        run: |
          set -euo pipefail
          # Sibling invariant to the check above: yq's expression language is
          # not data either, so a value that closes the string literal keeps
          # running against values.yaml with the pipeline's write access
          # (gitops#990, #995, #997). --selftest first, same reason.
          scripts/validate-yq-interpolation.py --selftest
          scripts/validate-yq-interpolation.py

      - name: Tenant workflow templates only write tenant-scoped paths
        run: |
          set -euo pipefail
          # A tenant workflow template that writes a shared file breaks the
          # "concurrent tenant ops touch disjoint git paths" guarantee and
          # reintroduces the merge-conflict-then-set-e-abort failure mode
          # that orphaned Vault policies on 2026-09-27 (gitops#1431).
          # --selftest first, same reason as the detectors above.
          scripts/validate-tenant-workflow-shared-writes.py --selftest
          scripts/validate-tenant-workflow-shared-writes.py

      - name: ArgoCD tenant RBAC fragments match the canonical policy
        run: |
          set -euo pipefail
          # Machine-checks the SOC F4 "no tenant exec" control instead of
          # relying on a values.yaml comment: a hand-edited fragment that
          # widens a glob or adds a verb now fails CI (gitops#1431).
          scripts/validate-argocd-tenant-rbac.py --selftest
          scripts/validate-argocd-tenant-rbac.py

      - name: Origin mTLS is still enforced
        run: |
          set -euo pipefail
          # Traefik refuses any TLS handshake without this account's Cloudflare
          # client certificate, which is what closes the "another Cloudflare
          # customer" gap in infrastructure/cloudflare/README.md (#1153). The
          # whole enforcement is two objects; delete either and the origin goes
          # back to accepting any Cloudflare address with nothing failing, no
          # probe going red and no line in any log. Exactly the shape of the
          # VMPodScrape that sat unnoticed in vm-rules/ for three months
          # (#1159). --selftest first, same reason as the detectors above.
          scripts/validate-origin-mtls.py --selftest
          scripts/validate-origin-mtls.py

      - name: Install promtool
        env:
          PROMETHEUS_VERSION: "3.5.0"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo mv promtool /usr/local/bin/

      # Syntax AND semantics. kubeconform above only sees a VMRule as a valid
      # CRD instance; the expressions inside are an opaque string to it.
      # HighToolErrorRate shipped a division that matched on `status` and so
      # evaluated errors/errors = 1, firing most mornings on a healthy
      # service, and no gate in this repo had anything to say about it for
      # months. The unit tests are the part that closes that.
      - name: Check and unit-test alerting rules
        # --selftest first, same reason as the other detectors in this job: the
        # kind guard added with #1159 refuses a non-VMRule object under
        # vm-rules/, and a guard never seen to fail is not known to work. It
        # runs the script against a throwaway fixture directory, so it asserts
        # on the real code path rather than a copy of it.
        run: |
          set -euo pipefail
          scripts/check-vm-rules.sh --selftest
          scripts/check-vm-rules.sh

      - name: Validate raw manifests (tenants, argo-workflows, mcp, infra-components)
        run: |
          set -euo pipefail
          # Excludes:
          #  - values.yaml (Helm values, not a k8s manifest)
          #  - catalog-info.yaml (Backstage entity, no k8s schema)
          #  - *_test.yaml: promtool rule unit tests, not k8s manifests
          #    (run by scripts/check-vm-rules.sh above)
          #  - vm-rules/tests/generated/: build output of check-vm-rules.sh
          #    (extracted rule-group docs, no `kind`). The script now cleans
          #    up after itself; this pattern is the belt-and-braces guard.
          #  - cwft-mctl-agents-{shepherd,implement,issue-poll}.yaml: intentionally set
          #    .spec.outputs on a ClusterWorkflowTemplate (see in-file comments) to
          #    satisfy Argo's static validator; the community CRD schema catalog
          #    doesn't recognize this field yet and flags it as an unknown property,
          #    even though it's required for the CronWorkflow to schedule.
          find platform-gitops/tenants platform-gitops/argo-workflows platform-gitops/mcp platform-gitops/infra-components \
            \( -name "*.yaml" -o -name "*.yml" \) -print0 | \
            xargs -0 kubeconform -strict -summary -schema-location default \
              -ignore-filename-pattern '(^|.*/)(values\.yaml|catalog-info\.yaml|cwft-mctl-agents-(shepherd|implement|issue-poll)\.yaml|.*_test\.yaml)$' \
              -ignore-filename-pattern '.*/vm-rules/tests/generated/.*' \
              -schema-location "$CRD_SCHEMA_LOCATION"

      - name: Unit-test the investigate CWFT's optional work-context argv
        # The omit-both argv is a cross-repo compatibility contract, not a
        # style preference: mctl_trigger_issue, a hand-submitted Workflow,
        # and the DevLoopWorkflow all submit without work_item_id or
        # execution_id today, and the command line they get must stay
        # byte-identical to what run-investigator built before these two
        # optional parameters existed (gitops#1279). Also proves the `set --`
        # construction resists a value carrying shell metacharacters.
        run: python3 tests/test_cwft_investigate_work_context_argv.py

      - name: Unit-test the implement/shepherd CWFTs' optional work-context env
        # gitops#1408, mirroring gitops#1279 above onto cwft-mctl-agents-implement.yaml
        # and cwft-mctl-agents-shepherd.yaml. The implement/shepherd argv is a
        # cross-repo compatibility contract for the cron sweep,
        # mctl_trigger_implementer and the shepherd cron: run_implementer.py and
        # run_shepherd.py have no --work-item-id-style flags, so the five
        # correlation values travel through env only, and env-only is what
        # keeps a hostile identifier out of a root pod holding the gitops
        # deploy key.
        run: python3 tests/test_cwft_implement_shepherd_work_context_env.py

      - name: Unit-test the k3s-preview apply guard
        # terraform.yml refuses a cluster plan that destroys infrastructure or
        # re-runs node provisioners (#1534). It only meets a real plan during
        # an apply of the preprod cluster, where a miss is a restarted control
        # plane, so it is exercised here against synthetic plans.
        run: python3 tests/test_k3s_plan_guard.py

      - name: Check the in-cluster Access login probe against its sources
        # The CronJob in infra-components/observability/blackbox carries two
        # copies it cannot read at run time: scripts/access-login-probe.py as
        # a ConfigMap, and the ZITADEL client id from
        # infrastructure/cloudflare/account/zitadel-idp.tf as an argument. A
        # drifted copy would probe for a client that no longer exists, or run
        # an old script, and stay green doing it (#1329).
        run: |
          python3 scripts/access-login-probe.py --selftest
          python3 tests/test_access_login_probe_cronjob.py

      - name: Unit-test the release-deploy bump script
        # The image-tag rewriter is a heredoc inside release-deploy.yaml, so
        # it only ever runs during a real release — a bug in it is found by
        # a broken deploy. This extracts it and exercises it against
        # fixtures, in particular that EVERY explicitly named values_path
        # must match: a component deployed as two workloads (ADR-008's
        # control/execution workers) is exactly where a silent miss pins one
        # of them forever.
        run: python3 tests/test_release_deploy_bump.py

      - name: Unit-test the App-token scope validation
        # rotate-github-app-tokens narrows mctl-api's installation token to one
        # repository and two permissions, then checks GitHub's response against
        # what it asked for. That check is the only thing standing between a
        # narrowing that silently did not apply and a token carrying the
        # installation's full write grant across every repository — which
        # works, and logs identically. It runs every 30 minutes in a workflow
        # nobody watches, so it is tested here instead.
        run: python3 tests/test_rotate_github_token_scope.py

      - name: Unit-test tpl-git-commit's yq handling
        # The static check above proves no yq expression interpolates a shell
        # variable. This proves the shape that replaced it actually resists
        # the payloads — a key that closes the expression PATH, and a value
        # that closes the string literal — by running the template's own
        # extracted loop against a fixture with real yq.
        run: python3 tests/test_tpl_git_commit_yq.py

      - name: Unit-test create-tenant's existing-tenant checks
        # create-tenant creates a tenant: an existing one fails validate unless
        # reprovision=true, and the commit step refuses one that appeared
        # after validate. Runs the template's own extracted blocks against a
        # fixture checkout, with git clone stubbed.
        run: python3 tests/test_wft_create_tenant_existing.py

      - name: Unit-test the shepherd's commit-and-push staging
        # commit-and-push is the only step that writes agents-state back to
        # git, and it stages through `git add` pathspecs. A pathspec that
        # matches nothing exits 128, so under `set -e` a mis-chosen pathspec
        # does not skip one file — it loses the whole durable write. That has
        # now happened twice in this script (the `:(literal)` P1 on
        # gitops#1046, then a staged deletion still being handed to `git add`,
        # gitops#1295), and both reproduce against real git in a scratch repo,
        # so the block's own text is replayed here.
        run: python3 tests/test_cwft_shepherd_commit_pathspecs.py

      - name: Unit-test the portal OAuth registration drift detector
        # The MCP server's `auth_credentials` is write-only: the API accepts it
        # and never returns it, so OpenTofu keeps what was last applied in
        # state and a refresh cannot correct it -- measured against a throwaway
        # server, an out-of-band change left `tofu plan` at `no-op`. That one
        # attribute is therefore checked by a script instead, and this is its
        # selftest: a detector never seen to fire is not known to work.
        run: scripts/portal-auth-credentials-drift.py --selftest

      - name: Unit-test the portal tool catalogue drift detector
        # Its sibling above. The portal never refreshes a manual-OAuth server's
        # tool snapshot, so a tool added upstream stays invisible and a changed
        # output schema is validated by clients against the stale copy. Same
        # reason for running it here rather than only nightly: a refactor that
        # breaks compare() or the waiver table would merge green, and the first
        # anyone heard of it would be a nightly run reporting that the detector
        # could not run — with the catalogue unchecked meanwhile.
        run: scripts/portal-catalogue-drift.py --selftest

      - name: Validate the vendored MCP portal allowlists
        # mctlhq/mctl-gitops#1370 PR A: each owning repo's docs/portal-allowlist.json
        # is pinned here byte-identical as allowlists/<server>.json, so the
        # decision "this tool is safe to expose" still lands in the same diff
        # as the tool, one repository away. This checks the vendored copies'
        # shape, that allowlists/*.json, mapping.json and sources.json all
        # agree on which servers are vendored, that every mapped server has a
        # literal resource block in mcp-servers.tf (or is on the commented
        # UNMANAGED list), and that no vendored file's own tool count exceeds
        # allowlists/baseline.json -- a widening bump fails here until a
        # human edits baseline.json in the same PR. It does not, and cannot,
        # compare against the live Cloudflare catalogue: CI holds no
        # credential for this root (#1111), same reason as its siblings
        # above.
        run: |
          scripts/validate-portal-allowlists.py --selftest
          scripts/validate-portal-allowlists.py

      - name: Unit-test wft-provision-database's values.yaml patch
        # The provisioner commits straight to main, so no PR check sees the
        # file it writes, and `helm template` above accepts duplicate keys
        # silently. This runs the template's own extracted block against a
        # values file that already declares envFrom — the shape that lost
        # every application secret in gitops#1102.
        run: python3 tests/test_wft_provision_database_values.py

      - name: Unit-test base-service's OTEL env on both workload kinds
        # The chart renders a Deployment OR a Rollout, never both, so an env
        # block added to one template is invisible in the other's output and
        # fails silently — which is how the OTEL opt-in first shipped working
        # only for non-blueGreen services. This renders both from the same
        # values and compares them, and covers a service with no `env:` key.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_base_service_otel_env.py

      - name: Unit-test base-service's work-context env on both workload kinds
        # mctlhq/mctl-gitops#1405, same defect class as the OTEL test above:
        # gate off must change nothing, gate on must render the ExternalSecret
        # and all 4 env vars identically on Deployment and Rollout, a
        # service's own env/envValueFrom must win, and an empty
        # tokenVaultKey/tokenVaultProperty must fail the render loudly.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_base_service_work_context_env.py

      - name: Check the otel-collector alert lookbacks against their holds
        # `increase(...[W]) > 0` with W longer than `for: H` pages for a spike
        # that is already over: the expression stays true for the whole window,
        # so the hold is passed on the way through. promtool proves it for
        # today's two rules; this states the invariant for any rule added next.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_otel_collector_alert_windows.py

      - name: Unit-test the otel-collector backends/eval render (issue-903)
        # T1/T2/T5: the default render must stay byte-identical to the
        # committed golden file, the fan-out must render N independent
        # otlp/<name> exporters plus the legacy scalar, and the gated eval
        # manifests must render nothing by default and a correct
        # Namespace/NetworkPolicy/Application set under the example overlay.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_otel_collector_backends_render.py

      - name: Unit-test the ArgoCD tenant RBAC render (gitops#1431)
        # The per-tenant rbac/tenants/*.csv fragments plus the base policy
        # must render the same effective policy.csv as the pre-migration
        # single-file version, minus the two intentionally dropped orphan
        # tenants (yyy, xxxx); create: false must hold so the argo-cd
        # subchart never also tries to own argocd-rbac-cm.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_argocd_rbac_policy_render.py

      - name: Forgejo reconcile keeps user e-mail and name out of the plan log
        # svalabs/forgejo marks only forgejo_user.password sensitive; without
        # sensitive() in main.tf every user created or changed prints its
        # address and name in the Job log and in Loki.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_forgejo_reconcile_pii.py

      - name: Unit-test the DevLoop trace fixtures (issue-903)
        # T3/T4: the representative fixture has one root span per execution,
        # no orphaned parentSpanId, every correlation attribute, and at least
        # one ERROR-status outcome; the poisoned fixture's four attributes are
        # each matched by a pattern actually present in the committed
        # redaction config, so the fixture and the block lists cannot
        # silently drift apart.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_devloop_trace_fixture.py

      - name: Check the ADR rubric stays frozen and Stage A honest (issue-903)
        # T6/T7: weights sum to 100 and agree with the ADR's Markdown table,
        # every score cell is null before any candidate is deployed, and no
        # Stage A row whose evidence is only the issue text is promoted to
        # SURVIVES on a load-bearing deployment claim.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_adr_rubric_frozen.py

      - name: Check the otel-trace-fixture ConfigMap is up to date (issue-903)
        # --selftest first, same reason as the other detectors in this job: a
        # drift detector that has never been seen to fire is not known to
        # work. tests/fixtures/devloop-trace*.json is the source of truth;
        # this catches a hand edit to either file that left the in-cluster
        # ConfigMap copy stale.
        run: |
          scripts/materialize-otel-trace-fixture.py --selftest
          scripts/materialize-otel-trace-fixture.py --check

      - name: Check the observability-eval sandbox teardown date (issue-1355)
        # --selftest first, same reason as every other detector in this job:
        # a checker never seen to fire is not known to work. Proves all five
        # branches (disabled+empty passes; enabled+within-14d passes;
        # enabled+empty/expired/beyond-14d all fail), then runs for real
        # against the committed platform-gitops/bootstrap/values.yaml. Also
        # runs on push: [main] (this workflow's own trigger, see the header
        # comment above), so an expired sandbox turns main red even with no
        # open PR -- a two-week spike namespace must not become silently
        # permanent.
        run: |
          scripts/validate-eval-teardown-date.py --selftest
          scripts/validate-eval-teardown-date.py

      - name: Unit-test the otel-collector redaction processor (issue-1355, #1332)
        # Key classification against the committed ignored_key_patterns and
        # blocked_key_patterns: credential-shaped keys (including ones inside
        # the gen_ai.usage namespace the ignore list opens) are masked, the
        # GenAI usage counters and cost-shaped keys survive.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_otel_collector_redaction.py

      - name: Run the redaction processor in the real collector (#1332)
        # The key test above cannot see #1332's actual defect: a masked
        # integer counter arrives as the string "****". This runs the pinned
        # otelcol-contrib image with the rendered redaction/resource
        # processors and checks the exported values and types. The
        # --without-ignore run puts #1332 back and must fail first, so the
        # detector is seen to fire on every run, not only once in review.
        run: |
          python3 -m pip install --quiet pyyaml
          if python3 tests/test_otel_collector_redaction_e2e.py --without-ignore; then
            echo "::error::redaction e2e passed with ignored_key_patterns removed -- the detector does not detect #1332"
            exit 1
          fi
          python3 tests/test_otel_collector_redaction_e2e.py

      - name: Validate storage & finops Grafana dashboards
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_storage_finops_dashboard.py

  # mctl-reserved-platform-hosts-{ingress,ingressroute} (#1503) are CEL that
  # only an API server can evaluate: a policy that never denies, or one that
  # denies every Ingress, renders and lints clean. This runs them in k3s at the
  # cluster's version against deny/admit fixtures and every Ingress /
  # IngressRoute the GitOps services render, so a service that claims another
  # namespace's reserved host fails here instead of at sync. Its own job: it
  # needs Docker and takes about a minute. The second step proves the
  # external-manifests Secret allowlist policy the same way.
  reserved-hosts:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.0
        with:
          version: "v3.16.4"

      # The k3s image is pulled with retries (scripts/lib/docker-pull-retry.sh);
      # this proves the retry helper itself, with a stubbed docker, before the
      # k3s scripts rely on it.
      - name: Prove the Docker pull retry helper
        run: scripts/test-docker-pull-retry.sh

      - name: Prove the reserved-host admission policies
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          scripts/test-reserved-hosts-policy.sh --services --platform

      # Same toolchain, its own k3s: the Secret allowlist for namespaces whose
      # manifests come from outside the platform (externalManifestNamespaces).
      - name: Prove the external-manifests Secret allowlist policy
        run: |
          set -euo pipefail
          scripts/test-secret-allowlist-policy.sh

  # The declarative ZITADEL root (#1520). The in-cluster Job applies it after
  # merge, so formatting, provider schema errors and a lock file that does not
  # match the pinned provider must fail here instead.
  zitadel-iac:
    name: zitadel-iac root
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.0
        with:
          version: "v3.16.4"

      - name: fmt, init (lock file read-only), validate
        working-directory: platform-gitops/helm-charts/zitadel-iac/iac
        run: |
          set -euo pipefail
          tofu fmt -check -diff
          tofu init -backend=false -lockfile=readonly -input=false
          tofu validate

      - name: tofu test (mocked providers)
        working-directory: platform-gitops/helm-charts/zitadel-iac/iac
        run: tofu test -no-color

      # login_texts.json must override every Login V2 text that names
      # Zitadel in the release the zitadel chart pin deploys; a ZITADEL bump
      # that adds one fails here instead of shipping it.
      - name: Login V2 texts cover the pinned release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/check-zitadel-login-texts.py --selftest
          python3 scripts/check-zitadel-login-texts.py

      - name: Render the chart and validate the manifests
        env:
          KUBECONFORM_VERSION: "0.8.0"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          # Without a digest the chart must refuse to render. The chart's own
          # values.yaml always loads, so the digest is unset explicitly.
          if helm template t platform-gitops/helm-charts/zitadel-iac --set image.digest=null >/dev/null 2>&1; then
            echo "::error::zitadel-iac rendered without image.digest"; exit 1
          fi
          helm template t platform-gitops/helm-charts/zitadel-iac -f platform-gitops/helm-charts/zitadel-iac/values.yaml > rendered.yaml
          ./kubeconform -strict -summary -schema-location default rendered.yaml
          # The Job reads every file of the root from the inputs ConfigMap; a
          # glob that stops matching drops a file without any render error.
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          iac = pathlib.Path("platform-gitops/helm-charts/zitadel-iac/iac")
          want = {p.name for p in iac.iterdir() if p.suffix in (".tf", ".svg", ".json")}
          want.add("terraform.lock.hcl")
          cm = next(d for d in yaml.safe_load_all(open("rendered.yaml"))
                    if d and d["kind"] == "ConfigMap" and d["metadata"]["name"] == "zitadel-iac-inputs")
          missing = sorted(want - set(cm["data"]))
          if missing:
              sys.exit(f"zitadel-iac-inputs is missing {missing}")
          print(f"zitadel-iac-inputs carries all {len(want)} root files")
          PY

  # The Forgejo reconciler's scoped-team rule, evaluated by OpenTofu itself
  # (main.tf lives in a ConfigMap, so no root here runs `tofu validate` on it).
  # A packages-only team may name no repository; every other team must name
  # repositories of its own org.
  forgejo-reconcile-teams:
    name: forgejo reconcile team rule
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false

      - name: Scoped teams accept packages-only, refuse everything else without repos
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_forgejo_reconcile_teams.py

  # The declarative Vault human sign-in root. Like zitadel-iac, the in-cluster
  # Job applies it after merge, so formatting, provider schema errors and a
  # lock file that does not match the pinned provider must fail here.
  vault-human-auth-iac:
    name: vault-human-auth-iac root
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.0
        with:
          version: "v3.16.4"

      - name: fmt, init (lock file read-only), validate
        working-directory: platform-gitops/helm-charts/vault-human-auth-iac/iac
        run: |
          set -euo pipefail
          tofu fmt -check -diff
          tofu init -backend=false -lockfile=readonly -input=false
          tofu validate

      - name: Render the chart and validate the manifests
        env:
          KUBECONFORM_VERSION: "0.8.0"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          if helm template t platform-gitops/helm-charts/vault-human-auth-iac --set image.digest=null >/dev/null 2>&1; then
            echo "::error::vault-human-auth-iac rendered without image.digest"; exit 1
          fi
          helm template t platform-gitops/helm-charts/vault-human-auth-iac -f platform-gitops/helm-charts/vault-human-auth-iac/values.yaml \
            | ./kubeconform -strict -summary -schema-location default

  # The declarative Grafana root (#1601). Like the other IaC roots, the
  # in-cluster Job applies it after merge, so formatting, provider schema
  # errors and a lock file that does not match the pinned provider must fail
