            | tar xz kubeconform
          if helm template t platform-gitops/helm-charts/grafana-iac --set image.digest=null >/dev/null 2>&1; then
            echo "::error::grafana-iac rendered without image.digest"; exit 1
          fi
          helm template t platform-gitops/helm-charts/grafana-iac -f platform-gitops/helm-charts/grafana-iac/values.yaml > rendered.yaml
          ./kubeconform -strict -summary -schema-location default rendered.yaml
          # The Job reads every file of the root from the inputs ConfigMap; a
          # glob that stops matching drops a file without any render error.
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          iac = pathlib.Path("platform-gitops/helm-charts/grafana-iac/iac")
          want = {p.name for p in iac.iterdir() if p.suffix == ".tf"}
          want.add("terraform.lock.hcl")
          cm = next(d for d in yaml.safe_load_all(open("rendered.yaml"))
                    if d and d["kind"] == "ConfigMap" and d["metadata"]["name"] == "grafana-iac-inputs")
          missing = sorted(want - set(cm["data"]))
