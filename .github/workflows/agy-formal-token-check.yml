name: Agy formal dispatch token check

# AGY_FORMAL_DISPATCH_TOKEN is a fine-grained PAT with an expiry. When it
# stops working, agy-formal-queue.yml cannot dispatch, agy-formal-review never
# reports on queued commits, and every merge queue entry times out. Nothing
# unreviewed merges, but nothing merges at all. This check fails, and tells
# Telegram, while there is still time to regenerate the token:
#   GitHub -> Settings -> Fine-grained tokens -> agy-formal-dispatch-gitops
#   -> Regenerate token, then
#   gh secret set AGY_FORMAL_DISPATCH_TOKEN --repo mctlhq/mctl-gitops
#
# It also runs on a pull request that changes this file, which proves the
# secret works before the queue depends on it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/agy-formal-token-check.yml

permissions: {}

jobs:
  check:
    name: dispatch token works and is not about to expire
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the token's access and expiry
        id: check
        env:
          TOKEN: ${{ secrets.AGY_FORMAL_DISPATCH_TOKEN }}
          MIN_DAYS: '14'
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::AGY_FORMAL_DISPATCH_TOKEN is empty or not set"
            exit 1
          fi
          # mctlhq/.github is public, so this read succeeds anonymously: a 200
          # proves the token is valid (an expired or revoked one gets 401), not
          # that it may dispatch. The scope is proven by the queue's first run.
          code=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/mctlhq/.github/actions/workflows/agy-formal-dispatch.yml)
          if [ "$code" != 200 ]; then
            echo "::error::GitHub refused the token (HTTP $code): expired, revoked or malformed"
            exit 1
          fi
          # A missing header is not "never expires": fine-grained tokens
          # always have one, so its absence means we could not tell.
          exp=$(tr -d '\r' < headers.txt | sed -n 's/^github-authentication-token-expiration: //Ip' | head -n1)
          if [ -z "$exp" ]; then
            echo "::error::GitHub returned no token expiration header; cannot tell when the token expires"
            exit 1
          fi
          exp_epoch=$(date -u -d "$exp" +%s)
          days=$(( (exp_epoch - $(date -u +%s)) / 86400 ))
          echo "token expires $exp ($days days left)"
          echo "expires=$exp" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          if [ "$days" -lt "$MIN_DAYS" ]; then
            echo "::error::AGY_FORMAL_DISPATCH_TOKEN expires in $days days ($exp); regenerate it"
            exit 1
          fi

      - name: Notify Telegram
        if: failure() && github.event_name == 'schedule'
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master 2026-05
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            🔑 <b>AGY_FORMAL_DISPATCH_TOKEN needs attention</b>
            Expires: ${{ steps.check.outputs.expires || 'unknown' }} (${{ steps.check.outputs.days || '?' }} days left)
            Without it the gitops merge queue cannot get agy-formal-review and merges stop.
            Regenerate agy-formal-dispatch-gitops, then gh secret set AGY_FORMAL_DISPATCH_TOKEN --repo mctlhq/mctl-gitops
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
