name: Release & Deploy
run-name: "release-deploy ${{ inputs.team_name }}/${{ inputs.component_name }} ${{ inputs.image_tag }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo (e.g. mctlhq/mctl-docs)"
        required: true
        type: string
      git_ref:
        description: "Git ref to build (typically the new release tag)"
        required: true
        type: string
      image_name:
        description: "Full image name (e.g. ghcr.io/mctlhq/mctl-docs)"
        required: true
        type: string
      image_tag:
        description: "Image tag (typically the version, e.g. 0.1.18)"
        required: true
        type: string
      dockerfile_path:
        description: "Path to Dockerfile in source repo"
        required: false
        default: "Dockerfile"
        type: string
      team_name:
        description: "Team owning the service (matches platform-gitops/services/<team>/)"
        required: true
        type: string
      component_name:
        description: "Service name (matches the directory under platform-gitops/services/<team>/)"
        required: true
        type: string
      values_path:
        description: "Override gitops values file path (default: platform-gitops/services/<team>/<component>/values.yaml). Use for platform bootstrap services. May be combined with values_glob to bump both in one run. Accepts several paths separated by commas or newlines - each one must match, so a component deployed as more than one workload (e.g. a worker split across two roles) cannot have one of them silently left behind."
        required: false
        type: string
      values_glob:
        description: "Glob pattern for multiple files (e.g. platform-gitops/argo-workflows/cluster-templates/cwft-mctl-agents-*.yaml). Use when a component's image tag is inline across several manifests instead of one values.yaml. May be combined with values_path."
        required: false
        type: string

jobs:
  # Fail fast, before anything is built or pushed: every dispatch input is
  # shape-checked here with no checkout, no secrets and no permissions. The
  # bump script and build-image keep their own checks as a second layer.
  validate-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate dispatch inputs
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          INPUT_TEAM_NAME: ${{ inputs.team_name }}
          INPUT_COMPONENT_NAME: ${{ inputs.component_name }}
          INPUT_VALUES_PATH: ${{ inputs.values_path }}
          INPUT_VALUES_GLOB: ${{ inputs.values_glob }}
        run: |
          set -euo pipefail
          fail() { echo "::error::invalid $1"; exit 1; }
          nl=$'\n'
          for name in REPO GIT_REF IMAGE_NAME IMAGE_TAG DOCKERFILE_PATH TEAM_NAME COMPONENT_NAME VALUES_GLOB; do
            v="INPUT_${name}"
            [[ "${!v}" != *"$nl"* && "${!v}" != *$'\r'* ]] || fail "$name: contains a newline"
          done
          label='^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          [[ "$INPUT_TEAM_NAME" =~ $label ]] || fail "team_name"
          [[ "$INPUT_COMPONENT_NAME" =~ $label ]] || fail "component_name"
          [[ "$INPUT_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "repo"
          [[ "$INPUT_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || fail "image_tag"
          [[ "$INPUT_IMAGE_NAME" =~ ^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+$ ]] || fail "image_name"
          [[ "$INPUT_GIT_REF" =~ ^[A-Za-z0-9._/+-]{1,255}$ && "$INPUT_GIT_REF" != -* ]] || fail "git_ref"
          [[ "$INPUT_DOCKERFILE_PATH" =~ ^[A-Za-z0-9._/-]+$ && "$INPUT_DOCKERFILE_PATH" != /* \
            && "/$INPUT_DOCKERFILE_PATH/" != *"/../"* ]] || fail "dockerfile_path"

          # Mirrors ALLOWED_PREFIXES in the "Bump image tag(s)" script below;
          # tests/test_release_deploy_validate_inputs.py asserts they match.
          ALLOWED_PREFIXES=(
            "platform-gitops/services/"
            "platform-gitops/argo-workflows/cluster-templates/"
            "platform-gitops/bootstrap/templates/mctl-platform/"
          )
          check_path() { # name value charset-regex
            local name=$1 p=$2 re=$3 ok=1 pre
            [[ "$p" =~ $re ]] || fail "$name"
            [[ "$p" != /* && "/$p/" != *"/../"* ]] || fail "$name"
            for pre in "${ALLOWED_PREFIXES[@]}"; do
              [[ "$p" == "$pre"* ]] && ok=0
            done
            [[ $ok -eq 0 ]] || fail "$name"
          }
          if [[ -n "$INPUT_VALUES_GLOB" ]]; then
            check_path values_glob "$INPUT_VALUES_GLOB" '^[A-Za-z0-9._/*?-]+$'
          fi
          if [[ -n "$INPUT_VALUES_PATH" ]]; then
            items=${INPUT_VALUES_PATH//$'\n'/,}
            IFS=',' read -r -a parts <<< "$items"
            for item in "${parts[@]}"; do
              item=${item#"${item%%[![:space:]]*}"}
              item=${item%"${item##*[![:space:]]}"}
              [[ -z "$item" ]] && continue
              check_path values_path "$item" '^[A-Za-z0-9._/-]+$'
            done
          fi

  # Decided from main before anything is built or published: the source
  # repository must be the one bound to this image, the ref must fit the tag, and
  # the release gate must accept the bump. No secrets and no build.
  preflight:
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Install PyYAML
        run: python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci-hashed.txt

      - name: Release preflight
        env:
          REPO: ${{ inputs.repo }}
          GIT_REF: ${{ inputs.git_ref }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          TEAM: ${{ inputs.team_name }}
          SERVICE: ${{ inputs.component_name }}
          VALUES_PATH: ${{ inputs.values_path }}
          VALUES_GLOB: ${{ inputs.values_glob }}
        run: python3 scripts/release-preflight.py preflight

  build:
    needs: preflight
    # A called workflow can never hold more than the job that calls it, and
    # the default GITHUB_TOKEN permission for this org is read. build-image
    # asks for packages: write (push to GHCR) and id-token: write (the OIDC
    # token it trades for a Vault PAT), so without this block the call is
    # refused before any job starts — startup_failure, no jobs, no logs, and
    # GitHub will not even re-run it. Granting it here is not a widening:
    # these are the permissions build-image already declares for itself.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-image.yaml
    with:
      repo: ${{ inputs.repo }}
      git_ref: ${{ inputs.git_ref }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      team_name: ${{ inputs.team_name }}
      component_name: ${{ inputs.component_name }}
      build_id: rd-${{ github.run_id }}
      values_path: ${{ inputs.values_path }}
      values_glob: ${{ inputs.values_glob }}
    # Not `inherit`. This job checks out whichever repository `repo` names and
    # builds that repository's own Dockerfile, so it is the job in this
    # workflow that handles third-party content - and `inherit` gave it all
    # fourteen repository secrets, including KUBECONFIG, ARGOCD_TOKEN and
    # HCLOUD_TOKEN: cluster and infrastructure credentials with no role in an
    # image build (#1010).
    #
    # To be precise about the threat, since it decides which names belong
    # here: the docker build receives only what is handed to it - the
    # APP_VERSION build-arg and, for three allow-listed repos, the
    # GH_PACKAGES_TOKEN BuildKit secret. A Dockerfile cannot read the runner
    # environment, so the job env is not itself "exposed to the build". What
    # this narrowing reduces is the blast radius of a compromise of the
    # workflow or the runner, and the standing cost of holding credentials a
    # build has no use for.
    #
    # These two are every inheritable secret build-image references, and it
    # declares them under `on: workflow_call:`. GITHUB_TOKEN is its third and
    # is provided automatically - it is neither inheritable nor declarable.
    #
    # A name missing from this list does not fail loudly: build-image falls
    # through to a weaker credential tier and logs which one it used. So a
    # change here is verified by the tier lines in the build log, not by a
    # green run - see the PR that introduced this block.
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  # The bump is prepared here and published by exactly one of two jobs below.
  # This job holds no environment and no write credential: it decides the route,
  # edits the values files and builds ONE commit, which it hands over as a patch.
  # The publishing jobs apply that patch to a fresh checkout of main, run the
  # release gate on the tree that would result, and only then write.
  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_change: ${{ steps.commit.outputs.has_change }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      # The release gate imports yaml. Installed explicitly rather than assumed
      # on the runner image; if this step or the import fails the bump is
      # refused (the gate fails closed), never skipped.
      - name: Install PyYAML for the release gate
        run: python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci-hashed.txt

      # Which way this image reaches main is read from main (see
      # platform-gitops/release-bump-routes.yaml). A file that cannot be read
      # or parsed fails this step: there is no default route.
      - name: Decide how the bump reaches main
        id: route
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          route=$(python3 scripts/release-bump-route.py --image "$IMAGE_NAME")
          case "$route" in
            pr|direct) ;;
            *) echo "::error::unexpected route '${route}'"; exit 1 ;;
          esac
          echo "route=${route}" >> "$GITHUB_OUTPUT"
          echo "::notice::bump route for ${IMAGE_NAME}: ${route}"

      - name: Bump image tag(s)
        env:
          TEAM: ${{ inputs.team_name }}
          SERVICE: ${{ inputs.component_name }}
          VALUES_PATH: ${{ inputs.values_path }}
          VALUES_GLOB: ${{ inputs.values_glob }}
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os, re, sys, glob as globmod

          team = os.environ['TEAM']
          service = os.environ['SERVICE']
          image_name = os.environ['IMAGE_NAME']
          new_tag = os.environ['NEW_TAG']
          vpath = os.environ.get('VALUES_PATH', '').strip()
          vglob = os.environ.get('VALUES_GLOB', '').strip()

          # The tag is a workflow_dispatch input and ends up inside the
          # manifests this job commits — with an App token that bypasses
          # main's protection, so nothing downstream reviews the result.
          # A tag carrying a newline could therefore append arbitrary YAML
          # to a Deployment (`1.2.3"\n  securityContext:\n    privileged:
          # true\n  #`) and land it on main unreviewed. Anchored, and
          # restricted to what a real image tag may contain
          # (docker/distribution's grammar, minus the leading separator).
          if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9._-]{0,127}', new_tag):
              print(f"ERROR: refusing tag {new_tag!r}: not a valid image tag", file=sys.stderr)
              sys.exit(5)

          # The deploy key used to push this commit is on the
          # main-protection ruleset's bypass list on the understanding (see
          # CLAUDE.md's "Branch Protection Exception") that it only ever
          # touches image.tag data. Nothing about workflow_dispatch inputs
          # enforces that on its own, so values_path/values_glob (and the
          # server-constructed default path) are allowlisted here before any
          # file is opened.
          #
          # Caller inventory verified 2026-08-29 across all 23 org repos:
          # these three prefixes cover every real caller of
          # gitops-bump/release-deploy — platform-gitops/services/ (tenant
          # services, docs/telegram/academy/design), platform-gitops/
          # argo-workflows/cluster-templates/ (mctl-agents CWFT glob), and
          # platform-gitops/bootstrap/templates/mctl-platform/
          # (mctl-agent/mctl-api/mctl-portal). No fourth prefix exists
          # today; adding one requires editing this allowlist deliberately.
          ALLOWED_PREFIXES = (
              "platform-gitops/services/",
              "platform-gitops/argo-workflows/cluster-templates/",
              "platform-gitops/bootstrap/templates/mctl-platform/",
          )

          def validate_allowed(path):
              if os.path.isabs(path):
                  print(f"ERROR: path must be relative, got absolute path: {path}", file=sys.stderr)
                  sys.exit(4)
              # normpath collapses "a/../b" segments; comparing before/after
              # catches ".." traversal without relying on normpath alone —
              # this repo checkout has no symlinks, so normpath alone would
              # suffice, but the explicit check documents intent and fails
              # closed even if a future path shape confuses normpath.
              if ".." in path.split("/"):
                  print(f"ERROR: path must not contain '..' segments: {path}", file=sys.stderr)
                  sys.exit(4)
              normalized = os.path.normpath(path)
              if not normalized.startswith(ALLOWED_PREFIXES):
                  print(
                      f"ERROR: path '{path}' is not under an allowed prefix. "
                      f"Allowed: {', '.join(ALLOWED_PREFIXES)}",
                      file=sys.stderr,
                  )
                  sys.exit(4)

          # values_glob and values_path combine: a component whose tag lives
          # both inline across CWFTs (glob) and in a deployment values.yaml
          # (path) gets both bumped in one run — e.g. mctl-agents, whose
          # worker deployment silently stayed on an old tag while only the
          # CWFT defaults were bumped (mctl-agents#220). With neither set,
          # the conventional per-service values.yaml is used.
          files = []
          if vglob:
              validate_allowed(vglob)
              files = sorted(globmod.glob(vglob))
              if not files:
                  print(f"ERROR: no files matched glob: {vglob}", file=sys.stderr)
                  sys.exit(2)
              for f in files:
                  validate_allowed(f)
          # Several paths, comma- or newline-separated. One component can be
          # deployed as more than one workload - mctl-agents is about to run
          # a control worker and an execution worker off the same image
          # (ADR-008) - and with a single path the second one is bumped by
          # nobody and pins forever. That is the same silent drift that left
          # the shepherd on 1.25.0 for three weeks (mctl-agents#220, #238),
          # so the fix is to make the list expressible rather than to add
          # another glob and hope it happens to match.
          vpaths = [q.strip() for q in vpath.replace("\n", ",").split(",") if q.strip()]
          for q in vpaths:
              validate_allowed(q)
              files.append(q)
          if not files:
              default_path = f"platform-gitops/services/{team}/{service}/values.yaml"
              validate_allowed(default_path)
              files = [default_path]

          missing = [f for f in files if not os.path.isfile(f)]
          if missing:
              print(f"ERROR: file(s) not found: {missing}", file=sys.stderr)
              sys.exit(2)

          # Release gate (mctlhq/mctl-agents#1007): evaluated on the whole file
          # set BEFORE any file is written, so a refused bump leaves no
          # partial state. Fail closed: any nonzero exit, including a crash of
          # the gate itself, stops the release.
          import subprocess
          _gate = subprocess.run(
              [sys.executable, "scripts/release-gate.py", "check",
               "--files", *[os.path.normpath(f) for f in files], "--new-tag", new_tag,
               "--policy-rev", "origin/main", "--image", image_name]
          )
          if _gate.returncode != 0:
              print("ERROR: release gate refused this bump", file=sys.stderr)
              sys.exit(6)

          print(f"Files to process ({len(files)}):")
          for f in files:
              print(f"  {f}")

          total_replaced = 0
          total_already = 0
          changed_files = []
          matched_per_file = {}
          for path in files:
              with open(path) as fp:
                  content = fp.read()
              n1 = n2 = n3 = n4 = 0
              # Replacements are CALLABLES, not strings: in a string
              # replacement `\1` is a group reference, so a tag containing
              # a backslash escape would be expanded rather than inserted —
              # duplicating text, or failing the release with re.error on
              # an invalid group. The pattern-side interpolation of
              # image_name is re.escape'd for the same class of reason
              # (agy P1 on #962).
              # Pattern 1: combined repository: <image>\n  tag: <old>
              p1 = re.compile(r'(repository:\s*' + re.escape(image_name) + r'\n\s+tag:)[^\n]+')
              out, n1 = p1.subn(lambda m: m.group(1) + ' "' + new_tag + '"', content)
              # Pattern 2: split registry/repository (Backstage Helm chart style)
              if '/' in image_name:
                  registry, repo = image_name.split('/', 1)
                  p3 = re.compile(
                      r'(registry:\s*' + re.escape(registry) +
                      r'\n\s+repository:\s*' + re.escape(repo) +
                      r'\n\s+tag:)[^\n]+'
                  )
                  out, n3 = p3.subn(lambda m: m.group(1) + ' ' + new_tag, out)
              # Pattern 3: inline image: <image>:<old> (CWFT style, quoted or unquoted)
              p2 = re.compile(r'(image:\s*["\']?' + re.escape(image_name) + r')["\']?:[\w.\-]+')
              out, n2 = p2.subn(lambda m: m.group(1) + ':' + new_tag, out)
              # Pattern 4: workflow-parameter default value: <image>:<old>
              # (Argo CWFT parameterization style — arguments.parameters[].value,
              # e.g. cwft-mctl-agents-*.yaml's agent_image param — the tag lives
              # under `value:`, not `image:`, since the container's own `image:`
              # field is a {{workflow.parameters.*}} template reference instead
              # of a literal image:tag string.)
              p4 = re.compile(r'(value:\s*["\']?' + re.escape(image_name) + r')["\']?:[\w.\-]+')
              out, n4 = p4.subn(lambda m: m.group(1) + ':' + new_tag, out)
              n = n1 + n2 + n3 + n4
              matched_per_file[path] = n
              if n == 0:
                  print(f"  {path}: WARN — no image pattern matched (skipped)")
                  continue
              if out == content:
                  print(f"  {path}: already at {new_tag} (no diff)")
                  total_already += n
              else:
                  with open(path, 'w') as fp:
                      fp.write(out)
                  print(f"  {path}: bumped {n} occurrence(s)")
                  total_replaced += n
                  changed_files.append(path)

          # An explicitly requested single file (values_path or the
          # per-service default) with no pattern match is an error, not a
          # warning: unlike glob members — where some files legitimately
          # don't carry the image — the caller named this exact file, and
          # letting glob matches satisfy the aggregate check would report
          # success while the requested deployment silently stays on the
          # old tag.
          # Every explicitly named path must match, not just the first one:
          # the whole point of naming them is that a miss is an error rather
          # than a warning, and checking only one would restore exactly the
          # silence this list exists to remove.
          unmatched = [q for q in vpaths if matched_per_file.get(q, 0) == 0]
          if unmatched:
              print(
                  f"ERROR: no image tag pattern for {image_name} in explicitly "
                  f"requested {', '.join(unmatched)}",
                  file=sys.stderr,
              )
              sys.exit(3)

          # Hand off exactly the files this step actually rewrote to the
          # "Commit and push" step, which stages only these files
          # explicitly, never the full working tree. Written unconditionally
          # (even when empty) so that step can tell "nothing changed" apart
          # from "this step never got here" and fail closed on the latter.
          with open('/tmp/gitops-bump-changed-files.txt', 'w') as fp:
              for p in changed_files:
                  fp.write(p + '\n')

          if total_replaced == 0 and total_already == 0:
              print(f"ERROR: could not find any image tag pattern for {image_name} in any file", file=sys.stderr)
              sys.exit(3)

          print(f"Total: {total_replaced} occurrence(s) bumped across {len(files)} file(s)")
          PYEOF

      # Commits locally only and hands the commit over as a patch. Nothing is
      # pushed from this job.
      - name: Commit (local only) and write the patch
        id: commit
        env:
          TEAM: ${{ inputs.team_name }}
          SERVICE: ${{ inputs.component_name }}
          NEW_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.email "ci@mctl.ai"
          git config user.name "mctl-ci"

          CHANGED_FILES=/tmp/gitops-bump-changed-files.txt
          if [[ ! -f "${CHANGED_FILES}" ]]; then
            echo "::error::changed-files handoff file missing — bump step did not report its results, refusing to commit blind"
            exit 1
          fi

          # Stage exactly the allowlist-validated file(s) the bump step
          # reported as changed, not the full working tree, so an unrelated
          # modified/untracked file left in the runner's checkout can never
          # be swept into this commit. Read line-by-line (not unquoted
          # command substitution) so filenames are never word-split.
          git_add_args=()
          while IFS= read -r f; do
            [[ -n "$f" ]] && git_add_args+=("$f")
          done < "${CHANGED_FILES}"

          if [[ ${#git_add_args[@]} -eq 0 ]]; then
            echo "::notice::No tag change (already at ${NEW_TAG})"
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -- "${git_add_args[@]}"
          if git diff --staged --quiet; then
            echo "::notice::No tag change (already at ${NEW_TAG})"
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump ${TEAM}/${SERVICE} to ${NEW_TAG}"
          mkdir -p "$RUNNER_TEMP/bump-patch"
          git format-patch -1 --stdout > "$RUNNER_TEMP/bump-patch/bump.patch"
          echo "has_change=true" >> "$GITHUB_OUTPUT"

      - name: Hand the bump commit to the publishing job
        if: steps.commit.outputs.has_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump-patch/bump.patch
          if-no-files-found: error
          retention-days: 3

      - name: Summary
        # Inputs are bound through env, never interpolated into the script
        # text: this job held the gitops deploy key, and a value such as
        # `x$(curl ...)` in a ${{ }} expression would run as shell.
        env:
          TEAM: ${{ inputs.team_name }}
          SERVICE: ${{ inputs.component_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG: ${{ inputs.image_tag }}
          GIT_REF: ${{ inputs.git_ref }}
          VALUES_PATH: ${{ inputs.values_path }}
          VALUES_GLOB: ${{ inputs.values_glob }}
        run: |
          {
            echo "## Released ${TEAM}/${SERVICE}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | \`${IMAGE_NAME}:${NEW_TAG}\` |"
            echo "| **Git ref** | \`${GIT_REF}\` |"
            if [[ -n "${VALUES_GLOB}" ]]; then
              echo "| **Gitops glob** | \`${VALUES_GLOB}\` |"
            fi
            if [[ -n "${VALUES_PATH}" || -z "${VALUES_GLOB}" ]]; then
              echo "| **Gitops file** | \`${VALUES_PATH:-platform-gitops/services/${TEAM}/${SERVICE}/values.yaml}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Direct route: the deploy key pushes the reviewed-by-gate commit to main.
  # The key is a secret of the `gitops-bump` environment, which releases it only
  # to jobs running on main. This route stays for every image not listed in
  # platform-gitops/release-bump-routes.yaml (mctlhq/mctl-gitops#2543: the
  # DeployKey bypass actor is not removed by the PR route).
  publish-direct:
    needs: bump
    if: needs.bump.outputs.has_change == 'true' && needs.bump.outputs.route == 'direct'
    runs-on: ubuntu-latest
    environment: gitops-bump
    permissions:
      # Read only: the push is authorized by the deploy key, not by
      # GITHUB_TOKEN.
      contents: read
    steps:
      # main is protected by the `main-protection` ruleset (required PR +
      # review); the default GITHUB_TOKEN has no bypass for it, so a plain
      # checkout+push here gets rejected with GH013. The ruleset's
      # bypass_actors carry a `DeployKey` entry of its own, independent of any
      # App. A deploy key rather than an mctl-agents App token: that App's token
      # is also what the agents run with (mctlhq/mctl-agents#470, #1033).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          ssh-key: ${{ secrets.GITOPS_BUMP_DEPLOY_KEY }}

      - name: Install PyYAML for the release gate
        run: python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci-hashed.txt

      - name: Download the bump commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump-patch

      - name: Apply and push
        env:
          TEAM: ${{ inputs.team_name }}
          SERVICE: ${{ inputs.component_name }}
        run: |
          set -euo pipefail
          git config user.email "ci@mctl.ai"
          git config user.name "mctl-ci"
          bash scripts/release-bump-apply.sh "$RUNNER_TEMP/bump-patch/bump.patch"

          # Concurrent release-deploy runs race to push here — e.g. a repo that
          # ships two images from a single push to main (mctl-telegram builds
          # both the server and the agent-worker), or two repos releasing at the
          # same moment. A bare `git push` means the loser fails non-fast-forward
          # AFTER its image is already in GHCR: the tag bump never lands, so the
          # deploy silently doesn't happen and only the build looks green.
          # Rebase and retry instead. This is safe because every bump commit
          # rewrites exactly one image.tag line in one file — concurrent bumps
          # for different services never conflict textually, and two for the
          # same service converge on whichever tag pushed last.
          # Release gate on the exact tree about to be pushed. A push is a
          # fast-forward or it is rejected, so a successful push means main
          # was unchanged since this check; after every rebase the check runs
          # again on the new tree. No path pushes a tree the gate has not seen.
          release_gate() {
            python3 scripts/release-gate.py verify --policy-rev origin/main || {
              echo "::error::release gate refused the tree to be pushed"
              exit 1
            }
          }
          for attempt in 1 2 3 4 5; do
            release_gate
            if git push; then
              exit 0
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              break
            fi
            echo "::notice::push rejected (attempt ${attempt}/5), rebasing onto origin/main"
            # Jitter, not a flat backoff: two runs that collided once would
            # otherwise wake up together and collide again.
            sleep $(( attempt * 3 + RANDOM % 4 ))
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::tag bump for ${TEAM}/${SERVICE} conflicts with origin/main; not retrying"
              exit 1
            fi
          done
          echo "::error::could not push tag bump for ${TEAM}/${SERVICE} after 5 attempts"
          exit 1

  # PR route: the mctl-gitops-pr App opens a release-bump/* pull request. It is
  # not a ruleset bypass actor, so it cannot write main; auto-merge.yml merges
  # the PR after the review and the required checks (including `validate`, which
  # runs the release gate on the PR). The key is a secret of the main-only
  # `app-gitops-pr` environment.
  publish-pr:
    needs: bump
    if: needs.bump.outputs.has_change == 'true' && needs.bump.outputs.route == 'pr'
    runs-on: ubuntu-latest
    environment: app-gitops-pr
    outputs:
      pr: ${{ steps.open_pr.outputs.pr }}
    permissions:
      contents: read
    steps:
      - name: Generate a write token for the bump pull request
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GITOPS_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PR_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}

      - name: Install PyYAML for the release gate
        run: python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci-hashed.txt

      - name: Download the bump commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump-patch

      # The commit is re-authored as the App's own bot account. An author that
      # maps to no GitHub account (ci@mctl.ai) is "unattributed" and the ruleset
      # then asks for a second approval nobody is there to give.
      - name: Apply the bump commit as the App bot
        run: |
          set -euo pipefail
          git config user.name "mctl-gitops-pr[bot]"
          git config user.email "353875018+mctl-gitops-pr[bot]@users.noreply.github.com"
          bash scripts/release-bump-apply.sh "$RUNNER_TEMP/bump-patch/bump.patch"
          git commit --amend --reset-author --no-edit --trailer "Agent: none"

      # Same shape check the merge step applies: only image tags move.
      - name: Refuse anything but an image tag move
        run: git diff origin/main..HEAD | python3 scripts/release-bump-diff-guard.py

      - name: Open the release-bump pull request
        id: open_pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          TEAM: ${{ inputs.team_name }}
          COMPONENT: ${{ inputs.component_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG: ${{ inputs.image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Keyed by the image basename, as in gitops-bump.yaml, so a bump
          # opened by either workflow is seen (and superseded) by the other.
          SERVICE=$(basename "$IMAGE_NAME")
          branch="release-bump/${SERVICE}-${NEW_TAG}"
          git check-ref-format "refs/heads/${branch}" || { echo "::error::invalid branch name"; exit 1; }
          case "$branch" in release-bump/?*) ;; *) echo "::error::branch is not under release-bump/"; exit 1 ;; esac

          # Release gate on the tree the pull request would merge, right before
          # the only push this job makes. The push target is a release-bump/*
          # ref; no refspec here can name main.
          python3 scripts/release-gate.py verify --policy-rev origin/main
          git push --force origin "HEAD:refs/heads/${branch}"

          existing=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "::notice::release-bump pull request #${existing} already open for ${branch}"
            pr="$existing"
          else
            create_pr=1
          fi
          body=$(printf '%s\n' \
            "Image tag bump for \`${IMAGE_NAME}:${NEW_TAG}\` (${TEAM}/${COMPONENT})." \
            "" \
            "Opened by release-deploy.yaml: ${RUN_URL}" \
            "Base: \`$(git rev-parse origin/main)\`. Head: \`$(git rev-parse HEAD)\`." \
            "" \
            "The only change is an image tag. auto-merge.yml merges this PR after an approving review and the required checks (validate runs the release gate), pinned to the head above.")
          if [[ -n "${create_pr:-}" ]]; then
            pr_url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "chore: bump ${SERVICE} to ${NEW_TAG}" --body "$body")
            pr="${pr_url##*/}"
          fi
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::could not determine the pull request number"; exit 1; }
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"

          # Older open bumps for the same service are superseded by this one.
          # "Older" is a strictly lower MAJOR.MINOR.PATCH parsed from the branch
          # suffix; a suffix that is not exactly that shape is never matched
          # (so another service named <service>-<digit> is never touched). If
          # NEW_TAG cannot be ordered nothing is closed. If another open bump is
          # NEWER than this one, this release is the stale one: its PR is closed
          # and the run fails, so a re-run or a crossed dispatch cannot drop the
          # newer tag silently. A failed listing fails the job; it is never read
          # as "nothing to supersede".
          semver_lt() {
            local re='^([0-9]+)\.([0-9]+)\.([0-9]+)$' a b i
            [[ "$1" =~ $re ]] || return 2
            a=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")
            [[ "$2" =~ $re ]] || return 2
            b=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")
            for i in 0 1 2; do
              (( 10#${a[i]} < 10#${b[i]} )) && return 0
              (( 10#${a[i]} > 10#${b[i]} )) && return 1
            done
            return 1
          }
          export PREFIX="release-bump/${SERVICE}-"
          others=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName,author \
            --jq '.[] | select(.author.login | test("^(app/)?mctl-gitops-pr(\\[bot\\])?$")) | select(.headRefName as $h | $ENV.PREFIX as $p | ($h | startswith($p)) and ($h[($p | length):] | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | "\(.number) \(.headRefName)"')
          while read -r n ref; do
            [[ -n "$n" && "$n" != "$pr" ]] || continue
            other_tag="${ref#"$PREFIX"}"
            rc=0; semver_lt "$other_tag" "$NEW_TAG" || rc=$?
            if [[ "$rc" == 0 ]]; then
              gh pr close "$n" --repo "$REPO" --delete-branch \
                --comment "Superseded by #${pr} (${NEW_TAG})."
            elif [[ "$rc" == 1 ]]; then
              gh pr close "$pr" --repo "$REPO" --delete-branch \
                --comment "Not newer than #${n} (${other_tag}); closing."
              echo "::error::a newer release-bump pull request #${n} (${other_tag}) is open; ${NEW_TAG} is not newer"
              exit 1
            else
              echo "::warning::cannot order ${NEW_TAG} against #${n} (${other_tag}); closing nothing"
            fi
          done <<< "$others"

  # A stuck bump must be a red release run, not a silent open PR. The wait lives
  # in its own job with no environment, no secret and read-only access, and
  # outside any concurrency group: it can last up to 50 minutes and must not hold
  # the serialization that publish-direct and publish-pr use. A bump superseded
  # by a newer release is only a notice.
  await-bump:
    needs: publish-pr
    if: needs.publish-pr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      pull-requests: read
    steps:
      - name: Wait for the bump to merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.publish-pr.outputs.pr }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::no pull request number from the previous step"; exit 1; }
          deadline=$((SECONDS + 50 * 60))
          while (( SECONDS < deadline )); do
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            case "$state" in
              MERGED) echo "::notice::release-bump pull request #${PR} merged"; exit 0 ;;
              CLOSED)
                sup=$(gh pr view "$PR" --repo "$REPO" --json comments --jq '[.comments[] | select(.author.login | test("^(app/)?mctl-gitops-pr(\\[bot\\])?$")) | select(.body | startswith("Superseded by #"))] | length')
                if [[ "$sup" -gt 0 ]]; then
                  echo "::notice::release-bump pull request #${PR} was superseded by a newer release"; exit 0
                fi
                echo "::error::release-bump pull request #${PR} was closed without merging"; exit 1 ;;
              OPEN) ;;
              *) echo "::error::unexpected pull request state: ${state}"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::release-bump pull request #${PR} did not merge within 50 minutes"
          exit 1
