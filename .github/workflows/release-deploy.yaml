name: Release & Deploy
run-name: "release-deploy ${{ inputs.team_name }}/${{ inputs.component_name }} ${{ inputs.image_tag }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo (e.g. mctlhq/mctl-docs)"
        required: true
        type: string
      git_ref:
        description: "Git ref to build (typically the new release tag)"
        required: true
        type: string
      image_name:
        description: "Full image name (e.g. ghcr.io/mctlhq/mctl-docs)"
        required: true
        type: string
      image_tag:
        description: "Image tag (typically the version, e.g. 0.1.18)"
        required: true
        type: string
      dockerfile_path:
        description: "Path to Dockerfile in source repo"
        required: false
        default: "Dockerfile"
        type: string
      team_name:
        description: "Team owning the service (matches platform-gitops/services/<team>/)"
        required: true
        type: string
      component_name:
        description: "Service name (matches the directory under platform-gitops/services/<team>/)"
        required: true
        type: string
      values_path:
        description: "Override gitops values file path (default: platform-gitops/services/<team>/<component>/values.yaml). Use for platform bootstrap services. May be combined with values_glob to bump both in one run."
        required: false
        type: string
      values_glob:
        description: "Glob pattern for multiple files (e.g. platform-gitops/argo-workflows/cluster-templates/cwft-mctl-agents-*.yaml). Use when a component's image tag is inline across several manifests instead of one values.yaml. May be combined with values_path."
        required: false
        type: string

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    with:
      repo: ${{ inputs.repo }}
      git_ref: ${{ inputs.git_ref }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      team_name: ${{ inputs.team_name }}
      component_name: ${{ inputs.component_name }}
      build_id: rd-${{ github.run_id }}
    secrets: inherit

  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main is protected by the `main-protection` ruleset (required PR +
      # review); the default GITHUB_TOKEN has no bypass for it, so a plain
      # checkout+push here gets rejected with GH013. The mctl-agents App is
      # on that ruleset's bypass list for exactly these tag-bump commits —
      # the narrowly-scoped exception to "never commit to main" that
      # CLAUDE.md documents — so mint a token as that app and push with it.
      #
      # Deliberately NOT the repo's APP_ID/APP_PRIVATE_KEY (MCTL App): that
      # is the user-facing App people authorize at mctl.ai/#request-access,
      # whose published description promises least privilege. Letting it
      # bypass branch protection here would widen it in exactly the
      # direction #761 is trying to narrow. mctl-agents is backend-only
      # automation, so the bypass stays with it.
      #
      # Its credentials are repo secrets rather than a Vault lookup: Vault
      # is unreachable from GitHub Actions runners (#779).
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          token: ${{ steps.app_token.outputs.token }}

      - name: Bump image tag(s)
        env:
          TEAM: ${{ inputs.team_name }}
          SERVICE: ${{ inputs.component_name }}
          VALUES_PATH: ${{ inputs.values_path }}
          VALUES_GLOB: ${{ inputs.values_glob }}
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os, re, sys, glob as globmod

          team = os.environ['TEAM']
          service = os.environ['SERVICE']
          image_name = os.environ['IMAGE_NAME']
          new_tag = os.environ['NEW_TAG']
          vpath = os.environ.get('VALUES_PATH', '').strip()
          vglob = os.environ.get('VALUES_GLOB', '').strip()

          # The mctl-agents App token used to push this commit is on the
          # main-protection ruleset's bypass list on the understanding (see
          # CLAUDE.md's "Branch Protection Exception") that it only ever
          # touches image.tag data. Nothing about workflow_dispatch inputs
          # enforces that on its own, so values_path/values_glob (and the
          # server-constructed default path) are allowlisted here before any
          # file is opened.
          #
          # Caller inventory verified 2026-08-29 across all 23 org repos:
          # these three prefixes cover every real caller of
          # gitops-bump/release-deploy — platform-gitops/services/ (tenant
          # services, docs/telegram/academy/design), platform-gitops/
          # argo-workflows/cluster-templates/ (mctl-agents CWFT glob), and
          # platform-gitops/bootstrap/templates/mctl-platform/
          # (mctl-agent/mctl-api/mctl-portal). No fourth prefix exists
          # today; adding one requires editing this allowlist deliberately.
          ALLOWED_PREFIXES = (
              "platform-gitops/services/",
              "platform-gitops/argo-workflows/cluster-templates/",
              "platform-gitops/bootstrap/templates/mctl-platform/",
          )

          def validate_allowed(path):
              if os.path.isabs(path):
                  print(f"ERROR: path must be relative, got absolute path: {path}", file=sys.stderr)
                  sys.exit(4)
              # normpath collapses "a/../b" segments; comparing before/after
              # catches ".." traversal without relying on normpath alone —
              # this repo checkout has no symlinks, so normpath alone would
              # suffice, but the explicit check documents intent and fails
              # closed even if a future path shape confuses normpath.
              if ".." in path.split("/"):
                  print(f"ERROR: path must not contain '..' segments: {path}", file=sys.stderr)
                  sys.exit(4)
              normalized = os.path.normpath(path)
              if not normalized.startswith(ALLOWED_PREFIXES):
                  print(
                      f"ERROR: path '{path}' is not under an allowed prefix. "
                      f"Allowed: {', '.join(ALLOWED_PREFIXES)}",
                      file=sys.stderr,
                  )
                  sys.exit(4)

          # values_glob and values_path combine: a component whose tag lives
          # both inline across CWFTs (glob) and in a deployment values.yaml
          # (path) gets both bumped in one run — e.g. mctl-agents, whose
          # worker deployment silently stayed on an old tag while only the
          # CWFT defaults were bumped (mctl-agents#220). With neither set,
          # the conventional per-service values.yaml is used.
          files = []
          if vglob:
              validate_allowed(vglob)
              files = sorted(globmod.glob(vglob))
              if not files:
                  print(f"ERROR: no files matched glob: {vglob}", file=sys.stderr)
                  sys.exit(2)
              for f in files:
                  validate_allowed(f)
          if vpath:
              validate_allowed(vpath)
              files.append(vpath)
          if not files:
              default_path = f"platform-gitops/services/{team}/{service}/values.yaml"
              validate_allowed(default_path)
              files = [default_path]

          missing = [f for f in files if not os.path.isfile(f)]
          if missing:
              print(f"ERROR: file(s) not found: {missing}", file=sys.stderr)
              sys.exit(2)

          print(f"Files to process ({len(files)}):")
          for f in files:
              print(f"  {f}")

          total_replaced = 0
          total_already = 0
          changed_files = []
          for path in files:
              with open(path) as fp:
                  content = fp.read()
              n1 = n2 = n3 = n4 = 0
              # Pattern 1: combined repository: <image>\n  tag: <old>
              p1 = re.compile(r'(repository:\s*' + re.escape(image_name) + r'\n\s+tag:)[^\n]+')
              out, n1 = p1.subn(r'\1 "' + new_tag + '"', content)
              # Pattern 2: split registry/repository (Backstage Helm chart style)
              if '/' in image_name:
                  registry, repo = image_name.split('/', 1)
                  p3 = re.compile(
                      r'(registry:\s*' + re.escape(registry) +
                      r'\n\s+repository:\s*' + re.escape(repo) +
                      r'\n\s+tag:)[^\n]+'
                  )
                  out, n3 = p3.subn(r'\1 ' + new_tag, out)
              # Pattern 3: inline image: <image>:<old> (CWFT style, quoted or unquoted)
              p2 = re.compile(r'(image:\s*["\']?' + re.escape(image_name) + r')["\']?:[\w.\-]+')
              out, n2 = p2.subn(r'\1:' + new_tag, out)
              # Pattern 4: workflow-parameter default value: <image>:<old>
              # (Argo CWFT parameterization style — arguments.parameters[].value,
              # e.g. cwft-mctl-agents-*.yaml's agent_image param — the tag lives
              # under `value:`, not `image:`, since the container's own `image:`
              # field is a {{workflow.parameters.*}} template reference instead
              # of a literal image:tag string.)
              p4 = re.compile(r'(value:\s*["\']?' + re.escape(image_name) + r')["\']?:[\w.\-]+')
              out, n4 = p4.subn(r'\1:' + new_tag, out)
              n = n1 + n2 + n3 + n4
              if n == 0:
                  print(f"  {path}: WARN — no image pattern matched (skipped)")
                  continue
              if out == content:
                  print(f"  {path}: already at {new_tag} (no diff)")
                  total_already += n
              else:
                  with open(path, 'w') as fp:
                      fp.write(out)
                  print(f"  {path}: bumped {n} occurrence(s)")
                  total_replaced += n
                  changed_files.append(path)

          # Hand off exactly the files this step actually rewrote to the
          # "Commit and push" step, which stages only these files
          # explicitly, never the full working tree. Written unconditionally
          # (even when empty) so that step can tell "nothing changed" apart
          # from "this step never got here" and fail closed on the latter.
          with open('/tmp/gitops-bump-changed-files.txt', 'w') as fp:
              for p in changed_files:
                  fp.write(p + '\n')

          if total_replaced == 0 and total_already == 0:
              print(f"ERROR: could not find any image tag pattern for {image_name} in any file", file=sys.stderr)
              sys.exit(3)

          print(f"Total: {total_replaced} occurrence(s) bumped across {len(files)} file(s)")
          PYEOF

      - name: Commit and push
        env:
          TEAM: ${{ inputs.team_name }}
          SERVICE: ${{ inputs.component_name }}
          NEW_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.email "ci@mctl.ai"
          git config user.name "mctl-ci"

          CHANGED_FILES=/tmp/gitops-bump-changed-files.txt
          if [[ ! -f "${CHANGED_FILES}" ]]; then
            echo "::error::changed-files handoff file missing — bump step did not report its results, refusing to commit blind"
            exit 1
          fi

          # Stage exactly the allowlist-validated file(s) the bump step
          # reported as changed, not the full working tree, so an unrelated
          # modified/untracked file left in the runner's checkout can never
          # be swept into this commit. Read line-by-line (not unquoted
          # command substitution) so filenames are never word-split.
          git_add_args=()
          while IFS= read -r f; do
            [[ -n "$f" ]] && git_add_args+=("$f")
          done < "${CHANGED_FILES}"

          if [[ ${#git_add_args[@]} -eq 0 ]]; then
            echo "::notice::No tag change (already at ${NEW_TAG})"
            exit 0
          fi

          git add -- "${git_add_args[@]}"
          if git diff --staged --quiet; then
            echo "::notice::No tag change (already at ${NEW_TAG})"
            exit 0
          fi
          git commit -m "chore: bump ${TEAM}/${SERVICE} to ${NEW_TAG}"

          # Concurrent release-deploy runs race to push here — e.g. a repo that
          # ships two images from a single push to main (mctl-telegram builds
          # both the server and the agent-worker), or two repos releasing at the
          # same moment. A bare `git push` means the loser fails non-fast-forward
          # AFTER its image is already in GHCR: the tag bump never lands, so the
          # deploy silently doesn't happen and only the build looks green.
          # Rebase and retry instead. This is safe because every bump commit
          # rewrites exactly one image.tag line in one file — concurrent bumps
          # for different services never conflict textually, and two for the
          # same service converge on whichever tag pushed last.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              break
            fi
            echo "::notice::push rejected (attempt ${attempt}/5), rebasing onto origin/main"
            # Jitter, not a flat backoff: two runs that collided once would
            # otherwise wake up together and collide again.
            sleep $(( attempt * 3 + RANDOM % 4 ))
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::tag bump for ${TEAM}/${SERVICE} conflicts with origin/main; not retrying"
              exit 1
            fi
          done
          echo "::error::could not push tag bump for ${TEAM}/${SERVICE} after 5 attempts"
          exit 1

      - name: Summary
        run: |
          {
            echo "## Released ${{ inputs.team_name }}/${{ inputs.component_name }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | \`${{ inputs.image_name }}:${{ inputs.image_tag }}\` |"
            echo "| **Git ref** | \`${{ inputs.git_ref }}\` |"
            if [[ -n "${{ inputs.values_glob }}" ]]; then
              echo "| **Gitops glob** | \`${{ inputs.values_glob }}\` |"
            fi
            if [[ -n "${{ inputs.values_path }}" || -z "${{ inputs.values_glob }}" ]]; then
              echo "| **Gitops file** | \`${{ inputs.values_path || format('platform-gitops/services/{0}/{1}/values.yaml', inputs.team_name, inputs.component_name) }}\` |"
            fi
          } >> $GITHUB_STEP_SUMMARY
