name: Auto Review and Merge

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]

# No default grant: each job lists what it needs. Nothing here writes to the
# repository contents any more (the auto-merge job stopped merging, see its
# last step), and `checks: read` was never used.
permissions: {}

jobs:
  request-review:
    runs-on: ubuntu-latest
    # `gh pr edit --add-reviewer` is the only write.
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/')
    steps:
      - name: Request Copilot review
        run: |
          gh pr edit "$PR" \
            --add-reviewer copilot \
            --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

  auto-merge:
    runs-on: ubuntu-latest
    # Reads the PR and its file list through the API; merges nothing.
    permissions:
      contents: read
      pull-requests: read
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      (startsWith(github.event.pull_request.head.ref, 'claude/') || startsWith(github.event.pull_request.head.ref, 'portal-allowlist/'))
    # release-bump/* PRs are not merged from here. A merge-queue entry created
    # with GITHUB_TOKEN starts no merge_group run, so such a bump stalled in
    # AWAITING_CHECKS (#2780, #2792); the enqueue-bump job of the release
    # workflows, on main, enqueues them with the App token instead and
    # applies the guards that used to live here. The protected_re below is also
    # read by scripts/release-bump-enqueue-wait.sh, so it stays one list.
    steps:
      # A bot approval is enough to merge an ordinary `claude/*` PR, but not
      # one that decides which agent exists or what it may do
      # (mctl-agents#470), nor one that flips a proposal's approval state
      # (gitops#986), nor one that changes the release-gate files (gitops#1033).
      # Those wait for a person to merge them.
      #
      # Fail closed: a file list that cannot be read in full is treated as
      # touching a protected path. "Could not list" is never "nothing
      # protected".
      - name: Refuse paths that need a human merge
        id: guard
        run: |
          set -euo pipefail
          # One read of the PR (head and file count) and ONE read of the file
          # list. The count and the path check both use that single list, so a
          # commit pushed during this step cannot change what was judged.
          if ! pr=$(gh api "repos/${REPO}/pulls/${PR}" --jq '"\(.head.sha) \(.changed_files)"'); then
            echo "::error::Could not read #${PR}; not merging."
            exit 1
          fi
          head_sha=${pr%% *}
          expected=${pr##* }
          if ! files=$(gh api --paginate \
                "repos/${REPO}/pulls/${PR}/files?per_page=100" \
                --jq '.[] | [.filename, (.previous_filename // "")] | @tsv'); then
            echo "::error::Could not list the files of #${PR}; not merging."
            exit 1
          fi
          listed=$(printf '%s' "$files" | grep -c . || true)
          if [ -z "$head_sha" ] || [ "$listed" != "$expected" ]; then
            echo "::error::#${PR} reports ${expected} changed files but ${listed} were listed; not merging."
            exit 1
          fi
          # tests/test_auto_merge_protected_paths.py reads this assignment, so
          # keep it a single line of the form protected_re='...'.
          protected_re='^platform-gitops/agent-platform/|^platform-gitops/agents-state/[^/]+/proposals/[^/]+/\.status\.yaml$|^scripts/release-gate\.py$|^scripts/release-ledger-shadow\.py$|^scripts/release-bump-(diff-guard|route|checks-ready)\.py$|^scripts/release-bump-(apply|enqueue-wait)\.sh$|^platform-gitops/release-gates\.yaml$|^platform-gitops/release-bump-routes\.yaml$|^platform-gitops/argo-workflows/scripts/release-gate-guard\.sh$|^platform-gitops/argo-workflows/cluster-templates/(tpl-git-commit|tpl-validate-tenant|wft-add-custom-domain|wft-deploy-service|wft-promote-deployment|wft-provision-database|wft-remove-custom-domain|wft-rollback-revision|wft-rollback-service)\.yaml$|^\.github/workflows/(auto-merge\.yml|gitops-bump\.yaml|release-deploy\.yaml|release-gate-watch\.yml|validate-manifests\.yml)$|^tests/test_(release_gate|release_ledger|release_bump|auto_merge_protected_paths|release_deploy_bump|gitops_bump_inputs|wft_deploy_service_autoscaling_values)[a-z_]*\.py$|^platform-gitops/bootstrap/templates/projects/|^scripts/validate-argocd-sync-windows\.py$|^scripts/render-sync-window\.py$|^scripts/app-project-consumers\.json$'
          # grep exits 1 for "no match" (an empty set) and 2 or more for an
          # error such as an invalid pattern. Only 1 may read as empty.
          rc=0
          protected=$(printf '%s\n' "$files" | tr '\t' '\n' | grep -E "$protected_re") || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::Path check failed (grep exit ${rc}); not merging."
            exit 1
          fi
          # portal-allowlist/* PRs may only auto-merge if they do not widen exposure.
          # A widening touches baseline.json and requires an explicit human merge.
          if [[ "$HEAD_REF" =~ ^portal-allowlist/ ]]; then
            rc=0
            portal_widening=$(printf '%s\n' "$files" | tr '\t' '\n' | grep -E \
              '^infrastructure/cloudflare/portal/allowlists/baseline\.json$') || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::Portal path check failed (grep exit ${rc}); not merging."
              exit 1
            fi
            if [ -n "$portal_widening" ]; then
              protected=$(printf '%s\n%s\n' "$protected" "$portal_widening" | grep -v '^$' || true)
            fi
          fi
          if [ -n "$protected" ]; then
            echo "::notice::#${PR} touches paths that need a human merge; leaving it open:"
            printf '%s\n' "$protected"
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
      # This job no longer merges. main has a merge queue, and `gh pr merge
      # --delete-branch` is refused under one ("Cannot use -d or
      # --delete-branch when merge queue enabled"): every approved
      # portal-allowlist/* PR ended in a red job. Dropping the flag is not the
      # fix, because `gh pr merge` would then enqueue with GITHUB_TOKEN, and an
      # entry made with that token starts no merge_group run, so the PR sits in
      # AWAITING_CHECKS (#2780, #2792). Giving this job the App token that the
      # release workflows enqueue with is not an option either: that token is
      # held by the app-gitops-pr environment, which only main-side workflows
      # (dispatch and schedule) may enter, and this job runs on
      # pull_request_review from a workflow file the PR itself controls.
      #
      # What is left is the guard above, which still says whether the PR may be
      # merged without a person. The merge itself is `bash
      # tools/merge-gitops-pr.sh <N>`, which enqueues with the right token.
      - name: Report that the merge is left to the queue
        if: steps.guard.outputs.merge == 'true'
        run: |
          echo "::notice::#${PR} is approved and touches no protected path. main has a merge queue, so this job does not merge it: run tools/merge-gitops-pr.sh ${PR}."
        env:
          PR: ${{ github.event.pull_request.number }}
