name: Auto Review and Merge

on:
  # Re-evaluate the gate whenever a reviewer or any current PR CI workflow
  # finishes. This means retrying a failed CI job can unblock a PR without
  # requiring a reviewer rerun. A manual @claude review is covered by the
  # pull_request_review event emitted when Claude submits its replacement
  # verdict.
  workflow_run:
    workflows:
      - Claude PR review
      - Agy PR review
      - Validate Manifests
      - yamllint
      - security
      - no-root-yaml
      - terraform
      - workstation-scripts
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: auto-merge-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0] != null) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Require green CI, exact-head approval, and no P1/P2 findings
        shell: bash
        run: |
          set -euo pipefail

          pr_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          state=$(jq -r '.state' <<<"$pr_json")
          draft=$(jq -r '.draft' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")

          if [ "$state" != "open" ] || [ "$draft" = "true" ]; then
            echo "PR is not an open, reviewable PR; nothing to merge."
            exit 0
          fi

          if [ "$base_ref" != "main" ]; then
            echo "PR targets '$base_ref', not main; auto-merge is disabled for this base."
            exit 0
          fi

          if [ "$head_repo" != "$REPO" ]; then
            echo "Fork PR detected ($head_repo); auto-merge is disabled."
            exit 0
          fi

          if [ "$TRIGGER_HEAD_SHA" != "$head_sha" ]; then
            echo "Stale event: triggered for $TRIGGER_HEAD_SHA, current head is $head_sha."
            exit 0
          fi

          # Agy is part of the governed gate, so fail closed if its current-head
          # run is absent, still running, failed, or malformed. gh pr checks
          # cannot detect a reviewer workflow that never started at all.
          agy_runs=$(
            gh api --paginate \
              "repos/$REPO/actions/workflows/agy-review.yml/runs?event=pull_request&head_sha=$head_sha&per_page=100" \
              --jq '.workflow_runs[]'
          )
          agy_conclusion=$(jq -sr 'sort_by(.created_at) | last | .conclusion // ""' <<<"$agy_runs")
          if [ "$agy_conclusion" != "success" ]; then
            echo "Merge gate blocked: current-head Agy review is not successful (latest conclusion: ${agy_conclusion:-none})."
            exit 0
          fi

          echo "Waiting for every check on PR #$PR_NUMBER head $head_sha to finish green..."
          if ! gh pr checks "$PR_NUMBER" \
            --repo "$REPO" \
            --watch \
            --interval 10 \
            --fail-fast; then
            echo "Merge gate blocked: at least one PR check is not green. A rerun of any listed PR CI workflow will re-evaluate the gate."
            exit 0
          fi

          # Fetch every page: long-lived PRs can exceed GitHub's 100-item page.
          reviews=$(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --jq '.[]' | jq -s '.'
          )
          review_comments=$(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/comments?per_page=100" --jq '.[]' | jq -s '.'
          )

          # Only the configured GitHub App identity can satisfy the approval
          # requirement. The latest exact-head Claude verdict must be APPROVED.
          latest_claude=$(jq -c --arg head "$head_sha" '
            [
              .[]
              | select(.user.login == "claude[bot]" and .commit_id == $head)
            ]
            | sort_by(.submitted_at)
            | last // {}
          ' <<<"$reviews")
          claude_state=$(jq -r '.state // ""' <<<"$latest_claude")
          claude_body=$(jq -r '.body // ""' <<<"$latest_claude")

          if [ "$claude_state" != "APPROVED" ]; then
            echo "Merge gate blocked: no exact-head claude[bot] APPROVED review for $head_sha (latest state: ${claude_state:-none})."
            exit 0
          fi

          # A review body can itself carry a P1/P2 finding. Do not let an
          # approval body that explicitly says "No P1/P2 findings" trip this.
          claude_body_blocker=$(jq -nr --arg body "$claude_body" '
            if ($body | test("No P1/P2 findings"; "i")) then 0
            elif (($body | test("P1 Badge|P2 Badge"; "i")) or
                  ($body | test("(^|\\n)[[:space:]]*\\*{0,2}P[12]([[:space:]]|[—:-])"; "i")) or
                  ($body | test("Has P1/P2 findings"; "i"))) then 1
            else 0 end
          ')
          if [ "$claude_body_blocker" -ne 0 ]; then
            echo "Merge gate blocked: latest exact-head Claude approval body still contains a P1/P2 finding."
            exit 0
          fi

          # Codex is best-effort and does not run on every head. If it did
          # review this exact head, P1/P2 findings in either its top-level
          # review body or inline comments are blocking. Match the formats the
          # connector actually emits, including Markdown emphasis around P1/P2.
          codex_review_blockers=$(jq -r --arg head "$head_sha" '
            [
              .[]
              | select(.user.login == "chatgpt-codex-connector[bot]" and .commit_id == $head)
              | (.body // "")
              | select(
                  (test("P1 Badge|P2 Badge"; "i")) or
                  (test("(^|\\n)[[:space:]]*\\*{0,2}P[12]([[:space:]]|[—:-])"; "i")) or
                  ((test("P1/P2 findings"; "i")) and (test("No P1/P2 findings"; "i") | not))
                )
            ]
            | length
          ' <<<"$reviews")

          codex_inline_blockers=$(jq -r --arg head "$head_sha" '
            [
              .[]
              | select(.user.login == "chatgpt-codex-connector[bot]" and .commit_id == $head)
              | (.body // "")
              | select(
                  (test("P1 Badge|P2 Badge"; "i")) or
                  (test("(^|\\n)[[:space:]]*\\*{0,2}P[12]([[:space:]]|[—:-])"; "i")) or
                  ((test("P1/P2 findings"; "i")) and (test("No P1/P2 findings"; "i") | not))
                )
            ]
            | length
          ' <<<"$review_comments")

          blockers=$((codex_review_blockers + codex_inline_blockers))
          if [ "$blockers" -ne 0 ]; then
            echo "Merge gate blocked: found $blockers current-head Codex P1/P2 finding(s)."
            exit 0
          fi

          echo "Merge gate clean: all checks green, exact-head Claude approval present, Agy passed, and no current-head Codex P1/P2 findings."
          gh pr merge "$PR_NUMBER" \
            --merge \
            --delete-branch \
            --match-head-commit "$head_sha" \
            --repo "$REPO"
