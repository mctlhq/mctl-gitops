name: Auto Review and Merge

on:
  # Run only after one of the automated reviewers finishes. The merge job
  # then waits for every PR check on the current head, so path-specific CI
  # that is still running is included without maintaining a hard-coded list.
  workflow_run:
    workflows:
      - Claude PR review
      - Agy PR review
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: auto-merge-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require green CI, exact-head approval, and no P1/P2 findings
        shell: bash
        run: |
          set -euo pipefail

          pr_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          state=$(jq -r '.state' <<<"$pr_json")
          draft=$(jq -r '.draft' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")

          if [ "$state" != "open" ] || [ "$draft" = "true" ]; then
            echo "PR is not an open, reviewable PR; nothing to merge."
            exit 0
          fi

          if [ "$base_ref" != "main" ]; then
            echo "PR targets '$base_ref', not main; auto-merge is disabled for this base."
            exit 0
          fi

          if [ "$head_repo" != "$REPO" ]; then
            echo "Fork PR detected ($head_repo); auto-merge is disabled."
            exit 0
          fi

          if [ "$TRIGGER_HEAD_SHA" != "$head_sha" ]; then
            echo "Stale workflow_run: triggered for $TRIGGER_HEAD_SHA, current head is $head_sha."
            exit 0
          fi

          echo "Waiting for every check on PR #$PR_NUMBER head $head_sha to finish green..."
          if ! gh pr checks "$PR_NUMBER" \
            --repo "$REPO" \
            --watch \
            --interval 10 \
            --fail-fast; then
            echo "Merge gate blocked: at least one PR check is not green."
            exit 0
          fi

          # Reviews are not dismissed on push in the repository ruleset, so a
          # historical approval is insufficient. Require Claude's approval to
          # be explicitly bound to the exact head we are about to merge.
          reviews=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100")
          claude_state=$(jq -r --arg head "$head_sha" '
            [
              .[]
              | select((.user.login == "claude[bot]" or .user.login == "claude") and .commit_id == $head)
            ]
            | sort_by(.submitted_at)
            | last
            | .state // ""
          ' <<<"$reviews")

          if [ "$claude_state" != "APPROVED" ]; then
            echo "Merge gate blocked: no exact-head Claude APPROVED review for $head_sha (latest state: ${claude_state:-none})."
            exit 0
          fi

          # Codex is not required to run on every head. If it (or Claude)
          # did review this exact head, however, current-head P1/P2 inline
          # findings are blocking. Old-commit findings are intentionally not
          # considered here; a new head must earn a fresh clean gate.
          review_comments=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments?per_page=100")
          blockers=$(jq -r --arg head "$head_sha" '
            [
              .[]
              | select(.commit_id == $head)
              | select(
                  .user.login == "claude[bot]" or
                  .user.login == "claude" or
                  .user.login == "chatgpt-codex-connector[bot]" or
                  .user.login == "chatgpt-codex-connector"
                )
              | select(
                  (.body | test("P1 Badge|P2 Badge"; "i")) or
                  (.body | test("(^|\\n)P[12][[:space:]]*[—:-]"; "i")) or
                  (.body | test("Severity[^\\n]*P[12]"; "i"))
                )
            ]
            | length
          ' <<<"$review_comments")

          if [ "$blockers" -ne 0 ]; then
            echo "Merge gate blocked: found $blockers current-head P1/P2 review comment(s)."
            exit 0
          fi

          # Re-read the PR immediately before mutation so a push cannot race
          # the checks/review evaluation above.
          current_head=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [ "$current_head" != "$head_sha" ]; then
            echo "Head moved from $head_sha to $current_head while evaluating the gate; not merging."
            exit 0
          fi

          echo "Merge gate clean: all checks green, exact-head Claude approval present, no current-head P1/P2 findings."
          gh pr merge "$PR_NUMBER" \
            --merge \
            --delete-branch \
            --repo "$REPO"
