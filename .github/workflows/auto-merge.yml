name: Auto Review and Merge

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/')
    steps:
      - name: Request Copilot review
        run: |
          gh pr edit "$PR" \
            --add-reviewer copilot \
            --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      (startsWith(github.event.pull_request.head.ref, 'claude/') || startsWith(github.event.pull_request.head.ref, 'portal-allowlist/') || startsWith(github.event.pull_request.head.ref, 'release-bump/'))
    # The release-bump route waits for the required checks (see the last step).
    timeout-minutes: 50
    steps:
      # release-bump/* only: the trusted guard script comes from the default
      # branch, never from the PR (a pull_request_review run would otherwise
      # check out the merge commit).
      - name: Check out the guard scripts from the default branch
        if: startsWith(github.event.pull_request.head.ref, 'release-bump/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # A bot approval is enough to merge an ordinary `claude/*` PR, but not
      # one that decides which agent exists or what it may do
      # (mctl-agents#470), nor one that flips a proposal's approval state
      # (gitops#986), nor one that changes the release-gate files (gitops#1033).
      # Those wait for a person to merge them.
      #
      # Fail closed: a file list that cannot be read in full is treated as
      # touching a protected path. "Could not list" is never "nothing
      # protected".
      - name: Refuse paths that need a human merge
        id: guard
        run: |
          set -euo pipefail
          # One read of the PR (head and file count) and ONE read of the file
          # list. The count and the path check both use that single list, and
          # the merge below is pinned to this head, so a commit pushed after
          # this step cannot be merged on the strength of an older list.
          if ! pr=$(gh api "repos/${REPO}/pulls/${PR}" --jq '"\(.head.sha) \(.changed_files)"'); then
            echo "::error::Could not read #${PR}; not merging."
            exit 1
          fi
          head_sha=${pr%% *}
          expected=${pr##* }
          if ! files=$(gh api --paginate \
                "repos/${REPO}/pulls/${PR}/files?per_page=100" \
                --jq '.[] | [.filename, (.previous_filename // "")] | @tsv'); then
            echo "::error::Could not list the files of #${PR}; not merging."
            exit 1
          fi
          listed=$(printf '%s' "$files" | grep -c . || true)
          if [ -z "$head_sha" ] || [ "$listed" != "$expected" ]; then
            echo "::error::#${PR} reports ${expected} changed files but ${listed} were listed; not merging."
            exit 1
          fi
          # tests/test_auto_merge_protected_paths.py reads this assignment, so
          # keep it a single line of the form protected_re='...'.
          protected_re='^platform-gitops/agent-platform/|^platform-gitops/agents-state/[^/]+/proposals/[^/]+/\.status\.yaml$|^scripts/release-gate\.py$|^platform-gitops/release-gates\.yaml$|^platform-gitops/argo-workflows/scripts/release-gate-guard\.sh$|^platform-gitops/argo-workflows/cluster-templates/(tpl-git-commit|tpl-validate-tenant|wft-add-custom-domain|wft-deploy-service|wft-provision-database|wft-remove-custom-domain|wft-rollback-service)\.yaml$|^\.github/workflows/(auto-merge\.yml|gitops-bump\.yaml|release-deploy\.yaml|release-gate-watch\.yml|validate-manifests\.yml)$|^tests/test_(release_gate|auto_merge_protected_paths|release_deploy_bump|gitops_bump_inputs|wft_deploy_service_autoscaling_values)[a-z_]*\.py$'
          # grep exits 1 for "no match" (an empty set) and 2 or more for an
          # error such as an invalid pattern. Only 1 may read as empty.
          rc=0
          protected=$(printf '%s\n' "$files" | tr '\t' '\n' | grep -E "$protected_re") || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::Path check failed (grep exit ${rc}); not merging."
            exit 1
          fi
          # portal-allowlist/* PRs may only auto-merge if they do not widen exposure.
          # A widening touches baseline.json and requires an explicit human merge.
          if [[ "$HEAD_REF" =~ ^portal-allowlist/ ]]; then
            rc=0
            portal_widening=$(printf '%s\n' "$files" | tr '\t' '\n' | grep -E \
              '^infrastructure/cloudflare/portal/allowlists/baseline\.json$') || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::Portal path check failed (grep exit ${rc}); not merging."
              exit 1
            fi
            if [ -n "$portal_widening" ]; then
              protected=$(printf '%s\n%s\n' "$protected" "$portal_widening" | grep -v '^$' || true)
            fi
          fi
          # release-bump/* PRs (release-deploy.yaml / gitops-bump.yaml, PR
          # route of mctlhq/mctl-gitops#2543) merge only when the App opened
          # them from this repository AND every changed line moves an image
          # tag and nothing else. Fail closed: a diff that cannot be read in
          # full, or one that the guard does not accept, is a human merge.
          if [[ "$HEAD_REF" =~ ^release-bump/ ]]; then
            bump_problem=""
            if [ "$PR_AUTHOR" != "mctl-gitops-pr[bot]" ]; then
              bump_problem="author is ${PR_AUTHOR}, not the release-bump App"
            elif [ "$HEAD_REPO" != "$REPO" ]; then
              bump_problem="head is not in ${REPO}"
            elif ! gh api -H "Accept: application/vnd.github.diff" \
                  "repos/${REPO}/compare/main...${head_sha}" > "$RUNNER_TEMP/pr.diff"; then
              bump_problem="the diff of ${head_sha} could not be read"
            elif ! python3 scripts/release-bump-diff-guard.py < "$RUNNER_TEMP/pr.diff"; then
              bump_problem="the diff is not a pure image tag move"
            fi
            if [ -n "$bump_problem" ]; then
              protected=$(printf '%s\nrelease-bump: %s\n' "$protected" "$bump_problem" | grep -v '^$' || true)
            fi
          fi
          if [ -n "$protected" ]; then
            echo "::notice::#${PR} touches paths that need a human merge; leaving it open:"
            printf '%s\n' "$protected"
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Merge PR
        if: steps.guard.outputs.merge == 'true' && !startsWith(github.event.pull_request.head.ref, 'release-bump/')
        run: |
          gh pr merge "$PR" \
            --merge --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.guard.outputs.head_sha }}
      # release-bump/*: the review usually lands before the required checks
      # finish, and the repository does not allow GitHub auto-merge, so wait here
      # for the PR to become mergeable under every ruleset rule (CLEAN) and merge
      # exactly the head the guard judged. A moved head, a conflict or a timeout
      # leaves the PR open; a push re-runs the review and this workflow.
      - name: Merge release-bump PR once the required checks pass
        if: steps.guard.outputs.merge == 'true' && startsWith(github.event.pull_request.head.ref, 'release-bump/')
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          while :; do
            if ! view=$(gh pr view "$PR" --repo "$REPO" --json headRefOid,mergeStateStatus --jq '"\(.headRefOid) \(.mergeStateStatus)"'); then
              echo "::error::could not read #${PR}; not merging."
              exit 1
            fi
            cur=${view%% *}
            state=${view##* }
            if [ "$cur" != "$HEAD_SHA" ]; then
              echo "::notice::#${PR} head moved from ${HEAD_SHA} to ${cur}; the new head gets its own review."
              exit 0
            fi
            case "$state" in
              CLEAN)
                gh pr merge "$PR" --merge --delete-branch --match-head-commit "$HEAD_SHA" --repo "$REPO"
                exit 0 ;;
              BLOCKED|UNSTABLE|BEHIND|UNKNOWN|HAS_HOOKS) ;;
              *) echo "::error::#${PR} is ${state}; not merging."; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::#${PR} did not become mergeable within 45 minutes (${state}); not merging."
              exit 1
            fi
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.guard.outputs.head_sha }}
