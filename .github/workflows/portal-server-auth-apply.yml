name: Portal Server Auth Apply

# Applies infrastructure/cloudflare/portal/mcp-portal-server-auth.json to the
# Cloudflare MCP portal's upstream servers — the OAuth registration, and above
# all the scope the portal asks each upstream for (#1111, .github#47 Phase 3).
#
# This is the second thing in this repository that writes to Cloudflare from
# CI, and it is shaped exactly like the first (cloudflare-apply.yml), for the
# same reasons:
#
#   * Deliberately manual. Merging the file does not change Cloudflare; a human
#     dispatches this run. "Reviewed" and "live" stay two decisions, so a
#     rollback is a decision too and not a race with the next merge.
#   * Not a reconciler. The scheduled `--check` in cloudflare-drift.yml fails
#     closed and stops there; blind reconciliation would silently erase
#     whatever a human did during an incident.
#   * Two jobs, and the split is the point. `plan` runs with the read-only
#     credential and publishes what it would do; `apply` waits for a human to
#     approve *that*, then proves the comparison has not changed underneath
#     before writing. A single gated job would put the approval before the
#     plan existed — approving an intention rather than a change.
#
# What it does NOT share with cloudflare-apply.yml is OpenTofu. The portal was
# created through the API and the dashboard, and declarative ownership is an
# import task (#1092). Until that lands the registration is applied by
# scripts/portal-server-auth-apply.sh from the repository-pinned file — so the
# plan/apply pair here is over that script's `--check` output, not over a tofu
# plan. When the import lands, this workflow goes away with the script.
#
# The script refuses to apply anything but the blob at HEAD (it checks the file
# is tracked and `git diff --quiet HEAD`), so what a run applies is decided by
# the ref it checks out, never by the runner's working copy. actions/checkout
# leaves a real git checkout at that ref, which is what makes that check mean
# something here.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group, not one per anything: the file names a single portal and the
  # script walks every server in it, so two runs always contend for the same
  # surface. Deliberately NOT the group the drift check uses — a run holds its
  # group from the moment `plan` starts until `apply` finishes, and `apply`
  # sits in `waiting` on the environment reviewer for as long as that takes
  # (GitHub allows 30 days). GitHub keeps one running and one pending member
  # per group and replaces the pending one, so sharing a group with the
  # scheduled check means each night's check cancels the previous pending one:
  # no drift detection at all, silently, for the whole wait.
  #
  # There is no lock to protect here in the first place. The API PUT merges and
  # this script sends only `auth_credentials`; a check reading mid-apply sees
  # the old registration or the new one. The worst case is a spurious drift
  # alert during the seconds an apply runs, which fails closed and costs one
  # look.
  group: portal-server-auth-apply
  cancel-in-progress: false

env:
  # Not a secret, and deliberately a literal rather than one. This account id
  # is committed in a dozen places already — the `account_id` default in
  # infrastructure/cloudflare/account/versions.tf, every R2 endpoint host in
  # backend.tf, opentofu-state-backup.yml and .github/scripts/
  # cloudflare-assert-backend.sh — because it is an address, not a
  # credential: it grants nothing without the token, and it appears in the
  # path of every API URL below. Hiding it in a secret would only make the one
  # question worth asking of a Cloudflare write ("which account did this run
  # write to?") unanswerable from the log.
  #
  # Declared once at workflow level and inherited by both jobs, which is legal
  # for a literal — unlike `runner.*`, which does not exist at this level and
  # makes the whole workflow fail to parse if referenced here.
  CLOUDFLARE_ACCOUNT_ID: 6a09f637d20e1f66a8e9d45ebe778058

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest

    # No environment, and only the read-only credential. This job exists to be
    # looked at, so it has to run before anyone approves anything.
    if: github.ref == 'refs/heads/main'

    outputs:
      digest: ${{ steps.check.outputs.digest }}

    env:
      # The repository-wide read credential, the same one cloudflare-plan.yml
      # and cloudflare-drift.yml use. It must carry Account -> AI Controls
      # read for `GET .../access/ai-controls/mcp/servers/{id}` to answer; that
      # has NOT been verified from here (CI holds the token, this file does
      # not). A token without it fails this job loudly on the first read, with
      # the API's own error text — which is the correct outcome either way,
      # since a plan nobody can compute must not become an apply.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      # A real checkout, with history irrelevant but the index and HEAD very
      # much not: the script compares the file on disk against HEAD and refuses
      # if they differ. fetch-depth 1 still provides both.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # `--check` exits 1 on drift, which is the *normal* case for a run
      # someone dispatched to apply something — so exit 1 cannot fail this job.
      # It also exits 1 on a hard failure (file not tracked, API read refused,
      # the upstream repointed at another hostname), and the script does not
      # distinguish the two in its status. That is fine here and deliberately
      # not papered over: both mean "a human must read this output", both are
      # carried into the digest below, and a hard failure that survives to the
      # apply job fails it there — where the write would have happened.
      #
      # Exit 2 is the script's usage/dependency status and is a real failure.
      - name: Compare live registration against the committed file
        id: check
        run: |
          set -uo pipefail
          set +e
          scripts/portal-server-auth-apply.sh --check > check.txt 2>&1
          code=$?
          set -e
          cat check.txt
          if [ "$code" -gt 1 ]; then
            echo "::error::portal-server-auth-apply.sh --check exited $code (usage or missing dependency)"
            exit "$code"
          fi
          if [ ! -s check.txt ]; then
            echo "::error::--check produced no output at all; refusing to treat that as a comparison"
            exit 1
          fi

          # The digest is what crosses the job boundary. It is over the
          # comparison the approver read — live versus committed, per field —
          # so the apply job can prove the thing being approved is still the
          # thing being applied. The committed side cannot move within a run
          # (both jobs check out the same ref, and the script refuses anything
          # but HEAD), so what this actually pins is the live side: an
          # out-of-band change to the registration between approval and write.
          digest=$(sha256sum < check.txt | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The body itself, not just the diff. `--dry-run` prints the exact
      # `auth_credentials` blob the apply would PUT, which is the only place
      # the scope about to be requested is visible as a value rather than as a
      # difference. It re-reads the live server, so it costs one more GET and
      # nothing else.
      - name: Show the body the apply would send
        id: dryrun
        run: |
          set -uo pipefail
          set +e
          scripts/portal-server-auth-apply.sh --dry-run > dryrun.txt 2>&1
          code=$?
          set -e
          cat dryrun.txt
          [ "$code" -le 1 ] || exit "$code"

      - name: Summarize
        if: always()
        env:
          CODE: ${{ steps.check.outputs.code }}
          DIGEST: ${{ steps.check.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### plan \`infrastructure/cloudflare/portal/mcp-portal-server-auth.json\`"
            echo
            if [ "${CODE:-}" = "0" ]; then
              echo "> [!NOTE]"
              echo "> Every server already matches the committed file. An apply would rewrite the"
              echo "> same registration — harmless, and also pointless."
            else
              echo "> [!WARNING]"
              echo "> The live registration differs from the committed file, or it could not be read."
              echo "> Read the comparison below before approving: a hard failure (an upstream"
              echo "> repointed, the read refused) looks like drift in this status and is not one."
            fi
            echo
            echo "Comparison digest \`${DIGEST:0:16}\` — apply refuses if the live side has moved by then."
            echo
            echo "<details><summary>--check</summary>"
            echo
            echo '```'
            cat check.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>--dry-run (the body the apply would send)</summary>"
            echo
            echo '```'
            cat dryrun.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "After an apply, the upstream must be signed out and back in in the portal:"
            echo "a refresh is intersected with the family's original grant, so a new scope"
            echo "does not reach a live session."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub
        if: always()
        run: rm -f check.txt dryrun.txt

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-latest

    # Two layers, the same pair cloudflare-apply.yml and opentofu-state-backup.yml
    # use and for the same reason: workflow_dispatch accepts a ref, so without
    # them a rewritten copy of this file on any branch would run with the
    # writable credential.
    #
    #   * the `if` is visible in review but lives in YAML a branch controls, so
    #     a rewritten copy can simply drop it;
    #   * the cloudflare-apply environment's deployment-branch policy allows
    #     `main` alone and lives in repository settings, outside that branch's
    #     reach — but it is not verifiable from this file, and GitHub silently
    #     creates a referenced environment *unprotected* if it does not exist.
    #
    # Verify both are real, do not assume:
    #   gh api repos/mctlhq/mctl-gitops/environments/cloudflare-apply/deployment-branch-policies
    #   gh api repos/mctlhq/mctl-gitops/environments/cloudflare-apply --jq .protection_rules
    # Expected: exactly one policy named "main", and a required reviewer.
    # Measured 2026-09-12: both present.
    if: github.ref == 'refs/heads/main'
    environment: cloudflare-apply

    env:
      # An ENVIRONMENT secret on `cloudflare-apply`, never a repository secret.
      # This is load-bearing, not a preference: a repository secret is readable
      # by ANY workflow in the repository, so a contributor could push a branch
      # carrying a new workflow that names it and omits `environment:` entirely
      # — the branch policy above never applies, because it protects this file
      # rather than the credential. Environment secrets are only issued to a
      # job that requests the environment, which is what makes the two layers
      # above mean anything.
      #   gh api repos/mctlhq/mctl-gitops/environments/cloudflare-apply/secrets
      # should list it; `gh secret list` (repository scope) must not.
      #
      # Its own token, not one of the four per-root apply tokens: those are
      # scoped per zone and per account root for tofu, and this writes to a
      # different surface entirely (Account -> AI Controls / MCP portal). It
      # needs write there and nothing else — in particular no DNS and no zone
      # scope, so an apply of the wrong file cannot reach either.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_APPLY_TOKEN_PORTAL }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Require the write token
        run: |
          set -euo pipefail
          # Tested for emptiness, never printed or compared against a literal.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CF_APPLY_TOKEN_PORTAL is not set — add it to the cloudflare-apply ENVIRONMENT secrets (not repository secrets), scoped to Account -> AI Controls write"
            exit 1
          fi

      # The approval was given against the plan job's summary. This proves the
      # comparison about to be applied is still that one.
      #
      # A mismatch is not necessarily an attack; the ordinary cause is
      # out-of-band drift arriving between the two jobs — someone editing the
      # registration in the dashboard while the approval sat waiting. Either
      # way the answer is the same: stop and let a human look. Re-dispatching
      # produces a fresh summary to approve on its own terms.
      - name: Assert the approved comparison is still the comparison
        env:
          EXPECTED: ${{ needs.plan.outputs.digest }}
        run: |
          set -uo pipefail
          set +e
          scripts/portal-server-auth-apply.sh --check > check.txt 2>&1
          code=$?
          set -e
          cat check.txt
          [ "$code" -le 1 ] || exit "$code"
          actual=$(sha256sum < check.txt | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::the live registration changed after approval (approved ${EXPECTED:0:16}, now ${actual:0:16}) — refusing to apply"
            echo "Cloudflare most likely changed out of band between the plan job and this one."
            exit 1
          fi
          echo "comparison digest matches the approved one (${actual:0:16})"

      # The script does the rest, and it is the part that cannot be moved into
      # a workflow: it prints the pre-write projection as a restore point
      # before every write, reads the stored blob back afterwards rather than
      # trusting the 200, and fails — loudly, with that restore point — if what
      # came back is not what was sent. The blob is write-only and its shape is
      # mirrored from a projection rather than published in a schema, so a
      # server that accepted the call and stored something else would otherwise
      # read as a clean apply.
      - name: Apply
        run: scripts/portal-server-auth-apply.sh 2>&1 | tee apply.txt

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### apply \`infrastructure/cloudflare/portal/mcp-portal-server-auth.json\`"
            echo
            echo '```'
            cat apply.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "> [!IMPORTANT]"
            echo "> A live session keeps its old grant. Sign the upstream out and back in in"
            echo "> the portal (mcp.mctl.ai) for the new scope to reach a token — a refresh is"
            echo "> intersected with the family's original grant and cannot widen it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub
        if: always()
        run: rm -f check.txt apply.txt
