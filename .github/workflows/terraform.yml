name: k3s-preview (OpenTofu)

# The preprod cluster itself: nodes, cloud firewall, network, load balancer
# and the k3s configuration the module writes over SSH (#1534).
#
# Two jobs, the same split cloudflare-apply.yml uses and for the same reason.
# `plan` runs on every push to main and on every dispatch, needs nobody's
# approval and publishes what an apply would do. `apply` runs only on a
# dispatch with apply: true, waits for a reviewer on the k3s-apply
# environment, re-plans, and refuses unless its plan is the one `plan`
# published. A single gated job would put the approval before the plan
# existed: approving an intention rather than a change.
#
# Merging does not apply anything. Like every other root in this repository,
# "reviewed" and "live" are two separate decisions.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/k3s-preview/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Run tofu apply after approval on k3s-apply (default: plan only)"
        type: boolean
        default: false
      allow_destroy:
        description: "Permit a plan that destroys real infrastructure (servers, network, keys...)"
        type: boolean
        default: false
      allow_reprovision:
        description: "Permit re-running node provisioners (k3s config rewrite and restart)"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time for the whole workflow, so a plan cannot race an apply
# holding the state lock. A run waiting for approval holds the group. Actions
# keeps at most ONE pending run per group: a second push arriving meanwhile
# cancels the first pending one rather than queueing behind it. That is
# fail-safe (a cancelled plan applies nothing), and the newest commit's plan
# is the one that runs.
concurrency:
  group: terraform-k3s-preview
  cancel-in-progress: false

jobs:
  wrong-ref:
    name: wrong-ref
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a run outside main
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::k3s-preview plans and applies run from refs/heads/main only, not $REF"
          exit 1

  plan:
    name: plan
    runs-on: ubuntu-latest

    # Environment k3s-plan: deployment branch policy `main` only, NO reviewer.
    # It exists to hold the etcd snapshot credential outside repository
    # secrets (#1118): a repository secret is readable by any workflow a
    # branch adds, an environment secret only by a job on an allowed branch.
    # Plans need that credential because it is part of local.k3s-config; a
    # plan without it proposes rewriting the control-plane k3s config.
    #
    # Two layers, as for apply. The k3s-plan environment's branch policy
    # refuses another branch, but GitHub silently creates a referenced
    # environment UNPROTECTED if it is ever deleted or renamed, and this job
    # holds the etcd credential. So the job also requires main itself; the
    # `wrong-ref` job below makes a dispatch from elsewhere fail loudly rather
    # than finish green with every job skipped.
    if: github.ref == 'refs/heads/main'
    environment: k3s-plan

    defaults:
      run:
        working-directory: infrastructure/k3s-preview

    outputs:
      digest: ${{ steps.summary.outputs.digest }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      # The etcd snapshot credential is NOT the state-backend credential. They
      # are separate R2 tokens for separate buckets, and the etcd pair is part
      # of local.k3s-config: a wrong or empty pair makes CI render a k3s
      # configuration that differs from the live node, so
      # terraform_data.control_plane_config plans as a replacement and its
      # provisioner rewrites /etc/rancher/k3s/config.yaml and restarts k3s on
      # the SINGLE control-plane node. Found while applying #1119.
      TF_VAR_etcd_s3_access_key: ${{ secrets.ETCD_S3_ACCESS_KEY_ID }}
      TF_VAR_etcd_s3_secret_key: ${{ secrets.ETCD_S3_SECRET_ACCESS_KEY }}
      # The key hcloud_ssh_key.k3s was created from, see kube.tf. A public
      # key, but a repository SECRET rather than a variable: its comment names
      # the operator's machine, and step env values of a variable are printed
      # in the logs of this public repository; a secret is masked.
      TF_VAR_ssh_public_key: ${{ secrets.K3S_SSH_PUBLIC_KEY }}
      # Two copies, one per job: Actions cannot share an env value across
      # jobs. They MUST stay identical, or the digest compares two different
      # projections. private_key is removed wherever it appears: the plan job
      # holds a throwaway key and the apply job the deploy key, so the one
      # attribute that carries it (ssh_sensitive_resource.kubeconfig) always
      # differs, and the hash must not be computed over a private key anyway.
      # With it removed, an update that changed nothing else is dropped, and
      # so are no-ops: the throwaway key always plans that update, the deploy
      # key does not once the state holds it. Measured 2026-10-04 against the
      # live state: the operator's key, the deploy key and a throwaway key give
      # one digest.
      PLAN_PROJECTION: >-
        {resource_changes: [ (.resource_changes // [])[]
           | walk(if type == "object" then del(.private_key) else . end)
           | select(.change.actions != ["no-op"])
           | select(.change.actions != ["update"] or .change.before != .change.after) ]
           | sort_by(.address),
         output_changes: (.output_changes // {})}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # A plan that silently runs without these is not a plan of the cluster,
      # it is a plan of a different k3s config and a different Hetzner key.
      # Both used to be "warn and continue"; a misleading plan is now a red
      # job, because the apply job compares its own plan against this one.
      - name: Preflight the plan inputs
        run: |
          set -euo pipefail
          fail=0
          [ -n "$TF_VAR_hcloud_token" ] || { echo "::error::HCLOUD_TOKEN is not set"; fail=1; }
          [ -n "$TF_VAR_etcd_s3_access_key" ] || { echo "::error::ETCD_S3_ACCESS_KEY_ID is not set on environment k3s-plan"; fail=1; }
          [ -n "$TF_VAR_etcd_s3_secret_key" ] || { echo "::error::ETCD_S3_SECRET_ACCESS_KEY is not set on environment k3s-plan"; fail=1; }
          case "$TF_VAR_ssh_public_key" in
            ssh-*) ;;
            *) echo "::error::repository secret K3S_SSH_PUBLIC_KEY is empty or not an SSH public key; without it the plan replaces hcloud_ssh_key.k3s"; fail=1 ;;
          esac
          exit "$fail"

      # kube.tf reads ~/.ssh/id_ed25519 with file(). A plan never connects to
      # a node, so a throwaway key is enough here; the only plan attribute it
      # reaches is removed from the digest by PLAN_PROJECTION.
      - name: Throwaway SSH key for the plan
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "ci-plan-throwaway" -q

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: Tofu Init
        run: tofu init -input=false

      - name: Tofu Validate
        run: tofu validate

      # -lock=false: this job only reads. The apply job takes the lock.
      - name: Tofu Plan
        run: |
          set -euo pipefail
          tofu plan -no-color -input=false -lock=false -out=tfplan | tee plan.txt
          tofu show -no-color -json tfplan > plan.json

      - name: Summarize
        id: summary
        run: |
          set -euo pipefail
          digest=$(jq -S -c "$PLAN_PROJECTION" plan.json | sha256sum | cut -d' ' -f1)
          {
            echo "### plan \`infrastructure/k3s-preview\`"
            echo
            grep -E '^Plan:|^No changes' plan.txt || true
            echo
            echo "Plan digest \`${digest:0:16}\` — the apply job refuses if its own plan differs."
            echo
            echo '```'
            grep -E '^  # ' plan.txt | grep -v 'data\.cloudinit_config' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The same guard as in the apply job, on EVERY plan, push included. The
      # push-to-main plan is this root's drift alarm: a merge that would
      # replace control_plane_config (rewrite the k3s config, restart k3s on
      # the single control plane) turns this job red at merge time instead of
      # listing the address among the other "#" lines of a green run, which is
      # how 2026-09-09 went unnoticed. An intended change of that kind is
      # dispatched with the matching allow_* input. On a push, inputs are
      # empty, so nothing is allowed.
      - name: Guard the plan
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
          ALLOW_REPROVISION: ${{ inputs.allow_reprovision }}
        run: ../../.github/scripts/k3s-plan-guard.sh plan.json

      - name: Scrub
        if: always()
        run: rm -f tfplan plan.json plan.txt ~/.ssh/id_ed25519 ~/.ssh/id_ed25519.pub

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-latest

    # Two layers, as in cloudflare-apply.yml: the `if` is visible in review
    # but lives in YAML a branch controls; the k3s-apply environment's
    # deployment-branch policy (main only) and required reviewer live in
    # repository settings, outside a branch's reach. GitHub silently creates
    # a referenced environment UNPROTECTED if it does not exist, so verify:
    #   gh api repos/mctlhq/mctl-gitops/environments/k3s-apply --jq .protection_rules
    #   gh api repos/mctlhq/mctl-gitops/environments/k3s-apply/deployment-branch-policies
    # Expected: a required reviewer, and exactly one policy named "main".
    if: inputs.apply == true && github.ref == 'refs/heads/main'
    environment: k3s-apply

    defaults:
      run:
        working-directory: infrastructure/k3s-preview

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      # Environment secrets of k3s-apply, never repository secrets (#1118):
      #   gh api repos/mctlhq/mctl-gitops/environments/k3s-apply/secrets
      # lists SSH_PRIVATE_KEY, ETCD_S3_ACCESS_KEY_ID, ETCD_S3_SECRET_ACCESS_KEY.
      TF_VAR_etcd_s3_access_key: ${{ secrets.ETCD_S3_ACCESS_KEY_ID }}
      TF_VAR_etcd_s3_secret_key: ${{ secrets.ETCD_S3_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_public_key: ${{ secrets.K3S_SSH_PUBLIC_KEY }}
      EXPECTED_DIGEST: ${{ needs.plan.outputs.digest }}
      # Identical to the plan job's copy. Change both, or neither.
      PLAN_PROJECTION: >-
        {resource_changes: [ (.resource_changes // [])[]
           | walk(if type == "object" then del(.private_key) else . end)
           | select(.change.actions != ["no-op"])
           | select(.change.actions != ["update"] or .change.before != .change.after) ]
           | sort_by(.address),
         output_changes: (.output_changes // {})}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Everything an apply needs, checked BEFORE OpenTofu runs. A plan
      # destroys before it creates: on 2026-09-09 an apply reached
      # hcloud_ssh_key with an empty SSH_PUBLIC_KEY, destroyed the live key,
      # and failed to recreate it.
      - name: Preflight the apply credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          fail=0
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::SSH_PRIVATE_KEY is not set on environment k3s-apply"; fail=1; }
          [ -n "$TF_VAR_hcloud_token" ] || { echo "::error::HCLOUD_TOKEN is not set"; fail=1; }
          [ -n "$TF_VAR_etcd_s3_access_key" ] || { echo "::error::ETCD_S3_ACCESS_KEY_ID is not set on environment k3s-apply"; fail=1; }
          [ -n "$TF_VAR_etcd_s3_secret_key" ] || { echo "::error::ETCD_S3_SECRET_ACCESS_KEY is not set on environment k3s-apply"; fail=1; }
          case "$TF_VAR_ssh_public_key" in
            ssh-*) ;;
            *) echo "::error::repository secret K3S_SSH_PUBLIC_KEY is empty or not an SSH public key"; fail=1 ;;
          esac
          [ -n "$EXPECTED_DIGEST" ] || { echo "::error::the plan job published no digest"; fail=1; }
          exit "$fail"

      # The dedicated deploy key (k3s-preview-ci-deploy), authorised on every
      # node; its public half is in kube.tf. Through env:, never interpolated
      # into the script.
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Derives the public half, which also proves the key parses. kube.tf
          # names ~/.ssh/id_ed25519.pub in the unselected arm of a conditional;
          # the plan job has that file from ssh-keygen, so this job must too, or
          # the two jobs differ in a way the digest cannot see.
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: Tofu Init
        run: tofu init -input=false

      # -out, so the apply executes exactly this plan, and the digest proves
      # it is the plan the unapproved job published.
      - name: Tofu Plan
        run: |
          set -euo pipefail
          tofu plan -no-color -input=false -out=tfplan | tee plan.txt
          tofu show -no-color -json tfplan > plan.json

      - name: Compare with the published plan
        run: |
          set -euo pipefail
          digest=$(jq -S -c "$PLAN_PROJECTION" plan.json | sha256sum | cut -d' ' -f1)
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::this plan (${digest:0:16}) is not the one the plan job published (${EXPECTED_DIGEST:0:16}); something changed after approval. Re-dispatch and review the new plan."
            exit 1
          fi
          echo "plan matches the published digest ${digest:0:16}"

      - name: Guard the plan
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
          ALLOW_REPROVISION: ${{ inputs.allow_reprovision }}
        run: ../../.github/scripts/k3s-plan-guard.sh plan.json

      - name: Tofu Apply
        run: tofu apply -no-color -input=false tfplan

      - name: Scrub
        if: always()
        run: rm -f tfplan plan.json plan.txt ~/.ssh/id_ed25519 ~/.ssh/id_ed25519.pub

  notify:
    name: notify
    needs: [plan, apply]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram on failure
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master 2026-05
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *mctl-gitops k3s-preview (OpenTofu) failed*
            Branch: `${{ github.ref_name }}`
            Apply: `${{ inputs.apply }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
