name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/k3s-preview/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (default: plan only)"
        type: boolean
        default: false
      allow_destroy:
        description: "Permit a plan that destroys non-bookkeeping resources"
        type: boolean
        default: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/k3s-preview
    
    # Prevent concurrent runs
    concurrency:
      group: terraform-k3s-preview
      cancel-in-progress: false
    
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      # The etcd snapshot credential is NOT the state-backend credential, which
      # is what this used to pass. They are separate R2 tokens for separate
      # buckets, and the etcd pair is part of local.k3s-config: feeding the
      # wrong one makes CI render a k3s configuration that differs from the
      # live node, so terraform_data.control_plane_config plans as a
      # replacement and its provisioner rewrites /etc/rancher/k3s/config.yaml
      # and restarts k3s on the SINGLE control-plane node. A local plan with
      # the right credential reports "No changes"; the drift was between CI and
      # reality, not between Git and reality. Found while applying #1119.
      TF_VAR_etcd_s3_access_key: ${{ secrets.ETCD_S3_ACCESS_KEY_ID }}
      TF_VAR_etcd_s3_secret_key: ${{ secrets.ETCD_S3_SECRET_ACCESS_KEY }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      # Everything an apply needs, checked BEFORE Terraform runs.
      #
      # This exists because Terraform destroys before it creates. On
      # 2026-09-09 an apply reached hcloud_ssh_key with an empty
      # SSH_PUBLIC_KEY, destroyed the live key, and then failed to recreate it
      # ("Must not begin with a whitespace character" -- the file held the lone
      # newline that printf writes for an empty secret). Neither SSH secret
      # existed at all, so the apply path could never have worked; it simply
      # had not been exercised. A cheap check here turns that into a job that
      # stops before touching anything.
      - name: Preflight the apply credentials
        if: inputs.apply == true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          fail=0
          require() {
            if [ -z "$2" ]; then
              echo "::error::$1 is empty or not set -- an apply needs it"
              fail=1
            fi
          }
          require SSH_PRIVATE_KEY "$SSH_PRIVATE_KEY"
          require SSH_PUBLIC_KEY  "$SSH_PUBLIC_KEY"
          require HCLOUD_TOKEN    "$TF_VAR_hcloud_token"
          # Empty etcd credentials are not "snapshots stay off" on this
          # cluster, they are "turn snapshots off" -- and that rewrites the
          # control-plane k3s config. Refuse rather than plan it by accident.
          require ETCD_S3_ACCESS_KEY_ID     "$TF_VAR_etcd_s3_access_key"
          require ETCD_S3_SECRET_ACCESS_KEY "$TF_VAR_etcd_s3_secret_key"
          # The empty case is already reported above; saying it twice points at
          # two root causes where there is one.
          case "$SSH_PUBLIC_KEY" in
            "") ;;
            ssh-*) ;;
            *) echo "::error::SSH_PUBLIC_KEY does not start with 'ssh-'; Hetzner will reject it and the existing key is destroyed first"
               fail=1 ;;
          esac
          exit "$fail"

      # Plan-only runs do not need the SSH keys and are not gated by the
      # preflight above, but they DO read the etcd credentials: they are part
      # of local.k3s-config, so a blank pair makes the plan propose replacing
      # terraform_data.control_plane_config. That is an artefact of the missing
      # secret, not drift in Git, and a reader who does not know that will
      # reasonably think the control plane is about to be rewritten. Say so
      # instead of letting the plan speak for itself. Not a failure: a
      # plan-only run is allowed to be incomplete, it just may not be silent
      # about it.
      - name: Warn when a plan will be misleading
        if: inputs.apply != true
        run: |
          if [ -z "$TF_VAR_etcd_s3_access_key" ] || [ -z "$TF_VAR_etcd_s3_secret_key" ]; then
            echo "::warning::ETCD_S3_ACCESS_KEY_ID / ETCD_S3_SECRET_ACCESS_KEY are not set, so this plan renders the k3s config without etcd snapshots and will propose replacing terraform_data.control_plane_config. That is the missing secret, not drift. See #1139."
          fi

      - name: Setup SSH keys
        if: inputs.apply == true
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_ed25519.pub
          chmod 600 ~/.ssh/id_ed25519
      
      # Dummy keys for plan/validate so file() calls don't fail
      - name: Setup dummy SSH keys (plan only)
        if: inputs.apply != true
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "ci-plan-dummy" -q
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.0
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate
      
      # -out, so the apply below executes the plan that was printed here
      # rather than computing a second one nobody saw. The previous shape --
      # an advisory plan with continue-on-error, then a bare
      # `terraform apply -auto-approve` -- meant the destructive plan of
      # 2026-09-09 was never shown before it ran.
      #
      # continue-on-error is gone with it: a plan that cannot be produced is a
      # failure, not a note.
      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan

      # A cluster root should not be destroying anything during a routine
      # apply. terraform_data and local_file are bookkeeping -- they carry
      # provisioner runs and generated files, and replacing them is normal.
      # Anything else being destroyed means the plan is not what was intended,
      # and the run stops so a person can look.
      - name: Refuse to destroy real infrastructure
        if: inputs.apply == true
        run: |
          set -euo pipefail
          terraform show -json tfplan > tfplan.json
          doomed=$(jq -r '
            [ .resource_changes[]?
              | select(.change.actions | index("delete"))
              | select(.type | test("^(terraform_data|local_file|local_sensitive_file)$") | not)
              | "\(.address) (\(.change.actions | join(",")))"
            ] | .[]' tfplan.json)
          if [ -n "$doomed" ]; then
            echo "::error::this plan destroys resources that are not bookkeeping:"
            printf '%s\n' "$doomed"
            echo "::error::re-run with allow_destroy: true only if that is genuinely intended"
            [ "${{ inputs.allow_destroy }}" = "true" ] || exit 1
            echo "::warning::allow_destroy was set; continuing"
          fi

      - name: Terraform Apply
        if: inputs.apply == true
        run: terraform apply -no-color -input=false tfplan

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master 2026-05
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *mctl-gitops terraform failed*
            Branch: `${{ github.ref_name }}`
            Apply: `${{ inputs.apply }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
