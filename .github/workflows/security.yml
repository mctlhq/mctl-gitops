name: security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "7 5 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3
          # Under .github/ rather than at the repo root, because
          # no-root-yaml.yml rejects any tracked top-level *.yaml — that guard
          # exists because stray root YAML bypasses ArgoCD's lifecycle and is
          # how plaintext-secret one-shots got committed. Trivy only
          # auto-detects an ignore file at the root, so the path has to be
          # passed explicitly here; that is the same explicitness that keeps a
          # silent failure to load it from quietly re-opening the gate.
          trivyignores: .github/trivyignore.yaml
