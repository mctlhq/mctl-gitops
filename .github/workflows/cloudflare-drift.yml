name: Cloudflare Drift

# Reports Cloudflare configuration that no longer matches Git (.github#47 Phase 3).
#
# This workflow never applies. Drift fails closed: a run goes red and stays red
# until someone decides whether the out-of-band change should be imported or
# reverted. Blind reconciliation would silently erase whatever a human did
# during an incident.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: discover roots
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.find.outputs.roots }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: find
        run: |
          set -euo pipefail
          # find exits 1 on a missing start directory, which under set -e would
          # abort discovery and fail the required check — permanently, with no
          # way to merge the pull request that removed the last root, label or
          # not. An absent directory is a legitimate state: no roots.
          # -path .../modules -prune: a shared module can carry its own
          # versions.tf, and planning one as a root fails on its required
          # inputs — on every pull request and every scheduled drift run.
          # versions.tf.json is included because OpenTofu loads JSON
          # configuration too, so a root written that way would otherwise be
          # invisible to discovery while the check reported success.
          # A root on local state has no remote state to compare against: on a
          # fresh runner its plan is computed from nothing, so it reports the
          # whole root as pending work every single night. Measured on the first
          # dispatch after the gate landed — zones/mctl-ru returned
          # "Plan: 2 to import" and exit 2, which is drift's failure signal.
          # Watching a root that cannot be watched is not a safety property; it
          # is a nightly false alarm that trains people to ignore the real one.
          # These roots are listed, with their reason, in .local-state-roots.
          .github/scripts/cloudflare-local-state-roots.sh > "$RUNNER_TEMP/local-state-roots"
          if [ -s "$RUNNER_TEMP/local-state-roots" ]; then
            echo "not watched (local state, see .local-state-roots):"
            cat "$RUNNER_TEMP/local-state-roots"
          fi
          if [ -d infrastructure/cloudflare ]; then
            # The prune pattern has to match BELOW modules/, not modules/
            # itself: -mindepth 2 stops find from applying the expression to
            # depth-1 entries at all, so pruning the directory by name never
            # fires. Measured — the module was still discovered as a root.
            found=$(find infrastructure/cloudflare -mindepth 2 \
                      -path 'infrastructure/cloudflare/modules/*' -prune -o \
                      \( -name versions.tf -o -name versions.tf.json \) -print \
                    | sed 's#/[^/]*$##' | sort -u)
            # `|| true` on its own line, not inside the pipeline: grep exits 1
            # when every root is excluded, and under pipefail that would kill
            # discovery and fail the run — the same shape as find exiting 1 on a
            # missing directory. Excluding everything is a legitimate state.
            # An entry that matches no discovered root excepts nothing, and
            # silently: drift would go on failing every night on the root the
            # entry was meant to cover. The list is short and hand-edited, so a
            # non-matching line is either a typo or stale — both worth stopping
            # for, and both fixed by one edit.
            while IFS= read -r excluded; do
              [ -n "$excluded" ] || continue
              grep -qxF -- "$excluded" <<< "$found" || {
                echo "::error::.local-state-roots lists '$excluded', which is not a discovered root"
                echo "discovered roots:"; printf '%s\n' "$found"
                exit 1
              }
            done < "$RUNNER_TEMP/local-state-roots"
            kept=$(printf '%s\n' "$found" \
                   | grep -vxF -f "$RUNNER_TEMP/local-state-roots") || true
            roots=$(printf '%s\n' "$kept" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            roots='[]'
          fi
          echo "roots=$roots" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$roots" | jq 'length')" >> "$GITHUB_OUTPUT"

  drift:
    name: drift
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.discover.outputs.roots) }}

    # Per root, and deliberately NOT the group cloudflare-apply.yml uses.
    #
    # This was one workflow-level group shared with apply until that workflow
    # grew a human approval step. A run holds its group while waiting for a
    # reviewer — up to 30 days — and GitHub replaces whatever is pending behind
    # it, so each nightly run cancelled the previous pending one and a root
    # under an unapproved apply got no drift detection at all for the wait.
    #
    # So drift and apply no longer serialise against each other. What keeps the
    # state consistent is OpenTofu's own lock, which apply takes and this job
    # does not, plus atomic R2 object writes: a plan reading mid-apply sees the
    # old state or the new one, never a torn one. The cost is a possible
    # spurious drift alert during the minutes an apply runs, which fails closed.
    #
    # Per root here still keeps two drift runs for the same root from overlapping.
    concurrency:
      group: cloudflare-tofu-${{ matrix.root }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ${{ matrix.root }}
    env:
      # Per root, because one credential no longer covers them all. The
      # repository-wide read token is zone-scoped ("read-only across the four
      # zones", All zones, no account permission -- checked against the live
      # token list), and infrastructure/cloudflare/portal describes an
      # account-level surface, so it would answer 10000 Authentication error
      # there on every run and never once compare anything.
      #
      # CF_PORTAL_READ_TOKEN is Account -> MCP Portals -> Read on this account
      # alone: verified at mint time to read a server, to be refused on a PUT,
      # and to see zero zones. An expression rather than a lookup because
      # secrets cannot be indexed by a variable -- same explicit chain as
      # cloudflare-apply.yml, and it is also the allowlist.
      CLOUDFLARE_API_TOKEN: >-
        ${{ matrix.root == 'infrastructure/cloudflare/portal'
         && secrets.CF_PORTAL_READ_TOKEN
         || secrets.CLOUDFLARE_API_TOKEN }}
      # Drift only reads. It uses the same Object-Read-only state credential as
      # the plan workflow, which is why it also passes -lock=false: taking the
      # lock would be a write this credential cannot perform.
      #
      # An apply job now exists (cloudflare-apply.yml), and this job was
      # deliberately NOT changed to exclude it — see the concurrency comment
      # above. Drift and apply may overlap: apply takes OpenTofu's lock and this
      # job takes none, and R2 object writes are atomic, so a plan reading
      # mid-apply sees the old state or the new one, never a torn one. The cost
      # is a possible spurious drift alert during the minutes an apply runs,
      # which fails closed. The alternative was blocking the detector for the
      # length of a human approval, which is worse.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_PLAN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PLAN_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # RUNNER_TEMP, exported here rather than declared in the job's env block:
      # the runner context does not exist at that level (only github, needs,
      # strategy, matrix, vars, secrets and inputs do), and referencing it there
      # makes the whole workflow fail to parse — which, for a required check,
      # means no run ever publishes the context and every pull request blocks on
      # a verdict that cannot arrive. github.workspace was legal there; runner
      # is not.
      #
      # Both paths stay out of the workspace on purpose: whatever a pull request
      # commits under those names is then simply not what OpenTofu reads.
      - name: Point OpenTofu outside the workspace
        run: |
          set -euo pipefail
          {
            echo "TF_DATA_DIR=$RUNNER_TEMP/tofu-data"
            echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/opentofu-ci.tfrc"
          } >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      # This one runs from main, so the roots are reviewed code — but the same
      # restriction costs nothing and keeps the two workflows honest about
      # which providers are allowed to run in CI.
      # Written under RUNNER_TEMP, never in the workspace. A pull request that
      # commits .opentofu-ci.tfrc as a symlink to /dev/null would otherwise have
      # this heredoc follow it — the write succeeds, the file reads back empty,
      # and OpenTofu falls back to unrestricted provider installation with the
      # allowlist apparently in place. Reproduced before fixing.
      - name: Restrict provider installation
        run: |
          set -euo pipefail
          cat > "$TF_CLI_CONFIG_FILE" <<'TFRC'
          provider_installation {
            direct {
              include = ["registry.opentofu.org/cloudflare/cloudflare"]
            }
          }
          TFRC
          grep -q 'cloudflare/cloudflare' "$TF_CLI_CONFIG_FILE"

      # -lockfile=readonly: without it, a root that committed no
      # .terraform.lock.hcl gets one minted on the runner and thrown away, so
      # the gate passes without anyone reviewing which provider build it ran
      # against — and a later release matching ~> 5.0 can change behaviour
      # under a root nobody re-reviewed.
      - name: Init
        run: tofu init -input=false -lockfile=readonly

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = drift.
      # Both 1 and 2 are failures here, but they mean different things, so the
      # summary says which one happened.
      #
      # Exit 0 has two meanings, and only one of them is coverage. OpenTofu
      # reports drift for resources it has in state, so a root whose state is
      # empty cannot produce exit 2 no matter what happens in Cloudflare — it
      # reports "in sync" forever, which is a green check with no subject.
      # That is not hypothetical: infrastructure/cloudflare/account/ held no
      # resources while Access changed materially underneath it (an app
      # repointed, a service token and a non-identity policy added,
      # allowed_idps pinned from empty to [Google]), and every scheduled run
      # said success. Exit 0 is therefore split below by whether the root
      # describes anything.
      - name: Plan
        id: plan
        # Same reason as in cloudflare-plan.yml: never expand a discovered path
        # into the script body. A root only has to be merged once for every
        # later scheduled run to re-execute whatever its name contains.
        env:
          ROOT: ${{ matrix.root }}
        run: |
          set +e
          tofu plan -input=false -no-color -lock=false -detailed-exitcode | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

          # Counted only for exit 0, where the distinction matters. `tofu state
          # list` on an empty state prints nothing and exits 0, so an empty
          # count is the answer rather than an error — but its failure is still
          # caught, because an unreadable state is not the same as an empty one
          # and must not be reported as either.
          # `grep -c .` exits 1 when it counts nothing, so it cannot be the
          # command whose status decides whether the count succeeded — an empty
          # state would look like a failed lookup, which is the one distinction
          # this block exists to make. The lookup's status is taken from
          # `tofu state list` alone; the counting is separate and always
          # succeeds.
          resources=""
          if [ "$code" = "0" ]; then
            if state_list=$(tofu state list 2>/dev/null); then
              resources=$(printf '%s' "$state_list" | grep -c . || true)
            fi
          fi

          case "$code" in
            0) if [ "$resources" = "0" ]; then
                 # Deliberately not a failure. account/ will hold zero
                 # resources until #1088 imports Access, and a scheduled
                 # workflow that is red every night is one people stop reading
                 # — which is the same disease as a green check nobody can
                 # trust. It is loud in the annotations and in the summary, and
                 # should be tightened to a failure once no root is legitimately
                 # empty.
                 echo "::warning title=Cloudflare drift::\`$ROOT\` describes no resources — this run watched nothing"
                 { echo "### \`$ROOT\` — DESCRIBES NOTHING";
                   echo;
                   echo "> [!WARNING]";
                   echo "> This root's state holds no resources, so drift cannot report on it.";
                   echo "> \`No changes\` here means the root is empty, not that Cloudflare matches Git."; } >> "$GITHUB_STEP_SUMMARY"
               elif [ -z "$resources" ]; then
                 echo "### \`$ROOT\` — in sync (resource count unavailable)" >> "$GITHUB_STEP_SUMMARY"
               else
                 echo "### \`$ROOT\` — in sync ($resources resources)" >> "$GITHUB_STEP_SUMMARY"
               fi ;;
            2) { echo "### \`$ROOT\` — DRIFT";
                 echo; echo '```terraform'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
            *) { echo "### \`$ROOT\` — plan failed (exit $code)";
                 echo; echo '```terraform';
                 cat plan.txt 2>/dev/null || echo "(no plan output captured)";
                 echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          rm -f plan.txt
          exit "$code"

      # The one field OpenTofu cannot watch. `auth_credentials` is write-only:
      # the API accepts it and never returns it, so the provider keeps what was
      # last applied in state and a refresh cannot correct it. Measured against
      # a throwaway server on 2026-09-12 -- an out-of-band PUT changed the live
      # scope and `tofu plan` stayed `no-op`. A clean plan above therefore says
      # nothing about this attribute, which is exactly when it needs checking.
      #
      # Runs only when the plan was clean: a drifted or failed plan has already
      # made this job red, and a second red says nothing new.
      - name: Check the write-only OAuth registration
        id: creds
        if: success() && matrix.root == 'infrastructure/cloudflare/portal'
        run: |
          set -uo pipefail
          # `set +e` explicitly, and it has to be a separate statement.
          # GitHub Actions runs a `run:` block as `bash -e {0}`, so errexit is
          # already on before the first line executes, and `set -uo pipefail`
          # does NOT turn it off -- it only adds -u and pipefail. Written the
          # short way, a failing selftest would still abort the step before
          # `code` was written, which is precisely the bug the rest of this
          # block exists to fix. Measured: under `bash -e`, a script whose
          # first line is `set -uo pipefail` stops at the next failing
          # command; with `set +e` after it, it continues.
          set +e
          # --selftest first, same reason as every other detector in this
          # repository: one never seen to fire is not known to work.
          #
          # Its status is folded into the same `code`
          # the rest of this step reports. Under `set -e` a failing selftest
          # exited the step before `code` was ever written, so the Telegram
          # alert fell through to the plan's exit code -- 0, since a clean
          # plan is the only way this step runs at all -- and announced a
          # drift alert with "exit code 0". A broken detector is reported as
          # 2, "could not run", which is what it is.
          "$GITHUB_WORKSPACE/scripts/portal-auth-credentials-drift.py" --selftest
          selftest=$?
          if [ "$selftest" -ne 0 ]; then
            echo "code=2" >> "$GITHUB_OUTPUT"
            { echo "### \`portal\` — the drift detector itself failed its selftest";
              echo; echo "> It was not run against Cloudflare. Fix the detector."; } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          # 2>&1 on the detector, not on the pipeline: every drift line and
          # every `[2]` diagnosis goes to stderr, so a plain `| tee` captured
          # an empty file and both failure branches below rendered an empty
          # code block -- "someone changed it outside Git" without ever saying
          # what changed.
          tofu show -json \
            | { "$GITHUB_WORKSPACE/scripts/portal-auth-credentials-drift.py" 2>&1; } \
            | tee cred.txt
          code=${PIPESTATUS[1]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "### \`portal\` — OAuth registration in sync" >> "$GITHUB_STEP_SUMMARY" ;;
            1) { echo "### \`portal\` — OAUTH REGISTRATION DRIFT";
                 echo; echo '```'; cat cred.txt; echo '```';
                 echo "> Someone changed it outside Git. \`tofu plan\` cannot see this field."; } >> "$GITHUB_STEP_SUMMARY" ;;
            *) { echo "### \`portal\` — registration check could not run (exit $code)";
                 echo; echo '```'; cat cred.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          rm -f cred.txt
          exit "$code"

      - name: Notify Telegram
        if: failure()
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master 2026-05
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # HTML, not the default Markdown: root names are directory names, and
          # an unpaired _ in one of them makes Telegram reject the whole message
          # with a 400 — losing the drift alert exactly when it matters.
          format: html
          message: |
            <b>Cloudflare drift</b> — <code>${{ matrix.root }}</code>
            ${{ steps.creds.outputs.code && steps.creds.outputs.code != '0'
             && format('OAuth registration check exit <code>{0}</code> (1 = drifted, 2 = could not run). The plan was clean; this field is invisible to it.', steps.creds.outputs.code)
             || format('Plan exit code <code>{0}</code> (2 = drift, 1 = plan error)', steps.plan.outputs.code || format('none — plan {0}', steps.plan.conclusion)) }}
            Cloudflare no longer matches Git, or a check could not run.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
