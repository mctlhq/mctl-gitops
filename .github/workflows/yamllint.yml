name: yamllint

on:
  pull_request:
    paths:
      - 'platform-gitops/**'
      - '.github/workflows/yamllint.yml'
  # Also on push, because the things most likely to write a malformed values
  # file never open a PR: the provision-database and gitops-bump workflows
  # commit straight to main. `relaxed` keeps key-duplicates at error level, so
  # this job is what would have caught the duplicate `envFrom:` in
  # services/labs/seerrsense/values.yaml (gitops#1102) — it simply never ran.
  # validate-manifests does run on that push, but `helm template` accepts
  # duplicate keys silently (last one wins), so it cannot catch this class.
  push:
    branches: [main]
    paths:
      - 'platform-gitops/**'
      - '.github/workflows/yamllint.yml'

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: yamllint (relaxed)
        run: |
          set -euo pipefail
          pipx install yamllint==1.35.1
          cat > /tmp/yamllint.yml <<'CFG'
          extends: relaxed
          # A file whose FIRST content is a bare `{{- ... }}` Go-template
          # directive is not valid YAML on its own: the parser reads `{{` as
          # the start of two nested flow mappings and dies on the `-`, which
          # no rule config changes and a leading `---` does not fix either
          # (both checked). helm-charts/ is excluded wholesale for this; the
          # named files are the ones outside it that lead with a directive —
          # the two prod placeholders, and the two issue-903 evaluation
          # templates whose entire body sits inside an `{{- if }}` gate.
          #
          # Named files rather than excluding bootstrap/templates/ as a
          # directory: that would drop 54 currently-linted templates to spare
          # 2, and the duplicate-key class this job exists to catch
          # (gitops#1102) lives in exactly those files.
          ignore: |
            platform-gitops/helm-charts/
            platform-gitops/bootstrap/templates/bootstrap/applicationset-prod.yaml
            platform-gitops/bootstrap/templates/projects/project-prod.yaml
            platform-gitops/bootstrap/templates/observability/eval-namespace.yaml
            platform-gitops/bootstrap/templates/observability/eval-candidates.yaml
          rules:
            # Helm templates routinely exceed 80 cols and carry Go-template
            # markers, so line-length / comments / document-start are noise.
            line-length: disable
            comments: disable
            document-start: disable
            # truthy: Helm values legitimately use bare yes/no/on/off; disabled
            # to avoid false positives. Revisit if we standardise on true/false.
            truthy: disable
          CFG
          yamllint -c /tmp/yamllint.yml platform-gitops
