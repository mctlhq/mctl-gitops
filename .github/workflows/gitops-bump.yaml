name: Gitops Image Bump
run-name: "gitops-bump ${{ inputs.image_name }}:${{ inputs.image_tag }}"

# Bump-only workflow: called by app repos AFTER they push an image to GHCR.
# Commits the tag change directly to main (same as release-deploy.yaml bump job).
# All gitops structure knowledge stays here; app repos only pass:
#   image_name + image_tag + values_path  (single Helm values.yaml)
#       OR
#   image_name + image_tag + values_glob  (glob for CWFT inline image: refs)
#
# Token requirements for callers (GITOPS_TOKEN):
#   - actions: write  on mctlhq/mctl-gitops  (for workflow_dispatch)
#   Commits are made with an mctl-agents App token this workflow mints itself
#   (main is protected by a ruleset; that app is on its bypass list), so the
#   caller does NOT need repo-write access to mctl-gitops.
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Full image name (e.g. ghcr.io/mctlhq/mctl-agents)"
        required: true
        type: string
      image_tag:
        description: "New image tag (e.g. 1.15.0)"
        required: true
        type: string
      values_path:
        description: "Single file to bump (e.g. platform-gitops/services/labs/claude-remote/values.yaml). Mutually exclusive with values_glob."
        required: false
        type: string
      values_glob:
        description: "Glob pattern for multiple files (e.g. platform-gitops/argo-workflows/cluster-templates/cwft-mctl-agents-*.yaml). Mutually exclusive with values_path."
        required: false
        type: string

# Global serialization: all bumps commit to main; per-image groups let two
# concurrent runs race and produce a non-fast-forward push failure.
concurrency:
  group: gitops-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit + push to main
    steps:
      # main is protected by the `main-protection` ruleset (required PR +
      # review); the default GITHUB_TOKEN has no bypass for it, so a plain
      # checkout+push here gets rejected with GH013. The mctl-agents App is
      # on that ruleset's bypass list for exactly these tag-bump commits —
      # the narrowly-scoped exception to "never commit to main" that
      # CLAUDE.md documents — so mint a token as that app and push with it.
      #
      # Deliberately NOT the repo's APP_ID/APP_PRIVATE_KEY (MCTL App): that
      # is the user-facing App people authorize at mctl.ai/#request-access,
      # whose published description promises least privilege. Letting it
      # bypass branch protection here would widen it in exactly the
      # direction #761 is trying to narrow. mctl-agents is backend-only
      # automation, so the bypass stays with it.
      #
      # Its credentials are repo secrets rather than a Vault lookup: Vault
      # is unreachable from GitHub Actions runners (#779).
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          token: ${{ steps.app_token.outputs.token }}

      - name: Bump image tags
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG:    ${{ inputs.image_tag }}
          VALUES_PATH: ${{ inputs.values_path }}
          VALUES_GLOB: ${{ inputs.values_glob }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os, re, sys, glob as globmod

          image_name = os.environ['IMAGE_NAME']
          new_tag    = os.environ['NEW_TAG']
          vpath      = os.environ.get('VALUES_PATH', '').strip()
          vglob      = os.environ.get('VALUES_GLOB', '').strip()

          # The mctl-agents App token used to push this commit is on the
          # main-protection ruleset's bypass list on the understanding (see
          # CLAUDE.md's "Branch Protection Exception") that it only ever
          # touches image.tag data. Nothing about workflow_dispatch inputs
          # enforces that on its own, so values_path/values_glob are
          # allowlisted here before any file is opened.
          #
          # Caller inventory verified 2026-08-29 across all 23 org repos:
          # these three prefixes cover every real caller of
          # gitops-bump/release-deploy — platform-gitops/services/ (tenant
          # services, docs/telegram/academy/design), platform-gitops/
          # argo-workflows/cluster-templates/ (mctl-agents CWFT glob), and
          # platform-gitops/bootstrap/templates/mctl-platform/
          # (mctl-agent/mctl-api/mctl-portal). No fourth prefix exists
          # today; adding one requires editing this allowlist deliberately.
          ALLOWED_PREFIXES = (
              "platform-gitops/services/",
              "platform-gitops/argo-workflows/cluster-templates/",
              "platform-gitops/bootstrap/templates/mctl-platform/",
          )

          def validate_allowed(path):
              if os.path.isabs(path):
                  print(f"ERROR: path must be relative, got absolute path: {path}", file=sys.stderr)
                  sys.exit(4)
              # normpath collapses "a/../b" segments; comparing before/after
              # catches ".." traversal without relying on normpath alone —
              # this repo checkout has no symlinks, so normpath alone would
              # suffice, but the explicit check documents intent and fails
              # closed even if a future path shape confuses normpath.
              if ".." in path.split("/"):
                  print(f"ERROR: path must not contain '..' segments: {path}", file=sys.stderr)
                  sys.exit(4)
              normalized = os.path.normpath(path)
              if not normalized.startswith(ALLOWED_PREFIXES):
                  print(
                      f"ERROR: path '{path}' is not under an allowed prefix. "
                      f"Allowed: {', '.join(ALLOWED_PREFIXES)}",
                      file=sys.stderr,
                  )
                  sys.exit(4)

          # Point 3: exactly one of values_path / values_glob must be set
          if not vpath and not vglob:
              print("ERROR: provide exactly one of values_path or values_glob", file=sys.stderr)
              sys.exit(1)
          if vpath and vglob:
              print("ERROR: values_path and values_glob are mutually exclusive", file=sys.stderr)
              sys.exit(1)

          # Point 4: no-op guard — fail loudly if glob resolves to nothing
          if vglob:
              validate_allowed(vglob)
              files = sorted(globmod.glob(vglob))
              if not files:
                  print(f"ERROR: no files matched glob: {vglob}", file=sys.stderr)
                  sys.exit(2)
              for f in files:
                  validate_allowed(f)
          else:
              validate_allowed(vpath)
              files = [vpath]

          missing = [f for f in files if not os.path.isfile(f)]
          if missing:
              print(f"ERROR: file(s) not found: {missing}", file=sys.stderr)
              sys.exit(2)

          print(f"Files to process ({len(files)}):")
          for f in files:
              print(f"  {f}")

          total_replaced = 0
          total_already  = 0
          changed_files  = []
          for path in files:
              with open(path) as fp:
                  content = fp.read()
              n1 = n2 = n3 = n4 = 0

              # Pattern 1: repository: <image>\n  tag: <old>  (standard Helm values.yaml)
              p1 = re.compile(r'(repository:\s*' + re.escape(image_name) + r'\n\s+tag:)[^\n]+')
              out, n1 = p1.subn(r'\1 "' + new_tag + '"', content)

              # Pattern 2: split registry/repository/tag (Backstage Helm chart style)
              if '/' in image_name:
                  registry, repo = image_name.split('/', 1)
                  p_split = re.compile(
                      r'(registry:\s*' + re.escape(registry) +
                      r'\n\s+repository:\s*' + re.escape(repo) +
                      r'\n\s+tag:)[^\n]+'
                  )
                  out, n3 = p_split.subn(r'\1 ' + new_tag, out)

              # Pattern 3: inline image: <image>:<tag>  (CWFT style, quoted or unquoted)
              p3 = re.compile(r'(image:\s*["\']?' + re.escape(image_name) + r')["\']?:[\w.\-]+')
              out, n2 = p3.subn(r'\1:' + new_tag, out)

              # Pattern 4: workflow-parameter default value: <image>:<tag>
              # (Argo CWFT parameterization style — arguments.parameters[].value,
              # e.g. cwft-mctl-agents-*.yaml's agent_image param — the tag lives
              # under `value:`, not `image:`, since the container's own `image:`
              # field is a {{workflow.parameters.*}} template reference instead
              # of a literal image:tag string.)
              p4 = re.compile(r'(value:\s*["\']?' + re.escape(image_name) + r')["\']?:[\w.\-]+')
              out, n4 = p4.subn(r'\1:' + new_tag, out)

              n = n1 + n2 + n3 + n4
              if n == 0:
                  print(f"  {path}: WARN — no image pattern matched (skipped)")
              else:
                  # Point 5: distinguish "changed" vs "already at new_tag"
                  if out == content:
                      print(f"  {path}: already at {new_tag} (no diff)")
                      total_already += n
                  else:
                      with open(path, 'w') as fp:
                          fp.write(out)
                      print(f"  {path}: bumped {n} occurrence(s)")
                      total_replaced += n
                      changed_files.append(path)

          # Hand off exactly the files this step actually rewrote to the
          # "Commit and push" step, which stages only these files
          # explicitly, never the full working tree. Written unconditionally
          # (even when empty) so that step can tell "nothing changed" apart
          # from "this step never got here" and fail closed on the latter.
          with open('/tmp/gitops-bump-changed-files.txt', 'w') as fp:
              for p in changed_files:
                  fp.write(p + '\n')

          # Point 5: idempotent — already at target in all files
          if total_replaced == 0 and total_already > 0:
              print(f"Already at {new_tag} in all files — nothing to do")
              sys.exit(0)

          # Point 5: nothing matched at all — hard fail
          if total_replaced == 0 and total_already == 0:
              print(f"ERROR: no image tag pattern found for {image_name}", file=sys.stderr)
              sys.exit(3)

          print(f"Total: {total_replaced} occurrence(s) bumped across {len(files)} file(s)")
          PYEOF

      - name: Commit and push to main
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG:    ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.email "ci@mctl.ai"
          git config user.name  "mctl-ci"

          CHANGED_FILES=/tmp/gitops-bump-changed-files.txt
          if [[ ! -f "${CHANGED_FILES}" ]]; then
            echo "::error::changed-files handoff file missing — bump step did not report its results, refusing to commit blind"
            exit 1
          fi

          # Stage exactly the allowlist-validated file(s) the bump step
          # reported as changed, not the full working tree, so an unrelated
          # modified/untracked file left in the runner's checkout can never
          # be swept into this commit. Read line-by-line (not unquoted
          # command substitution) so filenames are never word-split.
          git_add_args=()
          while IFS= read -r f; do
            [[ -n "$f" ]] && git_add_args+=("$f")
          done < "${CHANGED_FILES}"

          if [[ ${#git_add_args[@]} -eq 0 ]]; then
            echo "::notice::No staged changes (already at ${NEW_TAG})"
            exit 0
          fi

          git add -- "${git_add_args[@]}"
          if git diff --staged --quiet; then
            echo "::notice::No staged changes (already at ${NEW_TAG})"
            exit 0
          fi
          SERVICE=$(basename "$IMAGE_NAME")
          # Direct commit to main — scoped to exactly the allowlisted,
          # explicitly-staged file(s) above.
          git commit -m "chore: bump ${SERVICE} to ${NEW_TAG}"
          git push

      - name: Summary
        if: always()
        env:
          IMAGE_NAME:   ${{ inputs.image_name }}
          IMAGE_TAG:    ${{ inputs.image_tag }}
          VALUES_PATH:  ${{ inputs.values_path }}
          VALUES_GLOB:  ${{ inputs.values_glob }}
        run: |
          {
            echo "## Gitops bump: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            if [[ -n "${VALUES_PATH}" ]]; then
              echo "| **Mode** | single file |"
              echo "| **File** | \`${VALUES_PATH}\` |"
            else
              echo "| **Mode** | glob |"
              echo "| **Glob** | \`${VALUES_GLOB}\` |"
            fi
          } >> $GITHUB_STEP_SUMMARY
