name: Gitops Image Bump
run-name: "gitops-bump ${{ inputs.image_name }}:${{ inputs.image_tag }}"

# Bump-only workflow: called by app repos AFTER they push an image to GHCR.
# Commits the tag change directly to main (same as release-deploy.yaml bump job).
# All gitops structure knowledge stays here; app repos only pass:
#   image_name + image_tag + values_path  (single Helm values.yaml)
#       OR
#   image_name + image_tag + values_glob  (glob for CWFT inline image: refs)
#
# Token requirements for callers (GITOPS_TOKEN):
#   - actions: write  on mctlhq/mctl-gitops  (for workflow_dispatch)
#   Commits are pushed with this repository's own bump deploy key (main is
#   protected by a ruleset; deploy keys are on its bypass list), so the
#   caller does NOT need repo-write access to mctl-gitops.
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Full image name (e.g. ghcr.io/mctlhq/mctl-agents)"
        required: true
        type: string
      image_tag:
        description: "New image tag (e.g. 1.15.0)"
        required: true
        type: string
      values_path:
        description: "Single file to bump (e.g. platform-gitops/services/labs/claude-remote/values.yaml). Mutually exclusive with values_glob."
        required: false
        type: string
      values_glob:
        description: "Glob pattern for multiple files (e.g. platform-gitops/argo-workflows/cluster-templates/cwft-mctl-agents-*.yaml). Mutually exclusive with values_path."
        required: false
        type: string

# Global serialization of the jobs that write (publish-direct, and publish-pr up
# to the pull request being opened): per-image groups let two concurrent runs race
# and produce a non-fast-forward push failure. The workflow itself is NOT in the
# group: the up-to-50-minute wait for a bump PR (await-bump) must not hold it, or
# a queued bump of another service would be cancelled behind it.
jobs:
  # Before the environment releases the key: every dispatch input is shape-checked
  # here with no checkout, no secrets and no permissions. The bump script repeats
  # the checks that protect what it writes, as a second layer.
  validate-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate dispatch inputs
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_VALUES_PATH: ${{ inputs.values_path }}
          INPUT_VALUES_GLOB: ${{ inputs.values_glob }}
        run: |
          set -euo pipefail
          fail() { echo "::error::invalid $1"; exit 1; }
          nl=$'\n'
          for name in IMAGE_NAME IMAGE_TAG VALUES_PATH VALUES_GLOB; do
            v="INPUT_${name}"
            [[ "${!v}" != *"$nl"* && "${!v}" != *$'\r'* ]] || fail "$name: contains a newline"
          done
          [[ "$INPUT_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || fail "image_tag"
          [[ "$INPUT_IMAGE_NAME" =~ ^ghcr\.io/mctlhq/[a-z0-9][a-z0-9._-]*$ ]] || fail "image_name"
          # Mirrors ALLOWED_PREFIXES in the bump script below;
          # tests/test_gitops_bump_inputs.py asserts they match.
          ALLOWED_PREFIXES=(
            "platform-gitops/services/"
            "platform-gitops/argo-workflows/cluster-templates/"
            "platform-gitops/bootstrap/templates/mctl-platform/"
          )
          check_path() { # name value charset-regex
            local name=$1 p=$2 re=$3 ok=1 pre
            [[ "$p" =~ $re ]] || fail "$name"
            [[ "$p" != /* && "/$p/" != *"/../"* ]] || fail "$name"
            for pre in "${ALLOWED_PREFIXES[@]}"; do
              [[ "$p" == "$pre"* ]] && ok=0
            done
            [[ $ok -eq 0 ]] || fail "$name"
          }
          if [[ -z "$INPUT_VALUES_PATH" && -z "$INPUT_VALUES_GLOB" ]] \
            || [[ -n "$INPUT_VALUES_PATH" && -n "$INPUT_VALUES_GLOB" ]]; then
            fail "values_path/values_glob: provide exactly one"
          fi
          if [[ -n "$INPUT_VALUES_PATH" ]]; then
            check_path values_path "$INPUT_VALUES_PATH" '^[A-Za-z0-9._/-]+$'
          else
            check_path values_glob "$INPUT_VALUES_GLOB" '^[A-Za-z0-9._/*?-]+$'
          fi

  # The bump is prepared here and published by exactly one of two jobs below.
  # This job holds no environment and no write credential: it decides the route,
  # edits the values files and builds ONE commit, which it hands over as a patch.
  # The publishing jobs apply that patch to a fresh checkout of main, run the
  # release gate on the tree that would result, and only then write.
  bump:
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_change: ${{ steps.commit.outputs.has_change }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      # The release gate imports yaml. Installed explicitly rather than assumed
      # on the runner image; if this step or the import fails the bump is
      # refused (the gate fails closed), never skipped.
      - name: Install PyYAML for the release gate
        run: python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci-hashed.txt

      # Which way this image reaches main is read from main (see
      # platform-gitops/release-bump-routes.yaml). A file that cannot be read
      # or parsed fails this step: there is no default route.
      - name: Decide how the bump reaches main
        id: route
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          route=$(python3 scripts/release-bump-route.py --image "$IMAGE_NAME")
          case "$route" in
            pr|direct) ;;
            *) echo "::error::unexpected route '${route}'"; exit 1 ;;
          esac
          echo "route=${route}" >> "$GITHUB_OUTPUT"
          echo "::notice::bump route for ${IMAGE_NAME}: ${route}"

      - name: Bump image tags
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG:    ${{ inputs.image_tag }}
          VALUES_PATH: ${{ inputs.values_path }}
          VALUES_GLOB: ${{ inputs.values_glob }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os, re, sys, glob as globmod

          image_name = os.environ['IMAGE_NAME']
          new_tag    = os.environ['NEW_TAG']
          vpath      = os.environ.get('VALUES_PATH', '').strip()
          vglob      = os.environ.get('VALUES_GLOB', '').strip()

          # The tag ends up inside manifests that this job pushes past main's
          # protection, so nothing downstream reviews the result. Anchored, and
          # the shape of a real image tag or image name. Same rule as
          # release-deploy.
          if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9._-]{0,127}', new_tag):
              print(f"ERROR: refusing tag {new_tag!r}: not a valid image tag", file=sys.stderr)
              sys.exit(5)
          if not re.fullmatch(r'ghcr\.io/mctlhq/[a-z0-9][a-z0-9._-]*', image_name):
              print(f"ERROR: refusing image {image_name!r}: not a ghcr.io/mctlhq image", file=sys.stderr)
              sys.exit(5)

          # The deploy key used to push this commit is on the
          # main-protection ruleset's bypass list on the understanding (see
          # CLAUDE.md's "Branch Protection Exception") that it only ever
          # touches image.tag data. Nothing about workflow_dispatch inputs
          # enforces that on its own, so values_path/values_glob are
          # allowlisted here before any file is opened.
          #
          # Caller inventory verified 2026-08-29 across all 23 org repos:
          # these three prefixes cover every real caller of
          # gitops-bump/release-deploy — platform-gitops/services/ (tenant
          # services, docs/telegram/academy/design), platform-gitops/
          # argo-workflows/cluster-templates/ (mctl-agents CWFT glob), and
          # platform-gitops/bootstrap/templates/mctl-platform/
          # (mctl-agent/mctl-api/mctl-portal). No fourth prefix exists
          # today; adding one requires editing this allowlist deliberately.
          ALLOWED_PREFIXES = (
              "platform-gitops/services/",
              "platform-gitops/argo-workflows/cluster-templates/",
              "platform-gitops/bootstrap/templates/mctl-platform/",
          )

          def validate_allowed(path):
              if os.path.isabs(path):
                  print(f"ERROR: path must be relative, got absolute path: {path}", file=sys.stderr)
                  sys.exit(4)
              # normpath collapses "a/../b" segments; comparing before/after
              # catches ".." traversal without relying on normpath alone —
              # this repo checkout has no symlinks, so normpath alone would
              # suffice, but the explicit check documents intent and fails
              # closed even if a future path shape confuses normpath.
              if ".." in path.split("/"):
                  print(f"ERROR: path must not contain '..' segments: {path}", file=sys.stderr)
                  sys.exit(4)
              normalized = os.path.normpath(path)
              # A symlink could name an allowed path and write somewhere else.
              # Globs have no real path yet; their matches come through here too.
              if os.path.realpath(path) != os.path.join(os.path.realpath(os.curdir), normalized):
                  print(f"ERROR: path goes through a symlink: {path}", file=sys.stderr)
                  sys.exit(4)
              if not normalized.startswith(ALLOWED_PREFIXES):
                  print(
                      f"ERROR: path '{path}' is not under an allowed prefix. "
                      f"Allowed: {', '.join(ALLOWED_PREFIXES)}",
                      file=sys.stderr,
                  )
                  sys.exit(4)

          # Point 3: exactly one of values_path / values_glob must be set
          if not vpath and not vglob:
              print("ERROR: provide exactly one of values_path or values_glob", file=sys.stderr)
              sys.exit(1)
          if vpath and vglob:
              print("ERROR: values_path and values_glob are mutually exclusive", file=sys.stderr)
              sys.exit(1)

          # Point 4: no-op guard — fail loudly if glob resolves to nothing
          if vglob:
              if ".." in vglob.split("/") or os.path.isabs(vglob) or not vglob.startswith(ALLOWED_PREFIXES):
                  print(f"ERROR: glob is not under an allowed prefix: {vglob}", file=sys.stderr)
                  sys.exit(4)
              files = sorted(globmod.glob(vglob))
              if not files:
                  print(f"ERROR: no files matched glob: {vglob}", file=sys.stderr)
                  sys.exit(2)
              for f in files:
                  validate_allowed(f)
          else:
              validate_allowed(vpath)
              files = [vpath]

          missing = [f for f in files if not os.path.isfile(f)]
          if missing:
              print(f"ERROR: file(s) not found: {missing}", file=sys.stderr)
              sys.exit(2)

          # Release gate (mctlhq/mctl-agents#1007): whole file set, before any
          # write, fail closed (a crash of the gate stops the bump too).
          import subprocess
          _gate = subprocess.run(
              [sys.executable, "scripts/release-gate.py", "check",
               "--files", *[os.path.normpath(f) for f in files], "--new-tag", new_tag,
               "--policy-rev", "origin/main", "--image", image_name]
          )
          if _gate.returncode != 0:
              print("ERROR: release gate refused this bump", file=sys.stderr)
              sys.exit(6)

          print(f"Files to process ({len(files)}):")
          for f in files:
              print(f"  {f}")

          import yaml

          def same_but_tags(a, b):
              """The parsed documents differ only in strings that are new_tag or end in :new_tag."""
              if isinstance(a, dict) and isinstance(b, dict):
                  return a.keys() == b.keys() and all(same_but_tags(a[k], b[k]) for k in a)
              if isinstance(a, list) and isinstance(b, list):
                  return len(a) == len(b) and all(same_but_tags(x, y) for x, y in zip(a, b))
              return a == b or (isinstance(b, str) and (b == new_tag or b.endswith(":" + new_tag)))

          def only_tags_changed(before, after):
              """Refuse anything but a tag edit, whatever produced it. Text first, because
              Helm templates under bootstrap do not parse as YAML; parsed as well where
              the file did parse before."""
              old, new = before.split("\n"), after.split("\n")
              if len(old) != len(new):
                  return False
              for o, n in zip(old, new):
                  if o != n and (o.split(":", 1)[0] != n.split(":", 1)[0] or new_tag not in n):
                      return False
              try:
                  parsed = list(yaml.safe_load_all(before))
              except yaml.YAMLError:
                  return True
              try:
                  return same_but_tags(parsed, list(yaml.safe_load_all(after)))
              except yaml.YAMLError:
                  return False

          total_replaced = 0
          total_already  = 0
          changed_files  = []
          for path in files:
              with open(path) as fp:
                  content = fp.read()
              n1 = n2 = n3 = n4 = 0

              # Pattern 1: repository: <image>\n  tag: <old>  (standard Helm values.yaml)
              p1 = re.compile(r'(repository:\s*' + re.escape(image_name) + r'\n\s+tag:)[^\n]+')
              # Functions, not replacement strings: a value is never read as a
              # group reference.
              out, n1 = p1.subn(lambda m: m.group(1) + ' "' + new_tag + '"', content)

              # Pattern 2: split registry/repository/tag (Backstage Helm chart style)
              if '/' in image_name:
                  registry, repo = image_name.split('/', 1)
                  p_split = re.compile(
                      r'(registry:\s*' + re.escape(registry) +
                      r'\n\s+repository:\s*' + re.escape(repo) +
                      r'\n\s+tag:)[^\n]+'
                  )
                  # Quoted like pattern 1: a tag such as 1042 must stay a string.
                  out, n3 = p_split.subn(lambda m: m.group(1) + ' "' + new_tag + '"', out)

              # Pattern 3: inline image: <image>:<tag>  (CWFT style, quoted or unquoted)
              p3 = re.compile(r'(image:\s*["\']?' + re.escape(image_name) + r')["\']?:[\w.\-]+')
              out, n2 = p3.subn(lambda m: m.group(1) + ':' + new_tag, out)

              # Pattern 4: workflow-parameter default value: <image>:<tag>
              # (Argo CWFT parameterization style — arguments.parameters[].value,
              # e.g. cwft-mctl-agents-*.yaml's agent_image param — the tag lives
              # under `value:`, not `image:`, since the container's own `image:`
              # field is a {{workflow.parameters.*}} template reference instead
              # of a literal image:tag string.)
              p4 = re.compile(r'(value:\s*["\']?' + re.escape(image_name) + r')["\']?:[\w.\-]+')
              out, n4 = p4.subn(lambda m: m.group(1) + ':' + new_tag, out)

              n = n1 + n2 + n3 + n4
              if n == 0:
                  # A named file that does not carry the image is an error: a bump
                  # that silently skips it leaves that service behind. A glob may
                  # legitimately cover files without it.
                  if vpath:
                      print(f"ERROR: {path} does not carry {image_name}", file=sys.stderr)
                      sys.exit(3)
                  print(f"  {path}: WARN — no image pattern matched (skipped)")
              elif not only_tags_changed(content, out):
                  print(f"ERROR: refusing to write {path}: the edit is not limited to image tags", file=sys.stderr)
                  sys.exit(7)
              else:
                  # Point 5: distinguish "changed" vs "already at new_tag"
                  if out == content:
                      print(f"  {path}: already at {new_tag} (no diff)")
                      total_already += n
                  else:
                      with open(path, 'w') as fp:
                          fp.write(out)
                      print(f"  {path}: bumped {n} occurrence(s)")
                      total_replaced += n
                      changed_files.append(path)

          # Hand off exactly the files this step actually rewrote to the
          # "Commit and push" step, which stages only these files
          # explicitly, never the full working tree. Written unconditionally
          # (even when empty) so that step can tell "nothing changed" apart
          # from "this step never got here" and fail closed on the latter.
          with open('/tmp/gitops-bump-changed-files.txt', 'w') as fp:
              for p in changed_files:
                  fp.write(p + '\n')

          # Point 5: idempotent — already at target in all files
          if total_replaced == 0 and total_already > 0:
              print(f"Already at {new_tag} in all files — nothing to do")
              sys.exit(0)

          # Point 5: nothing matched at all — hard fail
          if total_replaced == 0 and total_already == 0:
              print(f"ERROR: no image tag pattern found for {image_name}", file=sys.stderr)
              sys.exit(3)

          print(f"Total: {total_replaced} occurrence(s) bumped across {len(files)} file(s)")
          PYEOF

      # Commits locally only and hands the commit over as a patch. Nothing is
      # pushed from this job.
      - name: Commit (local only) and write the patch
        id: commit
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG:    ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.email "ci@mctl.ai"
          git config user.name  "mctl-ci"

          CHANGED_FILES=/tmp/gitops-bump-changed-files.txt
          if [[ ! -f "${CHANGED_FILES}" ]]; then
            echo "::error::changed-files handoff file missing — bump step did not report its results, refusing to commit blind"
            exit 1
          fi

          # Stage exactly the allowlist-validated file(s) the bump step
          # reported as changed, not the full working tree, so an unrelated
          # modified/untracked file left in the runner's checkout can never
          # be swept into this commit. Read line-by-line (not unquoted
          # command substitution) so filenames are never word-split.
          git_add_args=()
          while IFS= read -r f; do
            [[ -n "$f" ]] && git_add_args+=("$f")
          done < "${CHANGED_FILES}"

          if [[ ${#git_add_args[@]} -eq 0 ]]; then
            echo "::notice::No staged changes (already at ${NEW_TAG})"
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -- "${git_add_args[@]}"
          if git diff --staged --quiet; then
            echo "::notice::No staged changes (already at ${NEW_TAG})"
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SERVICE=$(basename "$IMAGE_NAME")
          git commit -m "chore: bump ${SERVICE} to ${NEW_TAG}"
          mkdir -p "$RUNNER_TEMP/bump-patch"
          git format-patch -1 --stdout > "$RUNNER_TEMP/bump-patch/bump.patch"
          echo "has_change=true" >> "$GITHUB_OUTPUT"

      - name: Hand the bump commit to the publishing job
        if: steps.commit.outputs.has_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump-patch/bump.patch
          if-no-files-found: error
          retention-days: 3

      - name: Summary
        if: always()
        env:
          IMAGE_NAME:   ${{ inputs.image_name }}
          IMAGE_TAG:    ${{ inputs.image_tag }}
          VALUES_PATH:  ${{ inputs.values_path }}
          VALUES_GLOB:  ${{ inputs.values_glob }}
        run: |
          {
            echo "## Gitops bump: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            if [[ -n "${VALUES_PATH}" ]]; then
              echo "| **Mode** | single file |"
              echo "| **File** | \`${VALUES_PATH}\` |"
            else
              echo "| **Mode** | glob |"
              echo "| **Glob** | \`${VALUES_GLOB}\` |"
            fi
          } >> $GITHUB_STEP_SUMMARY

  # Direct route: the deploy key pushes the gate-checked commit to main. The key
  # is a secret of the `gitops-bump` environment, which releases it only to jobs
  # running on main. This route stays for every image not listed in
  # platform-gitops/release-bump-routes.yaml (mctlhq/mctl-gitops#2543: the
  # DeployKey bypass actor is not removed by the PR route).
  publish-direct:
    needs: bump
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    if: needs.bump.outputs.has_change == 'true' && needs.bump.outputs.route == 'direct'
    runs-on: ubuntu-latest
    environment: gitops-bump
    permissions:
      # Read only: the push is authorized by the deploy key, not by
      # GITHUB_TOKEN.
      contents: read
    steps:
      # main is protected by the `main-protection` ruleset (required PR +
      # review); the default GITHUB_TOKEN has no bypass for it. The ruleset's
      # bypass_actors carry a `DeployKey` entry of its own, independent of any
      # App; an mctl-agents App token is not used because the agents run with
      # it too (mctlhq/mctl-agents#470, #1033).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          ssh-key: ${{ secrets.GITOPS_BUMP_DEPLOY_KEY }}

      - name: Install PyYAML for the release gate
        run: python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci-hashed.txt

      - name: Download the bump commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump-patch

      - name: Apply and push to main
        run: |
          set -euo pipefail
          git config user.email "ci@mctl.ai"
          git config user.name  "mctl-ci"
          bash scripts/release-bump-apply.sh "$RUNNER_TEMP/bump-patch/bump.patch"
          # Release gate on the tree about to be pushed (see release-deploy).
          python3 scripts/release-gate.py verify --policy-rev origin/main
          git push

  # PR route: the mctl-gitops-pr App opens a release-bump/* pull request. It is
  # not a ruleset bypass actor, so it cannot write main; auto-merge.yml merges
  # the PR after the review and the required checks (including `validate`, which
  # runs the release gate on the PR). The key is a secret of the main-only
  # `app-gitops-pr` environment.
  publish-pr:
    needs: bump
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    if: needs.bump.outputs.has_change == 'true' && needs.bump.outputs.route == 'pr'
    runs-on: ubuntu-latest
    environment: app-gitops-pr
    outputs:
      pr: ${{ steps.open_pr.outputs.pr }}
    permissions:
      contents: read
    steps:
      - name: Generate a write token for the bump pull request
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GITOPS_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PR_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}

      - name: Install PyYAML for the release gate
        run: python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci-hashed.txt

      - name: Download the bump commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump-patch

      # The commit is re-authored as the App's own bot account. An author that
      # maps to no GitHub account (ci@mctl.ai) is "unattributed" and the ruleset
      # then asks for a second approval nobody is there to give.
      - name: Apply the bump commit as the App bot
        run: |
          set -euo pipefail
          git config user.name "mctl-gitops-pr[bot]"
          git config user.email "353875018+mctl-gitops-pr[bot]@users.noreply.github.com"
          bash scripts/release-bump-apply.sh "$RUNNER_TEMP/bump-patch/bump.patch"
          git commit --amend --reset-author --no-edit --trailer "Agent: none"

      # Same shape check the merge step applies: only image tags move.
      - name: Refuse anything but an image tag move
        run: git diff origin/main..HEAD | python3 scripts/release-bump-diff-guard.py

      - name: Open the release-bump pull request
        id: open_pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image_name }}
          NEW_TAG: ${{ inputs.image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SERVICE=$(basename "$IMAGE_NAME")
          branch="release-bump/${SERVICE}-${NEW_TAG}"
          git check-ref-format "refs/heads/${branch}" || { echo "::error::invalid branch name"; exit 1; }
          case "$branch" in release-bump/?*) ;; *) echo "::error::branch is not under release-bump/"; exit 1 ;; esac

          # Release gate on the tree the pull request would merge, right before
          # the only push this job makes. The push target is a release-bump/*
          # ref; no refspec here can name main.
          python3 scripts/release-gate.py verify --policy-rev origin/main
          git push --force origin "HEAD:refs/heads/${branch}"

          existing=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "::notice::release-bump pull request #${existing} already open for ${branch}"
            pr="$existing"
          else
            create_pr=1
          fi
          body=$(printf '%s\n' \
            "Image tag bump for \`${IMAGE_NAME}:${NEW_TAG}\`." \
            "" \
            "Opened by gitops-bump.yaml: ${RUN_URL}" \
            "Base: \`$(git rev-parse origin/main)\`. Head: \`$(git rev-parse HEAD)\`." \
            "" \
            "The only change is an image tag. auto-merge.yml merges this PR after an approving review and the required checks (validate runs the release gate), pinned to the head above.")
          if [[ -n "${create_pr:-}" ]]; then
            pr_url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "chore: bump ${SERVICE} to ${NEW_TAG}" --body "$body")
            pr="${pr_url##*/}"
          fi
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::could not determine the pull request number"; exit 1; }
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"

          # Older open bumps for the same service are superseded by this one.
          # "Older" is a strictly lower MAJOR.MINOR.PATCH parsed from the branch
          # suffix; a suffix that is not exactly that shape is never matched
          # (so another service named <service>-<digit> is never touched). If
          # NEW_TAG cannot be ordered nothing is closed. If another open bump is
          # NEWER than this one, this release is the stale one: its PR is closed
          # and the run fails, so a re-run or a crossed dispatch cannot drop the
          # newer tag silently. A failed listing fails the job; it is never read
          # as "nothing to supersede".
          semver_lt() {
            local re='^([0-9]+)\.([0-9]+)\.([0-9]+)$' a b i
            [[ "$1" =~ $re ]] || return 2
            a=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")
            [[ "$2" =~ $re ]] || return 2
            b=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")
            for i in 0 1 2; do
              (( 10#${a[i]} < 10#${b[i]} )) && return 0
              (( 10#${a[i]} > 10#${b[i]} )) && return 1
            done
            return 1
          }
          export PREFIX="release-bump/${SERVICE}-"
          others=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName,author \
            --jq '.[] | select(.author.login | test("^(app/)?mctl-gitops-pr(\\[bot\\])?$")) | select(.headRefName as $h | $ENV.PREFIX as $p | ($h | startswith($p)) and ($h[($p | length):] | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | "\(.number) \(.headRefName)"')
          while read -r n ref; do
            [[ -n "$n" && "$n" != "$pr" ]] || continue
            other_tag="${ref#"$PREFIX"}"
            rc=0; semver_lt "$other_tag" "$NEW_TAG" || rc=$?
            if [[ "$rc" == 0 ]]; then
              gh pr close "$n" --repo "$REPO" --delete-branch \
                --comment "Superseded by #${pr} (${NEW_TAG})."
            elif [[ "$rc" == 1 ]]; then
              gh pr close "$pr" --repo "$REPO" --delete-branch \
                --comment "Not newer than #${n} (${other_tag}); closing."
              echo "::error::a newer release-bump pull request #${n} (${other_tag}) is open; ${NEW_TAG} is not newer"
              exit 1
            else
              echo "::warning::cannot order ${NEW_TAG} against #${n} (${other_tag}); closing nothing"
            fi
          done <<< "$others"

  # A stuck bump must be a red release run, not a silent open PR. The wait lives
  # in its own job with no environment, no secret and read-only access, and
  # outside any concurrency group: it can last up to 50 minutes and must not hold
  # the serialization that publish-direct and publish-pr use. A bump superseded
  # by a newer release is only a notice.
  await-bump:
    needs: publish-pr
    if: needs.publish-pr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      pull-requests: read
    steps:
      - name: Wait for the bump to merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.publish-pr.outputs.pr }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::no pull request number from the previous step"; exit 1; }
          deadline=$((SECONDS + 50 * 60))
          while (( SECONDS < deadline )); do
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            case "$state" in
              MERGED) echo "::notice::release-bump pull request #${PR} merged"; exit 0 ;;
              CLOSED)
                sup=$(gh pr view "$PR" --repo "$REPO" --json comments --jq '[.comments[] | select(.author.login | test("^(app/)?mctl-gitops-pr(\\[bot\\])?$")) | select(.body | startswith("Superseded by #"))] | length')
                if [[ "$sup" -gt 0 ]]; then
                  echo "::notice::release-bump pull request #${PR} was superseded by a newer release"; exit 0
                fi
                echo "::error::release-bump pull request #${PR} was closed without merging"; exit 1 ;;
              OPEN) ;;
              *) echo "::error::unexpected pull request state: ${state}"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::release-bump pull request #${PR} did not merge within 50 minutes"
          exit 1
