name: Build Image
run-name: "build-${{ inputs.build_id }}: ${{ inputs.team_name }}/${{ inputs.component_name }} (${{ inputs.image_tag }})"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo (e.g. openclaw/openclaw)"
        required: true
        type: string
      git_ref:
        description: "Git ref: branch, tag, or commit SHA"
        required: true
        type: string
      image_name:
        description: "Full image name (e.g. ghcr.io/mctlhq/openclaw)"
        required: true
        type: string
      image_tag:
        description: "Image tag (e.g. main-abc1234)"
        required: true
        type: string
      dockerfile_path:
        description: "Path to Dockerfile in source repo"
        required: false
        default: "Dockerfile"
        type: string
      team_name:
        description: "Team name (for Vault PAT lookup)"
        required: true
        type: string
      component_name:
        description: "Service name (for Vault PAT lookup)"
        required: true
        type: string
      build_id:
        description: "Unique build ID for correlation with Argo workflow"
        required: true
        type: string
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      git_ref:
        required: true
        type: string
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      dockerfile_path:
        required: false
        default: "Dockerfile"
        type: string
      team_name:
        required: true
        type: string
      component_name:
        required: true
        type: string
      build_id:
        required: true
        type: string
    # Declared so the caller can pass exactly what this workflow uses instead
    # of `secrets: inherit`. This job checks out whichever repository
    # `inputs.repo` names and builds its Dockerfile, so every secret in the
    # caller's environment is a secret handed to a build of third-party
    # source. These four are the complete set this file references
    # (mctlhq/mctl-gitops#1010).
    #
    # All optional: each has a documented fallback tier below, and making any
    # of them required would turn a missing secret into a hard failure of the
    # release path rather than the degradation it is today.
    #
    # GITHUB_TOKEN is deliberately absent - it is provided automatically, and
    # GitHub rejects a `secrets:` entry whose name starts with GITHUB_.
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      GHCR_PAT:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # OIDC JWT for Vault JWT auth (ROADMAP 3.3). No long-lived VAULT_TOKEN.
      id-token: write
    steps:
      # --- Tier 1: Vault PAT via GitHub OIDC -> Vault JWT ---
      - name: Fetch Vault PAT
        id: vault_pat
        # Bound through env rather than interpolated into the script text.
        # `${{ inputs.x }}` is substituted BEFORE bash parses the line, so a
        # value carrying a quote and a semicolon runs as a command on a runner
        # that holds an OIDC token, a Vault token, the retrieved PAT and a
        # GITHUB_TOKEN with packages: write. These inputs are not
        # operator-only: Argo dispatches this workflow from wft-deploy-service
        # with `dockerfile_repo`, which carries no Pattern in mctl-api's
        # operations registry (agy P1).
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_TEAM_NAME: ${{ inputs.team_name }}
          INPUT_COMPONENT_NAME: ${{ inputs.component_name }}
        run: |
          set -euo pipefail
          REPO="$INPUT_REPO"

          # Shape-checked as well as env-bound, for two reasons: it is the
          # second layer if a future edit reintroduces interpolation, and it
          # is what stops a newline from smuggling extra keys into
          # $GITHUB_OUTPUT below — `repo_owner=foo\nkey=value` would define a
          # second output that later steps read as trusted (agy P2). A grep
          # anchored with ^...$ matches per line, so the newline check is
          # separate and comes first.
          for pair in "repo:${REPO}" "team_name:${INPUT_TEAM_NAME}" "component_name:${INPUT_COMPONENT_NAME}"; do
            name="${pair#*:}"
            if [ "$(printf '%s' "$name" | wc -l)" -ne 0 ]; then
              echo "::error::${pair%%:*} must be a single line"
              exit 1
            fi
          done
          echo "$REPO" | grep -qE '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$' || {
            echo "::error::repo must be owner/name, got: ${REPO}"; exit 1; }
          for pair in "team_name:${INPUT_TEAM_NAME}" "component_name:${INPUT_COMPONENT_NAME}"; do
            name="${pair#*:}"
            echo "$name" | grep -qE '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$' || {
              echo "::error::invalid ${pair%%:*}: ${name}"; exit 1; }
          done

          echo "repo_owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${REPO##*/}" >> "$GITHUB_OUTPUT"

          # Was `${{ secrets.VAULT_ADDR }}` with this literal as a fallback,
          # but no such secret exists in this repository or the org, so the
          # expression was always empty and the fallback is what has run all
          # along. A reference to a secret that does not exist reads like
          # configuration while being dead code - the next person to change
          # the Vault address would have changed the wrong thing (#1010).
          VAULT_ADDR="https://secrets.mctl.ai"
          PAT=""

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub OIDC token endpoint unavailable; skipping Vault PAT"
          else
            echo "Requesting GitHub OIDC token for Vault JWT login"
            OIDC_JSON=$(curl -sS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              -H "Accept: application/json; api-version=2.0" \
              -H "Content-Type: application/json" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Fmctlhq" \
              || true)
            JWT=$(printf '%s' "${OIDC_JSON:-}" | jq -r '.value // empty' 2>/dev/null || true)
            unset OIDC_JSON
            if [[ -z "$JWT" || "$JWT" == "null" ]]; then
              echo "Failed to mint GitHub OIDC token; skipping Vault PAT"
            else
              LOGIN_BODY=$(jq -n --arg jwt "$JWT" --arg role "github-actions" \
                '{role: $role, jwt: $jwt}')
              unset JWT
              LOGIN=$(curl -sS -X POST \
                -H "Content-Type: application/json" \
                -d "$LOGIN_BODY" \
                "${VAULT_ADDR}/v1/auth/jwt/login" || true)
              unset LOGIN_BODY
              VAULT_TOKEN=$(printf '%s' "${LOGIN:-}" | jq -r '.auth.client_token // empty' 2>/dev/null || true)
              unset LOGIN
              if [[ -z "$VAULT_TOKEN" || "$VAULT_TOKEN" == "null" ]]; then
                echo "Vault JWT login failed; skipping Vault PAT"
              else
                echo "::add-mask::${VAULT_TOKEN}"
                VAULT_URL="${VAULT_ADDR}/v1/secret/data/teams/${INPUT_TEAM_NAME}/${INPUT_COMPONENT_NAME}/repo-pat"
                HTTP_CODE=$(curl -sS -o /tmp/vault-resp.json -w "%{http_code}" \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" \
                  "$VAULT_URL" || echo "000")
                unset VAULT_TOKEN
                echo "Vault HTTP status: ${HTTP_CODE}"
                if [[ "$HTTP_CODE" == "200" ]]; then
                  PAT=$(jq -r '.data.data.pat // empty' /tmp/vault-resp.json || true)
                  if [[ -n "$PAT" ]]; then
                    echo "PAT retrieved (length: ${#PAT})"
                  fi
                fi
                rm -f /tmp/vault-resp.json
              fi
            fi
          fi

          if [[ -n "$PAT" ]]; then
            echo "::add-mask::${PAT}"
            echo "pat=${PAT}" >> "$GITHUB_OUTPUT"
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Tier 2: GitHub App token ---
      # This is the one place MCTL App is still the right credential: the
      # repo being checked out belongs to the customer, and MCTL App is the
      # App they installed themselves from mctl.ai/#request-access. Every
      # other consumer has moved to the internal mctl-agents App so that
      # MCTL App can be narrowed to contents:read + metadata:read (#761).
      #
      # permission-contents: read is redundant once that narrowing lands —
      # a token can never exceed the App's own permissions — but it is
      # stated anyway so this step keeps asking for read even if the App is
      # ever widened again, and so the intent is legible at the call site.
      - name: Generate GitHub App token
        id: app_token
        if: steps.vault_pat.outputs.has_pat != 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.vault_pat.outputs.repo_owner }}
          repositories: ${{ steps.vault_pat.outputs.repo_name }}
          permission-contents: read

      # --- Resolve final checkout token ---
      - name: Resolve checkout token
        id: checkout_token
        run: |
          if [[ "${{ steps.vault_pat.outputs.has_pat }}" == "true" ]]; then
            echo "token=${{ steps.vault_pat.outputs.pat }}" >> $GITHUB_OUTPUT
            echo "🔑 Using Vault PAT for checkout"
          elif [[ -n "${{ steps.app_token.outputs.token }}" ]]; then
            echo "token=${{ steps.app_token.outputs.token }}" >> $GITHUB_OUTPUT
            echo "🤖 Using GitHub App token for checkout"
          else
            echo "token=${{ github.token }}" >> $GITHUB_OUTPUT
            echo "🌐 Using github.token for checkout (public repos)"
          fi

      # --- Checkout source repo ---
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.git_ref }}
          token: ${{ steps.checkout_token.outputs.token }}

      # --- Resolve GHCR push token ---
      - name: Resolve GHCR token
        id: ghcr_token
        run: |
          if [[ "${{ steps.vault_pat.outputs.has_pat }}" == "true" ]]; then
            echo "token=${{ steps.vault_pat.outputs.pat }}" >> $GITHUB_OUTPUT
            echo "username=x-access-token" >> $GITHUB_OUTPUT
            echo "🔑 Using Vault PAT for GHCR push"
          elif [[ -n "${{ secrets.GHCR_PAT }}" ]]; then
            echo "token=${{ secrets.GHCR_PAT }}" >> $GITHUB_OUTPUT
            echo "username=x-access-token" >> $GITHUB_OUTPUT
            echo "🔐 Using GHCR_PAT for GHCR push"
          else
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
            echo "username=${{ github.actor }}" >> $GITHUB_OUTPUT
            echo "🌐 Using GITHUB_TOKEN for GHCR push"
          fi

      # --- Build & Push ---
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.ghcr_token.outputs.username }}
          password: ${{ steps.ghcr_token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          build-args: |
            APP_VERSION=${{ inputs.git_ref }}
          # BuildKit secret: a read:packages PAT for source Dockerfiles that
          # install private GitHub Packages dependencies (mctl-web and
          # mctl-docs pull @mctlhq/css; mctl-academy pulls @mctlhq/ui for its
          # Track C Vue migration). It is injected ONLY when building an
          # allow-listed repo. This gate is keyed on `inputs.repo` — not a
          # caller-set flag — because the workflow checks out and builds that
          # repo's own Dockerfile: a caller cannot both name a trusted repo
          # here AND run an attacker-controlled Dockerfile. Other repos get an
          # empty value, so a malicious Dockerfile elsewhere never receives
          # the PAT.
          secrets: |
            github_token=${{ contains(fromJSON('["mctlhq/mctl-web","mctlhq/mctl-docs","mctlhq/mctl-academy"]'), inputs.repo) && secrets.GH_PACKAGES_TOKEN || '' }}
          tags: |
            ${{ inputs.image_name }}:${{ inputs.image_tag }}
            ${{ inputs.image_name }}:latest

      - name: Summary
        # Same reason as the Vault step: these land in a shell command, so
        # they are bound rather than interpolated. The step summary is
        # rendered as markdown on the run page, so an interpolated value also
        # gets to write that page's content.
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          echo "## ✅ Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Repo** | \`${INPUT_REPO}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${INPUT_GIT_REF}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${INPUT_IMAGE_NAME}:${INPUT_IMAGE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build ID** | \`${INPUT_BUILD_ID}\` |" >> $GITHUB_STEP_SUMMARY
