# A drain sub-deadline as the ONLY *_TIMEOUT_SECONDS must leave the fallback
# intact: the effective timeout is still spec.activeDeadlineSeconds (7200),
# not the drain value (300). Without the TIMEOUT_ENV_IGNORED_SUFFIXES carve-out
# this fixture fails with "timeoutSeconds 7200 does not match ... 300" -- which
# is exactly what cwft-mctl-agents-shepherd.yaml would have done.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: mctl-agents-investigate
spec:
  activeDeadlineSeconds: 7200
  templates:
    - name: run
      container:
        image: example
        env:
          - name: ISSUE_INVESTIGATOR_BUDGET_USD
            value: "3.00"
          - name: ISSUE_INVESTIGATOR_DRAIN_TIMEOUT_SECONDS
            value: "300"
