# Uncalled profile naming a budgetEnv.
apiVersion: agents.mctl.ai/v1alpha2
kind: ExecutionProfile
metadata:
  name: example
  owner: platform
spec:
  version: "1.0.0"
  modelPolicyRef:
    task: service_agent
    compatibility: ">=1.0.0 <2.0.0"
  skills: []
  tools:
    - Read
    - Grep
  policyRef: scoped-proposal-authoring
  permissions:
    repository:
      read: true
      branchCreate: false
      commit: false
      pullRequestCreate: false
      merge: false
    kubernetes: none
    network: approved-providers-only
    mutationScopes:
      - proposal-directory-write
  budgetUsd: 0.01
  timeoutSeconds: 3600
  runtime:
    entrypoint: orchestrator.run_example_canary:main
    optionsBuilder: orchestrator.options:build_example_options
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-run
      budgetEnv: MENTOR_BUDGET_USD
      approved: true
  approval:
    requiredBefore: []
  evidence:
    required:
      - proposal
