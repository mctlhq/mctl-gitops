# Stub ClusterWorkflowTemplate for the sandbox.budgetEnv fixtures.
#
# Deliberately NOT a copy of the production template: only the fields
# validate_profile_against_cwft reads are present. Like the real
# cwft-mctl-agents-run.yaml it runs several agents, so it sets more than one
# *_BUDGET_USD variable.
#
# The profile names MENTOR_BUDGET_USD and declares its value, so it passes.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: mctl-agents-run
spec:
  activeDeadlineSeconds: 3600
  templates:
    - name: run
      container:
        image: example
        env:
          - name: SERVICE_AGENT_BUDGET_USD
            value: "5.00"
          - name: MENTOR_BUDGET_USD
            value: "10.00"
