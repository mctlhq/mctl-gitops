# Stub ClusterWorkflowTemplate for the sandbox.budgetEnv fixtures.
#
# Deliberately NOT a copy of the production template: only the fields
# validate_profile_against_cwft reads are present.
#
# MENTOR_BUDGET_USD, the variable the profile names, is set in two steps with
# two different values. The profile declares 10.00, one of them, so only the
# ambiguity can fail this fixture. Same failure as
# invalid/cwft-conflicting-budget-values/, on the budgetEnv path instead of
# the suffix path (mctl-gitops#981).
#
# One of a pair with ...-declares-second/, which declares the other value.
# A check that silently kept one of the two values would pass whichever
# fixture declares that value, so the pair catches it whichever one it keeps.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: mctl-agents-run
spec:
  activeDeadlineSeconds: 3600
  templates:
    - name: run
      container:
        image: example
        env:
          - name: SERVICE_AGENT_BUDGET_USD
            value: "5.00"
          - name: MENTOR_BUDGET_USD
            value: "10.00"
    - name: later-step
      container:
        image: example
        env:
          - name: MENTOR_BUDGET_USD
            value: "25.00"
