# A Service on a privileged port in front of a non-root container (mctl-api#1118).
apiVersion: deploy.mctl.ai/v1alpha1
kind: DeployIntent
metadata:
  tenant: example
  service: web
spec:
  environment: preview
  source:
    repository: example-org/web
    revision: 0123456789abcdef0123456789abcdef01234567
  detection:
    tier: tier0
  runtime:
    port: 8080
    servicePort: 80
    healthPath: /healthz
  exposure:
    mode: public
