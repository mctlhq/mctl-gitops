<!-- TEST-ONLY fixture for mctl-gitops#2929: the reference header plus the global reduced-motion reset a real consumer ships
     (transition and animation durations forced to 0.01ms !important). The design sheet's own reduced-motion rule sets
     transition: none, so transition-property is none and no transition runs whatever the duration says. HDR-15 must PASS here. -->
