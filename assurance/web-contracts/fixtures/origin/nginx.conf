# Fixture origin for the web contract preview assurance harness (mctl-gitops#2929).
# TEST-ONLY. Preview assurance only; not production conformance. Never published.
#
# Provenance: the ui.fixture.test server block is derived from mctl-design
# nginx.conf at commit 6d82a6b239365213d6859f2794c2449af7dd4e1f. The sheet,
# versioned-sheet and generic-asset locations keep their upstream Cache-Control
# and Access-Control-Allow-Origin values byte for byte (that is what the G3 cache
# cases assert); the brand and readiness locations are dropped and the upstream
# explanatory comments are shortened. Everything marked TEST-ONLY below is added.
#
# Both hosts are network aliases of this one container on the --internal network.
# The sheet bytes come from a read-only git archive of the pinned commit mounted at
# /srv/design; the pages come from fixtures/ mounted at /srv/fixtures.

# ---------------------------------------------------------------- ui.fixture.test
server {
    listen 8080;
    server_name ui.fixture.test;
    root /srv/design;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Floating sheets: one URL that moves with main.
    location ~ ^/(mctl|global|prose|site)\.css$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Version-pinned sheets: immutable, CORS open.
    location ~ ^/[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?/(mctl|global|prose|site)\.css$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # TEST-ONLY: ACAO off. The same bytes, with no Access-Control-Allow-Origin, so a
    # crossorigin="anonymous" load must be blocked by CORS (G2 "CORS denied").
    location ^~ /noacao/ {
        rewrite ^/noacao/(.*)$ /$1 break;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|json)$ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# -------------------------------------------------------------- site.fixture.test
# TEST-ONLY: the page host. It is a different origin from ui.fixture.test, so a
# sheet loaded from there is a cross-origin load subject to CORS, SRI and CSP.
server {
    listen 8080;
    server_name site.fixture.test;
    root /srv/fixtures;

    include /etc/nginx/snippets/security-headers.conf;

    default_type text/html;

    # Mode B: a locally vendored copy of the same bytes on the page origin.
    location ^~ /vendor/ {
        root /srv/design;
        rewrite ^/vendor/(.*)$ /$1 break;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # TEST-ONLY CSP allow: the stand-in sheet host is listed in style-src.
    location ^~ /csp-allow/ {
        rewrite ^/csp-allow/(.*)$ /assets/$1 break;
        add_header Content-Security-Policy "style-src 'self' http://ui.fixture.test:8080" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # TEST-ONLY CSP deny: a cross-origin sheet is not allowed by style-src 'self'.
    location ^~ /csp-deny/ {
        rewrite ^/csp-deny/(.*)$ /assets/$1 break;
        add_header Content-Security-Policy "style-src 'self'" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The csp-deny negative control claims to be a valid page but is served under
    # a denying policy.
    location = /broken/csp-deny.html {
        add_header Content-Security-Policy "style-src 'self'" always;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~ ^/(header|assets|broken)/ {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
