# Staged, NOT applied. Provider worker egress: DNS and Temporal frontend only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: glovo-provider-egress-temporal
  namespace: mctl-assistants-provider-glovo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: temporal
      ports:
        - protocol: TCP
          port: 7233
