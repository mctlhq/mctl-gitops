# Staged, NOT reconciled (mctlhq/mctl-gitops, task A15 of mctl-api#957).
# Secret REFERENCES only: names and Vault paths, never a value. The Vault paths
# are proposals; none exists and nothing here creates one (see ../secrets-map.md).
#
# Two consumers per role, kept apart on purpose (design 6d.1 R2):
#   - CNPG managed role password: Secret in platform-db (see roles.patch.md).
#   - The runtime reads the runtime credential from an OPTIONAL envFrom Secret in
#     the mctl-api namespace; the migrator credential is mounted ONLY into the
#     migration job's namespace Secret below, never into the mctl-api pod.
# Variable names differ from the existing DB_USER/DB_PASSWORD on purpose, so the
# Glovo URL can never silently reuse the mctl-api role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: glovo-runtime-db-creds
  namespace: platform-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: glovo-runtime-db-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: platform/mctl-api/glovo-runtime-database
        property: username
    - secretKey: password
      remoteRef:
        key: platform/mctl-api/glovo-runtime-database
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: glovo-migrator-db-creds
  namespace: platform-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: glovo-migrator-db-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: platform/mctl-api/glovo-migrator-database
        property: username
    - secretKey: password
      remoteRef:
        key: platform/mctl-api/glovo-migrator-database
        property: password
---
# Runtime credential for the mctl-api pod (optional envFrom, GLOVO_DB_USER and
# GLOVO_DB_PASSWORD feed GLOVO_DB_URL; see mctl-api-env.patch.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-glovo-runtime-db
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-glovo-runtime-db
    creationPolicy: Owner
    template:
      data:
        GLOVO_DB_USER: "{{ .username }}"
        GLOVO_DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: platform/mctl-api/glovo-runtime-database
        property: username
    - secretKey: password
      remoteRef:
        key: platform/mctl-api/glovo-runtime-database
        property: password
---
# Migrator credential, mounted only into the migration job (migration-job.yaml).
# Its own namespace is an open item (see the PR body): in mctl-api it would sit
# next to the runtime pod, which design 6d.1 R2 forbids for the pod, not for
# the namespace, so the job's ServiceAccount is the only reader allowed by RBAC.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-glovo-migrator-db
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-glovo-migrator-db
    creationPolicy: Owner
    template:
      data:
        GLOVO_MIGRATOR_DB_USER: "{{ .username }}"
        GLOVO_MIGRATOR_DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: platform/mctl-api/glovo-migrator-database
        property: username
    - secretKey: password
      remoteRef:
        key: platform/mctl-api/glovo-migrator-database
        property: password
