# Staged, NOT reconciled. The migration job of design 6d.1 (4): runs
# cmd/glovo-migrate (mctl-api#1004 task 1) as glovo_migrator, once per schema
# version, AFTER the separately authorized operator step (roles, transitional
# grants, ownership transfer; see roles.patch.md) has been done and verified.
#
# Inert three ways: suspend: true, a placeholder image tag, and a command that
# fails closed (/bin/false) until cmd/glovo-migrate ships in an image and a
# separately authorized activation PR sets the real command and tag and
# unsuspends. Binary contract as shipped in mctl-api 4.156.1: DSN from env
# MCTL_GLOVO_MIGRATE_DSN (sslmode=require, never printed), -workitems-role
# (required), -runtime-role (default glovo_runtime), -expect-role (default
# glovo_migrator), -dry-run, -verify, -lock-timeout, -statement-timeout.
# Exit codes: 0 ok, 1 refused (role, ownership, CREATE, newer schema),
# 2 -verify not ready, 3 could not observe / lock timeout / step failed.
# The operator runs -dry-run and -verify by hand; see roles.patch.md,
# "Migrator exit codes and flags".
# The args below are inert while command is /bin/false.
apiVersion: batch/v1
kind: Job
metadata:
  name: glovo-schema-migrate
  namespace: mctl-api
  labels:
    app.kubernetes.io/name: glovo-schema-migrate
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glovo-schema-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/mctlhq/mctl-api:PENDING-1004-GLOVO-MIGRATE
          command: ["/bin/false"]   # activation PR: the cmd/glovo-migrate entry point
          args:
            - -workitems-role=mctl_api_workitems
            - -runtime-role=glovo_runtime
            - -expect-role=glovo_migrator
          envFrom:
            - secretRef:
                name: mctl-api-glovo-migrator-db
          env:
            # One DSN as glovo_migrator on database mctl-api. $(VAR) expands the
            # envFrom keys above. The password is URL-safe (random hex, see
            # mctl-gitops#2621 / the Vault provisioning step).
            - name: MCTL_GLOVO_MIGRATE_DSN
              value: "postgresql://$(GLOVO_MIGRATOR_DB_USER):$(GLOVO_MIGRATOR_DB_PASSWORD)@shared-pg-rw.platform-db.svc:5432/mctl-api?sslmode=require"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
