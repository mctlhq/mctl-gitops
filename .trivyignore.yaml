# Trivy findings this repository has looked at and accepted, with the reason.
# Auto-detected by trivy (>= v0.52) alongside the plain .trivyignore; the
# `trivy` job in .github/workflows/security.yml passes it explicitly so the
# scan does not depend on that auto-detection.
#
# Nothing here suppresses a rule globally: every entry is pinned to the exact
# path that produced it, so the same finding anywhere else still fails CI.

secrets:
  - id: github-pat
    paths:
      - "platform-gitops/argo-workflows/config/otel-trace-fixture-configmap.yaml"
    statement: >-
      Not a credential. This ConfigMap is generated by
      scripts/materialize-otel-trace-fixture.py from tests/fixtures/
      devloop-trace-redaction.json, whose whole purpose is to carry a string
      matching the OTel collector's `ghp_[A-Za-z0-9]{36}` blocked_values
      pattern so tests/test_devloop_trace_fixture.py can prove the redaction
      processor actually strips it. The value is fabricated and matches no
      real token; changing its shape would disarm the test it exists for
      (mctlhq/mctl-gitops#903). Trivy's secret scanner already allows the
      tests/fixtures/ original by path -- this entry covers only the
      materialized copy, which lands outside that allow-list because ArgoCD
      syncs platform-gitops/argo-workflows into the emitter pod's namespace.
