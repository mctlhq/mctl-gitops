# ClusterSecretStore for Vault — PLATFORM PATHS ONLY.
#
# This store is usable from every namespace and authenticates as the ESO
# controller's own ServiceAccount, so whatever it can read, every tenant can
# read. Its policy is therefore restricted to secret/data/platform/*.
# Tenant secrets are served by the namespaced `tenant-store` SecretStore that
# the tenant chart renders per namespace; DB credentials in platform-db are
# served by `cnpg-db-creds`. Do not add teams/* back to external-secrets-read.
#
# Prerequisites:
#   1. Vault must be initialized and unsealed
#   2. Kubernetes auth method must be enabled in Vault:
#      vault auth enable kubernetes
#      vault write auth/kubernetes/config \
#        kubernetes_host="https://kubernetes.default.svc:443"
#   3. A Vault role for ESO must be created:
#      vault write auth/kubernetes/role/external-secrets \
#        bound_service_account_names=external-secrets \
#        bound_service_account_namespaces=external-secrets \
#        policies=external-secrets-read \
#        ttl=1h
#   4. The matching policy is vault-policy-external-secrets-read.hcl:
#      vault policy write external-secrets-read vault-policy-external-secrets-read.hcl
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
