## Argo CD bootstrap configuration for mctl.me preview
## Minimal config — full configuration managed by argocd-self-managed via GitOps
## See: platform-gitops/argocd/values.yaml
## Do not patch argocd-cm manually; change configs.cm here or in the self-managed values.

nameOverride: argocd

global:
  domain: ops.mctl.ai
  # Argo CD images are public (quay.io/argoproj, ghcr.io/dexidp, public ECR
  # for redis). No imagePullSecret is required; clear it explicitly so the
  # field cannot inherit a stale ghcr-registry value from a prior release.
  imagePullSecrets: []

configs:
  cm:
    admin.enabled: false
    timeout.reconciliation: 180s

    # No dex.config here, deliberately. SSO is configured by
    # argocd-self-managed from platform-gitops/argocd/values.yaml (an OIDC
    # connector against Backstage), which replaces whatever this bootstrap
    # release installed as soon as it first syncs.
    #
    # A GitHub connector used to sit here and could never have worked: it
    # referenced $github-client-id / $github-client-secret, and those keys
    # are written into argocd-secret by
    # platform-gitops/argocd/templates/argocd-github-oauth.yaml — part of the
    # self-managed chart, not of this release. During bootstrap the keys (and
    # ESO itself, which arrives via root-app) do not exist yet, so dex cannot
    # resolve them; by the time they do exist, the same sync has already
    # replaced this dex.config with the Backstage one.
    #
    # So there is no SSO in the window between this release coming up and
    # argocd-self-managed syncing. That is not a regression — see the
    # "Disaster recovery" section of ../../README.md for how to drive ArgoCD
    # during that window.

    # Health checks needed for bootstrap
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          for _, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" then
              if condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message or "SecretSynced"
              else
                hs.status = "Degraded"
                hs.message = condition.message or "Not ready"
              end
              return hs
            end
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for sync"
      return hs

    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  params:
    # HTTP inside the cluster; TLS terminates at Traefik (ingress.tls below).
    # Same compensating control as platform-gitops/argocd/values.yaml.
    server.insecure: true

  rbac:
    policy.csv: ""
    policy.default: ""
    scopes: "[groups]"

  secret:
    createSecret: true

  # Helm's default upgrade merge carries forward unset top-level keys from
  # prior releases unless explicitly cleared here (same class of bug as the
  # imagePullSecrets fix above). repositories/credentialTemplates were found
  # to still contain a third-party repo credential left over from an earlier
  # release of this chart release name.
  #
  # Must be `null`, not `{}` — Helm coalesces maps recursively on merge, so
  # an empty map does not remove existing child keys from a stored release's
  # values; only an explicit null unsets the key entirely.
  repositories: null
  credentialTemplates: null

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: true
    extraTls:
      - hosts:
          - ops.mctl.ai
        secretName: argocd-tls

extraObjects:
  # ArgoCD self-managed — manages its own configuration from git
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: argocd-self-managed
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/mctlhq/mctl-gitops.git
        targetRevision: main
        path: platform-gitops/argocd
        helm:
          releaseName: argocd
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: argocd-secret
          jsonPointers:
            - /data
            - /metadata/annotations
        - group: external-secrets.io
          kind: ExternalSecret
          # Scalar paths only. A jq path that indexes INTO an array, combined
          # with RespectIgnoreDifferences + ServerSideApply, makes ArgoCD merge
          # the live array elements back into the apply payload, so spec.data
          # can never shrink (#789, upstream argo-cd#17694). The three
          # `.spec.data[].remoteRef.*` entries that used to sit here were
          # removed from git in #790; seeding them here would hand a rebuilt
          # cluster the bug back for the minutes before argocd-self-managed
          # first syncs.
          jqPathExpressions:
            - .spec.target.deletionPolicy
            - .spec.target.template.engineVersion
            - .spec.target.template.mergePolicy

  # Root app — manages user applications (separate from ArgoCD)
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: root-app
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        # root-app manages itself with prune: true, so without this a rename
        # or deletion of its own manifest would make it prune itself — and the
        # cascading finalizer above would walk every child Application on the
        # way out. See platform-gitops/bootstrap/templates/bootstrap/root-app.yaml.
        argocd.argoproj.io/sync-options: Prune=false
    spec:
      project: default
      source:
        repoURL: https://github.com/mctlhq/mctl-gitops.git
        targetRevision: main
        path: platform-gitops/bootstrap
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      # No ServerSideApply / RespectIgnoreDifferences here, deliberately: the
      # live root-app has neither, and the finalizer rule below indexes into an
      # array — the #789 shape, which is only safe WITHOUT
      # RespectIgnoreDifferences. root-app also owns no ExternalSecrets, so the
      # ExternalSecret rule that used to sit here was pure liability.
      ignoreDifferences:
        - group: argoproj.io
          kind: Application
          jqPathExpressions:
            - .metadata.finalizers[] | select(startswith("pre-delete-finalizer.argocd.argoproj.io"))
