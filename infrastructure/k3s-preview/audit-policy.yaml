# Kubernetes API server audit policy for mctl-preprod (SOC F20).
# This is NOT a cluster-scoped API object — do not kubectl apply it.
# k3s loads it from /var/lib/rancher/k3s/server/audit.yaml via
# kube-apiserver-arg (see kube.tf control_planes_custom_config).
#
# Rules are first-match. Secret values and bearer tokens must never appear
# in Request/RequestResponse bodies, so those objects stay at Metadata.
apiVersion: audit.k8s.io/v1
kind: Policy
omitManagedFields: true
rules:
  # Health and metrics: noise, no security value.
  - level: None
    nonResourceURLs:
      - /healthz*
      - /livez*
      - /readyz*
      - /metrics
      - /version

  # Secrets: metadata only. Request/RequestResponse would dump secret values.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets"]

  # TokenReview/TokenRequest bodies carry bearer tokens. Metadata records
  # that an authn check happened without logging the token. (RequestResponse
  # on authentication.k8s.io would violate "no dumping of secret values".)
  - level: Metadata
    resources:
      - group: "authentication.k8s.io"
        resources: ["tokenreviews", "tokenrequests"]

  # Authorization reviews: request+response, no secret values.
  - level: RequestResponse
    resources:
      - group: "authorization.k8s.io"
        resources:
          - subjectaccessreviews
          - localsubjectaccessreviews
          - selfsubjectaccessreviews
          - selfsubjectrulesreviews

  # Everything else: who did what to which object, no request bodies.
  - level: Metadata
