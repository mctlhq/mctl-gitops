spec:
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc

# AlertManager Telegram notifications
# Set the chat ID for your Telegram group/channel
alertmanager:
  telegramChatId: 210408407

# OpenTelemetry Collector (traces gateway, phase 1 -- issue #902)
otelCollector:
  # Matches infrastructure/k3s-preview/kube.tf:120 (cluster_name =
  # "mctl-preprod"). destination.server above is the in-cluster API, so this
  # bootstrap values file only ever describes the one cluster ArgoCD here
  # reconciles; a second cluster gets its own bootstrap values with its own
  # clusterName/environment.
  clusterName: mctl-preprod
  environment: preprod
  # Empty until a trace backend is chosen. With this empty, the collector's
  # traces pipeline lists only the debug exporter -- see
  # docs/runbooks/otel-collector.md for the one-key swap procedure.
  backendEndpoint: ""
  # issue-903: generalized fan-out for the trace-backend comparison spike.
  # Empty by default, so the rendered collector ConfigMap stays
  # byte-identical to the backendEndpoint-only render. Each entry is
  # {name, endpoint, insecure, headers, numConsumers, queueSize}; headers
  # must hold ${env:...} expansion expressions, never a literal credential.
  # The live spike (populating this list, deploying candidates) is
  # mctlhq/mctl-gitops#1280 -- see docs/adr/0001-agent-execution-trace-backend.md.
  backends: []
  # Evaluation namespace and candidate Applications for the issue-903 spike,
  # gated off by default so merging this key's templates changes no cluster
  # state. Filled in and flipped on by mctlhq/mctl-gitops#1280, not here.
  # Each candidates[] entry is {name, enabled, repoURL, chart,
  # targetRevision, manifestsPath, otlpEndpoint, insecure, values}. `enabled`
  # is the per-candidate flag (issue #1355): the outer eval.enabled guard
  # still dominates, so a candidate flag on with the sandbox off renders
  # nothing. `values` is an optional map of Helm values passed to the
  # candidate chart. `otlpEndpoint`, when set, drives the collector fan-out
  # in otel-collector.yaml (issue #1355) -- a candidate with no otlpEndpoint
  # is deployed but receives no spans.
  eval:
    enabled: false
    teardownAfter: ""
    # issue #1355 / #1280: ResourceQuota (eval-namespace.yaml's
    # observability-eval-quota) rendered into observability-eval only while
    # eval.enabled is true. The two mandated caps --
    # persistentvolumeclaims/requests.storage -- exist because the sandbox's
    # only measured precedent for a candidate's default PVC footprint is
    # "whatever the chart ships", and this cluster's only current
    # object-storage user is Loki on Cloudflare R2, not a candidate chart.
    # Sized from the tenant chart's precedent
    # (helm-charts/tenant/values.yaml:22-35), scaled up for a
    # ClickHouse/Postgres-class candidate on three cx43 workers.
    quota:
      requests.cpu: "4"
      requests.memory: "12Gi"
      limits.cpu: "8"
      limits.memory: "20Gi"
      # Kept close to the limits.cpu/limits.default.cpu ceiling (8
      # max-limit containers), matching the tenant chart's own
      # ~1.25x headroom precedent (helm-charts/tenant/values.yaml
      # quotas.pods: "10" vs its 8 max-limit containers), not a
      # loose 4x bound.
      pods: "10"
      persistentvolumeclaims: "4"
      requests.storage: "40Gi"
    # issue #1355 / #1280: LimitRange (eval-namespace.yaml's
    # observability-eval-limits) container defaults, same shape as
    # helm-charts/tenant/values.yaml:70-81's limitRange block.
    limits:
      default:
        cpu: "1"
        memory: "2Gi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "4"
        memory: "8Gi"
    # issue #1355: committed, pinned, disabled candidate catalogue. Every
    # `enabled` below stays false in this proposal -- mctlhq/mctl-gitops#1280
    # flips exactly the candidates it is actively soaking. Candidate F
    # (agento11y) is intentionally absent: it has no self-managed shape to
    # pin (confirmed at implementation time against
    # https://github.com/grafana/agento11y -- an SDK that ships telemetry to
    # Grafana Cloud, no Helm chart, Docker image or Kubernetes manifest of
    # its own), so committing a candidate entry or a manifestsPath directory
    # for it would be exactly the fabricated-pin outcome this proposal
    # refuses. See docs/runbooks/tracing-bake-off.md's preconditions section.
    candidates:
      - name: tempo
        enabled: false
        repoURL: https://grafana.github.io/helm-charts
        chart: tempo-distributed
        # Resolved 2026-09-24 from
        # https://grafana.github.io/helm-charts/index.yaml (generated
        # 2026-09-21): chart 1.61.3, appVersion 2.9.0 -- the newest entry
        # for tempo-distributed in that index at implementation time,
        # matching the exact-pin convention every other chart in this repo
        # uses (loki.yaml, otel-collector.yaml).
        targetRevision: "1.61.3"
        # No manifestsPath: every setting is the inline `values` below
        # (helm.valuesObject) and tempo needs no supplemental manifests. A
        # manifestsPath directory is synced as raw Kubernetes manifests, so it
        # must hold only resources with apiVersion/kind. ArgoCD skips a
        # non-resource YAML there in silence -- but hard-fails manifest
        # generation on one whose bytes happen to contain apiVersion:, kind:
        # and metadata: (comments count). Both are traps: a silently skipped
        # file reads as configuration in force that is not.
        # tests/test_otel_collector_backends_render.py rejects both.
        # Matches `values.fullnameOverride` below, so this endpoint does not
        # depend on the ArgoCD Application/Helm release name
        # (otel-eval-tempo) the chart would otherwise derive the service
        # name from.
        otlpEndpoint: "tempo-distributed-distributor.observability-eval.svc.cluster.local:4317"
        insecure: true
        values:
          fullnameOverride: tempo-distributed
          traces:
            otlp:
              grpc:
                # The collector's eval fan-out (otel-collector.yaml) sends
                # OTLP/gRPC only. Off by chart default; every other
                # ingestion path (Jaeger, Zipkin, OpenCensus) stays off too.
                enabled: true
          # Ephemeral local-disk block storage, not object storage: this is
          # a disposable bake-off trial, not a production trace store, and
          # `backend: local` is also the chart's own default -- stated
          # explicitly so a later values edit cannot silently repoint this
          # candidate at object storage without a reviewer seeing the diff.
          storage:
            trace:
              backend: local
          # One replica, not the chart's default three: a bake-off trial
          # under the fixed quota above (persistentvolumeclaims: "4"), not
          # an HA deployment. Replication is exactly what
          # docs/adr/0001-rubric.yaml's `operations` dimension scores
          # post-soak.
          ingester:
            replicas: 1
            # Must match replicas above: the chart defaults
            # ingester.config.replication_factor to 3, which a single
            # ingester replica can never quorum-write against.
            config:
              replication_factor: 1
            persistence:
              enabled: true
              size: 10Gi
            # Explicit, not left at the chart's default true: zone-aware
            # replication shards the ingester StatefulSet across zones, so
            # even with replicas: 1 above the chart would still schedule
            # roughly one ingester pod per zone. That silently multiplies
            # pod and PVC usage against the fixed quota above (quota.pods
            # now "10", tightened from "30" by this same change) -- pinned
            # false because this bake-off trial wants exactly one ingester
            # pod, not an HA/multi-zone deployment.
            zoneAwareReplication:
              enabled: false
          # Explicitly disabled, not left at the chart's already-false
          # default -- vmagent runs selectAllByDefault: true
          # (monitoring.yaml:287), the #1159 double-scrape shape
          # eval-candidates.yaml's header (lines 14-23) warns about.
          # tempo-distributed has no separate PodMonitor toggle;
          # ServiceMonitor is its only Prometheus-Operator integration
          # point.
          metaMonitoring:
            serviceMonitor:
              enabled: false

# Usage-writer principal for the FinOps usage ledger (mctlhq/.github#50,
# variant B): service:mctl-agents-usage, which may only append usage records
# (POST /api/v1/usage/records). On since 2026-09-24; set false to disable.
#
# The token lives in ONE place, Vault secret/platform/mctl-agents, property
# usage-writer-token. The agent runner pods already receive it from there
# (mctl-agents-secrets extracts that whole path, and the investigate,
# implement and shepherd templates reference the key as optional). Enabling
# this flag is what hands the same value to mctl-api: it renders the
# mctl-api-usage-writer ExternalSecret and points the chart at it.
#
# Why a flag and not just an optional reference: an ExternalSecret whose
# Vault property does not exist goes Degraded, and ArgoCDApplicationDegraded
# fires after 30m. With the flag off nothing is rendered at all.
#
# Owner steps, in this order:
#   1. printf '%s' "$(openssl rand -hex 32)" \
#        | vault kv patch -method=rw secret/platform/mctl-agents usage-writer-token=-
#      (-method=rw: the admin policy has no `patch` capability, so HTTP PATCH
#      is 403; rw reads and writes back with check-and-set on the version.)
#      PATCH, never PUT: put would replace every other key at that path,
#      including the Claude OAuth tokens. At least 32 characters, and it must
#      differ from MCTL_AGENT_SERVICE_TOKEN and from every surface token, or
#      mctl-api refuses it.
#   2. Set enabled: true below (mctl-api then rolls to pick up the env).
#   Done 2026-09-24: step 1 (Vault v2634), step 2 below.
usageWriter:
  enabled: true

# The evidence-writer principal's bearer token (mctlhq/mctl-agents#199,
# mctlhq/mctl-api#409). Same shape as usageWriter above: ONE value in Vault
# secret/platform/mctl-agents, property evidence-writer-token, which the agent
# runner pods already receive through mctl-agents-secrets (dataFrom extract).
# This flag hands the same value to mctl-api.
# Done 2026-10-05 (owner decision 2026-10-04): step 1, a fresh random 64-hex
# value written with vault kv patch -method=rw (Vault v3138; no other key
# changed); step 2 is enabled: true below.
evidenceWriter:
  enabled: true

# The registry-publisher principal's bearer token (mctlhq/mctl-agents#470,
# mctlhq/mctl-api#481, mctl-api >= 4.67.0): the mctl-agents release pipeline
# publishes and promotes agent versions with it instead of the admin service
# token the agent pods also hold. Vault: secret/platform/mctl-api/registry-publisher,
# property token (>= 32 chars, different from every other principal's token,
# or mctl-api refuses it). Its own path on purpose: the agent runner pods
# extract all of secret/platform/mctl-agents and must never receive this one.
#   1. Write the value to Vault (owner).
#   2. Set enabled: true below (mctl-api then rolls to pick up the env).
registryPublisher:
  enabled: true

# The surface:portal principal's bearer token (mctlhq/mctl-portal#126):
# mctl-api reads it as MCTL_SURFACE_PORTAL_TOKEN (surfaceTokenEnv maps portal
# to it, minSurfaceTokenLen = 32) and backstage's work-items-backend sends it.
# Vault: secret/platform/mctl-api/surface-tokens portal-token, written
# 2026-10-04 (v2) with the telegram token; distinct from every other token.
# mctl-api picks it up once its chart carries surfacePortalTokenSecret
# (mctlhq/mctl-api#439); backstage reads it as an optional env.
surfacePortalToken:
  enabled: true

# The surface:telegram principal's bearer token (mctlhq/mctl-telegram#443,
# mctlhq/mctl-gitops#1405): mctl-api authenticates it from
# MCTL_SURFACE_TELEGRAM_TOKEN (internal/auth/oidc.go, surfaceTokenEnv maps
# telegram -> that variable, minSurfaceTokenLen = 32). Same pattern as
# usageWriter above -- its own ExternalSecret and its own flag, so a Vault
# property that does not exist degrades only this principal.
#
# Owner steps, in this order:
#   0. The mctl-api Helm chart (a different repo, helm/ dir) needs an
#      optional surfaceTelegramTokenSecret value mirroring
#      usageWriterTokenSecret. Until that lands, mctl-api.yaml's reference is
#      inert: Helm passes the value and mctl-api's chart simply ignores an
#      unknown key.
#   1. printf '%s' "$(openssl rand -hex 32)" \
#        | vault kv patch -method=rw secret/platform/mctl-api/surface-tokens telegram-token=-
#      (-method=rw, never `put`: put would replace every other key at that
#      path. At least 32 bytes per minSurfaceTokenLen, and it must differ
#      from MCTL_AGENT_SERVICE_TOKEN and from every other surface token, or
#      mctl-api refuses it.)
#   2. Set enabled: true below (mctl-api then rolls to pick up the env).
# Done: step 0 (mctl-api helm surfaceTelegramTokenSecret), step 1 on
# 2026-10-04 (Vault v2, together with portal-token), step 2 below.
surfaceTelegramToken:
  enabled: true

# Namespaces whose workloads are written outside the platform team's review
# (a tenant's own Git repository, a service of theirs that pushes to it),
# each with the only Secrets and ServiceAccounts its Pods may use. Enforced by
# the mctl-external-manifests-secret-allowlist admission policy in
# templates/system/admission-policies.yaml.
#
# Every namespace also holds Secrets it never asked for: the reflector copies
# argo-workflows/github-actions-pat, argo-workflows/mctl-gitops-deploy-key and
# the database/* credentials into all of them (#1230), and the tenant chart
# adds ghcr and artifact-store (R2) credentials. It also creates argo-workflow-sa, whose
# Roles read every Secret in the namespace through the API. In a reviewed
# namespace that is a latent risk; where someone outside the platform writes
# the Pod specs, mounting a Secret or running as that ServiceAccount is one
# commit away. So in these namespaces a Pod may name only the Secrets listed
# here (volumes of every kind, env, envFrom, imagePullSecrets) and run only as
# a listed ServiceAccount. Add a Secret in the same change that adds the
# ExternalSecret producing it.
#
# Four more policies hold what reaches outside the namespace: Ingress hosts
# must match hostPattern, every Traefik kind is refused, Services must be
# ClusterIP without externalIPs (no NodePort, no LoadBalancer: those open
# node ports or buy a Hetzner load balancer), and ConfigMaps and Secrets may
# not carry grafana_* labels (the Grafana sidecar reads those cluster-wide).
#
# Platform workflows cannot run in these namespaces as a consequence
# (argo-workflow-sa, minio-artifact-credentials): that is intended.
externalManifestNamespaces:
  # git.mctl.ai/erpact/mctl-apps. Its ExternalSecrets will live in this
  # chart, templates/erpact/externalsecrets.yaml, added by the erpact wiring
  # (#1516) together with project erpact; never in that repository.
  erpact:
    secrets:
      - clo-s3
      - deployer-git
      - deployer-secret
      # R2 token for the copy's backups (bucket erpact-backups only).
      - erpact-backup-r2
      # OIDC client of the sites in ZITADEL, filled by the zitadel-iac Job;
      # declared in infra-components/erpact/oidc-zitadel.yaml (#1501).
      - erpact-oidc-zitadel
      # Tenant users each Frappe site must have (e-mail, names, sites,
      # roles; only users opted in with "frappe"), also from zitadel-iac.
      - erpact-frappe-users
      - mariadb-root
    # No RBAC is bound to default in erpact. Project erpact (#1516) admits
    # no Secret and no RBAC kind from the tenant's repository, so that
    # repository can neither bind a Role to default nor mint a
    # service-account-token Secret under an allowed name.
    serviceAccounts:
      - default
    # Ingress hosts (rules and TLS) must match this RE2 pattern in full (the
    # policy anchors it), so the repository cannot claim another tenant's
    # unreserved *.mctl.ai name. Traefik kinds of any sort are refused outright.
    hostPattern: 'erpact-[a-z0-9]([a-z0-9-]*[a-z0-9])?\.mctl\.ai'

# Platform hostnames and the namespaces allowed to serve them (#1503),
# enforced by the mctl-reserved-platform-hosts-* admission policies in
# templates/system/admission-policies.yaml. A host that is not listed is
# unrestricted (every tenant host). An empty list reserves a name for nobody
# in the cluster.
#
# Adding a platform host = adding it here in the same change that adds its
# Ingress. Before merging, run scripts/test-reserved-hosts-policy.sh with
# --admit on a dump of the live routes (docs/runbooks/reserved-hosts.md): a
# wrong owner here refuses that component's next sync.
reservedPlatformHosts:
  mctl.ai: [admins]
  www.mctl.ai: [admins]
  mctl.ru: [admins]
  www.mctl.ru: [admins]
  mctl.me: [admins]
  agent.mctl.ai: [admins]
  docs.mctl.ai: [admins]
  ui.mctl.ai: [admins]
  # ZITADEL, plus the usual identity-provider aliases so none of them can be
  # stood up by a tenant to imitate the sign-in page.
  auth.mctl.ai: [zitadel]
  id.mctl.ai: [zitadel]
  login.mctl.ai: [zitadel]
  sso.mctl.ai: [zitadel]
  accounts.mctl.ai: [zitadel]
  api.mctl.ai: [mctl-api]
  app.mctl.ai: [backstage]
  ops.mctl.ai: [argocd]
  secrets.mctl.ai: [vault]
  workflows.mctl.ai: [argo-workflows]
  git.mctl.ai: [forgejo]
  grafana.mctl.ai: [monitoring]
  temporal.mctl.ai: [temporal]
  admins-temporal-web.mctl.ai: [temporal]
  # mctl-telegram, a platform product deployed in the labs tenant.
  tg.mctl.ai: [labs]
  tg-preview.mctl.ai: [labs]
  # The Cloudflare MCP portal; never served from the cluster.
  mcp.mctl.ai: []
