spec:
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc

# AlertManager Telegram notifications
# Set the chat ID for your Telegram group/channel
alertmanager:
  telegramChatId: 210408407

# OpenTelemetry Collector (traces gateway, phase 1 -- issue #902)
otelCollector:
  # Matches infrastructure/k3s-preview/kube.tf:120 (cluster_name =
  # "mctl-preprod"). destination.server above is the in-cluster API, so this
  # bootstrap values file only ever describes the one cluster ArgoCD here
  # reconciles; a second cluster gets its own bootstrap values with its own
  # clusterName/environment.
  clusterName: mctl-preprod
  environment: preprod
  # Empty until a trace backend is chosen. With this empty, the collector's
  # traces pipeline lists only the debug exporter -- see
  # docs/runbooks/otel-collector.md for the one-key swap procedure.
  backendEndpoint: ""
  # issue-903: generalized fan-out for the trace-backend comparison spike.
  # Empty by default, so the rendered collector ConfigMap stays
  # byte-identical to the backendEndpoint-only render. Each entry is
  # {name, endpoint, insecure, headers, numConsumers, queueSize}; headers
  # must hold ${env:...} expansion expressions, never a literal credential.
  # The live spike (populating this list, deploying candidates) is
  # mctlhq/mctl-gitops#1280 -- see docs/adr/0001-agent-execution-trace-backend.md.
  backends: []
  # Evaluation namespace and candidate Applications for the issue-903 spike,
  # gated off by default so merging this key's templates changes no cluster
  # state. Filled in and flipped on by mctlhq/mctl-gitops#1280, not here.
  # Each candidates[] entry is {name, repoURL, chart, targetRevision,
  # manifestsPath, values}. `values` is an optional map of Helm values
  # passed to the candidate chart.
  eval:
    enabled: false
    teardownAfter: ""
    candidates: []

# Usage-writer principal for the FinOps usage ledger (mctlhq/.github#50,
# variant B): service:mctl-agents-usage, which may only append usage records
# (POST /api/v1/usage/records). On since 2026-09-24; set false to disable.
#
# The token lives in ONE place, Vault secret/platform/mctl-agents, property
# usage-writer-token. The agent runner pods already receive it from there
# (mctl-agents-secrets extracts that whole path, and the investigate,
# implement and shepherd templates reference the key as optional). Enabling
# this flag is what hands the same value to mctl-api: it renders the
# mctl-api-usage-writer ExternalSecret and points the chart at it.
#
# Why a flag and not just an optional reference: an ExternalSecret whose
# Vault property does not exist goes Degraded, and ArgoCDApplicationDegraded
# fires after 30m. With the flag off nothing is rendered at all.
#
# Owner steps, in this order:
#   1. printf '%s' "$(openssl rand -hex 32)" \
#        | vault kv patch -method=rw secret/platform/mctl-agents usage-writer-token=-
#      (-method=rw: the admin policy has no `patch` capability, so HTTP PATCH
#      is 403; rw reads and writes back with check-and-set on the version.)
#      PATCH, never PUT: put would replace every other key at that path,
#      including the Claude OAuth tokens. At least 32 characters, and it must
#      differ from MCTL_AGENT_SERVICE_TOKEN and from every surface token, or
#      mctl-api refuses it.
#   2. Set enabled: true below (mctl-api then rolls to pick up the env).
#   Done 2026-09-24: step 1 (Vault v2634), step 2 below.
usageWriter:
  enabled: true
