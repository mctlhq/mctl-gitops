apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 0.47.5
    helm:
      values: |
        server:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          authModes:
            - sso
            - client
          # #1560: the server serves TLS itself, because that is the only
          # thing that makes it mark its SSO cookies (state, `authorization`)
          # Secure: sso.New gets secure = TLS config present (v3.7.11
          # server/apiserver/argoserver.go). TLS still terminates for
          # browsers at Traefik, which re-encrypts to the pod's self-signed
          # certificate (serviceAnnotations, extraObjects below). The probes
          # switch to HTTPS with this flag; HSTS comes on with it.
          # Residual risk: the cookie name `authorization` is hard-coded, so a
          # Domain=.mctl.ai cookie from a tenant host can still shadow it.
          secure: true
          serviceAnnotations:
            traefik.ingress.kubernetes.io/service.serversscheme: https
            traefik.ingress.kubernetes.io/service.serverstransport: argo-workflows-argo-workflows-server-tls@kubernetescrd
          extraArgs: []
          # Signs in through ZITADEL. Who gets in, and as which SSO RBAC
          # ServiceAccount, is declared in helm-charts/zitadel-iac/iac/workflows.tf:
          # `groups` carries only the user's roles on the "Argo Workflows"
          # project (admins, or the user's tenant on the "workflows" flag),
          # and ZITADEL refuses a token to anyone without one. The client
          # credentials are written by the zitadel-iac Job into
          # argo-workflows-sso-zitadel (argo-workflows/config/sso-zitadel.yaml).
          sso:
            enabled: true
            issuer: https://auth.mctl.ai
            clientId:
              name: argo-workflows-sso-zitadel
              key: client-id
            clientSecret:
              name: argo-workflows-sso-zitadel
              key: client-secret
            redirectUrl: https://workflows.mctl.ai/oauth2/callback
            # No `groups` scope: ZITADEL sets the claim from the groups
            # action, not from a scope.
            scopes:
              - openid
              - profile
              - email
            rbac:
              enabled: true
            customGroupClaimName: groups
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - workflows.mctl.ai
              - workflows.mctl.ai
            tls:
              - hosts:
                  - workflows.mctl.ai
                  - workflows.mctl.ai
                secretName: argo-workflows-tls

        controller:
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # Controller bursts above 500m during workflow reconciliation,
              # causing recurring CPUThrottlingHigh. Raised 500m→750m.
              # Still throttling at 750m (incident 11a55db1, 2026-08-15) —
              # raised another 20% to 900m.
              cpu: 900m
              memory: 512Mi
          metricsConfig:
            enabled: true
            port: 9090
          persistence:
            archive: true
            # Prune archived workflows after 7d. Without a TTL the archive table
            # grows unbounded (default retention is indefinite): it had reached
            # 9.3k rows / 120MB since 2026-03-20 before a TTL was first set (30d).
            # Lowered 30d->7d on 2026-06-07: at ~700 wf/day a 30d window let the
            # archive reach ~20k rows of large workflow JSON. The Server merges
            # archived workflows into the live `/api/v1/workflows/` list whenever
            # the phase filter includes a terminal phase (the default UI filter
            # includes Succeeded), and that merge query's on-disk sort spilled
            # past shared-pg's temp_file_limit (256MB) -> SQLSTATE 53400, which
            # broke the entire Workflows UI. 7d (~5k rows) keeps the merge query
            # small. GC cadence is governed by ARCHIVED_WORKFLOW_GC_PERIOD (24h).
            archiveTTL: 7d
            # Node-status offload to PostgreSQL is DISABLED. At this scale the
            # live workflow count is tiny (the 30-min success TTL keeps very few
            # objects around), so the kube-apiserver watch-cache pressure that
            # offload mitigates does not exist, while offload has been nothing
            # but trouble: the offload GC first crashed every pass on NULL
            # `version` rows (when tableName collided with the archive table),
            # and after correcting tableName the offload table no longer exists
            # in the DB (Argo's migrate framework skips creating it because
            # schema_history was already stamped at the latest version by the
            # earlier broken config), so the GC now logs
            # `relation "argo_workflows" does not exist` every ~5 min.
            # Disabling nodeStatusOffLoad removes the offload-GC query path,
            # but it does not repair the database. A plain workflow list may
            # still query persistence and surface the same missing-table
            # error. Treat a recurrence as a DB migration incident: recreate
            # the expected table through Argo's migration path rather than
            # masking it with another controller toggle
            # (incident-1784173500).
            # archive: true above is unaffected — archiving uses the hardcoded
            # `argo_archived_workflows` table, independent of offload.
            nodeStatusOffLoad: false
            postgresql:
              host: shared-pg-rw.platform-db.svc
              port: 5432
              database: argo-workflows
              # tableName MUST stay set even with offload disabled: the
              # controller calls GetTableName() unconditionally whenever
              # persistence is configured and fails to start on an empty value
              # ("TableName is empty"), which would also take archiving down.
              # The value is otherwise inert while nodeStatusOffLoad is false —
              # no offload table is ever created or queried.
              tableName: argo_workflows
              userNameSecret:
                name: argo-workflows-db-creds
                key: username
              passwordSecret:
                name: argo-workflows-db-creds
                key: password
          workflowDefaults:
            spec:
              serviceAccountName: argo-workflow-sa
              ttlStrategy:
                secondsAfterCompletion: 3600
                secondsAfterSuccess: 1800
                # Keep failed live objects for next-day incident inspection;
                # archived history remains available for seven days.
                secondsAfterFailure: 259200
              podGC:
                strategy: OnWorkflowCompletion
              # Delete volumeClaimTemplate PVCs (the per-workflow `workdir`) on
              # completion regardless of outcome. Argo's default is
              # OnWorkflowSuccess, which RETAINS the PVC when a workflow fails;
              # ttlStrategy then GCs the Workflow object, orphaning the PVC (and
              # its backing Hetzner volume) permanently. This left several failed
              # mctl-agents issue-poll workdir PVCs stranded (10Gi each).
              volumeClaimGC:
                strategy: OnWorkflowCompletion
              hooks:
                exit:
                  expression: "true"
                  templateRef:
                    name: global-workflow-completion-hook
                    template: notify-completion
                    clusterScope: true

        artifactRepository:
          archiveLogs: true
          # Migrated 2026-07 from self-hosted MinIO to Cloudflare R2. Bucket
          # name kept as "argo-workflows-logs" (recreated on R2 with a 30-day
          # lifecycle rule). Credentials still come from the
          # minio-artifact-credentials Secret (name unchanged), but that
          # Secret's ExternalSecret now sources R2 keys from Vault
          # (see argo-workflows/config/vault-auth.yaml).
          s3:
            endpoint: 6a09f637d20e1f66a8e9d45ebe778058.r2.cloudflarestorage.com
            bucket: argo-workflows-logs
            region: auto
            insecure: false
            accessKeySecret:
              name: minio-artifact-credentials
              key: accessKey
            secretKeySecret:
              name: minio-artifact-credentials
              key: secretKey

        workflow:
          serviceAccount:
            create: false
            name: argo-workflow-sa

        useStaticCredentials: true

        extraObjects:
          # Traefik to the Argo server. The server generates a self-signed
          # certificate at every start, so there is nothing stable to pin;
          # the hop stays inside the cluster, behind the namespace's ingress
          # NetworkPolicy (argo-workflows/config/networkpolicy.yaml). Shipped
          # in this Application so it exists before the Service annotation
          # that names it.
          - apiVersion: traefik.io/v1alpha1
            kind: ServersTransport
            metadata:
              name: argo-workflows-server-tls
              namespace: argo-workflows
            spec:
              insecureSkipVerify: true

  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
