# Human sign-in to Vault (secrets.mctl.ai) through ZITADEL, declared rather
# than typed: Vault's auth/oidc mount, the identity groups per tenant and for
# admins, and the tenant policies. Bootstrap and design:
# infrastructure/k3s-preview/cluster-bootstrap/vault-config/README.md,
# "vault-human-auth-iac".
#
# Its own namespace, so the Job that configures Vault shares no Secret with
# Vault itself (the vault namespace holds the unseal keys). The Job reaches
# Vault through auth/kubernetes with the narrow policy vault-human-auth-iac,
# which the owner applies once by hand (cluster-bootstrap/vault-config).
#
# Sources: infra-components/identity/vault-human-auth-iac holds the Secret
# the zitadel-iac Job fills with the OIDC client and the tenant list (and the
# Role that lets it), the image pull credentials and the NetworkPolicies;
# helm-charts/vault-human-auth-iac is the Job: PostSync after every sync and
# hourly, refusing any plan action outside its allowlist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-human-auth-iac
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/mctlhq/mctl-gitops.git
      targetRevision: main
      path: platform-gitops/infra-components/identity/vault-human-auth-iac
    - repoURL: https://github.com/mctlhq/mctl-gitops.git
      targetRevision: main
      path: platform-gitops/helm-charts/vault-human-auth-iac
      helm:
        releaseName: vault-human-auth-iac
  ignoreDifferences:
    # Same ESO handling as zitadel.yaml: admission-injected annotations and
    # status only; never jq paths that index into spec arrays (#789).
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .metadata.annotations
        - .spec.target.deletionPolicy
        - .status
    # Written by the zitadel-iac Job, not by Argo CD (oidc-zitadel.yaml).
    - kind: Secret
      name: vault-oidc-zitadel
      jsonPointers:
        - /data
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: vault-human-auth-iac
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
