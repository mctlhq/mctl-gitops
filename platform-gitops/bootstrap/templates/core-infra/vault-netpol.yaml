# Ingress allowlist for the Vault namespace.
#
# The tenant chart's allow-cluster-egress opens egress to all of RFC1918 with no
# port restriction, and vault/ had no ingress policy, so vault:8200 was reachable
# from every pod in the cluster. Nothing was exploitable through it — Vault
# authenticates every request — but network reachability of the secret store is
# not something tenant workloads should have.
#
# Selecting all pods with policyTypes: [Ingress] makes this an allowlist: any
# source not named below is denied. No separate default-deny is needed.
#
# Clients, from config and 72h of the stdout audit device (remote_address,
# and the service account on auth/kubernetes logins), 2026-10-12:
#   external-secrets   the ESO controller, for every ExternalSecret and tenant
#                      SecretStore in the cluster (the bulk of all requests).
#   traefik            secrets.mctl.ai: Backstage, labs services and the
#                      blackbox probe use the public hostname, so their
#                      connections arrive from a Traefik pod.
#   mctl-api           VAULT_ADDR http://vault-active.vault.svc.cluster.local:8200.
#   argo-workflows     workflow pods log in via auth/kubernetes (argo-workflow-sa).
#   vault-human-auth-iac, and workflows in tenant namespaces: see below.
#
# Peers are scoped by podSelector as well as namespace (mctl-gitops#1810,
# #1818): a namespaceSelector alone also matches hostNetwork pods, whose
# address is their node's. That is why kube-system (hcloud CCM) and monitoring
# (node-exporter on every node) are no longer listed; neither appears in the
# audit log, and kubelet probes need no rule because k3s' kube-router accepts
# traffic from the pod's own node before any policy chain. backstage and
# admins are dropped too: Backstage reaches Vault through secrets.mctl.ai, and
# nothing in admins addresses Vault.
#
# Applied by root-app, which prunes: reverting this file restores the previous
# allowlist.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-ingress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Raft peer traffic (8201), vault-active/standby service routing, and the
    # in-namespace vault-backup and vault-auto-unseal jobs.
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # The controller only; the webhook and cert-controller never call Vault.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
          podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mctl-api
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mctl-api
        # Workflows authenticate via auth/kubernetes/login (provision-database,
        # create-tenant, tpl-vault-write). Workflow pods only, not the Argo
        # server or controller.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-workflows
          podSelector:
            matchExpressions:
              - key: workflows.argoproj.io/workflow
                operator: Exists
        # The vault-human-auth-iac Job (auth/kubernetes login, then the
        # auth/oidc mount, identity groups and human-tenant-* policies). Its
        # namespace runs nothing else; the pod label narrows it to the Job.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-human-auth-iac
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-human-auth-iac
        # Argo runs some workflows inside the tenant namespace itself
        # (deploy-service, whose tpl-vault-write steps log in to Vault), and
        # those pods still need Vault login. Namespace + pod selector in one
        # element ANDs them.
        #
        # The label was forgeable when this policy was written: base-service
        # copied arbitrary .Values.podLabels onto pods and update-config applies
        # a caller-supplied config_patch to values.yaml with yq, so a tenant
        # could label an app pod and claim this exception. base-service now
        # refuses workflows.argoproj.io/* in podLabels, which closes that path
        # here and for the older allow-workflow-internet-egress policy. Argo sets
        # the label on its own pods directly, so nothing legitimate is affected.
        # Editing a tenant values.yaml by hand goes through PR review; #800
        # tracks admission control for defence in depth.
        #
        # Either way, what ultimately bounds a tenant at Vault is the per-tenant
        # role and policy from the ESO split, not this selector.
        - namespaceSelector:
            matchExpressions:
              - key: mctl.me/tenant
                operator: Exists
          podSelector:
            matchExpressions:
              - key: workflows.argoproj.io/workflow
                operator: Exists
      ports:
        - protocol: TCP
          port: 8200
