apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
      targetRevision: "0.72.5"
      helm:
        values: |
          # Use VMSingle for single-node efficiency (replacing Prometheus operator)
          vmsingle:
            enabled: true
            spec:
              # Raised 3d→14d on 2026-07-18: the mctl-agent resource
              # optimizer needs a 14-day observation window to compute
              # right-sizing recommendations directly from VM history
              # (its own SQLite/PG rollups only accumulate going forward).
              #
              # Raised 14d→28d on 2026-09-06: mctl-telegram's rolling-28d
              # compliance SLIs (vm-rules/mctl-telegram-slo.yaml) feed the
              # error-budget merge-freeze policy in that repo's docs/slo.md.
              # Raw samples beyond retention are dropped, so at 14d those
              # rules could never see more than half their window and the
              # "rolling-28-day SLI" would have been a <=14-day one forever —
              # an incident would age out of the budget two weeks early and
              # the freeze could lift while the budget was still spent.
              # Measured before raising: 4.2G used of 24.5G at 14d, so ~8.4G
              # at 28d on the existing 25Gi volume. No resize needed.
              retentionPeriod: "28d"
              resources:
                requests:
                  cpu: 100m
                  memory: 1400Mi
                limits:
                  cpu: 750m
                  # Raised 1536Mi→2Gi on 2026-06-26: working set sat at ~1409Mi
                  # (~92% of the 1536Mi cap), firing recurring ">80% memory used"
                  # warnings and risking OOM. Request stays 1400Mi (no scheduling
                  # change); the bump is pure headroom.
                  memory: 2Gi
              extraArgs:
                search.maxConcurrentRequests: "16"
                search.maxQueueDuration: "30s"
                search.cacheTimestampOffset: "12h"
              storage:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    # Sized 25Gi for the 14d retention (~4.7x the 3d data
                    # volume that fit in 10Gi). Expansion needs the storage
                    # class to allow volume expansion; if the PVC resize is
                    # rejected, VM still runs — it drops oldest data at the
                    # disk limit. vmbackup R2 size grows accordingly.
                    storage: 25Gi
              # vmbackup sidecar — backs up to Cloudflare R2 daily
              extraContainers:
                - name: vmbackup
                  image: victoriametrics/vmbackup:v1.106.1
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      while true; do
                        echo "[vmbackup] Starting backup to R2..."
                        /vmbackup \
                          -storageDataPath=/storage \
                          -snapshotCreateURL=http://localhost:8428/snapshot/create \
                          -snapshotDeleteURL=http://localhost:8428/snapshot/delete \
                          -dst=s3://vault-backup/victoria-metrics \
                          -customS3Endpoint=$S3_ENDPOINT
                        echo "[vmbackup] Done. Next run in 24h."
                        sleep 86400
                      done
                  env:
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom:
                        secretKeyRef:
                          name: victoria-backup-r2
                          key: AWS_ACCESS_KEY_ID
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: victoria-backup-r2
                          key: AWS_SECRET_ACCESS_KEY
                    - name: S3_ENDPOINT
                      valueFrom:
                        secretKeyRef:
                          name: victoria-backup-r2
                          key: S3_ENDPOINT
                  volumeMounts:
                    - name: data
                      mountPath: /storage
                  resources:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi

          # Disable bundled k8s-views-global so our patched ConfigMap
          # (z-mctl-k8s-views-global) is the sole provider of UID k8s_views_global.
          # Duplicate UIDs cause Grafana provisioner lockout in v12.
          defaultDashboards:
            dashboards:
              kubernetes-views-global:
                enabled: false

          # Core components
          defaultRules:
            enabled: true
            groups:
              etcd:
                create: false
              kubeScheduler:
                create: false
              kubernetesSystemScheduler:
                create: false
              kubernetesSystemControllerManager:
                create: false

          prometheus-node-exporter:
            enabled: true
            # MicroOS labels containers as container_t, which cannot traverse
            # host /proc/<pid>; the filesystem collector then silently fails.
            # spc_t permits the required host-proc read without privileged
            # mode or capabilities. Retain a read-only rootfs, read-only host
            # mounts, no privilege escalation, and no service-account token.
            securityContext:
              fsGroup: 0
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
              seLinuxOptions:
                type: spc_t
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi

          kube-state-metrics:
            enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 192Mi

          victoria-metrics-operator:
            resources:
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                cpu: 250m
                memory: 256Mi

          # VMAgent replaces Prometheus's scrape engine
          vmagent:
            enabled: true
            spec:
              extraArgs:
                promscrape.dropOriginalLabels: "true"
                promscrape.streamParse: "true"
                promscrape.maxScrapeSize: "64MB"
              remoteWrite:
                - url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/write
              selectAllByDefault: true
              scrapeInterval: 1m
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  # Raised 250m→500m on 2026-06-27: the 2026-05-07 trim to 250m
                  # was too aggressive — vmagent CFS-throttled ~37% (7d) on
                  # scrape/remote-write bursts. 500m restores burst headroom.
                  cpu: 500m
                  memory: 512Mi

          # VMAlert replaces Prometheus's alerting engine
          vmalert:
            enabled: true
            spec:
              selectAllByDefault: true
              evaluationInterval: 1m
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi

          grafana:
            enabled: true
            # Pin to patched release; CVE-2026-27876 fixed in v12.4.2
            image:
              tag: "12.4.2"
            admin:
              existingSecret: grafana-admin-secret
              userKey: admin-user
              passwordKey: admin-password
            envValueFrom:
              GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: oidc-client-secret
              # Consumed via the $__env{} macro in the mctl-academy
              # read-only Postgres datasource (academy-postgres-datasource
              # ConfigMap) instead of a plaintext password in provisioning
              # YAML. optional: true so a Grafana rollout never hard-fails
              # with CreateContainerConfigError if this Secret doesn't exist
              # yet (e.g. Vault not populated, or ESO hasn't synced) — the
              # datasource just fails "Save & Test" until it does, instead
              # of taking down all of Grafana.
              ACADEMY_RO_DB_PASSWORD:
                secretKeyRef:
                  name: academy-grafana-readonly-secret
                  key: password
                  optional: true
            grafana.ini:
              server:
                root_url: https://grafana.mctl.ai
              auth:
                disable_login_form: true
                oauth_auto_login: true
              auth.basic:
                enabled: false
              auth.generic_oauth:
                enabled: true
                name: mctl.ai
                allow_sign_up: true
                client_id: grafana
                scopes: openid profile email groups
                auth_url: https://ops.mctl.ai/api/dex/auth
                token_url: https://ops.mctl.ai/api/dex/token
                api_url: https://ops.mctl.ai/api/dex/userinfo
                role_attribute_path: "contains(groups, 'admins') && 'Admin' || 'Viewer'"
              feature_toggles:
                # CVE-2026-27876: disable SQL Expressions RCE attack vector
                sqlExpressions: "false"
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
              hosts:
                - grafana.mctl.ai
              tls:
                - secretName: grafana-tls
                  hosts:
                    - grafana.mctl.ai
            defaultDashboardsEnabled: true
            env:
              GF_INSTALL_PLUGINS: victoriametrics-metrics-datasource
            sidecar:
              datasources:
                enabled: true
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"
                searchNamespace: ALL
                # Reads the grafana_folder ConfigMap ANNOTATION (not the
                # discovery label above) to place a dashboard into a named
                # Grafana folder instead of always landing in General — used
                # by mctl-academy-usage-dashboard-configmap.yaml so its
                # folder ACL can be locked down independently.
                folderAnnotation: grafana_folder
                provider:
                  # folderAnnotation alone only tells the k8s-sidecar where
                  # to WRITE the dashboard JSON on disk (a subdirectory named
                  # after the annotation value) — it does not, by itself,
                  # make Grafana's dashboard provisioner treat that
                  # subdirectory as a distinct folder. Without this, every
                  # sidecar-discovered dashboard still imports flat into one
                  # default folder regardless of folderAnnotation, silently
                  # defeating the Internal-folder ACL plan.
                  foldersFromFilesStructure: true
            plugins:
              - victoriametrics-metrics-datasource
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                cpu: 200m
                memory: 768Mi

          alertmanager:
            enabled: true
            spec:
              secrets:
                - alertmanager-telegram-secret
                - alertmanager-mctl-agent-webhook
            config:
              global:
                resolve_timeout: 5m
                telegram_api_url: "https://api.telegram.org"
              route:
                receiver: mctl-agent
                group_by: ["alertname", "namespace"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
                routes:
                  - receiver: "null"
                    matchers:
                      - alertname =~ "InfoInhibitor|Watchdog"
                  # Kept namespace-wide on purpose. A failed vault-backup pod
                  # sits in Waiting (init container errored) and would pin this
                  # alert, but KubeContainerWaiting adds nothing there:
                  # KubeJobFailed already fires with job_name, VaultBackupStale
                  # covers the durable "no snapshot today" case, and the pod's
                  # logs live in Loki under {app="vault-backup"}.
                  - receiver: "null"
                    matchers:
                      - alertname = "KubeContainerWaiting"
                      - namespace = "vault"
                  # vault CronJobs (backup, auto-unseal) are operator-owned —
                  # mctl-agent can't remediate them, so a failed job pages a
                  # human. This also backstops the jobs' own Telegram reports:
                  # if the pod never starts (image pull, init-container crash)
                  # the in-job notify can't fire, but this alert still does.
                  - receiver: telegram
                    matchers:
                      - alertname = "KubeJobFailed"
                      - namespace = "vault"
                  # Backup staleness pages a human directly: mctl-agent cannot
                  # remediate a missing snapshot, and these alerts exist
                  # precisely because the Job-scoped ones vanish with the Job.
                  - receiver: telegram
                    matchers:
                      - alertname =~ "VaultBackupStale|VaultBackupMetricAbsent|VaultBackupSuspended"
                  # A stale agents pipeline usually means its own model/auth
                  # path is unavailable, so route directly to an operator.
                  - receiver: telegram
                    matchers:
                      - alertname = "MctlAgentsPipelineStale"
                  # The mctl-telegram synthetic canary is the only end-to-end
                  # check that the MCP surface still answers from outside the
                  # cluster, so a human has to hear it. Until now none of its
                  # alerts matched a route and all fell through to the default
                  # mctl-agent receiver — the canary was observed solely through
                  # the pipeline it is supposed to be independent of, the same
                  # coupling that hid a missing Vault backup for 11h on
                  # 2026-08-16. Delivery through this route is what
                  # mctlhq/mctl-telegram#213 asks to verify.
                  #
                  # The agent path is useful, it just must not be the only
                  # path, so mctl-agent keeps its ticket. That takes TWO
                  # changes, not one: continue: true here, AND an explicit
                  # MctlTelegramCanary.* entry in the mctl-agent catch-all
                  # below. continue: true only lets sibling routes be
                  # evaluated; it does not re-enable the root default
                  # receiver, which fires only when no child route matched at
                  # all. The ArgoCDApplicationDegraded route above works for
                  # exactly that reason and no other.
                  #
                  # Prefix match, not the five current alertnames, and
                  # deliberately so. The defect being fixed is not "these
                  # alerts are unrouted" but "a canary alert defaults to
                  # agent-only"; an enumeration would let the next alert added
                  # to the VMRule reintroduce it silently. Every alert in
                  # mctl-telegram-canary.yaml needs an operator by
                  # construction — the token ones (TokenExpiring,
                  # TokenRenewalFailing) explicitly require a human with an
                  # admin:users login to remint the credential.
                  - receiver: telegram
                    continue: true
                    matchers:
                      - alertname =~ "MctlTelegramCanary.*"
                  # Platform/infra Applications (projects default + platform)
                  # also page a human, in ADDITION to mctl-agent — hence
                  # continue: true, which lets the catch-all route below still
                  # raise the incident. Tenant service apps (project "apps")
                  # are deliberately left agent-only; this is about the
                  # platform's own control plane.
                  #
                  # Why: on 2026-08-16 root-app was Degraded for 11h because
                  # the nightly Vault backup never succeeded (ArgoCD marks a
                  # CronJob Degraded while lastScheduleTime > lastSuccessful-
                  # Time). That signal was correct and durable — but it went
                  # only to the mctl-agent receiver, whose pipeline was down,
                  # so no human ever heard about a missing backup.
                  - receiver: telegram
                    continue: true
                    matchers:
                      - alertname =~ "ArgoCDApplicationDegraded|ArgoCDApplicationOutOfSyncLong"
                      - project =~ "default|platform"
                  # A stalled GitOps loop needs a human: nothing deploys until
                  # someone restarts or hard-refreshes (#970). No project
                  # label on this one — it is about the repo, not an app.
                  - receiver: telegram
                    matchers:
                      - alertname = "ArgoCDGitPollingStalled"
                  - receiver: "null"
                    matchers:
                      - alertname = "KubeJobFailed"
                      - namespace = "labs"
                  - receiver: "null"
                    matchers:
                      - alertname = "CPUThrottlingHigh"
                      - namespace = "monitoring"
                  - receiver: "null"
                    matchers:
                      - alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
                  - receiver: "null"
                    matchers:
                      - alertname =~ "KubePodNotReady|PodNotReady"
                      - namespace = "argo-workflows"
                  # Node-cordon / stuck-upgrade alerts go straight to a human on
                  # Telegram — mctl-agent cannot auto-remediate these (they need
                  # an operator to uncordon / re-drive the upgrade).
                  - receiver: telegram
                    matchers:
                      - alertname =~ "NodeCordoned|K3sUpgradeJobFailed"
                  # SLO fast-burn alerts are the "page" tier of the Beta SLOs
                  # (mctl-telegram docs/slo.md): the error budget is being
                  # consumed 14.4x faster than the objective allows. mctl-agent
                  # cannot remediate a burning budget — the response is a human
                  # deciding whether to roll back, and the error-budget policy's
                  # merge freeze — so these go to Telegram. continue: true,
                  # PLUS the three alertnames added to the mctl-agent catch-all
                  # below, so the incident is still raised. Both halves are
                  # required: continue: true alone only lets sibling routes be
                  # evaluated, it does not re-enable the root default receiver
                  # (which fires only when no child route matched at all). The
                  # ArgoCD platform-app route above works for exactly that
                  # reason — the catch-all names it explicitly.
                  #
                  # The SlowBurn siblings are deliberately absent: they are
                  # ticket-severity in the SLO doc and are meant to be picked up
                  # in working hours, not to wake anyone.
                  - receiver: telegram
                    continue: true
                    matchers:
                      - alertname =~ "MctlTelegramToolAvailabilityFastBurn|MctlTelegramOAuthAvailabilityFastBurn|MctlTelegramSessionBorrowFastBurn"
                  # The two communication-agent alerts are the one case in
                  # this file where agent-only routing is not merely
                  # suboptimal but circular: both fire precisely when the
                  # communication agent has stopped completing work, so the
                  # pipeline expected to raise the ticket is the subject of
                  # the alert. MctlAgentDeadLetter means jobs exhausted their
                  # attempts; MctlAgentActionsExecutingStuck means actions are
                  # past the executor recovery window and must not be resent
                  # by hand, because Telegram may already have accepted the
                  # original random_id. Neither is safe to leave to the
                  # component that is failing.
                  #
                  # mctl-telegram#213 measured what agent-only delivery
                  # actually produces: on the 2026-09-07 canary trip the agent
                  # filed a ticket reading "No skill matched ... Manual review
                  # required" and attributed it to an unrelated pod. That is
                  # the outcome an operator would get for a dead-lettered job
                  # today.
                  #
                  # Same two-part shape as the routes above: continue: true
                  # here, AND both names in the mctl-agent catch-all below.
                  # continue: true only lets sibling routes be evaluated; it
                  # does not re-enable the root default receiver, which fires
                  # only when no child route matched at all.
                  #
                  # The other four alerts ported in mctl-telegram#555 —
                  # PoolNearCapacity, FloodWaitSpike, OAuthPendingStuck,
                  # BridgeDaemonsFlapping — are deliberately agent-only. They
                  # describe load and capacity conditions the agent can
                  # triage, and none of them implicates the agent itself.
                  # They are NOT listed in the catch-all below, and must not
                  # be added "for symmetry": matching no child route at all,
                  # they already reach mctl-agent through the root default
                  # receiver, and the catch-all route carries no grouping or
                  # timing of its own. Verified with `amtool config routes
                  # test`: mctl-agent before the change and after it, in both
                  # forms. An entry would read as a routing decision while
                  # changing nothing.
                  - receiver: telegram
                    continue: true
                    matchers:
                      - alertname =~ "MctlAgentDeadLetter|MctlAgentActionsExecutingStuck"
                  # Local Argo workdirs are node-affine. These need an operator
                  # to restore the worker or terminate and rerun the workflow.
                  - receiver: telegram
                    matchers:
                      - alertname =~ "ArgoLocalWorkdirPodPending|ArgoLocalWorkdirQuotaHigh|ArgoLocalWorkdirQuotaCritical|NodeDiskSpaceCritical|NodeFilesystemCollectorFailed"
                  - receiver: mctl-agent
                    matchers:
                      - alertname =~ "RecordingRulesNoData|ScrapePoolHasNoTargets|TooManyScrapeErrors|TooManyLogs"
                      - namespace = "monitoring"
                  - receiver: mctl-agent
                    matchers:
                      - alertname =~ "PodCrashLooping|KubePodCrashLooping|KubePodNotReady|PodNotReady|TenantCPUQuotaHigh|TenantMemoryQuotaHigh|ArgoWorkflowFailed|ArgoWorkflowHighFailureRate|CPUThrottlingHigh|KubeJobNotCompleted|KubePersistentVolumeFillingUp|KubeStatefulSetReplicasMismatch|NodeHighCPU|NodeHighMemory|NodeLowMemoryAvailable|NodeDiskPressure|NodeDiskSpaceHigh|VaultSealed|MinioBucketUsageHigh|MinioBucketUsageCritical|ArgoCDApplicationDegraded|ArgoCDApplicationOutOfSyncLong|OpenclawCodexTokenRefreshFailed|MctlTelegramCanary.*|MctlTelegramToolAvailabilityFastBurn|MctlTelegramOAuthAvailabilityFastBurn|MctlTelegramSessionBorrowFastBurn|MctlAgentDeadLetter|MctlAgentActionsExecutingStuck"
              receivers:
                - name: "null"
                - name: mctl-agent
                  webhook_configs:
                    - url: "http://admins-mctl-agent-base-service.admins.svc.cluster.local:8080/api/v1/alerts"
                      send_resolved: true
                      http_config:
                        authorization:
                          type: Bearer
                          credentials_file: /etc/vm/secrets/alertmanager-mctl-agent-webhook/token
                - name: telegram
                  telegram_configs:
                    - bot_token_file: /etc/vm/secrets/alertmanager-telegram-secret/bot-token
                      chat_id: {{ .Values.alertmanager.telegramChatId | int64 }}
                      parse_mode: HTML
                      # job_name/pod are emitted only when the alert carries
                      # them. Without job_name a KubeJobFailed in a namespace
                      # that runs several CronJobs reads as "Job failed to
                      # complete. Namespace: vault" and says nothing about
                      # WHICH job — vault runs both the daily backup and the
                      # 2-minute auto-unseal, and telling them apart meant
                      # going to the cluster.
                      message: |
                        {{ "{{" }} range .Alerts {{ "}}" }}
                        <b>{{ "{{" }} .Status | toUpper {{ "}}" }}: {{ "{{" }} .Labels.alertname {{ "}}" }}</b>
                        {{ "{{" }} .Annotations.summary {{ "}}" }}
                        <i>Namespace: {{ "{{" }} .Labels.namespace {{ "}}" }}</i>
                        {{ "{{" }} if .Labels.job_name {{ "}}" }}<i>Job: {{ "{{" }} .Labels.job_name {{ "}}" }}</i>
                        {{ "{{" }} end {{ "}}" }}
                        {{ "{{" }} if .Labels.pod {{ "}}" }}<i>Pod: {{ "{{" }} .Labels.pod {{ "}}" }}</i>
                        {{ "{{" }} end {{ "}}" }}
                        {{ "{{" }} end {{ "}}" }}

          # Disable Prometheus (operator components)
          prometheus:
            enabled: false
          prometheusOperator:
            enabled: true # Keep operator to manage CRDs (ServiceMonitors, VMAlerts)

          kubeControllerManager:
            enabled: false
          kubeEtcd:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeStateMetrics:
            enabled: true
          nodeExporter:
            enabled: true

    - repoURL: https://github.com/mctlhq/mctl-gitops.git
      targetRevision: main
      path: platform-gitops/infra-components/observability/grafana-dashboards

    - repoURL: https://github.com/mctlhq/mctl-gitops.git
      targetRevision: main
      path: platform-gitops/infra-components/observability/secrets

    - repoURL: https://github.com/mctlhq/mctl-gitops.git
      targetRevision: main
      path: platform-gitops/infra-components/observability/vm-rules

    - repoURL: https://github.com/mctlhq/mctl-gitops.git
      targetRevision: main
      path: platform-gitops/infra-components/observability/pushgateway

  ignoreDifferences:
    - group: operator.victoriametrics.com
      kind: VMSingle
      jsonPointers:
        - /spec/extraContainers
    # The victoria-metrics-operator subchart ships a `pre-delete` Helm hook
    # ServiceAccount (cleanup-hook). ArgoCD applies it once but, being a
    # pre-delete hook, never re-applies it on a normal sync — so when the
    # k8s-stack chart bumps its bundled operator version, the live SA keeps the
    # OLD `helm.sh/chart` / `app.kubernetes.io/version` labels while git renders
    # the new ones. That label-only mismatch left the SA (and thus root-app)
    # perpetually OutOfSync despite being Healthy. Ignore label diffs on this
    # one SA; the hook still functions on app deletion.
    - group: ""
      kind: ServiceAccount
      name: monitoring-victoria-metrics-operator-cleanup-hook
      namespace: monitoring
      jqPathExpressions:
        - .metadata.labels
    # ESO admission webhook injects default fields absent in git.
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.deletionPolicy
        # The six `.spec.data[].remoteRef.*` / `.spec.dataFrom[].extract.*` entries
        # that used to sit here were removed. A jq path that indexes INTO an array,
        # combined with RespectIgnoreDifferences + ServerSideApply, makes ArgoCD
        # merge the live array elements back into the apply payload — so spec.data
        # can never shrink. Dropping an entry then reports a successful sync and
        # stays OutOfSync forever (#789, upstream argo-cd#17694, fix due in ArgoCD
        # 3.6 — we run 3.3.8). They ignored ESO's own CRD defaults, which the
        # ExternalSecrets now state explicitly instead, so git matches live.
        - .status

  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      # VictoriaMetrics operator CRDs (VMSingle, VMAlert, ...) declare an
      # incomplete schema that omits some pass-through fields like
      # `VMSingle.spec.extraContainers`. Once cluster-wide
      # `controller.diff.server.side: "true"` is set, ArgoCD's SSA
      # dry-run rejects the diff with `failed to create typed patch
      # object: .spec.extraContainers: field not declared in schema` and
      # the app stays Sync=Unknown. Opt this app out so it falls back to
      # the legacy client-side diff.
      - ServerSideDiff=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
