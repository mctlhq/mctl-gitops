# Read-only Postgres datasource for the private mctl-academy usage
# dashboard. Queries the labs-mctl-academy database on the shared CNPG
# cluster directly via the academy_readonly role — see mctl-academy
# migration 1755100000000_academy_readonly_role.mjs — so panels can compute
# sign-ups/logins/attempts per day without any new app instrumentation.
#
# academy_readonly's grants are COLUMN-level everywhere, not table-level:
# "user"."createdAt", "session"."createdAt", and on attempts only
# (domain, correct, attempted_at) — never id/question_id/user_id. user_id
# is deliberately excluded too, not just the obviously-sensitive columns:
# domain+correct+attempted_at is a pure aggregate, but adding user_id back
# in would let a direct query (e.g. Grafana Explore, not just this
# dashboard's fixed panels) reconstruct a specific pseudonymous learner's
# full per-question answer history. "session" also holds the live bearer
# token behind the mctl_session cookie, and "user" holds
# email/name/githubLogin — a table-wide grant on either would let anything
# with query access to this datasource read those out directly.
#
# This grant lives in a DIFFERENT repo (mctl-academy migration
# 1755100000000_academy_readonly_role.mjs) that this gitops repo cannot
# validate at merge time — a regression there (e.g. someone widening it back
# to table-level SELECT) would silently defeat the protection described
# above with no signal here. Verified by hand against a real postgres:17
# instance seeded with a fake session.token: `SELECT token FROM "session"`
# and `SELECT email FROM "user"` both fail with "permission denied for
# table" as academy_readonly, while every query this dashboard's panels
# actually run succeeds. Re-verify the same way if that migration changes.
#
# Access to this datasource is not yet folder-restricted at the Grafana
# level — see the required follow-up noted in
# platform-gitops/infra-components/observability/grafana-dashboards/mctl-academy-usage-dashboard-configmap.yaml.
#
# Password is never in this file: it's injected into the Grafana container
# as ACADEMY_RO_DB_PASSWORD (see grafana.envValueFrom in monitoring.yaml,
# sourced from the academy-grafana-readonly-secret ExternalSecret) and
# expanded here via Grafana's $__env{} provisioning macro.
apiVersion: v1
kind: ConfigMap
metadata:
  name: academy-postgres-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  academy-postgres-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: mctl-academy (read-only)
        uid: mctl-academy-readonly-pg
        type: postgres
        url: shared-pg-rw.platform-db.svc.cluster.local:5432
        database: labs-mctl-academy
        user: academy_readonly
        access: proxy
        isDefault: false
        jsonData:
          sslmode: require
          postgresVersion: 1700
          timescaledb: false
          # academy_readonly's CNPG connectionLimit is 5 (cluster.yaml). A
          # single dashboard refresh opens one connection per SQL target —
          # 9 targets across this dashboard's panels — so an unbounded pool
          # here could exceed that limit and surface "too many connections
          # for role" on an arbitrary subset of panels. Capped with
          # headroom for the datasource's own "Save & Test" connection.
          maxOpenConns: 3
          maxIdleConns: 3
          connMaxLifetime: 14400
        secureJsonData:
          password: $__env{ACADEMY_RO_DB_PASSWORD}
