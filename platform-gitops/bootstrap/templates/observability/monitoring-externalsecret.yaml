---
# ExternalSecret for Grafana admin credentials
# Synced from Vault path: secret/data/platform/grafana
# Required keys in Vault: admin-user, admin-password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana
        property: admin-password
    - secretKey: oidc-client-secret
      remoteRef:
        key: platform/argo-workflows/sso
        property: client-secret
---
# ExternalSecret for AlertManager Telegram integration
# Synced from Vault path: secret/data/platform/alertmanager
# Required keys in Vault: telegram-bot-token, telegram-chat-id
#
# To populate Vault:
#   vault kv put secret/platform/alertmanager \
#     telegram-bot-token="<BOT_TOKEN>" \
#     telegram-chat-id="<CHAT_ID>"
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram-secret
    creationPolicy: Owner
  data:
    - secretKey: bot-token
      remoteRef:
        key: platform/alertmanager
        property: telegram-bot-token
    - secretKey: chat-id
      remoteRef:
        key: platform/alertmanager
        property: telegram-chat-id
---
# ExternalSecret for the mctl-academy private usage dashboard's Postgres
# datasource credentials.
# Synced from Vault path: secret/data/platform/mctl-academy/grafana-readonly
# (copied there from teams/labs/... so the cluster store no longer needs a
# grant under teams/ — see vault-config/vault-policy-external-secrets-read.hcl)
# Required keys in Vault: password (role: academy_readonly — see
# mctl-academy migration 1755100000000_academy_readonly_role.mjs;
# column-level SELECT on "user"."createdAt"/"session"."createdAt" plus
# attempts, no access to "account"/"verification" or any other column)
#
# To populate Vault, after the migration deploys and the role exists:
#   vault kv put secret/platform/mctl-academy/grafana-readonly \
#     password="<generated>"
#
# No secret-reloader is deployed in this cluster (grep found none), so
# rotating this password does NOT restart the running Grafana pod on its
# own — Kubernetes never updates an already-injected envValueFrom value.
# After rotating, manually roll Grafana:
#   kubectl -n monitoring rollout restart deployment -l app.kubernetes.io/name=grafana
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: academy-grafana-readonly-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: academy-grafana-readonly-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/mctl-academy/grafana-readonly
        property: password
