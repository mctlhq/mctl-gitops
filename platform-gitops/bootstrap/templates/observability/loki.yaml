apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: "2.10.2"
    helm:
      values: |
        loki:
          enabled: true
          # Pin Loki to a recent 2.9.x release. The loki-stack chart 2.10.2 pulls in
          # the loki subchart 2.16.0 whose default image tag is still 2.6.1, where
          # `store: tsdb` is unsupported and the compactor refuses to run (logs show
          # "Not using boltdb-shipper index, not starting compactor"). 2.9.x adds
          # native tsdb support and a compactor that honours retention on tsdb+s3.
          image:
            repository: grafana/loki
            tag: 2.9.17
          persistence:
            enabled: false # Switched to MinIO (S3); /data is backed by emptyDir
          resources:
            requests:
              cpu: 100m
              memory: 1536Mi
            limits:
              # Steady-state ~16m; 200m gives 12x cushion for compaction bursts.
              # Trimmed 500m→200m on 2026-05-10 (CPU-limits cluster headroom).
              cpu: 200m
              memory: 2048Mi
          extraEnvFrom:
            - secretRef:
                name: loki-minio-credentials
          config:
            schema_config:
              configs:
                - from: 2024-04-01
                  store: tsdb
                  object_store: s3
                  schema: v12
                  index:
                    prefix: index_
                    period: 24h
            storage_config:
              # Note: the loki subchart (2.16.0) injects default `boltdb_shipper` and
              # `filesystem` sub-blocks here. Helm cannot delete subchart-default keys
              # via `null`, so they stay in the rendered Secret. That is harmless: the
              # schema_config below only references `store: tsdb` + `object_store: s3`,
              # so Loki loads tsdb+aws and never touches the dormant boltdb/filesystem
              # paths.
              tsdb_shipper:
                active_index_directory: /data/loki/index
                cache_location: /data/loki/index_cache
                shared_store: s3
              # Migrated 2026-07 from self-hosted MinIO to Cloudflare R2.
              # Bucket recreated on R2 as "loki" with a defensive lifecycle
              # rule, `backstop-expire-after-60-days` (read through the
              # Cloudflare API on 2026-10-04; it was described here as 30
              # days, which it is not). It is set in the dashboard, not in
              # Terraform. Loki keeps 14d (336h) via the compactor, and the
              # Vault audit stream 30d (retention_stream below); the bucket
              # lifecycle remains a final backstop and must stay longer than
              # every retention period here. The longer query
              # window preserves controller evidence for delayed incident review
              # (mctl-gitops#593) without retaining logs indefinitely.
              # Credentials still come from the loki-minio-credentials Secret
              # (name unchanged), whose ExternalSecret now sources R2 keys from
              # Vault (see infra-components/observability/secrets/
              # loki-minio-externalsecret.yaml).
              aws:
                endpoint: https://6a09f637d20e1f66a8e9d45ebe778058.r2.cloudflarestorage.com
                region: auto
                bucketnames: loki
                s3forcepathstyle: true
            limits_config:
              ingestion_rate_mb: 4
              ingestion_burst_size_mb: 8
              retention_period: 336h  # 14 days
              # Vault's audit log (docs/runbooks/vault-audit.md) is kept 30
              # days: the owner's decision of 2026-10-04 for SOC 2 (#1659).
              # Both streams of the vault container: stdout is the audit
              # entries, stderr carries "failed to audit" lines, the evidence
              # of any gap in them. A few MB a day compressed.
              retention_stream:
                - selector: '{namespace="vault", container="vault"}'
                  priority: 1
                  period: 720h
            chunk_store_config:
              # Raised with the stream above: this caps how far back any
              # query may reach, so at 336h the audit log's third and fourth
              # weeks would be stored but unreadable. Other streams are
              # still deleted at 336h.
              max_look_back_period: 720h
            # Flush in-memory chunks to R2 when the ingester stops. The WAL
            # lives on an emptyDir (persistence is off), so a replaced pod
            # starts without it, and without this flag a rollout dropped
            # whatever had not yet been flushed: up to max_chunk_age (2h) of
            # every busy stream, the Vault audit log included. Loki 2.9's
            # default is false whenever the WAL is on.
            ingester:
              wal:
                flush_on_shutdown: true
            # table_manager is obsolete once the compactor handles retention on tsdb;
            # keeping it alongside compactor.retention_enabled produces duplicate
            # delete workers and warnings in 2.9. Explicitly disable it.
            table_manager:
              retention_deletes_enabled: false
              retention_period: 0s
            compactor:
              working_directory: /data/loki/compactor
              shared_store: s3
              compaction_interval: 10m
              retention_enabled: true
              retention_delete_delay: 2h
              retention_delete_worker_count: 150

        promtail:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              # 24h peak observed 28m on the busiest node (workflow log bursts);
              # 150m gives ~5x cushion. Previously 500m, which was helm chart
              # default and unjustified — released ~1.4c of cluster headroom.
              cpu: 150m
              # 1h peak working set hit 94% of 128Mi across multiple nodes;
              # log volume grew with mctl-agents proposals and agent sessions.
              # 256Mi gives 2x cushion; cluster-wide cost is +384Mi (3 nodes).
              memory: 256Mi
          config:
            clients:
              - url: http://loki-stack:3100/loki/api/v1/push
            # Everything below `snippets` is what the promtail-6.x subchart
            # actually renders into promtail.yaml (config.file templates
            # `snippets.pipelineStages`, `snippets.common` and
            # `snippets.extraRelabelConfigs` — see `helm show values
            # grafana/promtail`). A raw `scrape_configs:` key under `config`
            # sat here from the first metrics stage until 2026-09-10 and was
            # silently ignored by the chart: the running Promtail carried the
            # chart's default pipeline (`cri: {}` only) and default labels, so
            # no metrics stage ever executed (mctlhq/mctl-gitops#556). The
            # chart's own relabels already produce namespace, app, instance,
            # component (from app.kubernetes.io/component), pod, container,
            # node_name, job and filename; the mctl-specific bits — the
            # scrape-annotation opt-out and the mctl.ai/team and
            # mctl.ai/component labels — are re-added under extraRelabelConfigs.
            snippets:
              pipelineStages:
                # k3s writes CRI-format logs; the old block said `docker: {}`,
                # which would have mangled every line had it ever been applied.
                - cri: {}
                - match:
                    selector: '{namespace=~"labs|admins|ovk"}'
                    stages:
                      # seerrsense (labs): the ChatGPT plugin-directory
                      # review needs a human to hear when a reviewer connects
                      # or when a tool fails on them, and the server exposes
                      # no /metrics. Two log shapes carry that:
                      #  - Fastify's request line for the consent POST — the
                      #    last hop of every OAuth sign-in, so one increment =
                      #    one new connection (any account; the server logs
                      #    no identity, by design).
                      #  - the error line describeError() writes when a tool
                      #    fails for a reason the caller was not told — the
                      #    tunnel timeouts seen during the demo recording.
                      # Pino's req object serialises method before url, so the
                      # adjacent pair is stable to match on.
                      - regex:
                          expression: '(?P<seerr_consent>"method":"POST","url":"/oauth/consent")'
                      - metrics:
                          seerrsense_oauth_consent_total:
                            type: Counter
                            description: "seerrsense OAuth consent POSTs (one per completed sign-in)"
                            source: seerr_consent
                            config:
                              match_all: false
                              action: inc
                      - regex:
                          expression: '(?P<seerr_tool_failed>a tool call failed for a reason the caller was not told)'
                      - metrics:
                          seerrsense_tool_failures_total:
                            type: Counter
                            description: "seerrsense MCP tool calls that failed with the generic error"
                            source: seerr_tool_failed
                            config:
                              match_all: false
                              action: inc
                      # DevLoopWorkflow's finally clearing an ownership claim
                      # whose write did not land (mctl-agents#365 item 3). The
                      # workflow runs in the mctl-agents worker, which is in
                      # `admins` and therefore already inside this selector --
                      # the shadow compare below needs its own block because
                      # the shepherd is an Argo step pod instead.
                      - regex:
                          expression: '(?P<lifecycle_claim_abandoned>LIFECYCLE-CLAIM-ABANDONED entity=)'
                      - metrics:
                          lifecycle_claim_abandoned_total:
                            type: Counter
                            description: "DevLoopWorkflow claims abandoned without a landed write"
                            source: lifecycle_claim_abandoned
                            config:
                              match_all: false
                              action: inc
                # The lifecycle observe soak (ADR-010 §12, mctlhq/.github#57).
                #
                # A SECOND match block, not extra stages in the one above,
                # because the shepherd runs as an Argo step pod in
                # `argo-workflows` and that selector covers labs|admins|ovk.
                # Leaving the existing block untouched keeps its counters
                # from silently changing scope.
                #
                # ONE COUNTER PER CLASS, because the metrics stage attaches no
                # dynamic labels: a single counter with a `class` label is not
                # expressible here, so the class lives in the counter NAME.
                #
                # Each expression anchors on the space AFTER the class rather
                # than on a word boundary. `-` is a non-word character, so
                # \bstore-permits-old-forbids\b would also match a seventh
                # class that merely began with the same text. The per-tick
                # totals line carries no `class=` token at all, so none of
                # these can match it and count a tick twice.
                - match:
                    selector: '{namespace="argo-workflows"}'
                    stages:
                      - regex:
                          expression: '(?P<lifecycle_shadow_agree>lifecycle-shadow: divergence class=agree )'
                      - metrics:
                          lifecycle_shadow_agree_total:
                            type: Counter
                            description: "shadow compare: both mechanisms agree"
                            source: lifecycle_shadow_agree
                            config:
                              match_all: false
                              action: inc
                      - regex:
                          expression: '(?P<lifecycle_shadow_store_permits_old_forbids>lifecycle-shadow: divergence class=store-permits-old-forbids )'
                      - metrics:
                          lifecycle_shadow_store_permits_old_forbids_total:
                            type: Counter
                            description: "shadow compare: the store would license an action the old mechanism forbids (THE dangerous class)"
                            source: lifecycle_shadow_store_permits_old_forbids
                            config:
                              match_all: false
                              action: inc
                      - regex:
                          expression: '(?P<lifecycle_shadow_store_forbids_old_permits>lifecycle-shadow: divergence class=store-forbids-old-permits )'
                      - metrics:
                          lifecycle_shadow_store_forbids_old_permits_total:
                            type: Counter
                            description: "shadow compare: the store withholds an action the old mechanism permits"
                            source: lifecycle_shadow_store_forbids_old_permits
                            config:
                              match_all: false
                              action: inc
                      - regex:
                          expression: '(?P<lifecycle_shadow_owner_mismatch>lifecycle-shadow: divergence class=owner-mismatch )'
                      - metrics:
                          lifecycle_shadow_owner_mismatch_total:
                            type: Counter
                            description: "shadow compare: both say held, and they name different holders"
                            source: lifecycle_shadow_owner_mismatch
                            config:
                              match_all: false
                              action: inc
                      - regex:
                          expression: '(?P<lifecycle_shadow_store_unknown>lifecycle-shadow: divergence class=store-unknown )'
                      - metrics:
                          lifecycle_shadow_store_unknown_total:
                            type: Counter
                            description: "shadow compare: no answer from the store (not a divergence)"
                            source: lifecycle_shadow_store_unknown
                            config:
                              match_all: false
                              action: inc
                      - regex:
                          expression: '(?P<lifecycle_shadow_legacy_unknown>lifecycle-shadow: divergence class=legacy-unknown )'
                      - metrics:
                          lifecycle_shadow_legacy_unknown_total:
                            type: Counter
                            description: "shadow compare: no answer from the old mechanism (not a divergence)"
                            source: lifecycle_shadow_legacy_unknown
                            config:
                              match_all: false
                              action: inc
                # Vault's audit log (vault-human-auth-iac iac/audit.tf): the
                # `stdout` file device writes one JSON entry per request and
                # one per response to the vault container's stdout; Vault's
                # own log is on stderr. Two counters, read by
                # vm-rules/vault-audit-alerts.yaml, so a disabled device or a
                # failing one pages instead of leaving a silent gap.
                #
                # The entry pattern is the entry's last key, `type`, with the
                # closing brace: an entry over containerd's 16 KiB line limit
                # arrives split, and only its final piece carries it. Key
                # names are never HMAC'd and values here are, so a response
                # body cannot fake it with a value of "request".
                - match:
                    selector: '{namespace="vault", container="vault"}'
                    stages:
                      - regex:
                          expression: '(?P<vault_audit_entry>"type":"(request|response)"\})'
                      - metrics:
                          vault_audit_entries_total:
                            type: Counter
                            description: "Vault audit entries (request and response) written to stdout"
                            source: vault_audit_entry
                            config:
                              match_all: false
                              action: inc
                      # vault/request_handling.go (1.17): logged when no
                      # audit device took the entry, and the request is then
                      # refused.
                      - regex:
                          expression: '(?P<vault_audit_failure>core: failed to audit (request|response))'
                      - metrics:
                          vault_audit_failures_total:
                            type: Counter
                            description: "Vault requests or responses no audit device could log"
                            source: vault_audit_failure
                            config:
                              match_all: false
                              action: inc
              extraRelabelConfigs:
                # Pods that opt out of scraping opt out of log collection too,
                # as before.
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: drop
                  regex: "false"
                - source_labels: [__meta_kubernetes_pod_label_mctl_ai_team]
                  target_label: team
                # mctl.ai/component (set on the retire-service Workflow pods)
                # overrides the chart's component label only when present:
                # without the (.+) guard an unset source would replace the
                # chart's value with an empty string on every other pod.
                - source_labels: [__meta_kubernetes_pod_label_mctl_ai_component]
                  regex: (.+)
                  target_label: component
        grafana:
          # Grafana is managed by kube-prometheus-stack; only add Loki datasource via sidecar.
          enabled: false
          sidecar:
            datasources:
              enabled: true
              label: grafana_datasource

  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
