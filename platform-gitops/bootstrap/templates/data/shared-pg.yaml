apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-pg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mctlhq/mctl-gitops.git
    targetRevision: main
    path: platform-gitops/infra-components/data/cnpg/shared
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: platform-db
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        # Every annotation except restartedAt. That one is how gitops rolls
        # the instances (see cluster.yaml); ignoring it too meant #1796's
        # bump synced as a no-op, since RespectIgnoreDifferences keeps the
        # live value of every ignored path. ArgoCD wraps this in del(), so
        # the index must be a path; `// {}` keeps it valid with no annotations.
        - .metadata.annotations[(.metadata.annotations // {} | keys[] | select(. != "kubectl.kubernetes.io/restartedAt"))]
        - .metadata.labels
        - .status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
