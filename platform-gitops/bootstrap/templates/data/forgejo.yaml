# Platform Forgejo — self-hosted git at https://git.mctl.ai.
#
# Forgejo is the GPL community fork of Gitea (https://forgejo.org/compare-to-gitea/).
# It runs on what the platform already operates instead of bringing its own
# stack: the repositories live on one hcloud volume, metadata in shared-pg
# (CNPG, already backed up to R2), secrets come from Vault through ESO.
#
# Phase 1 scope: web + git over HTTPS only. SSH, Forgejo Actions and pull
# mirrors are deliberately off and land as separate changes (docs/runbooks/forgejo.md).
#
# Login: no forward-auth in front of the ingress. Backstage forward-auth would
# put an OIDC redirect in front of `git clone` / `git push` over HTTPS, which a
# git client cannot follow. Access control is Forgejo's own: registration is
# closed and REQUIRE_SIGNIN_VIEW hides everything from anonymous users.
#
# The manifests next to the chart (ExternalSecrets, NetworkPolicies, metrics
# scrape, PVC backup) live in platform-gitops/infra-components/data/forgejo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # OCI registry: no scheme in repoURL is what tells ArgoCD to pull the chart
    # over OCI (public registry, so no repository credentials are needed).
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      # Chart 17.1.7 ships Forgejo 15.0.9 (the LTS line).
      targetRevision: 17.1.7
      helm:
        values: |
          replicaCount: 1

          # The nodes run SELinux (openSUSE MicroOS) and every pod gets its own
          # random MCS level, relabelling a volume to it on mount. The backup
          # Job mounts forgejo-data too, and on 2026-10-03 its mount relabelled
          # the volume and locked the running Forgejo out of /data
          # ("permission denied" on every repository) although the modes and
          # owners were fine. Pinning one level here and the same level in
          # infra-components/data/forgejo/backup.yaml keeps the label stable
          # across both pods; container_t confinement is unchanged.
          podSecurityContext:
            fsGroup: 1000
            seLinuxOptions:
              level: "s0:c731,c732"
          # The chart's own warning: RollingUpdate on a RWO volume deadlocks.
          strategy:
            type: Recreate

          persistence:
            enabled: true
            claimName: forgejo-data
            size: 10Gi
            storageClass: hcloud-volumes
            annotations:
              # hcloud-volumes reclaims with Delete, and ArgoCD ignores the
              # chart's own helm.sh/resource-policy: keep. Without these, an
              # Application delete or a renamed claim would destroy every
              # repository on the volume.
              helm.sh/resource-policy: keep
              argocd.argoproj.io/sync-options: Prune=false,Delete=false

          service:
            http:
              type: ClusterIP
              port: 3000
            ssh:
              # Phase 1 has no SSH; the chart still renders the Service.
              type: ClusterIP

          ingress:
            enabled: true
            className: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - host: git.mctl.ai
                paths:
                  - path: /
                    pathType: Prefix
                    port: http
            tls:
              - secretName: forgejo-tls
                hosts:
                  - git.mctl.ai

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi

          # The chart's test-connection Pod pulls busybox:latest and runs only
          # on `helm test`; ArgoCD would keep it as a stray hook resource.
          test:
            enabled: false

          gitea:
            # /api/healthz pings the database. During a forgejo-reconcile run
            # Forgejo sits at its CPU limit hashing the admin password for
            # every API call, a ping that has to open a new connection then
            # outlives the chart's 1s timeout, kubelet cancels it mid-SCRAM,
            # and Forgejo logs "database ping failed". 3s rides that out;
            # the other probe fields stay at the chart defaults (Helm merges
            # this map). The TCP liveness probe is unaffected by CPU and
            # stays as is. In this chart the probes live under `gitea:`
            # (templates/gitea/deployment.yaml reads .Values.gitea.readinessProbe);
            # a top-level readinessProbe would be ignored.
            readinessProbe:
              timeoutSeconds: 3
            admin:
              # Keys `username` / `password` (+ `email` from below).
              existingSecret: forgejo-admin
              email: admin@mctl.ai
              # Rotation happens in Vault; keep the account in step with it.
              passwordMode: keepUpdated

            metrics:
              enabled: true

            # Sign-in through ZITADEL (#1520 S4). The client credentials come
            # from forgejo-oidc-zitadel, which the zitadel-iac Job fills
            # (helm-charts/zitadel-iac/iac/forgejo.tf); the name is part of the
            # callback URL registered there, so the two must change together.
            # The chart's init container adds or updates the source on every
            # start, finding it BY NAME. `scopes` is split on commas by the
            # Forgejo CLI.
            #
            # The name is also the button label ("Sign in with MCTL"). It was
            # ZITADEL until 2026-10-04; the existing source was renamed in place
            # by a one-off hook (#1599) so its ID and account links carried
            # over. Renaming here alone would create a second source instead.
            #
            # Registration stays disabled (service below), so a ZITADEL
            # identity can only be linked to an existing account with that
            # account's own credentials; it never creates one.
            oauth:
              - name: MCTL
                provider: openidConnect
                existingSecret: forgejo-oidc-zitadel
                autoDiscoverUrl: https://auth.mctl.ai/.well-known/openid-configuration
                scopes: openid,email,profile

            # DB credentials and the metrics token as FORGEJO__section__KEY env
            # vars, which take precedence over `config` below and keep them out
            # of the chart-rendered config Secret.
            #
            # SECRET_KEY / INTERNAL_TOKEN / JWT_SECRET / LFS_JWT_SECRET are NOT
            # supplied: the chart's init script generates them on first start
            # and, once /data/gitea/conf/app.ini exists, drops any env value for
            # them. Holding copies in Vault would look like a rotation path and
            # change nothing. They live in app.ini on the volume, which is why
            # the PVC backup (infra-components/data/forgejo/backup.yaml) must
            # include it: SECRET_KEY decrypts 2FA and mirror credentials in the DB.
            additionalConfigFromEnvs:
              - name: FORGEJO__DATABASE__USER
                valueFrom:
                  secretKeyRef:
                    name: forgejo-db-creds
                    key: username
              - name: FORGEJO__DATABASE__PASSWD
                valueFrom:
                  secretKeyRef:
                    name: forgejo-db-creds
                    key: password
              - name: FORGEJO__METRICS__TOKEN
                valueFrom:
                  secretKeyRef:
                    name: forgejo-metrics
                    key: token

            config:
              APP_NAME: mctl git
              server:
                DOMAIN: git.mctl.ai
                ROOT_URL: https://git.mctl.ai/
                DISABLE_SSH: true
                START_SSH_SERVER: false
                LFS_START_SERVER: true
                OFFLINE_MODE: true
                # Anonymous visitors land on the sign-in page, which offers
                # only "Sign in with MCTL" (ENABLE_INTERNAL_SIGNIN below);
                # the default home page hid it. Signed-in users still get
                # their dashboard. A setting rather than a custom home.tmpl,
                # which would need maintaining across Forgejo upgrades.
                LANDING_PAGE: login
              database:
                DB_TYPE: postgres
                HOST: shared-pg-rw.platform-db.svc.cluster.local:5432
                NAME: forgejo
                SSL_MODE: disable
              service:
                DISABLE_REGISTRATION: true
                # ZITADEL is the only interactive sign-in (#1520 S5): the web
                # password form is hidden and a password POST to /user/login
                # is refused. Only the web form: git and API basic auth (the
                # bots, the reconcile Job, Argo CD) are unaffected, and the
                # link-account page still takes a password, so a user can link
                # an existing account to their ZITADEL identity once.
                ENABLE_INTERNAL_SIGNIN: false
                REQUIRE_SIGNIN_VIEW: true
                DEFAULT_KEEP_EMAIL_PRIVATE: true
              repository:
                DEFAULT_PRIVATE: private
              security:
                INSTALL_LOCK: true
              session:
                COOKIE_SECURE: true
              actions:
                ENABLED: false
              federation:
                ENABLED: false
              mailer:
                ENABLED: false
              cron.update_checker:
                ENABLED: false
              # The container registry shares forgejo-data with the
              # repositories (9.7G volume). A cap per owner (org or user)
              # keeps one org's images from filling it; a push over the cap
              # is refused. erpact-images.yaml also prunes to the newest
              # versions per image (docs/runbooks/forgejo.md).
              packages:
                LIMIT_TOTAL_OWNER_SIZE: 4G

    - repoURL: https://github.com/mctlhq/mctl-gitops.git
      targetRevision: main
      path: platform-gitops/infra-components/data/forgejo

  ignoreDifferences:
    # Same ESO handling as minio.yaml / valkey.yaml: admission-injected
    # annotations and status only; never jq paths that index into spec arrays (#789).
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .metadata.annotations
        - .spec.target.deletionPolicy
        - .status
    # Written by the zitadel-iac Job, not by Argo CD (oidc-zitadel.yaml).
    - kind: Secret
      name: forgejo-oidc-zitadel
      jsonPointers:
        - /data
    # Written by the zitadel-iac Job, not by Argo CD (identities-zitadel.yaml).
    - kind: Secret
      name: forgejo-identities
      jsonPointers:
        - /data
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
