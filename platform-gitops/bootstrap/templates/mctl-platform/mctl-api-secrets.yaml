apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-secrets
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: platform/mctl-api/argocd-token
        property: token
    - secretKey: BACKSTAGE_TOKEN
      remoteRef:
        key: platform/mctl-api/backstage-token
        property: token
    - secretKey: OAUTH_GITHUB_CLIENT_ID
      remoteRef:
        key: platform/github-app
        property: client-id
    - secretKey: OAUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        key: platform/github-app
        property: client-secret
    - secretKey: OAUTH_JWT_SECRET
      remoteRef:
        key: platform/mctl-api/oauth
        property: jwt-secret
    # Asymmetric access-token signing keys, step C0 of mctlhq/mctl-api#805
    # (runbook docs/access-token-signing.md). A JSON key set
    # {"active":kid,"keys":[...]} with PKCS#8 private keys; the public halves
    # are published at /.well-known/jwks.json. Present but unused until
    # OAUTH_JWT_SIGNING_ALG is switched (step C). A malformed value refuses
    # boot, and ESO fails the whole ExternalSecret if the property is
    # missing, so the Vault property was written before this entry merged.
    # Rotation: one `vault kv patch` of this property (new key active, old
    # one retained with retired_at), then a refresh and a rollout.
    - secretKey: OAUTH_JWT_SIGNING_KEYS
      remoteRef:
        key: platform/mctl-api/oauth
        property: jwt-signing-keys
    # Platform admins by principal id (mctlhq/mctl-api#377). This repository
    # is public, so principal ids live in Vault, not in mctl-api.yaml. Step 1
    # of 2: while mctl-api.yaml still sets ADMIN_PRINCIPALS under env, that
    # value wins over envFrom, so this entry changes nothing at runtime.
    # Step 2 removes the env line once this key is synced. ESO fails the
    # whole ExternalSecret if the property is missing, so the Vault property
    # is written before this entry merges.
    - secretKey: ADMIN_PRINCIPALS
      remoteRef:
        key: platform/mctl-api/authz
        property: admin-principals
    # Who may decide a release grant on the release approval page
    # (mctlhq/mctl-api#1022 S2): comma-separated principal ids, each also an
    # admin. Principal ids stay out of this public repository. The Vault
    # property was written (version 2 of platform/mctl-api/authz) before this
    # entry merged, because ESO fails the whole ExternalSecret if it is
    # missing. Read at container start: changing it needs a rollout.
    - secretKey: RELEASE_APPROVAL_DECIDERS
      remoteRef:
        key: platform/mctl-api/authz
        property: release-approval-deciders
    - secretKey: MCTL_AGENT_SERVICE_TOKEN
      remoteRef:
        key: platform/mctl-agent/tokens
        property: mctl-api-token
    - secretKey: DB_USER
      remoteRef:
        key: platform/mctl-api/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: platform/mctl-api/database
        property: password
    # Commerce dispatch signing key (mctl-api docs/commerce-ledger.md, ADR 020;
    # mctlhq/mctl-agents#620). Without it `/commerce/dispatch-keys` and
    # `.../dispatch` answer 503 `dispatch-unavailable`, so no paid invocation
    # can be dispatched. The seed is 32 random bytes, base64; the key id is the
    # name providers pin the public half under.
    #
    # Both come from ONE Vault entry on purpose: mctl-api refuses to boot when
    # exactly one of the pair is set, and ESO fails this whole ExternalSecret
    # when a remoteRef does not resolve. The Vault entry with both properties
    # must therefore exist before this lands. Rotation = a new key id with the
    # new seed, written together.
    - secretKey: COMMERCE_DISPATCH_KEY_ID
      remoteRef:
        key: platform/mctl-api/commerce-dispatch
        property: key-id
    - secretKey: COMMERCE_DISPATCH_SIGNING_KEY
      remoteRef:
        key: platform/mctl-api/commerce-dispatch
        property: signing-key
    # Read-only access to the bucket Argo Workflows archives step logs to,
    # backing mctl_get_workflow_logs. Same Vault path Argo itself reads for
    # artifactRepository (see argo-workflows/config/vault-auth.yaml), so the
    # credential has exactly the access the archive needs and nothing more.
    - secretKey: ARGO_LOGS_R2_ACCESS_KEY
      remoteRef:
        key: platform/r2-loki-argo
        property: access-key
    - secretKey: ARGO_LOGS_R2_SECRET_KEY
      remoteRef:
        key: platform/r2-loki-argo
        property: secret-key
    # HMAC for POST /api/v1/workflows/events/argo-complete (SOC F13).
    # Injected into the mctl-api Deployment via envFromSecret: mctl-api-secrets.
    - secretKey: ARGO_WEBHOOK_SECRET
      remoteRef:
        key: platform/mctl-api/argo-webhook
        property: secret
    # GITOPS_REPO_TOKEN and GITOPS_ACTIONS_TOKEN (static GitHub PATs for the
    # mctl-gitops clone and the cloudflare-apply dispatch) were removed here;
    # mctl-api uses the GitHub App installation token mounted as a file
    # (githubAppTokenSecret in mctl-api.yaml, mctlhq/mctl-api#307).
    # mctlhq/mctl-gitops#1240.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-ghcr
  namespace: mctl-api
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson
---
# The GitHub App installation token mctl-api uses to clone mctl-gitops and to
# dispatch cloudflare-apply.yml there. Minted every 30 minutes by the
# rotate-github-app-tokens CronWorkflow (App 4450852) into
# platform/mctl-api/github-app, which then force-syncs this ExternalSecret.
#
# Its OWN ExternalSecret, deliberately not a key in mctl-api-secrets above.
# ESO fails the whole ExternalSecret when a single remoteRef does not resolve,
# so a key with a 30-minute write cadence sitting next to DB_PASSWORD would let
# one bad rotation take the database credential down with it. Separate here
# means a rotation failure degrades the clone and the dispatcher, and nothing
# else.
#
# refreshInterval 15m, not the 1h default: the token lives 60 minutes and is
# re-minted every 30, so an hourly refresh leaves zero margin — the same
# reasoning as admins/mctl-agent.
#
# Consumed as a FILE, not envFrom (githubAppTokenSecret in mctl-api.yaml).
# Environment variables are fixed when the container starts, so an envFrom
# consumer would never see a rotation and would serve an expired token within
# the hour. mctl-api re-reads the file per use (internal/ghtoken).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-github-app
  namespace: mctl-api
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-github-app
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/mctl-api/github-app
        property: token
---
# GitHub pull request event producer (mctlhq/.github#87): the webhook HMAC
# secret, also configured on the mctlhq organization webhook, and the
# github-producer Valkey ACL user's password. Its own ExternalSecret for the
# same reason as mctl-api-github-app above: a missing key here must degrade
# the webhook, not the database credential. Consumed through
# envFromExtraSecret in mctl-api.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-events
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-events
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: platform/mctl-api/github-webhook
        property: secret
    - secretKey: EVENTS_VALKEY_PASSWORD
      remoteRef:
        key: platform/valkey
        property: github-producer-password
---
# Basket canary runtime login (mctlhq/mctl-api#1006, step W). The CNPG managed
# role and its platform-db copy come from cnpg/shared (mctl-gitops#2621).
# Consumed through envFromOptionalSecrets in mctl-api.yaml; nothing reads it
# while the feature flag is unset.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-glovo-runtime-db
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-glovo-runtime-db
    creationPolicy: Owner
    template:
      data:
        GLOVO_DB_USER: "{{ `{{ .username }}` }}"
        GLOVO_DB_PASSWORD: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: platform/mctl-api/glovo-runtime-database
        property: username
    - secretKey: password
      remoteRef:
        key: platform/mctl-api/glovo-runtime-database
        property: password
---
# Least-privilege work-items login mctl_api_workitems (DML only; grants come
# from the schema migrator, D2). Not used until WORK_ITEMS_DB_URL is switched
# in a separate step (W2); until then work items stay on the legacy role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-workitems-db
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-workitems-db
    creationPolicy: Owner
    template:
      data:
        WORKITEMS_DB_USER: "{{ `{{ .username }}` }}"
        WORKITEMS_DB_PASSWORD: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: platform/mctl-api/workitems-database
        property: username
    - secretKey: password
      remoteRef:
        key: platform/mctl-api/workitems-database
        property: password
