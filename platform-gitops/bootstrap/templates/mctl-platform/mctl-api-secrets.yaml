apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-secrets
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: platform/mctl-api/argocd-token
        property: token
    - secretKey: BACKSTAGE_TOKEN
      remoteRef:
        key: platform/mctl-api/backstage-token
        property: token
    - secretKey: DEX_CLIENT_SECRET
      remoteRef:
        key: platform/mctl-api/sso
        property: client-secret
    - secretKey: OAUTH_GITHUB_CLIENT_ID
      remoteRef:
        key: platform/github-app
        property: client-id
    - secretKey: OAUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        key: platform/github-app
        property: client-secret
    - secretKey: OAUTH_JWT_SECRET
      remoteRef:
        key: platform/mctl-api/oauth
        property: jwt-secret
    - secretKey: MCTL_AGENT_SERVICE_TOKEN
      remoteRef:
        key: platform/mctl-agent/tokens
        property: mctl-api-token
    # The one credential in this list that can start something outside the
    # cluster: a GitHub fine-grained token whose entire grant is Actions
    # read+write on mctlhq/mctl-gitops (plus the mandatory Metadata read).
    # It exists so mctl_trigger_portal_server_auth_apply can dispatch
    # cloudflare-apply.yml for infrastructure/cloudflare/portal; without it
    # the endpoint answers 503 and the tool is inert.
    #
    # GITOPS_ACTIONS_TOKEN, which is what cmd/api/main.go reads for the
    # dispatcher -- deliberately not GITOPS_REPO_TOKEN, the clone credential
    # described further down. The clone token needs contents:read and this one
    # needs actions:write; sharing would silently widen "can read the
    # repository" into "can start any workflow in it".
    #
    # Until 2026-09-12 there was a second reason, now gone: GITOPS_REPO_TOKEN
    # arrived through `envFromExtraSecret: mctl-api-gitops-token`, a Secret
    # created by neither this repository nor Vault, and envFrom applies in
    # order with the extra secret second -- so a key defined here under that
    # name would have silently lost to an unmanaged value. That mount is
    # removed and both names are described here (mctlhq/mctl-gitops#1229).
    #
    # What it deliberately cannot do, measured against the live token before
    # it was stored: dispatch a workflow in any other repository (403), write
    # repository contents (403), read Actions secrets (403). The apply it
    # starts is still gated behind the cloudflare-apply environment and its
    # required reviewer, so this token buys the ability to ASK, not to apply.
    #
    # Expires 2027-09-13 — the ceiling the organization allows for
    # fine-grained tokens; there is no no-expiry option. When it lapses the
    # tool starts answering 502 rather than failing quietly. The durable fix
    # is a GitHub App installation, whose tokens refresh themselves.
    #
    # Two things to check before this lands, both learned the hard way:
    #
    #   1. The Vault key and its `token` property must exist FIRST. ESO fails
    #      the whole ExternalSecret when one remoteRef does not resolve, not
    #      just the missing field -- so an unprovisioned key here takes
    #      DB_PASSWORD and OAUTH_JWT_SECRET down with it, and mctl-api with
    #      them. Verified populated before merge.
    #   2. The stored value must carry no trailing newline. `security
    #      find-generic-password -w` prints one, so piping it straight into
    #      `vault kv put ... token=-` stores 94 bytes where 93 were meant, and
    #      ESO would then deliver `Authorization: Bearer <token>\n` -- a
    #      header GitHub rejects, for a token that looks correct in every
    #      listing. Write it as `printf '%s' "$(...)" | vault kv put`, and
    #      check with `t == t.strip()` rather than by eye.
    - secretKey: GITOPS_ACTIONS_TOKEN
      remoteRef:
        key: platform/mctl-api/github-actions-dispatch
        property: token
    - secretKey: DB_USER
      remoteRef:
        key: platform/mctl-api/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: platform/mctl-api/database
        property: password
    # Read-only access to the bucket Argo Workflows archives step logs to,
    # backing mctl_get_workflow_logs. Same Vault path Argo itself reads for
    # artifactRepository (see argo-workflows/config/vault-auth.yaml), so the
    # credential has exactly the access the archive needs and nothing more.
    - secretKey: ARGO_LOGS_R2_ACCESS_KEY
      remoteRef:
        key: platform/r2-loki-argo
        property: access-key
    - secretKey: ARGO_LOGS_R2_SECRET_KEY
      remoteRef:
        key: platform/r2-loki-argo
        property: secret-key
    # HMAC for POST /api/v1/workflows/events/argo-complete (SOC F13).
    # Injected into the mctl-api Deployment via envFromSecret: mctl-api-secrets.
    - secretKey: ARGO_WEBHOOK_SECRET
      remoteRef:
        key: platform/mctl-api/argo-webhook
        property: secret
    # HTTPS clone credential for mctl-gitops, read by cmd/api/main.go as
    # GITOPS_REPO_TOKEN and handed to gitops.NewReader.
    #
    # Until 2026-09-12 this key was delivered by `mctl-api-gitops-token`, a
    # Secret applied by hand in 2026-03 and described nowhere. What it held,
    # read before it was replaced: a personal `gho_` OAuth token belonging to
    # the operator, scopes admin:org / repo / workflow / write:packages and no
    # expiry, which could read this repository's Actions secrets (verified 200)
    # for a job that needs to clone. A cluster rebuilt from Git came up without
    # the Secret at all, and since the mount was not `optional` the pod did not
    # start.
    #
    # What replaces it is scoped to the job: resource owner mctlhq, the single
    # repository mctlhq/mctl-gitops, Contents: Read plus the forced Metadata:
    # Read. Measured against the live token before it was stored -- clone over
    # HTTPS works; reading this repository's Actions secrets, dispatching
    # cloudflare-apply.yml, creating a ref, and listing organization members
    # all refused; private repositories it was not granted return 404.
    #
    # It expires 2026-12-11 and nothing watches for that. It is deliberately
    # interim: mctlhq/mctl-api#307 moves both this and GITOPS_ACTIONS_TOKEN
    # onto GitHub App installation tokens, which refresh themselves. When that
    # lands, this key and the PAT behind it both go.
    #
    # Same two rules as GITOPS_ACTIONS_TOKEN above apply to the Vault write:
    # the key must exist before this merges, and the stored value must carry
    # no trailing newline. Both verified 2026-09-12 (93 bytes, read back and
    # compared byte-for-byte).
    - secretKey: GITOPS_REPO_TOKEN
      remoteRef:
        key: platform/mctl-api/gitops-repo
        property: token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-ghcr
  namespace: mctl-api
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson
