apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-secrets
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: platform/mctl-api/argocd-token
        property: token
    - secretKey: BACKSTAGE_TOKEN
      remoteRef:
        key: platform/mctl-api/backstage-token
        property: token
    - secretKey: DEX_CLIENT_SECRET
      remoteRef:
        key: platform/mctl-api/sso
        property: client-secret
    - secretKey: OAUTH_GITHUB_CLIENT_ID
      remoteRef:
        key: platform/github-app
        property: client-id
    - secretKey: OAUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        key: platform/github-app
        property: client-secret
    - secretKey: OAUTH_JWT_SECRET
      remoteRef:
        key: platform/mctl-api/oauth
        property: jwt-secret
    - secretKey: MCTL_AGENT_SERVICE_TOKEN
      remoteRef:
        key: platform/mctl-agent/tokens
        property: mctl-api-token
    # Rollback path only once VAULT_KUBERNETES_ROLE (mctl-api.yaml) is
    # confirmed working — VAULT_KUBERNETES_ROLE takes precedence when both
    # are set. Same token Backstage used to read from this path before its
    # own migration (gitops#699/#700); do not revoke until this consumer is
    # migrated too.
    - secretKey: VAULT_TOKEN
      remoteRef:
        key: platform/backstage/vault-token
        property: token
    - secretKey: DB_USER
      remoteRef:
        key: platform/mctl-api/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: platform/mctl-api/database
        property: password
    # Read-only access to the bucket Argo Workflows archives step logs to,
    # backing mctl_get_workflow_logs. Same Vault path Argo itself reads for
    # artifactRepository (see argo-workflows/config/vault-auth.yaml), so the
    # credential has exactly the access the archive needs and nothing more.
    - secretKey: ARGO_LOGS_R2_ACCESS_KEY
      remoteRef:
        key: platform/r2-loki-argo
        property: access-key
    - secretKey: ARGO_LOGS_R2_SECRET_KEY
      remoteRef:
        key: platform/r2-loki-argo
        property: secret-key
    # HMAC for POST /api/v1/workflows/events/argo-complete (SOC F13).
    # Injected into the mctl-api Deployment via envFromSecret: mctl-api-secrets.
    - secretKey: ARGO_WEBHOOK_SECRET
      remoteRef:
        key: platform/mctl-api/argo-webhook
        property: secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-ghcr
  namespace: mctl-api
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson
