# Scrape the communication agent's metrics.
#
# Both workloads that emit mctl_agent_* run in labs as preview instances, and
# neither was scraped until this file existed:
#
#   labs-mctl-telegram-preview   the server process. It emits
#                                mctl_agent_policy_denials_total (from
#                                internal/agentapi and internal/agent/executor),
#                                mctl_agent_dead_letter_total and
#                                mctl_agent_actions_executing_stuck. The agent
#                                is enabled ONLY here — services/labs/
#                                mctl-telegram/values.yaml sets no AGENT_* at
#                                all — and mctl-telegram-monitor.yaml pins
#                                itself to the labs-mctl-telegram instance,
#                                deliberately excluding this one.
#
#   labs-agent-worker-preview    the job runner. It emits
#                                mctl_agent_job_cost_usd_total,
#                                mctl_agent_claude_result_errors_total and the
#                                mctl_agent_credential_domain info gauge
#                                (mctlhq/mctl-telegram#580, merged as #583).
#                                It has never had a scrape of any kind.
#
# The consequence was not merely missing dashboards: MctlAgentDeadLetter and
# MctlAgentActionsExecutingStuck have been deployed in
# infra-components/observability/vm-rules/mctl-telegram-ops.yaml since the
# communication-agent rollout and could never fire, because the series they
# evaluate were not being collected from anywhere.
#
# port: http is correct for both. base-service only renders a separate
# `metrics` port when metrics.enabled is true, which neither service sets, and
# both binaries serve /metrics on their main listener anyway — the server on
# its app port, the worker on its health-probe port
# (cmd/agent-worker/health_server.go). Each endpoint has an optional CIDR
# guard (METRICS_ALLOW_CIDR and AGENT_METRICS_ALLOW_CIDR); neither is set in
# values.yaml, so both are open and the in-cluster scrape is not blocked.
#
# Native VMServiceScrape rather than monitoring.coreos.com/ServiceMonitor, for
# the reason spelled out in mctl-agents-worker-monitor.yaml: the VM operator
# auto-converts the latter and leaves the original orphaned, producing ArgoCD
# drift.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: mctl-telegram-agent-preview
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: base-service
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - labs-mctl-telegram-preview
          - labs-agent-worker-preview
  namespaceSelector:
    matchNames:
      - labs
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
