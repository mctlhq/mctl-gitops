# Developer Portal (Backstage)
# Consolidates Application, ExternalSecrets, and RBAC

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-oauth
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backstage-secrets
    creationPolicy: Owner
    template:
      data:
        AUTH_GITHUB_CLIENT_ID: "{{ `{{ .client_id }}` }}"
        AUTH_GITHUB_CLIENT_SECRET: "{{ `{{ .client_secret }}` }}"
        OIDC_CLIENT_ID: "{{ `{{ .oidc_client_id }}` }}"
        OIDC_CLIENT_SECRET: "{{ `{{ .oidc_client_secret }}` }}"
        OIDC_RULES_CLIENT_SECRET: "{{ `{{ .rules_oidc_client_secret }}` }}"
        GITHUB_APP_ID: "{{ `{{ .app_id }}` }}"
        GITHUB_APP_CLIENT_ID: "{{ `{{ .client_id }}` }}"
        GITHUB_APP_CLIENT_SECRET: "{{ `{{ .client_secret }}` }}"
        GITHUB_APP_PRIVATE_KEY: "{{ `{{ .private_key }}` }}"
        GITHUB_APP_INSTALLATION_ID: "{{ `{{ .installation_id }}` }}"
        VAULT_ADDR: "https://secrets.mctl.ai"
        POSTGRES_USER: "{{ `{{ .postgres_user }}` }}"
        POSTGRES_PASSWORD: "{{ `{{ .postgres_password }}` }}"
        POSTGRES_HOST: "{{ `{{ .postgres_host }}` }}"
        POSTGRES_PORT: "{{ `{{ .postgres_port }}` }}"
        POSTGRES_DB: "{{ `{{ .postgres_db }}` }}"
        DATABASE_URL: "{{ `{{ .database_url }}` }}"
        K8S_SERVICE_ACCOUNT_TOKEN: "{{ `{{ .k8s_token }}` }}"
        ARGO_WORKFLOWS_TOKEN: "{{ `{{ .argo_workflows_token }}` }}"
        GITHUB_WEBHOOK_SECRET: "{{ `{{ .webhook_secret }}` }}"
        BACKSTAGE_LANDING_TOKEN: "{{ `{{ .landing_token }}` }}"
        BACKSTAGE_TOKEN: "{{ `{{ .backstage_token }}` }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: platform/github-app
        property: client-id
    - secretKey: client_secret
      remoteRef:
        key: platform/github-app
        property: client-secret
    - secretKey: oidc_client_id
      remoteRef:
        key: platform/backstage/github-oauth
        property: client-id
    - secretKey: oidc_client_secret
      remoteRef:
        key: platform/backstage/github-oauth
        property: client-secret
    # Same OIDC client secret the mctl-rules app uses on its side. Copied from
    # teams/labs/mctl-rules to a platform path so this ExternalSecret does not
    # need the cluster store to reach under teams/ — that grant was what let any
    # tenant read any other tenant's secrets. The teams/ copy stays for the app
    # itself; both must be rewritten together if the client secret is rotated.
    # Must exist in Vault BEFORE this file merges, or the whole backstage-oauth
    # ExternalSecret stops syncing.
    - secretKey: rules_oidc_client_secret
      remoteRef:
        key: platform/mctl-rules
        property: OIDC_CLIENT_SECRET
    # Shared with mctl-api, which reads the same Vault path into its own
    # BACKSTAGE_TOKEN. Both sides must see the identical value: mctl-api sends
    # it as a Bearer, Backstage matches it against backend.auth.externalAccess.
    # Rotating it means rewriting this one Vault key — both ExternalSecrets
    # then pick the new value up on their next sync.
    - secretKey: backstage_token
      remoteRef:
        key: platform/mctl-api/backstage-token
        property: token
    - secretKey: app_id
      remoteRef:
        key: platform/github-app
        property: app-id
    - secretKey: private_key
      remoteRef:
        key: platform/github-app
        property: private-key
    - secretKey: installation_id
      remoteRef:
        key: platform/github-app
        property: installation-id
    - secretKey: postgres_user
      remoteRef:
        key: platform/backstage/database
        property: postgres-user
    - secretKey: postgres_password
      remoteRef:
        key: platform/backstage/database
        property: postgres-password
    - secretKey: postgres_host
      remoteRef:
        key: platform/backstage/database
        property: postgres-host
    - secretKey: postgres_port
      remoteRef:
        key: platform/backstage/database
        property: postgres-port
    - secretKey: postgres_db
      remoteRef:
        key: platform/backstage/database
        property: postgres-db
    - secretKey: database_url
      remoteRef:
        key: platform/backstage/database
        property: database-url
    - secretKey: k8s_token
      remoteRef:
        key: platform/backstage/k8s-reader
        property: token
    - secretKey: argo_workflows_token
      remoteRef:
        key: platform/backstage/argo-workflows
        property: token
    - secretKey: webhook_secret
      remoteRef:
        key: platform/backstage/github-webhook
        property: webhook_secret
    - secretKey: landing_token
      remoteRef:
        key: platform/backstage/landing-token
        property: token

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-ghcr
  namespace: backstage
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-k8s-reader
  namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-k8s-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events", "namespaces", "limitranges", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-k8s-reader
subjects:
  - kind: ServiceAccount
    name: backstage-k8s-reader
    namespace: backstage
roleRef:
  kind: ClusterRole
  name: backstage-k8s-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-k8s-reader-token
  namespace: backstage
  annotations:
    kubernetes.io/service-account.name: backstage-k8s-reader
type: kubernetes.io/service-account-token

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admins-mctl-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.6.3
    helm:
      releaseName: backstage
      values: |
        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          host: app.mctl.ai
          extraHosts:
            - name: app.mctl.ai
          tls:
            enabled: true
            secretName: backstage-tls
          extraTls:
            - hosts:
                - app.mctl.ai
              secretName: backstage-mctl-ai-tls

        # Backstage ran under the namespace's `default` ServiceAccount, which
        # cannot be bound to a Vault role without handing that role to every
        # other pod that defaults into it. A dedicated identity is the
        # prerequisite for vault-secrets-backend authenticating with its own
        # projected token instead of a static one.
        serviceAccount:
          create: true
          name: backstage
          automountServiceAccountToken: true

        backstage:
          image:
            registry: ghcr.io
            repository: mctlhq/mctl-portal
            tag: 4.12.0
            pullSecrets:
              - ghcr-credentials
          resources:
            requests:
              cpu: 100m
              # Observed RSS ~368Mi; 384Mi gives 4% buffer. Raised 256Mi→384Mi
              # on 2026-05-10 (RAM real>requests gap on Global RAM dashboard).
              memory: 384Mi
            limits:
              # Steady-state ~26m; 300m gives 11x cushion. Trimmed 500m→300m
              # on 2026-05-07 (CPU-limits cluster headroom).
              cpu: 300m
              memory: 768Mi
          extraEnvVarsSecrets:
            - backstage-secrets
          startupProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            periodSeconds: 10
            failureThreshold: 2
          appConfig:
            app:
              title: mctl.ai User Portal
              baseUrl: https://app.mctl.ai
            organization:
              name: MCTL
            backend:
              baseUrl: https://app.mctl.ai
              listen:
                port: 7007
              csp:
                img-src: ["'self'", 'data:', 'https://ui.mctl.ai']
              # mctl-api is not a Backstage backend and cannot mint service
              # tokens, so it authenticates with this shared static token, sent
              # as a Bearer. Without an entry here Backstage answers "Illegal
              # token" — which is what kept custom domains unusable after
              # mctl-portal 951d450 dropped the unauthenticated policy from
              # /domains* to close a domain-hijack vector.
              # BACKSTAGE_TOKEN comes from the ExternalSecret above, reading the
              # same Vault key mctl-api reads, so both sides match by
              # construction. Note this appConfig is the only config the pod
              # loads (--config app-config-from-configmap.yaml); the repo's
              # app-config.production.yaml is not used in production.
              # Interim: type: jwks against mctl-api's in-cluster ServiceAccount
              # identity would drop the shared secret entirely.
              auth:
                externalAccess:
                  - type: static
                    options:
                      token: ${BACKSTAGE_TOKEN}
                      subject: mctl-api
                    accessRestrictions:
                      - plugin: custom-domains
              reading:
                allow:
                  - host: app.mctl.ai
                  - host: app.mctl.ai
              database:
                client: pg
                pluginDivisionMode: schema
                connection:
                  host: ${POSTGRES_HOST}
                  port: ${POSTGRES_PORT}
                  user: ${POSTGRES_USER}
                  password: ${POSTGRES_PASSWORD}
                  database: ${POSTGRES_DB}
                knexConfig:
                  pool:
                    min: 0
                    max: 3
            auth:
              environment: production
              providers:
                github:
                  production:
                    clientId: ${AUTH_GITHUB_CLIENT_ID}
                    clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            integrations:
              github:
                - host: github.com
                  apps:
                    - appId: ${GITHUB_APP_ID}
                      clientId: ${GITHUB_APP_CLIENT_ID}
                      clientSecret: ${GITHUB_APP_CLIENT_SECRET}
                      privateKey: ${GITHUB_APP_PRIVATE_KEY}
            permission:
              enabled: true
            githubAppConnect:
              appSlug: mctl-app
              appId: ${GITHUB_APP_ID}
              privateKey: ${GITHUB_APP_PRIVATE_KEY}
              webhookSecret: ${GITHUB_WEBHOOK_SECRET}
            vaultSecrets:
              endpoint: ${VAULT_ADDR}
              # Kubernetes auth (mctl-portal#53): the backstage ServiceAccount
              # authenticates with its own projected token via the `backstage`
              # Vault role. Confirmed live 2026-08-01 ("Vault kubernetes auth
              # succeeded" in pod logs, DB-credentials card verified working).
              # The static token is dropped from Backstage's ExternalSecret;
              # it is NOT revoked in Vault — mctl-api still reads the same
              # secret/platform/backstage/vault-token (see vault-config
              # README). A rollback means reverting this commit, not minting
              # a new token.
              kubernetesRole: backstage
            argoWorkflows:
              baseUrl: https://workflows.mctl.ai
              namespace: argo-workflows
              token: ${ARGO_WORKFLOWS_TOKEN}
            tenantManagement:
              githubOrg: mctlhq
              repoName: mctl-gitops
              tenantsPath: platform-gitops/tenants
              syncIntervalMinutes: 5
              landingPageToken: ${BACKSTAGE_LANDING_TOKEN}
              githubAppInstallationId: ${GITHUB_APP_INSTALLATION_ID}
              defaultQuotas:
                cpuReq: "1"
                cpuLim: "2"
                memReq: "2Gi"
                memLim: "3Gi"
                pods: "10"
                pvcs: "2"
                services: "5"
              maxTeamsPerTenant: 1
            oidcProvider:
              issuer: https://app.mctl.ai/api/oidc-provider
              github:
                clientId: ${AUTH_GITHUB_CLIENT_ID}
                clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
              clients:
                - clientId: ${OIDC_CLIENT_ID}
                  clientSecret: ${OIDC_CLIENT_SECRET}
                  redirectUris:
                    - https://ops.mctl.ai/api/dex/callback
                    - https://ops.mctl.ai/api/dex/callback
                # mctl-rules (rules.mctl.ai) — confidential client + PKCE S256
                - clientId: mctl-rules
                  clientSecret: ${OIDC_RULES_CLIENT_SECRET}
                  redirectUris:
                    - https://rules.mctl.ai/api/auth/callback
                    - https://labs-mctl-rules.mctl.ai/api/auth/callback
            resourceUsage:
              kubeConfigType: token
              kubeApiUrl: https://kubernetes.default.svc
              kubeToken: ${K8S_SERVICE_ACCOUNT_TOKEN}
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            kubernetes:
              serviceLocatorMethod:
                type: multiTenant
              clusterLocatorMethods:
                - type: config
                  clusters:
                    - url: https://kubernetes.default.svc
                      name: production
                      authProvider: serviceAccount
                      # Verify the in-cluster API endpoint against the mounted
                      # ServiceAccount CA instead of skipTLSVerify (SOC CC6.7,
                      # same approach as resourceUsage.caFile / F7).
                      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}
            # No /vault proxy endpoint. It existed to let scaffolder templates
            # reach Vault via http:backstage:request, but no template ever used
            # it — and with credentials: dangerously-allow-unauthenticated it
            # attached the backstage-teams-rw token to ANY caller, so
            # /api/proxy/vault/v1/secret/data/teams/<team>/<svc> served (and
            # accepted writes to) every team secret with no auth at all.
            # Backstage's own routes are the only supported path to Vault:
            # vault-secrets-backend authenticates the caller and checks tenant
            # membership before reading. Do not re-add a proxy here.
            techdocs:
              builder: local
              generator:
                runIn: local
              publisher:
                type: local
            catalog:
              processingInterval: { seconds: 30 }
              orphanStrategy: delete
              rules:
                - allow: [Component, System, Resource, Location, Template, Group, User]
              providers:
                github:
                  mctlMe:
                    organization: mctlhq
                    catalogPath: /catalog-info.yaml
                    filters:
                      repository: mctl-gitops
                      branch: main
                    schedule:
                      frequency:
                        minutes: 1
                      timeout:
                        minutes: 3
                  services:
                    organization: mctlhq
                    catalogPath: /platform-gitops/services/*/*/catalog-info.yaml
                    filters:
                      repository: mctl-gitops
                      branch: main
                    schedule:
                      frequency:
                        minutes: 1
                      timeout:
                        minutes: 3
                  tenants:
                    organization: mctlhq
                    catalogPath: /platform-gitops/tenants/*/catalog-info.yaml
                    filters:
                      repository: mctl-gitops
                      branch: main
                    schedule:
                      frequency:
                        minutes: 1
                      timeout:
                        minutes: 3
              locations:
                # Backstage templates (static, no need for provider-based discovery)
                - type: url
                  target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage/templates/deploy-component/template.yaml
                  rules:
                    - allow: [Template]
                - type: url
                  target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage/templates/delete-component/template.yaml
                  rules:
                    - allow: [Template]
                - type: url
                  target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage/templates/update-component-config/template.yaml
                  rules:
                    - allow: [Template]
                - type: url
                  target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage/templates/provision-database/template.yaml
                  rules:
                    - allow: [Template]
                - type: url
                  target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage/templates/deploy-version/template.yaml
                  rules:
                    - allow: [Template]
                - type: url
                  target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage/templates/create-tenant/template.yaml
                  rules:
                    - allow: [Template]
                - type: url
                  target: https://github.com/mctlhq/mctl-gitops/blob/main/platform-gitops/backstage/templates/delete-tenant/template.yaml
                  rules:
                    - allow: [Template]
                # Tenant User/Group/System entities come from
                # TenantCatalogEntityProvider (in-process, mctl-portal 4.11.2+).
                # Do not re-add catalog.yaml?token= — UrlReader cannot send
                # headers and the query token leaks via logs and referrer.

        # PostgreSQL subchart disabled — using shared CNPG cluster in platform-db namespace
        postgresql:
          enabled: false

  ignoreDifferences:
    # ESO admission webhook injects defaults absent in git, plus legacy
    # last-applied-configuration annotations can pin stale apiVersion across
    # chart churn. Mirror the tenants ApplicationSet pattern.
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .metadata.annotations
        # Note: .metadata.managedFields must NOT be listed here — with
        # RespectIgnoreDifferences=true + ServerSideApply, ArgoCD injects the
        # live object's cached managedFields into the SSA apply payload, which
        # the apiserver rejects ("metadata.managedFields must be nil").
        - .spec.target.deletionPolicy
        # The six `.spec.data[].remoteRef.*` / `.spec.dataFrom[].extract.*` entries
        # that used to sit here were removed. A jq path that indexes INTO an array,
        # combined with RespectIgnoreDifferences + ServerSideApply, makes ArgoCD
        # merge the live array elements back into the apply payload — so spec.data
        # can never shrink. Dropping an entry then reports a successful sync and
        # stays OutOfSync forever (#789, upstream argo-cd#17694, fix due in ArgoCD
        # 3.6 — we run 3.3.8). They ignored ESO's own CRD defaults, which the
        # ExternalSecrets now state explicitly instead, so git matches live.
        #
        # This whole ExternalSecret rule is in fact inert for THIS Application: its
        # only source is the upstream backstage chart, which renders no ExternalSecret. The
        # ExternalSecrets in this namespace live in the bootstrap chart and belong
        # to root-app. Kept rather than deleted so the rule stays uniform with the
        # apps that do own ExternalSecrets.
        - .status
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
