# SOC F11: keep at least one mctl-api pod through voluntary disruption
# (drain, kured). With replicaCount 2 (since 2026-10-09) this budget allows
# one eviction at a time, so a drain moves the replicas one by one and the
# API stays up. Rolling updates are not gated by it: Deployments delete pods
# directly; PDBs only gate the Eviction API.
#
# Applied as a raw manifest by root-app because the mctl-api Application
# renders an external chart (mctl-api repo helm/) that has no PDB template;
# same pattern as mctl-api-netpol.yaml.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mctl-api
  namespace: mctl-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mctl-api
