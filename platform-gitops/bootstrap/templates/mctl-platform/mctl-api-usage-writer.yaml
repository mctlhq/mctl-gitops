{{- if .Values.usageWriter.enabled }}
# Bearer token of the usage-writer principal (service:mctl-agents-usage,
# mctlhq/.github#50): it may only append usage records. Rendered only when
# usageWriter.enabled is true in bootstrap/values.yaml, where the owner steps
# are written down.
#
# Its own ExternalSecret, for the same reason as mctl-api-github-app in
# mctl-api-secrets.yaml: a missing property must disable the usage writer,
# not take DB_PASSWORD down with it. Its own FILE because the whole body sits
# inside the gate, and a file that leads with a template directive is not YAML to
# yamllint (listed in .github/workflows/yamllint.yml's ignore, like the
# issue-903 eval templates). Read from the same Vault property the agent runner pods get through
# mctl-agents-secrets, so there is one value and nothing to keep in step.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-usage-writer
  namespace: mctl-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-usage-writer
    creationPolicy: Owner
  data:
    - secretKey: MCTL_USAGE_WRITER_TOKEN
      remoteRef:
        key: platform/mctl-agents
        property: usage-writer-token
{{- end }}
