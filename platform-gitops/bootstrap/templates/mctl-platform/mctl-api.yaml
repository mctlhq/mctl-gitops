apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admins-mctl-api
  namespace: argocd
spec:
  project: platform
  sources:
    # Helm chart from the mctl-api repository
    - repoURL: https://github.com/mctlhq/mctl-api.git
      targetRevision: main
      path: helm
      helm:
        releaseName: mctl-api
        values: |
          # Two replicas since mctl-api 4.70.0 (mctl-api#503), after the
          # 2026-10-09 outage in which the single pod sat unready for five
          # hours. OAuth sign-ins keep their in-flight state (pending
          # authorizations, codes) in Postgres and work on any replica. The
          # identity link flow keeps its challenges in the memory of the pod
          # that started them, so the Service gets a sticky cookie: every
          # link step is a browser request and stays on one pod (without it a
          # link fails safe with "start again"). Rate limiters are per pod, so
          # their effective ceilings double. The spread keeps the replicas on
          # different nodes; ScheduleAnyway, so a node down for maintenance
          # never blocks scheduling.
          replicaCount: 2
          service:
            annotations:
              traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
              traefik.ingress.kubernetes.io/service.sticky.cookie.name: mctl_api_affinity
              traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
              traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
              traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: lax
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mctl-api

          image:
            repository: ghcr.io/mctlhq/mctl-api
            tag: "4.71.1"

          ingress:
            enabled: true
            className: traefik
            tls: true
            hosts:
              - host: api.mctl.ai

          env:
            GITOPS_REPO_URL: https://github.com/mctlhq/mctl-gitops.git
            GITOPS_BRANCH: main
            GITOPS_LOCAL_PATH: /data/mctl-gitops
            # Restart marker, read by nothing. mctl-api initialises several
            # stores once at startup and keeps a failed one nil (503) until
            # the pod restarts (mctlhq/mctl-api#387); the chart has no pod
            # annotation hook, so changing this value is how gitops restarts
            # the pod. Last bumped 2026-09-30: load the usage price card
            # with the claude-opus-5-5 and claude-sonnet-5-5 entries (the
            # catalog is read once at startup, see
            # bootstrap/files/usage-pricing/README.md).
            ROLLOUT_MARKER: "2026-09-30-pricing-5-5-models"
            ARGOCD_URL: https://ops.mctl.ai
            ARGO_WORKFLOWS_NAMESPACE: argo-workflows
            GITHUB_ORG: mctlhq
            ADMIN_USERS: mashkovd
            AUTH_REQUIRED: "true"
            BACKSTAGE_URL: https://app.mctl.ai
            DEX_ISSUER_URL: https://ops.mctl.ai/api/dex
            DEX_CLIENT_ID: mctl-api
            SELF_URL: https://api.mctl.ai
            # In-cluster, not https://secrets.mctl.ai. On 2026-10-09 the pod's
            # /readyz Vault check timed out through the public, Cloudflare-
            # fronted hostname for five hours while Vault itself answered the
            # same URL from outside; readiness took the whole API down with
            # it. Every other in-cluster consumer (ESO, Argo Workflows,
            # vault-backup) already talks to the service directly. The
            # listener is plain HTTP (vault.yaml, tls_disable = 1); the
            # mctl-api namespace is allowed by the vault namespace's
            # allow-vault-ingress policy. vault-active routes to the leader,
            # so reads skip the standby-forwarding hop.
            VAULT_ADDR: http://vault-active.vault.svc.cluster.local:8200
            # Kubernetes auth (mirrors the Backstage migration, gitops#699):
            # the mctl-api ServiceAccount authenticates with its own
            # projected token via the `mctl-api` Vault role. Confirmed live
            # 2026-08-02; the static-token rollback path this comment used to
            # describe (VAULT_TOKEN in mctl-api-secrets.yaml) is gone —
            # the token itself was revoked the same day.
            VAULT_KUBERNETES_ROLE: mctl-api
            # OAuth 2.0 for Claude.ai custom connector (PKCE, public client)
            # Secrets (OAUTH_GITHUB_CLIENT_ID, OAUTH_GITHUB_CLIENT_SECRET, OAUTH_JWT_SECRET)
            # come from mctl-api-secrets (Vault: platform/mctl-api/oauth-github)
            #
            # Entries ending in "/*" are prefix matches, everything else is an
            # exact string compare (internal/auth/oauth_server.go IsRedirectURIAllowed).
            # Loopback (http://localhost|127.0.0.1|[::1]:PORT/...) is always accepted
            # and deliberately not listed here — CLI clients that bind an ephemeral
            # port need no entry at all.
            #
            # antigravity.google: the Antigravity/Gemini CLI registers via RFC 7591
            # DCR with a redirect on its own hosted domain rather than a loopback,
            # so without this entry every registration attempt 400s and the client
            # can only be used with a hand-pasted static bearer token. Wildcard
            # rather than an exact path because the callback path is not documented
            # and has to survive client updates.
            #
            # *-openclaw.mctl.ai: each OpenClaw tenant panel runs the OAuth
            # dance from its own hostname. It re-registers via DCR on every
            # connect attempt, so nothing here is about a stale registration:
            # /oauth/register validates with IsRedirectURIAllowed("", uri) --
            # an EMPTY client id, by design, so that registration cannot mint a
            # client for an arbitrary attacker callback (internal/api/
            # oauth_handlers.go, SOC hardening 8422446). On that path only this
            # list and RFC 8252 loopback count; a client's own redirect_uris do
            # not. A tenant panel is not loopback, so without an entry here it
            # is refused before it ever receives a client id:
            # redirect_uri "https://admins-openclaw.mctl.ai/overview?mctl_oauth=1"
            # is not allowed -- which is what blocks mctlhq/mctl-gitops#571.
            # Listed per tenant because IsRedirectURIAllowed matches a string
            # prefix, not a host wildcard -- a general host-suffix rule is
            # mctlhq/mctl-api#290. The list is the tenants under
            # platform-gitops/services/; my-team-openclaw.mctl.ai still appears
            # in docs examples but the tenant was deleted in af03d315, and a
            # decommissioned host must not stay authorized here.
            #
            # Exact URIs, deliberately NOT "<host>/*". The panel builds the
            # callback deterministically as <origin><basePath>/overview with
            # ?mctl_oauth=1 (ui/src/ui/controllers/mctl-connect.ts), and no
            # tenant sets basePath, so the exact string is knowable. A path
            # wildcard would authorize every path on the panel host, which
            # turns any open redirect or XSS there into code interception --
            # and PKCE does not help, because an attacker who starts the flow
            # holds the verifier. If a tenant ever moves under a basePath this
            # entry stops matching, which fails loudly and is the safer way to
            # find out.
            #
            # IDE clients (2026-10-08). /oauth/register refuses a registration
            # as a whole when any one of its redirect_uris is not allowed, and
            # these clients send their full set every time, so their loopback
            # entry alone never got them in:
            #   VS Code  -- https://vscode.dev/redirect,
            #               https://insiders.vscode.dev/redirect, plus two
            #               127.0.0.1 entries (src/vs/base/common/oauth.ts,
            #               fetchDynamicRegistration).
            #   Cursor   -- cursor://anysphere.cursor-mcp/oauth/callback,
            #               https://www.cursor.com/agents/mcp/oauth/callback,
            #               plus http://localhost:8787/callback (read from the
            #               3.19.16 bundle).
            # Exact strings, for the reason given above. The two vscode.dev
            # pages and the cursor:// scheme hand the code to the editor on the
            # user's own machine; www.cursor.com is Cursor's hosted agent
            # callback, the same class of entry as claude.ai and chatgpt.com.
            # Windsurf needs nothing here: it registers a loopback callback.
            OAUTH_ALLOWED_REDIRECT_URIS: "https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback,http://localhost:6274/oauth/callback,http://localhost:6274/oauth/callback/debug,https://chatgpt.com/connector/oauth/*,https://antigravity.google/*,https://admins-openclaw.mctl.ai/overview?mctl_oauth=1,https://labs-openclaw.mctl.ai/overview?mctl_oauth=1,https://ovk-openclaw.mctl.ai/overview?mctl_oauth=1,https://mcp.mctl.ai/servers-callback,https://dash.cloudflare.com/6a09f637d20e1f66a8e9d45ebe778058/one/access-controls/ai-controls/mcp-server/oauth-callback/api,https://vscode.dev/redirect,https://insiders.vscode.dev/redirect,cursor://anysphere.cursor-mcp/oauth/callback,https://www.cursor.com/agents/mcp/oauth/callback"
            # No OAUTH_PREREGISTERED_CLIENTS: the portal's static client
            # `cloudflare-portal-mcp` (mctlhq/mctl-api#278) was retired on
            # 2026-09-26 after the `api` upstream moved to automatic (DCR)
            # mode. The portal now registers itself through /oauth/register,
            # persisted since mctlhq/mctl-api#400, with the two callbacks
            # above (mctlhq/mctl-gitops#1363).
            # Upstream identity provider of /oauth/authorize
            # (mctlhq/mctl-api#467, canary for mctlhq/mctl-gitops#1500 phase 2).
            # `zitadel`: ZITADEL (auth.mctl.ai) is the only sign-in. The canary
            # on `both` was proven end to end on 2026-10-06. A person whose
            # ZITADEL identity is not linked gets a 403 page that leads to the
            # link flow (/identity/link/zitadel); that flow still signs them in
            # with GitHub once to prove the old account, in any mode. Sessions
            # that already exist keep working: refresh never goes upstream.
            # Needs OAUTH_ZITADEL_CLIENT_ID/SECRET from oauthZitadelSecret
            # below; mctl-api refuses to start in this mode without them.
            # mctl-issued tokens and group resolution are unchanged: the
            # ZITADEL identity maps to the linked GitHub login.
            # Rollback: set this back to `both`.
            OAUTH_UPSTREAM: "zitadel"
            # Browser origins permitted by CORS. Distinct from the redirect URIs
            # above: those govern where the OAuth dance may hand a code back,
            # this governs which page may read an authenticated API response.
            #
            # Set explicitly because the code default is not a safe production
            # value — it allows claude.ai AND glama.ai while logging "using
            # localhost-only defaults", so the deployment silently trusted an
            # origin nobody chose. Anything unlisted simply gets no
            # Access-Control-Allow-Origin header and the browser blocks it.
            #
            # chatgpt.com and antigravity.google are deliberately absent: both
            # appear in OAUTH_ALLOWED_REDIRECT_URIS, but neither reads the API
            # from a browser page — they call it server-side, where CORS does
            # not apply. Add one only when a real preflight is observed failing.
            ALLOWED_ORIGINS: "https://claude.ai,https://claude.com"
            # Allow git operations on emptyDir volume (owned by root, run as uid=1000)
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: "safe.directory"
            GIT_CONFIG_VALUE_0: "*"
            LOKI_URL: "http://loki-stack.monitoring.svc.cluster.local:3100"
            # Argo Workflows step-log archive, backing mctl_get_workflow_logs.
            # Distinct from LOKI_URL above: promtail feeds Loki from long-lived
            # service pods under the ArgoCD naming convention, so Loki can never
            # serve an Argo step pod. Argo's wait sidecar uploads each step's log
            # here as part of the step, making it the complete (and longer-lived)
            # source for workflow post-mortems.
            # Credentials come from mctl-api-secrets (Vault: platform/r2-loki-argo).
            ARGO_LOGS_R2_ENDPOINT: "6a09f637d20e1f66a8e9d45ebe778058.r2.cloudflarestorage.com"
            ARGO_LOGS_R2_BUCKET: "argo-workflows-logs"
            # CNPG shared-pg has TLS on (server cert SANs include
            # shared-pg-rw.platform-db.svc). sslmode=require encrypts without
            # pinning the operator CA; verify-full needs a copied CA secret
            # in this namespace (helm postgresCA) and can wait for CA sync.
            AUDIT_DB_URL: "postgresql://$(DB_USER):$(DB_PASSWORD)@shared-pg-rw.platform-db.svc:5432/mctl-api?sslmode=require"
            # The lifecycle ownership store (ADR-010) gets its OWN database,
            # not mctl-api's: it is the source of truth for who may act on an
            # entity, and its neighbours in mctl-api -- the audit log, the
            # alert store, the agent registry -- are retained, vacuumed and
            # restored on their own schedules.
            #
            # Set in a SEPARATE merge from the Database CR (mctlhq/mctl-gitops#1245)
            # and deliberately so: shared-pg and admins-mctl-api are two ArgoCD
            # Applications reconciling independently, so landing both at once
            # can restart mctl-api before CNPG has created the database. The
            # store initialises once at startup with a bounded retry budget;
            # exhaust it and it stays nil, answering 503 long after the
            # Database goes Ready, until somebody restarts the pod again.
            #
            # cmd/api/main.go falls back to AUDIT_DB_URL when this is unset,
            # which is how the ownership tables ended up in mctl-api in the
            # first place. That fallback makes a typo HERE silent: the store
            # would come up healthy against the audit database -- a 200 that
            # means the wrong thing. Confirm on deploy that the lifecycle list
            # read answers count: 0; a non-zero count means it is still
            # talking to mctl-api.
            LIFECYCLE_DB_URL: "postgresql://$(DB_USER):$(DB_PASSWORD)@shared-pg-rw.platform-db.svc:5432/mctl-lifecycle?sslmode=require"
            # Traefik pod IPs (namespace traefik). X-Forwarded-For is trusted
            # for audit client IP only from these peers (SOC F20). Update if
            # Traefik replicas roll to new IPs.
            TRUSTED_PROXY_CIDRS: "10.42.4.181/32,10.42.6.242/32,10.42.5.93/32"
            # Dev-workflow control plane (phase 4): backs mctl_trigger_issue's
            # use_temporal path and POST /api/v1/agents/dev-loop/*. Optional —
            # cmd/api/main.go gates Temporal client init on this being set, so
            # an unset/unreachable value degrades those specific endpoints to
            # 503 rather than failing startup (same pattern as AUDIT_DB_URL
            # above for the other optional stores).
            TEMPORAL_ADDRESS: temporal-frontend.temporal.svc.cluster.local:7233
            TEMPORAL_NAMESPACE: mctl-agents
            # GitHub pull request events (mctlhq/mctl-api#323, 4.49.0+). The
            # webhook enqueues into the audit database's outbox and a relay
            # XADDs to mctl:events:github; GITHUB_WEBHOOK_SECRET and
            # EVENTS_VALKEY_PASSWORD come from the mctl-api-events Secret
            # (envFromExtraSecret below). Without both the endpoint answers
            # 401/503 and nothing is published.
            EVENTS_VALKEY_URL: "redis://github-producer@valkey.platform-events.svc.cluster.local:6379/0"
            # ARGO_WEBHOOK_SECRET is not listed here; envFromSecret below
            # injects it from Vault platform/mctl-api/argo-webhook (SOC F13).

          # One secret, not two. GITOPS_REPO_TOKEN used to arrive through
          # `envFromExtraSecret: mctl-api-gitops-token`, a Secret applied by
          # hand in 2026-03 and created by nothing in this repository or in
          # Vault; it is described in mctl-api-secrets.yaml now.
          # mctlhq/mctl-gitops#1229, step 2 of 2.
          envFromSecret: mctl-api-secrets
          # Event producer credentials, in their own ExternalSecret so a
          # missing key cannot take DB_PASSWORD down with it
          # (mctl-api-secrets.yaml).
          envFromExtraSecret: mctl-api-events

          # The GitHub App installation token, mounted as a FILE. mctl-api
          # reads GITHUB_APP_TOKEN_FILE per use (internal/ghtoken), which is
          # what lets a token re-minted every 30 minutes be picked up without
          # a restart -- envFrom would capture it at container start and serve
          # an expired value within the hour.
          #
          # From here GITOPS_REPO_TOKEN and GITOPS_ACTIONS_TOKEN in
          # mctl-api-secrets become the fallback only: the file wins. They stay
          # for now so this change is reversible by deleting one line, and are
          # removed in a follow-up once the pod is observed running on the
          # file.
          #
          # What this token is, measured rather than assumed
          # (mctlhq/mctl-api#307): one repository (mctl-gitops), contents
          # read-only, actions write, rotating hourly. GitHub downgrades a
          # permission you name but does not remove one you do not, so it also
          # carries issues/pull_requests/workflows write on that one
          # repository -- a recorded trade, not an oversight.
          githubAppTokenSecret: mctl-api-github-app

          # The versioned usage price catalog (mctlhq/mctl-gitops#1409,
          # mctlhq/.github#50 owner decision 3), rendered by root-app from
          # bootstrap/files/usage-pricing/ as ConfigMap mctl-api-usage-pricing
          # (mctl-api-usage-pricing.yaml). The chart (mctl-api >= 4.55.0,
          # mctlhq/mctl-api#403) mounts it optional and sets
          # USAGE_PRICING_CATALOG to its catalog.json, so a missing or bad
          # catalog logs one ERROR and usage is still recorded without a
          # derived cost -- it never blocks the pod.
          usagePricingConfigMap: mctl-api-usage-pricing

          # MCTL_OIDC_PROVIDERS, the federation registry (mctlhq/mctl-api#434,
          # docs/federation.md there): ZITADEL as provider `zitadel`, audience
          # enforced. The zitadel-iac Job builds the value from the client id
          # ZITADEL generated (helm-charts/zitadel-iac/iac/mctl-api.tf) and
          # writes it into this Secret, which the second source below
          # pre-creates. The chart (mctl-api >= #440) reads it optionally, so
          # an empty Secret is the Dex-only configuration. Dex is unaffected:
          # with no entry named `dex`, the DEX_* shim above still applies.
          # Rollback: delete this line.
          oidcProvidersSecret: mctl-api-oidc-zitadel

          # ZITADEL_LINK_CLIENT_ID / ZITADEL_LINK_CLIENT_SECRET for the
          # identity-link browser flow (mctlhq/mctl-api#435, chart #447):
          # the confidential `mctl-api-link` client that zitadel-iac writes
          # into the same Secret (helm-charts/zitadel-iac/iac/mctl-api.tf).
          # The issuer comes from the `zitadel` entry above
          # (ZITADEL_LINK_PROVIDER defaults to it). Both refs are optional,
          # so a Secret without the keys leaves the flow off (503) and the
          # rest of mctl-api unaffected. Rollback: delete this line.
          zitadelLinkSecret: mctl-api-oidc-zitadel

          # OAUTH_ZITADEL_CLIENT_ID / OAUTH_ZITADEL_CLIENT_SECRET for the
          # ZITADEL upstream of /oauth/authorize (mctlhq/mctl-api#467, chart
          # #469): the confidential `mctl-api-oauth` client that zitadel-iac
          # writes into the same Secret (helm-charts/zitadel-iac/iac/
          # mctl-api.tf). This line alone changes no behaviour: OAUTH_UPSTREAM
          # is not set, so it is `github`, and in that mode mctl-api reads
          # neither variable. Both refs are optional, so a Secret without the
          # keys still starts the pod. Selecting the upstream is a separate
          # change (OAUTH_UPSTREAM: both, then zitadel, under env above), and
          # that one does need the keys: mctl-api refuses to start in those
          # modes without them. Rollback: delete this line.
          oauthZitadelSecret: mctl-api-oidc-zitadel
          {{- if .Values.usageWriter.enabled }}

          # The usage-writer token (mctlhq/.github#50), from the
          # mctl-api-usage-writer ExternalSecret. Gated with it on
          # usageWriter.enabled in bootstrap/values.yaml; the chart's
          # reference is optional, so a Secret that has not synced yet
          # leaves the principal disabled instead of failing the pod.
          usageWriterTokenSecret: mctl-api-usage-writer
          {{- end }}
          {{- if (default dict .Values.evidenceWriter).enabled }}

          # The evidence-writer token (mctlhq/mctl-agents#199), from the
          # mctl-api-evidence-writer ExternalSecret. Gated with it on
          # evidenceWriter.enabled in bootstrap/values.yaml; the chart's
          # reference is optional, so a Secret that has not synced yet leaves
          # the principal disabled instead of failing the pod.
          evidenceWriterTokenSecret: mctl-api-evidence-writer
          {{- end }}
          {{- if (default dict .Values.registryPublisher).enabled }}

          # The registry-publisher token (mctlhq/mctl-agents#470), from the
          # mctl-api-registry-publisher ExternalSecret. Gated with it on
          # registryPublisher.enabled in bootstrap/values.yaml; the chart's
          # reference is optional, so a Secret that has not synced yet leaves
          # the principal disabled instead of failing the pod.
          registryPublisherTokenSecret: mctl-api-registry-publisher
          {{- end }}
          {{- if (default dict .Values.surfaceTelegramToken).enabled }}

          # The surface:telegram bearer token (mctlhq/mctl-telegram#443), from
          # the mctl-api-surface-telegram ExternalSecret. Gated with it on
          # surfaceTelegramToken.enabled in bootstrap/values.yaml. Requires
          # the mctl-api chart (a different repo, helm/ dir) to carry an
          # optional surfaceTelegramTokenSecret value mirroring
          # usageWriterTokenSecret -- until that lands, Helm passes this
          # value and the chart simply ignores the unknown key.
          surfaceTelegramTokenSecret: mctl-api-surface-telegram
          {{- end }}
          {{- if (default dict .Values.surfacePortalToken).enabled }}

          # The surface:portal bearer token (mctlhq/mctl-portal#126), from the
          # mctl-api-surface-portal ExternalSecret. Needs the mctl-api chart's
          # optional surfacePortalTokenSecret (mctlhq/mctl-api#439); until it
          # lands the chart ignores the unknown key.
          surfacePortalTokenSecret: mctl-api-surface-portal
          {{- end }}

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # Steady-state is low, but 24h metrics on 2026-08-25 showed
              # CPU p95 ~207m with burst max ~728m and CFS throttling p95 ~53%.
              # Raised 500m -> 650m to reduce burst throttling without masking
              # pathological sustained CPU. Memory p95 was ~249Mi against the
              # old 256Mi limit, so raise it modestly as well.
              cpu: 650m
              memory: 320Mi

    # Manifests next to the chart that the mctl-api repo cannot carry,
    # because they belong to this platform rather than to the service: today
    # the Secret the zitadel-iac Job fills with MCTL_OIDC_PROVIDERS, and the
    # Role that lets it do so (mctlhq/mctl-api#434).
    - repoURL: https://github.com/mctlhq/mctl-gitops.git
      targetRevision: main
      path: platform-gitops/infra-components/mctl-platform/mctl-api

  ignoreDifferences:
    # Written by the zitadel-iac Job, not by Argo CD
    # (infra-components/mctl-platform/mctl-api/oidc-zitadel.yaml).
    - kind: Secret
      name: mctl-api-oidc-zitadel
      jsonPointers:
        - /data
    # ESO admission webhook injects defaults absent in git, plus legacy
    # last-applied-configuration annotations can pin stale apiVersion across
    # chart churn. Mirror the tenants ApplicationSet pattern.
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .metadata.annotations
        # Note: .metadata.managedFields must NOT be listed here — with
        # RespectIgnoreDifferences=true + ServerSideApply, ArgoCD injects the
        # live object's cached managedFields into the SSA apply payload, which
        # the apiserver rejects ("metadata.managedFields must be nil").
        - .spec.target.deletionPolicy
        # The six `.spec.data[].remoteRef.*` / `.spec.dataFrom[].extract.*` entries
        # that used to sit here were removed. A jq path that indexes INTO an array,
        # combined with RespectIgnoreDifferences + ServerSideApply, makes ArgoCD
        # merge the live array elements back into the apply payload — so spec.data
        # can never shrink. Dropping an entry then reports a successful sync and
        # stays OutOfSync forever (#789, upstream argo-cd#17694, fix due in ArgoCD
        # 3.6 — we run 3.3.8). They ignored ESO's own CRD defaults, which the
        # ExternalSecrets now state explicitly instead, so git matches live.
        #
        # This whole ExternalSecret rule is in fact inert for THIS Application: its
        # sources (the mctl-api repo's `helm/` chart and the oidc-zitadel
        # manifests) render no ExternalSecret. The
        # ExternalSecrets in this namespace live in the bootstrap chart and belong
        # to root-app. Kept rather than deleted so the rule stays uniform with the
        # apps that do own ExternalSecrets.
        - .status
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: mctl-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
