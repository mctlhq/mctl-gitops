# Admission-level backstop for the tenant NetworkPolicy carve-outs (#800).
#
# The base-service chart already refuses these shapes, but a chart guard only
# covers what the chart renders. Anything applied another way — a hand-written
# manifest committed to gitops, a direct API call with a tenant's token — walks
# straight past it. These policies enforce the same rules at the API server.
#
# Native ValidatingAdmissionPolicy rather than Kyverno: it is GA on this cluster
# (admissionregistration.k8s.io/v1, k8s 1.33) and adds no runtime component to
# operate, upgrade, or fail closed on.
---
# `workflows.argoproj.io/workflow` gates NetworkPolicy exceptions meant for pods
# Argo created — internet egress in every tenant namespace, Vault reachability.
# Argo's own controller stamps it on the pods it creates; nothing else legitimately
# sets it (verified: no long-lived workload in the cluster carries it).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-deny-forged-workflow-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rollouts"]
  matchConditions:
    # The workflow controller is the one actor that must be able to set this
    # label. Without the exemption every workflow pod would be rejected.
    - name: exclude-argo-workflow-controller
      expression: "request.userInfo.username != 'system:serviceaccount:argo-workflows:argo-workflows-workflow-controller'"
  validations:
    - expression: >-
        !(has(object.metadata.labels) &&
          object.metadata.labels.exists(k, k.startsWith('workflows.argoproj.io/')))
      message: "workflows.argoproj.io/* labels are reserved for Argo-created pods; they gate NetworkPolicy exceptions"
      reason: Forbidden
    # Covers the pod template of every controller kind above. Vacuously true for
    # bare Pods, which have no spec.template.
    - expression: >-
        !(has(object.spec) && has(object.spec.template) &&
          has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) &&
          object.spec.template.metadata.labels.exists(k, k.startsWith('workflows.argoproj.io/')))
      message: "workflows.argoproj.io/* labels in a pod template are reserved for Argo-created pods"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-deny-forged-workflow-labels
spec:
  policyName: mctl-deny-forged-workflow-labels
  validationActions: [Deny]
  matchResources:
    # Cluster-wide on purpose. Scoping to tenant namespaces would leave the
    # label forgeable in platform namespaces, and nothing there needs to set it
    # either — the controller is exempted by identity, not by namespace.
    namespaceSelector: {}
---
# NetworkPolicies are additive: one permissive egress rule inside a tenant's own
# namespace undoes the platform restrictions — internet egress, node exclusions —
# without touching anything else. So tenant namespaces get an allowlist of the
# policy names the platform itself renders there, and nothing else.
#
# Adding a platform-owned policy to a tenant namespace means adding its name
# here too. That is deliberate friction: it is the only thing standing between a
# tenant-authored policy and the isolation model.
#
# Platform-owned entries beyond the tenant chart's own set, each applied by
# root-app from bootstrap/templates/mctl-platform/:
#   allow-monitoring-to-mctl-agent               admins, mctl-agent.yaml
#   allow-mctl-agent-to-mctl-telegram-bot-start  labs, mctl-telegram-bot-start-netpol.yaml
#   allow-ingress-from-mctl-api-to-deployer      erpact, erpact/networkpolicy.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-tenant-networkpolicy-allowlist
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
  validations:
    - expression: >-
        object.metadata.name in [
          'default-deny-all',
          'allow-intra-namespace',
          'allow-cluster-egress',
          'allow-internet-egress',
          'allow-workflow-internet-egress',
          'allow-ingress-from-traefik',
          'allow-ingress-from-monitoring',
          'allow-mctl-services-internet-egress',
          'allow-monitoring-to-mctl-agent',
          'allow-mctl-agent-to-mctl-telegram-bot-start',
          'allow-ingress-from-mctl-api-to-deployer'
        ]
      message: "NetworkPolicies in tenant namespaces are limited to the platform-rendered set; policies are additive and a new one can relax the tenant's isolation"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-tenant-networkpolicy-allowlist
spec:
  policyName: mctl-tenant-networkpolicy-allowlist
  validationActions: [Deny]
  matchResources:
    # Tenant namespaces only. Platform namespaces legitimately grow new policies
    # (the four shared-namespace allowlists were added this way) and are not
    # writable by tenants.
    namespaceSelector:
      matchExpressions:
        - key: mctl.me/tenant
          operator: Exists
---
# CVE-2026-42876 (ESO 0.1.0–2.4.0, this cluster runs 0.10.7): an actor able to
# create an ExternalSecret can make the operator mint a Kubernetes Secret of type
# kubernetes.io/service-account-token naming any ServiceAccount. The API server
# then fills in a long-lived token for it, and ESO — not the actor — supplies the
# privilege. Classic confused deputy.
#
# The fix is ESO >= 2.4.1, which needs Kubernetes >= 1.34; this cluster is on
# 1.33 with a single control plane, so the upgrade is a separate project. This
# policy removes the reachable path in the meantime.
#
# Reachability here is not through the API — no tenant ServiceAccount can create
# ExternalSecrets (checked: argo-workflow-sa and default in every tenant
# namespace) — but through GitOps: base-service exposes targetTemplateType in
# extraExternalSecrets, and update-config writes a caller-supplied config_patch
# into exactly those values.
#
# Nothing legitimate needs this type: zero ExternalSecrets in the cluster render
# it, and the two templates that do set a type hardcode dockerconfigjson/Opaque.
# Mounting a token via a Pod's serviceAccountName remains the supported path.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-deny-sa-token-externalsecrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        # Every version this CRD serves today, plus v1 so the rule survives the
        # v1beta1 -> v1 migration that ESO 0.16/0.17 forces.
        apiVersions: ["v1alpha1", "v1beta1", "v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets", "clusterexternalsecrets"]
  validations:
    - expression: >-
        !(has(object.spec.target) && has(object.spec.target.template) &&
          has(object.spec.target.template.type) &&
          object.spec.target.template.type == 'kubernetes.io/service-account-token')
      message: "ExternalSecrets may not target a kubernetes.io/service-account-token Secret (CVE-2026-42876); mount tokens via a Pod's serviceAccountName instead"
      reason: Forbidden
    # ClusterExternalSecret nests the same shape one level deeper. Vacuously true
    # for a plain ExternalSecret, and vice versa.
    - expression: >-
        !(has(object.spec.externalSecretSpec) && has(object.spec.externalSecretSpec.target) &&
          has(object.spec.externalSecretSpec.target.template) &&
          has(object.spec.externalSecretSpec.target.template.type) &&
          object.spec.externalSecretSpec.target.template.type == 'kubernetes.io/service-account-token')
      message: "ClusterExternalSecrets may not target a kubernetes.io/service-account-token Secret (CVE-2026-42876)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-deny-sa-token-externalsecrets
spec:
  policyName: mctl-deny-sa-token-externalsecrets
  validationActions: [Deny]
  matchResources:
    # Cluster-wide: ESO's privilege is the same wherever the ExternalSecret sits,
    # so a platform namespace is no safer a place to do this than a tenant one.
    namespaceSelector: {}
---
# Platform hostnames belong to the namespace that serves them (#1503).
#
# Tenants pick their own ingress host under *.mctl.ai, and nothing reserved
# the platform's names: a tenant Ingress for auth.mctl.ai — the ZITADEL issuer
# that mctl-api is about to trust (mctl-api#434) — or api.mctl.ai would be
# accepted, and traefik would route that host, or part of it, to tenant code.
#
# The owner map is .Values.reservedPlatformHosts (bootstrap values.yaml): each
# reserved host and the namespaces allowed to serve it; unlisted hosts are
# unrestricted. Two policies, because the API server type-checks every
# expression against every matched kind's schema and Ingress and IngressRoute
# share no fields; both render the same map.
#
# Naming a host is not the only way to take its traffic. traefik orders
# routers by rule length, so a long enough rule WITHOUT a host constraint
# outranks `Host(auth.mctl.ai) && PathPrefix(/)` for the paths it covers. So
# the policies also refuse, in every namespace: Ingress rules without a host,
# spec.defaultBackend, wildcards over a platform domain, and IngressRoute
# matches that are not a plain conjunction of literal Host/HostSNI matchers
# (HostRegexp, negation, `||`, v2 multi-host syntax, HostSNI(`*`)). A
# wildcard is refused when it covers a platform apex or any reserved host
# owned by another namespace, so reserving a deeper name (x.id.mctl.ai) also
# reserves it against *.id.mctl.ai. No live object uses any of these. A platform route that genuinely needs one gets a
# reviewed exemption here, not a quiet carve-out.
#
# Cluster-wide bindings: a platform namespace is no more entitled to another
# component's host than a tenant is, and ownership is by namespace, so the
# platform itself needs no exemption.
#
# Proven both ways against a real API server at the cluster's version by
# scripts/test-reserved-hosts-policy.sh (fixtures in tests/fixtures/reserved-hosts).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-reserved-platform-hosts-ingress
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  variables:
    - name: owners
      # Rendered from .Values.reservedPlatformHosts (bootstrap values.yaml), the
      # one place the map lives; both reserved-host policies render it.
      expression: >-
        {
        {{- range $host, $owners := .Values.reservedPlatformHosts }}
          {{ $host | squote }}: [{{ range $i, $o := $owners }}{{ if $i }}, {{ end }}{{ $o | squote }}{{ end }}],
        {{- end }}
        }
    - name: platformDomains
      expression: "['mctl.ai', 'mctl.ru', 'mctl.me']"
    - name: ns
      expression: "object.metadata.namespace"
  validations:
    - expression: "!has(object.spec.defaultBackend)"
      message: "spec.defaultBackend serves every host traefik has no other rule for, including platform hosts; give each rule an explicit host"
      reason: Forbidden
    - expression: >-
        !has(object.spec.rules) || object.spec.rules.all(r, has(r.host) && r.host != '')
      message: "every Ingress rule needs a host: a host-less rule matches all hosts and can outrank a platform host's routes"
      reason: Forbidden
    # No case or trailing-dot normalisation here, unlike the IngressRoute
    # policy: the API server validates rule and TLS hosts as lowercase RFC 1123
    # names before admission runs (tests/fixtures/reserved-hosts/invalid/).
    - expression: >-
        !has(object.spec.rules) ||
        object.spec.rules.all(r, !has(r.host) ||
          ((!(r.host in variables.owners) || variables.ns in variables.owners[r.host]) &&
           !(r.host.startsWith('*.') && (r.host.substring(2) in variables.platformDomains || variables.owners.exists(k, k.endsWith('.' + r.host.substring(2)) && !(variables.ns in variables.owners[k]))))))
      messageExpression: >-
        'Ingress host reserved for the platform and owned by another namespace (mctl-reserved-platform-hosts): ' +
        object.spec.rules.filter(r, has(r.host) &&
          ((r.host in variables.owners && !(variables.ns in variables.owners[r.host])) ||
           (r.host.startsWith('*.') && (r.host.substring(2) in variables.platformDomains || variables.owners.exists(k, k.endsWith('.' + r.host.substring(2)) && !(variables.ns in variables.owners[k])))))).map(r, r.host).join(', ')
      reason: Forbidden
    - expression: >-
        !has(object.spec.tls) ||
        object.spec.tls.all(t, !has(t.hosts) || t.hosts.all(h,
          (!(h in variables.owners) || variables.ns in variables.owners[h]) &&
          !(h.startsWith('*.') && (h.substring(2) in variables.platformDomains || variables.owners.exists(k, k.endsWith('.' + h.substring(2)) && !(variables.ns in variables.owners[k]))))))
      message: "Ingress spec.tls lists a host reserved for the platform and owned by another namespace; a tenant certificate must not be offered for it"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-reserved-platform-hosts-ingress
spec:
  policyName: mctl-reserved-platform-hosts-ingress
  validationActions: [Deny]
  matchResources:
    namespaceSelector: {}
---
# The traefik CRD half of the policy above; see its comment.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-reserved-platform-hosts-ingressroute
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["traefik.io"]
        # Every version: matchConstraints match the request version, so a
        # pinned list would stop applying the day traefik serves a second one.
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingressroutes", "ingressroutetcps"]
  variables:
    - name: owners
      # Rendered from .Values.reservedPlatformHosts (bootstrap values.yaml), the
      # one place the map lives; both reserved-host policies render it.
      expression: >-
        {
        {{- range $host, $owners := .Values.reservedPlatformHosts }}
          {{ $host | squote }}: [{{ range $i, $o := $owners }}{{ if $i }}, {{ end }}{{ $o | squote }}{{ end }}],
        {{- end }}
        }
    - name: platformDomains
      expression: "['mctl.ai', 'mctl.ru', 'mctl.me']"
    - name: ns
      expression: "object.metadata.namespace"
    # A literal Host(`x`) / HostSNI(`x`) matcher at the top level of the
    # conjunction: at the start of the rule, after `&&` or after `(`. Without
    # the anchor a decoy `Host(` inside another matcher's argument counts as a
    # host constraint the router does not have. Double quotes are refused
    # outright (below), so only backtick arguments, which cannot nest, remain.
    - name: literalHost
      expression: "'(^|&&|\\\\()\\\\s*Host(SNI)?\\\\(\\\\s*`[^`]*`\\\\s*\\\\)'"
    # What a literal host must look like once normalised: a DNS name, or a
    # wildcard over one. A decoy literal always captures matcher syntax.
    - name: dnsName
      expression: "'^(\\\\*\\\\.)?([a-z0-9]([-a-z0-9]*[a-z0-9])?\\\\.)*[a-z0-9]([-a-z0-9]*[a-z0-9])?$'"
  validations:
    # Only plain conjunctions: `||` and `!` let a route match hosts it never
    # names. Double-quoted arguments can hide a decoy Host(`...`) inside them,
    # so arguments must use backticks.
    - expression: >-
        object.spec.routes.all(r, !r.match.contains('||') && !r.match.contains('!') && !r.match.contains('"'))
      message: "IngressRoute match must be a plain && conjunction with backtick arguments: `||`, `!` and double-quoted arguments let a route match hosts it does not name; split it into separate routes"
      reason: Forbidden
    # Every Host-family matcher must be one literal Host/HostSNI, and there must
    # be at least one: HostRegexp, HostSNIRegexp, HostHeader and the v2
    # multi-argument Host(`a`, `b`) all fail the count comparison.
    - expression: >-
        object.spec.routes.all(r,
          size(r.match.findAll(variables.literalHost)) >= 1 &&
          size(r.match.findAll(variables.literalHost)) == size(r.match.findAll('Host[A-Za-z]*\\s*\\(')))
      message: "every IngressRoute route needs at least one literal Host(`...`) or HostSNI(`...`) and no HostRegexp/HostSNIRegexp/HostHeader or multi-host matcher: anything else can match platform hosts"
      reason: Forbidden
    # traefik matches hosts case-insensitively and ignores a trailing dot, so
    # both are normalised before the lookup.
    - expression: >-
        object.spec.routes.all(r, r.match.findAll(variables.literalHost)
          .map(x, x.split('`')[1].trim().lowerAscii())
          .map(h, h.endsWith('.') ? h.substring(0, size(h) - 1) : h)
          .all(h,
            h.matches(variables.dnsName) &&
            (!(h in variables.owners) || variables.ns in variables.owners[h]) &&
            !(h.startsWith('*.') && (h.substring(2) in variables.platformDomains || variables.owners.exists(k, k.endsWith('.' + h.substring(2)) && !(variables.ns in variables.owners[k]))))))
      message: "IngressRoute names a host reserved for the platform and owned by another namespace (mctl-reserved-platform-hosts), a literal that is not a DNS name, or HostSNI(`*`)"
      reason: Forbidden
    - expression: >-
        !has(object.spec.tls) || !has(object.spec.tls.domains) ||
        object.spec.tls.domains.all(d,
          ((has(d.main) ? [d.main] : []) + (has(d.sans) ? d.sans : []))
            .map(x, x.trim().lowerAscii())
            .map(x, x.endsWith('.') ? x.substring(0, size(x) - 1) : x).all(h,
            (!(h.lowerAscii() in variables.owners) || variables.ns in variables.owners[h.lowerAscii()]) &&
            !(h.startsWith('*.') && (h.substring(2).lowerAscii() in variables.platformDomains || variables.owners.exists(k, k.endsWith('.' + h.substring(2).lowerAscii()) && !(variables.ns in variables.owners[k]))))))
      message: "IngressRoute spec.tls.domains lists a host reserved for the platform and owned by another namespace"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-reserved-platform-hosts-ingressroute
spec:
  policyName: mctl-reserved-platform-hosts-ingressroute
  validationActions: [Deny]
  matchResources:
    namespaceSelector: {}
---
# Pods in a namespace whose manifests the platform does not review may only
# use the Secrets and ServiceAccounts that namespace was given (values.yaml
# externalManifestNamespaces explains why). Ephemeral containers are checked
# too: kubectl debug goes through pods/ephemeralcontainers.
#
# Pods only: a Deployment or Job naming a forbidden Secret is admitted and
# syncs, and the refusal shows in its ReplicaSet/Job events. The policy also
# relies on the namespace's AppProject keeping RBAC and Secrets out of the
# external repository (project erpact, added by #1516): it pins Pods to a
# ServiceAccount, and that ServiceAccount must stay without Secret access.
# Every volume source that can name a Secret is listed, in-tree plugins
# whose drivers are gone included: the API still accepts their fields.
#
# Proven both ways against a real API server by
# scripts/test-secret-allowlist-policy.sh (fixtures in
# tests/fixtures/secret-allowlist).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-external-manifests-secret-allowlist
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    # The binding matches only these namespaces, so the lookup cannot miss.
    # One map per field, each value dyn(): CEL refuses map literals whose
    # values differ in type. The 'none.invalid' entry (no namespace can
    # have that name) keeps each literal non-empty, so it always
    # type-checks. A namespace entry missing a list allows nothing of that
    # kind and still gets the Forbidden messages below.
    - name: allowed
      expression: >-
        {
          'none.invalid': dyn([]),
        {{- range $n, $v := (.Values.externalManifestNamespaces | default dict) }}
          {{ $n | squote }}: dyn({{ if hasKey $v "secrets" }}{{ index $v "secrets" | toJson }}{{ else }}[]{{ end }}),
        {{- end }}
        }[request.namespace]
    - name: serviceAccounts
      expression: >-
        {
          'none.invalid': dyn([]),
        {{- range $n, $v := (.Values.externalManifestNamespaces | default dict) }}
          {{ $n | squote }}: dyn({{ if hasKey $v "serviceAccounts" }}{{ index $v "serviceAccounts" | toJson }}{{ else }}[]{{ end }}),
        {{- end }}
        }[request.namespace]
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: serviceAccount
      expression: "has(object.spec.serviceAccountName) ? object.spec.serviceAccountName : 'default'"
    # The offenders, computed once: each rule below denies when its list is
    # non-empty and names the list in its message.
    # Volumes naming a Secret outside the allowlist, by volume name.
    - name: badVolumes
      expression: >-
        !has(object.spec.volumes) ? [] : object.spec.volumes.filter(v, !(
          (!has(v.secret) || (has(v.secret.secretName) && v.secret.secretName in variables.allowed)) &&
          (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s,
            !has(s.secret) || (has(s.secret.name) && s.secret.name in variables.allowed))) &&
          (!has(v.csi) || !has(v.csi.nodePublishSecretRef) ||
            (has(v.csi.nodePublishSecretRef.name) && v.csi.nodePublishSecretRef.name in variables.allowed)) &&
          (!has(v.iscsi) || !has(v.iscsi.secretRef) ||
            (has(v.iscsi.secretRef.name) && v.iscsi.secretRef.name in variables.allowed)) &&
          (!has(v.flexVolume) || !has(v.flexVolume.secretRef) ||
            (has(v.flexVolume.secretRef.name) && v.flexVolume.secretRef.name in variables.allowed)) &&
          (!has(v.azureFile) || v.azureFile.secretName in variables.allowed) &&
          (!has(v.cephfs) || !has(v.cephfs.secretRef) ||
            (has(v.cephfs.secretRef.name) && v.cephfs.secretRef.name in variables.allowed)) &&
          (!has(v.rbd) || !has(v.rbd.secretRef) ||
            (has(v.rbd.secretRef.name) && v.rbd.secretRef.name in variables.allowed)) &&
          (!has(v.scaleIO) || (has(v.scaleIO.secretRef.name) && v.scaleIO.secretRef.name in variables.allowed)) &&
          (!has(v.storageos) || !has(v.storageos.secretRef) ||
            (has(v.storageos.secretRef.name) && v.storageos.secretRef.name in variables.allowed)) &&
          (!has(v.cinder) || !has(v.cinder.secretRef) ||
            (has(v.cinder.secretRef.name) && v.cinder.secretRef.name in variables.allowed))
        )).map(v, v.name)
    # Containers (init and ephemeral included) whose env/envFrom names a
    # Secret outside the allowlist, by container name.
    - name: badEnvContainers
      expression: >-
        variables.containers.filter(c, !(
          (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            (has(e.valueFrom.secretKeyRef.name) && e.valueFrom.secretKeyRef.name in variables.allowed))) &&
          (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef) ||
            (has(e.secretRef.name) && e.secretRef.name in variables.allowed)))
        )).map(c, c.name)
    # Checked after the ServiceAccount admission plugin has copied the
    # ServiceAccount's imagePullSecrets into the Pod, so those count too.
    - name: badPullSecrets
      expression: >-
        !has(object.spec.imagePullSecrets) ? [] : object.spec.imagePullSecrets
          .filter(s, !(has(s.name) && s.name in variables.allowed))
          .map(s, has(s.name) ? s.name : '<unnamed>')
  validations:
    - expression: "variables.serviceAccount in variables.serviceAccounts"
      messageExpression: >-
        "serviceAccountName " + variables.serviceAccount + " is not allowed here; it must be one of: " +
        variables.serviceAccounts.join(", ") + " (bootstrap values externalManifestNamespaces)"
      reason: Forbidden
    - expression: "size(variables.badVolumes) == 0"
      messageExpression: >-
        "volume " + variables.badVolumes.join(", ") +
        " names a Secret outside this namespace's allowlist: " + variables.allowed.join(", ") +
        " (bootstrap values externalManifestNamespaces)"
      reason: Forbidden
    - expression: "size(variables.badEnvContainers) == 0"
      messageExpression: >-
        "container " + variables.badEnvContainers.join(", ") +
        " env/envFrom names a Secret outside this namespace's allowlist: " + variables.allowed.join(", ") +
        " (bootstrap values externalManifestNamespaces)"
      reason: Forbidden
    - expression: "size(variables.badPullSecrets) == 0"
      messageExpression: >-
        "imagePullSecret " + variables.badPullSecrets.join(", ") +
        " is outside this namespace's allowlist: " + variables.allowed.join(", ")
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-external-manifests-secret-allowlist
spec:
  policyName: mctl-external-manifests-secret-allowlist
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          # An empty map must not render `values: []`, which In refuses;
          # namespace names cannot contain dots, so "none.invalid" matches nothing.
          values: {{ keys (.Values.externalManifestNamespaces | default dict) | sortAlpha | default (list "none.invalid") | toJson }}
---
# Ingress hosts in those namespaces must match the namespace's hostPattern
# (values.yaml externalManifestNamespaces): the reserved-host policies above
# protect platform names, this keeps the repository off every other
# tenant's names too. A missing pattern allows no host.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-external-manifests-ingress-hosts
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  variables:
    # matches() is a search, so the anchors are added here rather than
    # trusted to the value; the value must therefore be one self-contained
    # RE2 expression. A missing pattern ('a^': nothing, not even the empty
    # string) matches no host.
    - name: pattern
      expression: >-
        '^(?:' + {
          'none.invalid': dyn('a^'),
        {{- range $n, $v := (.Values.externalManifestNamespaces | default dict) }}
          {{ $n | squote }}: dyn({{ if hasKey $v "hostPattern" }}{{ index $v "hostPattern" | toJson }}{{ else }}'a^'{{ end }}),
        {{- end }}
        }[request.namespace] + ')$'
    # Offending rule hosts and TLS hosts, for the messages.
    - name: badRuleHosts
      expression: >-
        !has(object.spec.rules) ? [] : object.spec.rules
          .filter(r, !(has(r.host) && r.host.matches(variables.pattern)))
          .map(r, has(r.host) ? r.host : '<rule without host>')
    - name: badTLSHosts
      expression: >-
        !has(object.spec.tls) ? [] : object.spec.tls
          .filter(t, !(has(t.hosts) && size(t.hosts) > 0 && t.hosts.all(h, h.matches(variables.pattern))))
          .map(t, has(t.hosts) && size(t.hosts) > 0 ? t.hosts.filter(h, !h.matches(variables.pattern)).join(", ") : '<entry without hosts>')
  validations:
    - expression: "!has(object.spec.defaultBackend)"
      message: "Ingress in this namespace may not set spec.defaultBackend: it catches every host no other rule claims"
      reason: Forbidden
    - expression: >-
        has(object.spec.rules) && size(object.spec.rules) > 0 && size(variables.badRuleHosts) == 0
      messageExpression: >-
        "every Ingress rule host in this namespace must match " + variables.pattern +
        (size(variables.badRuleHosts) > 0 ? "; offending rule hosts: " + variables.badRuleHosts.join(", ") : "; the Ingress has no rules") +
        " (bootstrap values externalManifestNamespaces)"
      reason: Forbidden
    - expression: "size(variables.badTLSHosts) == 0"
      messageExpression: >-
        "every Ingress TLS entry in this namespace must list hosts matching " + variables.pattern +
        "; offending TLS hosts: " + variables.badTLSHosts.join(", ")
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-external-manifests-ingress-hosts
spec:
  policyName: mctl-external-manifests-ingress-hosts
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ keys (.Values.externalManifestNamespaces | default dict) | sortAlpha | default (list "none.invalid") | toJson }}
---
# Services in those namespaces stay inside the cluster.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-external-manifests-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
    - expression: >-
        (!has(object.spec.type) || object.spec.type == 'ClusterIP') &&
        (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0)
      messageExpression: >-
        "Services in this namespace must be ClusterIP without externalIPs (no NodePort, LoadBalancer or ExternalName); " +
        (has(object.spec.type) && object.spec.type != 'ClusterIP'
          ? "got type " + object.spec.type
          : "got externalIPs " + object.spec.externalIPs.join(", "))
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-external-manifests-services
spec:
  policyName: mctl-external-manifests-services
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ keys (.Values.externalManifestNamespaces | default dict) | sortAlpha | default (list "none.invalid") | toJson }}
---
# Every Traefik kind is refused in those namespaces. Routes would reach the
# hosts the pattern above guards, around it; and a TLSOption or TLSStore
# named "default" in ANY namespace becomes Traefik's global default, which
# would drop the Cloudflare origin-pull client-certificate check or replace
# the origin certificate for every host. Project erpact (#1516) admits no
# traefik.io kind either; this keeps the containment from resting on that.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-external-manifests-no-traefik
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["traefik.io", "traefik.containo.us"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
  validations:
    - expression: "false"
      messageExpression: >-
        "Traefik objects are not allowed in this namespace (got " + request.kind.kind +
        "); use an Ingress whose hosts match its hostPattern"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-external-manifests-no-traefik
spec:
  policyName: mctl-external-manifests-no-traefik
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ keys (.Values.externalManifestNamespaces | default dict) | sortAlpha | default (list "none.invalid") | toJson }}
---
# ConfigMaps and Secrets in those namespaces may not carry a grafana_* label.
# The Grafana dashboards sidecar reads labelled ConfigMaps and Secrets from
# every namespace (observability/monitoring.yaml, searchNamespace: ALL; the
# sidecar's resource default is "both"), and the provisioner keys on uid: one
# such object could replace any platform dashboard or land in the
# ACL-restricted Internal folder. Platform dashboards all live in namespace
# monitoring. The name predates Secrets being covered; it stays so that the
# rename is not a delete-and-recreate window.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mctl-external-manifests-no-grafana-configmaps
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps", "secrets"]
  variables:
    - name: grafanaLabels
      expression: >-
        !has(object.metadata.labels) ? [] : object.metadata.labels.filter(k, k.startsWith('grafana_'))
  validations:
    - expression: "size(variables.grafanaLabels) == 0"
      messageExpression: >-
        request.kind.kind + "s in this namespace may not carry grafana_* labels (got " +
        variables.grafanaLabels.join(", ") + "): the Grafana sidecar reads them cluster-wide"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mctl-external-manifests-no-grafana-configmaps
spec:
  policyName: mctl-external-manifests-no-grafana-configmaps
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ keys (.Values.externalManifestNamespaces | default dict) | sortAlpha | default (list "none.invalid") | toJson }}
