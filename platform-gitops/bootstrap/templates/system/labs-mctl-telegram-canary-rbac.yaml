# ServiceAccount of the mctl-telegram canary. Its projected token, with the
# dedicated audience tg.mctl.ai/canary, is the canary's /mcp credential: the
# server admits exactly this subject as the canary account
# (MCP_K8S_SA_* in services/labs/mctl-telegram/values.yaml, mctl-telegram
# 0.138.1+, gitops#2610).
#
# It carries no RBAC. The Role and RoleBinding that let the canary patch its
# worker token into the Secret mctl-telegram-canary (mctl-telegram#421) were
# removed once the canary stopped using a minted token.
#
# WHY THIS LIVES IN BOOTSTRAP AND NOT IN THE SERVICE'S extraObjects
#
# The name is an authentication identity, so it stays platform-owned, next to
# labs-claude-remote-rbac.yaml, where update-config's tenant config_patch
# cannot reach it. (The original reason, that the "apps" AppProject admits no
# rbac.authorization.k8s.io kinds, no longer applies to a bare ServiceAccount.)
#
# Residual worth naming: anyone who can schedule a pod in `labs` can set
# serviceAccountName to this SA and mount a token for tg.mctl.ai/canary. That
# buys exactly the canary's identity: one account, read-only scopes fixed in
# server code, no send. The former worker token in the Secret granted the same.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: labs-mctl-telegram-canary
  namespace: labs
  labels:
    app.kubernetes.io/name: mctl-telegram
    app.kubernetes.io/part-of: mctl-platform
    mctl.me/component: canary
