# Read-only cluster diagnostics for labs/claude-remote (2026-07-08). The agent
# needed real cluster state to diagnose a tenant-onboarding workflow that
# reached the cluster (namespace/quota created) but never finished
# registering in the mctl control plane — the mctl MCP tools had nothing to
# show. kubectl in the image (mctl-claude-remote 0.10.0+) auto-detects
# in-cluster config from the ServiceAccount's mounted token; no kubeconfig.
# get/list/watch only — no create/update/patch/delete on anything.
# ClusterRole (not Role) because namespaces is cluster-scoped and the whole
# point is visibility into other tenants' namespaces during onboarding
# diagnosis, not just `labs`.
#
# pods/log added 2026-07-08: read-only pods/pods.list wasn't enough to
# diagnose a silent-fail loop (3 cycles: fail, label kept, nothing written) —
# without pods/log the agent can see a pod exists but not why it's failing.
# get only; pods/log doesn't support list/watch as a subresource.
#
# Lives here rather than in services/labs/claude-remote/values.yaml
# extraObjects: that service syncs under the "apps" AppProject, which sets
# clusterResourceWhitelist: [] (see bootstrap/templates/projects/project-apps.yaml)
# and would reject a ClusterRole/ClusterRoleBinding. The bootstrap chart
# (this file) runs under project: default (unrestricted), same pattern as
# mctl-api-rbac.yaml. The ServiceAccount itself is created by the
# base-service Helm chart (services/labs/claude-remote/values.yaml
# serviceAccount.create: true) — namespace-scoped, so it's fine under "apps".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: labs-claude-remote-readonly
rules:
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Workflows are NOT here: see the namespaced Role below.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: labs-claude-remote-readonly
subjects:
  - kind: ServiceAccount
    name: labs-claude-remote-base-service
    namespace: labs
roleRef:
  kind: ClusterRole
  name: labs-claude-remote-readonly
  apiGroup: rbac.authorization.k8s.io
---
# Workflow read is limited to namespace argo-workflows, where the flows this
# access exists for run: tenant create/delete (the onboarding diagnosis
# above) and the platform's own workflows. A Workflow object carries its
# arguments in plain text, and tenant namespaces run tenant deploy
# workflows whose arguments are the tenant's own business; cluster-wide
# workflow read made every tenant's arguments readable from labs. A tenant
# workflow's state is still visible through the mctl MCP tools
# (mctl_get_workflow_status, mctl_get_workflow_logs) and through pods and
# pods/log above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: labs-claude-remote-workflows-readonly
  namespace: argo-workflows
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: labs-claude-remote-workflows-readonly
  namespace: argo-workflows
subjects:
  - kind: ServiceAccount
    name: labs-claude-remote-base-service
    namespace: labs
roleRef:
  kind: Role
  name: labs-claude-remote-workflows-readonly
  apiGroup: rbac.authorization.k8s.io
