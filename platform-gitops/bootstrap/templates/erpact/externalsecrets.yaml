# Secrets of the ERPact copy (tenant erpact). They are declared here, not in
# git.mctl.ai/erpact/mctl-apps, because that repository is written outside the
# platform team: an ExternalSecret there could name ClusterSecretStore
# vault-backend, which reads all of secret/platform/*. These read only through
# the namespace's own tenant-store (Vault teams/erpact/*), and their names are
# exactly the namespace's Secret allowlist (values.yaml externalManifestNamespaces,
# enforced by mctl-external-manifests-secret-allowlist).
#
# Wave 1: after everything else in this chart, so a missing Vault key can only
# hold back the erpact Applications behind it, never the platform.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mariadb-root
  namespace: erpact
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: tenant-store
  target:
    name: mariadb-root
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MARIADB_ROOT_PASSWORD
      remoteRef:
        key: teams/erpact/mariadb
        property: MARIADB_ROOT_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
