# SCALED TO ZERO 2026-11-14. ERPact now runs on its own CLO cluster, whose
# ArgoCD reads git.mctl.ai/erpact/clo-apps, so Forgejo stays. This copy is kept
# but stopped: automated sync is off so ArgoCD does not restore the replicas,
# tenants/erpact/values.yaml caps pods at 0, every Deployment/StatefulSet was
# scaled to 0 and every CronJob suspended.
#
# DATA DELETED 2026-11-14: the PVCs erpact-mariadb and erpact-sites (reclaim
# policy Delete) were removed, so their Hetzner volumes are gone. The only
# copy is the R2 archive written by the erpact-backup CronJob: bucket
# erpact-backups, prefix erpact/<UTC timestamp>/, last run 20261114T034714Z
# (mariadb.sql.gz = mariadb-dump --all-databases incl. the mysql schema and
# site DB users; sites-shared-stteam.tar.gz and sites-control.tar.gz = the
# erpact-sites subPaths shared-stteam/ and control/ without logs/ and assets/;
# SHA256SUMS; COMPLETE). The restore-drill CronJob proved that run restores
# (all sites: DB present, core tables, DB user, encryption_key). Retention
# keeps 14 runs but only runs inside the suspended backup job, so nothing
# prunes the archive while this copy is stopped. The R2 credentials stay in
# the Secret erpact-backup-r2, the MariaDB root password in mariadb-root.
#
# To bring it back:
# 1. Restore the pods quota in tenants/erpact/values.yaml and the automated
#    block below (prune, selfHeal) on each Application. Merge.
# 2. Sync erpact-infra only. It recreates the two PVCs empty and starts
#    MariaDB with a fresh datadir. Keep erpact-shared/erpact-control (the
#    benches) and the CronJobs stopped until step 4, so nothing writes into
#    the empty volumes and the backup does not prune good runs.
# 3. Run a one-off pod in namespace erpact with erpact-sites mounted and
#    envFrom erpact-backup-r2 (fetch.sh in the ConfigMap erpact-restore-drill
#    shows the download and sha256sum -c). Then:
#    zcat mariadb.sql.gz | mariadb -h mariadb -u root   (root password from
#    mariadb-root); extract sites-shared-stteam.tar.gz into the volume's
#    shared-stteam/ and sites-control.tar.gz into control/.
# 4. Sync erpact-shared, erpact-control and erpact-deployer, unsuspend the
#    CronJobs, run the restore drill once and check each site answers.
#    Assets are rebuilt by the bench image; logs/ is not restored.
# Anything written to the mctl copy after the last backup run is lost.
#
# Applications of the ERPact copy (tenant erpact). Their manifests live in
# the private Forgejo repository git.mctl.ai/erpact/mctl-apps (see
# projects/project-erpact.yaml for why and for what they may create).
#
# Automated sync with prune: the site deployer adds a site by pushing to
# mctl-apps, and the next poll (about 3 minutes) applies it. The tenant's
# ArgoCD role sees and syncs them through its erpact/* grant
# (rbac/tenants/erpact.csv, derived from projects/project-erpact.yaml).
#
# No sync wave: everything erpact sits in wave 0, the last wave of this
# chart, so nothing waits on its health. Positive waves deadlocked root-app
# (2026-10-03): root-app manages itself in wave 0, and its own health stays
# Missing until resources in later waves exist, so it waited on itself
# before ever reaching them. An unreachable erpact repository still holds
# back nothing of the platform, since no wave follows wave 0.
#
# retry.limit -1 (unlimited; backoff caps a retry at one per 5 minutes): once a
# finite limit is spent, ArgoCD never auto-syncs that revision again
# (alreadyAttemptedSync), so a sync blocked by something fixed elsewhere stayed
# Failed until someone pressed Sync. That happened on 2026-10-14: the first
# erpact.online site was denied by the Ingress host policy until #1890, after
# all five retries. The deployer pushes a site and expects it to come up
# unattended, so the Applications keep retrying until the obstacle is gone.
---
# PVC erpact-data, MariaDB, Valkey: everything the two benches attach to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpact-infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: erpact
  source:
    repoURL: https://git.mctl.ai/erpact/mctl-apps.git
    targetRevision: main
    path: infra
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: erpact
  syncPolicy:
    # automated removed 2026-11-14: scaled to zero (see the header).
    syncOptions:
      - ApplyOutOfSyncOnly=true
    # The first sync races the ExternalSecrets, the volume and MariaDB.
    # Retry without limit (see the header).
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
# The shared Frappe v14 bench serving every customer site, plus the restore Job.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpact-shared
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: erpact
  source:
    repoURL: https://git.mctl.ai/erpact/mctl-apps.git
    targetRevision: main
    path: shared-stteam
    helm:
      # values.yaml is regenerated by the site deployer on every new site;
      # the list of sites to restore lives apart so it survives that.
      valueFiles:
        - values.yaml
        - values-restore.yaml
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: erpact
  syncPolicy:
    # automated removed 2026-11-14: scaled to zero (see the header).
    syncOptions:
      - ApplyOutOfSyncOnly=true
    # The first sync races the ExternalSecrets, the volume and MariaDB.
    # Retry without limit (see the header).
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
# The Frappe v15 control site (subscriptions, calls the deployer).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpact-control
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: erpact
  source:
    repoURL: https://git.mctl.ai/erpact/mctl-apps.git
    targetRevision: main
    path: control
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: erpact
  syncPolicy:
    # automated removed 2026-11-14: scaled to zero (see the header).
    syncOptions:
      - ApplyOutOfSyncOnly=true
    # The first sync races the ExternalSecrets, the volume and MariaDB.
    # Retry without limit (see the header).
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
# The site deployer: commits new sites to mctl-apps, which this Application set then syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpact-deployer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: erpact
  source:
    repoURL: https://git.mctl.ai/erpact/mctl-apps.git
    targetRevision: main
    path: helm-deployer
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: erpact
  syncPolicy:
    # automated removed 2026-11-14: scaled to zero (see the header).
    syncOptions:
      - ApplyOutOfSyncOnly=true
    # The first sync races the ExternalSecrets, the volume and MariaDB.
    # Retry without limit (see the header).
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
