# Applications of the ERPact copy (tenant erpact). Their manifests live in
# the private Forgejo repository git.mctl.ai/erpact/mctl-apps (see
# projects/project-erpact.yaml for why and for what they may create).
#
# Automated sync with prune: the site deployer adds a site by pushing to
# mctl-apps, and the next poll (about 3 minutes) applies it. Names start with
# erpact- so the tenant's ArgoCD role (rbac/tenants/erpact.csv) can see them
# once that role is extended to project erpact.
---
# PVC erpact-data, MariaDB, Valkey: everything the two benches attach to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpact-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: erpact
  source:
    repoURL: https://git.mctl.ai/erpact/mctl-apps.git
    targetRevision: main
    path: infra
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: erpact
  ignoreDifferences:
    # Same ESO handling as data/forgejo.yaml: no jq paths into spec arrays (#789).
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .metadata.annotations
        - .spec.target.deletionPolicy
        - .status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    # The benches wait for MariaDB and Valkey, and the first sync races them.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
# The shared Frappe v14 bench serving every customer site, plus the restore Job.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpact-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: erpact
  source:
    repoURL: https://git.mctl.ai/erpact/mctl-apps.git
    targetRevision: main
    path: shared-stteam
    helm:
      # values.yaml is regenerated by the site deployer on every new site;
      # the list of sites to restore lives apart so it survives that.
      valueFiles:
        - values.yaml
        - values-restore.yaml
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: erpact
  ignoreDifferences:
    # Same ESO handling as data/forgejo.yaml: no jq paths into spec arrays (#789).
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .metadata.annotations
        - .spec.target.deletionPolicy
        - .status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    # The benches wait for MariaDB and Valkey, and the first sync races them.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
