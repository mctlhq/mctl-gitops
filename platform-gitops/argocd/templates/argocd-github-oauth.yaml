apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  # Historical name: this used to carry MCTL App's client id/secret for an
  # ArgoCD dex GitHub connector. That connector is gone (it lived only in the
  # one-shot Terraform bootstrap values and could never resolve these keys —
  # they are written by this chart, which in the same sync replaces the dex
  # config with the Backstage OIDC connector). No GitHub credentials here any
  # more. The name is kept because renaming an ExternalSecret means deleting
  # and recreating it, and this one merges into argocd-secret.
  name: argocd-github-oauth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # sync before ArgoCD apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argocd-secret
    creationPolicy: Merge  # merge with existing secret, don't overwrite
  # conversionStrategy / decodingStrategy / metadataPolicy are ESO's own
  # defaults and would normally be omitted. They are written out explicitly
  # because the alternative — letting ESO default them and ignoring the drift
  # via `.spec.data[].remoteRef.*` in argocd-self-managed's ignoreDifferences —
  # is what wedged this Application: a jq path indexing into an array, plus
  # RespectIgnoreDifferences + ServerSideApply, makes ArgoCD merge live array
  # elements back into the apply payload, so spec.data can never shrink
  # (#789, upstream argo-cd#17694). Stating the defaults here lets that ignore
  # rule go away. Keep them in sync if ESO ever changes its defaults — a
  # mismatch shows up immediately as OutOfSync rather than silently.
  data:
    - secretKey: argo-workflows-sso-client-secret
      remoteRef:
        key: platform/argo-workflows/sso
        property: client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: backstage-oidc-client-id
      remoteRef:
        key: platform/backstage/github-oauth
        property: client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: backstage-oidc-client-secret
      remoteRef:
        key: platform/backstage/github-oauth
        property: client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Shared secret for the GitHub push webhook on mctlhq/mctl-gitops →
    # https://ops.mctl.ai/api/webhook. Argo CD reads exactly this key from
    # argocd-secret (util/settings: webhook.github.secret). Until it is set
    # the endpoint accepts unsigned POSTs; once set, unsigned deliveries are
    # rejected with 400. The same value goes into the webhook's "Secret"
    # field on GitHub. See #970.
    - secretKey: webhook.github.secret
      remoteRef:
        key: platform/argocd/github-webhook
        property: secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
