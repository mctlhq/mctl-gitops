# Dex, run by this chart instead of the argo-cd subchart (#1500).
#
# The subchart's Dex is started by `argocd-dex rundex`, which builds Dex's
# config from argocd-cm and sets its issuer to whatever Argo CD itself signs
# in with. Once Argo CD signs in through ZITADEL (oidc.config), that issuer
# would become https://auth.mctl.ai, Dex would stop answering under /api/dex,
# and every other Dex client (Argo Workflows, Grafana, mctl-api) would lose
# its sign-in. Run as plain `dex serve`, Dex keeps issuer
# https://ops.mctl.ai/api/dex no matter how Argo CD signs in.
#
# New names (Deployment, Service and ServiceAccount `dex`), not the
# subchart's argocd-dex-server: replacing those in place fails server-side
# apply, because the bootstrap Helm release co-owns their fields. argocd-server
# proxies /api/dex here (server.dex.server in values.yaml) over plain HTTP.
#
# argocd-cm keeps its full dex.config: argocd-server renders it on every
# settings load and exits on a connector without `config`. The copy there is
# read by argocd-server only; Dex reads dex-config.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
spec:
  replicas: 1
  # Auth codes and sessions live in this pod's memory: two pods behind the
  # Service during a rolling update would split a login between stores.
  # A few seconds of no Dex is the more honest failure.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: argocd
        app.kubernetes.io/component: dex-server
      # Only the config is checksummed. Unlike `rundex`, which watched
      # argocd-secret, plain Dex reads its secrets once at start: after a
      # rotation of server.secretkey, backstage-oidc-client-* or
      # argo-workflows-sso-client-secret, run
      # `kubectl -n argocd rollout restart deploy/dex`.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dex-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: dex
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          command: ["/bin/sh", "-c"]
          # argocd-server authenticates to Dex as `argo-cd` with
          # base64url(sha256(server.secretkey))[:40] (DexOAuth2ClientSecret
          # in argo-cd util/settings). The key itself does not stay in the
          # environment Dex runs with.
          args:
            - |
              set -eu
              # Known answer first: the hex-to-byte decode below must
              # reproduce Go's base64url(sha256(""))[:40] in this image, or
              # a wrong but well-formed secret would pass the length check.
              probe="$(printf %s "" | sha256sum | cut -d' ' -f1 | sed 's/\(..\)/\\x\1/g')"
              probe="$(printf '%b' "$probe" | base64 | tr '+/' '-_' | cut -c1-40)"
              if [ "$probe" != "47DEQpj8HBSa-_TImW-5JCeuQeRkm5NMpJWZG3hS" ]; then
                echo "hex-to-byte decoding in this image does not match Go" >&2
                exit 1
              fi
              digest="$(printf %s "$ARGOCD_SERVER_SECRETKEY" | sha256sum | cut -d' ' -f1 | sed 's/\(..\)/\\x\1/g')"
              ARGOCD_DEX_CLIENT_SECRET="$(printf '%b' "$digest" | base64 | tr '+/' '-_' | cut -c1-40)"
              # Fail closed: a broken pipeline must not start Dex with an
              # empty secret for this client.
              if [ "${#ARGOCD_DEX_CLIENT_SECRET}" -ne 40 ]; then
                echo "could not derive the argo-cd client secret" >&2
                exit 1
              fi
              export ARGOCD_DEX_CLIENT_SECRET
              unset ARGOCD_SERVER_SECRETKEY
              exec dex serve /etc/dex/config.yaml
          env:
            - name: ARGOCD_SERVER_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: server.secretkey
            # Written into argocd-secret by ExternalSecret argocd-github-oauth.
            - name: BACKSTAGE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: backstage-oidc-client-id
            - name: BACKSTAGE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: backstage-oidc-client-secret
            - name: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: argo-workflows-sso-client-secret
          ports:
            - name: http
              containerPort: 5556
              protocol: TCP
            - name: metrics
              containerPort: 5558
              protocol: TCP
          # Auto-restart when the upstream OIDC provider was unavailable at
          # start: without probes Dex stays Running but broken.
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: argocd-dex-config
        - name: tmp
          emptyDir: {}
---
# SOC F11, as for argocd-server and argocd-repo-server in values.yaml: no
# voluntary eviction of the singleton every Dex login depends on.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
