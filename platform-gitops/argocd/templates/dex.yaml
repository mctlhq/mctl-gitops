# Dex, run by this chart instead of the argo-cd subchart (#1500).
#
# The subchart's Dex is started by `argocd-dex rundex`, which builds Dex's
# config from argocd-cm and sets its issuer to whatever Argo CD itself signs
# in with. Once Argo CD signs in through ZITADEL (oidc.config), that issuer
# would become https://auth.mctl.ai, Dex would stop answering under /api/dex,
# and every other Dex client (Argo Workflows, Grafana, mctl-api) would lose
# its sign-in. Run as plain `dex serve`, Dex keeps issuer
# https://ops.mctl.ai/api/dex no matter how Argo CD signs in.
#
# Same name, selector, Service and port as the subchart's Dex, so argocd-server
# keeps proxying /api/dex to it and the Deployment is replaced in place.
# argocd-server reaches it over plain HTTP (server.dex.server* in values.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-dex-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
automountServiceAccountToken: false
---
# The subchart's Role let `rundex` read argocd-cm and argocd-secret through
# the API. Plain Dex needs no API access, and the chart's Application does
# not prune, so the Role is kept by name with no rules rather than left
# behind with them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-dex-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
rules: []
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-dex-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
spec:
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-dex-server
  ports:
    - name: http
      port: 5556
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
spec:
  replicas: 1
  selector:
    # Immutable, and identical to the subchart's, so this is an in-place
    # rollout of the same Deployment.
    matchLabels:
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/name: argocd-dex-server
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: argocd
        app.kubernetes.io/name: argocd-dex-server
        app.kubernetes.io/part-of: argocd
        app.kubernetes.io/component: dex-server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dex-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: argocd-dex-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex-server
          image: ghcr.io/dexidp/dex:v2.45.1
          command: ["/bin/sh", "-c"]
          # argocd-server authenticates to Dex as `argo-cd` with
          # base64url(sha256(server.secretkey))[:40] (DexOAuth2ClientSecret
          # in argo-cd util/settings). The key itself does not stay in the
          # environment Dex runs with.
          args:
            - |
              set -eu
              digest="$(printf %s "$ARGOCD_SERVER_SECRETKEY" | sha256sum | cut -d' ' -f1 | sed 's/\(..\)/\\x\1/g')"
              ARGOCD_DEX_CLIENT_SECRET="$(printf '%b' "$digest" | base64 | tr '+/' '-_' | cut -c1-40)"
              # Fail closed: a broken pipeline must not start Dex with an
              # empty secret for this client.
              if [ "${#ARGOCD_DEX_CLIENT_SECRET}" -ne 40 ]; then
                echo "could not derive the argo-cd client secret" >&2
                exit 1
              fi
              export ARGOCD_DEX_CLIENT_SECRET
              unset ARGOCD_SERVER_SECRETKEY
              exec dex serve /etc/dex/config.yaml
          env:
            - name: ARGOCD_SERVER_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: server.secretkey
            # Written into argocd-secret by ExternalSecret argocd-github-oauth.
            - name: BACKSTAGE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: backstage-oidc-client-id
            - name: BACKSTAGE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: backstage-oidc-client-secret
            - name: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: argo-workflows-sso-client-secret
          ports:
            - name: http
              containerPort: 5556
              protocol: TCP
            - name: metrics
              containerPort: 5558
              protocol: TCP
          # Auto-restart when the upstream OIDC provider was unavailable at
          # start: without probes Dex stays Running but broken.
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: argocd-dex-config
        - name: tmp
          emptyDir: {}
