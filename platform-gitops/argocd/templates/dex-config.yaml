# Dex's own configuration; see dex.yaml for why Dex runs from this chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-dex-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: dex-server
data:
  # No secret values: $VARS are expanded by Dex from the container's
  # environment (connector config), staticClients name theirs in secretEnv.
  config.yaml: |
    issuer: {{ index .Values "argo-cd" "configs" "cm" "url" }}/api/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    logger:
      level: info
      format: json
    oauth2:
      skipApprovalScreen: true
    connectors:
      # Backstage's OIDC provider; it signs people in with GitHub and
      # issues their tenant groups.
      - type: oidc
        id: backstage
        name: mctl.ai
        config:
          issuer: https://app.mctl.ai/api/oidc-provider
          clientID: $BACKSTAGE_OIDC_CLIENT_ID
          clientSecret: $BACKSTAGE_OIDC_CLIENT_SECRET
          redirectURI: {{ index .Values "argo-cd" "configs" "cm" "url" }}/api/dex/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          getUserInfo: true
          insecureEnableGroups: true
          userNameKey: preferred_username
          claimMapping:
            groups: groups
    staticClients:
      - id: argo-workflows
        name: Argo Workflows
        # Single entry on purpose: argo-workflows presents exactly one
        # redirect_uri (bootstrap/templates/core-infra/argo-workflows.yaml,
        # sso.redirectUrl).
        secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
        redirectURIs:
          - https://workflows.mctl.ai/oauth2/callback
      - id: mctl-api
        name: mctl-api
        secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
        redirectURIs:
          - https://api.mctl.ai/oauth2/callback
      - id: grafana
        name: Grafana
        secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
        redirectURIs:
          - https://grafana.mctl.ai/login/generic_oauth
