# ExecutionProfile for implementer (ADR 007). Preserves today's effective
# values: $20.00 budget and 2400s timeout are the production
# cwft-mctl-agents-implement.yaml overrides (IMPLEMENTER_BUDGET_USD /
# IMPLEMENTER_TIMEOUT_SECONDS), not the orchestrator/options.py Python
# defaults ($3 / 900s) -- see requirements.md's "Migration is
# behavior-preserving: effective deployed CWFT overrides win over Python
# defaults." This is the only one of the three initial profiles with
# repository.commit/pullRequestCreate: true, matching
# docs/agent-inventory.yaml's riskLevel: high / "the only agent that
# authors code" note (mctl-agents issue-226 design.md). merge stays false --
# the implementer opens PRs, it does not merge them.
apiVersion: agents.mctl.ai/v1alpha2
kind: ExecutionProfile
metadata:
  name: implementer-default
  owner: platform
spec:
  version: "1.0.0"
  modelPolicyRef:
    task: service_agent
    compatibility: ">=1.0.0 <2.0.0"
  skills: []
  tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash
    - WebSearch
    - WebFetch
    - "mcp__mctl__*"
  policyRef: production-code-author
  permissions:
    repository:
      read: true
      branchCreate: true
      commit: true
      pullRequestCreate: true
      merge: false
    kubernetes: none
    network: approved-providers-only
    mutationScopes:
      - proposal-status
      - target-repository-branch
      - pull-request-create
  budgetUsd: 20.00
  timeoutSeconds: 2400
  runtime:
    entrypoint: orchestrator.run_implementer:implement
    optionsBuilder: orchestrator.options:build_implementer_options
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-implement
      approved: true
  approval:
    requiredBefore:
      - code-authoring
  evidence:
    required:
      - proposal
      - diff
      - tests
      - pull-request
