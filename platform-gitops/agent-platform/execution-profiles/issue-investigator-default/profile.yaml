# ExecutionProfile for issue-investigator (ADR 007). Preserves today's
# effective values: $3.00 budget (cwft-mctl-agents-investigate.yaml
# ISSUE_INVESTIGATOR_BUDGET_USD) and the CWFT's 7200s activeDeadlineSeconds
# (no per-op ISSUE_INVESTIGATOR_TIMEOUT_SECONDS override exists today, so the
# pod-level deadline is the effective timeout).
#
# spec.tools omitted Write, Edit and Bash until 2026-09-02 and the profile
# called itself read-only-investigation. build_issue_investigator_options
# (mctl-agents orchestrator/options.py) grants all three, with
# permission_mode="acceptEdits" -- so this file was a security claim the
# platform did not enforce, sitting in the catalog meant to become
# authoritative (mctl-agents#277). Corrected to describe what actually runs.
#
# The agent legitimately needs to write: it produces the proposal triplet
# into a staging directory. Whether "can write" has to mean Write/Edit/Bash
# over the whole workspace is a real question and a separate one -- tracked
# as the narrowing issue linked from #277, alongside #261 (the agent runs as
# the orchestrator's own uid). This PR makes the catalog honest; it does not
# decide that.
#
# Still read-only against the TARGET REPOSITORY, and that part was and stays
# true: repository.commit/branchCreate/pullRequestCreate/merge are all false
# because the CWFT's own commit-and-push step does the writing, not the
# agent. The only mutation scopes are the proposal triplet and an issue
# comment -- neither requires a human approval gate.
apiVersion: agents.mctl.ai/v1alpha2
kind: ExecutionProfile
metadata:
  name: issue-investigator-default
  owner: platform
spec:
  version: "1.1.0"
  modelPolicyRef:
    # The task key config/model-policy.yaml in mctl-agents actually defines.
    # This said `issue_investigator` until 2026-09-03, which is not a task
    # that exists: run_issue_investigator.py resolves its model as
    # `INVESTIGATOR_MODEL = os.getenv("ISSUE_INVESTIGATOR_MODEL",
    # SERVICE_AGENT_MODEL)`, i.e. the `service_agent` task. resolve_model()
    # raises ModelPolicyError on an unknown key, so the resolver would have
    # failed closed the moment it read this file (mctl-agents#277 step 4).
    task: service_agent
    # Read directly by run_issue_investigator.py as
    #   INVESTIGATOR_MODEL = os.getenv("ISSUE_INVESTIGATOR_MODEL", SERVICE_AGENT_MODEL)
    # which means it OUTRANKS the task above: set it and nothing this profile
    # says about the model applies. The schema could not express this field
    # until now, so the catalog described a model selection that could be
    # overridden without it saying so. mctl-agents' validate_manifest.py
    # checks this name against a real os.getenv() call in the driver.
    legacyEnvOverride: ISSUE_INVESTIGATOR_MODEL
    compatibility: ">=1.0.0 <2.0.0"
  skills: []
  tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - WebSearch
    - WebFetch
    - Bash
    - "mcp__mctl__*"
  # Renamed from read-only-investigation: a profile granting Write, Edit and
  # Bash cannot carry a policy name asserting the opposite. The scope that IS
  # read-only -- the target repository -- is stated by permissions below,
  # where it is enforceable.
  policyRef: scoped-proposal-authoring
  permissions:
    repository:
      read: true
      branchCreate: false
      commit: false
      pullRequestCreate: false
      merge: false
    kubernetes: none
    network: approved-providers-only
    mutationScopes:
      - proposal-directory-write
      - issue-comment
  budgetUsd: 3.00
  timeoutSeconds: 7200
  runtime:
    entrypoint: orchestrator.run_issue_investigator:investigate
    optionsBuilder: orchestrator.options:build_issue_investigator_options
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-investigate
      approved: true
  approval:
    requiredBefore: []
  evidence:
    required:
      - proposal
