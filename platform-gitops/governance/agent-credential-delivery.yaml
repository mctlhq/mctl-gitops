# Credential delivery inventory for mctl-agents ClusterWorkflowTemplates
# (mctl-gitops#2288, spike mctlhq/mctl-agents#807 G2). Names only, never values.
# Checked by scripts/validate-agent-credential-delivery.py:
#   - every env[].valueFrom.secretKeyRef in an agent_image step must be listed;
#   - a `delivery: file` row must not have a secretKeyRef env seed, and must be
#     mounted read-only, mode <= 0440, only in that container, at mount_path.
# `delivery: file` does NOT mean the model shell cannot read the credential:
# the file sits in the same model-readable container (owned by
# mctlhq/mctl-agents#869). Only github-token is short-lived/rotatable.
# Remaining env-seed rows move in mctl-gitops#2296.
credentials:
- cwft: cwft-mctl-agents-implement.yaml
  template: run-implementer
  env: GITHUB_TOKEN
  secret: mctl-agents-secrets
  key: github-token
  agent_image: true
  model_driven: true
  classification: short-lived-rotatable
  delivery: file
  file_env: GITHUB_TOKEN_FILE
  mount_path: /var/run/gh
  reader: mctl-agents refresh_github_token(), present in agent_image >= 1.113.0 (mctlhq/mctl-agents#920)
  residual: File is readable by model Bash in the same container; isolation owned by mctlhq/mctl-agents#869. refresh_github_token() also exports the token to the orchestrator env.
- cwft: cwft-mctl-agents-implement.yaml
  template: run-implementer
  env: CLAUDE_CODE_OAUTH_TOKEN
  secret: mctl-agents-secrets
  key: '{{inputs.parameters.oauth-key}}'
  agent_image: true
  model_driven: true
  classification: file-capable-long-lived
  delivery: env-seed
  file_env: null
  mount_path: null
  reader: pending mctl-gitops#2296
  residual: Manual claude setup-token OAuth; no short-lived form; the CLI reads env. Moves in mctl-gitops#2296.
- cwft: cwft-mctl-agents-implement.yaml
  template: run-implementer
  env: MCTL_TOKEN
  secret: mctl-agents-secrets
  key: mctl-token
  agent_image: true
  model_driven: true
  classification: file-capable-long-lived
  delivery: env-seed
  file_env: null
  mount_path: null
  reader: pending mctl-gitops#2296
  residual: Static admin bearer; short-lived replacement is the run-token exchange (enforced on investigate only). Moves in mctl-gitops#2296.
