# SSO RBAC: team t7-rbac-check — scoped to team namespace only
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sso-team-t7-rbac-check
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/rbac-rule: "'t7-rbac-check' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "104"
---
apiVersion: v1
kind: Secret
metadata:
  name: sso-team-t7-rbac-check.service-account-token
  namespace: argo-workflows
  annotations:
    kubernetes.io/service-account.name: sso-team-t7-rbac-check
type: kubernetes.io/service-account-token
