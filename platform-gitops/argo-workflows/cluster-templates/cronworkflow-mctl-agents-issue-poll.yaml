apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: mctl-agents-issue-poll
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: |
      Every-5-minute trigger for the issue-driven entry-point poller.

      Workflow logic lives in ClusterWorkflowTemplate `mctl-agents-issue-poll`
      (cwft-mctl-agents-issue-poll.yaml). This CronWorkflow is a thin wrapper
      that submits a Workflow with no parameters, so the poller sweeps every
      open mctlhq issue labelled `agents:intake`.

      What it does each tick:
        1. `gh search issues` for open mctlhq issues labelled
           `agents:intake`.
        2. For each, runs the issue-investigator in-process — gh-clones the
           target repo read-only, runs the Claude Agent SDK to write the
           requirements/design/tasks proposal triplet + .status.yaml
           (status=proposed), comments the proposal link on the issue.
        3. Removes the `agents:intake` label so the next tick does not
           re-investigate (and re-spend the SDK budget) the same issue.
      The proposal stops at `proposed` — a human flips it to `accepted`,
      the Tier 2 implementer opens a PR, the Tier 3 shepherd merges.

      Start suspended. Un-suspend after the first successful one-shot run
      (verify a labelled test issue yields a proposal and the label is
      removed).

      DISPATCHER: this CronWorkflow no longer submits the poll template
      directly. It runs a volume-less pre-check first and only creates the
      real Workflow when there is genuinely something labelled. See the
      `spec.workflowSpec` comment for why.
spec:
  # `*/15 * * * *` — fires every 15 minutes (96 ticks/day). A tick with
  # nothing labelled is a cheap no-op (one `gh search` + exit). Was `*/5`;
  # dropped to `*/15` to cut contention on the shared
  # `mctl-gitops-main-writes` mutex — at `*/5` the poll competed with the
  # implement cron (`*/5`) and operator-triggered investigates, queuing
  # their commit-and-push behind no-op poll ticks. 15-min intake latency is
  # fine for an autonomous pipeline. Still occasionally overlaps
  # mctl-agents-shepherd (:30), mctl-agents-incidents (:15/:45), and
  # rotate-mctl-agent-github-token (:00); concurrencyPolicy: Forbid handles it.
  schedule: "*/15 * * * *"
  timezone: "UTC"
  # Forbid: never overlap two poll ticks. They contend on the same
  # `mctl-gitops-main-writes` mutex anyway, and a queued tick would only
  # delay the next genuine cron-driven one. Drop overlaps cleanly.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # Counts, NOT days. At 96 ticks/day (every 15 min), 96 ≈ 24h of poll
  # history and 48 ≈ 12h of failures — enough for recent debugging.
  successfulJobsHistoryLimit: 96
  failedJobsHistoryLimit: 48
  # Re-un-suspended 2026-07-25 after the 2026-07-24T03:00:00Z org-wide
  # spend-cap reset (mctl-gitops#611 TEMP note). This CronWorkflow has no
  # dedicated one-shot MCP trigger, so the reset was verified via the
  # equivalent code path instead: `mctl_trigger_issue` on
  # mctlhq/mctl-telegram#296 (same issue-investigator / Claude SDK auth
  # as the poll sweep) completed Succeeded end to end (6.5min real SDK
  # session, commit, assert-produced), no fallback needed. The
  # `agents:intake` label on #296 was removed manually afterward so the
  # first live poll tick doesn't re-investigate it. See memory:
  # mctl-agents-crons-suspended-spend-cap.
  suspend: false
  # ── Dispatcher ────────────────────────────────────────────────────────────
  # This used to be `workflowTemplateRef: mctl-agents-issue-poll`, which meant
  # every tick submitted the full poll template — and that template declares
  # `volumeClaimTemplates`, so every tick provisioned, attached, and destroyed
  # a 4 GiB Hetzner volume before the first step even ran. Argo creates
  # volumeClaimTemplate PVCs at workflow start, ahead of any step, so a `when:`
  # guard *inside* the template cannot avoid it; the check has to happen in a
  # separate, volume-less workflow.
  #
  # That cost was almost entirely wasted. The poll's work condition is a single
  # authoritative query — open mctlhq issues carrying `agents:intake` — and in
  # steady state it returns nothing, because the poller removes the label from
  # every issue it processes. 96 ticks/day, each a full volume attach/detach
  # cycle, to discover there was nothing to do.
  #
  # Volume churn is not a cosmetic concern here: Hetzner attach/detach actions
  # wedge (`running`/`progress:0` for 10-12h, no cancel API) and were caught 8
  # times in July 2026 alone. Wedge probability scales with the number of
  # cycles, and a wedged attach leaves a pod Pending — which on 2026-07-30
  # meant holding `mctl-gitops-main-writes` for 61 minutes and taking two cron
  # cycles down with it. Fewer cycles is the cheapest available mitigation and
  # it introduces no new failure mode.
  #
  # The pre-check runs the *identical* `gh search` the poller itself runs
  # (orchestrator/run_issue_poller.py:search_labeled_issues), so it cannot
  # drift from the real work condition. It also fails OPEN: any error, empty
  # output, or unparseable response submits the poll anyway. A false "yes" just
  # costs one no-op run, exactly what happens today; a false "no" would silently
  # drop intake, so the check is never allowed to be the reason work is skipped.
  #
  # Manual/MCP triggers are unaffected — they submit the CWFT directly and
  # still run unconditionally, which is what an operator asking for a sweep
  # wants.
  workflowSpec:
    serviceAccountName: argo-workflow-sa
    imagePullSecrets:
      - name: ghcr-credentials
    # No volumeClaimTemplates. That is the entire point of this indirection.
    ttlStrategy:
      secondsAfterCompletion: 3600
    # Generous next to a ~5s `gh search`, but this pod still has to be
    # scheduled and pull-checked; 5 min keeps a transient stall from eating a
    # whole 15-min cron interval.
    activeDeadlineSeconds: 300
    entrypoint: dispatch
    templates:
      - name: dispatch
        steps:
          - - name: check-intake
              template: has-labelled-issues
          - - name: submit-poll
              template: submit-issue-poll
              when: "{{steps.check-intake.outputs.result}} == true"

      # Prints exactly "true" or "false" on stdout; Argo exposes that as
      # {{steps.check-intake.outputs.result}}. Nothing else may be printed to
      # stdout, so all diagnostics go to stderr.
      - name: has-labelled-issues
        script:
          image: ghcr.io/mctlhq/mctl-agents:1.20.2
          imagePullPolicy: IfNotPresent
          # STATE_DIR deliberately unset: entrypoint.sh only symlinks runtime
          # state when it is set, and this step needs no state at all. Bypass
          # the entrypoint entirely and run the shell directly.
          command: [sh]
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mctl-agents-secrets
                  key: github-token
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          source: |
            # No `set -e`: a non-zero gh exit must fall through to the
            # fail-open default below, not abort the step.
            echo "checking for open mctlhq issues labelled agents:intake" >&2

            # --limit 1: existence is all that matters here. The real poller
            # does its own full, capped search. gh's own stderr passes through
            # to the pod log; only its stdout is captured.
            RESULT=$(gh search issues \
              --owner mctlhq \
              --label 'agents:intake' \
              --state open \
              --limit 1 \
              --json url)
            RC=$?

            if [ "$RC" -ne 0 ] || [ -z "$RESULT" ]; then
              echo "gh search failed (rc=${RC}) or returned nothing on stdout — failing OPEN and submitting the poll" >&2
              printf 'true'
              exit 0
            fi

            # Insist on an actual array. `jq length` happily returns 0 for
            # `null` and for a string, which would look identical to "no
            # labelled issues" and silently drop intake — the one outcome this
            # check must never produce.
            COUNT=$(printf '%s' "$RESULT" \
              | jq 'if type == "array" then length else "not-an-array" end' 2>/dev/null)
            case "$COUNT" in
              ''|*[!0-9]*)
                echo "gh output was not a JSON array (got: ${COUNT:-parse-error}) — failing OPEN and submitting the poll" >&2
                printf 'true'
                exit 0
                ;;
            esac

            echo "labelled open issues found: ${COUNT}" >&2
            if [ "$COUNT" -gt 0 ]; then
              printf 'true'
            else
              printf 'false'
            fi

      # Submits the real poll Workflow. argo-workflow-sa already carries
      # workflows/create via the argo-workflow-runner Role (added for
      # resubmit/retry) — no new RBAC.
      - name: submit-issue-poll
        resource:
          action: create
          # Do not block this dispatcher on the poll finishing: the poll has
          # its own 30-min deadline, its own Forbid policy, and its own
          # Telegram notify. Waiting here would keep the dispatcher Running and
          # let concurrencyPolicy: Forbid suppress the *next* tick.
          successCondition: metadata.name != ""
          manifest: |
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: mctl-agents-issue-poll-
              namespace: argo-workflows
              labels:
                mctl.ai/dispatched-by: mctl-agents-issue-poll
            spec:
              workflowTemplateRef:
                name: mctl-agents-issue-poll
                clusterScope: true
