apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: add-custom-domain
  annotations:
    workflows.argoproj.io/description: |
      Add a verified custom domain to a service:
        1. Validate domain format (FQDN, not a platform domain)
        2. DNS verify: CNAME must point to {team}-{service}.{PLATFORM_DOMAIN}
        3. Update service values.yaml: add host to ingress.hosts + TLS with http01 issuer
        4. Commit to gitops repo → ArgoCD syncs
        5. Callback to Backstage to mark domain as active
spec:
  entrypoint: add-domain-pipeline
  serviceAccountName: argo-workflow-sa

  arguments:
    parameters:
      - name: team_name
      - name: service_name
      - name: domain
        # e.g. "api.mycompany.com"

  templates:
    - name: add-domain-pipeline
      dag:
        tasks:
          - name: add-domain
            template: do-add-domain

    - name: do-add-domain
      inputs:
        parameters:
          - name: team_name
            value: "{{workflow.parameters.team_name}}"
          - name: service_name
            value: "{{workflow.parameters.service_name}}"
          - name: domain
            value: "{{workflow.parameters.domain}}"
      script:
        image: alpine:3.19
        command: [sh]
        envFrom:
          - configMapRef:
              name: mctl-platform-config
        env:
          # Workflow params injected as env vars so the shell layer can
          # quote them: direct {{inputs.parameters.*}} interpolation into
          # the script body is a shell-injection vector, and this pod now
          # also holds the Backstage token — a crafted team/service/domain
          # value must not be able to exfiltrate it (same hardening the
          # mctl-agents commit-and-push steps already use).
          - name: PARAM_TEAM
            value: "{{inputs.parameters.team_name}}"
          - name: PARAM_SERVICE
            value: "{{inputs.parameters.service_name}}"
          - name: PARAM_DOMAIN
            value: "{{inputs.parameters.domain}}"
          # Backstage external-access token (subject mctl-api): the
          # custom-domains routes this script calls are auth-gated since
          # mctl-portal#89 (see issue #920). ExternalSecret
          # backstage-workflow-token in this namespace.
          - name: BACKSTAGE_TOKEN
            valueFrom:
              secretKeyRef:
                name: backstage-workflow-token
                key: BACKSTAGE_TOKEN
                # optional bridges the namespace transition: today this
                # workflow runs in the TENANT namespace (mctl-api operations
                # executor), where the secret deliberately does NOT exist —
                # replicating a platform credential into tenant namespaces
                # would let any tenant read it (tenant SAs can get secrets)
                # and impersonate the workflow tier. Until mctl-api routes
                # add/remove-custom-domain to the argo-workflows namespace,
                # the pod starts with an empty token and the (still
                # ungated) Backstage routes accept the calls; once the
                # namespace move and the portal gate both ship, the secret
                # resolves here and the calls are authenticated. Deploy
                # order: mctl-api namespace change BEFORE the mctl-portal
                # release that gates the routes.
                optional: true
        source: |
          set -e
          apk add --no-cache curl git openssh-client bind-tools yq > /dev/null 2>&1

          TEAM="$PARAM_TEAM"
          SERVICE="$PARAM_SERVICE"
          DOMAIN="$PARAM_DOMAIN"
          AUTO_DOMAIN="${TEAM}-${SERVICE}.${PLATFORM_DOMAIN}"
          BACKSTAGE_URL="http://backstage.backstage.svc.cluster.local:7007"

          # ── 1. Validate domain format ─────────────────────────────────────
          echo "🔍 Validating domain: ${DOMAIN}"
          echo "$DOMAIN" | grep -qE '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(\.[a-z]{2,})+$' || {
            echo "❌ Invalid domain format: ${DOMAIN}"
            exit 1
          }
          # Reject platform domains. PLATFORM_DOMAIN_ALT is optional (it is
          # empty since mctl.me was retired), and interpolating an empty value
          # straight into the alternation produces "\.(mctl\.ai|)$" — an empty
          # sub-expression, which BusyBox grep rejects outright: every domain
          # then fails the check and no custom domain can be added at all.
          # Build the pattern instead, and only add the alternation when there
          # is something to alternate with.
          PLATFORM_PATTERN="\.${PLATFORM_DOMAIN//./\\.}$"
          if [ -n "${PLATFORM_DOMAIN_ALT}" ]; then
            PLATFORM_PATTERN="\.(${PLATFORM_DOMAIN//./\\.}|${PLATFORM_DOMAIN_ALT//./\\.})$"
          fi
          echo "$DOMAIN" | grep -qvE "$PLATFORM_PATTERN" || {
            echo "❌ Cannot add platform domain as custom: ${DOMAIN}"
            exit 1
          }
          echo "✅ Domain format valid"

          # ── 2. DNS verification ───────────────────────────────────────────
          echo "🔍 Checking DNS for ${DOMAIN}..."
          CNAME_TARGET=$(dig +short CNAME "${DOMAIN}" | sed 's/\.$//' | head -1)
          if [ -z "$CNAME_TARGET" ]; then
            echo "❌ No CNAME record found for ${DOMAIN}"
            echo "   Please create: ${DOMAIN} CNAME → ${AUTO_DOMAIN}"
            exit 1
          fi
          echo "   CNAME: ${DOMAIN} → ${CNAME_TARGET}"
          if [ "$CNAME_TARGET" != "$AUTO_DOMAIN" ]; then
            echo "❌ CNAME points to '${CNAME_TARGET}', expected '${AUTO_DOMAIN}'"
            exit 1
          fi
          echo "✅ DNS verified"

          # ── 3. Set up SSH for git ─────────────────────────────────────────
          mkdir -p ~/.ssh
          cp /secrets/deploy-key/ssh-privatekey ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host github.com\n  Hostname ssh.github.com\n  Port 443\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking no\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # ── 4. Clone mctl-gitops ────────────────────────────────────────────
          git clone --depth=1 "git@github.com:${GITOPS_ORG}/${GITOPS_REPO}.git" /tmp/mctl-gitops
          cd /tmp/mctl-gitops
          git config user.name "argo-workflows[bot]"
          git config user.email "argo-workflows[bot]@users.noreply.github.com"

          # ── 5. Verify service exists ──────────────────────────────────────
          SVC_VALUES="platform-gitops/services/${TEAM}/${SERVICE}/values.yaml"
          if [ ! -f "$SVC_VALUES" ]; then
            echo "❌ Service not found: ${TEAM}/${SERVICE}"
            exit 1
          fi

          # ── 6. Check domain not already in ingress ────────────────────────
          if yq eval '.ingress.hosts[]' "$SVC_VALUES" 2>/dev/null | grep -qF "$DOMAIN"; then
            echo "ℹ️  Domain ${DOMAIN} already in ingress.hosts — nothing to do"
            exit 0
          fi

          # ── 7. Add domain to ingress.hosts ────────────────────────────────
          echo "📝 Adding ${DOMAIN} to ingress.hosts..."
          yq eval -i ".ingress.hosts += [\"${DOMAIN}\"]" "$SVC_VALUES"

          # ── 8. Add TLS for custom domain with HTTP-01 issuer ──────────────
          CUSTOM_TLS_NAME="${SERVICE}-custom-tls"
          # Check if custom TLS entry already exists
          EXISTING_TLS=$(yq eval ".ingress.tls[] | select(.secretName == \"${CUSTOM_TLS_NAME}\")" "$SVC_VALUES" 2>/dev/null)
          if [ -z "$EXISTING_TLS" ]; then
            # Add a separate TLS entry for custom domains using HTTP-01
            yq eval -i ".ingress.tls += [{\"secretName\": \"${CUSTOM_TLS_NAME}\", \"hosts\": [\"${DOMAIN}\"]}]" "$SVC_VALUES"
          else
            # Append domain to existing custom TLS entry
            yq eval -i "(.ingress.tls[] | select(.secretName == \"${CUSTOM_TLS_NAME}\")).hosts += [\"${DOMAIN}\"]" "$SVC_VALUES"
          fi

          # Use HTTP-01 issuer annotation for this ingress (cert-manager picks up all TLS hosts)
          # We need a separate Certificate resource or annotate differently
          # For simplicity, we add a Certificate resource for the custom domain
          CERT_DIR="platform-gitops/services/${TEAM}/${SERVICE}"
          cat > "${CERT_DIR}/custom-domain-cert-${DOMAIN%%.*}.yaml" << CERTEOF
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: ${CUSTOM_TLS_NAME}
            namespace: ${TEAM}
          spec:
            secretName: ${CUSTOM_TLS_NAME}
            issuerRef:
              name: letsencrypt-http01
              kind: ClusterIssuer
            dnsNames:
          CERTEOF

          # Add all custom domain hosts to the Certificate
          for h in $(yq eval "(.ingress.tls[] | select(.secretName == \"${CUSTOM_TLS_NAME}\")).hosts[]" "$SVC_VALUES"); do
            echo "      - ${h}" >> "${CERT_DIR}/custom-domain-cert-${DOMAIN%%.*}.yaml"
          done

          echo "✅ Custom domain TLS certificate configured"

          # ── 9. Commit and push ────────────────────────────────────────────
          git add -A
          git commit -m "feat: add custom domain ${DOMAIN} to ${TEAM}/${SERVICE}" \
            -m "Custom domain: ${DOMAIN} → ${AUTO_DOMAIN}
          DNS verified: CNAME points to ${AUTO_DOMAIN}
          TLS: HTTP-01 via letsencrypt-http01 ClusterIssuer"

          PUSHED=false
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then
              echo "✅ Pushed — ArgoCD will sync"
              PUSHED=true
              break
            fi
            git pull --rebase origin main
          done
          if [ "$PUSHED" != "true" ]; then
            echo "❌ git push failed after 5 attempts — aborting before the Backstage callback" >&2
            echo "   (activating without the ingress commit would leave the domain 'active' with no ingress)" >&2
            exit 1
          fi

          # ── 10. Callback to Backstage to activate domain ──────────────────
          # Both routes are auth-gated (mctl-portal#89): the plugin's
          # isWorkflowCaller admits only this external-access identity.
          # Activate failures are no longer swallowed — the ingress change
          # is already pushed by this point, so a failed activate must
          # surface (the domain would otherwise stay pending silently).
          echo "📡 Notifying Backstage..."
          # Find domain ID from Backstage
          # -f on both curls: a 401/403 must fail here, not surface later as
          # a bogus "domain not found". The id is extracted with yq from the
          # entry whose .domain matches — the old grep-only pipeline threw
          # away every field except id and then grepped for the domain, so it
          # only ever matched when the id happened to contain the domain
          # string (i.e. never, with UUID ids).
          DOMAIN_DATA=$(curl -sSf -H "Authorization: Bearer ${BACKSTAGE_TOKEN}" "${BACKSTAGE_URL}/api/custom-domains/domains?team=${TEAM}&service=${SERVICE}")
          # yq failures (malformed JSON, bad expression) must fail the step
          # with yq's own stderr — not be swallowed into an empty DOMAIN_ID
          # that then reads as a misleading "domain not found".
          DOMAIN_ID=$(echo "$DOMAIN_DATA" | yq -p=json ".domains[] | select(.domain == \"${DOMAIN}\") | .id" -)
          [ "$DOMAIN_ID" = "null" ] && DOMAIN_ID=""
          if [ -n "$DOMAIN_ID" ]; then
            if ! curl -sSf -X POST -H "Authorization: Bearer ${BACKSTAGE_TOKEN}" "${BACKSTAGE_URL}/api/custom-domains/domains/${DOMAIN_ID}/activate"; then
              # A rerun after a transient callback failure lands here with
              # the ingress commit already on main. Only swallow the error
              # when the domain is in fact already active; anything else
              # (auth, outage) stays a hard failure.
              STATUS=$(echo "$DOMAIN_DATA" | yq -p=json ".domains[] | select(.domain == \"${DOMAIN}\") | .status" -)
              if [ "$STATUS" = "active" ]; then
                echo "ℹ️  Activate call failed but domain is already active — treating as success"
              else
                echo "❌ Backstage activate failed and domain is not active (status=${STATUS})" >&2
                exit 1
              fi
            fi
            echo "✅ Domain status updated to active"
          else
            echo "⚠️  Domain id for ${DOMAIN} not found in Backstage — activation skipped" >&2
            exit 1
          fi

          echo ""
          echo "🎉 Custom domain ${DOMAIN} added successfully!"
          echo "   Service: ${TEAM}/${SERVICE}"
          echo "   Domain: https://${DOMAIN}"
          echo "   CNAME target: ${AUTO_DOMAIN}"
        volumeMounts:
          - name: deploy-key
            mountPath: /secrets/deploy-key
      volumes:
        - name: deploy-key
          secret:
            secretName: mctl-gitops-deploy-key
