apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: rotate-github-app-tokens
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: |
      Rotates GitHub App installation tokens every 30 minutes, one per
      configured target. Reads each App's private key from Vault, generates
      a fresh installation token, merges it into the target Vault secret
      (preserving every other key already there), and triggers that
      target's ExternalSecret re-sync so the consuming pod picks up the
      fresh token without a restart.

      Installation tokens expire after 60 minutes, so a 30-minute cadence
      leaves a safe 30-minute buffer. Targets are processed independently in
      the sense that a failure in one (mint, Vault write, or ExternalSecret
      re-sync) does not abort the loop and the other still rotates.

      That is NOT a separate failure domain, though. Since 2026-08-13 both
      targets mint from the same App — mctl-agents (id 4450852), the
      backend-only automation App — so a revoked key, a removed
      installation, or a GitHub outage takes out both at once. When
      triaging, check whether one target failed or both: both failing
      points at the shared App, one failing at that target's Vault path or
      ExternalSecret.

      They remain separate entries because they land in different Vault
      paths and re-sync different ExternalSecrets, and because a future
      consumer may warrant its own App again.

      Targets (one mint per Vault path; every ExternalSecret reading that path
      is re-synced from the same mint):
        - mctl-agent  (App id 4450852)  -> secret/platform/mctl-agent/tokens
                                            key github-token
                                         -> ExternalSecrets
                                            admins/admins-mctl-agent-base-service
                                            admins/admins-mctl-agents-worker-base-service
        - mctl-agents (App id 4450852)  -> secret/platform/mctl-agents
                                            key github-token
                                         -> ExternalSecret
                                            argo-workflows/mctl-agents-secrets

      Note the re-sync only refreshes the Kubernetes Secret. A consumer that
      reads the token from `envFrom`/`secretKeyRef` still never sees the new
      value — environment variables are fixed when the container starts. Only
      a mounted Secret volume (or a re-read from Vault) actually propagates,
      which is why mctl-agents-worker mounts the token as a file and
      orchestrator/github_token.py re-reads it before each gh/git call.

      Renamed 2026-08-01 from rotate-mctl-agent-github-token (singular) now
      that it rotates for both mctl-agent and mctl-agents.

      2026-08-13: the mctl-agent target moved off MCTL App (id 2902192).
      MCTL App is the user-facing App installed from mctl.ai and is being
      narrowed to read-only (#761), so it can no longer back a token that
      opens PRs.
spec:
  schedule: "*/30 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  # Counts, NOT days. With a `*/30` cron (48 ticks/day) 144 ≈ 3 days
  # of triage history. Default 3 covered only 90 min — masked the
  # 2026-04-30 MinIO-full failure once recovery rolled it out of
  # history.
  successfulJobsHistoryLimit: 144
  failedJobsHistoryLimit: 72
  workflowSpec:
    serviceAccountName: argo-workflow-sa
    # 3d TTL — must outlive successfulJobsHistoryLimit (144) at the
    # `*/30` cadence (48 ticks/d). Default 1h pruned everything inside
    # an hour, making the kept-history goal of 144 successful runs
    # unreachable (Codex P1 on PR #147). The 3600 value was harmless
    # for the rotation primary purpose (only the latest token matters)
    # but defeated the new triage-history requirement.
    ttlStrategy:
      secondsAfterCompletion: 259200
    entrypoint: rotate
    templates:
      - name: rotate
        script:
          image: python:3.12-alpine
          command: [sh]
          source: |
            set -e
            pip install cryptography --quiet

            python3 - << 'PYEOF'
            import os, time, json, base64, urllib.request, urllib.error

            VAULT_ADDR = os.environ["VAULT_ADDR"]

            from cryptography.hazmat.primitives import serialization, hashes
            from cryptography.hazmat.primitives.asymmetric import padding
            from cryptography.hazmat.backends import default_backend

            # ── Vault auth via Kubernetes SA token (shared by every target) ──────
            with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                sa_token = f.read().strip()
            resp = urllib.request.urlopen(urllib.request.Request(
                f"{VAULT_ADDR}/v1/auth/kubernetes/login",
                data=json.dumps({"role": "argo-workflow", "jwt": sa_token}).encode(),
                headers={"Content-Type": "application/json"},
                method="POST"
            ))
            vault_token = json.loads(resp.read())["auth"]["client_token"]
            print("✅ Vault authenticated")

            with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                k8s_token = f.read().strip()
            k8s_ctx = __import__("ssl").create_default_context()
            k8s_ctx.load_verify_locations("/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

            def vault_get(path):
                req = urllib.request.Request(
                    f"{VAULT_ADDR}/v1/secret/data/{path}",
                    headers={"X-Vault-Token": vault_token}
                )
                return json.loads(urllib.request.urlopen(req).read())["data"]["data"]

            def vault_write(path, data):
                req = urllib.request.Request(
                    f"{VAULT_ADDR}/v1/secret/data/{path}",
                    data=json.dumps({"data": data}).encode(),
                    headers={"X-Vault-Token": vault_token, "Content-Type": "application/json"},
                    method="POST"
                )
                return json.loads(urllib.request.urlopen(req).read())["data"]["version"]

            def mint_installation_token(creds):
                private_key = creds["private-key"]
                app_id = creds["app-id"]
                installation_id = creds["installation-id"]
                key = serialization.load_pem_private_key(
                    private_key.encode(), password=None, backend=default_backend()
                )
                now = int(time.time())
                header = base64.urlsafe_b64encode(b'{"alg":"RS256","typ":"JWT"}').rstrip(b'=').decode()
                payload_dict = {"iat": now - 60, "exp": now + 600, "iss": app_id}
                payload = base64.urlsafe_b64encode(
                    json.dumps(payload_dict, separators=(',', ':')).encode()
                ).rstrip(b'=').decode()
                signing_input = f"{header}.{payload}".encode()
                signature = key.sign(signing_input, padding.PKCS1v15(), hashes.SHA256())
                sig_b64 = base64.urlsafe_b64encode(signature).rstrip(b'=').decode()
                app_jwt = f"{header}.{payload}.{sig_b64}"

                req = urllib.request.Request(
                    f"https://api.github.com/app/installations/{installation_id}/access_tokens",
                    data=b"{}",
                    headers={
                        "Authorization": f"Bearer {app_jwt}",
                        "Accept": "application/vnd.github+json",
                        "X-GitHub-Api-Version": "2022-11-28",
                        "Content-Length": "2",
                    },
                    method="POST"
                )
                result = json.loads(urllib.request.urlopen(req).read())
                return result["token"], result["expires_at"]

            def force_sync_external_secret(namespace, name, version):
                patch_body = json.dumps({
                    "metadata": {"annotations": {"force-sync": str(version)}}
                }).encode()
                req = urllib.request.Request(
                    "https://kubernetes.default.svc/apis/external-secrets.io/v1beta1"
                    f"/namespaces/{namespace}/externalsecrets/{name}",
                    data=patch_body,
                    headers={
                        "Authorization": f"Bearer {k8s_token}",
                        "Content-Type": "application/merge-patch+json",
                    },
                    method="PATCH"
                )
                urllib.request.urlopen(req, context=k8s_ctx)

            # ── One entry per App. Adding a new consumer of the same App
            # pattern later only needs a new entry here, no template changes.
            TARGETS = [
                {
                    # Minted from the mctl-agents App, not MCTL App: this token
                    # is what mctl-agent's fixer uses to open PRs against
                    # mctl-gitops, and MCTL App is the user-facing App people
                    # install from mctl.ai — it is being narrowed to read-only
                    # (#761), so no write path may depend on it any more.
                    "label": "mctl-agent",
                    "creds_path": "platform/github-app-agents",
                    "dest_path": "platform/mctl-agent/tokens",
                    "dest_key": "github-token",
                    # Two consumers read this one Vault path, so both get
                    # re-synced from a single mint. The worker was missing
                    # here and fell back to its ExternalSecret's own refresh
                    # interval, which used to be 1h — the same as the token's
                    # TTL, i.e. no margin at all.
                    "external_secrets": [
                        ("admins", "admins-mctl-agent-base-service"),
                        ("admins", "admins-mctl-agents-worker-base-service"),
                    ],
                },
                {
                    "label": "mctl-agents",
                    "creds_path": "platform/github-app-agents",
                    "dest_path": "platform/mctl-agents",
                    "dest_key": "github-token",
                    "external_secrets": [
                        ("argo-workflows", "mctl-agents-secrets"),
                    ],
                },
            ]

            failures = []
            for t in TARGETS:
                label = t["label"]
                try:
                    creds = vault_get(t["creds_path"])
                    token, expires_at = mint_installation_token(creds)
                    print(f"✅ [{label}] minted (installation={creds['installation-id']}, expires={expires_at})")

                    # Read-merge-write: never replace the whole secret, only
                    # the one key. Other keys at this path (OAuth tokens,
                    # Telegram creds, inbound auth tokens, ...) must survive
                    # untouched. Never vault kv put a partial object here.
                    existing = vault_get(t["dest_path"])
                    before_keys = set(existing.keys())
                    existing[t["dest_key"]] = token
                    version = vault_write(t["dest_path"], existing)
                    assert set(existing.keys()) == before_keys | {t["dest_key"]}, \
                        f"[{label}] key set changed unexpectedly — refusing to trust this write"
                    print(f"✅ [{label}] Vault {t['dest_path']} updated (version {version})")

                    for es_namespace, es_name in t["external_secrets"]:
                        force_sync_external_secret(es_namespace, es_name, version)
                        print(f"✅ [{label}] ExternalSecret {es_namespace}/{es_name} re-sync triggered")
                except Exception as e:
                    print(f"⚠️  [{label}] rotation failed: {e}")
                    failures.append(label)

            if failures:
                raise SystemExit(f"rotation failed for: {', '.join(failures)}")
            print("🎉 GitHub App token rotation complete")
            PYEOF
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
