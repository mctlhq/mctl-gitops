apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: global-workflow-completion-hook
  annotations:
    workflows.argoproj.io/description: |
      Global completion hook that sends an instant HTTP POST event to mctl-api
      upon workflow completion, unblocking Temporal activities without polling delay.
spec:
  serviceAccountName: argo-workflow-sa
  templates:
    - name: notify-completion
      container:
        image: curlimages/curl:latest
        command: [sh, -c]
        args:
          - |
            curl -s -X POST http://mctl-api.admins.svc.cluster.local:8080/api/v1/workflows/events/argo-complete \
              -H "Content-Type: application/json" \
              -d "{\"workflow_name\":\"{{workflow.name}}\",\"phase\":\"{{workflow.status}}\"}" || true
