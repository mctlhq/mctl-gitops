apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: bootstrap-platform
  annotations:
    workflows.argoproj.io/description: |
      One-time platform bootstrap: generates and writes initial secrets to Vault.
      Idempotent — skips any secret that already exists.

      Secrets written:
        secret/platform/argo-workflows/database → username, password
        secret/platform/backstage/database      → postgres-user, postgres-password
        secret/platform/mctl-agent/database     → username, password
        secret/platform/valkey                  → telegram-producer-password, github-producer-password, synthetic-producer-password,
                                                  claude-remote-password, exporter-password
        secret/platform/forgejo/database        → username, password
        secret/platform/forgejo                 → admin-username, admin-password, metrics-token
        secret/platform/zitadel/database        → username, password
        secret/platform/zitadel                 → masterkey, admin-password, login-session-secret
        secret/platform/grafana/database        → username, password

      Run once after initial cluster setup:
        argo submit --from clusterworkflowtemplate/bootstrap-platform -n argo-workflows
spec:
  # Without these the documented `argo submit --from clusterworkflowtemplate/...`
  # is refused ("spec.entrypoint is required"), and a run that names only the
  # entrypoint gets the namespace default ServiceAccount, which the Vault
  # kubernetes role `argo-workflow` does not accept (bound to argo-workflow-sa,
  # argo-workflows/config/vault-auth.yaml).
  entrypoint: bootstrap
  serviceAccountName: argo-workflow-sa
  templates:
    - name: bootstrap
      script:
        image: alpine:3.19
        command: [sh]
        source: |
          set -e
          apk add --no-cache curl openssl python3 > /dev/null 2>&1

          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          VAULT_TOKEN=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"role\":\"argo-workflow\",\"jwt\":\"${SA_TOKEN}\"}" \
            "${VAULT_ADDR}/v1/auth/kubernetes/login" | \
            grep '"client_token"' | sed 's/.*"client_token":"\([^"]*\)".*/\1/')

          if [ -z "$VAULT_TOKEN" ]; then
            echo "Failed to authenticate with Vault"
            exit 1
          fi
          export VAULT_TOKEN
          echo "Authenticated with Vault"

          # ── Helper: write secret only if it doesn't exist ─────────────────
          write_if_missing() {
            PATH_="$1"
            DATA="$2"
            FULL="secret/data/${PATH_}"

            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "X-Vault-Token: $VAULT_TOKEN" \
              "${VAULT_ADDR}/v1/${FULL}")

            if [ "$HTTP" = "200" ]; then
              echo "SKIP: ${PATH_} already exists"
              return
            fi

            HTTP_W=$(curl -sS -o /tmp/vault-w.json -w "%{http_code}" \
              -X POST \
              -H "X-Vault-Token: $VAULT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"data\":${DATA}}" \
              "${VAULT_ADDR}/v1/${FULL}")

            if [ "$HTTP_W" = "200" ] || [ "$HTTP_W" = "204" ]; then
              echo "OK: ${PATH_}"
            else
              echo "FAIL: ${PATH_} (HTTP $HTTP_W)"
              cat /tmp/vault-w.json || true
            fi
          }

          # ── Generate random passwords ──────────────────────────────────────
          gen() { openssl rand -hex 20; }

          ARGO_DB_USER="argo"
          ARGO_DB_PASS=$(gen)
          BACKSTAGE_DB_USER="backstage"
          BACKSTAGE_DB_PASS=$(gen)
          AGENT_DB_USER="mctl-agent"
          AGENT_DB_PASS=$(gen)

          # ── Write secrets ──────────────────────────────────────────────────
          write_if_missing "platform/argo-workflows/database" \
            "{\"username\":\"${ARGO_DB_USER}\",\"password\":\"${ARGO_DB_PASS}\"}"

          write_if_missing "platform/backstage/database" \
            "{\"postgres-user\":\"${BACKSTAGE_DB_USER}\",\"postgres-password\":\"${BACKSTAGE_DB_PASS}\"}"

          write_if_missing "platform/mctl-agent/database" \
            "{\"username\":\"${AGENT_DB_USER}\",\"password\":\"${AGENT_DB_PASS}\"}"

          # Platform Valkey ACL users (infra-components/data/valkey). Hex only:
          # the ACL `>password` syntax ends a password at whitespace.
          write_if_missing "platform/valkey" \
            "{\"telegram-producer-password\":\"$(gen)\",\"github-producer-password\":\"$(gen)\",\"synthetic-producer-password\":\"$(gen)\",\"claude-remote-password\":\"$(gen)\",\"exporter-password\":\"$(gen)\"}"

          # Forgejo (bootstrap/templates/data/forgejo.yaml). The DB username must
          # equal the CNPG managed role name in cnpg/shared/cluster.yaml. `admin`
          # is a reserved Forgejo username, hence mctl-admin.
          write_if_missing "platform/forgejo/database" \
            "{\"username\":\"forgejo\",\"password\":\"$(gen)\"}"

          write_if_missing "platform/forgejo" \
            "{\"admin-username\":\"mctl-admin\",\"admin-password\":\"$(gen)\",\"metrics-token\":\"$(gen)\"}"

          # ZITADEL (bootstrap/templates/core-infra/zitadel.yaml). The DB username
          # must equal the CNPG managed role name in cnpg/shared/cluster.yaml.
          # masterkey: exactly 32 bytes (hex of 16 random bytes); it encrypts data
          # inside the database and must never be regenerated once setup ran.
          # admin-password: gen is lowercase hex only, and ZITADEL's default
          # password policy also wants an uppercase letter and a symbol. Both
          # are drawn at random too, so no part of the break-glass password is
          # a constant visible in this public repository. The symbol set avoids
          # characters that would need escaping in the JSON below.
          zitadel_admin_pw() {
            printf '%s%s%s' "$(gen)" \
              "$(LC_ALL=C tr -dc 'A-Z' </dev/urandom | head -c 4)" \
              "$(LC_ALL=C tr -dc '!#%+=?@' </dev/urandom | head -c 2)"
          }

          write_if_missing "platform/zitadel/database" \
            "{\"username\":\"zitadel\",\"password\":\"$(gen)\"}"

          write_if_missing "platform/zitadel" \
            "{\"masterkey\":\"$(openssl rand -hex 16)\",\"admin-password\":\"$(zitadel_admin_pw)\",\"login-session-secret\":\"$(gen)\"}"

          # Grafana's own database (bootstrap/templates/observability/monitoring.yaml).
          # The DB username must equal the CNPG managed role name in
          # cnpg/shared/cluster.yaml.
          write_if_missing "platform/grafana/database" \
            "{\"username\":\"grafana\",\"password\":\"$(gen)\"}"

          echo ""
          echo "Bootstrap complete. ExternalSecrets will refresh within 1h."
          echo "To force refresh:"
          echo "  kubectl annotate externalsecret -A --all force-sync=\$(date +%s) --overwrite"
        env:
          - name: VAULT_ADDR
            value: "http://vault.vault.svc.cluster.local:8200"
