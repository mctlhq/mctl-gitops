apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: mctl-agents-shepherd
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: |
      Two-hourly (07:00-21:00 UTC, 8/day) trigger for the Tier 3 PR
      shepherd.

      All workflow logic lives in ClusterWorkflowTemplate
      `mctl-agents-shepherd` (cwft-mctl-agents-shepherd.yaml). This
      CronWorkflow is a thin wrapper that submits a Workflow with no
      service / slug filter, so the shepherd processes every proposal
      whose .status.yaml is in {implemented, review-fixing}.

      Other entry points reference the same template with different
      parameters:
        - operator submitting a one-shot Workflow that references this
          CWFT (manual triage, dry-run, single-proposal sweep)

      Active. Un-suspended via gitops on 2026-05-01 after the first
      one-shot real run (mctl-agents-shepherd-712b9f8e) successfully
      flipped 11 proposals (9 to `merged`, 2 to `rejected`) with no
      false positives.
spec:
  # `0 7-21/2 * * *` — 07, 09, 11, 13, 15, 17, 19, 21 UTC (8 ticks/day).
  # Anchored on the operator's local morning: they are at UTC+2, so the
  # first tick lands at 09:00 their time and the last at 23:00.
  # A tick with no proposals in {implemented, review-fixing} is a cheap
  # no-op (one glob + exit). Contends with rotate-github-app-tokens (also
  # :00) on the `mctl-gitops-main-writes` mutex — Forbid drops overlaps
  # cleanly, and since #852 the mutex is held only for the seconds
  # commit-and-push runs rather than the whole tick.
  #
  # History: `30 */2 * * *` (12/day) → `0 * * * *` (24/day) on 2026-05-23
  # to cut worst-case PR-sit-time from ~2h to ~1h → this on 2026-08-15.
  # That trade is deliberate: PR-sit-time goes back up (2h during the
  # working day, 10h across the overnight gap), and in exchange each tick
  # stops costing a Hetzner volume provision + attach/detach cycle and an
  # SDK run. 24 → 8 volumes a day on the one template that still carries a
  # workdir PVC and is the live victim of the Multi-Attach stalls behind
  # the mutex cascades (see reference_argo_agents_pvc_multiattach_stall).
  # Revisit once shepherd moves to emptyDir, which removes the volume cost
  # entirely and makes a denser cadence cheap again.
  schedule: "0 7-21/2 * * *"
  timezone: "UTC"
  # Forbid: never overlap two shepherd ticks. They all contend on the
  # same `mctl-gitops-main-writes` mutex anyway, and a queued tick
  # would only delay the next genuine cron-driven one. Drop overlaps
  # cleanly instead.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # Counts, NOT days — Argo retains the last N succeeded / N failed
  # Workflow objects regardless of age. At 8 ticks/day these limits are no
  # longer the binding constraint: the CWFT's 3d ttlStrategy deletes a run
  # before 48 of them accumulate (that would take 6 days), so the effective
  # window is ~3 days / ~24 runs. Left at 48/24 deliberately — they cost
  # nothing unbinding, and they become right again if the cadence goes back
  # up after the emptyDir move.
  #
  # Default was 3 (~6 hours), which masked the firing pattern during
  # the 2026-05-07 ESO triage. See plan
  # ~/.claude/plans/mctl-agents-daily-cron-visibility.md.
  successfulJobsHistoryLimit: 48
  failedJobsHistoryLimit: 24
  # Active — un-suspended after the smoke test (one-shot real run on
  # 2026-05-01 flipped 11 proposals correctly). Schedule fires every two
  # hours between 07:00 and 21:00 UTC and the workflow contends on the
  # shared `mctl-gitops-main-writes` mutex with the implementer /
  # agents-run workflows, so back-pressure is bounded.
  #
  # Re-un-suspended 2026-07-25 after the 2026-07-24T03:00:00Z org-wide
  # spend-cap reset (mctl-gitops#611 TEMP note): two manual
  # mctl_trigger_shepherd probes (a dry-run sweep + a real single-slug
  # trigger on mctl-gitops/incident-17841222) both completed Succeeded
  # with the primary OAuth token, no fallback needed, and no
  # workflow_failed incident — no RateLimitEvent/429 observed. See
  # memory: mctl-agents-crons-suspended-spend-cap.
  suspend: false
  workflowSpec:
    workflowTemplateRef:
      name: mctl-agents-shepherd
      clusterScope: true
    arguments:
      parameters:
        - name: service
          value: ""
        - name: slug
          value: ""
        - name: dry_run
          value: "false"
