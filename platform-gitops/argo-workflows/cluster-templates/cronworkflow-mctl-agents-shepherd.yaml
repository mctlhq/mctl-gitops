apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: mctl-agents-shepherd
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: |
      Two-hourly (07:00-21:00 UTC, 8/day) trigger for the Tier 3 PR
      shepherd.

      All workflow logic lives in ClusterWorkflowTemplate
      `mctl-agents-shepherd` (cwft-mctl-agents-shepherd.yaml). This
      CronWorkflow is a thin wrapper that submits a Workflow with no
      service / slug filter, so the shepherd processes every proposal
      whose .status.yaml is in {implemented, review-fixing}.

      Other entry points reference the same template with different
      parameters:
        - operator submitting a one-shot Workflow that references this
          CWFT (manual triage, dry-run, single-proposal sweep)

      Active. Un-suspended via gitops on 2026-05-01 after the first
      one-shot real run (mctl-agents-shepherd-712b9f8e) successfully
      flipped 11 proposals (9 to `merged`, 2 to `rejected`) with no
      false positives.
spec:
  # Dense overnight, the working day keeps its two-hour beat.
  #
  #   `*/15 22-23,0-6 * * *` — 36 ticks across the overnight gap
  #   `0 7-21/2 * * *`       — 07, 09, 11, 13, 15, 17, 19, 21 UTC, unchanged.
  #                            Anchored on the operator's local morning:
  #                            they are at UTC+2, so the first daytime tick
  #                            lands at 09:00 their time and the last at 23:00.
  #
  # The overnight gap used to be uncovered entirely: a PR that went green at
  # 21:05 sat until 07:00. That was the price of the 2026-08-15 cut to 8
  # ticks/day, and it bought exactly one thing — back then every tick
  # provisioned a Hetzner volume, and 24 attach/detach cycles a day were
  # feeding the Multi-Attach stalls behind the mutex cascades (see
  # reference_argo_agents_pvc_multiattach_stall).
  #
  # That reason is gone, and the comment this replaces said so itself
  # ("Revisit once shepherd moves to emptyDir"). cwft-mctl-agents-shepherd
  # now mounts `workdir` as an emptyDir, so a tick costs a pod and nothing
  # else. A tick with no proposal in {implemented, review-fixing} is a glob
  # and an exit, and since #852 the `mctl-gitops-main-writes` mutex is held
  # only for the seconds commit-and-push runs rather than the whole tick, so
  # four ticks an hour do not crowd the implementer.
  #
  # What a dense cadence does spend faster is the review-fixing attempt
  # budget: a PR whose findings the implementer declines to act on burns its
  # 3 attempts in 45 minutes instead of 6 hours and lands in review-stuck,
  # which needs an operator to move it back to accepted. Overnight that is
  # the better failure — it surfaces while someone is watching the run
  # rather than silently at 07:00 the next morning.
  #
  # Daytime is left alone on purpose. The same argument says it could be
  # `*/15` too, but that is a separate call and a separate revert.
  #
  # History: `30 */2 * * *` (12/day) -> `0 * * * *` (24/day) on 2026-05-23
  # -> `0 7-21/2 * * *` (8/day) on 2026-08-15 -> this (44/day) on 2026-09-11.
  #
  # `schedules` (a list), not the singular `schedule`: the singular is
  # deprecated as of Argo 3.6 and removed in 4.0. Controller here is v3.7.11.
  # The two windows are disjoint by hour, so they never fire in the same
  # minute and Forbid never has to arbitrate between them.
  schedules:
    - "*/15 22-23,0-6 * * *"
    - "0 7-21/2 * * *"
  timezone: "UTC"
  # Forbid: never overlap two shepherd ticks. They all contend on the
  # same `mctl-gitops-main-writes` mutex anyway, and a queued tick
  # would only delay the next genuine cron-driven one. Drop overlaps
  # cleanly instead.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # Counts, NOT days — Argo retains the last N succeeded / N failed
  # Workflow objects regardless of age. At 44 ticks/day these are the
  # binding constraint again, which is what the previous revision predicted
  # would happen once the cadence went back up after the emptyDir move: 48
  # succeeded runs now accumulate in about a day, well inside the CWFT's 3d
  # ttlStrategy. That is the intended window — roughly one full day/night
  # cycle of history, enough to read the firing pattern after an overnight
  # run without keeping a week of pods around.
  #
  # Default was 3 (~6 hours), which masked the firing pattern during
  # the 2026-05-07 ESO triage. See plan
  # ~/.claude/plans/mctl-agents-daily-cron-visibility.md.
  successfulJobsHistoryLimit: 48
  failedJobsHistoryLimit: 24
  # Active — un-suspended after the smoke test (one-shot real run on
  # 2026-05-01 flipped 11 proposals correctly). Schedule fires every two
  # hours between 07:00 and 21:00 UTC and the workflow contends on the
  # shared `mctl-gitops-main-writes` mutex with the implementer /
  # agents-run workflows, so back-pressure is bounded.
  #
  # Re-un-suspended 2026-07-25 after the 2026-07-24T03:00:00Z org-wide
  # spend-cap reset (mctl-gitops#611 TEMP note): two manual
  # mctl_trigger_shepherd probes (a dry-run sweep + a real single-slug
  # trigger on mctl-gitops/incident-17841222) both completed Succeeded
  # with the primary OAuth token, no fallback needed, and no
  # workflow_failed incident — no RateLimitEvent/429 observed. See
  # memory: mctl-agents-crons-suspended-spend-cap.
  suspend: false
  workflowSpec:
    workflowTemplateRef:
      name: mctl-agents-shepherd
      clusterScope: true
    arguments:
      parameters:
        - name: service
          value: ""
        - name: slug
          value: ""
        - name: dry_run
          value: "false"
