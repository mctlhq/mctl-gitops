apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: mctl-agents-shepherd
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: |
      Every 15 minutes at :09 (96/day) trigger for the Tier 3 PR
      shepherd. Offset to sit two minutes behind the reconcile schedule
      (:07), whose status projection it acts on.

      All workflow logic lives in ClusterWorkflowTemplate
      `mctl-agents-shepherd` (cwft-mctl-agents-shepherd.yaml). This
      CronWorkflow is a thin wrapper that submits a Workflow with no
      service / slug filter, so the shepherd processes every proposal
      whose .status.yaml is in {implemented, review-fixing}.

      Other entry points reference the same template with different
      parameters:
        - operator submitting a one-shot Workflow that references this
          CWFT (manual triage, dry-run, single-proposal sweep)

      Active. Un-suspended via gitops on 2026-05-01 after the first
      one-shot real run (mctl-agents-shepherd-712b9f8e) successfully
      flipped 11 proposals (9 to `merged`, 2 to `rejected`) with no
      false positives.
spec:
  # `9,24,39,54 * * * *` — every 15 minutes, offset to :09.
  #
  # The shepherd is the third read-mostly reconciler in the dev loop, and
  # until now it was the only one not on the family's cadence:
  #
  #   issue-poll   every 15 min, offset :03   (Temporal schedule)
  #   reconcile    every 15 min, offset :07   (Temporal schedule)
  #   shepherd     every 15 min, offset :09   (this file)
  #   incidents    hourly,       offset :11   (Temporal) and :15 (Argo)
  #
  # The offset is not cosmetic. reconcile projects GitHub state onto
  # proposal status; the shepherd then acts on whatever sits in
  # {implemented, review-fixing}. Running two minutes behind reconcile
  # means each tick reads status that was refreshed moments ago instead of
  # up to fifteen minutes stale, and it keeps the two off the same minute
  # on the `mctl-gitops-main-writes` mutex — which, since #852, either
  # holds for the seconds commit-and-push runs or not at all. :00 is left
  # to rotate-github-app-tokens.
  #
  # Why this is affordable now. The cadence was cut to 8 ticks/day on
  # 2026-08-15 because every tick then provisioned a Hetzner volume, and 24
  # attach/detach cycles a day were feeding the Multi-Attach stalls behind
  # the mutex cascades (see reference_argo_agents_pvc_multiattach_stall).
  # That revision named its own exit condition — "Revisit once shepherd
  # moves to emptyDir" — and the move has happened:
  # cwft-mctl-agents-shepherd mounts `workdir` as an emptyDir, so a tick
  # costs a pod and nothing else. A tick with no proposal in
  # {implemented, review-fixing} is a glob and an exit.
  #
  # What it buys. Worst-case PR sit time goes from 2 hours during the day
  # and 10 hours across the overnight gap to 15 minutes, always. A dev-loop
  # cycle is investigate -> approve -> implement -> review -> merge ->
  # release; at the old cadence the wait for the shepherd was routinely the
  # longest single step in it, and overnight it was longer than all the
  # others combined.
  #
  # What it costs, so the next person changing this does not find out the
  # hard way. The review-fixing attempt budget is spent faster: a PR whose
  # findings the implementer declines to act on burns its 3 attempts in 45
  # minutes instead of 6 hours and lands in review-stuck, which needs an
  # operator to move the proposal back to accepted. The total quota spend is
  # unchanged — the cap is 3 either way — but the failure arrives sooner.
  # That is the better trade: review-stuck is a state someone has to notice,
  # and noticing it 45 minutes in beats noticing it the next morning.
  #
  # History: `30 */2 * * *` (12/day) -> `0 * * * *` (24/day) on 2026-05-23
  # -> `0 7-21/2 * * *` (8/day) on 2026-08-15 -> this (96/day) on
  # 2026-09-11.
  #
  # `schedules` (a list), not the singular `schedule`: the singular is
  # deprecated as of Argo 3.6 and removed in 4.0. Controller is v3.7.11.
  schedules:
    - "9,24,39,54 * * * *"
  timezone: "UTC"
  # Forbid: never overlap two shepherd ticks. They all contend on the
  # same `mctl-gitops-main-writes` mutex anyway, and a queued tick
  # would only delay the next genuine cron-driven one. Drop overlaps
  # cleanly instead.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # Counts, NOT days — Argo retains the last N succeeded / N failed
  # Workflow objects regardless of age. At 96 ticks/day these bind well
  # before the CWFT's 3d ttlStrategy does, which is what the previous
  # revision predicted would happen once the cadence went back up after the
  # emptyDir move. 96 succeeded keeps a full day of firing history, which is
  # the window that matters when reading the pattern after an overnight run;
  # the objects are a few KB each and nothing else depends on them.
  # Failures stay at 24 — they are rare, so 24 of them reaches much further
  # back than a day.
  #
  successfulJobsHistoryLimit: 96
  failedJobsHistoryLimit: 24
  # Active — un-suspended after the smoke test (one-shot real run on
  # 2026-05-01 flipped 11 proposals correctly). The workflow contends on
  # the shared `mctl-gitops-main-writes` mutex with the implementer /
  # agents-run workflows, so back-pressure is bounded; the :09 offset in
  # the schedule comment above keeps it off reconcile's and
  # rotate-github-app-tokens' minutes rather than relying on that.
  #
  # Re-un-suspended 2026-07-25 after the 2026-07-24T03:00:00Z org-wide
  # spend-cap reset (mctl-gitops#611 TEMP note): two manual
  # mctl_trigger_shepherd probes (a dry-run sweep + a real single-slug
  # trigger on mctl-gitops/incident-17841222) both completed Succeeded
  # with the primary OAuth token, no fallback needed, and no
  # workflow_failed incident — no RateLimitEvent/429 observed. See
  # memory: mctl-agents-crons-suspended-spend-cap.
  suspend: false
  workflowSpec:
    workflowTemplateRef:
      name: mctl-agents-shepherd
      clusterScope: true
    arguments:
      parameters:
        - name: service
          value: ""
        - name: slug
          value: ""
        - name: dry_run
          value: "false"
