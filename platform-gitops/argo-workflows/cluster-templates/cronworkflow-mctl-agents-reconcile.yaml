apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: mctl-agents-reconcile
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: |
      Low-frequency trigger for the read-only status reconciler.

      Workflow logic lives in ClusterWorkflowTemplate `mctl-agents-reconcile`
      (cwft-mctl-agents-reconcile.yaml). This CronWorkflow submits it with no
      parameters, so it reconciles every service: discovers canonical PRs from
      feat/agents-* branches, restores lost URLs, and projects open/merged/
      closed/conflicted state. No reviews, fixes, merges, or SDK.

      Cadence: every 15 minutes, bounding an orphaned PR projection to one
      steward tick while keeping the loop free of model quota.
spec:
  # Every 15 minutes. Reconciliation performs GitHub reads and tiny status
  # writes only; it never starts the SDK.
  # The cadence overlaps the */5 crons (issue-poll, implement) and incidents;
  # all contend on the shared `mctl-gitops-main-writes` mutex, so concurrent
  # ticks serialize (one waits) and the commit step's retry loop resolves it.
  schedule: "*/15 * * * *"
  timezone: "UTC"
  # Forbid: never overlap two reconcile ticks (they contend on the same
  # mctl-gitops-main-writes mutex anyway).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # Counts, NOT days. 96 ticks/day, so 96 ≈ one day of history.
  successfulJobsHistoryLimit: 96
  failedJobsHistoryLimit: 96
  # NOT suspended during the 2026-07-16 org spend-cap outage: --reconcile
  # never calls the Claude SDK (no CLAUDE_CODE_OAUTH_TOKEN in this template),
  # so it's unaffected by the cap, and pausing it would leave pr-steward
  # merges on skip-listed repos stuck at `implemented` for the outage
  # window. See gitops#593 / PR #599 review discussion.
  suspend: true
  workflowSpec:
    workflowTemplateRef:
      name: mctl-agents-reconcile
      clusterScope: true
