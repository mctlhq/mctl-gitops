apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: remove-custom-domain
  annotations:
    workflows.argoproj.io/description: |
      Remove a custom domain from a service:
        1. Remove domain from ingress.hosts in values.yaml
        2. Clean up custom TLS hosts
        3. Commit to gitops repo → ArgoCD syncs
        4. Callback to Backstage to delete the domain record
spec:
  entrypoint: remove-domain-pipeline
  serviceAccountName: argo-workflow-sa

  arguments:
    parameters:
      - name: team_name
      - name: service_name
      - name: domain

  templates:
    - name: remove-domain-pipeline
      dag:
        tasks:
          - name: remove-domain
            template: do-remove-domain

    - name: do-remove-domain
      inputs:
        parameters:
          - name: team_name
            value: "{{workflow.parameters.team_name}}"
          - name: service_name
            value: "{{workflow.parameters.service_name}}"
          - name: domain
            value: "{{workflow.parameters.domain}}"
      script:
        image: alpine:3.19
        command: [sh]
        envFrom:
          - configMapRef:
              name: mctl-platform-config
        env:
          # Workflow params injected as env vars so the shell layer can
          # quote them: direct {{inputs.parameters.*}} interpolation into
          # the script body is a shell-injection vector, and this pod now
          # also holds the Backstage token (same hardening as
          # wft-add-custom-domain).
          - name: PARAM_TEAM
            value: "{{inputs.parameters.team_name}}"
          - name: PARAM_SERVICE
            value: "{{inputs.parameters.service_name}}"
          - name: PARAM_DOMAIN
            value: "{{inputs.parameters.domain}}"
          # Backstage external-access token (subject mctl-api): the
          # custom-domains routes this script calls are auth-gated since
          # mctl-portal#89. Same optional bridge as wft-add-custom-domain:
          # in the tenant namespace the secret deliberately does not exist;
          # once mctl-api routes this template to the argo-workflows
          # namespace the token resolves here.
          - name: BACKSTAGE_TOKEN
            valueFrom:
              secretKeyRef:
                name: backstage-workflow-token
                key: BACKSTAGE_TOKEN
                optional: true
        source: |
          set -e
          apk add --no-cache curl git openssh-client yq > /dev/null 2>&1

          TEAM="$PARAM_TEAM"
          SERVICE="$PARAM_SERVICE"
          DOMAIN="$PARAM_DOMAIN"
          BACKSTAGE_URL="http://backstage.backstage.svc.cluster.local:7007"

          # ── Set up SSH for git ─────────────────────────────────────────────
          mkdir -p ~/.ssh
          cp /secrets/deploy-key/ssh-privatekey ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host github.com\n  Hostname ssh.github.com\n  Port 443\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking no\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # ── Clone mctl-gitops ────────────────────────────────────────────────
          git clone --depth=1 "git@github.com:${GITOPS_ORG}/${GITOPS_REPO}.git" /tmp/mctl-gitops
          cd /tmp/mctl-gitops
          git config user.name "argo-workflows[bot]"
          git config user.email "argo-workflows[bot]@users.noreply.github.com"

          SVC_VALUES="platform-gitops/services/${TEAM}/${SERVICE}/values.yaml"
          if [ ! -f "$SVC_VALUES" ]; then
            echo "❌ Service not found: ${TEAM}/${SERVICE}"
            exit 1
          fi

          # ── Remove domain from ingress.hosts ───────────────────────────────
          echo "📝 Removing ${DOMAIN} from ingress.hosts..."
          yq eval -i "del(.ingress.hosts[] | select(. == \"${DOMAIN}\"))" "$SVC_VALUES"

          # ── Remove domain from custom TLS hosts ────────────────────────────
          CUSTOM_TLS_NAME="${SERVICE}-custom-tls"
          yq eval -i "del((.ingress.tls[] | select(.secretName == \"${CUSTOM_TLS_NAME}\")).hosts[] | select(. == \"${DOMAIN}\"))" "$SVC_VALUES" 2>/dev/null || true

          # If custom TLS has no more hosts, remove the entry entirely
          REMAINING=$(yq eval "(.ingress.tls[] | select(.secretName == \"${CUSTOM_TLS_NAME}\")).hosts | length" "$SVC_VALUES" 2>/dev/null || echo "0")
          if [ "$REMAINING" = "0" ]; then
            yq eval -i "del(.ingress.tls[] | select(.secretName == \"${CUSTOM_TLS_NAME}\"))" "$SVC_VALUES" 2>/dev/null || true
            # Also remove the Certificate resource
            CERT_DIR="platform-gitops/services/${TEAM}/${SERVICE}"
            rm -f "${CERT_DIR}/custom-domain-cert-"*.yaml 2>/dev/null || true
          fi

          # ── Commit and push ────────────────────────────────────────────────
          # Nothing-to-commit is NOT a full no-op: a rerun after "push
          # succeeded, Backstage callback failed" lands here, and exiting
          # early would leave the stale domain record behind. Skip the
          # commit/push, but always fall through to the callback.
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️  Nothing to commit — domain was not in ingress; reconciling Backstage record"
          else
            git commit -m "feat: remove custom domain ${DOMAIN} from ${TEAM}/${SERVICE}"
            PUSHED=false
            for i in $(seq 1 5); do
              if git push origin HEAD:main; then
                echo "✅ Pushed — ArgoCD will sync"
                PUSHED=true
                break
              fi
              git pull --rebase origin main
            done
            if [ "$PUSHED" != "true" ]; then
              echo "❌ git push failed after 5 attempts — aborting before the Backstage callback" >&2
              echo "   (deleting the Backstage record without the ingress commit would orphan the live ingress entry)" >&2
              exit 1
            fi
          fi

          # ── Callback to Backstage to delete domain record ──────────────────
          # Auth-gated routes (mctl-portal#89). -f: a 401/403 must fail loud
          # here, not silently leave the record behind. The id is extracted
          # with yq from the entry whose .domain matches — the old grep
          # pipeline threw away every field except id and then grepped for
          # the domain, so it never matched UUID ids and the DELETE never
          # fired at all.
          echo "📡 Notifying Backstage..."
          DOMAIN_DATA=$(curl -sSf -H "Authorization: Bearer ${BACKSTAGE_TOKEN}" "${BACKSTAGE_URL}/api/custom-domains/domains?team=${TEAM}&service=${SERVICE}")
          DOMAIN_ID=$(echo "$DOMAIN_DATA" | yq -p=json ".domains[] | select(.domain == \"${DOMAIN}\") | .id" -)
          [ "$DOMAIN_ID" = "null" ] && DOMAIN_ID=""
          if [ -n "$DOMAIN_ID" ]; then
            # A DELETE failure stays a hard failure — the ingress change is
            # already pushed, so a lingering record must surface, and a
            # rerun skips straight past the (now no-op) git section back
            # here. A missing record, by contrast, is the rerun success
            # case: it was already deleted.
            curl -sSf -X DELETE -H "Authorization: Bearer ${BACKSTAGE_TOKEN}" "${BACKSTAGE_URL}/api/custom-domains/domains/${DOMAIN_ID}"
            echo "✅ Backstage domain record deleted"
          else
            echo "ℹ️  No Backstage record for ${DOMAIN} — already deleted"
          fi

          echo "🎉 Custom domain ${DOMAIN} removed from ${TEAM}/${SERVICE}"
        volumeMounts:
          - name: deploy-key
            mountPath: /secrets/deploy-key
      volumes:
        - name: deploy-key
          secret:
            secretName: mctl-gitops-deploy-key
