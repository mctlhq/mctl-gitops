apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: preview-delete
  annotations:
    workflows.argoproj.io/description: |
      Delete a preview environment by running helm uninstall on the preview
      release in {team}-preview. Also checks the legacy production namespace
      for leftovers from before ROADMAP 3.1.
spec:
  entrypoint: delete-pipeline
  serviceAccountName: argo-workflow-sa

  arguments:
    parameters:
      - name: team_name
      - name: component_name
      - name: preview_id

  templates:
    - name: delete-pipeline
      dag:
        tasks:
          - name: delete-preview
            template: delete

    - name: delete
      inputs:
        parameters:
          - name: team_name
            value: "{{workflow.parameters.team_name}}"
          - name: component_name
            value: "{{workflow.parameters.component_name}}"
          - name: preview_id
            value: "{{workflow.parameters.preview_id}}"
      script:
        image: alpine/helm:3.16.4
        command: [sh]
        env:
          - name: PARAM_TEAM_NAME
            value: "{{inputs.parameters.team_name}}"
          - name: PARAM_COMPONENT_NAME
            value: "{{inputs.parameters.component_name}}"
          - name: PARAM_PREVIEW_ID
            value: "{{inputs.parameters.preview_id}}"
        source: |
          set -euo pipefail

          # Parameters arrive as env, never interpolated into this
          # script's text. An Argo placeholder is substituted BEFORE sh
          # parses the line (this comment cannot show one literally —
          # Argo would substitute it here too), so a value containing a
          # quote and a semicolon runs as a command, in a pod that is
          # root with the gitops deploy key mounted. gitops#992.
          # The whole block is bound, not just the parameters the
          # operations registry happens to constrain: a reader should not
          # have to cross-check the registry to know which line is safe.
          TEAM="$PARAM_TEAM_NAME"
          COMPONENT="$PARAM_COMPONENT_NAME"
          PREVIEW_ID="$PARAM_PREVIEW_ID"
          RELEASE="preview-${COMPONENT}-${PREVIEW_ID}"
          NS_PREVIEW="${TEAM}-preview"

          uninstalled=""
          if helm status "${RELEASE}" -n "${NS_PREVIEW}" > /dev/null 2>&1; then
            helm uninstall "${RELEASE}" -n "${NS_PREVIEW}" --wait
            echo "Preview release ${RELEASE} uninstalled from namespace ${NS_PREVIEW}"
            uninstalled=1
          fi
          # Leftovers from before ROADMAP 3.1 lived in the production namespace.
          if helm status "${RELEASE}" -n "${TEAM}" > /dev/null 2>&1; then
            helm uninstall "${RELEASE}" -n "${TEAM}" --wait
            echo "Preview release ${RELEASE} uninstalled from legacy namespace ${TEAM}"
            uninstalled=1
          fi
          if [ -z "${uninstalled}" ]; then
            echo "Release ${RELEASE} not found in ${NS_PREVIEW} or ${TEAM} — already deleted or never existed"
          fi
