apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: preview-delete
  annotations:
    workflows.argoproj.io/description: |
      Delete a preview environment by running helm uninstall on the preview
      release in {team}-preview. Also checks the legacy production namespace
      for leftovers from before ROADMAP 3.1.
spec:
  entrypoint: delete-pipeline
  serviceAccountName: argo-workflow-sa
  # Pod Security "restricted": this workflow runs in the tenant namespace
  # (mctl-api operations.WorkflowNamespace), which is moving from
  # enforce=baseline to restricted (handoff audit, block B step 3). The pod
  # securityContext covers every container; container-level fields are not
  # inherited from it, so podSpecPatch adds them to Argo's own init and wait
  # containers (argoexec runs as root by default) and to main. HOME=/tmp
  # because python, alpine/k8s and alpine/git have no passwd entry for uid
  # 1000; steps that use ssh run mctl-workflow-tools, which has one.
  # Templates reached through templateRef (tpl-*, the completion hook) run
  # under this spec too.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  podSpecPatch: |
    initContainers:
      - name: init
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
    containers:
      - name: wait
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      - name: main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: HOME
            value: /tmp

  arguments:
    parameters:
      - name: team_name
      - name: component_name
      - name: preview_id

  templates:
    - name: delete-pipeline
      dag:
        tasks:
          - name: delete-preview
            template: delete

    - name: delete
      inputs:
        parameters:
          - name: team_name
            value: "{{workflow.parameters.team_name}}"
          - name: component_name
            value: "{{workflow.parameters.component_name}}"
          - name: preview_id
            value: "{{workflow.parameters.preview_id}}"
      script:
        # mctl-workflow-tools, not alpine/helm: the TLS cleanup below needs
        # kubectl as well as helm. Same digest preview-deploy pins.
        image: ghcr.io/mctlhq/mctl-workflow-tools:1.0.0@sha256:5e367f737d4bffaa1b6ea04a29681dc760fd476790f80bf93cbc4571d4ccfe6b
        command: [sh]
        env:
          - name: PARAM_TEAM_NAME
            value: "{{inputs.parameters.team_name}}"
          - name: PARAM_COMPONENT_NAME
            value: "{{inputs.parameters.component_name}}"
          - name: PARAM_PREVIEW_ID
            value: "{{inputs.parameters.preview_id}}"
        source: |
          set -euo pipefail

          # Parameters arrive as env, never interpolated into this
          # script's text. An Argo placeholder is substituted BEFORE sh
          # parses the line (this comment cannot show one literally —
          # Argo would substitute it here too), so a value containing a
          # quote and a semicolon runs as a command, in a pod that is
          # root with the gitops deploy key mounted. gitops#992.
          # The whole block is bound, not just the parameters the
          # operations registry happens to constrain: a reader should not
          # have to cross-check the registry to know which line is safe.
          TEAM="$PARAM_TEAM_NAME"
          COMPONENT="$PARAM_COMPONENT_NAME"
          PREVIEW_ID="$PARAM_PREVIEW_ID"
          RELEASE="preview-${COMPONENT}-${PREVIEW_ID}"
          NS_PREVIEW="${TEAM}-preview"

          uninstalled=""
          if helm status "${RELEASE}" -n "${NS_PREVIEW}" > /dev/null 2>&1; then
            helm uninstall "${RELEASE}" -n "${NS_PREVIEW}" --wait
            echo "Preview release ${RELEASE} uninstalled from namespace ${NS_PREVIEW}"
            uninstalled=1
          fi
          # Leftovers from before ROADMAP 3.1 lived in the production namespace.
          if helm status "${RELEASE}" -n "${TEAM}" > /dev/null 2>&1; then
            helm uninstall "${RELEASE}" -n "${TEAM}" --wait
            echo "Preview release ${RELEASE} uninstalled from legacy namespace ${TEAM}"
            uninstalled=1
          fi
          if [ -z "${uninstalled}" ]; then
            echo "Release ${RELEASE} not found in ${NS_PREVIEW} or ${TEAM} — already deleted or never existed"
          fi

          # preview-deploy sets ingress.tls[0].secretName=${RELEASE}-tls.
          # cert-manager creates that Secret for the Ingress's Certificate
          # and does not delete it with the Certificate, so helm uninstall
          # leaves it behind. Runs whether or not the release was found, so
          # it also removes Secrets orphaned by earlier deletes. Any error
          # other than not-found fails the step (set -e).
          kubectl delete secret "${RELEASE}-tls" -n "${NS_PREVIEW}" --ignore-not-found
