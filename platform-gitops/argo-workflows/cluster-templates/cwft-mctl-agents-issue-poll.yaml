apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: mctl-agents-issue-poll
  annotations:
    workflows.argoproj.io/description: |
      Issue-driven entry point — Phase 5 Temporal dispatcher.

      Scans every open issue under the mctlhq org carrying the
      `agents:intake` label and starts one Temporal `DevLoopWorkflow` per
      issue, then removes the label so the next tick does not re-dispatch.

      This template used to run the whole investigation in-process: it
      SSH-cloned mctl-gitops, ran the Claude Agent SDK per issue to write a
      proposal triplet under agents-state/<svc>/proposals/<slug>/, and
      committed the result back to gitops main. Since mctl-agents 1.23.0
      (PR #106) none of that happens here — `run_issue_poller` only
      discovers labelled issues and hands each one to Temporal. The actual
      investigate → approve → implement → review pipeline, including the
      account-2 OAuth rate-limit fallback, now lives inside
      `DevLoopWorkflow` and the CWFTs it submits.

      Consequently this template no longer needs: a gitops clone, the
      deploy key, a workdir PVC, a Claude OAuth token (it makes no SDK
      call, so it cannot hit a 429 and has nothing to fall back to), or a
      commit-and-push step (it writes no files). What remains is one
      short-lived pod doing `gh search` + a Temporal RPC per issue.

      Runs:
        1. poll — orchestrator/run_issue_poller.py. It `gh search`-es for
           labelled issues, starts (or attaches to) each issue's
           DevLoopWorkflow via Temporal, then removes the label.

      Triggered by:
        - cron via CronWorkflow `mctl-agents-issue-poll`
        - operator submitting a one-shot Workflow that references this CWFT
spec:
  serviceAccountName: argo-workflow-sa
  imagePullSecrets:
    - name: ghcr-credentials
  # Promtail maps these pod labels to the Loki `app` and `team` labels. Argo
  # pods otherwise cannot be found through mctl_get_service_logs during an
  # incident (incident-17841555). They also give NetworkPolicy a selector
  # that picks out agent pods without catching platform workflows
  # (deploy-service, create-tenant, ...) that share this namespace.
  podMetadata:
    labels:
      app.kubernetes.io/name: mctl-agents
      mctl.ai/team: admins
  ttlStrategy:
    secondsAfterCompletion: 86400
  # A poll is now a `gh search` plus one Temporal RPC per issue — seconds,
  # not minutes. Bounded well below the 15-min cron interval so a wedged
  # network call cannot hold concurrencyPolicy=Forbid across ticks and
  # silently suppress later intake (incident-17841222). Was 1800 when this
  # template still ran a Claude SDK session per labelled issue.
  activeDeadlineSeconds: 600
  entrypoint: poll-issues
  onExit: notify-telegram
  # NB: no `mctl-gitops-main-writes` mutex anywhere in this template. It
  # used to be held by commit-and-push, the only step that wrote to gitops
  # main; the poller no longer writes any files, so there is nothing to
  # serialise against the other agent workflows.

  arguments:
    parameters:
      - name: agent_image
        value: ghcr.io/mctlhq/mctl-agents:1.27.0
        # Default = today's pin, so submitting without this parameter is a
        # zero-behaviour-change no-op. Overridden by the agent registry's
        # resolved image_ref once a caller starts pinning per-run.
        # NB: 1.23.0 is the first tag whose run_issue_poller dispatches to
        # Temporal. Earlier tags investigate in-process and expect the
        # gitops clone + workdir PVC this template no longer provides, so
        # pinning this parameter backwards will fail rather than degrade.
      - name: agent_version
        value: ""
        # Registry version string, carried for the record only — not
        # consumed by run-poller. Left blank by any caller not yet using
        # the registry.

  # No volumeClaimTemplates and no deploy-key volume: nothing here clones a
  # repo or writes a file any more. Dropping the 4Gi PVC also removes a
  # Hetzner volume attach/detach cycle per run — those wedge for 10-12h with
  # no cancel API and were caught 8 times in July 2026 alone.

  templates:
    - name: poll-issues
      steps:
        - - name: poll
            template: run-poller
            # No continueOn: there is no later step whose success could mask
            # a poller failure, so a non-zero exit must fail the workflow
            # outright. That is what makes {{workflow.status}} trustworthy
            # for notify-telegram below, and is why the old
            # /workdir/poller_status side-channel is gone.

    # ── Run issue-poller orchestrator ─────────────────────────────────────
    - name: run-poller
      container:
        image: "{{workflow.parameters.agent_image}}"
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh"]
        args:
          - "sh"
          - "-c"
          - |
            set -e
            # GITHUB_TOKEN is mandatory: the poller searches for labelled
            # issues and removes the label once dispatched. The secretKeyRef
            # is marked optional so the pod still schedules for local/offline
            # debugging — fail fast here with a clear message instead of an
            # opaque `gh` auth error from deep inside Python.
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "❌ GITHUB_TOKEN is not set — the poller needs it to search issues and relabel" >&2
              exit 1
            fi
            # Wire git's HTTPS credential helper to GITHUB_TOKEN so any git
            # op authenticates non-interactively.
            gh auth setup-git
            # `exec` is safe here, unlike the pre-1.23.0 version of this
            # template: with continueOn gone from the step above, the exit
            # code propagates straight to {{workflow.status}} instead of
            # being swallowed.
            exec python -m orchestrator.run_issue_poller
        env:
          # Temporal connection. These match run_issue_poller's own defaults
          # (orchestrator/temporal/start.py) and the values mctl-agents-worker
          # already runs with — set explicitly so the dispatch target is
          # visible here rather than buried in a Python default.
          - name: TEMPORAL_ADDRESS
            value: temporal-frontend.temporal.svc.cluster.local:7233
          - name: TEMPORAL_NAMESPACE
            value: mctl-agents
          # GitHub PAT for `gh search issues` and
          # `gh issue edit --remove-label`. Needs repo read on the target
          # repos plus `issues: write`.
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: mctl-agents-secrets
                key: github-token
                optional: true
          # No CLAUDE_CODE_OAUTH_TOKEN, MCTL_TOKEN, STATE_DIR, TMPDIR or
          # ISSUE_INVESTIGATOR_BUDGET_USD: this step makes no Claude SDK
          # call, reads no gitops state, clones no repo, and has no budget
          # to cap.
        resources:
          # Trimmed from 2000m/4Gi, which sized a Claude SDK session plus a
          # repo clone. This process now does one `gh search` and a handful
          # of gRPC calls.
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 1000m, memory: 512Mi }

    # ── Telegram + incident notification (onExit) ─────────────────────────
    - name: notify-telegram
      script:
        image: alpine:3.19
        command: [sh]
        env:
          - name: TG_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: mctl-agents-secrets
                key: telegram-bot-token
                optional: true
          - name: TG_CHAT_ID
            valueFrom:
              secretKeyRef:
                name: mctl-agents-secrets
                key: telegram-chat-id
                optional: true
          - name: MCTL_TOKEN
            valueFrom:
              secretKeyRef:
                name: mctl-agents-secrets
                key: mctl-token
                optional: true
          - name: WORKFLOW_STATUS
            value: "{{workflow.status}}"
          # Identifies which CWFT this onExit handler belongs to — used to
          # namespace the incident fingerprint below so run/implement/shepherd
          # failures never collide with each other.
          - name: WORKFLOW_TEMPLATE_KIND
            value: "issue-poll"
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: WORKFLOW_DURATION
            value: "{{workflow.duration}}"
        source: |
          set +e
          apk add --no-cache curl ca-certificates jq >/dev/null 2>&1

          # NB: this handler used to read /workdir/activity and
          # /workdir/poller_status off a shared PVC — deliberately, NOT via
          # Argo output parameters, because a SECOND
          # `workflow.outputs.parameters.*` reference sourced from a
          # different step broke Argo's static validator workflow-wide on
          # 2026-07-06 and silently stopped every CronWorkflow from
          # scheduling. Both files are gone now, and neither is needed:
          #   - poller_status existed only because the poll step ran with
          #     continueOn, so a crash could still leave the workflow
          #     Succeeded. That continueOn is gone, so WORKFLOW_STATUS is
          #     the truth on its own.
          #   - activity ("did we commit anything") existed to mute the
          #     steady-state no-op tick. The CronWorkflow's dispatcher
          #     pre-check now runs the same `gh search` BEFORE submitting
          #     and only creates this Workflow when something is actually
          #     labelled, so a run reaching this point always had work to do.
          # If this template ever regains a second step that must report
          # something to this handler, use a PVC file again — not a second
          # output parameter.

          # Stable dedup key. One poll cycle sweeps every labelled issue in a
          # single run — there is no per-run distinguishing parameter, so this
          # is a fixed key: all issue-poll failures collapse into a single
          # recurring incident.
          FINGERPRINT="workflow_failed:${WORKFLOW_TEMPLATE_KIND}"

          case "$WORKFLOW_STATUS" in
            Succeeded) ICON="✅" ;;
            Failed)    ICON="❌" ;;
            Error)     ICON="⚠️" ;;
            *)         ICON="⏳" ;;
          esac
          UI_URL="https://workflows.mctl.ai/workflows/argo-workflows/${WORKFLOW_NAME}"
          TEXT=$(printf '%s mctl-agents: issue-poll — %s (%ss)\n%s' \
            "$ICON" "$WORKFLOW_STATUS" "$WORKFLOW_DURATION" "$UI_URL")

          # Telegram leg. JSON-encode the body via jq so a quote / newline /
          # backslash cannot malform the payload and silently drop it.
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            TG_BODY=$(jq -nc --arg chat "$TG_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: $chat, text: $text, disable_web_page_preview: true}')
            curl -s -o /dev/null -w 'telegram http=%{http_code}\n' \
              -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$TG_BODY"
          else
            echo "ℹ️  TG_BOT_TOKEN or TG_CHAT_ID not set; skipping Telegram leg."
          fi

          # Incident leg — only on terminal failure/success.
          if { [ "$WORKFLOW_STATUS" = "Failed" ] || [ "$WORKFLOW_STATUS" = "Error" ]; } && [ -n "$MCTL_TOKEN" ]; then
            # Suffix the id with epoch-second so `argo retry <wf>` produces a
            # fresh incident. Real cross-run dedup happens via `fingerprint`.
            INCIDENT_ID="argo-${WORKFLOW_NAME}-$(date +%s)"
            SUMMARY="mctl-agents issue-poll ${WORKFLOW_STATUS} after ${WORKFLOW_DURATION}s — ${UI_URL}"
            BODY=$(jq -nc --arg id "$INCIDENT_ID" --arg summary "$SUMMARY" --arg fingerprint "$FINGERPRINT" '{
              id: $id,
              source: "argo-workflows",
              type: "workflow_failed",
              tenant: "admins",
              service: "mctl-agents",
              summary: $summary,
              severity: "warning",
              # "analyzing", not "open": the incident-responder discovery
              # query only picks up status=analyzing, and nothing in mctl-api
              # ever promotes open->analyzing — a status of "open" here means
              # the incident sits unanalyzed forever (observed 2026-07-12:
              # 6 self-reported workflow_failed incidents never picked up).
              status: "analyzing",
              fingerprint: $fingerprint
            }')
            curl -s -o /dev/null -w 'incident http=%{http_code}\n' \
              -X POST "https://api.mctl.ai/api/v1/incidents" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${MCTL_TOKEN}" \
              -d "$BODY"
          elif [ "$WORKFLOW_STATUS" = "Succeeded" ] && [ -n "$MCTL_TOKEN" ]; then
            # Close the loop: issue-poll succeeded, so resolve any open
            # incident sharing this fingerprint. No-op if none exists.
            RESOLVE_BODY=$(jq -nc --arg tenant "admins" --arg fingerprint "$FINGERPRINT" '{tenant: $tenant, fingerprint: $fingerprint}')
            curl -s -o /dev/null -w 'resolve http=%{http_code}\n' \
              -X POST "https://api.mctl.ai/api/v1/incidents/resolve-by-fingerprint" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${MCTL_TOKEN}" \
              -d "$RESOLVE_BODY"
          else
            echo "ℹ️  Workflow ${WORKFLOW_STATUS} or MCTL_TOKEN missing; skipping incident leg."
          fi
          exit 0
