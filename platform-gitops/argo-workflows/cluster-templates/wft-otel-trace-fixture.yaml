apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: otel-trace-fixture
  annotations:
    workflows.argoproj.io/description: |
      issue-903 (mctl-gitops half): emits the committed representative
      DevLoop trace fixtures (tests/fixtures/devloop-trace.json and
      devloop-trace-redaction.json, materialized into the otel-trace-fixture
      ConfigMap by scripts/materialize-otel-trace-fixture.py) as real OTLP
      spans against otel-collector.monitoring.svc.cluster.local:4318, so the
      trace-backend comparison under mctlhq/mctl-gitops#1280 has a real,
      reproducible span stream to compare candidates against instead of a
      one-off manual curl. Each execution gets fresh trace and span ids so
      repeated runs are distinguishable in a candidate's UI.

      This template is registered but not scheduled: there is no
      CronWorkflow, and submitting it does nothing to the collector's
      exporter configuration -- that is otelCollector.backends, a separate
      values edit. Every parameter is bound through env: and read via
      os.environ rather than interpolated into the script body
      (scripts/validate-shell-param-interpolation.py enforces this
      repository-wide).
spec:
  serviceAccountName: argo-workflow-sa
  entrypoint: emit-fixture-traces
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterCompletion: 3600

  arguments:
    parameters:
      - name: rate_per_second
        value: "5"
      - name: duration_minutes
        value: "1"
      - name: execution_count
        value: "10"
      - name: fixture
        value: devloop-trace.json

  templates:
    - name: emit-fixture-traces
      inputs:
        parameters:
          - name: rate_per_second
            value: "{{workflow.parameters.rate_per_second}}"
          - name: duration_minutes
            value: "{{workflow.parameters.duration_minutes}}"
          - name: execution_count
            value: "{{workflow.parameters.execution_count}}"
          - name: fixture
            value: "{{workflow.parameters.fixture}}"
      script:
        image: python:3.12-alpine
        command: [python3]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 65534
        env:
          # Bound through env: and read via os.environ[...] in the script
          # body below -- never interpolated as {{inputs.parameters.*}} text
          # -- so scripts/validate-shell-param-interpolation.py stays green
          # with no new BASELINE entry.
          - name: RATE_PER_SECOND
            value: "{{inputs.parameters.rate_per_second}}"
          - name: DURATION_MINUTES
            value: "{{inputs.parameters.duration_minutes}}"
          - name: EXECUTION_COUNT
            value: "{{inputs.parameters.execution_count}}"
          - name: FIXTURE
            value: "{{inputs.parameters.fixture}}"
          - name: OTLP_ENDPOINT
            value: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
        volumeMounts:
          - name: fixtures
            mountPath: /fixtures
            readOnly: true
        source: |
          import copy
          import json
          import os
          import secrets
          import time
          import urllib.request

          rate_per_second = float(os.environ["RATE_PER_SECOND"])
          duration_minutes = float(os.environ["DURATION_MINUTES"])
          execution_count = int(os.environ["EXECUTION_COUNT"])
          fixture_name = os.environ["FIXTURE"]
          endpoint = os.environ["OTLP_ENDPOINT"]

          with open(os.path.join("/fixtures", fixture_name)) as fh:
              template = json.load(fh)

          deadline = time.monotonic() + duration_minutes * 60
          interval = 1.0 / rate_per_second if rate_per_second > 0 else 0
          sent = 0
          failed = 0

          # Reference point for shifting the fixture's baked-in timestamps to
          # "now" on every execution, while preserving relative span timing
          # (durations and inter-span offsets, including the two-execution
          # fixture's ~10-minute gap).
          reference_start_ns = min(
              (
                  int(span["startTimeUnixNano"])
                  for rs in template.get("resourceSpans", [])
                  for scope in rs.get("scopeSpans", [])
                  for span in scope.get("spans", [])
                  if span.get("startTimeUnixNano") is not None
              ),
              default=0,
          )

          for i in range(execution_count):
              if time.monotonic() > deadline:
                  print(f"duration_minutes elapsed after {sent} execution(s)")
                  break
              payload = copy.deepcopy(template)
              id_map = {}
              offset_ns = time.time_ns() - reference_start_ns
              for rs in payload.get("resourceSpans", []):
                  for scope in rs.get("scopeSpans", []):
                      for span in scope.get("spans", []):
                          for field, nbytes in (("traceId", 16), ("spanId", 8)):
                              old = span.get(field)
                              if old is None:
                                  continue
                              if old not in id_map:
                                  id_map[old] = secrets.token_hex(nbytes)
                              span[field] = id_map[old]
                          parent = span.get("parentSpanId")
                          if parent is not None and parent in id_map:
                              span["parentSpanId"] = id_map[parent]
                          for field in ("startTimeUnixNano", "endTimeUnixNano"):
                              value = span.get(field)
                              if value is not None:
                                  span[field] = str(int(value) + offset_ns)

              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  endpoint, data=body, method="POST",
                  headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      print(f"execution {i}: {resp.status}")
                  sent += 1
              except Exception as exc:
                  print(f"execution {i}: FAILED ({exc})")
                  failed += 1
              if interval:
                  time.sleep(interval)

          print(f"otel-trace-fixture: sent {sent} execution(s), {failed} failed, of {fixture_name} to {endpoint}")
          if failed and not sent:
              raise SystemExit(
                  f"otel-trace-fixture: all {failed} execution(s) failed to reach {endpoint}"
              )
      volumes:
        - name: fixtures
          configMap:
            name: otel-trace-fixture
