apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: tpl-vault-write
  annotations:
    workflows.argoproj.io/description: |
      Reusable template: writes secrets to Vault using Kubernetes auth.
      Merges new secrets with existing ones (new values win on conflict).
spec:
  templates:
    - name: write-service-secrets
      inputs:
        parameters:
          - name: team_name
          - name: component_name
          - name: secret_env_vars    # KEY=value newline-separated
      script:
        image: alpine:3.19
        command: [sh]
        source: |
          set -e
          apk add --no-cache curl python3 > /dev/null 2>&1
          TEAM="$PARAM_TEAM_NAME"
          SERVICE="$PARAM_COMPONENT_NAME"
          SECRET_TEXT="$PARAM_SECRET_ENV_VARS"
          VAULT_PATH="secret/data/teams/${TEAM}/${SERVICE}"

          echo "🔐 Authenticating with Vault (Kubernetes auth)..."
          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          VAULT_TOKEN=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"role\":\"argo-workflow\",\"jwt\":\"${SA_TOKEN}\"}" \
            "${VAULT_ADDR}/v1/auth/kubernetes/login" | \
            grep '"client_token"' | sed 's/.*"client_token":"\([^"]*\)".*/\1/')

          if [ -z "$VAULT_TOKEN" ]; then
            echo "❌ Failed to authenticate with Vault"
            exit 1
          fi
          export VAULT_TOKEN
          echo "✅ Authenticated"

          # ── Parse KEY=value lines into JSON ─────────────────────────────────
          JSON_DATA="{"
          FIRST=true
          while IFS='=' read -r key rest; do
            # Skip empty lines and comments
            [ -z "$key" ] && continue
            echo "$key" | grep -q '^#' && continue
            key=$(echo "$key" | xargs)
            value=$(echo "$rest" | xargs)
            [ -z "$key" ] && continue

            # Escape double-quotes in value
            value_escaped=$(echo "$value" | sed 's/"/\\"/g')

            if [ "$FIRST" = "true" ]; then
              JSON_DATA="${JSON_DATA}\"${key}\":\"${value_escaped}\""
              FIRST=false
            else
              JSON_DATA="${JSON_DATA},\"${key}\":\"${value_escaped}\""
            fi
          done <<SECRETS_EOF
          $PARAM_SECRET_ENV_VARS
          SECRETS_EOF

          JSON_DATA="${JSON_DATA}}"

          # ── Merge with existing secrets ──────────────────────────────────────
          EXISTING_JSON="{}"
          HTTP_GET=$(curl -sS -o /tmp/vault-get.json -w "%{http_code}" \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "${VAULT_ADDR}/v1/${VAULT_PATH}")

          if [ "$HTTP_GET" = "200" ]; then
            # KV v2 response: {"data":{"data":{...},"metadata":{...}}}
            # Extract the inner .data.data object using python3
            EXISTING_JSON=$(python3 -c \
              "import json; d=json.load(open('/tmp/vault-get.json')); print(json.dumps(d.get('data',{}).get('data',{})))" \
              2>/dev/null || echo "{}")
            echo "ℹ️  Merging with existing secrets"
          elif [ "$HTTP_GET" = "404" ]; then
            echo "ℹ️  Creating new secret path"
          else
            echo "⚠️  Could not read existing secrets (HTTP $HTTP_GET) — will write fresh"
          fi

          # Merge: existing keys + new keys (new values win on conflict)
          MERGED_JSON=$(python3 -c \
            "import json; e=json.loads('$EXISTING_JSON'); n=json.loads('$JSON_DATA'); e.update(n); print(json.dumps(e))" \
            2>/dev/null || echo "$JSON_DATA")

          # ── Write to Vault ───────────────────────────────────────────────────
          HTTP_CODE=$(curl -sS -o /tmp/vault-write.json -w "%{http_code}" \
            -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"data\":${MERGED_JSON}}" \
            "${VAULT_ADDR}/v1/${VAULT_PATH}")

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "❌ Failed to save secrets (HTTP $HTTP_CODE)"
            cat /tmp/vault-write.json || true
            exit 1
          fi

          echo "✅ Secrets saved to Vault at ${VAULT_PATH}"
        env:
          - name: VAULT_ADDR
            value: "http://vault.vault.svc.cluster.local:8200"
          - name: PARAM_SECRET_ENV_VARS
            value: "{{inputs.parameters.secret_env_vars}}"
          - name: PARAM_TEAM_NAME
            value: "{{inputs.parameters.team_name}}"
          - name: PARAM_COMPONENT_NAME
            value: "{{inputs.parameters.component_name}}"

    # Same result as write-service-secrets, but the values never pass
    # through a workflow parameter. mctl-api puts them in a Kubernetes
    # Secret in the workflow's namespace, owned by the Workflow (so it is
    # deleted with it), and passes only that Secret's name. A parameter is
    # plain data on the Workflow object and in the pod spec for as long as
    # either exists; a mounted file is neither.
    #
    # Parsing matches write-service-secrets: KEY=value lines, blank lines
    # and '#' lines skipped, key and value trimmed, one pair of matching
    # surrounding quotes removed from the value. Differences, both
    # deliberate: an invalid key fails the step before anything is written,
    # and a read of the existing secret that is neither 200 nor 404 fails
    # the step instead of overwriting every key already stored.
    - name: write-service-secrets-from-secret
      inputs:
        parameters:
          - name: team_name
          - name: component_name
          - name: secret_name   # Secret with key secret_env_vars
      volumes:
        - name: secret-env
          secret:
            secretName: "{{inputs.parameters.secret_name}}"
            items:
              - key: secret_env_vars
                path: secret_env_vars
      script:
        image: python:3.12-alpine
        command: [python3]
        volumeMounts:
          - name: secret-env
            mountPath: /run/secret-env
            readOnly: true
        env:
          - name: VAULT_ADDR
            value: "http://vault.vault.svc.cluster.local:8200"
          - name: PARAM_TEAM_NAME
            value: "{{inputs.parameters.team_name}}"
          - name: PARAM_COMPONENT_NAME
            value: "{{inputs.parameters.component_name}}"
        source: |
          import json, os, re, sys, urllib.error, urllib.request

          VAULT_ADDR = os.environ["VAULT_ADDR"]
          TEAM = os.environ["PARAM_TEAM_NAME"]
          SERVICE = os.environ["PARAM_COMPONENT_NAME"]
          NAME = re.compile(r"^[a-z0-9][a-z0-9-]{0,62}$")
          if not NAME.match(TEAM) or not NAME.match(SERVICE):
              sys.exit("invalid team_name or component_name")
          PATH = f"secret/data/teams/{TEAM}/{SERVICE}"
          KEY = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")

          with open("/run/secret-env/secret_env_vars", encoding="utf-8") as f:
              text = f.read()
          new = {}
          for n, line in enumerate(text.splitlines(), 1):
              key, _, value = line.partition("=")
              key = key.strip()
              if not key or key.startswith("#"):
                  continue
              if not KEY.match(key):
                  sys.exit(f"line {n}: key is not a valid environment variable name")
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1]
              new[key] = value
          if not new:
              sys.exit("no KEY=value lines in the handed-off secret")

          def call(method, path, token=None, body=None):
              req = urllib.request.Request(f"{VAULT_ADDR}/v1/{path}", method=method,
                                           data=None if body is None else json.dumps(body).encode())
              req.add_header("Content-Type", "application/json")
              if token:
                  req.add_header("X-Vault-Token", token)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, b""

          with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
              jwt = f.read().strip()
          status, body = call("POST", "auth/kubernetes/login",
                              body={"role": "argo-workflow", "jwt": jwt})
          if status != 200:
              sys.exit(f"Vault login failed (HTTP {status})")
          token = json.loads(body)["auth"]["client_token"]

          status, body = call("GET", PATH, token)
          if status == 200:
              existing = json.loads(body).get("data", {}).get("data") or {}
              print("Merging with existing secrets")
          elif status == 404:
              existing = {}
              print("Creating new secret path")
          else:
              sys.exit(f"Could not read existing secrets (HTTP {status}); not overwriting them")
          existing.update(new)

          status, _ = call("POST", PATH, token, {"data": existing})
          if status not in (200, 204):
              sys.exit(f"Failed to save secrets (HTTP {status})")
          print(f"Saved {len(new)} key(s) to Vault at {PATH}: {', '.join(sorted(new))}")

    - name: write-platform-secret
      inputs:
        parameters:
          - name: vault_path        # e.g. "teams/payments/myapp/database"
          - name: json_data         # JSON string: '{"key":"val"}'
      script:
        image: alpine:3.19
        command: [sh]
        source: |
          set -e
          apk add --no-cache curl > /dev/null 2>&1
          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          VAULT_TOKEN=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"role\":\"argo-workflow\",\"jwt\":\"${SA_TOKEN}\"}" \
            "${VAULT_ADDR}/v1/auth/kubernetes/login" | \
            grep '"client_token"' | sed 's/.*"client_token":"\([^"]*\)".*/\1/')
          export VAULT_TOKEN

          # vault_path lands in a URL: reject anything but a plain relative path.
          case "$PARAM_VAULT_PATH" in
            ""|/*|*..*|*[!A-Za-z0-9/_-]*)
              echo "❌ invalid vault_path"
              exit 1
              ;;
          esac

          HTTP_CODE=$(printf '{"data":%s}' "$PARAM_JSON_DATA" | curl -sS -o /tmp/vault-write.json -w "%{http_code}" \
            -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "${VAULT_ADDR}/v1/secret/data/${PARAM_VAULT_PATH}")

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "❌ Vault write failed (HTTP $HTTP_CODE)"
            cat /tmp/vault-write.json || true
            exit 1
          fi
          echo "✅ Saved to Vault: ${PARAM_VAULT_PATH}"
        env:
          - name: VAULT_ADDR
            value: "http://vault.vault.svc.cluster.local:8200"
          - name: PARAM_VAULT_PATH
            value: "{{inputs.parameters.vault_path}}"
          - name: PARAM_JSON_DATA
            value: "{{inputs.parameters.json_data}}"

    - name: delete-service-secrets
      inputs:
        parameters:
          - name: team_name
          - name: component_name
      script:
        image: alpine:3.19
        command: [sh]
        source: |
          set -e
          apk add --no-cache curl > /dev/null 2>&1
          TEAM="$PARAM_TEAM_NAME"
          SERVICE="$PARAM_COMPONENT_NAME"

          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          VAULT_TOKEN=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"role\":\"argo-workflow\",\"jwt\":\"${SA_TOKEN}\"}" \
            "${VAULT_ADDR}/v1/auth/kubernetes/login" | \
            grep '"client_token"' | sed 's/.*"client_token":"\([^"]*\)".*/\1/')
          export VAULT_TOKEN

          echo "🗑️  Deleting Vault secrets for ${TEAM}/${SERVICE}..."

          # Delete all versions + metadata
          for path in \
            "secret/metadata/teams/${TEAM}/${SERVICE}" \
            "secret/metadata/teams/${TEAM}/${SERVICE}/repo-pat"; do

            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X DELETE \
              -H "X-Vault-Token: $VAULT_TOKEN" \
              "${VAULT_ADDR}/v1/${path}")

            if [ "$HTTP" = "204" ] || [ "$HTTP" = "404" ]; then
              echo "  ✅ ${path}"
            else
              echo "  ⚠️  ${path} returned HTTP ${HTTP}"
            fi
          done

          echo "✅ Vault cleanup done"
        env:
          - name: VAULT_ADDR
            value: "http://vault.vault.svc.cluster.local:8200"
          - name: PARAM_TEAM_NAME
            value: "{{inputs.parameters.team_name}}"
          - name: PARAM_COMPONENT_NAME
            value: "{{inputs.parameters.component_name}}"
