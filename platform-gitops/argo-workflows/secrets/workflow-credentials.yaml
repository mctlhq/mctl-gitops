# The two credentials tenant workflows use, from Vault instead of Secrets
# created by hand. Both were applied with kubectl, so their values also sat in
# a `kubectl.kubernetes.io/last-applied-configuration` annotation, and the
# Reflector annotations that decide where they are copied lived only on the
# live objects.
#
#   mctl-gitops-deploy-key  SSH deploy key with write access to mctl-gitops
#                           (tpl-validate-tenant clones, tpl-git-commit and
#                           the platform workflows push).
#                           Vault: secret/platform/argo-workflows/gitops-deploy-key,
#                           property ssh-privatekey.
#   github-actions-pat      Token that dispatches build-image.yaml and reads
#                           its runs (wft-deploy-service, wft-preview-deploy).
#                           A fine-grained token with Actions read/write on
#                           mctlhq/mctl-gitops is enough.
#                           Vault: secret/platform/argo-workflows/github-actions-pat,
#                           property token.
#
# These are the argo-workflows copies. Tenant namespaces, where mctl-api
# submits deploy-service, preview-deploy, provision-database and
# retire-service (operations.WorkflowNamespace), get their own ExternalSecrets
# for the same Vault paths from the tenant chart
# (helm-charts/tenant/templates/argo-workflow.yaml), so a namespace holds them
# exactly while its tenant exists. They were Reflector copies of these
# Secrets, limited by a namespace list here that create-tenant and
# delete-tenant had to maintain (gitops#1850). Reflection is now switched
# off explicitly, not just left unannotated: the live Secrets still carry the
# old annotations until the template overwrites them, and turning it off is
# what makes Reflector delete its copies (the tenant ExternalSecrets recreate
# them).
#
# A missing Vault property leaves the existing Secret as it is (ESO does not
# delete on a failed read), so merging this before Vault holds the values
# changes nothing.
#
# Rotation: write the new value to Vault, then annotate the ExternalSecret
# with force-sync=$(date +%s) (or wait refreshInterval), here and in every
# tenant namespace (the ExternalSecrets of the same name). For the deploy key, register the new public key on mctl-gitops
# (write access) BEFORE writing Vault and remove the old one after the copies
# carry the new value; for the token, revoke the old one after.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-gitops-deploy-key
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-gitops-deploy-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "false"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "false"
  data:
    - secretKey: ssh-privatekey
      remoteRef:
        key: platform/argo-workflows/gitops-deploy-key
        property: ssh-privatekey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-actions-pat
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: github-actions-pat
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "false"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "false"
  data:
    - secretKey: token
      remoteRef:
        key: platform/argo-workflows/github-actions-pat
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
