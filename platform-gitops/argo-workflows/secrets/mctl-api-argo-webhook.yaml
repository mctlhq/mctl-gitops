# HMAC secret for the global workflow-completion hook that POSTs to
# mctl-api /api/v1/workflows/events/argo-complete (SOC F13).
# Same Vault path mctl-api reads via mctl-api-secrets (gitops#826).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-argo-webhook
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-argo-webhook
    creationPolicy: Owner
  data:
    - secretKey: ARGO_WEBHOOK_SECRET
      remoteRef:
        key: platform/mctl-api/argo-webhook
        property: secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
