---
# Bot token for the mctl-agents scout digest (mctlhq/mctl-agents#797).
#
# The scout sends through @MCTL_AI_bot (owner decision 2026-10-25), whose
# token's single source of truth is secret/platform/mctl-telegram/login. This
# reference is used instead of a copy in secret/platform/mctl-agents, so a
# rotation of the login bot reaches the scout within refreshInterval and no
# second copy can drift.
#
# Only cwft-mctl-agents-scout.yaml mounts this Secret. The scout calls
# sendMessage only. The bot's webhook belongs to the mctl-agent operator
# channel (agent.mctl.ai), so getUpdates, deleteWebhook and setWebhook must
# never be called with this token.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-agents-scout-telegram
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-agents-scout-telegram
    creationPolicy: Owner
  data:
    - secretKey: bot-token
      remoteRef:
        key: platform/mctl-telegram/login
        property: TELEGRAM_LOGIN_BOT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
