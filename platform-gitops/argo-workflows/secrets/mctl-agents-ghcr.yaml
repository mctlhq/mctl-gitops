---
# GHCR pull credentials for mctl-agents image (private repo).
# Mirrors the per-tenant pattern from
# bootstrap/templates/mctl-platform/mctl-agent-secrets.yaml — same Vault
# key, same docker-config-json shape, same target name. Lets argo-workflows
# pods pull ghcr.io/mctlhq/mctl-agents:* (and any other private mctlhq image).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-agents-ghcr
  namespace: argo-workflows
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  # conversionStrategy / decodingStrategy / metadataPolicy below are ESO's own
  # CRD defaults, spelled out on purpose: ignoring them instead via a
  # `.spec.data[].remoteRef.*` jq path is what wedges an Application under
  # ServerSideApply + RespectIgnoreDifferences — the array can then never
  # shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO version
  # pinned in core-infra/external-secrets.yaml.
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
