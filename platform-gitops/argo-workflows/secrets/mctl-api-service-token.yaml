# mctl-api service-principal bearer token for workflow-to-API callbacks
# (wft-add-custom-domain: POST /api/v1/domains/verify, PATCH
# /api/v1/domains/{id}). Same Vault value mctl-api itself validates as
# MCTL_AGENT_SERVICE_TOKEN — see
# platform-gitops/bootstrap/templates/mctl-platform/mctl-api-secrets.yaml
# lines ~39-42. This is a platform-tier credential: it must never be
# replicated into a tenant namespace, since a tenant service account can
# read secrets in its own namespace and would inherit the mctl-agent
# principal's access across all of mctl-api. It lives only in
# argo-workflows, for the same reason backstage-workflow-token does.
# Rotation ordering: rotate the Vault value at
# platform/mctl-agent/tokens#mctl-api-token first (mctl-api and this
# ExternalSecret both read the same path and pick up the new value within
# refreshInterval), then confirm mctl-api accepts it before relying on any
# in-flight add-custom-domain run — do not rotate mctl-api's own copy
# independently of this one, the two must always agree.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-api-service-token
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-api-service-token
    creationPolicy: Owner
  data:
    - secretKey: MCTL_API_TOKEN
      remoteRef:
        key: platform/mctl-agent/tokens
        property: mctl-api-token
        # ESO's own CRD defaults, spelled out on purpose — omitting them
        # wedges the Application under ServerSideApply +
        # RespectIgnoreDifferences (#789, argo-cd#17694). Every ExternalSecret
        # in this namespace carries the same three lines.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
