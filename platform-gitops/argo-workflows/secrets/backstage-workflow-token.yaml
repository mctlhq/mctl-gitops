# Backstage external-access static token (subject mctl-api, restricted to
# the custom-domains plugin) for Argo workflows that call Backstage —
# wft-add-custom-domain's domain-list lookup and activate callback.
# Required since mctl-portal#89 gates those routes (issue mctl-gitops#920):
# the plugin's isWorkflowCaller only admits this external identity.
# Same Vault path Backstage itself reads BACKSTAGE_TOKEN from.
#
# Rotation runbook: rotating platform/mctl-api/backstage-token needs the
# BACKSTAGE side updated FIRST (Backstage reads the token into env at pod
# start — restart/redeploy it after writing the new value to Vault), then
# these ExternalSecrets converge within refreshInterval (1h; annotate the
# ExternalSecret with force-sync to hurry). During the gap, workflow pods
# still send the OLD token and Backstage rejects it — the curls are
# fail-loud (-sSf), so an activate during a mid-rotation window fails
# visibly instead of leaving a silently-pending domain.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-workflow-token
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backstage-workflow-token
    creationPolicy: Owner
  data:
    - secretKey: BACKSTAGE_TOKEN
      remoteRef:
        key: platform/mctl-api/backstage-token
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
