# Tenant-namespace copies of the Backstage workflow token.
#
# add-custom-domain (and every other team-scoped operation) runs in the
# TENANT's namespace (mctl-api operations executor: WorkflowNamespace
# returns the team for anything not in its argo-workflows allowlist), so
# the wft's secretKeyRef resolves there — the argo-workflows-namespace
# ExternalSecret alone is invisible to those pods. Tenant SecretStores
# can't fetch this themselves: their Vault role only reads
# secret/data/teams/{tenant}/*, and this token lives under platform/.
# A platform-authored ClusterExternalSecret through the vault-backend
# ClusterSecretStore is the sanctioned way to baseline a platform secret
# into every tenant namespace (selector = the tenant label every tenant
# namespace carries).
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: backstage-workflow-token
spec:
  namespaceSelector:
    matchExpressions:
      - key: mctl.me/tenant
        operator: Exists
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-backend
    target:
      name: backstage-workflow-token
      creationPolicy: Owner
    data:
      - secretKey: BACKSTAGE_TOKEN
        remoteRef:
          key: platform/mctl-api/backstage-token
          property: token
          conversionStrategy: Default
          decodingStrategy: None
          metadataPolicy: None
