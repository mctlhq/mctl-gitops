# SSO RBAC: team onboarding-acceptance-test — scoped to team namespace only
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sso-team-onboarding-acceptance-test
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/rbac-rule: "'onboarding-acceptance-test' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "107"
---
apiVersion: v1
kind: Secret
metadata:
  name: sso-team-onboarding-acceptance-test.service-account-token
  namespace: argo-workflows
  annotations:
    kubernetes.io/service-account.name: sso-team-onboarding-acceptance-test
type: kubernetes.io/service-account-token
