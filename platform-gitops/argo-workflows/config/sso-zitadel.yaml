# The OIDC client of Argo Workflows in ZITADEL. ZITADEL generates the client
# secret, and the zitadel-iac Job (helm-charts/zitadel-iac/iac/workflows.tf)
# writes client-id and client-secret here with server-side apply as field
# manager `zitadel-iac`.
#
# Argo CD creates the Secret without data and never owns `.data`
# (ignoreDifferences in bootstrap/templates/core-infra/argo-workflows-config.yaml),
# so a sync does not wipe what the Job wrote. The Job may only read and patch
# this one Secret by name: no create, no list, nothing else in this namespace.
#
# Rollback to Dex: point server.sso in core-infra/argo-workflows.yaml back at
# the issuer https://ops.mctl.ai/api/dex and the Secret argo-workflows-sso
# (sso-secret.yaml), which stays in place until Dex is removed.
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-sso-zitadel
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: oidc-zitadel
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-iac-oidc-client
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: oidc-zitadel
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argo-workflows-sso-zitadel"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-iac-oidc-client
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: oidc-zitadel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-iac-oidc-client
subjects:
  - kind: ServiceAccount
    name: zitadel-iac
    namespace: zitadel
