# Ingress allowlist for the argo-workflows namespace.
#
# The Argo server already refuses unauthenticated calls (--auth-mode=sso,client;
# verified: /api/v1/* returns 401 from an unprivileged tenant pod, and a tenant's
# default ServiceAccount carries no Argo RBAC). This removes the network path as
# well, so reaching the workflow control plane is not merely an authorization
# question.
#
# Note this namespace also runs the workflow pods themselves, hence the
# intra-namespace rule: controller -> pod and pod -> pod (artifact passing,
# sidecar wait container) all stay inside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argo-workflows-ingress
  namespace: argo-workflows
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        # workflows.mctl.ai UI/API.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # mctl-api submits workflows on behalf of MCP/CLI callers.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mctl-api
        # admins runs the agent pipeline, which polls workflow status.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: admins
