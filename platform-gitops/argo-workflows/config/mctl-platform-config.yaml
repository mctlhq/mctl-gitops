# Platform configuration for Argo Workflow templates.
# Forks: edit these values to match your org — all workflow templates
# read from this ConfigMap via envFrom, so this is the single source of truth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mctl-platform-config
  namespace: argo-workflows
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: ""
data:
  # GitHub organization that owns the repos
  GITOPS_ORG: "mctlhq"
  # GitOps repository name
  GITOPS_REPO: "mctl-gitops"
  # Primary platform domain (auto-generated service hostnames use this)
  PLATFORM_DOMAIN: "mctl.ai"
  # Alternate/mirror domain (optional, leave empty to disable mirroring).
  # Emptied 2026-08-28: mctl.me is retired. It does not answer 410 for every
  # host — the mctl-landing-form worker 301s browsers to the matching .mctl.ai
  # host and returns 410 only to bot-like User-Agents, so a retirement check
  # that expects 410 unconditionally will see a 301 and misreport.
  # While this was set, tpl-git-commit mirrored each
  # service's hostname onto the dead domain and put it in the TLS block, so
  # every deploy re-added a SAN that cert-manager then had to keep renewing.
  # Leave empty unless a replacement mirror domain actually serves traffic.
  PLATFORM_DOMAIN_ALT: ""
  # Container registry prefix (images are pushed as {CONTAINER_REGISTRY}/{component}:{tag})
  CONTAINER_REGISTRY: "ghcr.io/mctlhq"
  # In-cluster base URL for mctl-api. wft-add-custom-domain calls
  # /api/v1/domains/verify and /api/v1/domains/{id} through this.
  MCTL_API_URL: "http://mctl-api.mctl-api.svc.cluster.local:8080"
