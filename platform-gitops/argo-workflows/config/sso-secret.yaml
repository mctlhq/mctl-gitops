---
# SSO credentials for Argo Workflows GitHub OAuth (via ArgoCD Dex)
# Vault path: platform/argo-workflows/sso
# Required keys: client-id, client-secret
# client-id  = "argo-workflows" (must match Dex staticClient id)
# client-secret = random string (must match Dex staticClient secret)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argo-workflows-sso
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argo-workflows-sso
    creationPolicy: Owner
  # conversionStrategy / decodingStrategy / metadataPolicy below are ESO's own
  # CRD defaults, spelled out on purpose: ignoring them instead via a
  # `.spec.data[].remoteRef.*` jq path is what wedges an Application under
  # ServerSideApply + RespectIgnoreDifferences — the array can then never
  # shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO version
  # pinned in core-infra/external-secrets.yaml.
  data:
    - secretKey: client-id
      remoteRef:
        key: platform/argo-workflows/sso
        property: client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client-secret
      remoteRef:
        key: platform/argo-workflows/sso
        property: client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
