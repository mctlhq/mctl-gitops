# Bounds compute held by mctl-agents pods in argo-workflows (gitops#2291, G6).
# Scoped by PriorityClass, so platform workflow pods (many declare no
# resources) are never counted or rejected. Inert until pods name the class
# (mctl-gitops#2299). No LimitRange is added on purpose.
# Sizing: sum of intended concurrent worst-case pods plus ~25% burst; see
# docs/runbooks/agent-compute-quota.md.
# No ephemeral-storage keys: the API server rejects requests/limits
# .ephemeral-storage under a PriorityClass scopeSelector ("unsupported scope
# applied to resource"), which failed the whole argo-workflows-config sync.
# Ephemeral storage stays bounded per pod by the agent templates' own limits
# (cwft-mctl-agents-daily sets none; see the runbook).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mctl-agents-compute
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hard:
    pods: "20"
    requests.cpu: "3"
    requests.memory: 16Gi
    limits.cpu: "36"
    limits.memory: 60Gi
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values:
          - mctl-agents-quota-scope
