# Tenant configuration for: mctl
# Created by: wft-create-tenant workflow
# Managed by: ArgoCD ApplicationSet (applicationset-tenants)
tenant:
  name: mctl
  displayName: "MCTL platform"
  description: "Scope for platform work items opened from surfaces (Telegram, portal); no workloads"
  contactEmail: ""
  members:
    - userId: mashkovd
      principalId: prn_01M39HRB7JRXZ2PHW5VVB695YZ
      role: owner
  # Keep an initial preview budget without reserving the full production profile.
  preview:
    quotas:
      requests.memory: "256Mi"
  quotas:
    requests.cpu: "100m"
    requests.memory: "128Mi"
    limits.cpu: "3"
    limits.memory: "4Gi"
    pods: "1"
    # Set to 0 on 2026-10-20: this tenant is documented as running no
    # workloads, so it keeps no volume allowance.
    persistentvolumeclaims: "0"
    requests.storage: "0"
    services: "10"
  limitRange:
    enabled: true
    default:
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "2"
      memory: "5Gi"
  networking:
    allowIntraNamespace: true
    allowClusterEgress: true
    allowInternetEgress: false
  # No workloads of its own; tenant workflow pods meet restricted since
  # #1964-#1969, and a server-side dry-run found no violating pods here or
  # in mctl-preview (ROADMAP 3.2, step 2).
  podSecurityLevel: "restricted"
