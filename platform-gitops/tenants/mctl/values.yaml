# Tenant configuration for: mctl
# Created by: wft-create-tenant workflow
# Managed by: ArgoCD ApplicationSet (applicationset-tenants)
tenant:
  name: mctl
  displayName: "MCTL platform"
  description: "Scope for platform work items opened from surfaces (Telegram, portal); no workloads"
  contactEmail: ""
  members:
    - userId: mashkovd
      role: owner
  quotas:
    requests.cpu: "100m"
    requests.memory: "128Mi"
    limits.cpu: "3"
    limits.memory: "4Gi"
    pods: "1"
    persistentvolumeclaims: "5"
    services: "10"
  limitRange:
    enabled: true
    default:
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "2"
      memory: "5Gi"
  networking:
    allowIntraNamespace: true
    allowClusterEgress: true
    allowInternetEgress: false
