# Tenant configuration for: erpact
# Created by: wft-create-tenant workflow
# Managed by: ArgoCD ApplicationSet (applicationset-tenants)
tenant:
  name: erpact
  displayName: "ERPact"
  description: "ERPact (Frappe/ERPNext construction ERP) - copy of the CLO production"
  contactEmail: ""
  members:
    - userId: mashkovd
      role: owner
    # GitHub logins, lowercased: the portal stores and looks them up in
    # lowercase, and mctl-api compares case-insensitively.
    - userId: obukhov23
      role: developer
    - userId: grerik
      role: developer
    - userId: octongues
      role: developer
  # Sized for two Frappe benches + MariaDB + Valkey + the site deployer
  # (requests ~550m/2.5Gi steady, ~840m/4.1Gi with every Job running at
  # once: two configure, two restore, one new-site). Limits sit well above
  # requests on purpose: Frappe idles low and bursts on page loads and
  # background jobs. One PVC in practice (erpact-data, 20Gi); the count
  # stays at the tenant default of 5.
  quotas:
    requests.cpu: "1500m"
    requests.memory: "5Gi"
    limits.cpu: "12"
    limits.memory: "9Gi"
    pods: "30"
    persistentvolumeclaims: "5"
    services: "20"
  limitRange:
    enabled: true
    default:
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "2"
      memory: "5Gi"
  networking:
    allowIntraNamespace: true
    allowClusterEgress: true
    allowInternetEgress: true
