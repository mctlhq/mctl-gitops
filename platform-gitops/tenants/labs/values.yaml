# Tenant configuration for: labs
# Created by: wft-create-tenant workflow
# Managed by: ArgoCD ApplicationSet (applicationset-tenants)
tenant:
  name: labs
  displayName: "labs"
  description: ""
  contactEmail: "mashkoffdmitry@gmail.com"
  members:
    - userId: mashkoffdmitry
      role: owner
  # labs already owns ghcr-credentials via services/labs/openclaw/values.yaml
  # extraExternalSecrets. A second Owner ExternalSecret here would fight it
  # for ownership of the same Secret — the exact collision that held the
  # admins-openclaw Application Degraded for 684 reconciliations over 7 days
  # (see services/admins/openclaw/values.yaml's extraExternalSecrets comment).
  ghcrCredentials:
    enabled: false
  quotas:
    # Bumped 2026-09-19 (3rd): projects-mcp deploy-service workflow's validate
    # pod (needs limits.cpu=1) went Pending — used was 11300m/12000m with 16
    # steady-state service pods, no workflow running yet. A rolling update
    # also briefly runs old+new replicas of the deployed service (another
    # 500m). Bump limits.cpu 12 -> 14 for ~2 cores headroom, matching the
    # margin the 2026-05-10 bump used for the same class of problem.
    #
    # Bumped 2026-05-10 (2nd): preview pod (pelican-proxy-pr-36) + workflow pod
    # exhausted limits.cpu (used 9100m/10000m) and limits.memory (9024Mi/9Gi)
    # and requests.memory (3920Mi/4Gi). Workflow needs limits.cpu=1, limits.memory=512Mi,
    # requests.memory=256Mi. Bump to limits.cpu=12, limits.memory=11Gi, requests.memory=5Gi
    # for ~2Gi/2000m headroom above current usage.
    #
    # Bumped 2026-05-10 (1st): requests.cpu 2 → 3 (validate pod needs 100m,
    # used was 1985m/2000m with preview pod in namespace).
    #
    # Bumped 2026-05-10: pelican-proxy preview env + workflow pods need headroom
    # beyond the 3Gi limit (used: 2896Mi, workflow pods request 256-384Mi each).
    # requests.memory 3Gi → 4Gi gives ~1Gi free for concurrent workflow + preview.
    #
    # Bumped 2026-05-08: 4 baseline service pods (kuptsi-app, openclaw,
    # trading-data, pelican-proxy) settle at ~5100m used → only 900m headroom
    # under the previous limits.cpu=6, which is below the 1000m a single
    # deploy-service workflow scaffold pod (validate / build-image / commit /
    # refresh-apps-appset) requests. CI/CD auto-deploys from
    # mashkoffdmitry/pelican-libertex-social were stuck Pending indefinitely.
    # Bump limits.cpu 6 → 8 (one extra workflow slot + buffer for a future 5th
    # service); requests.cpu 1500m → 2 keeps reserve symmetric.
    #
    # Earlier history (2026-05-06): bumped to fit kuptsi-app FastAPI +
    # Temporal worker alongside labs-openclaw (2600m / 1104Mi req).
    requests.cpu: "3"
    requests.memory: "6Gi"
    # Bumped 2026-09-25: pelican-proxy limits.cpu bumped 300m -> 1000m,
    # raising steady-state usage to 13050m. Deploy workflow refresh pod (needs 1 core)
    # exceeded 14 quota. Bump limits.cpu 14 -> 16 to provide ~3 cores headroom.
    limits.cpu: "16"
    # Bumped 2026-09-25: pelican-proxy-staging deployment brought steady-state
    # memory limit usage to 10528Mi. Workflow refresh pod (needs 512Mi) exceeded
    # 10.5Gi (10752Mi). Bump limits.memory 10.5Gi -> 14Gi and requests.memory 5Gi -> 6Gi.
    limits.memory: "14Gi"
    # Bumped 2026-09-25: 19/20 services deployed. Raised pods 25 → 30 and services 20 → 25
    # for pelican-proxy-staging and future expansion.
    pods: "30"
    persistentvolumeclaims: "2"
    services: "25"
  limitRange:
    enabled: true
    default:
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "50m"
      memory: "128Mi"
    max:
      cpu: "3"
      memory: "3Gi"
  networking:
    allowIntraNamespace: true
    allowClusterEgress: true
    allowInternetEgress: true
