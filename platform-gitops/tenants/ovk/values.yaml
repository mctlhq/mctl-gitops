# Tenant configuration for: ovk
# Created by: wft-create-tenant workflow
# Managed by: ArgoCD ApplicationSet (applicationset-tenants)
tenant:
  name: ovk
  displayName: "ovk"
  description: "medicine"
  # Blanked 2026-10-04: personal data does not belong in this public
  # repository (#1627).
  contactEmail: ""
  members:
    - userId: mctl-reviewer
      role: owner
    - userId: mashkovd
      role: owner
  # The tenant chart owns ghcr-credentials here again: services/ovk/openclaw
  # used to own it via extraExternalSecrets and was removed with openclaw.
  # Its Application's cascade deletes that ExternalSecret and its Secret; this
  # one then (re)creates the Secret. Running pods are unaffected (pull secrets
  # are read at image pull time only).
  ghcrCredentials:
    enabled: true
  quotas:
    # Bumped 2026-08-15: kube-state-metrics "namespace quota is going to be
    # full" fired (incident 8c23258d) — used was 490m/500m (98%). openclaw's
    # steady requests already consume nearly the whole allowance, leaving no
    # room for a single workflow/rollout pod.
    requests.cpu: "750m"
    requests.memory: "1500Mi"
    # Bumped 2026-05-13: openclaw sidecar limit increase (s3-sync 2000m +
    # skills-fanout 300m) brings pod limits to 5300m; bumped from 5 to 6
    # to accommodate new sidecar limits with headroom.
    limits.cpu: "6"
    # Right-sized 2026-07: after the openclaw memory-limit trim (2560Mi ->
    # 1536Mi, mctl-gitops#532), steady-state usage is 1920Mi/4Gi (only
    # openclaw runs in this tenant currently). Lowered to 3Gi, keeping
    # ~1.1Gi headroom for workflow/rollout pods. Frees 1Gi of cluster-wide
    # memory-limit quota ceiling for onboarding more tenants
    # (docs/audit/PLATFORM_ASSESSMENT_2026-07.md capacity note).
    limits.memory: "3Gi"
    pods: "5"
    persistentvolumeclaims: "2"
    services: "5"
  limitRange:
    enabled: true
    default:
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "50m"
      memory: "128Mi"
    max:
      cpu: "3"
      memory: "5Gi"
  networking:
    allowIntraNamespace: true
    allowClusterEgress: true
    allowInternetEgress: true
