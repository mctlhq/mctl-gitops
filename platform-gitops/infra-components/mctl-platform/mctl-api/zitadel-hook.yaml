# The identity hook's configuration for mctl-api (ZITADEL_HOOK_*, mctl-web
# onboarding B1; mctlhq/mctl-api docs/zitadel-identity-hook.md). Everything in
# it is generated by ZITADEL (organization and IdP ids, target signing keys),
# so the zitadel-iac Job (helm-charts/zitadel-iac/iac/customers.tf) writes it
# here with server-side apply as field manager `zitadel-iac`.
#
# Argo CD creates the Secret without data and never owns `.data`
# (ignoreDifferences in bootstrap/templates/mctl-platform/mctl-api.yaml). The
# Job may only read and patch this one Secret by name.
#
# Nothing reads this Secret until the mctl-api Deployment references it, in a
# separate change; with the hook unconfigured mctl-api answers 503 on its
# endpoints.
apiVersion: v1
kind: Secret
metadata:
  name: mctl-api-zitadel-hook
  labels:
    app.kubernetes.io/name: mctl-api
    app.kubernetes.io/component: zitadel-hook
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-iac-zitadel-hook
  labels:
    app.kubernetes.io/name: mctl-api
    app.kubernetes.io/component: zitadel-hook
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mctl-api-zitadel-hook"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-iac-zitadel-hook
  labels:
    app.kubernetes.io/name: mctl-api
    app.kubernetes.io/component: zitadel-hook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-iac-zitadel-hook
subjects:
  - kind: ServiceAccount
    name: zitadel-iac
    namespace: zitadel
