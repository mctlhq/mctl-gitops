# Grafana accepts HTTP basic auth ([auth.basic], observability/monitoring.yaml)
# so that the grafana-iac Job can sign in as the server admin. That must work
# in-cluster only: this middleware removes the Authorization header from every
# request through the public ingress, so a password or a bearer token sent to
# grafana.mctl.ai never reaches Grafana. Browsers sign in through ZITADEL and
# carry a session cookie, which this leaves alone.
#
# Before it was enabled, nothing used Authorization on grafana.mctl.ai: Grafana
# had no service accounts or tokens (grafana_stat_total_service_accounts and
# _tokens 0 for 30 days), and the only successful authentications were the
# session cookie and generic_oauth (grafana_authn_* by client, 30 days).
#
# A header set to "" is removed, not sent empty (traefik headers middleware).
# Wave -2, before the Ingress (wave -1) that names it: traefik drops a router
# whose middleware does not exist.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-strip-authorization
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  headers:
    customRequestHeaders:
      Authorization: ""
