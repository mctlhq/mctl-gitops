# Grafana's pod admits connections only from:
#   - traefik, the public ingress, which strips Authorization (middleware.yaml);
#   - the grafana-iac Job, the one in-cluster client that uses basic auth;
#   - vmagent, which scrapes Grafana's /metrics (the chart's VMServiceScrape).
# Everything else is denied, including the gossip (9094) and profiling (6060)
# ports, so no other pod in the cluster can try the admin password or reach
# Grafana around the ingress. Kubelet probes are not affected. Grafana's own
# egress (shared-pg, VictoriaMetrics, Loki, ZITADEL) is not restricted here.
#
# Wave -1, with the Ingress: both are in place before the Grafana rollout
# (wave 0) that turns basic auth on.
#
# Rollback: delete this file. Grafana is then reachable from every pod again,
# which with basic auth on means the admin password could be tried from any
# namespace, so revert [auth.basic] in the same change.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: monitoring
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana-iac
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-iac
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 3000
