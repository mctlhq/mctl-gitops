# Scrape config for prometheus-pushgateway.
#
# Two bugs in the previous (out-of-GitOps) object each independently produced a
# scrape pool with 0 targets, so ScrapePoolHasNoTargets (namespace=monitoring,
# routed to mctl-agent) fired continuously and AlertManager re-notified every
# repeat_interval, spawning a fresh incident each cycle:
#   1. selector matched label `app: prometheus-pushgateway`, but the Service
#      carried no labels at all -> selected zero Services.
#   2. endpoint port was "9091" (a port NAME), but the Service port was
#      unnamed -> even on a match, the port would not resolve.
# Fixed by labelling + naming the Service port (see pushgateway.yaml) and
# referencing that port name here.
#
# This is the ONLY scrape of the pushgateway, deliberately. A pod-level
# VMPodScrape (`vm-rules/pushgateway-podscrape.yaml`) briefly existed to bypass
# the unlabelled Service above; once the Service was fixed, that podScrape
# scraped the same target a second time, so every metric pushed to the gateway
# landed as two series and every rule over it fired twice (issue #1159,
# VMPodScrape removed 2026-09). If this pool ever selects zero targets again,
# fix the Service (labels/port name), do not add a second scrape.
#
# honorLabels: true is load-bearing: it preserves the job/instance labels
# pushed to the gateway rather than overwriting them with the scrape's own
# labels. MctlTelegramCanaryStale keys off
# push_time_seconds{job="mctl_telegram_canary"} and the backup rules key off
# {job="vmbackup"} — without honorLabels those series would silently stop
# matching and the alerts would go absent instead of firing.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: prometheus-pushgateway
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: prometheus-pushgateway
  endpoints:
    - port: http
      honorLabels: true
