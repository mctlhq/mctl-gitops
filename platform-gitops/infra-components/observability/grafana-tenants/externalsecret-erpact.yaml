# The erpact VMUser's password (vmuser-erpact.yaml). Vault
# platform/grafana-tenants/erpact holds it as `metrics-password`; grafana-iac
# reads the same key for the erpact org's datasource (step 4). Created once
# by an admin with `vault kv put -cas=0`, so a rerun cannot overwrite it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-tenant-erpact-metrics
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-tenant-erpact-metrics
    creationPolicy: Owner
  # ESO's CRD defaults spelled out, as in secrets/loki-minio-externalsecret.yaml
  # (#789: never ignore .spec.data[] paths under ServerSideApply).
  data:
    - secretKey: password
      remoteRef:
        key: platform/grafana-tenants/erpact
        property: metrics-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
