# The probe targets. One VMProbe per job label, because the job label is what
# the alert rules match on and what makes a page legible at 03:00.
#
# vmagent runs with selectAllByDefault: true, so these are picked up without a
# selector on either side. The prober URL is the in-cluster Service; only the
# probe TARGET leaves the cluster.
---
# Reserved job name. mctl-telegram-alerts.yaml has carried a ServiceUnavailable
# alert on probe_success{job="mctl-telegram-healthz"} since it was written, and
# its comment says outright that it "requires a blackbox-exporter probe
# configured with job=mctl-telegram-healthz". Until now that probe did not
# exist, so the series did not exist, so the alert could never fire — a
# critical alert that had been silently inert. This is that probe; the rule is
# left untouched and starts working.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: mctl-telegram-healthz
  namespace: monitoring
spec:
  jobName: mctl-telegram-healthz
  interval: 60s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - https://tg.mctl.ai/healthz
---
# The platform's public front doors. mctl.ai is the zone that actually serves
# content — 750 757 of the account's 864 480 requests in the week of
# 2026-09-03 — and secrets.mctl.ai is Vault, whose unavailability breaks every
# ExternalSecret refresh in the cluster.
#
# On Vault and http_2xx, because it is the obvious objection: Vault's
# /v1/sys/health answers 429 on an unsealed STANDBY node, which under the
# vault Helm chart's default ingress would flap this alert against a perfectly
# healthy 3-node Raft cluster. It does not here. The ingress in the vault
# namespace backs secrets.mctl.ai with the `vault-active` Service, whose
# selector matches only the current leader, so a standby is never routed to
# and 20 consecutive probes returned 200.
#
# ?standbyok=true is therefore deliberately NOT set. It would make the probe
# succeed when there is no active node at all, which is exactly the condition
# worth paging on. The one thing this does catch is a leader election, during
# which vault-active has no endpoints and Traefik answers 503 — that is why
# PublicEndpointDown waits for three consecutive failures rather than one.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: platform-public-endpoints
  namespace: monitoring
spec:
  jobName: platform-public
  interval: 60s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - https://mctl.ai/
        - https://secrets.mctl.ai/v1/sys/health
---
# The two redirect zones. Their entire job is to answer 301 to mctl.ai, so the
# success condition is the 301 itself (module http_redirect, follow_redirects
# false). A 200 here would mean the apex redirect ruleset stopped firing.
#
# This is worth probing specifically. The weekly audit briefly and wrongly
# concluded these redirects were broken; the page rules that looked like they
# served them had been deleted as unreachable (#1089 decision 5) and the real
# mechanism is the apex ruleset plus the mctl-landing-form worker. Nothing was
# watching either mechanism. Now something is.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: redirect-zones
  namespace: monitoring
spec:
  jobName: redirect-zones
  # 120s, not 300s. A 300s scrape interval sits exactly on the default 5m
  # instant-vector lookback, so one delayed scrape makes the series look stale,
  # the expression evaluates to nothing, and the `for: 15m` timer resets — an
  # alert that quietly never fires. Same failure shape as the one this whole
  # component exists to fix.
  interval: 120s
  module: http_redirect
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - https://mctl.me/
        - https://mctl.ru/
---
# Forgejo (bootstrap/templates/data/forgejo.yaml). Its own job rather than a
# target in platform-public: git.mctl.ai is not a front door, so it pages at
# warning (vm-rules/forgejo-alerts.yaml), not PublicEndpointDown's critical.
# /api/healthz answers without a session even with REQUIRE_SIGNIN_VIEW, and
# returns non-2xx when Forgejo cannot reach its database.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: forgejo-healthz
  namespace: monitoring
spec:
  jobName: forgejo-healthz
  interval: 60s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - https://git.mctl.ai/api/healthz
---
# ZITADEL (bootstrap/templates/core-infra/zitadel.yaml). Its own job, like
# forgejo-healthz: auth.mctl.ai pages at warning (vm-rules/zitadel-alerts.yaml)
# until mctl-api and the platform sign-in depend on it. /debug/* is denied at
# the edge (identity/zitadel/debug-edge-deny.yaml), so the probe uses the OIDC
# discovery document: it needs the instance resolved from the database, so it
# covers pod, ingress, certificate and shared-pg together.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: zitadel-public
  namespace: monitoring
spec:
  jobName: zitadel-public
  interval: 60s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - https://auth.mctl.ai/.well-known/openid-configuration
        # The Login V2 UI is a separate Deployment behind its own Ingress; a
        # healthy API with a dead login page still means nobody can sign in.
        - https://auth.mctl.ai/ui/v2/login/healthy
---
# Tenant erpact: every site, discovered from the Ingresses in namespace erpact
# rather than listed here (#1773, audit finding OBS-012). The sites are created
# by ERPact's site deployer, which commits them to the private Forgejo
# repository git.mctl.ai/erpact/mctl-apps (bootstrap/templates/erpact/
# applications.yaml); nothing in this repository learns about a new one. The
# hand-kept list that used to be here had fallen three active sites behind,
# and a site made by mctl_erpact_create_site was never added. An Ingress is the
# one thing every site must have to be reachable at all, so following them
# gives a new site its probe on the next service-discovery refresh and drops a
# deleted site's probe with it, with no edit here.
#
# `ingress`, not the newer `kubernetes: [{role: ingress}]`: operator v0.68
# (chart 0.72.5) accepts both, but the CRD schema kubeconform validates against
# in CI knows only the older field, the same reason this file still uses
# `staticConfig` rather than `static`. Both move together when the operator
# reaches v0.71, which removes them.
#
# The keep rule repeats externalManifestNamespaces.erpact.hostPattern from
# bootstrap/values.yaml, which the admission policy already enforces on every
# Ingress host in erpact. Restating it here means the probe can only ever go to
# an erpact-*.mctl.ai name, whatever the tenant's repository writes. Every
# Ingress host in erpact is taken to be a Frappe site: a non-site Ingress added
# there later would fail /api/method/ping and needs a drop rule here.
#
# /api/method/ping is Frappe's unauthenticated liveness endpoint; it answers
# 200 only when nginx, gunicorn and the site's database all work, so it covers
# the whole bench, not just the ingress. The target URL is rebuilt from the
# host alone, so a site Ingress with several paths (or two Ingresses for one
# host) still yields one target, and the `ingress` label the operator adds is
# dropped for the same reason: one series per site. The operator also adds
# namespace="erpact", which makes these series visible to the tenant's own
# Grafana org (grafana-tenants/vmuser-erpact.yaml filters on it). The erpact
# Grafana dashboard reads job=~"erpact-.*"; alerts are in
# vm-rules/erpact-alerts.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: erpact-sites
  namespace: monitoring
spec:
  jobName: erpact-sites
  interval: 60s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    ingress:
      namespaceSelector:
        matchNames:
          - erpact
      relabelingConfigs:
        - sourceLabels: [__meta_kubernetes_ingress_host]
          regex: 'erpact-[a-z0-9]([a-z0-9-]*[a-z0-9])?\.mctl\.ai'
          action: keep
        - sourceLabels: [__meta_kubernetes_ingress_host]
          targetLabel: __param_target
          replacement: https://${1}/api/method/ping
        # Redundant with operator v0.68, which copies __param_target into
        # instance after these rules; stated so that the one-series-per-site
        # identity does not depend on that ordering.
        - sourceLabels: [__param_target]
          targetLabel: instance
        - regex: ingress
          action: labeldrop
---
# mctl-api through the edge. On 2026-10-09 the single mctl-api pod lost
# readiness at 07:23Z (its /readyz Vault check timed out from inside the pod
# while Vault itself answered the platform-public probe the whole time) and
# Traefik returned "no available server" for about five hours. Nothing fired:
# api.mctl.ai was not probed, and the kube-state rules sat behind `for`
# windows that the pod's brief returns to Ready kept resetting. This probe
# supplies MctlApiDown (vm-rules/mctl-api-alerts.yaml). /healthz is the
# liveness path, which is fine here: Traefik only routes to Ready endpoints,
# so an unready pod fails this probe just as it failed users.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: mctl-api-healthz
  namespace: monitoring
spec:
  jobName: mctl-api-healthz
  interval: 60s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - https://api.mctl.ai/healthz
---
# The platform's web entry points that had no probe (#1773, audit finding
# OBS-003): the developer portal, the docs, Argo CD, Grafana and mctl-agent.
# On 2026-10-10 the portal's own readiness probes timed out during the 09:51Z
# deploy and nothing outside the cluster recorded it. One job for all five,
# because they share one alert (PlatformWebEndpointDown in
# vm-rules/platform-web-alerts.yaml, routed to Telegram) and the instance label
# already names which one is down.
#
# Each target is an endpoint that answers without a session, so a healthy
# service is a 2xx and not a login page:
#   - app.mctl.ai: Backstage's root readiness check, the same path the pod's
#     startup, liveness and readiness probes use (mctl-platform/
#     mctl-portal.yaml). It answers 503 while the backend is starting or
#     shutting down, which is the outage this exists for.
#   - docs.mctl.ai: a static site (services/admins/mctl-docs); the page itself.
#   - ops.mctl.ai: Argo CD server's /healthz, the path its own probes use.
#   - grafana.mctl.ai: /api/health, which needs no session and answers non-2xx
#     when Grafana cannot reach its database (shared-pg).
#   - agent.mctl.ai: mctl-agent's liveness path. Liveness rather than /readyz
#     for the reason mctl-api-healthz gives: Traefik only routes to Ready
#     endpoints, so an unready pod fails this probe just as it fails callers.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: platform-web
  namespace: monitoring
spec:
  jobName: platform-web
  interval: 60s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - https://app.mctl.ai/.backstage/health/v1/readiness
        - https://docs.mctl.ai/
        - https://ops.mctl.ai/healthz
        - https://grafana.mctl.ai/api/health
        - https://agent.mctl.ai/healthz
