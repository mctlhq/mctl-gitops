apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: victoria-backup-r2
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: victoria-backup-r2
    creationPolicy: Owner
  # conversionStrategy / decodingStrategy / metadataPolicy below are ESO's own
  # CRD defaults, spelled out on purpose: ignoring them instead via a
  # `.spec.data[].remoteRef.*` jq path is what wedges an Application under
  # ServerSideApply + RespectIgnoreDifferences — the array can then never
  # shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO version
  # pinned in core-infra/external-secrets.yaml.
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secret/data/platform/victoria-backup
        property: AWS_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/data/platform/victoria-backup
        property: AWS_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: secret/data/platform/victoria-backup
        property: S3_ENDPOINT
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: BUCKET
      remoteRef:
        key: secret/data/platform/victoria-backup
        property: BUCKET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
