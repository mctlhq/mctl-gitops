---
# Read-only Cloudflare API token for the cloudflare-portal-health CronJob
# (infra-components/observability/blackbox/cloudflare-portal-health.yaml).
#
# Scope: account 6a09f637d20e1f66a8e9d45ebe778058, Account -> MCP Portals ->
# Read, nothing else. It is a separate token from the CF_PORTAL_READ_TOKEN
# repository secret that cloudflare-portal-health.yml uses, so either can be
# revoked without the other. The write token that re-snapshots a server
# (CF_APPLY_TOKEN_PORTAL) never comes into the cluster: that stays a
# dispatch-only job behind the cloudflare-apply environment's reviewer.
#
# Until the Vault path exists ESO cannot create the Secret, the CronJob's pods
# cannot start, nothing is pushed, and CloudflarePortalHealthStale fires:
# a missing credential reads as "could not check", never as "all ready".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-portal-health
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: cloudflare-portal-health
    creationPolicy: Owner
  # conversionStrategy / decodingStrategy / metadataPolicy are ESO's own CRD
  # defaults, spelled out for the reason loki-minio-externalsecret.yaml gives
  # (#789).
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: platform/cloudflare-portal-health
        property: api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
