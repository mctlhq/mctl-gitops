---
# Read-only Cloudflare API token for the r2-ops-budget CronJob
# (infra-components/observability/blackbox/r2-ops-budget.yaml).
#
# Scope: account 6a09f637d20e1f66a8e9d45ebe778058, Account -> Account
# Analytics -> Read, nothing else. It reads the GraphQL Analytics API; it can
# neither read an R2 object nor change anything. It is a separate token from
# cloudflare-portal-health's, so either can be revoked without the other.
#
# Until the Vault path exists ESO cannot create the Secret, the CronJob's pods
# cannot start, nothing is pushed, and R2OpsBudgetStale fires: a missing
# credential reads as "could not check", never as "within budget".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: r2-ops-budget
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: r2-ops-budget
    creationPolicy: Owner
  # conversionStrategy / decodingStrategy / metadataPolicy are ESO's own CRD
  # defaults, spelled out for the reason loki-minio-externalsecret.yaml gives
  # (#789).
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: platform/r2-ops-budget
        property: api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
