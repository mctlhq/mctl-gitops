# Alert rules for mctl-telegram Prometheus metrics.
#
# These rules require mctl-telegram v0.17+ (which exposes /metrics) and a
# Prometheus/VictoriaMetrics scrape job targeting the service. The
# ServiceUnavailable alert additionally requires a blackbox-exporter probe
# configured against /healthz.
#
# Threshold values are starting points; operators should tune them based on
# observed traffic patterns in their deployment.
#
# ZeroTraffic (rate(mctl_tool_invocations_total[15m]) == 0, "no tool
# invocations for 15 minutes") was retired 2026-07 — it predates the
# synthetic canary (mctl-telegram-canary.yaml) and, unlike the canary's
# alerts, wasn't sized to tolerate a single missed */10 canary run (its
# window was 15m/15m vs. the canary's 25-30m). It fired roughly daily on
# transient gaps that self-healed, with no action ever taken. The canary's
# MctlTelegramCanaryFailing/Stale/Absent alerts already cover "the service
# actually stopped working" with better precision (real probe pass/fail,
# not just "any traffic"). Do not re-add without cadence-aware thresholds.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: mctl-telegram-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: mctl-platform
    app.kubernetes.io/component: mctl-telegram
spec:
  groups:
    - name: mctl-telegram
      rules:
        - alert: JWTExpiredSpike
          expr: rate(mctl_auth_failures_total{reason="jwt_expired"}[5m]) > 0.1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: JWT expired failures spiking"
            description: >-
              The rate of JWT expired failures exceeds 0.1/s over 5 minutes.
              This may indicate mass token expiry or a clock skew issue between
              the issuer and mctl-telegram.

        - alert: JWTInvalidSpike
          expr: rate(mctl_auth_failures_total{reason=~"jwt_invalid.*|jwt_wrong.*|jwt_missing.*"}[5m]) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: JWT invalid/wrong audience failures spiking"
            description: >-
              The rate of JWT signature, issuer, or audience failures exceeds
              0.05/s over 5 minutes. Check whether the signing key or audience
              configuration has drifted.

        - alert: HighToolErrorRate
          # The window must outlast the canary's period. The canary CronJob
          # runs every 10 minutes, so on an idle service a [5m] window
          # regularly contains no invocations at all, the ratio evaluates to
          # 0/0, the series disappears and the alert resolves itself — while
          # the failure is still ongoing. Seen 2026-08-23: fired 07:14,
          # "resolved" 07:19, and the canary was still failing at 20:30.
          # [15m] always covers at least one full canary period.
          #
          # sum without(tool, status, traffic) on BOTH sides is what makes this a
          # ratio at all. Without it the division matches series on every
          # shared label — including `status` — so each error series was
          # divided by itself and the expression evaluated to exactly 1
          # whenever any tool had failed at all. The 0.1 threshold was
          # unreachable in the other direction: the alert meant "at least
          # one tool call errored in 15m", not "more than 10% are failing",
          # and fired most mornings with the service perfectly healthy.
          # Verified with promtool against 5 errors in 155 calls (3.2%):
          # the old expression returns 1, the new one 0.032.
          #
          # The denominator is status=~"ok|error" (mctl-telegram#757):
          # caller_error calls are requests refused as the caller's mistake,
          # which say nothing about the service's health either way.
          #
          # `traffic` (mctl-telegram#974: "canary" or "user") is aggregated
          # away too, so this alert keeps reading all traffic as one ratio as
          # it did before the label existed. Without it the ratio would split
          # per traffic class once the label ships, and a canary outage alone
          # would read as 100%.
          #
          # Aggregating away `tool` (not by tool) is deliberate: the
          # threshold is about the service's overall health, and a single
          # rarely-used tool failing twice should not read as "10% of tool
          # calls are failing". Instance labels are kept, so the preview
          # deployment's soak traffic stays a separate series and cannot
          # drag production over the threshold.
          expr: |
            sum without(tool, status, traffic) (
              rate(mctl_tool_invocations_total{status="error"}[15m])
            )
            /
            sum without(tool, status, traffic) (
              rate(mctl_tool_invocations_total{status=~"ok|error"}[15m])
            ) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: more than 10% of tool calls are failing"
            description: >-
              More than 10% of MCP tool invocations are returning errors over
              the last 15 minutes. Check mctl-telegram logs for the specific
              tools failing (tool label on mctl_tool_invocations_total).

        - alert: MctlTelegramCallerErrorShareHigh
          # HighToolErrorRate and the SLO read status=~"ok|error" only, so a
          # call classified caller_error (mctl-telegram#757) leaves both sides
          # of their ratios. That has one blind spot: a server-side regression
          # that turns EVERY call into a Telegram 400 (lost access hashes
          # answering PEER_ID_INVALID everywhere, say) empties the SLI instead
          # of burning it, and both stay quiet. This alert watches the share
          # itself (mctl-telegram#759).
          #
          # In normal traffic caller errors are about 1% of calls, so half of
          # them is far outside the noise. The other cause it catches is one
          # client looping on a bad argument, which is worth a look too.
          #
          # The [1h] window and the >= 20 calls floor keep a quiet hour with a
          # couple of bad calls (2 of 2 = 100%) from firing it. The
          # denominator lists all three status values, the allow-list the
          # SLO rules treat as a contract, so a status added later cannot
          # silently dilute the share.
          #
          # Aggregated by (job, namespace) like the SLO recording rules: a
          # share of the SERVICE's calls. instance is the pod IP, so keeping
          # it would split the share and the floor per replica, and a rollout
          # inside the hour would split it again; three pods each serving 15
          # refused calls would never reach the floor. (Preview exports no
          # mctl_tool_* series at all: its VMServiceScrape keeps only
          # mctl_agent_.*.)
          expr: |
            (
              sum by (job, namespace) (
                increase(mctl_tool_invocations_total{status="caller_error"}[1h])
              )
              /
              sum by (job, namespace) (
                increase(mctl_tool_invocations_total{status=~"ok|error|caller_error"}[1h])
              )
            ) > 0.5
            and
            sum by (job, namespace) (
              increase(mctl_tool_invocations_total{status=~"ok|error|caller_error"}[1h])
            ) >= 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: more than half of tool calls are caller errors"
            description: >-
              Over the last hour more than 50% of MCP tool invocations were
              classified caller_error, which the availability SLI and
              HighToolErrorRate do not count. Either one client is looping on
              a bad request, or a server-side regression makes Telegram refuse
              every call and the SLI cannot see it.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramcallererrorsharehigh"

        # The original rule was histogram_quantile over an unaggregated 5m rate:
        # one p95 per pod and tool, from a handful of calls. get_messages runs
        # about 12 times an hour, so two slow calls on one pod were a "p95".
        # It fired four times in a week (2026-10-24..31), always on
        # get_messages, and every slow call it saw was a Telegram FLOOD_WAIT
        # that borrowWithRetry sleeps through by design (up to 3 x 60s).
        #
        # Now, per job and tool over the last hour, the rule counts calls that
        # took longer than 5s (count minus the le="5" bucket) and subtracts
        # the FLOOD_WAIT events on that tool. It fires only when more than 5%
        # of at least 20 calls are slow for a reason other than flood waits.
        # Flood waits keep their own signal: MctlTelegramFloodWaitSpike in
        # mctl-telegram-ops.yaml, and since mctl-telegram 0.110.0 the
        # mctl_telegram_flood_wait_seconds{method} histogram and the
        # "telegram flood wait" log line.
        #
        # One flood event is subtracted per slow call even though a call can
        # retry up to three times, and a 1s wait is not slow. Both errors only
        # reduce the count, so a busy flood hour can hide a real slowdown.
        # That is the side to err on: flood waits page through the ops rule.
        #
        # The flood counter is a labelled counter with no series before its
        # first increment, so it falls back to zero ("or 0 * count").
        # Otherwise the subtraction would match nothing and the rule could
        # never fire for a tool that never flood-waited.
        #
        # Every term counts only pods that were already up an hour ago
        # ("and on (job, pod) (up offset 1h)"). VictoriaMetrics' increase()
        # treats a new series' first sample as growth, and after a restart
        # it does not do so the same way for every bucket series: the hour
        # after each restart read like "12 of 20 calls over 10s" when logs
        # showed 2 slow calls, both flood waits. The same trap is described
        # in mctl-alice-alerts.yaml. The cost is that a pod is not judged for
        # its first hour.
        #
        # Backtest on 2026-10-24..31: the old rule gave 47 points across 16
        # pod/tool series and fired 4 times. This rule gives one 5m point
        # (30.10 13:45Z, 8%). That point is a window edge: a flood event
        # counts when the wait starts, and the slow call counts when it ends
        # 30s later. It cannot last the 15m "for", so the rule would not have
        # fired.
        - alert: HighToolLatency
          expr: |
            (
              (
                sum by (job, tool) (increase(mctl_tool_invocation_duration_seconds_count[1h]) and on (job, pod) (up offset 1h))
                - sum by (job, tool) (increase(mctl_tool_invocation_duration_seconds_bucket{le="5"}[1h]) and on (job, pod) (up offset 1h))
                - (
                    sum by (job, tool) (increase(mctl_telegram_flood_wait_events_total[1h]) and on (job, pod) (up offset 1h))
                    or
                    0 * sum by (job, tool) (increase(mctl_tool_invocation_duration_seconds_count[1h]) and on (job, pod) (up offset 1h))
                  )
              )
              / sum by (job, tool) (increase(mctl_tool_invocation_duration_seconds_count[1h]) and on (job, pod) (up offset 1h))
            ) > 0.05
            and on (job, tool)
            sum by (job, tool) (increase(mctl_tool_invocation_duration_seconds_count[1h]) and on (job, pod) (up offset 1h)) >= 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: {{ $labels.tool }} calls are slow without a flood wait"
            description: >-
              Over the last hour, {{ $value | humanizePercentage }} of
              {{ $labels.tool }} calls took longer than 5 seconds, after
              subtracting the calls explained by Telegram FLOOD_WAIT. This
              holds over at least 20 calls. Slowdowns that flood waits do not
              explain point at MTProto round-trips, DC migration or
              reconnects, or the server itself. Compare with
              mctl_telegram_flood_wait_seconds and the "telegram flood wait"
              log line.

        - alert: RateLimitSpike
          expr: rate(mctl_rate_limit_events_total[5m]) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: rate limit events spiking"
            description: >-
              More than 1 rate-limit rejection per second over 5 minutes.
              A single client may be flooding requests or tokens may have
              been compromised.

        - alert: TelegramClientErrors
          expr: increase(mctl_telegram_client_errors_total[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: MTProto client exited with error"
            description: >-
              At least one Telegram MTProto client goroutine exited with a
              non-context-canceled error in the last 10 minutes. Check
              mctl-telegram logs for telegram client exit details.

        - alert: ServiceUnavailable
          # Requires a blackbox-exporter probe configured with
          # job="mctl-telegram-healthz" targeting /healthz.
          expr: probe_success{job="mctl-telegram-healthz"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "mctl-telegram: /healthz is failing"
            description: >-
              The mctl-telegram /healthz endpoint has been unreachable for
              more than 1 minute. The service may be down or network-isolated.

        # Login-flow alerts (mctl-telegram 0.39.0+). The metrics they watch
        # were added in source PR #219 to make the post-oidc_callback SendCode
        # stall observable; see the "mctl-telegram — Login Flow" Grafana
        # dashboard for the corresponding panels.
        - alert: MctlTelegramLoginSendCodeStalls
          # > 1 rather than >= 2: increase() extrapolates to a float, so an
          # exactly-two-timeout window can interpolate to e.g. 1.97 and miss a
          # >= 2 test. > 1 is rounding-safe and identical for integer counters.
          expr: sum(increase(mctl_login_phone_step_total{result="timeout"}[15m])) > 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: logins stalling at the SendCode step"
            description: >-
              Two or more enable_access phone steps hit the SendCode wait
              timeout in the last 15m. The connect/SendCode round-trip is
              stalling — check the "telegram login: connecting / connection
              established" breadcrumbs and the deferred "enable: telegram login
              failed" logs to localise the hang.

        - alert: MctlTelegramLoginSlow
          expr: |
            histogram_quantile(0.95,
              sum(rate(mctl_login_phone_to_code_duration_seconds_bucket[30m])) by (le)
            ) > 30
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: login SendCode p95 above 30s"
            description: >-
              The 95th-percentile connect + SendCode latency is approaching the
              90s enableSendCodeWait ceiling. Logins are degrading and will
              start timing out if this rises further.

        # Connector login funnel (mctl-telegram 0.109.0+, mctl-telegram#960,
        # epic mctlhq/.github#279). Every series these rules read is primed at
        # 0 when the server starts, so increase() sees the first occurrence
        # and no absent() companion is needed (an absent rule shipped next to
        # its producer is what fired falsely in mctl-gitops#2277).
        #
        # `sum by (job, ...)` drops pod and instance, which change on every
        # rollout, and keeps job, so the preview deployment stays a separate
        # series from production. Volume is low (a handful of grants a day),
        # so the thresholds are absolute counts rather than rates alone.
        - alert: MctlTelegramConnectorNoFirstCall
          # The 2026-10-30 "action discovery failed" shape: a connector
          # completes OAuth and then never makes a successful MCP call, e.g.
          # because it is configured with the wrong URL. At least two such
          # grants for one client in 6h, and at least half of that client's
          # decided grants, so a single user who connects and walks away
          # does not page. `unknown` outcomes are left out of both sides:
          # they are the funnel being blind, covered by
          # MctlTelegramConnectFunnelStoreErrors below.
          expr: |
            (
              sum by (job, client) (increase(mctl_connect_first_call_total{outcome="none_within_window"}[6h]))
              /
              sum by (job, client) (increase(mctl_connect_first_call_total{outcome=~"ok|none_within_window"}[6h]))
            ) >= 0.5
            and
            sum by (job, client) (increase(mctl_connect_first_call_total{outcome="none_within_window"}[6h])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: {{ $labels.client }} connectors get tokens but never make a call"
            description: >-
              At least half of the {{ $labels.client }} authorization_code
              grants in the last 6h were followed by no successful MCP call
              within 5 minutes. The connector is authenticating and then
              failing on its first request: check the connector URL (it must
              end in /mcp), mctl_root_mcp_requests_total, and the
              connect_first_call table.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#connectfirstcall"

        - alert: MctlTelegramConnectFunnelStoreErrors
          # The funnel records `unknown` instead of guessing when its store
          # fails; a sustained error rate means the alert above is blind.
          expr: sum by (job, op) (increase(mctl_connect_first_call_errors_total[1h])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: connect funnel store errors ({{ $labels.op }})"
            description: >-
              The connect first-call funnel hit more than two store errors
              on op {{ $labels.op }} in the last hour. Grant outcomes are
              being recorded as unknown, so MctlTelegramConnectorNoFirstCall
              cannot see a broken connector. Check the server logs for
              "connect funnel:" warnings and the database.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#connectfirstcall"

        - alert: MctlTelegramLoginExchangeFailing
          # Of the callback rejection reasons only exchange_failed is ours:
          # the server-side code-for-token exchange with Telegram (or the
          # id_token verification) failed after the user did everything
          # right. The others are user or client behaviour (cancel, reused
          # link, prefetch) and the canary adds one unknown_state per run,
          # so they are left to the runbook queries
          # (mctl-telegram docs/runbook.md#loginpathsignals), not paged on.
          expr: sum by (job) (increase(mctl_login_callback_rejected_total{reason="exchange_failed"}[30m])) > 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "mctl-telegram: Telegram sign-in token exchange is failing"
            description: >-
              Two or more Telegram OIDC returns in the last 30 minutes failed
              at the server-side token exchange (route label on
              mctl_login_callback_rejected_total says which flow). Users
              finish the Telegram step and still cannot sign in. Check the
              "telegram OIDC token exchange failed" and "connect: request
              rejected" log lines for the error, and Telegram's token
              endpoint and JWKS reachability.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#loginpathsignals"
