# Alerts on tenant erpact's site probes (blackbox/vmprobes.yaml, job
# erpact-sites). The environment is not production, so both are warnings; they
# exist so that a broken site is noticed before someone tries to use it.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: erpact-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: mctl-platform
    app.kubernetes.io/component: availability
spec:
  groups:
    - name: erpact.availability
      interval: 60s
      rules:
        - alert: ErpactSiteDown
          # Five consecutive failed probes at a 60s interval: rides out a pod
          # restart (the benches run one replica each) but not an outage.
          expr: probe_success{job="erpact-sites"} == 0
          for: 5m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact site {{ $labels.instance }} is down"
            description: >-
              {{ $labels.instance }} has not answered 2xx for 5 minutes. The
              probe goes through Cloudflare and Traefik to the site's bench in
              namespace erpact, and /api/method/ping needs nginx, gunicorn and
              the site's MariaDB database. Check probe_http_status_code (502/504
              point at the bench pods, 404 at a missing site), the erpact Argo CD
              applications, and pod mariadb-0.

        - alert: ErpactSiteProbeAbsent
          # Without this, deleting or breaking the VMProbe would silence
          # ErpactSiteDown with nothing to say so.
          expr: absent(probe_success{job="erpact-sites"})
          for: 15m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact site probes have stopped reporting"
            description: >-
              No probe_success series with job="erpact-sites" for 15 minutes, so
              ErpactSiteDown cannot fire. Check the erpact-sites VMProbe in the
              monitoring namespace and the blackbox-exporter deployment.

        - alert: ErpactSiteUnprobed
          # Discovery of erpact-sites targets is from Ingresses; this catches
          # a host that has an Ingress but no probe series (RBAC, relabel error).
          expr: |
            group by (host) (kube_ingress_path{namespace="erpact"})
            unless on (host)
            group by (host) (
              label_replace(probe_success{job="erpact-sites"}, "host", "$1", "instance", "https://([^/]+)/.*")
            )
          for: 15m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact site {{ $labels.host }} has no probe"
            description: >-
              Ingress host {{ $labels.host }} exists in namespace erpact but the
              erpact-sites VMProbe reports nothing for it, so ErpactSiteDown
              cannot fire for it. Check the VMProbe targets.ingress discovery
              and vmagent RBAC on ingresses in erpact.

    # Memory of the one MariaDB that holds every site's database
    # (mctl-apps infra/mariadb.yaml). Its caches grow with each site: ~890
    # InnoDB tables per site. On 2026-10-10 it reached 1292Mi of a 1536Mi limit
    # with 8 sites, and the limit was raised to 2560Mi (mctl-apps#12). An OOM
    # kill stops every site at once, and the OOMKilled alert only fires after
    # that has happened; this alert gives warning before it. The working set
    # is read from the cAdvisor endpoint only: the kubelet exports the same
    # series again under /metrics/resource, and summing both doubles the value.
    - name: erpact.capacity
      interval: 60s
      rules:
        - alert: ErpactMariadbMemoryHigh
          expr: |
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{
                namespace="erpact", container="mariadb",
                metrics_path="/metrics/cadvisor"
              }
            )
            /
            max by (namespace, pod, container) (
              kube_pod_container_resource_limits{
                namespace="erpact", container="mariadb", resource="memory"
              }
            ) > 0.85
          for: 15m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact MariaDB is at {{ $value | humanizePercentage }} of its memory limit"
            description: >-
              {{ $labels.pod }} has used over 85% of its memory limit for 15
              minutes. When it reaches the limit, the kernel kills it and every
              erpact site answers 500 until it restarts. Raise the limit in
              git.mctl.ai/erpact/mctl-apps infra/mariadb.yaml (the change
              restarts MariaDB, ~20 s of 500s), and check the tenant quota
              limits.memory first.

        - alert: ErpactMariadbMemoryMetricAbsent
          # Without this, a renamed container, a missing limit or a lost
          # scrape would leave ErpactMariadbMemoryHigh silent instead of red.
          expr: |
            absent(
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{
                  namespace="erpact", container="mariadb",
                  metrics_path="/metrics/cadvisor"
                }
              )
              /
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{
                  namespace="erpact", container="mariadb", resource="memory"
                }
              )
            )
          for: 30m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact MariaDB memory usage cannot be computed"
            description: >-
              The working set of container mariadb in namespace erpact, or its
              memory limit, has been missing for 30 minutes, so
              ErpactMariadbMemoryHigh cannot fire. Check that pod mariadb-0
              exists and still has a memory limit, and check the kubelet
              cAdvisor and kube-state-metrics scrapes.

    # Daily off-cluster backup of the copy (git.mctl.ai/erpact/mctl-apps
    # infra/backup.yaml, CronJob erpact-backup at 03:45 UTC, to R2 bucket
    # erpact-backups). Same three-way split as the Forgejo backup alerts in
    # backup-alerts.yaml: kube_cronjob_status_last_successful_time exists only
    # after a first success, so Stale covers "was working, stopped",
    # NeverSucceeded covers "never worked" (keyed on the CronJob's age), and
    # MetricAbsent covers "the CronJob is gone or not scraped", which would
    # otherwise silence the other two. A failed run is loud in its own logs
    # and silent everywhere else; this is what makes it visible.
    - name: erpact.backup
      interval: 60s
      rules:
        - alert: ErpactBackupStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{
              namespace="erpact", cronjob="erpact-backup"
            } > 90000
          for: 10m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact backup has not succeeded in over 25 hours"
            description: >-
              erpact/erpact-backup has no successful run in 25 hours. The Job
              pod is pinned to the MariaDB node (erpact-data is RWO), so a
              MariaDB outage also stops backups. Check the failed Job's logs:
              each step says which check refused the upload.

        - alert: ErpactBackupNeverSucceeded
          # 26h after creation: one daily cycle plus the 03:45 offset.
          expr: |
            (time() - kube_cronjob_created{namespace="erpact", cronjob="erpact-backup"} > 93600)
            unless on(namespace, cronjob)
            kube_cronjob_status_last_successful_time{namespace="erpact", cronjob="erpact-backup"}
          for: 10m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact backup has never succeeded"
            description: >-
              erpact/erpact-backup has existed for over 26 hours without one
              successful run, so ErpactBackupStale cannot fire for it.

        - alert: ErpactBackupMetricAbsent
          expr: absent(kube_cronjob_created{namespace="erpact", cronjob="erpact-backup"})
          for: 30m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact-backup CronJob is not visible to kube-state-metrics"
            description: >-
              No kube_cronjob_created series for erpact/erpact-backup. The
              CronJob was removed from mctl-apps or is not scraped, and the
              other erpact backup alerts are blind while this lasts.

        # Daily restore drill of that backup (mctl-apps infra/restore-drill.yaml,
        # 05:15 UTC). One failed run is enough: the newest backup does not
        # restore. Same 26h/NeverSucceeded split as the backup itself.
        - alert: ErpactRestoreDrillStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{
              namespace="erpact", cronjob="erpact-restore-drill"
            } > 93600
          for: 10m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact restore drill has not passed in over 26 hours"
            description: >-
              erpact/erpact-restore-drill has no successful run in 26 hours, so
              the newest backup in R2 bucket erpact-backups is not known to
              restore. The failed Job's restore container log names the site
              and the check that failed.

        # 26h also bounds the first run: a CronJob created at 05:16 UTC
        # first runs 23h59m later, and activeDeadlineSeconds caps a run at 1h.
        - alert: ErpactRestoreDrillNeverSucceeded
          expr: |
            (time() - kube_cronjob_created{namespace="erpact", cronjob="erpact-restore-drill"} > 93600)
            unless on(namespace, cronjob)
            kube_cronjob_status_last_successful_time{namespace="erpact", cronjob="erpact-restore-drill"}
          for: 10m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact restore drill has never passed"
            description: >-
              erpact/erpact-restore-drill has existed for over 26 hours without
              one successful run, so ErpactRestoreDrillStale cannot fire for it.

        - alert: ErpactRestoreDrillMetricAbsent
          expr: absent(kube_cronjob_created{namespace="erpact", cronjob="erpact-restore-drill"})
          for: 30m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact-restore-drill CronJob is not visible to kube-state-metrics"
            description: >-
              No kube_cronjob_created series for erpact/erpact-restore-drill. The
              CronJob was removed from mctl-apps or is not scraped, and the other
              restore drill alerts are blind while this lasts.
