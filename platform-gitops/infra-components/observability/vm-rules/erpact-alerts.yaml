# Alerts on tenant erpact's site probes (blackbox/vmprobes.yaml, job
# erpact-sites). The environment is not production, so both are warnings; they
# exist so that a broken site is noticed before someone tries to use it.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: erpact-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: mctl-platform
    app.kubernetes.io/component: availability
spec:
  groups:
    - name: erpact.availability
      interval: 60s
      rules:
        - alert: ErpactSiteDown
          # Five consecutive failed probes at a 60s interval: rides out a pod
          # restart (the benches run one replica each) but not an outage.
          expr: probe_success{job="erpact-sites"} == 0
          for: 5m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact site {{ $labels.instance }} is down"
            description: >-
              {{ $labels.instance }} has not answered 2xx for 5 minutes. The
              probe goes through Cloudflare and Traefik to the site's bench in
              namespace erpact, and /api/method/ping needs nginx, gunicorn and
              the site's MariaDB database. Check probe_http_status_code (502/504
              point at the bench pods, 404 at a missing site), the erpact Argo CD
              applications, and pod mariadb-0.

        - alert: ErpactSiteProbeAbsent
          # Without this, deleting or breaking the VMProbe would silence
          # ErpactSiteDown with nothing to say so.
          expr: absent(probe_success{job="erpact-sites"})
          for: 15m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact site probes have stopped reporting"
            description: >-
              No probe_success series with job="erpact-sites" for 15 minutes, so
              ErpactSiteDown cannot fire. Check the erpact-sites VMProbe in the
              monitoring namespace and the blackbox-exporter deployment.

    # Daily off-cluster backup of the copy (git.mctl.ai/erpact/mctl-apps
    # infra/backup.yaml, CronJob erpact-backup at 03:45 UTC, to R2 bucket
    # erpact-backups). Same three-way split as the Forgejo backup alerts in
    # backup-alerts.yaml: kube_cronjob_status_last_successful_time exists only
    # after a first success, so Stale covers "was working, stopped",
    # NeverSucceeded covers "never worked" (keyed on the CronJob's age), and
    # MetricAbsent covers "the CronJob is gone or not scraped", which would
    # otherwise silence the other two. A failed run is loud in its own logs
    # and silent everywhere else; this is what makes it visible.
    - name: erpact.backup
      interval: 60s
      rules:
        - alert: ErpactBackupStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{
              namespace="erpact", cronjob="erpact-backup"
            } > 90000
          for: 10m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact backup has not succeeded in over 25 hours"
            description: >-
              erpact/erpact-backup has no successful run in 25 hours. The Job
              pod is pinned to the MariaDB node (erpact-data is RWO), so a
              MariaDB outage also stops backups. Check the failed Job's logs:
              each step says which check refused the upload.

        - alert: ErpactBackupNeverSucceeded
          # 26h after creation: one daily cycle plus the 03:45 offset.
          expr: |
            (time() - kube_cronjob_created{namespace="erpact", cronjob="erpact-backup"} > 93600)
            unless on(namespace, cronjob)
            kube_cronjob_status_last_successful_time{namespace="erpact", cronjob="erpact-backup"}
          for: 10m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact backup has never succeeded"
            description: >-
              erpact/erpact-backup has existed for over 26 hours without one
              successful run, so ErpactBackupStale cannot fire for it.

        - alert: ErpactBackupMetricAbsent
          expr: absent(kube_cronjob_created{namespace="erpact", cronjob="erpact-backup"})
          for: 30m
          labels:
            severity: warning
            service: erpact
          annotations:
            summary: "erpact-backup CronJob is not visible to kube-state-metrics"
            description: >-
              No kube_cronjob_created series for erpact/erpact-backup. The
              CronJob was removed from mctl-apps or is not scraped, and the
              other erpact backup alerts are blind while this lasts.
