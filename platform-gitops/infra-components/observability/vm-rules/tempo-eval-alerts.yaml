# Alerts on the Tempo bake-off candidate (mctlhq/mctl-gitops#1280), deployed
# into observability-eval by the tempo entry in
# bootstrap/values.yaml's otelCollector.eval.candidates and scraped by
# infra-components/observability/eval/tempo/servicescrape.yaml (job="tempo").
#
# Every rule is scoped to namespace="observability-eval" (or, for the
# collector side, to the otlp/eval-tempo exporter), and none uses absent():
# with the sandbox torn down there is no series to evaluate and every rule is
# silent, so this file can outlive the bake-off without paging. The one
# "is the evidence there at all" check, TempoEvalNotScraped, is keyed on the
# StatefulSet having a ready replica, not on absence -- a closed sandbox and
# a scaled-to-zero outage test both read as "nothing to scrape", a running
# pod with no scrape reads as blind.
#
# Routing: every alertname starts with TempoEval, and
# bootstrap/templates/observability/monitoring.yaml routes TempoEval.* to
# Telegram only. The remedy for each is an operator's (resize, restore R2
# access, or end the bake-off), not something mctl-agent can act on, and the
# runbook's producer-isolation step deliberately scales Tempo to zero, which
# must not open incidents.
#
# Runbook: docs/runbooks/tracing-bake-off.md.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tempo-eval-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: mctl-platform
    app.kubernetes.io/component: tracing-eval
spec:
  groups:
    - name: tempo-eval.health
      rules:
        - alert: TempoEvalNotScraped
          # Tempo is running but vmagent has no successful scrape of it, so
          # every Tempo-side rule below is evaluating nothing. Usually the
          # 3200 ingress rule (eval/tempo/networkpolicy.yaml) or the
          # VMServiceScrape selector.
          expr: |
            (max(kube_statefulset_status_replicas_ready{namespace="observability-eval",statefulset="tempo"}) > 0)
            unless on ()
            (max(up{namespace="observability-eval",job="tempo"}) == 1)
          for: 10m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) is running but not being scraped"
            description: >-
              The tempo StatefulSet in observability-eval has a ready replica,
              but up{job="tempo"} has not been 1 for 10 minutes. Every other
              TempoEval alert is blind until this clears. Check the
              tempo-allow-http-from-monitoring NetworkPolicy and the tempo
              VMServiceScrape in observability-eval.

        - alert: TempoEvalMemoryNearLimit
          # RSS, not working set: GOMEMLIMIT (800MiB) steers the Go runtime's
          # own memory, which is what RSS measures, and 85% of the 1Gi limit
          # (~870MiB) is already above it -- the GC is no longer holding the
          # line and the next step is the OOM killer.
          expr: |
            max by (pod) (container_memory_rss{namespace="observability-eval",container="tempo"})
            /
            max by (pod) (kube_pod_container_resource_limits{namespace="observability-eval",container="tempo",resource="memory"})
            > 0.85
          for: 10m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) RSS is near its memory limit"
            description: >-
              {{ $labels.pod }} has used over 85% of its memory limit (RSS) for
              10 minutes, above the 800MiB GOMEMLIMIT. Either the declared
              trace volume was exceeded or the limit is too small for it;
              record it against the operations dimension and resize in
              bootstrap/values.yaml, do not just restart.

        - alert: TempoEvalOOMKilled
          # Same shape as ContainerOOMKilled (vm-rules/mctl-alerts.yaml),
          # scoped to Tempo so it reaches Telegram rather than mctl-agent.
          expr: |
            max by (pod) (
              max_over_time(
                kube_pod_container_status_terminated_reason{namespace="observability-eval",container="tempo",reason="OOMKilled"}[15m]
              )
            ) > 0
            or
            max by (pod) (
              kube_pod_container_status_last_terminated_reason{namespace="observability-eval",container="tempo",reason="OOMKilled"}
              and on (namespace, pod, container)
              increase(kube_pod_container_status_restarts_total{namespace="observability-eval",container="tempo"}[15m]) > 0
            ) > 0
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) was OOM-killed"
            description: >-
              {{ $labels.pod }} was OOM-killed in the last 15 minutes. The WAL
              is on an emptyDir, which survives a container restart, so it is
              replayed; spans in flight in memory are lost. Record the event
              against the operations dimension.

        - alert: TempoEvalRestarting
          # Any cause, OOM included: two restarts inside 30 minutes is a pod
          # that is not staying up.
          expr: |
            max by (pod) (
              increase(kube_pod_container_status_restarts_total{namespace="observability-eval",container="tempo"}[30m])
            ) >= 2
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) is restarting repeatedly"
            description: >-
              {{ $labels.pod }} restarted {{ $value | humanize }} times in the
              last 30 minutes. Check its last termination reason and logs
              ({namespace="observability-eval"} in Loki).

    - name: tempo-eval.ingest
      rules:
        - alert: TempoEvalIngestRefused
          # The distributor's OTLP receiver refusing spans (rate limits,
          # ingester unavailable). Visible on the collector side too, as
          # TempoEvalCollectorExportFailures.
          expr: sum(increase(tempo_receiver_refused_spans{namespace="observability-eval",job="tempo"}[2m])) > 0
          for: 5m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) is refusing spans at the distributor"
            description: >-
              tempo_receiver_refused_spans has been increasing for 5 minutes.
              Spans the collector sends are being rejected before they reach
              the ingester.

        - alert: TempoEvalDiscardedSpans
          # Accepted by the receiver, then dropped (live-traces limit, trace
          # too large, ...). `reason` says which.
          expr: sum by (reason) (increase(tempo_discarded_spans_total{namespace="observability-eval",job="tempo"}[2m])) > 0
          for: 5m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) is discarding spans ({{ $labels.reason }})"
            description: >-
              tempo_discarded_spans_total{reason="{{ $labels.reason }}"} has
              been increasing for 5 minutes: spans were accepted and then
              dropped by a Tempo limit. Measured trace volume is lower than
              sent volume for as long as this fires.

        - alert: TempoEvalCollectorExportFailures
          # The collector side of the same pipe: spans otel-collector could
          # not hand to Tempo (unreachable, refused, timed out) after its
          # retries. Covers Tempo being down or scaled to zero.
          expr: sum(increase(otelcol_exporter_send_failed_spans{exporter="otlp/eval-tempo"}[2m])) > 0
          for: 5m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "otel-collector is failing to export spans to Tempo (bake-off)"
            description: >-
              otelcol_exporter_send_failed_spans{exporter="otlp/eval-tempo"}
              has been increasing for 5 minutes. Expected during the runbook's
              producer-isolation test (Tempo scaled to zero); otherwise check
              the tempo pod and TempoEvalIngestRefused.

        - alert: TempoEvalCollectorDroppedSpans
          # The exporter's sending_queue was full, so the collector dropped
          # the batch instead of queueing it (docs/runbooks/otel-collector.md).
          expr: sum(increase(otelcol_exporter_enqueue_failed_spans{exporter="otlp/eval-tempo"}[2m])) > 0
          for: 5m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "otel-collector is dropping spans bound for Tempo (bake-off)"
            description: >-
              otelcol_exporter_enqueue_failed_spans{exporter="otlp/eval-tempo"}
              has been increasing for 5 minutes: the export queue to Tempo is
              full and new batches are dropped. Tempo is slow or unreachable.

    - name: tempo-eval.storage
      rules:
        - alert: TempoEvalFlushFailures
          # The ingester could not write a completed block to R2. Blocks
          # wait in the WAL on the 2Gi emptyDir and are retried; an outage
          # longer than that capacity loses spans (an accepted bake-off
          # risk, docs/runbooks/tracing-bake-off.md).
          expr: sum(increase(tempo_ingester_failed_flushes_total{namespace="observability-eval",job="tempo"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) cannot flush blocks to object storage"
            description: >-
              tempo_ingester_failed_flushes_total has been increasing for 10
              minutes. Blocks are accumulating in the WAL emptyDir (2Gi cap;
              past it the pod is evicted and the WAL is lost). Check R2
              reachability from observability-eval and the tempo-r2 Secret.

        - alert: TempoEvalObjectStorageErrors
          # Every non-2xx answer from the bucket except 404, which Tempo's
          # blocklist poll and compactor see in normal operation (objects
          # that are not there yet, or already deleted).
          expr: |
            sum by (operation, status_code) (
              increase(tempodb_backend_request_duration_seconds_count{namespace="observability-eval",job="tempo",status_code!~"2..|404"}[5m])
            ) > 0
          for: 10m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) object-storage {{ $labels.operation }} requests failing ({{ $labels.status_code }})"
            description: >-
              tempodb_backend_request_duration_seconds_count for
              {{ $labels.operation }} has returned status {{ $labels.status_code }}
              continuously for 10 minutes. 401/403 point at the tempo-r2
              credentials, 5xx or 0 at R2 or the egress NetworkPolicy.

        - alert: TempoEvalCompactionOrRetentionErrors
          # The compactor is what deletes blocks past block_retention (336h);
          # if it errors, retention is not being enforced by Tempo and only
          # the bucket's own lifecycle rule bounds storage.
          expr: |
            sum(increase(tempodb_compaction_errors_total{namespace="observability-eval",job="tempo"}[15m])) > 0
            or
            sum(increase(tempodb_retention_errors_total{namespace="observability-eval",job="tempo"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: tempo-eval
          annotations:
            summary: "Tempo (bake-off) compactor is failing"
            description: >-
              tempodb_compaction_errors_total or tempodb_retention_errors_total
              has been increasing for 15 minutes. Blocks are not being
              compacted or deleted on schedule.
