# Durable alerting for scheduled backups.
#
# Why this exists, given KubeJobFailed already covers failed backup Jobs:
# KubeJobFailed is keyed on an ephemeral object. On 2026-08-16 it fired
# correctly at 03:16 and then "resolved" at 05:00 — not because the backup had
# recovered, but because ttlSecondsAfterFinished deleted the Job and
# kube_job_failed disappeared with it. The alert going green meant only that
# the evidence had been garbage-collected; the cluster still had no snapshot
# for that day, and nobody found out until 14:20.
#
# kube_cronjob_status_last_successful_time is a property of the CronJob itself,
# so it survives Job GC and stays stale until a run actually succeeds. That is
# the signal an auditor can rely on for CC7.5, and the one a human should be
# paged on.
#
# NB: ArgoCD's built-in CronJob health check covers the same ground from the
# other side (it marks a CronJob Degraded while lastScheduleTime is newer than
# lastSuccessfulTime, which is what held root-app Degraded for 11h on
# 2026-08-16). These two are deliberately redundant: that one depends on the
# ArgoCD app tree and its alert routing, this one only on kube-state-metrics.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: mctl-backup-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: mctl-platform
    app.kubernetes.io/component: backups
spec:
  groups:
    - name: mctl.backups
      interval: 60s
      rules:
        - alert: VaultBackupStale
          # Daily at 03:00 UTC, so 25h tolerates one late/slow run without
          # firing, but never tolerates a whole missed day.
          expr: |
            time() - kube_cronjob_status_last_successful_time{
              namespace="vault", cronjob="vault-backup"
            } > 90000
          for: 10m
          labels:
            severity: critical
            service: vault
          annotations:
            summary: "Vault raft snapshot has not succeeded in over 25 hours"
            description: >-
              The vault-backup CronJob (schedule 0 3 * * *) has no successful
              run in the last 25 hours, so there is no fresh Vault snapshot in
              R2. Unlike KubeJobFailed this does not clear when the failed Job
              is garbage-collected — it clears only when a backup actually
              succeeds. Check `kubectl -n vault get cronjob vault-backup -o
              jsonpath='{.status}'` and the pod logs in Loki under
              {app="vault-backup"}; the Job object itself may already be gone.
              Runbook: https://github.com/mctlhq/mctl-gitops/blob/main/docs/runbooks/restore.md
        - alert: VaultBackupMetricAbsent
          # Catches the failure mode the staleness rule cannot see: if the
          # CronJob is deleted or kube-state-metrics stops exposing it, the
          # series vanishes and `time() - <absent>` never evaluates, so
          # VaultBackupStale would silently stop firing forever.
          expr: |
            absent(kube_cronjob_status_last_successful_time{
              namespace="vault", cronjob="vault-backup"
            })
          for: 30m
          labels:
            severity: warning
            service: vault
          annotations:
            summary: "vault-backup CronJob metrics have been absent for 30m"
            description: >-
              No kube_cronjob_status_last_successful_time series for
              vault/vault-backup. Either the CronJob was removed, it has never
              completed a successful run since creation, or kube-state-metrics
              is not scraping it. While this is absent, VaultBackupStale cannot
              fire, so Vault backups are effectively unmonitored.
              Runbook: https://github.com/mctlhq/mctl-gitops/blob/main/docs/runbooks/restore.md
        - alert: VaultBackupSuspended
          expr: kube_cronjob_spec_suspend{namespace="vault", cronjob="vault-backup"} == 1
          for: 30m
          labels:
            severity: warning
            service: vault
          annotations:
            summary: "vault-backup CronJob is suspended"
            description: >-
              The vault-backup CronJob is suspended and will take no further
              snapshots. A suspended CronJob keeps its last lastSuccessfulTime,
              so this is the only signal until VaultBackupStale trips 25h later.
              Runbook: https://github.com/mctlhq/mctl-gitops/blob/main/docs/runbooks/restore.md
        # VictoriaMetrics. Deliberately not modelled on the CronJob rules
        # above: vmbackup cannot be a CronJob. It needs the VMSingle data
        # directory, that PVC is ReadWriteOnce and already mounted by the
        # vmsingle pod, so a second pod would stall on Multi-Attach. It runs as
        # a sidecar in that pod instead, which means there is no
        # kube_cronjob_status_last_successful_time to watch — the sidecar
        # publishes its own success timestamp to Pushgateway.
        #
        # And it is not modelled on container health either. A sidecar that
        # crashes makes the pod unready, an unready pod leaves the vmsingle
        # Service, and metrics go dark — so the sidecar never exits on a failed
        # backup. These two rules are the only thing standing between a broken
        # backup and silence, which is exactly the state #1071 found: the
        # sidecar had never run once since 2026-03 and nothing said so.
        - alert: VictoriaMetricsBackupStale
          # Daily loop, so 25h tolerates one slow run and never a missed day.
          # Same threshold as VaultBackupStale, for the same reason.
          expr: time() - vmbackup_last_success_timestamp_seconds{job="vmbackup"} > 90000
          for: 10m
          labels:
            severity: critical
            service: monitoring
          annotations:
            summary: "VictoriaMetrics backup has not succeeded in over 25 hours"
            description: >-
              The vmbackup sidecar in the vmsingle pod has had no successful run
              in 25 hours, so there is no fresh copy of the metrics database in
              R2. This covers every SLI the error-budget merge-freeze policy
              reads and the evaluation history behind every alert. The sidecar
              does not crash on failure by design, so its container will look
              healthy — read its logs instead:
              `kubectl -n monitoring logs deploy/vmsingle-monitoring-victoria-metrics-k8s-stack -c vmbackup`.
              Runbook: https://github.com/mctlhq/mctl-gitops/blob/main/docs/runbooks/restore.md
        - alert: VictoriaMetricsBackupMetricAbsent
          # The failure the staleness rule cannot see. If the sidecar stops
          # publishing — deleted, never started, Pushgateway unreachable — the
          # series vanishes and `time() - <absent>` never evaluates, so
          # VictoriaMetricsBackupStale silently stops firing forever. That is
          # the shape of the original bug and it gets its own alert.
          #
          # 2h, not the 30m used for the Vault CronJob: this series only appears
          # after the sidecar's first successful backup, and a first backup of
          # the whole database on a cold start takes appreciably longer than a
          # 165 KiB Vault snapshot.
          expr: absent(vmbackup_last_success_timestamp_seconds{job="vmbackup"})
          for: 2h
          labels:
            severity: warning
            service: monitoring
          annotations:
            summary: "VictoriaMetrics backup has never reported success"
            description: >-
              No vmbackup_last_success_timestamp_seconds series for 2 hours.
              Either the vmbackup sidecar is not running, it has not completed a
              successful backup since it started, or it cannot reach
              Pushgateway. While this is absent VictoriaMetricsBackupStale
              cannot fire, so the metrics backup is unmonitored — which is the
              state that went unnoticed from 2026-03 to 2026-09 (#1071).
              Runbook: https://github.com/mctlhq/mctl-gitops/blob/main/docs/runbooks/restore.md
