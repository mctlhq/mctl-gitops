# Alerts on the permanent Tempo (#1280 verdict), deployed into `tracing` by
# the tracing-tempo Application (bootstrap/templates/observability/
# tracing.yaml) and scraped by
# infra-components/observability/tracing/tempo/servicescrape.yaml
# (job="tempo"). Renamed from the bake-off's tempo-eval-alerts.yaml, rule for
# rule; the thresholds are the ones the soak ran under.
#
# Every rule is scoped to namespace="tracing" (or, for the collector side,
# to the otlp/backend exporter), and none uses absent(): with Tempo removed
# there is no series to evaluate and every rule is silent. The one "is the
# evidence there at all" check, TempoNotScraped, is keyed on the StatefulSet
# having a ready replica, not on absence -- scaled to zero and removed both
# read as "nothing to scrape", a running pod with no scrape reads as blind.
#
# Routing: every alertname starts with Tempo, and
# bootstrap/templates/observability/monitoring.yaml routes Tempo.* to
# Telegram only. The remedy for each is an operator's (resize, restore R2
# access), not something mctl-agent can act on.
#
# Runbook: docs/runbooks/tempo.md.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tempo-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: mctl-platform
    app.kubernetes.io/component: tracing
spec:
  groups:
    - name: tempo.health
      rules:
        - alert: TempoNotScraped
          # Tempo is running but vmagent has no successful scrape of it, so
          # every Tempo-side rule below is evaluating nothing. Usually the
          # 3200 ingress rule (tracing/tempo/networkpolicy.yaml) or the
          # VMServiceScrape selector.
          expr: |
            (max(kube_statefulset_status_replicas_ready{namespace="tracing",statefulset="tempo"}) > 0)
            unless on ()
            (max(up{namespace="tracing",job="tempo"}) == 1)
          for: 10m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo is running but not being scraped"
            description: >-
              The tempo StatefulSet in tracing has a ready replica,
              but up{job="tempo"} has not been 1 for 10 minutes. Every other
              Tempo alert is blind until this clears. Check the
              tempo-allow-http-from-monitoring NetworkPolicy and the tempo
              VMServiceScrape in tracing.

        - alert: TempoMemoryNearLimit
          # RSS, not working set: GOMEMLIMIT (1600MiB) steers the Go runtime's
          # own memory, which is what RSS measures, and 85% of the 2Gi limit
          # (~1740MiB) is already above it -- the GC is no longer holding the
          # line and the next step is the OOM killer.
          expr: |
            max by (pod) (container_memory_rss{namespace="tracing",container="tempo"})
            /
            max by (pod) (kube_pod_container_resource_limits{namespace="tracing",container="tempo",resource="memory"})
            > 0.85
          for: 10m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo RSS is near its memory limit"
            description: >-
              {{ $labels.pod }} has used over 85% of its memory limit (RSS) for
              10 minutes, above the 1600MiB GOMEMLIMIT. Either the trace
              volume grew past what the limit was sized for or a reader is
              too heavy (docs/runbooks/tempo.md); resize in
              bootstrap/values.yaml, do not just restart.

        - alert: TempoOOMKilled
          # Same shape as ContainerOOMKilled (vm-rules/mctl-alerts.yaml),
          # scoped to Tempo so it reaches Telegram rather than mctl-agent.
          expr: |
            max by (pod) (
              max_over_time(
                kube_pod_container_status_terminated_reason{namespace="tracing",container="tempo",reason="OOMKilled"}[15m]
              )
            ) > 0
            or
            max by (pod) (
              kube_pod_container_status_last_terminated_reason{namespace="tracing",container="tempo",reason="OOMKilled"}
              and on (namespace, pod, container)
              increase(
                (max by (namespace, pod, container) (
                  kube_pod_container_status_restarts_total{namespace="tracing",container="tempo"}
                ))[15m:1m]
              ) > 0
            ) > 0
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo was OOM-killed"
            description: >-
              {{ $labels.pod }} was OOM-killed in the last 15 minutes. The WAL
              is on an emptyDir, which survives a container restart, so it is
              replayed; spans in flight in memory are lost. Record the event
              against the operations dimension.

        - alert: TempoRestarting
          # Any cause, OOM included: two restarts inside 30 minutes is a pod
          # that is not staying up. instance is collapsed before increase()
          # for the reason given on MctlAliceRestarting (mctl-alice-alerts.yaml).
          expr: |
            max by (pod) (
              increase(
                (max by (namespace, pod, container) (
                  kube_pod_container_status_restarts_total{namespace="tracing",container="tempo"}
                ))[30m:1m]
              )
            ) >= 2
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo is restarting repeatedly"
            description: >-
              {{ $labels.pod }} restarted {{ $value | humanize }} times in the
              last 30 minutes. Check its last termination reason and logs
              ({namespace="tracing"} in Loki).

    - name: tempo.ingest
      rules:
        - alert: TempoIngestRefused
          # The distributor's OTLP receiver refusing spans (rate limits,
          # ingester unavailable). Visible on the collector side too, as
          # TempoCollectorExportFailures.
          expr: sum(increase(tempo_receiver_refused_spans{namespace="tracing",job="tempo"}[2m])) > 0
          for: 5m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo is refusing spans at the distributor"
            description: >-
              tempo_receiver_refused_spans has been increasing for 5 minutes.
              Spans the collector sends are being rejected before they reach
              the ingester.

        - alert: TempoDiscardedSpans
          # Accepted by the receiver, then dropped (live-traces limit, trace
          # too large, ...). `reason` says which.
          expr: sum by (reason) (increase(tempo_discarded_spans_total{namespace="tracing",job="tempo"}[2m])) > 0
          for: 5m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo is discarding spans ({{ $labels.reason }})"
            description: >-
              tempo_discarded_spans_total{reason="{{ $labels.reason }}"} has
              been increasing for 5 minutes: spans were accepted and then
              dropped by a Tempo limit. Measured trace volume is lower than
              sent volume for as long as this fires.

        - alert: TempoCollectorExportFailures
          # The collector side of the same pipe: spans otel-collector could
          # not hand to Tempo (unreachable, refused, timed out) after its
          # retries. Covers Tempo being down or scaled to zero.
          # The collector's own telemetry labels this exporter by its
          # resolved type, otlp_grpc/backend, not by the config ID
          # otlp/backend; the regex matches both so a collector upgrade
          # that changes the alias cannot silently blind the rule.
          expr: sum(increase(otelcol_exporter_send_failed_spans{exporter=~"otlp(_grpc)?/backend"}[2m])) > 0
          for: 5m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "otel-collector is failing to export spans to Tempo"
            description: >-
              otelcol_exporter_send_failed_spans{exporter=~"otlp(_grpc)?/backend"}
              has been increasing for 5 minutes: Tempo is down, scaled to zero
              or refusing. Producers are unaffected (they only address the
              collector); check the tempo pod and TempoIngestRefused.

        - alert: TempoCollectorDroppedSpans
          # The exporter's sending_queue was full, so the collector dropped
          # the batch instead of queueing it (docs/runbooks/otel-collector.md).
          expr: sum(increase(otelcol_exporter_enqueue_failed_spans{exporter=~"otlp(_grpc)?/backend"}[2m])) > 0
          for: 5m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "otel-collector is dropping spans bound for Tempo"
            description: >-
              otelcol_exporter_enqueue_failed_spans{exporter=~"otlp(_grpc)?/backend"}
              has been increasing for 5 minutes: the export queue to Tempo is
              full and new batches are dropped. Tempo is slow or unreachable.

    - name: tempo.storage
      rules:
        - alert: TempoFlushFailures
          # The ingester could not write a completed block to R2. Blocks
          # wait in the WAL on the 2Gi emptyDir and are retried; an outage
          # longer than that capacity loses spans (the standing emptyDir-WAL
          # risk the owner accepted, docs/runbooks/tempo.md).
          expr: sum(increase(tempo_ingester_failed_flushes_total{namespace="tracing",job="tempo"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo cannot flush blocks to object storage"
            description: >-
              tempo_ingester_failed_flushes_total has been increasing for 10
              minutes. Blocks are accumulating in the WAL emptyDir (2Gi cap;
              past it the pod is evicted and the WAL is lost). Check R2
              reachability from tracing and the tempo-r2 Secret.

        - alert: TempoObjectStorageErrors
          # Every non-2xx answer from the bucket except 404, which Tempo's
          # blocklist poll and compactor see in normal operation (objects
          # that are not there yet, or already deleted).
          expr: |
            sum by (operation, status_code) (
              increase(tempodb_backend_request_duration_seconds_count{namespace="tracing",job="tempo",status_code!~"2..|404"}[5m])
            ) > 0
          for: 10m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo object-storage {{ $labels.operation }} requests failing ({{ $labels.status_code }})"
            description: >-
              tempodb_backend_request_duration_seconds_count for
              {{ $labels.operation }} has returned status {{ $labels.status_code }}
              continuously for 10 minutes. 401/403 point at the tempo-r2
              credentials, 5xx or 0 at R2 or the egress NetworkPolicy.

        - alert: TempoCompactionOrRetentionErrors
          # The compactor is what deletes blocks past block_retention (336h);
          # if it errors, retention is not being enforced by Tempo and only
          # the bucket's own lifecycle rule bounds storage.
          expr: |
            sum(increase(tempodb_compaction_errors_total{namespace="tracing",job="tempo"}[15m])) > 0
            or
            sum(increase(tempodb_retention_errors_total{namespace="tracing",job="tempo"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: tempo
          annotations:
            summary: "Tempo compactor is failing"
            description: >-
              tempodb_compaction_errors_total or tempodb_retention_errors_total
              has been increasing for 15 minutes. Blocks are not being
              compacted or deleted on schedule.
