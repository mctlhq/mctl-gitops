# Alerts on the mctl-agents Temporal worker queue split (ADR-008, #252).
#
# Metrics come from the Temporal SDK's own Prometheus exporter, scraped via
# bootstrap/templates/mctl-platform/mctl-agents-worker-monitor.yaml.
#
# What these exist to catch: the starvation ADR-008 splits the queues to
# fix was INVISIBLE. A saturated slot pool looks exactly like "nothing is
# happening" — approvals still land (a signal is a workflow task, not an
# activity) but everything they then need queues behind hours-long Argo
# polls, so reconcile and issue intake stop with nothing in any log saying
# so. Schedule-to-start latency is that condition expressed as a number.
#
# Metric names and labels were read off a live worker, not taken from the
# SDK docs — see ADR-008 D5 in mctl-agents. Two consequences show up below:
#
#  - durations are SECONDS (the exporter sets durations_as_seconds), so the
#    thresholds here are seconds, not the SDK's default integer ms.
#  - the roles are NOT distinguishable by `service_name` — all report
#    "temporal-core-sdk". `task_queue` is the only label that separates
#    them: mctl-dev-loop (control), mctl-dev-loop-exec (execution),
#    mctl-dev-loop-implement (admission, mctl-agents#395).
#
# Routing, stated honestly (corrected 2026-09-19). The four ADR-008 rules
# carry mctl_agent_self="true"; an earlier version of this comment claimed
# the AlertManager route drops that label so mctl-agent does not ticket
# itself. No route in bootstrap/templates/observability/monitoring.yaml
# matches that label — those four fall through to the root mctl-agent
# receiver. Re-routing them is tracked separately. The admission rules
# below (MctlAgentsImplement*) are routed to a human by an explicit
# alertname matcher in monitoring.yaml, because the remedy for each is a
# values edit (N, or the pod) that only a person can make.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: mctl-agents-worker-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: mctl-platform
spec:
  groups:
    - name: mctl-agents.queue-saturation
      rules:
        # THE signal from ADR-008 D5. Activities on the control queue are
        # all short — find_proposal_slug, get_pr_state, record_execution,
        # the reconcile and intake lookups — so a healthy control queue
        # picks them up effectively immediately. Sustained non-zero wait
        # means the slot pool is full and the short work is stuck behind
        # something long.
        #
        # The average over 10m rather than a quantile: schedule-to-start
        # here is a histogram whose buckets were not tuned for this, and
        # the failure being detected is a sustained shift of the whole
        # distribution, not a tail event. 1s is far above the normal
        # sub-millisecond case and far below the timeouts involved.
        - alert: MctlAgentsControlQueueScheduleToStartHigh
          expr: |
            (
              sum(rate(temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop"}[10m]))
              /
              clamp_min(sum(rate(temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop"}[10m])), 0.001)
            ) > 1
          for: 15m
          labels:
            severity: warning
            mctl_agent_self: "true"
          annotations:
            summary: mctl-agents control queue activities are waiting >1s to start
            description: |
              Activities scheduled on mctl-dev-loop are averaging over a second
              between being scheduled and a worker picking them up, for 15m.
              Every activity on this queue is short, so this is slot-pool
              saturation, not slow work — reconcile and issue intake are
              likely stalled even though the worker looks healthy.

              Check temporal_worker_task_slots_available{task_queue="mctl-dev-loop"}.
              If it is at or near zero, the control worker is holding long
              Argo polls: CONTROL_MAX_CONCURRENT_ACTIVITIES in
              orchestrator/temporal/constants.py is the ceiling, and the
              routing flip (mctl-agents#251) is what moves that load off
              this queue.

        # The direct form of the same condition, and the one ADR-008 D3
        # says to tune the limits against. Exhausted slots with no waiting
        # yet is the state just before the alert above.
        #
        # ActivityWorker only: the WorkflowWorker pool is bounded
        # separately (max_concurrent_workflow_tasks, deliberately unset —
        # see D3) and a LocalActivityWorker pool this repo never uses would
        # otherwise sit at its ceiling and read as healthy noise.
        #
        # Scoped to the two ADR-008 queues, and deliberately NOT to
        # mctl-dev-loop-implement: a full slot pool there is the admission
        # queue doing its job under load, not starvation. Its signal is
        # queue AGE, MctlAgentsImplementQueueAgeHigh below.
        #
        # `temporal_worker_task_slots_available`
        # is a generic SDK metric name, so an unscoped selector would read
        # another team's saturation as ours and page on it under this
        # alertname — which, per the header above, lands on mctl-agent
        # rather than on whoever runs that workload. Nothing else in the
        # cluster is scraped into these series today; the guard costs one
        # selector and removes the need to remember this when something is.
        #
        # `sum`, not `min`, across pods. Both roles are replicaCount: 1
        # today, where the two agree — but they answer different questions
        # once that changes, and only one of them is this alert's question.
        # `min` fires when the WORST pod is full, which for a queue with a
        # free sibling is not starvation at all; the queue is starved only
        # when no worker anywhere can take work, which is `sum == 0`.
        - alert: MctlAgentsWorkerActivitySlotsExhausted
          expr: |
            sum by (task_queue) (
              temporal_worker_task_slots_available{
                worker_type="ActivityWorker",
                task_queue=~"mctl-dev-loop(-exec)?"
              }
            ) == 0
          for: 20m
          labels:
            severity: warning
            mctl_agent_self: "true"
          annotations:
            summary: mctl-agents worker has no free activity slots on {{ $labels.task_queue }}
            description: |
              The activity slot pool for {{ $labels.task_queue }} has been fully
              occupied for 20m. On mctl-dev-loop this is the starvation
              ADR-008 exists to remove and it will be stalling reconcile and
              intake; on mctl-dev-loop-exec it means concurrent Argo runs have
              reached EXECUTION_MAX_CONCURRENT_ACTIVITIES and new agent
              executions are queueing.

              Both ceilings are in orchestrator/temporal/constants.py. Per
              ADR-008 D3 they are starting values meant to be moved from
              observed numbers — this alert is one of those numbers.

        # An exporter that stops reporting looks identical to a queue that
        # is perfectly idle: both are "no series". Without this, the two
        # alerts above degrade silently into permanent green.
        #
        # One arm per queue, because absent() cannot be aggregated over a
        # label value it is asserting does not exist — the whole point is
        # that there is no series to group by. Both roles run and export
        # today, so both arms are live now; the exec arm matters more after
        # the routing flip (mctl-agents#251), when a silent exec worker
        # would mean agent executions stop with nothing saying so.
        - alert: MctlAgentsWorkerMetricsMissing
          expr: |
            absent(temporal_worker_task_slots_available{task_queue="mctl-dev-loop"})
          for: 30m
          labels:
            severity: warning
            mctl_agent_self: "true"
          annotations:
            summary: no Temporal SDK metrics from the mctl-agents control worker
            description: |
              temporal_worker_task_slots_available has been absent for the
              control queue for 30m. Either the worker is down, or the
              exporter is not being scraped — the two saturation alerts in
              this group cannot fire while this is true, so they are not
              evidence of health right now.

              Check the VMServiceScrape at
              bootstrap/templates/mctl-platform/mctl-agents-worker-monitor.yaml
              and that the pod is serving :8080/metrics (METRICS_PORT in
              orchestrator/temporal/constants.py).

        - alert: MctlAgentsExecWorkerMetricsMissing
          expr: |
            absent(temporal_worker_task_slots_available{task_queue="mctl-dev-loop-exec"})
          for: 30m
          labels:
            severity: warning
            mctl_agent_self: "true"
          annotations:
            summary: no Temporal SDK metrics from the mctl-agents execution worker
            description: |
              temporal_worker_task_slots_available has been absent for
              mctl-dev-loop-exec for 30m. The execution worker polls that
              queue and exports even while idle, so absence means the pod is
              down or unscraped — not that the queue is quiet.

              Before the routing flip (mctl-agents#251) this costs nothing:
              nothing schedules onto the exec queue yet. After it, a silent
              exec worker means every agent execution has stopped, which is
              exactly the class of failure this group exists to make loud.

    # ------------------------------------------------------------------
    # The admission queue (mctl-agents#395, ADR-008 D7, this repo #1285).
    #
    # mctl-dev-loop-implement carries ONLY the implementer submit, with
    # max_concurrent_activities = N on a single-replica worker. Waiting
    # there is by design: an activity with no free slot stays Scheduled in
    # Temporal and creates no Argo work. So the numbers that matter are
    # different from the ADR-008 group above — a full pool is normal, and
    # the question is how LONG work waits, which is exactly what the SDK's
    # schedule-to-start latency measures on this queue.
    # ------------------------------------------------------------------
    - name: mctl-agents.implementation-admission
      rules:
        # queue_age. Sustained hours of waiting is the signal that N is
        # too small for the approval rate — or that admitted runs are not
        # finishing and freeing slots. Both are for an operator: the
        # remedy is IMPLEMENTATION_MAX_CONCURRENT_ACTIVITIES in
        # services/admins/mctl-agents-worker-implement/values.yaml, or a
        # look at what the N running implementers are doing.
        #
        # Threshold 7200s over a 30m mean window, held for 30m: an
        # implementer run is 30-70 minutes, so at N=3 a queue age of two
        # hours means a backlog of roughly a full cycle. Per ADR-008 D5 the
        # number is a starting value to be moved from observed data.
        #
        # The mean over 30m, as in the control-queue rule: the histogram
        # buckets were not tuned for hours, and what is being detected is
        # a shift of the whole distribution, not a tail. `rate` on both
        # counters over the same window, so a single long wait recorded at
        # once does not read as sustained.
        #
        # `max_over_time(...[2h:1m])` around that mean, because this metric
        # is only observed when an activity IS admitted. At N=3 with 30-70
        # minute runs, admissions arrive every 10-25 minutes and routinely
        # gap past 30, and an empty rate window collapses the ratio to
        # 0/0.001 = 0 — which would reset `for:` and keep a genuinely
        # backed-up queue quiet forever. Taking the maximum over two hours
        # means a single window that saw a long wait holds the alert up
        # through the gaps around it, and `for: 10m` then only asks that
        # the condition survive one more evaluation rather than that
        # admissions keep arriving.
        #
        # The clamp floor is 1e-6, not the 0.001 the control-queue rule
        # uses, and the difference is load-bearing here rather than
        # cosmetic. It exists only so an all-zero window cannot divide by
        # zero, but any floor ABOVE the real admission rate replaces the
        # denominator and silently deflates the mean: at N=3 one admission
        # per 30 minutes is a count rate of 5.5e-4/s, so a 0.001 floor
        # reported a three-hour wait as 5586s and kept a 7200s threshold
        # quiet. 1e-6 is one admission per eleven days — below anything
        # this queue can produce while still being non-zero.
        #
        # This rule still cannot see a FULL stall: with every slot held and
        # nothing admitted there are no observations at all, anywhere in the
        # window. That case is MctlAgentsImplementAdmissionStalled below,
        # which reads the pool itself.
        - alert: MctlAgentsImplementQueueAgeHigh
          expr: |
            max_over_time(
              (
                sum(rate(temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop-implement"}[30m]))
                /
                clamp_min(sum(rate(temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop-implement"}[30m])), 1e-6)
              )[2h:1m]
            ) > 7200
          for: 10m
          labels:
            severity: warning
            namespace: admins
          annotations:
            summary: approved DevLoops are waiting over 2h for implementation capacity
            description: |
              At some point in the last two hours, activities on
              mctl-dev-loop-implement averaged more than two hours between
              being scheduled and a worker slot admitting them. That wait is
              admission working as designed — no Argo workflow exists for a
              queued DevLoop — but this long means the approval rate exceeds
              capacity N, or the admitted runs are not finishing and freeing
              their slots.

              This rule looks back two hours on purpose, because admissions
              at N=3 are too sparse to evaluate on a 30m window alone, so it
              can still be firing after the queue has drained. For the live
              state check the slot pool and MctlAgentsImplementAdmissionStalled
              rather than assuming the backlog is still there.

              Capacity is IMPLEMENTATION_MAX_CONCURRENT_ACTIVITIES in
              platform-gitops/services/admins/mctl-agents-worker-implement/values.yaml
              (one replica, by invariant). Check
              temporal_worker_task_slots_used{task_queue="mctl-dev-loop-implement"}
              against N and the running mctl-agents-implement-* workflows in
              Argo before raising N. Context: mctl-agents#395.

        # Same shape as the ADR-008 absent() arms: an exporter that stops
        # is indistinguishable from an idle queue. After the routing flip a
        # silent implementation worker means every approved DevLoop waits
        # forever with nothing saying so — the queue-age rule above cannot
        # fire on a series that does not exist.
        - alert: MctlAgentsImplementWorkerMetricsMissing
          expr: |
            absent(temporal_worker_task_slots_available{task_queue="mctl-dev-loop-implement"})
          for: 30m
          labels:
            severity: warning
            namespace: admins
          annotations:
            summary: no Temporal SDK metrics from the mctl-agents implementation worker
            description: |
              temporal_worker_task_slots_available has been absent for
              mctl-dev-loop-implement for 30m. The implementation worker polls
              that queue and exports even while idle, so absence means the pod
              is down or unscraped — not that the queue is quiet.

              Before the routing flip (mctl-agents#396) this costs nothing.
              After it, a silent implementation worker means every approved
              DevLoop is waiting on a queue nobody polls. Check the pod
              admins/mctl-agents-worker-implement and the VMServiceScrape at
              bootstrap/templates/mctl-platform/mctl-agents-worker-monitor.yaml.

        # The stall the queue-age rule structurally cannot see.
        #
        # Schedule-to-start latency is observed when a worker RECEIVES an
        # activity task, so while every slot is held and nothing is being
        # admitted, no observation is made at all — the histogram is not
        # slow, it is empty, and a rule built on it stays quiet exactly
        # while the queue is most stuck. This one reads the pool itself,
        # which is exported every scrape whether or not anything moves.
        #
        # A full pool is normal: at N=3 three concurrent implementers is
        # the design, and runs take 30-70 minutes, so hours of zero free
        # slots is the abnormal part rather than the zero. `for: 4h` is
        # therefore well past a legitimate back-to-back burst, and is the
        # reason this does not contradict the deliberate exclusion of
        # mctl-dev-loop-implement from MctlAgentsWorkerActivitySlotsExhausted
        # above — that rule fires on the instant, this one on the duration.
        #
        # `sum` across pods for the same reason as there: the queue is
        # stalled only when no worker anywhere can take work. Under the
        # replicaCount: 1 invariant the two agree today.
        - alert: MctlAgentsImplementAdmissionStalled
          expr: |
            sum(temporal_worker_task_slots_available{worker_type="ActivityWorker", task_queue="mctl-dev-loop-implement"}) == 0
          for: 4h
          labels:
            severity: warning
            namespace: admins
          annotations:
            summary: no free implementation slots for 4h; approved DevLoops cannot be admitted
            description: |
              Every activity slot on mctl-dev-loop-implement has been held for
              four hours, so nothing new has been admitted in that time and no
              schedule-to-start latency has been observed — which is why
              MctlAgentsImplementQueueAgeHigh is silent rather than firing.

              Either the N admitted implementers are genuinely running long,
              or they are wedged: an activity whose Argo workflow never
              terminates holds its slot until the worker restarts. Check the
              running mctl-agents-implement-* workflows in Argo and
              temporal_worker_task_slots_used{task_queue="mctl-dev-loop-implement"},
              then decide between raising
              IMPLEMENTATION_MAX_CONCURRENT_ACTIVITIES in
              platform-gitops/services/admins/mctl-agents-worker-implement/values.yaml
              and terminating the stuck run. Context: mctl-agents#395.
