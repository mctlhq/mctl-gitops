# Unit tests for mctl-alerts.yaml (group mctl.argocd).
#
# rule_files is resolved relative to this file. generated/ is produced by
# scripts/check-vm-rules.sh, which extracts each VMRule's `.spec` so
# promtool can evaluate the very rules the cluster runs.
rule_files:
  - generated/mctl-alerts.yaml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------
  # ArgoCDGitPollingStalled
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a repo-server that keeps polling mctl-gitops stays quiet
    input_series:
      - series: 'argocd_git_request_total{request_type="ls-remote",repo="https://github.com/mctlhq/mctl-gitops.git",namespace="argocd"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: ArgoCDGitPollingStalled
        exp_alerts: []

  - interval: 1m
    name: a flat ls-remote counter for 20m fires
    input_series:
      - series: 'argocd_git_request_total{request_type="ls-remote",repo="https://github.com/mctlhq/mctl-gitops.git",namespace="argocd"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: ArgoCDGitPollingStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              request_type: ls-remote
              repo: https://github.com/mctlhq/mctl-gitops.git
              namespace: argocd
            exp_annotations:
              summary: Argo CD has not polled mctl-gitops for 10m
              description: >-
                argocd_git_request_total{request_type="ls-remote"} for
                mctl-gitops has not increased in 10m. Applications keep
                reporting Synced on their last-seen revision while this holds.
                Check the argocd-repo-server and argocd-application-controller
                pods and logs (Loki — the controller log rotates within an hour).

  - interval: 1m
    name: a stalled fetch counter or another repo does not count as stalled polling
    input_series:
      - series: 'argocd_git_request_total{request_type="fetch",repo="https://github.com/mctlhq/mctl-gitops.git",namespace="argocd"}'
        values: '100x40'
      - series: 'argocd_git_request_total{request_type="ls-remote",repo="https://github.com/mctlhq/mctl-api.git",namespace="argocd"}'
        values: '100x40'
      - series: 'argocd_git_request_total{request_type="ls-remote",repo="https://github.com/mctlhq/mctl-gitops.git",namespace="argocd"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: ArgoCDGitPollingStalled
        exp_alerts: []

  # ---------------------------------------------------------------------
  # NodeMemoryHeadroomLow (group mctl.node-health)
  #
  # The tier below NodeHighMemory. Both directions are asserted: a node at
  # 87% fires, a node at 80% does not, and 87% that recedes before the 10m
  # hold elapses does not either. A test that can only pass is not a test.
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a node holding 87% memory for 10m fires
    input_series:
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.102:9100"}'
        values: '100x20'
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.102:9100"}'
        values: '13x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeMemoryHeadroomLow
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.0.102:9100
            exp_annotations:
              summary: >-
                Node 10.0.0.102:9100 memory headroom below 15%
                (87% used for 10 minutes)

  - interval: 1m
    name: a node at 80% memory stays quiet
    input_series:
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.102:9100"}'
        values: '100x20'
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.102:9100"}'
        values: '20x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeMemoryHeadroomLow
        exp_alerts: []

  - interval: 1m
    name: an 87% spike shorter than the 10m hold does not fire
    input_series:
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.102:9100"}'
        values: '100x20'
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.102:9100"}'
        values: '13x8 40x12'
    alert_rule_test:
      # Inside the spike but before the hold elapses: the 10m `for` is what
      # keeps this quiet. Shorten the hold and this assertion fails, which is
      # the point -- the 12m check alone passes at any hold length because the
      # series has already recovered by then.
      - eval_time: 5m
        alertname: NodeMemoryHeadroomLow
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeMemoryHeadroomLow
        exp_alerts: []
