# Unit tests for mctl-telegram-alerts.yaml.
#
# rule_files is resolved relative to this file. generated/ is produced by
# scripts/check-vm-rules.sh, which extracts each VMRule's `.spec` — a plain
# Prometheus rule-group document — so promtool can evaluate the very rules
# the cluster runs.
rule_files:
  - generated/mctl-telegram-alerts.yaml

evaluation_interval: 1m

tests:
  # HighToolErrorRate shipped without aggregation on either side of the
  # division. PromQL then matches series on every shared label, `status`
  # included, so each error series was divided by itself: the expression
  # evaluated to exactly 1 whenever any tool had errored at all, and the 10%
  # threshold was unreachable in either direction. A syntax check has nothing
  # to say about that, which is why it survived for months.
  - interval: 1m
    name: HighToolErrorRate stays quiet at a 3% error rate
    input_series:
      # 3 errors and 97 successes over 20 minutes, spread across two tools.
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="send_message",status="error"}'
        values: '0+0.1x20'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="send_message",status="ok"}'
        values: '0+3x20'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="list_dialogs",status="ok"}'
        values: '0+1.9x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: HighToolErrorRate
        exp_alerts: []

  - interval: 1m
    name: HighToolErrorRate fires when a fifth of the calls fail
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="send_message",status="error"}'
        values: '0+1x30'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="send_message",status="ok"}'
        values: '0+4x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighToolErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mctl-telegram
              instance: prod
            exp_annotations:
              summary: "mctl-telegram: more than 10% of tool calls are failing"
              description: >-
                More than 10% of MCP tool invocations are returning errors over
                the last 15 minutes. Check mctl-telegram logs for the specific
                tools failing (tool label on mctl_tool_invocations_total).

  # The instance label is deliberately kept out of the aggregation so the
  # preview deployment's soak traffic cannot drag production over the
  # threshold, or hide a production failure behind preview's clean calls.
  - interval: 1m
    name: a failing preview does not implicate production
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="preview",tool="send_message",status="error"}'
        values: '0+1x30'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="send_message",status="ok"}'
        values: '0+4x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighToolErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mctl-telegram
              instance: preview
            exp_annotations:
              summary: "mctl-telegram: more than 10% of tool calls are failing"
              description: >-
                More than 10% of MCP tool invocations are returning errors over
                the last 15 minutes. Check mctl-telegram logs for the specific
                tools failing (tool label on mctl_tool_invocations_total).

  # caller_error (mctl-telegram#757) is outside the ratio. A tenth of the
  # calls refused as the caller's mistake is not "tool calls are failing".
  - interval: 1m
    name: HighToolErrorRate ignores caller_error calls
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="caller_error"}'
        values: '0+5x30'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="ok"}'
        values: '0+4x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighToolErrorRate
        exp_alerts: []

  # ...and caller_error volume must not dilute real errors either: 1 error
  # against 4 ok is 20% of the calls that count. The old bare-counter
  # denominator read the same input as 1 in 25 (4%) and stayed quiet.
  - interval: 1m
    name: HighToolErrorRate still fires on errors hidden among caller_error calls
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="send_message",status="error"}'
        values: '0+1x30'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="send_message",status="ok"}'
        values: '0+4x30'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="caller_error"}'
        values: '0+20x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighToolErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mctl-telegram
              instance: prod
            exp_annotations:
              summary: "mctl-telegram: more than 10% of tool calls are failing"
              description: >-
                More than 10% of MCP tool invocations are returning errors over
                the last 15 minutes. Check mctl-telegram logs for the specific
                tools failing (tool label on mctl_tool_invocations_total).

  # MctlTelegramCallerErrorShareHigh (mctl-telegram#759): the case the
  # ok|error allow-list cannot see. Every call refused as a 400 leaves the SLI
  # and HighToolErrorRate empty, and this is what fires instead.
  - interval: 1m
    name: MctlTelegramCallerErrorShareHigh fires when most calls are caller errors
    input_series:
      # 60 caller_error against 18 ok per hour: 77%.
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="caller_error"}'
        values: '0+1x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="list_dialogs",status="ok"}'
        values: '0+0.3x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: MctlTelegramCallerErrorShareHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mctl-telegram
            exp_annotations:
              summary: "mctl-telegram: more than half of tool calls are caller errors"
              description: >-
                Over the last hour more than 50% of MCP tool invocations were
                classified caller_error, which the availability SLI and
                HighToolErrorRate do not count. Either one client is looping on
                a bad request, or a server-side regression makes Telegram refuse
                every call and the SLI cannot see it.
              runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramcallererrorsharehigh"
      - eval_time: 90m
        alertname: HighToolErrorRate
        exp_alerts: []

  # Ordinary traffic: about 9% caller errors, well under half.
  - interval: 1m
    name: MctlTelegramCallerErrorShareHigh stays quiet at a normal share
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="caller_error"}'
        values: '0+0.5x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="ok"}'
        values: '0+5x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: MctlTelegramCallerErrorShareHigh
        exp_alerts: []

  # A quiet hour with a handful of calls, all refused: 100%, but 6 calls is
  # below the volume floor and says nothing about the service.
  - interval: 1m
    name: MctlTelegramCallerErrorShareHigh stays quiet below the volume floor
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="caller_error"}'
        values: '0+0.1x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: MctlTelegramCallerErrorShareHigh
        exp_alerts: []

  # The share is the service's, not a pod's. Three replicas (instance is the
  # pod IP) each refuse 15 calls an hour: 45 of 45 service-wide, while no
  # single pod reaches the 20-call floor. Aggregating per instance missed it.
  - interval: 1m
    name: MctlTelegramCallerErrorShareHigh sums the replicas
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="10.0.0.1:8080",tool="get_messages",status="caller_error"}'
        values: '0+0.25x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="10.0.0.2:8080",tool="get_messages",status="caller_error"}'
        values: '0+0.25x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="10.0.0.3:8080",tool="get_messages",status="caller_error"}'
        values: '0+0.25x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: MctlTelegramCallerErrorShareHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mctl-telegram
            exp_annotations:
              summary: "mctl-telegram: more than half of tool calls are caller errors"
              description: >-
                Over the last hour more than 50% of MCP tool invocations were
                classified caller_error, which the availability SLI and
                HighToolErrorRate do not count. Either one client is looping on
                a bad request, or a server-side regression makes Telegram refuse
                every call and the SLI cannot see it.
              runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramcallererrorsharehigh"

  # mctl-telegram#974 adds a `traffic` label ("user" | "canary"). This alert
  # must keep reading all traffic as one ratio. Here a canary failing every
  # call (0.2/min) sits next to 10 healthy user calls per minute: about 2%
  # overall, quiet. With `traffic` left out of the without() the canary's
  # series becomes its own ratio of 1 and fires.
  - interval: 1m
    name: HighToolErrorRate does not split by traffic class
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="list_dialogs",status="error",traffic="canary"}'
        values: '0+0.2x30'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="ok",traffic="user"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighToolErrorRate
        exp_alerts: []

  # MctlTelegramCallerErrorShareHigh reads user traffic only (#2294). The
  # canary's ok calls (2 every 10 minutes, 12 an hour) used to dilute a
  # partial regression: here a client loops on 15 refused calls an hour next
  # to 9 good user calls, 62.5% of user traffic, which reads 15/36 = 42% once
  # the canary is counted and stays quiet.
  - interval: 1m
    name: MctlTelegramCallerErrorShareHigh is not diluted by canary traffic
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="caller_error",traffic="user"}'
        values: '0+0.25x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="ok",traffic="user"}'
        values: '0+0.15x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="list_dialogs",status="ok",traffic="canary"}'
        values: '0+0.1x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_unread_messages",status="ok",traffic="canary"}'
        values: '0+0.1x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: MctlTelegramCallerErrorShareHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mctl-telegram
            exp_annotations:
              summary: "mctl-telegram: more than half of tool calls are caller errors"
              description: >-
                Over the last hour more than 50% of MCP tool invocations were
                classified caller_error, which the availability SLI and
                HighToolErrorRate do not count. Either one client is looping on
                a bad request, or a server-side regression makes Telegram refuse
                every call and the SLI cannot see it.
              runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramcallererrorsharehigh"

  # The >= 20 floor is about user volume too. 15 refused user calls an hour
  # are below it; the canary's 12 ok calls used to lift the hour to 27 calls
  # at 56% and fire on traffic the floor exists to ignore.
  - interval: 1m
    name: MctlTelegramCallerErrorShareHigh does not count the canary toward the volume floor
    input_series:
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_messages",status="caller_error",traffic="user"}'
        values: '0+0.25x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="list_dialogs",status="ok",traffic="canary"}'
        values: '0+0.1x90'
      - series: 'mctl_tool_invocations_total{job="mctl-telegram",instance="prod",tool="get_unread_messages",status="ok",traffic="canary"}'
        values: '0+0.1x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: MctlTelegramCallerErrorShareHigh
        exp_alerts: []

  # Connector login funnel (mctl-telegram#960). Series carry the labels the
  # real scrape adds: job is the service, pod changes on every rollout.
  - interval: 1m
    name: MctlTelegramConnectorNoFirstCall stays quiet on a healthy funnel
    input_series:
      # 6 ok and 2 none for chatgpt over 6h: two users walked away, a
      # quarter of the grants. The count clause alone would fire; the share
      # keeps it quiet.
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="a",client="chatgpt",outcome="ok",reason=""}'
        values: '0x60 1x60 2x60 3x60 4x60 5x60 6x60'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="a",client="chatgpt",outcome="none_within_window",reason=""}'
        values: '0x200 1x100 2x120'
    alert_rule_test:
      - eval_time: 400m
        alertname: MctlTelegramConnectorNoFirstCall
        exp_alerts: []

  - interval: 1m
    name: MctlTelegramConnectorNoFirstCall ignores a single walk-away
    # 1 of 1 decided grants is none: share 100%, but count is 1.
    input_series:
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="a",client="claude",outcome="ok",reason=""}'
        values: '0x120'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="a",client="claude",outcome="none_within_window",reason=""}'
        values: '0x30 1x90'
    alert_rule_test:
      - eval_time: 110m
        alertname: MctlTelegramConnectorNoFirstCall
        exp_alerts: []

  - interval: 1m
    name: MctlTelegramConnectorNoFirstCall fires on the 2026-10-30 shape, across a rollout
    # A chatgpt user retries three times; every grant ends with no call.
    # The third lands on a new pod after a rollout, so the counter is a
    # fresh series primed at 0. One unrelated claude grant succeeds.
    input_series:
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="a",client="chatgpt",outcome="none_within_window",reason=""}'
        values: '0x20 1x20 2x20 _x60'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="b",client="chatgpt",outcome="none_within_window",reason=""}'
        values: '_x60 0x20 1x40'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="a",client="chatgpt",outcome="ok",reason=""}'
        values: '0x60 _x60'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="b",client="chatgpt",outcome="ok",reason=""}'
        values: '_x60 0x60'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="b",client="claude",outcome="ok",reason=""}'
        values: '_x60 0x10 1x50'
    alert_rule_test:
      # Two none by 40m; `for: 5m` fires from 45m.
      - eval_time: 38m
        alertname: MctlTelegramConnectorNoFirstCall
        exp_alerts: []
      - eval_time: 110m
        alertname: MctlTelegramConnectorNoFirstCall
        exp_alerts:
          - exp_labels:
              severity: warning
              job: labs-mctl-telegram-base-service
              client: chatgpt
            exp_annotations:
              summary: "mctl-telegram: chatgpt connectors get tokens but never make a call"
              description: >-
                At least half of the chatgpt authorization_code
                grants in the last 6h were followed by no successful MCP call
                within 5 minutes. The connector is authenticating and then
                failing on its first request: check the connector URL (it must
                end in /mcp), mctl_root_mcp_requests_total, and the
                connect_first_call table.
              runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#connectfirstcall"

  - interval: 1m
    name: MctlTelegramConnectorNoFirstCall keeps preview apart from production
    # Preview fails twice; production succeeds. Only preview fires.
    input_series:
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-preview-base-service",pod="p",client="other",outcome="none_within_window",reason=""}'
        values: '0x10 1x10 2x40'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-preview-base-service",pod="p",client="other",outcome="ok",reason=""}'
        values: '0x60'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="a",client="other",outcome="ok",reason=""}'
        values: '0x10 5x50'
      - series: 'mctl_connect_first_call_total{job="labs-mctl-telegram-base-service",pod="a",client="other",outcome="none_within_window",reason=""}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: MctlTelegramConnectorNoFirstCall
        exp_alerts:
          - exp_labels:
              severity: warning
              job: labs-mctl-telegram-preview-base-service
              client: other
            exp_annotations:
              summary: "mctl-telegram: other connectors get tokens but never make a call"
              description: >-
                At least half of the other authorization_code
                grants in the last 6h were followed by no successful MCP call
                within 5 minutes. The connector is authenticating and then
                failing on its first request: check the connector URL (it must
                end in /mcp), mctl_root_mcp_requests_total, and the
                connect_first_call table.
              runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#connectfirstcall"

  - interval: 1m
    name: MctlTelegramConnectFunnelStoreErrors fires on repeated store errors only
    input_series:
      - series: 'mctl_connect_first_call_errors_total{job="labs-mctl-telegram-base-service",pod="a",op="close"}'
        values: '0x10 1x10 2x10 3x60'
      - series: 'mctl_connect_first_call_errors_total{job="labs-mctl-telegram-base-service",pod="a",op="insert"}'
        values: '0x10 1x80'
    alert_rule_test:
      - eval_time: 25m
        alertname: MctlTelegramConnectFunnelStoreErrors
        exp_alerts: []
      - eval_time: 45m
        alertname: MctlTelegramConnectFunnelStoreErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: labs-mctl-telegram-base-service
              op: close
            exp_annotations:
              summary: "mctl-telegram: connect funnel store errors (close)"
              description: >-
                The connect first-call funnel hit more than two store errors
                on op close in the last hour. Grant outcomes are
                being recorded as unknown, so MctlTelegramConnectorNoFirstCall
                cannot see a broken connector. Check the server logs for
                "connect funnel:" warnings and the database.
              runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#connectfirstcall"

  - interval: 1m
    name: MctlTelegramLoginExchangeFailing ignores the canary floor and user rejections
    # One canary unknown_state every 10 minutes, users cancelling and
    # reusing links, prefetches, and a single exchange failure.
    input_series:
      - series: 'mctl_login_callback_rejected_total{job="labs-mctl-telegram-base-service",pod="a",route="oauth_callback",reason="unknown_state"}'
        values: '0+0.1x90'
      - series: 'mctl_login_callback_rejected_total{job="labs-mctl-telegram-base-service",pod="a",route="oauth_callback",reason="oidc_error"}'
        values: '0+0.2x90'
      - series: 'mctl_login_callback_rejected_total{job="labs-mctl-telegram-base-service",pod="a",route="connect_done",reason="prefetch_refused"}'
        values: '0+1x90'
      - series: 'mctl_login_callback_rejected_total{job="labs-mctl-telegram-base-service",pod="a",route="oauth_callback",reason="exchange_failed"}'
        values: '0x30 1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: MctlTelegramLoginExchangeFailing
        exp_alerts: []

  - interval: 1m
    name: MctlTelegramLoginExchangeFailing fires on repeated exchange failures on either route
    input_series:
      - series: 'mctl_login_callback_rejected_total{job="labs-mctl-telegram-base-service",pod="a",route="oauth_callback",reason="exchange_failed"}'
        values: '0x20 1x40'
      - series: 'mctl_login_callback_rejected_total{job="labs-mctl-telegram-base-service",pod="a",route="connect_done",reason="exchange_failed"}'
        values: '0x25 1x35'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlTelegramLoginExchangeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: labs-mctl-telegram-base-service
            exp_annotations:
              summary: "mctl-telegram: Telegram sign-in token exchange is failing"
              description: >-
                Two or more Telegram OIDC returns in the last 30 minutes failed
                at the server-side token exchange (route label on
                mctl_login_callback_rejected_total says which flow). Users
                finish the Telegram step and still cannot sign in. Check the
                "telegram OIDC token exchange failed" and "connect: request
                rejected" log lines for the error, and Telegram's token
                endpoint and JWKS reachability.
              runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#loginpathsignals"

  # HighToolLatency. Each case seeds 90 minutes of calls at a steady rate:
  # the _count and the le="5" bucket grow per minute, and the difference is
  # the number of calls that took longer than 5s. Every pod also has an `up`
  # series, because the rule only counts pods that were up an hour before.
  #
  # The old rule took histogram_quantile per pod over 5 minutes. A few slow
  # calls on one pod among many fast ones then read as a p95 breach.
  - interval: 1m
    name: HighToolLatency ignores a slow pod when the job as a whole is fast
    input_series:
      # Pod a: 1 call/min, 2 of 60 slow in the last hour. Pod b: 2 calls/min, all fast.
      - series: 'up{job="labs-mctl-telegram-base-service",pod="a"}'
        values: '1x90'
      - series: 'mctl_tool_invocation_duration_seconds_count{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages"}'
        values: '0+1x90'
      - series: 'mctl_tool_invocation_duration_seconds_bucket{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages",le="5"}'
        values: '0+1x50 50x2 51+1x38'
      - series: 'up{job="labs-mctl-telegram-base-service",pod="b"}'
        values: '1x90'
      - series: 'mctl_tool_invocation_duration_seconds_count{job="labs-mctl-telegram-base-service",pod="b",tool="get_messages"}'
        values: '0+2x90'
      - series: 'mctl_tool_invocation_duration_seconds_bucket{job="labs-mctl-telegram-base-service",pod="b",tool="get_messages",le="5"}'
        values: '0+2x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: HighToolLatency
        exp_alerts: []

  - interval: 1m
    name: HighToolLatency stays quiet on fewer than 20 calls an hour, even if all are slow
    input_series:
      # 15 calls over the hour (one every 4 minutes), none under 5s.
      - series: 'up{job="labs-mctl-telegram-base-service",pod="a"}'
        values: '1x90'
      - series: 'mctl_tool_invocation_duration_seconds_count{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages"}'
        values: '0+0.25x90'
      - series: 'mctl_tool_invocation_duration_seconds_bucket{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages",le="5"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: HighToolLatency
        exp_alerts: []

  - interval: 1m
    name: HighToolLatency leaves slow calls explained by flood waits to the flood-wait signals
    input_series:
      # 60 calls/h, 12 of them slow (0.2/min), and as many FLOOD_WAIT events.
      - series: 'up{job="labs-mctl-telegram-base-service",pod="a"}'
        values: '1x90'
      - series: 'mctl_tool_invocation_duration_seconds_count{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages"}'
        values: '0+1x90'
      - series: 'mctl_tool_invocation_duration_seconds_bucket{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages",le="5"}'
        values: '0+0.8x90'
      - series: 'mctl_telegram_flood_wait_events_total{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages"}'
        values: '0+0.2x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: HighToolLatency
        exp_alerts: []

  # The flood counter has no series until its first increment. Without the
  # "or 0 * count" fallback the subtraction matches nothing, and the rule
  # could never fire for a tool that had never flood-waited.
  - interval: 1m
    name: HighToolLatency fires on slow calls with no flood waits, and no flood series at all
    input_series:
      # 60 calls/h, 12 slow, no mctl_telegram_flood_wait_events_total series.
      - series: 'up{job="labs-mctl-telegram-base-service",pod="a"}'
        values: '1x90'
      - series: 'mctl_tool_invocation_duration_seconds_count{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages"}'
        values: '0+1x90'
      - series: 'mctl_tool_invocation_duration_seconds_bucket{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages",le="5"}'
        values: '0+0.8x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: HighToolLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              job: labs-mctl-telegram-base-service
              tool: get_messages
            exp_annotations:
              summary: "mctl-telegram: get_messages calls are slow without a flood wait"
              description: >-
                Over the last hour, 20% of get_messages calls took longer
                than 5 seconds, after subtracting the calls explained by
                Telegram FLOOD_WAIT. This holds over at least 20 calls.
                Slowdowns that flood waits do not explain point at MTProto
                round-trips, DC migration or reconnects, or the server
                itself. Compare with mctl_telegram_flood_wait_seconds and the
                "telegram flood wait" log line.

  # Flood waits on one tool must not cover a slowdown on another, and one
  # flood event per two slow calls leaves half of them unexplained.
  - interval: 1m
    name: HighToolLatency fires when flood events explain only part of the slow calls
    input_series:
      - series: 'up{job="labs-mctl-telegram-base-service",pod="a"}'
        values: '1x90'
      - series: 'mctl_tool_invocation_duration_seconds_count{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages"}'
        values: '0+1x90'
      - series: 'mctl_tool_invocation_duration_seconds_bucket{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages",le="5"}'
        values: '0+0.8x90'
      - series: 'mctl_telegram_flood_wait_events_total{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages"}'
        values: '0+0.1x90'
      - series: 'mctl_telegram_flood_wait_events_total{job="labs-mctl-telegram-base-service",pod="a",tool="list_dialogs"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: HighToolLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              job: labs-mctl-telegram-base-service
              tool: get_messages
            exp_annotations:
              summary: "mctl-telegram: get_messages calls are slow without a flood wait"
              description: >-
                Over the last hour, 10% of get_messages calls took longer
                than 5 seconds, after subtracting the calls explained by
                Telegram FLOOD_WAIT. This holds over at least 20 calls.
                Slowdowns that flood waits do not explain point at MTProto
                round-trips, DC migration or reconnects, or the server
                itself. Compare with mctl_telegram_flood_wait_seconds and the
                "telegram flood wait" log line.

  # A pod that started less than an hour ago is left out. In VictoriaMetrics
  # its new series make increase() read phantom slow calls. Here the new pod
  # is genuinely slow, and the rule still waits for it to reach an hour of age.
  - interval: 1m
    name: HighToolLatency does not judge a pod in its first hour
    input_series:
      # Pod a: up throughout, 1 call/min, all fast. Pod b: started at 50m, 1 call/min, all slow.
      - series: 'up{job="labs-mctl-telegram-base-service",pod="a"}'
        values: '1x90'
      - series: 'mctl_tool_invocation_duration_seconds_count{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages"}'
        values: '0+1x90'
      - series: 'mctl_tool_invocation_duration_seconds_bucket{job="labs-mctl-telegram-base-service",pod="a",tool="get_messages",le="5"}'
        values: '0+1x90'
      - series: 'up{job="labs-mctl-telegram-base-service",pod="b"}'
        values: '_x50 1x40'
      - series: 'mctl_tool_invocation_duration_seconds_count{job="labs-mctl-telegram-base-service",pod="b",tool="get_messages"}'
        values: '_x50 0+1x40'
      - series: 'mctl_tool_invocation_duration_seconds_bucket{job="labs-mctl-telegram-base-service",pod="b",tool="get_messages",le="5"}'
        values: '_x50 0x40'
    alert_rule_test:
      - eval_time: 90m
        alertname: HighToolLatency
        exp_alerts: []
