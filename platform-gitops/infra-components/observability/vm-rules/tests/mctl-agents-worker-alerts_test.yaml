# Unit tests for mctl-agents-worker-alerts.yaml.
#
# rule_files is resolved relative to this file. generated/ is produced by
# scripts/check-vm-rules.sh, which extracts each VMRule's `.spec` so
# promtool can evaluate the very rules the cluster runs.
#
# These alerts guard a condition that is invisible by construction — a full
# slot pool looks like an idle one — so the case worth testing hardest is
# not "does it fire" but "does it stay quiet when the queue is healthy" and
# "can it tell the two queues apart". The roles share every label except
# task_queue (both report service_name="temporal-core-sdk"), so a selector
# mistake there would silently merge them.
rule_files:
  - generated/mctl-agents-worker-alerts.yaml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------
  # MctlAgentsControlQueueScheduleToStartHigh
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a healthy control queue picks activities up immediately and stays quiet
    input_series:
      # 600 activities over 30m waiting 0.6s in total => 1ms average.
      - series: 'temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+0.02x30'
      - series: 'temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+20x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlAgentsControlQueueScheduleToStartHigh
        exp_alerts: []

  - interval: 1m
    name: sustained control-queue waiting fires
    input_series:
      # 2 activities/min each waiting 5s => 2.5s average, well over 1s.
      - series: 'temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+10x40'
      - series: 'temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+4x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: MctlAgentsControlQueueScheduleToStartHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
            exp_annotations:
              summary: mctl-agents control queue activities are waiting >1s to start
              description: |
                Activities scheduled on mctl-dev-loop are averaging over a second
                between being scheduled and a worker picking them up, for 15m.
                Every activity on this queue is short, so this is slot-pool
                saturation, not slow work — reconcile and issue intake are
                likely stalled even though the worker looks healthy.

                Check temporal_worker_task_slots_available{task_queue="mctl-dev-loop"}.
                If it is at or near zero, the control worker is holding long
                Argo polls: CONTROL_MAX_CONCURRENT_ACTIVITIES in
                orchestrator/temporal/constants.py is the ceiling, and the
                routing flip (mctl-agents#251) is what moves that load off
                this queue.

  - interval: 1m
    name: the exec queue waiting does not fire the control-queue alert
    input_series:
      # Identical saturation, wrong queue. submit_and_wait genuinely waits
      # on the exec queue — hours per slot is its normal mode — so the
      # control-queue rule must be selecting on task_queue and not merely
      # aggregating everything the scrape returns.
      - series: 'temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop-exec",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+10x40'
      - series: 'temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop-exec",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+4x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: MctlAgentsControlQueueScheduleToStartHigh
        exp_alerts: []

  # ---------------------------------------------------------------------
  # MctlAgentsWorkerActivitySlotsExhausted
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a pool with slots left stays quiet
    input_series:
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '40x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlAgentsWorkerActivitySlotsExhausted
        exp_alerts: []

  - interval: 1m
    name: a fully occupied activity pool fires with its queue named
    input_series:
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlAgentsWorkerActivitySlotsExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
              task_queue: mctl-dev-loop
            exp_annotations:
              summary: mctl-agents worker has no free activity slots on mctl-dev-loop
              description: |
                The activity slot pool for mctl-dev-loop has been fully
                occupied for 20m. On mctl-dev-loop this is the starvation
                ADR-008 exists to remove and it will be stalling reconcile and
                intake; on mctl-dev-loop-exec it means concurrent Argo runs have
                reached EXECUTION_MAX_CONCURRENT_ACTIVITIES and new agent
                executions are queueing.

                Both ceilings are in orchestrator/temporal/constants.py. Per
                ADR-008 D3 they are starting values meant to be moved from
                observed numbers — this alert is one of those numbers.

  - interval: 1m
    name: one saturated pod is not queue starvation while a sibling has slots
    input_series:
      # Both roles are replicaCount 1 today, where min and sum agree. They
      # answer different questions the moment that changes, and only one is
      # this alert's: the queue is starved when NO worker can take work, not
      # when the worst pod happens to be full.
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",instance="10.0.0.1:8080"}'
        values: '0x30'
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",instance="10.0.0.2:8080"}'
        values: '60x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlAgentsWorkerActivitySlotsExhausted
        exp_alerts: []

  - interval: 1m
    name: every pod full is queue starvation and fires
    input_series:
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",instance="10.0.0.1:8080"}'
        values: '0x30'
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",instance="10.0.0.2:8080"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlAgentsWorkerActivitySlotsExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
              task_queue: mctl-dev-loop
            exp_annotations:
              summary: mctl-agents worker has no free activity slots on mctl-dev-loop
              description: |
                The activity slot pool for mctl-dev-loop has been fully
                occupied for 20m. On mctl-dev-loop this is the starvation
                ADR-008 exists to remove and it will be stalling reconcile and
                intake; on mctl-dev-loop-exec it means concurrent Argo runs have
                reached EXECUTION_MAX_CONCURRENT_ACTIVITIES and new agent
                executions are queueing.

                Both ceilings are in orchestrator/temporal/constants.py. Per
                ADR-008 D3 they are starting values meant to be moved from
                observed numbers — this alert is one of those numbers.

  - interval: 1m
    name: an exhausted workflow-task pool is not an activity-slot alert
    input_series:
      # max_concurrent_workflow_tasks is deliberately unset (ADR-008 D3), so
      # the WorkflowWorker and LocalActivityWorker pools sitting at their
      # own ceilings must not be read as activity starvation.
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="WorkflowWorker",service_name="temporal-core-sdk"}'
        values: '0x30'
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="LocalActivityWorker",service_name="temporal-core-sdk"}'
        values: '0x30'
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '75x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlAgentsWorkerActivitySlotsExhausted
        exp_alerts: []

  # ---------------------------------------------------------------------
  # MctlAgentsWorkerMetricsMissing
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a silent exporter is reported rather than read as health
    input_series:
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop-exec",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '40x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: MctlAgentsWorkerMetricsMissing
        exp_alerts:
          # absent() synthesises the labels of its own selector, so the
          # alert carries task_queue="mctl-dev-loop" even though no such
          # series exists. Useful rather than incidental: the notification
          # names which queue went silent.
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
              task_queue: mctl-dev-loop
            exp_annotations:
              summary: no Temporal SDK metrics from the mctl-agents control worker
              description: |
                temporal_worker_task_slots_available has been absent for the
                control queue for 30m. Either the worker is down, or the
                exporter is not being scraped — the two saturation alerts in
                this group cannot fire while this is true, so they are not
                evidence of health right now.

                Check the VMServiceScrape at
                bootstrap/templates/mctl-platform/mctl-agents-worker-monitor.yaml
                and that the pod is serving :8080/metrics (METRICS_PORT in
                orchestrator/temporal/constants.py).

  - interval: 1m
    name: a reporting control worker keeps the absent-metrics alert quiet
    input_series:
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: MctlAgentsWorkerMetricsMissing
        exp_alerts: []

  # ---------------------------------------------------------------------
  # MctlAgentsExecWorkerMetricsMissing
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a silent exec worker is reported even while the control worker is fine
    input_series:
      # The exec worker polls mctl-dev-loop-exec and exports even while
      # idle, so absence is the pod being down or unscraped — not the queue
      # being quiet. Before the #251 flip this costs nothing; after it, a
      # silent exec worker means every agent execution has stopped.
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: MctlAgentsExecWorkerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
              task_queue: mctl-dev-loop-exec
            exp_annotations:
              summary: no Temporal SDK metrics from the mctl-agents execution worker
              description: |
                temporal_worker_task_slots_available has been absent for
                mctl-dev-loop-exec for 30m. The execution worker polls that
                queue and exports even while idle, so absence means the pod is
                down or unscraped — not that the queue is quiet.

                Before the routing flip (mctl-agents#251) this costs nothing:
                nothing schedules onto the exec queue yet. After it, a silent
                exec worker means every agent execution has stopped, which is
                exactly the class of failure this group exists to make loud.

  - interval: 1m
    name: both workers reporting keeps both absent-metrics alerts quiet
    input_series:
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '100x40'
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop-exec",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '40x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: MctlAgentsExecWorkerMetricsMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: MctlAgentsWorkerMetricsMissing
        exp_alerts: []

  - interval: 1m
    name: another service's exhausted Temporal queue does not fire our alert
    input_series:
      # temporal_* are generic SDK metric names. Every rule in this group
      # carries a static mctl_agent_self="true" that the AlertManager route
      # DROPS — so an unscoped selector would not merely mislabel someone
      # else's saturation as ours, it would silence their page.
      - series: 'temporal_worker_task_slots_available{task_queue="some-other-team-queue",worker_type="ActivityWorker"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlAgentsWorkerActivitySlotsExhausted
        exp_alerts: []

  # ---------------------------------------------------------------------
  # The admission queue (mctl-agents#395, #1285)
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a full implementation pool is normal and does not fire the exhaustion alert
    input_series:
      # N=3, all three slots taken for the whole window. On the admission
      # queue this is load, not starvation; the ADR-008 selector must not
      # widen to include it.
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop-implement",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MctlAgentsWorkerActivitySlotsExhausted
        exp_alerts: []

  - interval: 1m
    name: short admission waits stay quiet
    input_series:
      # One activity a minute admitted after ~10 minutes each: a busy but
      # keeping-up queue, well under the two-hour line.
      - series: 'temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop-implement",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+600x70'
      - series: 'temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop-implement",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 70m
        alertname: MctlAgentsImplementQueueAgeHigh
        exp_alerts: []

  - interval: 1m
    name: sustained multi-hour admission waits fire for a human
    input_series:
      # One activity a minute admitted after three hours each.
      - series: 'temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop-implement",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+10800x70'
      - series: 'temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop-implement",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 70m
        alertname: MctlAgentsImplementQueueAgeHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: admins
            exp_annotations:
              summary: approved DevLoops are waiting over 2h for implementation capacity
              description: |
                Activities on mctl-dev-loop-implement are averaging more than two
                hours between being scheduled and a worker slot admitting them,
                for 30m. That wait is admission working as designed — no Argo
                workflow exists for a queued DevLoop — but this long means the
                approval rate exceeds capacity N, or the admitted runs are not
                finishing and freeing their slots.

                Capacity is IMPLEMENTATION_MAX_CONCURRENT_ACTIVITIES in
                platform-gitops/services/admins/mctl-agents-worker-implement/values.yaml
                (one replica, by invariant). Check
                temporal_worker_task_slots_used{task_queue="mctl-dev-loop-implement"}
                against N and the running mctl-agents-implement-* workflows in
                Argo before raising N. Context: mctl-agents#395.

  - interval: 1m
    name: long exec-queue waits do not fire the admission alert
    input_series:
      # Same three-hour waits on the wrong queue. submit_and_wait on exec is
      # a different pool with a different meaning; the selector must not
      # merge them.
      - series: 'temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop-exec",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+10800x70'
      - series: 'temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop-exec",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 70m
        alertname: MctlAgentsImplementQueueAgeHigh
        exp_alerts: []

  - interval: 1m
    name: a silent implementation worker fires after 30m
    input_series:
      # The other two queues export; the implementation one never appears.
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '96x40'
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop-exec",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '40x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: MctlAgentsImplementWorkerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: admins
              task_queue: mctl-dev-loop-implement
            exp_annotations:
              summary: no Temporal SDK metrics from the mctl-agents implementation worker
              description: |
                temporal_worker_task_slots_available has been absent for
                mctl-dev-loop-implement for 30m. The implementation worker polls
                that queue and exports even while idle, so absence means the pod
                is down or unscraped — not that the queue is quiet.

                Before the routing flip (mctl-agents#396) this costs nothing.
                After it, a silent implementation worker means every approved
                DevLoop is waiting on a queue nobody polls. Check the pod
                admins/mctl-agents-worker-implement and the VMServiceScrape at
                bootstrap/templates/mctl-platform/mctl-agents-worker-monitor.yaml.

  - interval: 1m
    name: an exporting implementation worker keeps the absent alert quiet
    input_series:
      - series: 'temporal_worker_task_slots_available{task_queue="mctl-dev-loop-implement",worker_type="ActivityWorker",service_name="temporal-core-sdk"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: MctlAgentsImplementWorkerMetricsMissing
        exp_alerts: []

  # --- the stall the queue-age rule cannot see -------------------------------

  - interval: 5m
    name: a full slot pool for four hours fires the stall alert
    input_series:
      # Every slot held, nothing admitted — and therefore NO schedule-to-start
      # observations at all, which is the point: the queue-age rule has no
      # series to evaluate while this is happening.
      - series: 'temporal_worker_task_slots_available{worker_type="ActivityWorker",task_queue="mctl-dev-loop-implement",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 3h55m
        alertname: MctlAgentsImplementAdmissionStalled
        exp_alerts: []
      - eval_time: 4h5m
        alertname: MctlAgentsImplementAdmissionStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: admins
            exp_annotations:
              summary: no free implementation slots for 4h; approved DevLoops cannot be admitted
              description: |
                Every activity slot on mctl-dev-loop-implement has been held for
                four hours, so nothing new has been admitted in that time and no
                schedule-to-start latency has been observed — which is why
                MctlAgentsImplementQueueAgeHigh is silent rather than firing.

                Either the N admitted implementers are genuinely running long,
                or they are wedged: an activity whose Argo workflow never
                terminates holds its slot until the worker restarts. Check the
                running mctl-agents-implement-* workflows in Argo and
                temporal_worker_task_slots_used{task_queue="mctl-dev-loop-implement"},
                then decide between raising
                IMPLEMENTATION_MAX_CONCURRENT_ACTIVITIES in
                platform-gitops/services/admins/mctl-agents-worker-implement/values.yaml
                and terminating the stuck run. Context: mctl-agents#395.
      # And the queue-age rule is indeed silent through the same stall.
      - eval_time: 4h5m
        alertname: MctlAgentsImplementQueueAgeHigh
        exp_alerts: []

  - interval: 5m
    name: a busy pool that frees a slot does not fire the stall alert
    input_series:
      # Three hours full, then one slot returns. Back-to-back implementer
      # runs at N=3 look exactly like this and must stay quiet.
      - series: 'temporal_worker_task_slots_available{worker_type="ActivityWorker",task_queue="mctl-dev-loop-implement",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0x36 1x24'
    alert_rule_test:
      - eval_time: 4h5m
        alertname: MctlAgentsImplementAdmissionStalled
        exp_alerts: []

  - interval: 1m
    name: sparse admissions still hold the queue-age alert through the gaps
    input_series:
      # One three-hour wait admitted in the first ten minutes, then nothing
      # for an hour — the real N=3 cadence. The 30m rate windows go empty,
      # which would have collapsed the plain ratio to zero and reset for:.
      - series: 'temporal_activity_schedule_to_start_latency_sum{task_queue="mctl-dev-loop-implement",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+1080x10 10800x80'
      - series: 'temporal_activity_schedule_to_start_latency_count{task_queue="mctl-dev-loop-implement",service_name="temporal-core-sdk",namespace="mctl-agents"}'
        values: '0+0.1x10 1x80'
    alert_rule_test:
      - eval_time: 80m
        alertname: MctlAgentsImplementQueueAgeHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: admins
            exp_annotations:
              summary: approved DevLoops are waiting over 2h for implementation capacity
              description: |
                Activities on mctl-dev-loop-implement are averaging more than two
                hours between being scheduled and a worker slot admitting them,
                for 30m. That wait is admission working as designed — no Argo
                workflow exists for a queued DevLoop — but this long means the
                approval rate exceeds capacity N, or the admitted runs are not
                finishing and freeing their slots.

                Capacity is IMPLEMENTATION_MAX_CONCURRENT_ACTIVITIES in
                platform-gitops/services/admins/mctl-agents-worker-implement/values.yaml
                (one replica, by invariant). Check
                temporal_worker_task_slots_used{task_queue="mctl-dev-loop-implement"}
                against N and the running mctl-agents-implement-* workflows in
                Argo before raising N. Context: mctl-agents#395.
