# Unit tests for access-login-probe.yaml.
#
# rule_files is resolved relative to this file. generated/ is produced by
# scripts/check-vm-rules.sh, which extracts each VMRule's `.spec`.
#
# A success timestamp written as '0+60xN' equals time() at every step, i.e. a
# probe that succeeds continuously.
rule_files:
  - generated/access-login-probe.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a healthy probe raises nothing for three hours
    input_series:
      - series: 'access_login_probe_status{job="access_login_probe"}'
        values: '0x200'
      - series: 'access_login_probe_last_success_timestamp_seconds{job="access_login_probe"}'
        values: '0+60x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: AccessLoginBroken
        exp_alerts: []
      - eval_time: 3h
        alertname: AccessLoginUnknown
        exp_alerts: []
      - eval_time: 3h
        alertname: AccessLoginProbeStale
        exp_alerts: []
      - eval_time: 3h
        alertname: AccessLoginProbeAbsent
        exp_alerts: []

  - interval: 1m
    name: one broken run that the next run contradicts stays quiet
    input_series:
      - series: 'access_login_probe_status{job="access_login_probe"}'
        values: '0x15 1x14 0x30'
      - series: 'access_login_probe_last_success_timestamp_seconds{job="access_login_probe"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: AccessLoginBroken
        exp_alerts: []
      - eval_time: 45m
        alertname: AccessLoginBroken
        exp_alerts: []

  - interval: 1m
    name: two broken runs in a row fire
    input_series:
      - series: 'access_login_probe_status{job="access_login_probe"}'
        values: '0x15 1x40'
    alert_rule_test:
      - eval_time: 34m
        alertname: AccessLoginBroken
        exp_alerts: []
      - eval_time: 36m
        alertname: AccessLoginBroken
        exp_alerts:
          - exp_labels:
              severity: critical
              component: access-login
              job: access_login_probe
            exp_annotations:
              summary: "Cloudflare Access sign-in through ZITADEL is broken"
              description: "The Access login probe has found sign-in broken on two consecutive runs: Access no longer intercepts the test application, offers the IdP with a client id or callback Git does not declare, or the IdP refuses the authorization request. Every Access application offering ZITADEL is affected. The reason is in the probe Job's log: kubectl -n monitoring logs job/<latest access-login-probe-*>. Re-check by hand: dispatch cloudflare-access-login-probe.yml."

  - interval: 1m
    name: unknown fires its own alert and never reads as broken
    input_series:
      - series: 'access_login_probe_status{job="access_login_probe"}'
        values: '2x60'
      - series: 'access_login_probe_last_success_timestamp_seconds{job="access_login_probe"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 44m
        alertname: AccessLoginUnknown
        exp_alerts: []
      - eval_time: 46m
        alertname: AccessLoginUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              component: access-login
              job: access_login_probe
            exp_annotations:
              summary: "Cloudflare Access login probe cannot tell whether sign-in works"
              description: "The Access login probe has reported \"could not be determined\" for 45 minutes. Sign-in may be fine or broken; nothing is known. The probe Job's log names the step that failed."
      - eval_time: 46m
        alertname: AccessLoginBroken
        exp_alerts: []

  - interval: 1m
    name: a probe stuck on unknown also goes stale after two hours
    input_series:
      - series: 'access_login_probe_status{job="access_login_probe"}'
        values: '2x200'
      - series: 'access_login_probe_last_success_timestamp_seconds{job="access_login_probe"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 2h29m
        alertname: AccessLoginProbeStale
        exp_alerts: []
      - eval_time: 2h32m
        alertname: AccessLoginProbeStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: access-login
              job: access_login_probe
            exp_annotations:
              summary: "No successful Cloudflare Access login probe for over 2 hours"
              description: "Nothing has confirmed that Access sign-in works for more than two hours. Check the access-login-probe CronJob in monitoring (last schedule, failed Jobs, pod logs) and the Pushgateway. If the probe itself is fine, AccessLoginBroken or AccessLoginUnknown says why."

  - interval: 1m
    name: a CronJob that died after a success goes stale, though status still reads 0
    input_series:
      - series: 'access_login_probe_status{job="access_login_probe"}'
        values: '0x200'
      - series: 'access_login_probe_last_success_timestamp_seconds{job="access_login_probe"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 2h32m
        alertname: AccessLoginProbeStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: access-login
              job: access_login_probe
            exp_annotations:
              summary: "No successful Cloudflare Access login probe for over 2 hours"
              description: "Nothing has confirmed that Access sign-in works for more than two hours. Check the access-login-probe CronJob in monitoring (last schedule, failed Jobs, pod logs) and the Pushgateway. If the probe itself is fine, AccessLoginBroken or AccessLoginUnknown says why."

  - interval: 1m
    name: a success timestamp that never existed is stale, not fine
    input_series:
      - series: 'access_login_probe_status{job="access_login_probe"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 29m
        alertname: AccessLoginProbeStale
        exp_alerts: []
      - eval_time: 31m
        alertname: AccessLoginProbeStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: access-login
              job: access_login_probe
            exp_annotations:
              summary: "No successful Cloudflare Access login probe for over 2 hours"
              description: "Nothing has confirmed that Access sign-in works for more than two hours. Check the access-login-probe CronJob in monitoring (last schedule, failed Jobs, pod logs) and the Pushgateway. If the probe itself is fine, AccessLoginBroken or AccessLoginUnknown says why."

  - interval: 1m
    name: a probe that never pushed is absent
    input_series:
      - series: 'unrelated_metric{job="other"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 14m
        alertname: AccessLoginProbeAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: AccessLoginProbeAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              component: access-login
              job: access_login_probe
            exp_annotations:
              summary: "The Cloudflare Access login probe has pushed nothing for over an hour"
              description: "No access_login_probe_status sample in over an hour. The CronJob is not running or cannot reach the Pushgateway, or the Pushgateway lost its groups on a restart and no run has pushed since."

  - interval: 1m
    name: the red test's job is never selected
    input_series:
      - series: 'access_login_probe_status{job="access_login_probe_redtest"}'
        values: '1x60'
      - series: 'access_login_probe_status{job="access_login_probe"}'
        values: '0x60'
      - series: 'access_login_probe_last_success_timestamp_seconds{job="access_login_probe"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 59m
        alertname: AccessLoginBroken
        exp_alerts: []
