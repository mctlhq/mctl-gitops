# Unit tests for tempo-alerts.yaml (groups tempo.health,
# tempo.ingest and tempo.storage).
#
# rule_files is resolved relative to this file. generated/ is produced by
# scripts/check-vm-rules.sh, which extracts each VMRule's `.spec`.
#
# Each rule is proven both ways: it fires on the failure shape and stays quiet
# on the healthy one. The quiet cases that matter most are the ones a closed
# or scaled-down Tempo produces -- no series at all, or a StatefulSet at
# zero replicas -- because this file stays loaded whether Tempo runs or not.
rule_files:
  - generated/tempo-alerts.yaml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------
  # TempoNotScraped
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a ready Tempo that is scraped stays quiet
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="tracing",statefulset="tempo"}'
        values: '1x30'
      - series: 'up{namespace="tracing",job="tempo",instance="10.42.0.10:3200"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: TempoNotScraped
        exp_alerts: []

  - interval: 1m
    name: a ready Tempo with no up series fires
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="tracing",statefulset="tempo"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TempoNotScraped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
            exp_annotations:
              summary: "Tempo is running but not being scraped"
              description: >-
                The tempo StatefulSet in tracing has a ready replica,
                but up{job="tempo"} has not been 1 for 10 minutes. Every other
                Tempo alert is blind until this clears. Check the
                tempo-allow-http-from-monitoring NetworkPolicy and the tempo
                VMServiceScrape in tracing.

  - interval: 1m
    name: a ready Tempo whose scrape fails (up == 0) fires
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="tracing",statefulset="tempo"}'
        values: '1x30'
      - series: 'up{namespace="tracing",job="tempo",instance="10.42.0.10:3200"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TempoNotScraped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
            exp_annotations:
              summary: "Tempo is running but not being scraped"
              description: >-
                The tempo StatefulSet in tracing has a ready replica,
                but up{job="tempo"} has not been 1 for 10 minutes. Every other
                Tempo alert is blind until this clears. Check the
                tempo-allow-http-from-monitoring NetworkPolicy and the tempo
                VMServiceScrape in tracing.

  # Scaled to zero, or Tempo removed
  # altogether: neither is "blind", both must stay quiet.
  - interval: 1m
    name: Tempo scaled to zero stays quiet
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="tracing",statefulset="tempo"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: TempoNotScraped
        exp_alerts: []

  - interval: 1m
    name: Tempo removed (no series at all) stays quiet
    input_series:
      - series: 'up{namespace="monitoring",job="otel-collector",instance="10.42.0.20:8888"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: TempoNotScraped
        exp_alerts: []
      - eval_time: 30m
        alertname: TempoFlushFailures
        exp_alerts: []
      - eval_time: 30m
        alertname: TempoCollectorExportFailures
        exp_alerts: []

  # ---------------------------------------------------------------------
  # TempoMemoryNearLimit
  # ---------------------------------------------------------------------
  - interval: 1m
    name: RSS at 700MiB of 1GiB stays quiet
    input_series:
      - series: 'container_memory_rss{namespace="tracing",container="tempo",pod="tempo-0"}'
        values: '734003200x30'
      - series: 'kube_pod_container_resource_limits{namespace="tracing",container="tempo",pod="tempo-0",resource="memory"}'
        values: '1073741824x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: TempoMemoryNearLimit
        exp_alerts: []

  - interval: 1m
    name: RSS at 900MiB of 1GiB for 10m fires
    input_series:
      - series: 'container_memory_rss{namespace="tracing",container="tempo",pod="tempo-0"}'
        values: '943718400x30'
      - series: 'kube_pod_container_resource_limits{namespace="tracing",container="tempo",pod="tempo-0",resource="memory"}'
        values: '1073741824x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TempoMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
              pod: tempo-0
            exp_annotations:
              summary: "Tempo RSS is near its memory limit"
              description: >-
                tempo-0 has used over 85% of its memory limit (RSS) for
                10 minutes, above the 1600MiB GOMEMLIMIT. Either the trace
                volume grew past what the limit was sized for or a reader is
                too heavy (docs/runbooks/tempo.md); resize in
                bootstrap/values.yaml, do not just restart.

  # ---------------------------------------------------------------------
  # TempoOOMKilled / TempoRestarting
  # ---------------------------------------------------------------------
  - interval: 1m
    name: an OOM-kill with a restart fires
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="tracing",container="tempo",pod="tempo-0",reason="OOMKilled"}'
        values: '1x20'
      - series: 'kube_pod_container_status_restarts_total{namespace="tracing",container="tempo",pod="tempo-0"}'
        values: '0x5 1x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: TempoOOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
              pod: tempo-0
            exp_annotations:
              summary: "Tempo was OOM-killed"
              description: >-
                tempo-0 was OOM-killed in the last 15 minutes. The WAL
                is on an emptyDir, which survives a container restart, so it is
                replayed; spans in flight in memory are lost. Record the event
                against the operations dimension.
      # One restart is not "repeatedly".
      - eval_time: 8m
        alertname: TempoRestarting
        exp_alerts: []

  - interval: 1m
    name: an old OOM reason with no recent restart stays quiet
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="tracing",container="tempo",pod="tempo-0",reason="OOMKilled"}'
        values: '1x40'
      - series: 'kube_pod_container_status_restarts_total{namespace="tracing",container="tempo",pod="tempo-0"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: TempoOOMKilled
        exp_alerts: []

  - interval: 1m
    name: two restarts within 30m fire
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="tracing",container="tempo",pod="tempo-0"}'
        values: '0x5 1x5 2x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: TempoRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
              pod: tempo-0
            exp_annotations:
              summary: "Tempo is restarting repeatedly"
              description: >-
                tempo-0 restarted 2 times in the
                last 30 minutes. Check its last termination reason and logs
                ({namespace="tracing"} in Loki).

  # ---------------------------------------------------------------------
  # Ingest: TempoIngestRefused / TempoDiscardedSpans
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a flat refused counter stays quiet
    input_series:
      - series: 'tempo_receiver_refused_spans{namespace="tracing",job="tempo",receiver="otlp/otlp_receiver",transport="grpc"}'
        values: '0x20'
      - series: 'tempo_discarded_spans_total{namespace="tracing",job="tempo",reason="rate_limited"}'
        values: '3x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: TempoIngestRefused
        exp_alerts: []
      - eval_time: 20m
        alertname: TempoDiscardedSpans
        exp_alerts: []

  - interval: 1m
    name: refused spans increasing for 5m fire
    input_series:
      - series: 'tempo_receiver_refused_spans{namespace="tracing",job="tempo",receiver="otlp/otlp_receiver",transport="grpc"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TempoIngestRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
            exp_annotations:
              summary: "Tempo is refusing spans at the distributor"
              description: >-
                tempo_receiver_refused_spans has been increasing for 5 minutes.
                Spans the collector sends are being rejected before they reach
                the ingester.

  - interval: 1m
    name: discarded spans increasing for 5m fire with their reason
    input_series:
      - series: 'tempo_discarded_spans_total{namespace="tracing",job="tempo",reason="trace_too_large"}'
        values: '0+5x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TempoDiscardedSpans
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
              reason: trace_too_large
            exp_annotations:
              summary: "Tempo is discarding spans (trace_too_large)"
              description: >-
                tempo_discarded_spans_total{reason="trace_too_large"} has
                been increasing for 5 minutes: spans were accepted and then
                dropped by a Tempo limit. Measured trace volume is lower than
                sent volume for as long as this fires.

  # ---------------------------------------------------------------------
  # Collector side: TempoCollectorExportFailures / DroppedSpans
  # ---------------------------------------------------------------------
  - interval: 1m
    name: export failures to Tempo fire, failures to another exporter do not
    input_series:
      - series: 'otelcol_exporter_send_failed_spans{exporter="otlp_grpc/backend",instance="10.42.0.20:8888",job="otel-collector"}'
        values: '0+50x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TempoCollectorExportFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
            exp_annotations:
              summary: "otel-collector is failing to export spans to Tempo"
              description: >-
                otelcol_exporter_send_failed_spans{exporter=~"otlp(_grpc)?/backend"}
                has been increasing for 5 minutes: Tempo is down, scaled to zero
                or refusing. Producers are unaffected (they only address the
                collector); check the tempo pod and TempoIngestRefused.

  - interval: 1m
    name: failures on a different exporter stay quiet
    input_series:
      - series: 'otelcol_exporter_send_failed_spans{exporter="otlp/some-other-backend",instance="10.42.0.20:8888",job="otel-collector"}'
        values: '0+50x20'
      - series: 'otelcol_exporter_enqueue_failed_spans{exporter="otlp/some-other-backend",instance="10.42.0.20:8888",job="otel-collector"}'
        values: '0+50x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TempoCollectorExportFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: TempoCollectorDroppedSpans
        exp_alerts: []

  - interval: 1m
    name: a full export queue to Tempo fires
    input_series:
      - series: 'otelcol_exporter_enqueue_failed_spans{exporter="otlp_grpc/backend",instance="10.42.0.20:8888",job="otel-collector"}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TempoCollectorDroppedSpans
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
            exp_annotations:
              summary: "otel-collector is dropping spans bound for Tempo"
              description: >-
                otelcol_exporter_enqueue_failed_spans{exporter=~"otlp(_grpc)?/backend"}
                has been increasing for 5 minutes: the export queue to Tempo is
                full and new batches are dropped. Tempo is slow or unreachable.

  # ---------------------------------------------------------------------
  # Storage: TempoFlushFailures / ObjectStorageErrors / Compaction
  # ---------------------------------------------------------------------
  - interval: 1m
    name: failed flushes for 10m fire
    input_series:
      - series: 'tempo_ingester_failed_flushes_total{namespace="tracing",job="tempo",instance="10.42.0.10:3200"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TempoFlushFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
            exp_annotations:
              summary: "Tempo cannot flush blocks to object storage"
              description: >-
                tempo_ingester_failed_flushes_total has been increasing for 10
                minutes. Blocks are accumulating in the WAL emptyDir (2Gi cap;
                past it the pod is evicted and the WAL is lost). Check R2
                reachability from tracing and the tempo-r2 Secret.

  - interval: 1m
    name: 200s and 404s from the bucket stay quiet
    input_series:
      - series: 'tempodb_backend_request_duration_seconds_count{namespace="tracing",job="tempo",operation="GET",status_code="200"}'
        values: '0+20x30'
      - series: 'tempodb_backend_request_duration_seconds_count{namespace="tracing",job="tempo",operation="GET",status_code="404"}'
        values: '0+3x30'
      - series: 'tempo_ingester_failed_flushes_total{namespace="tracing",job="tempo",instance="10.42.0.10:3200"}'
        values: '2x30'
      - series: 'tempodb_compaction_errors_total{namespace="tracing",job="tempo",instance="10.42.0.10:3200"}'
        values: '0x30'
      - series: 'tempodb_retention_errors_total{namespace="tracing",job="tempo",instance="10.42.0.10:3200"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: TempoObjectStorageErrors
        exp_alerts: []
      - eval_time: 30m
        alertname: TempoFlushFailures
        exp_alerts: []
      - eval_time: 30m
        alertname: TempoCompactionOrRetentionErrors
        exp_alerts: []

  - interval: 1m
    name: 403s on PUT for 10m fire, naming operation and status
    input_series:
      - series: 'tempodb_backend_request_duration_seconds_count{namespace="tracing",job="tempo",operation="PUT",status_code="403"}'
        values: '0+2x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TempoObjectStorageErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
              operation: PUT
              status_code: "403"
            exp_annotations:
              summary: "Tempo object-storage PUT requests failing (403)"
              description: >-
                tempodb_backend_request_duration_seconds_count for
                PUT has returned status 403
                continuously for 10 minutes. 401/403 point at the tempo-r2
                credentials, 5xx or 0 at R2 or the egress NetworkPolicy.

  - interval: 1m
    name: retention errors for 15m fire
    input_series:
      - series: 'tempodb_retention_errors_total{namespace="tracing",job="tempo",instance="10.42.0.10:3200"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: TempoCompactionOrRetentionErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tempo
            exp_annotations:
              summary: "Tempo compactor is failing"
              description: >-
                tempodb_compaction_errors_total or tempodb_retention_errors_total
                has been increasing for 15 minutes. Blocks are not being
                compacted or deleted on schedule.
