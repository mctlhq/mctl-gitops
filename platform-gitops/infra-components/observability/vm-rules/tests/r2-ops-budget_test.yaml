# Unit tests for r2-ops-budget.yaml.
#
# rule_files is resolved relative to this file. generated/ is produced by
# scripts/check-vm-rules.sh. A success timestamp written as '0+60xN' equals
# time() at every step, i.e. a check that reads successfully every time. A
# cycle end written as a constant is an absolute time in seconds, compared
# with the eval time. Heading and Over are exclusive, so each case also asserts
# that the other stays quiet.
rule_files:
  - generated/r2-ops-budget.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: well within the free million raises nothing
    input_series:
      - series: 'r2_ops_budget_read_ok{job="r2_ops_budget"}'
        values: '1x1000'
      - series: 'r2_ops_budget_class_a_used{job="r2_ops_budget"}'
        values: '500000x1000'
      - series: 'r2_ops_budget_class_a_free_tier{job="r2_ops_budget"}'
        values: '1000000x1000'
      - series: 'r2_ops_budget_class_a_projected{job="r2_ops_budget"}'
        values: '600000x1000'
      - series: 'r2_ops_budget_last_read_success_timestamp_seconds{job="r2_ops_budget"}'
        values: '0+60x1000'
    alert_rule_test:
      - eval_time: 12h
        alertname: R2OpsClassAOverFreeTier
        exp_alerts: []
      - eval_time: 12h
        alertname: R2OpsClassAHeadingOverFreeTier
        exp_alerts: []
      - eval_time: 12h
        alertname: R2OpsBudgetReadFailing
        exp_alerts: []
      - eval_time: 12h
        alertname: R2OpsBudgetStale
        exp_alerts: []

  - interval: 1m
    name: 80 percent of the free million warns after six hours, as Heading only
    input_series:
      - series: 'r2_ops_budget_read_ok{job="r2_ops_budget"}'
        values: '1x1000'
      - series: 'r2_ops_budget_class_a_used{job="r2_ops_budget"}'
        values: '850000x1000'
      - series: 'r2_ops_budget_class_a_free_tier{job="r2_ops_budget"}'
        values: '1000000x1000'
      - series: 'r2_ops_budget_class_a_projected{job="r2_ops_budget"}'
        values: '900000x1000'
      - series: 'r2_ops_budget_last_read_success_timestamp_seconds{job="r2_ops_budget"}'
        values: '0+60x1000'
    alert_rule_test:
      - eval_time: 359m
        alertname: R2OpsClassAHeadingOverFreeTier
        exp_alerts: []
      - eval_time: 361m
        alertname: R2OpsClassAHeadingOverFreeTier
        exp_alerts:
          - exp_labels:
              severity: warning
              component: r2-ops-budget
              job: r2_ops_budget
            exp_annotations:
              summary: "R2 Class A operations are heading past the free million"
              description: "This billing cycle's R2 Class A operations are under the free 1M but either at 80% of it or on pace to pass it before the cycle ends (the 22nd). Crossing it costs the full $4.50 for the next block. There is time to cut: the biggest levers are in observability/loki.yaml (compaction_interval, tsdb_shipper.resync_interval) and the s3-sync sidecar in services/labs/claude-remote/values.yaml (MIRROR_EVERY, while that pod runs). The figures are r2_ops_budget_class_a_used and r2_ops_budget_class_a_projected in VictoriaMetrics."
      - eval_time: 8h
        alertname: R2OpsClassAOverFreeTier
        exp_alerts: []

  - interval: 1m
    name: exactly 80 percent is already heading over
    input_series:
      - series: 'r2_ops_budget_read_ok{job="r2_ops_budget"}'
        values: '1x1000'
      - series: 'r2_ops_budget_class_a_used{job="r2_ops_budget"}'
        values: '800000x1000'
      - series: 'r2_ops_budget_class_a_free_tier{job="r2_ops_budget"}'
        values: '1000000x1000'
      - series: 'r2_ops_budget_class_a_projected{job="r2_ops_budget"}'
        values: '850000x1000'
      - series: 'r2_ops_budget_last_read_success_timestamp_seconds{job="r2_ops_budget"}'
        values: '0+60x1000'
    alert_rule_test:
      - eval_time: 361m
        alertname: R2OpsClassAHeadingOverFreeTier
        exp_alerts:
