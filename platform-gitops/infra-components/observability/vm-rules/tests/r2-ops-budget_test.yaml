        values: '300000x1000'
      - series: 'r2_ops_budget_class_a_free_tier{job="r2_ops_budget"}'
        values: '1000000x1000'
      - series: 'r2_ops_budget_class_a_projected{job="r2_ops_budget"}'
        values: '1200000x1000'
      - series: 'r2_ops_budget_last_read_success_timestamp_seconds{job="r2_ops_budget"}'
        values: '0+60x1000'
    alert_rule_test:
      - eval_time: 359m
        alertname: R2OpsClassAHeadingOverFreeTier
        exp_alerts: []
      - eval_time: 361m
        alertname: R2OpsClassAHeadingOverFreeTier
        exp_alerts:
          - exp_labels:
              severity: warning
              component: r2-ops-budget
              job: r2_ops_budget
            exp_annotations:
              summary: "R2 Class A operations are heading past the free million"
              description: "This billing cycle's R2 Class A operations are under the free 1M but either at 80% of it or on pace to pass it before the cycle ends (the 22nd). Crossing it costs the full $4.50 for the next block. There is time to cut: the biggest levers are in observability/loki.yaml (compaction_interval, tsdb_shipper.resync_interval) and the s3-sync sidecar in services/labs/claude-remote/values.yaml (MIRROR_EVERY, while that pod runs). The figures are r2_ops_budget_class_a_used and r2_ops_budget_class_a_projected in VictoriaMetrics."
      - eval_time: 8h
        alertname: R2OpsClassAOverFreeTier
        exp_alerts: []

  - interval: 1m
    name: both reasons at once are one alert, not two
    input_series:
      - series: 'r2_ops_budget_read_ok{job="r2_ops_budget"}'
        values: '1x1000'
      - series: 'r2_ops_budget_class_a_used{job="r2_ops_budget"}'
        values: '850000x1000'
      - series: 'r2_ops_budget_class_a_free_tier{job="r2_ops_budget"}'
        values: '1000000x1000'
      - series: 'r2_ops_budget_class_a_projected{job="r2_ops_budget"}'
        values: '1200000x1000'
      - series: 'r2_ops_budget_last_read_success_timestamp_seconds{job="r2_ops_budget"}'
        values: '0+60x1000'
    alert_rule_test:
