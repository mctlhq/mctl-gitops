        values: '0x1000'
      - series: 'r2_ops_budget_class_a_used{job="r2_ops_budget"}'
        values: '500000x1000'
      - series: 'r2_ops_budget_class_a_free_tier{job="r2_ops_budget"}'
        values: '1000000x1000'
      - series: 'r2_ops_budget_class_a_projected{job="r2_ops_budget"}'
        values: '600000x1000'
      - series: 'r2_ops_budget_last_read_success_timestamp_seconds{job="r2_ops_budget"}'
        values: '0x1000'
    alert_rule_test:
      - eval_time: 419m
        alertname: R2OpsBudgetReadFailing
        exp_alerts: []
      - eval_time: 421m
        alertname: R2OpsBudgetReadFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: r2-ops-budget
              job: r2_ops_budget
            exp_annotations:
              summary: "The R2 operations budget check cannot read the count"
              description: "For 7 hours the check could not read this cycle's R2 operations: the token, the Cloudflare API, or the answer's shape. This says nothing about the count itself, and the alerts above judge the last figure it did read. The r2-ops-budget Job's log in monitoring has the reason."
      - eval_time: 12h29m
        alertname: R2OpsBudgetStale
        exp_alerts: []
      - eval_time: 12h32m
        alertname: R2OpsBudgetStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: r2-ops-budget
              job: r2_ops_budget
            exp_annotations:
              summary: "No successful R2 operations budget check for over 12 hours"
              description: "Nothing has confirmed this cycle's R2 operation count for more than 12 hours. Check the r2-ops-budget CronJob in monitoring (failed Jobs, CreateContainerConfigError for a missing token Secret, pod logs) and the r2-ops-budget ExternalSecret. Until the Vault path platform/r2-ops-budget (property api-token) exists, this is expected."
      - eval_time: 12h
        alertname: R2OpsClassAOverFreeTier
        exp_alerts: []
      - eval_time: 12h
        alertname: R2OpsClassAHeadingOverFreeTier
        exp_alerts: []

