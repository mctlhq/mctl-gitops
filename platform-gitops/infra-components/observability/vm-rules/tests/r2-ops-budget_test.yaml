              severity: warning
              component: r2-ops-budget
              job: r2_ops_budget
            exp_annotations:
              summary: "R2 Class A operations passed the free million this cycle"
              description: "This billing cycle has used 1.05M R2 Class A operations, past the free 1M. The first block above it, $4.50, is billed whether the overage is 1 operation or 999,999, so the rest of the cycle costs nothing more until the next million. Where they come from: the Cloudflare dashboard, Billing, Billable usage; per bucket and action, the GraphQL r2OperationsAdaptiveGroups. Largest sources as of 2026-11: loki (PutObject, ListObjects), then tempo-traces, claude-remote-state and argo-workflows-logs."
      - eval_time: 402m
        alertname: R2OpsClassAHeadingOverFreeTier
        exp_alerts: []

  - interval: 1m
    name: a failing read fires its own alert and goes stale, without touching the count alerts
    input_series:
