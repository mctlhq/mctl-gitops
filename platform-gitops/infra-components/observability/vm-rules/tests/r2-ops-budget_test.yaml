              severity: warning
              component: r2-ops-budget
              job: r2_ops_budget
            exp_annotations:
              summary: "R2 Class A operations are heading past the free million"
              description: "This billing cycle's R2 Class A operations are under the free 1M but either at 80% of it or on pace to pass it before the cycle ends (the 22nd). Crossing it costs the full $4.50 for the next block. There is time to cut: the biggest levers are in observability/loki.yaml (compaction_interval, tsdb_shipper.resync_interval) and the s3-sync sidecar in services/labs/claude-remote/values.yaml (MIRROR_EVERY, while that pod runs). The figures are r2_ops_budget_class_a_used and r2_ops_budget_class_a_projected in VictoriaMetrics."

