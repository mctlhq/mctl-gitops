# Unit tests for lifecycle-rollout-alerts.yaml.
#
# rule_files is resolved relative to this file. generated/ is produced by
# scripts/check-vm-rules.sh, which extracts each VMRule's `.spec` so promtool
# evaluates the very rules the cluster runs.
#
# The case worth testing hardest here is not "does it fire" but the two ways
# this measurement can be wrong while looking right:
#
#   1. the dangerous alert staying quiet for a SINGLE occurrence -- the window
#      and hold are paired the unusual way round precisely so one event fires,
#      and a well-meant "fix" of that pairing would silence the soak's stop
#      condition without breaking any syntax check;
#   2. the unknown-rate ratio dividing by a series that does not exist, which
#      is how HighToolErrorRate shipped a mathematically impossible expression
#      and lived for months.
rule_files:
  - generated/lifecycle-rollout-alerts.yaml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------
  # LifecycleShadowDangerousDivergence
  # ---------------------------------------------------------------------
  - interval: 1m
    name: agreement alone never fires the stop condition
    input_series:
      - series: 'lifecycle_shadow_agree_total{namespace="argo-workflows"}'
        values: '0+12x60'
      - series: 'lifecycle_shadow_store_permits_old_forbids_total{namespace="argo-workflows"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: LifecycleShadowDangerousDivergence
        exp_alerts: []

  - interval: 1m
    name: ONE dangerous divergence fires, with no zero before it
    input_series:
      # The shape a real shepherd pod produces, and the reason this rule does
      # not use increase(). Promtail creates a metrics-stage counter only when
      # its regex first matches, keyed by the pod, so the series APPEARS at 1:
      # there is no 0 sample ahead of it to increase from. `_` is an absent
      # sample -- seeding a 0 here instead would test a series shape that never
      # occurs, and would pass against an expression that misses every
      # first-occurrence event.
      - series: 'lifecycle_shadow_store_permits_old_forbids_total{namespace="argo-workflows"}'
        values: '_x9 1x5'
    alert_rule_test:
      # The pod reported at minute 10 and was gone by 15. Its samples are still
      # inside the 15m lookback here, and the 5m hold has elapsed.
      - eval_time: 20m
        alertname: LifecycleShadowDangerousDivergence
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
              namespace: argo-workflows
            exp_annotations:
              summary: "Lifecycle shadow: the store would license an action the old mechanism forbids"
              description: >-
                1 dangerous divergence(s) in the last 15m. The ownership store
                holds no live owner for a pull request a DevLoopWorkflow is
                driving. This is the one class that would let two machines
                drive the same PR under enforce. STOP the rollout: set
                LIFECYCLE_ROLLOUT_MODE back to off, then find the entity with
                mctl_get_lifecycle_ownership and write down the root cause
                before restarting the soak clock.

  - interval: 1m
    name: the event leaves the window and the alert clears
    input_series:
      - series: 'lifecycle_shadow_store_permits_old_forbids_total{namespace="argo-workflows"}'
        values: '_x9 1x5'
    alert_rule_test:
      # Well past the 15m lookback. The series is per-pod and the pod is gone,
      # so the counter cannot accumulate across ticks and the alert
      # self-clears -- which is what makes reading the value directly safe
      # here, and is not true of the worker counter below.
      - eval_time: 40m
        alertname: LifecycleShadowDangerousDivergence
        exp_alerts: []

  # ---------------------------------------------------------------------
  # LifecycleShadowStoreUnknownHigh
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a healthy compare with a few unknowns stays quiet
    input_series:
      # 60 agreements and 1 unknown over the window: ~1.6%.
      - series: 'lifecycle_shadow_agree_total{namespace="argo-workflows"}'
        values: '0+1x60'
      - series: 'lifecycle_shadow_store_unknown_total{namespace="argo-workflows"}'
        values: '0x30 1x30'
    alert_rule_test:
      - eval_time: 60m
        alertname: LifecycleShadowStoreUnknownHigh
        exp_alerts: []

  - interval: 1m
    name: a store that answers nothing fires
    input_series:
      # Every comparison unknown -- the 403 shape: a shepherd token that is not
      # a lifecycle admin gets one for every id, and the soak would otherwise
      # run for a fortnight measuring nothing.
      - series: 'lifecycle_shadow_store_unknown_total{namespace="argo-workflows"}'
        values: '0+4x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: LifecycleShadowStoreUnknownHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
            exp_annotations:
              summary: "Lifecycle shadow: the ownership store is not answering"
              description: >-
                100% of comparisons in the last 30m read store-unknown. Common
                causes, in the order worth checking: the shepherd's MCTL_TOKEN
                is not a lifecycle admin (the batch route is admin-gated and
                answers 403 for every id), mctl-api is down, or its version
                predates the derived.held field the compare reads. At enforce
                an unknown blocks the mutation, so this is a stall waiting to
                happen.

  - interval: 1m
    name: no traffic at all does not divide by zero
    input_series:
      # Every counter flat. clamp_min keeps the denominator at 1, so the ratio
      # is 0 rather than NaN -- without it this rule would either vanish from
      # the evaluation or fire on an empty cluster.
      - series: 'lifecycle_shadow_agree_total{namespace="argo-workflows"}'
        values: '0+0x60'
      - series: 'lifecycle_shadow_store_unknown_total{namespace="argo-workflows"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: LifecycleShadowStoreUnknownHigh
        exp_alerts: []

  # ---------------------------------------------------------------------
  # LifecycleShadowSilent
  # ---------------------------------------------------------------------
  - interval: 1m
    name: a compare that emits nothing fires after an hour
    input_series: []
    alert_rule_test:
      - eval_time: 90m
        alertname: LifecycleShadowSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
            exp_annotations:
              summary: "Lifecycle shadow compare has emitted nothing for an hour"
              description: >-
                No shadow comparison counters exist. Either
                LIFECYCLE_ROLLOUT_MODE is not observe on the shepherd CWFT, or
                the Promtail match block for namespace=argo-workflows is not
                selecting the shepherd's pods. A silent compare reads as a
                clean soak, which is the one way this measurement can be wrong
                without looking wrong.

  - interval: 1m
    name: a live compare keeps it quiet
    input_series:
      - series: 'lifecycle_shadow_agree_total{namespace="argo-workflows"}'
        values: '0+3x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: LifecycleShadowSilent
        exp_alerts: []

  - interval: 1m
    name: a compare emitting only unknowns is NOT silent
    input_series:
      # What a BROKEN compare emits: a 403 on the admin-gated batch route
      # answers store-unknown for every id. It is loud, and
      # LifecycleShadowStoreUnknownHigh is the alert for it; this one must not
      # also fire, or one fault raises two alerts naming different causes.
      - series: 'lifecycle_shadow_store_unknown_total{namespace="argo-workflows"}'
        values: '0+3x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: LifecycleShadowSilent
        exp_alerts: []

  # ---------------------------------------------------------------------
  # LifecycleClaimAbandoned
  # ---------------------------------------------------------------------
  - interval: 1m
    name: no abandoned claims, no alert
    input_series:
      - series: 'lifecycle_claim_abandoned_total{namespace="admins"}'
        values: '0+0x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: LifecycleClaimAbandoned
        exp_alerts: []

  - interval: 1m
    name: a second abandoned claim fires through increase()
    input_series:
      - series: 'lifecycle_claim_abandoned_total{namespace="admins"}'
        values: '0x10 1x80'
    alert_rule_test:
      - eval_time: 30m
        alertname: LifecycleClaimAbandoned
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
              namespace: admins
            exp_annotations:
              summary: "DevLoopWorkflow abandoned an ownership claim without a landed write"
              description: >-
                1 claim(s) abandoned in the last hour. The workflow cleared its
                local claim on a write that did not reach mctl-api, so the
                store holds a row nobody is refreshing. Find it with
                mctl_get_lifecycle_ownership and check whether it is still
                withholding the entity.

  - interval: 1m
    name: the FIRST abandoned claim fires, with no zero before it
    input_series:
      # Same first-sample problem as the shadow counter, in a long-lived pod:
      # Promtail creates the series at 1, so increase() sees nothing. The
      # second disjunct is what catches this.
      - series: 'lifecycle_claim_abandoned_total{namespace="admins"}'
        values: '_x9 1x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: LifecycleClaimAbandoned
        exp_alerts:
          - exp_labels:
              severity: warning
              mctl_agent_self: "true"
              namespace: admins
            exp_annotations:
              summary: "DevLoopWorkflow abandoned an ownership claim without a landed write"
              description: >-
                1 claim(s) abandoned in the last hour. The workflow cleared its
                local claim on a write that did not reach mctl-api, so the
                store holds a row nobody is refreshing. Find it with
                mctl_get_lifecycle_ownership and check whether it is still
                withholding the entity.

  - interval: 1m
    name: a first-claim alert stops instead of latching on a counter that never falls
    input_series:
      - series: 'lifecycle_claim_abandoned_total{namespace="admins"}'
        values: '_x9 1x180'
    alert_rule_test:
      # Two hours on, the same value is still 1 and always will be -- the
      # worker does not restart to clear it. The `unless` is what makes this
      # alert end rather than fire forever over one event.
      - eval_time: 2h
        alertname: LifecycleClaimAbandoned
        exp_alerts: []
