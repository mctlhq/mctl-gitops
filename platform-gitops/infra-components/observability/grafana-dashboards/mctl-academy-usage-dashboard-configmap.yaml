# Private, maintainer-only Grafana dashboard for mctl-academy usage:
# sign-ups, logins, and questions answered per day. Queries the
# "mctl-academy (read-only)" Postgres datasource (see
# platform-gitops/bootstrap/templates/observability/academy-postgres-datasource.yaml)
# directly against the labs-mctl-academy database — no new app
# instrumentation, no logs, no metrics exporter.
#
# Not linked from mctl-academy's own UI or docs — README.md/PRIVACY.md's
# "no analytics, no tracking" commitment is about the public product, not
# this internal operations dashboard.
#
# Sidecar in the monitoring/grafana deployment auto-discovers ConfigMaps
# with label `grafana_dashboard: "1"` — same pattern as
# mctl-agent-cleanup-dashboard-configmap.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mctl-academy-usage-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mctl-academy-usage.json: |
    {
      "title": "mctl-academy — Usage (private)",
      "description": "Sign-ups, logins, and questions answered. Maintainer-only; not a product feature.",
      "uid": "mctl-academy-usage",
      "tags": ["mctl-academy", "usage", "internal"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": { "from": "now-30d", "to": "now" },
      "refresh": "1h",
      "panels": [
        {
          "type": "row",
          "id": 100,
          "title": "Last 30 days",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "id": 1,
          "title": "Total sign-ups (all time)",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT count(*) FROM \"user\";"
            }
          ]
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Logins (last 30d)",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT count(*) FROM \"session\" WHERE $__timeFilter(\"createdAt\");"
            }
          ]
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Attempts (last 30d)",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT count(*) FROM attempts WHERE $__timeFilter(attempted_at);"
            }
          ]
        },
        {
          "type": "stat",
          "id": 4,
          "title": "Unique active users (last 30d)",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT count(DISTINCT user_id) FROM attempts WHERE user_id IS NOT NULL AND $__timeFilter(attempted_at);"
            }
          ]
        },
        {
          "type": "row",
          "id": 200,
          "title": "Trends",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "Sign-ups per day",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 50 }, "unit": "short" } },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT date_trunc('day', \"createdAt\") AS time, count(*) AS signups FROM \"user\" WHERE $__timeFilter(\"createdAt\") GROUP BY 1 ORDER BY 1;"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "Logins per day",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 50 }, "unit": "short" } },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT date_trunc('day', \"createdAt\") AS time, count(*) AS logins FROM \"session\" WHERE $__timeFilter(\"createdAt\") GROUP BY 1 ORDER BY 1;"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Questions answered per day (total vs correct)",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10 }, "unit": "short" } },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT date_trunc('day', attempted_at) AS time, count(*) AS total_attempts FROM attempts WHERE $__timeFilter(attempted_at) GROUP BY 1 ORDER BY 1;"
            },
            {
              "refId": "B",
              "format": "time_series",
              "rawSql": "SELECT date_trunc('day', attempted_at) AS time, count(*) FILTER (WHERE correct) AS correct_attempts FROM attempts WHERE $__timeFilter(attempted_at) GROUP BY 1 ORDER BY 1;"
            }
          ]
        },
        {
          "type": "barchart",
          "id": 8,
          "title": "Attempts by domain (last 30d)",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "options": { "orientation": "horizontal", "legend": { "displayMode": "list", "placement": "right" } },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT domain, count(*) AS attempts FROM attempts WHERE $__timeFilter(attempted_at) GROUP BY domain ORDER BY attempts DESC;"
            }
          ]
        },
        {
          "type": "row",
          "id": 300,
          "title": "Signed-in vs anonymous practice",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 }
        },
        {
          "type": "piechart",
          "id": 9,
          "title": "Attempts: signed-in vs anonymous (last 30d)",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT (CASE WHEN user_id IS NULL THEN 'anonymous' ELSE 'signed-in' END) AS kind, count(*) AS attempts FROM attempts WHERE $__timeFilter(attempted_at) GROUP BY 1;"
            }
          ]
        },
        {
          "type": "text",
          "id": 10,
          "title": "About this dashboard",
          "datasource": { "type": "postgres", "uid": "mctl-academy-readonly-pg" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "options": {
            "mode": "markdown",
            "content": "Reads `\"user\"`, `\"session\"`, and `attempts` directly from the `labs-mctl-academy` Postgres database via a **read-only** role (`academy_readonly`) scoped to exactly those three tables — see mctl-academy migration `1755100000000_academy_readonly_role.mjs`. It deliberately cannot read `\"account\"` (OAuth tokens) or `\"verification\"`.\n\nThis is a private operations view for the maintainer only. mctl-academy's `README.md`/`PRIVACY.md` promise \"no analytics, no tracking\" to learners — that promise is about the public product and is unaffected by this internal dashboard, which is not linked anywhere in the app."
          }
        }
      ]
    }
