# Pull credentials for the private ghcr.io/mctlhq/grafana-iac image (the
# grafana-iac Job). Same source and shape as vault-human-auth-iac-ghcr in
# infra-components/identity/vault-human-auth-iac/externalsecret.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-iac-ghcr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      # ESO defaults spelled out: left implicit they read as drift under
      # ServerSideApply and keep the Application OutOfSync, which with
      # selfHeal re-runs the PostSync Job.
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Grafana's built-in server admin, which the Job signs in as with basic auth
# on the in-cluster Service (helm-charts/grafana-iac/iac/provider.tf). The
# same Vault path and properties as grafana-admin-secret in monitoring
# (bootstrap/templates/observability/monitoring-externalsecret.yaml), which
# Grafana seeded the admin user from when its database was created (#1608).
# Nothing new is written to Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-iac-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-iac-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana
        property: admin-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
