# Object-storage credentials for the Tempo bake-off candidate (#1280).
#
# Vault: secret/platform/r2-tempo, properties access-key, secret-key,
# endpoint, bucket -- a bucket-scoped R2 token for the `tempo-traces` bucket
# only, written by the owner. Read through the cluster-wide `vault-backend`
# ClusterSecretStore, the same store and path family as the Loki
# object-storage credentials in observability/secrets/. That store already
# reads secret/data/platform/*, so no Vault change is needed for this path.
#
# The rendered Secret holds env vars the Tempo config expands
# (-config.expand-env=true, bootstrap/values.yaml's tempo candidate): the
# bucket name, the endpoint and the key pair. None of them is in this
# repository. The endpoint is normalised here to the bare host Tempo's S3
# client expects, whether Vault stores it as a URL or a host.
#
# sync-wave -1: the Secret exists before the StatefulSet that reads it via
# envFrom, so the first pod does not sit in CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tempo-r2
  namespace: observability-eval
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: tempo-r2
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        TEMPO_S3_ACCESS_KEY: "{{ .accessKey }}"
        TEMPO_S3_SECRET_KEY: "{{ .secretKey }}"
        TEMPO_S3_BUCKET: "{{ .bucket }}"
        TEMPO_S3_ENDPOINT: '{{ .endpoint | trim | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}'
  # ESO's CRD defaults spelled out, as in the observability/secrets/
  # ExternalSecrets (#789).
  data:
    - secretKey: accessKey
      remoteRef:
        key: platform/r2-tempo
        property: access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secretKey
      remoteRef:
        key: platform/r2-tempo
        property: secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: endpoint
      remoteRef:
        key: platform/r2-tempo
        property: endpoint
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: bucket
      remoteRef:
        key: platform/r2-tempo
        property: bucket
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
