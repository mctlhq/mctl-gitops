# issue #1355 / #1280: reference copy of the Helm values
# otelCollector.eval.candidates[name=tempo].values
# (platform-gitops/bootstrap/values.yaml) actually passes to the
# grafana/tempo-distributed chart via eval-candidates.yaml's
# `helm.valuesObject` -- that inline map is the real, live mechanism the
# chart receives its configuration from.
#
# This file is NOT read by ArgoCD: the otel-eval-tempo Application's second
# source is this directory (`manifestsPath` in the candidate entry above),
# which carries no Chart.yaml, so it syncs as a plain directory of raw
# manifests, never as Helm values for the first (chart) source. It exists so
# a reviewer opening this directory -- the manifestsPath convention
# eval-candidates.yaml:36-52 was written for -- sees the same values the
# chart actually receives without cross-referencing bootstrap/values.yaml.
# Keep the two in sync by hand; excluded from kubeconform by
# validate-manifests.yml's existing `values\.yaml` ignore pattern (this is
# not a Kubernetes manifest).
fullnameOverride: tempo-distributed

traces:
  otlp:
    grpc:
      # The collector's eval fan-out (otel-collector.yaml) sends OTLP/gRPC
      # only. Off by chart default; every other ingestion path (Jaeger,
      # Zipkin, OpenCensus) stays off too -- nothing in this pipeline emits
      # them.
      enabled: true

# Ephemeral local-disk block storage, not object storage: this is a
# disposable bake-off trial, not a production trace store, and
# `backend: local` is also the chart's own default -- stated explicitly so a
# later values edit cannot silently repoint this candidate at object storage
# without a reviewer seeing the diff.
storage:
  trace:
    backend: local

# One replica, not the chart's default three: a bake-off trial under the
# fixed quota (otelCollector.eval.quota: persistentvolumeclaims: "4" in
# bootstrap/values.yaml), not an HA deployment. Replication is exactly what
# docs/adr/0001-rubric.yaml's `operations` dimension scores post-soak, not
# something to over-provision before the soak has run.
ingester:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

# Explicitly disabled, not left at the chart's already-false default --
# vmagent runs selectAllByDefault: true
# (bootstrap/templates/observability/monitoring.yaml:287), the #1159
# double-scrape shape eval-candidates.yaml's header (lines 14-23) warns
# about. tempo-distributed has no separate PodMonitor toggle; ServiceMonitor
# is its only Prometheus-Operator integration point.
metaMonitoring:
  serviceMonitor:
    enabled: false
