# The OIDC client of the ERPact copy's Frappe sites in ZITADEL
# (mctlhq/mctl-gitops#1501). ZITADEL generates the client secret, and the
# zitadel-iac Job (helm-charts/zitadel-iac/iac/erpact.tf) writes client id,
# secret and the tenant organization id here with server-side apply as field
# manager `zitadel-iac`. The tenant's restore Jobs read it to configure the
# sites' Social Login Key; the name is on the namespace's Secret allowlist
# (bootstrap values.yaml externalManifestNamespaces.erpact).
#
# Declared here, not in git.mctl.ai/erpact/mctl-apps: project erpact admits no
# Secret and no RBAC kind from that repository. Argo CD creates the Secret
# without data and never owns `.data` (ignoreDifferences in
# bootstrap/templates/erpact/oidc-zitadel.yaml), so a sync does not wipe what
# the Job wrote. The Job may only read and patch these two Secrets by name: no
# create, no list, nothing else in this namespace.
apiVersion: v1
kind: Secret
metadata:
  name: erpact-oidc-zitadel
  labels:
    app.kubernetes.io/name: erpact
    app.kubernetes.io/component: oidc-zitadel
type: Opaque
---
# The tenant users each Frappe site must have (key users.json), written by
# the same Job from Vault secret/platform/zitadel/users/erpact: only users
# whose entry carries a `frappe` field, so the namespace holds the e-mail of
# those users and of nobody else (zitadel-iac/iac/erpact.tf). Read by the
# restore Jobs and the users CronJob of git.mctl.ai/erpact/mctl-apps.
apiVersion: v1
kind: Secret
metadata:
  name: erpact-frappe-users
  labels:
    app.kubernetes.io/name: erpact
    app.kubernetes.io/component: oidc-zitadel
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-iac-oidc-client
  labels:
    app.kubernetes.io/name: erpact
    app.kubernetes.io/component: oidc-zitadel
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["erpact-oidc-zitadel", "erpact-frappe-users"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-iac-oidc-client
  labels:
    app.kubernetes.io/name: erpact
    app.kubernetes.io/component: oidc-zitadel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-iac-oidc-client
subjects:
  - kind: ServiceAccount
    name: zitadel-iac
    namespace: zitadel
