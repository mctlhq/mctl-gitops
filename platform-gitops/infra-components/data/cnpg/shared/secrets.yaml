# Every ExternalSecret here whose target is used as a CNPG managed-role
# passwordSecret carries the label cnpg.io/reload: "true" on its rendered
# Secret. That label is not decoration — without it the operator does not
# notice the Secret changing, so a password rotation writes Vault, refreshes
# the Secret, reports SecretSynced=True, and changes nothing in Postgres.
#
# Confirmed twice on 2026-08-27 while rotating mctl-api and mctl-agent
# (gitops#847/#848/#904): status.managedRolesStatus.passwordStatus kept the
# old resourceVersion — March's, for mctl-api — the old password still
# authenticated, and only a restart of the cloudnative-pg deployment applied
# the change. Upstream documents the label as the mechanism: "Available on
# ConfigMap and Secret resources. When set to true, a change in the resource
# is automatically reloaded by the operator."
#
# The failure mode is silent in the worst direction: every intermediate
# signal looks correct while a leaked credential stays valid and the ticket
# gets closed. Keep the label on any new managed-role secret added below.
# Backstage DB credentials — pulled from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-db-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backstage-db-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # CNPG only reacts to changes in a Secret carrying this label.
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: platform/backstage/database
        property: postgres-user
    - secretKey: password
      remoteRef:
        key: platform/backstage/database
        property: postgres-password
---
