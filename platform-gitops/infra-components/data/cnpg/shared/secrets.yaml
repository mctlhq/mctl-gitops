# academy_readonly — SELECT-only role for the private mctl-academy usage
# dashboard in Grafana (platform-gitops/infra-components/observability/
# grafana-dashboards/mctl-academy-usage-dashboard-configmap.yaml). CNPG's
# managed.roles (cluster.yaml) uses this secret to create/rotate the role's
# password; username is a fixed, non-secret literal, not pulled from Vault.
#
# To populate Vault:
#   vault kv put secret/platform/mctl-academy/grafana-readonly \
#     password="<generated>"
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: academy-readonly-db-creds
spec:
  refreshInterval: 1h
  # Cluster store, not cnpg-db-creds: the path moved to platform/, and the
  # cnpg-db-creds role is deliberately scoped to team database credentials.
  # This is the only ExternalSecret in this file on a platform path.
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: academy-readonly-db-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # CNPG only reacts to changes in a Secret carrying this label.
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: "academy_readonly"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/mctl-academy/grafana-readonly
        property: password
