# Vault store for the per-tenant shared-pg credentials in this namespace.
#
# The db-creds ExternalSecrets live here (next to the CNPG Cluster) rather than
# in the tenant namespace, so they cannot use the tenant-scoped `tenant-store`.
# They also must not use the cluster-wide `vault-backend`: that store is usable
# from every namespace, so anything it can read every tenant can read.
#
# This store is namespaced to platform-db — which hosts no tenant workloads —
# and its Vault role only reads teams/+/+/database (plus the one grafana-readonly
# path), not whole team prefixes. See vault-policy-cnpg-db-creds-read.hcl.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-db-creds
  namespace: platform-db
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cnpg-db-creds
  namespace: platform-db
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cnpg-db-creds"
          serviceAccountRef:
            name: cnpg-db-creds
