# Scrape of the CNPG instance exporter (port 9187, named "metrics"). Native
# VMOperator kind rather than the operator-generated monitoring.coreos.com
# PodMonitor (spec.monitoring.enablePodMonitor), which the VM operator
# auto-converts and ArgoCD then reports as drift; enabling both would also
# scrape every pod twice (#1159). The podRole selector excludes Pooler pods.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: shared-pg
  namespace: platform-db
  labels:
    app.kubernetes.io/name: shared-pg
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: shared-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http
