apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shared-pg-daily
spec:
  schedule: "0 0 2 * * *"  # daily at 02:00 UTC (CNPG expects seconds first)
  backupOwnerReference: self
  cluster:
    name: shared-pg
  immediate: true  # take first backup immediately
  # Through the Barman Cloud Plugin, like WAL archiving (cluster.yaml,
  # #2014). Without these two fields the method defaults to the in-tree
  # barmanObjectStore, which the Cluster no longer configures, and every
  # nightly backup would fail.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
