# First base backup through the Barman Cloud Plugin (#2014), taken after
# the archiver switch (#2084) was verified live, so a failure here points
# at the backup path alone. Deliberately a separate sync from the switch:
# a Backup in the same sync is what kept #2047 stuck. Remove once it is
# completed; pruning deletes the CR only, not the data in R2.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: shared-pg-plugin-first
spec:
  cluster:
    name: shared-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
