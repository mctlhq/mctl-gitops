apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-pg
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # The operator rolls the instances whenever this value changes; it is what
    # `kubectl cnpg restart` sets, kept here so the roll goes through review.
    # It reaches the cluster only because bootstrap/templates/data/shared-pg.yaml
    # exempts this one key from the Application's ignoreDifferences.
    # Set 2026-10-10 to apply priorityClassName (see below) to the running pods;
    # bumped again the same night once primaryUpdateMethod became switchover.
    kubectl.kubernetes.io/restartedAt: "2026-10-10T23:18:30Z"
spec:
  # HA: primary + 1 hot standby. Two instances is the minimum that lets a node
  # drain succeed — CNPG promotes the standby and evicts the old primary,
  # instead of the drain deadlocking on the single-instance PDB (0 allowed
  # disruptions) that left worker-cx43-fsn1-ftx cordoned for 13 days during a
  # k3s upgrade. podAntiAffinity (preferred) spreads the two across nodes.
  # Mirrored by SharedPgInstanceMissing in observability/vm-rules/shared-pg-alerts.yaml.
  instances: 2

  # Pinned so ArgoCD does not report OutOfSync against the operator default.
  # The bare 17.x tag is the legacy "system" image (Debian bullseye, which
  # still bundles barman-cloud; since the switch to the Barman Cloud Plugin
  # below nothing uses it, the plugin's sidecar brings its own); its digest equals
  # 17.11-system-bullseye. Staying on bullseye keeps glibc, and with it
  # index collation, unchanged across minor bumps. The operator rolls the
  # standby first, then switches over (primaryUpdateMethod below).
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e

  # WAL archiving and base backups go through the Barman Cloud Plugin
  # (#2014), to the R2 object store defined in object-store.yaml (path,
  # credentials, compression and the 14d retention live there now). The
  # in-tree spec.backup.barmanObjectStore that used to be here is deprecated
  # since CNPG 1.26 and due for removal. isWALArchiver makes the plugin the
  # cluster's archive_command; only one plugin may hold it.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: shared-pg-r2
  backup:
    # Base backups run on the standby when there is one, so the nightly
    # immediate checkpoint and data-directory read stay off the primary.
    target: prefer-standby

  # Data-path priority (#1774); class declared in
  # priority-class.yaml (sync-wave -1). CNPG 1.25 does NOT roll the instances
  # when only this field changes: after #1783 the spec carried the class for
  # hours while shared-pg-1/-2 kept running without it. Bump the restartedAt
  # annotation above to apply a change (standby first, then a switchover per
  # primaryUpdateMethod).
  priorityClassName: platform-data-critical

  affinity:
    podAntiAffinityType: preferred
  enablePDB: true
  enableSuperuserAccess: false
  failoverDelay: 0
  logLevel: info
  maxSyncReplicas: 0
  minSyncReplicas: 0
  postgresGID: 26
  postgresUID: 26
  # switchover, not restart: `restart` only restarts Postgres inside the
  # existing primary pod, so pod-level changes (priorityClassName on
  # 2026-10-10) never reach the primary. switchover promotes the already
  # updated standby, then recreates the old primary as a standby: a few
  # seconds of write interruption instead of a full restart of the primary.
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  smartShutdownTimeout: 180
  startDelay: 3600
  stopDelay: 1800
  switchoverDelay: 3600

  storage:
    storageClass: hcloud-volumes
    size: 40Gi

  resources:
    requests:
      # Raised 1Gi→2Gi on 2026-06-30: shared-pg-1 was OOMKilled 11× against the
      # 1Gi cap, forcing a primary failover to shared-pg-2. shared_buffers
      # (256MB) + 200 max_connections work_mem + WAL/checkpoint buffers exceed
      # 1Gi under load on this shared instance (9 tenant databases).
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 2Gi
      # Raised 1→2 on 2026-06-26: the primary (shared-pg-1) hit 100% CFS
      # throttling on bursts (checkpoints / CNPG base backups) against the 1m
      # cap, firing recurring resource_limit incidents. Avg usage stays low
      # (~89m peak) so request is left at 500m — this is burst headroom only.
      cpu: "2"   # CNPG normalizes 2000m → "2"

  postgresql:
    parameters:
      archive_timeout: "15min"
      max_connections: "200"
      shared_buffers: "256MB"
      work_mem: "4MB"
      temp_file_limit: "256MB"
      statement_timeout: "60s"
      lock_timeout: "10s"
      idle_in_transaction_session_timeout: "300s"
      log_min_duration_statement: "1000"  # log queries >1s
      wal_keep_size: "128MB"  # prevent WAL from filling disk (CNPG default 512MB is too high for 20Gi)
    pg_hba:
      - host all mctl-agent all scram-sha-256
      - host mctl-api mctl-api all scram-sha-256
      # The lifecycle ownership store, same role, its own database. This rule
      # is REQUIRED, not decorative: the mctl-api entry above is scoped to the
      # mctl-api database (unlike mctl-agent's wildcard on the line before), so
      # without it a connection to mctl-lifecycle falls through to the
      # reject-all at the bottom of this list and Postgres refuses it at auth
      # time -- the store never initialises, and its routes answer 503 forever.
      - host mctl-lifecycle mctl-api all scram-sha-256
      # Backstage — access to own db + postgres db (assertDatabaseExists check)
      - host backstage backstage all scram-sha-256
      - host postgres backstage all scram-sha-256
      # Argo Workflows — persistence and archive
      - host argo-workflows argoworkflows all scram-sha-256
      # Team apps — each role only its own database
      # Add new entries when onboarding a new app:
      # - host <db_name> <role_name> all scram-sha-256
      # smoke-test-svc: ephemeral — added/removed by smoke-test CWT, not managed here
      - host mctl-agent mctl-agent all scram-sha-256
      - host labs-kuptsi-app labs-kuptsi-app all scram-sha-256
      # Temporal — server (history/matching/visibility) and admintools schema setup
      - host temporal temporal all scram-sha-256
      - host temporal_visibility temporal all scram-sha-256
      - host labs-mctl-telegram labs-mctl-telegram all scram-sha-256
      - host labs-mctl-telegram-preview labs-mctl-telegram-preview all scram-sha-256
      - host labs-mctl-loyalty labs-mctl-loyalty all scram-sha-256
      - host labs-mctl-pairdesk labs-mctl-pairdesk all scram-sha-256
      - host labs-pfeifenpatenschaft-backend labs-pfeifenpatenschaft-backend all scram-sha-256
      - host labs-mctl-academy labs-mctl-academy all scram-sha-256
      # Read-only Grafana dashboard role — SELECT-only, see
      # mctl-academy migration 1755100000000_academy_readonly_role.mjs.
      - host labs-mctl-academy academy_readonly all scram-sha-256
      - host labs-seerrsense labs-seerrsense all scram-sha-256
      - host labs-mctl-alice labs-mctl-alice all scram-sha-256
      - host karabu-draw-with-friends karabu-draw-with-friends all scram-sha-256
      - host admins-umami admins-umami all scram-sha-256
      # Forgejo (platform git, bootstrap/templates/data/forgejo.yaml)
      - host forgejo forgejo all scram-sha-256
      # ZITADEL (platform identity provider, bootstrap/templates/core-infra/zitadel.yaml)
      - host zitadel zitadel all scram-sha-256
      # Grafana's own database (bootstrap/templates/observability/monitoring.yaml)
      - host grafana grafana all scram-sha-256
      - host all all 0.0.0.0/0 reject

  managed:
    roles:
      - name: backstage
        login: true
        inherit: true
        # 19 plugin schemas (pluginDivisionMode: schema) x knex pool max 3 =
        # 57 per pod, two pods during a rolling deploy. Observed peak 42.
        # SharedPgRoleConnectionsHigh mirrors this limit at 80% (80).
        connectionLimit: 100
        ensure: present
        passwordSecret:
          name: backstage-db-creds
      - name: argoworkflows
        login: true
        inherit: true
        connectionLimit: 20
        ensure: present
        passwordSecret:
          name: argoworkflows-db-creds
      - name: mctl-agent
        login: true
        inherit: true
        connectionLimit: 20
        ensure: present
        passwordSecret:
          name: mctl-agent-db-creds
      - name: mctl-api
        login: true
        inherit: true
        # 40, not 20: mctl-api opens one pool per store and initialises every
        # store once at startup under a shared deadline. During a rolling
        # update the old pod still holds its connections while the new one
        # initialises, and at 20 the new pod hit "too many connections for
        # role" (2026-09-24 11:20Z); the agent registry, surface identities,
        # event outbox and domains stores then stayed disabled (503) until
        # the next restart.
        # 64, not 40: mctl-api runs 2 replicas since gitops#1715, so a rolling
        # update has three pods at once, each holding 11-15 connections
        # (measured 2026-10-09: 15 + 13 + 11 = 39). At 40 the surge pod hit
        # the limit again and its agent registry and domains stores stayed
        # disabled, so it never became Ready.
        # Since mctl-api 4.109.1 (mctl-api#728) every store shares one pool
        # per database URL, 8 connections by default (DB_POOL_MAX_CONNS), so
        # the worst case is 3 pods x (2 URLs x 8 + 3 unpooled) = 57. Measured
        # right after that rollout: 4 per pod. SharedPgRoleConnectionsHigh
        # (vm-rules/shared-pg-alerts.yaml) mirrors this limit at 80%.
        connectionLimit: 64
        ensure: present
        passwordSecret:
          name: mctl-api-db-creds
      # Team app roles
      - name: admins-umami
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: admins-umami-db-creds
      - name: karabu-draw-with-friends
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: karabu-draw-with-friends-db-creds
      - name: labs-seerrsense
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-seerrsense-db-creds
      - name: labs-mctl-alice
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-mctl-alice-db-creds
      - name: labs-mctl-academy
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-mctl-academy-db-creds
      # Read-only role for the private mctl-academy usage dashboard in
      # Grafana. CNPG owns this role's password (from Vault, via the
      # academy-readonly-db-creds ExternalSecret below); table-level SELECT
      # grants are applied separately by mctl-academy's own migration
      # (1755100000000_academy_readonly_role.mjs), which CNPG's role
      # management does not cover.
      - name: academy_readonly
        login: true
        connectionLimit: 5
        ensure: present
        passwordSecret:
          name: academy-readonly-db-creds
      - name: labs-pfeifenpatenschaft-backend
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-pfeifenpatenschaft-backend-db-creds
      - name: labs-mctl-pairdesk
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-mctl-pairdesk-db-creds
      - name: labs-mctl-loyalty
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-mctl-loyalty-db-creds
      - name: labs-mctl-telegram-preview
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-mctl-telegram-preview-db-creds
      - name: labs-mctl-telegram
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-mctl-telegram-db-creds
      - name: labs-kuptsi-app
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: labs-kuptsi-app-db-creds
      # Temporal server connects from the temporal namespace via shared-pg-rw.
      # Owns both the temporal (history+matching) and temporal_visibility databases.
      # Connection budget: 4 server roles (frontend/history/matching/worker)
      # × 20 default + 10 visibility = 120 if every pool filled at once, plus
      # admintools during schema-setup hooks. Observed peak 37 (2026-10-12..20).
      # 140 covers the full pool budget; the old 200 equalled max_connections,
      # so this one role could take every slot on shared-pg. The 20 above 120
      # is for admintools and a server pod restarting while its predecessor
      # still holds its pool. SharedPgRoleConnectionsHigh mirrors this limit
      # at 80% (112).
      - name: temporal
        login: true
        inherit: true
        connectionLimit: 140
        ensure: present
        passwordSecret:
          name: temporal-db-creds
      # Forgejo (bootstrap/templates/data/forgejo.yaml): one replica, Go's
      # database/sql pool defaults to MAX_OPEN_CONNS=0 (unbounded) but idles at
      # a handful; 30 leaves room for migrations on upgrade.
      - name: forgejo
        login: true
        connectionLimit: 30
        ensure: present
        passwordSecret:
          name: forgejo-db-creds
      # ZITADEL (bootstrap/templates/core-infra/zitadel.yaml): one API replica
      # capped at MaxOpenConns 15, plus the init/setup Sync-hook Jobs that run
      # while the old pod is still up during an upgrade. Kept tight because
      # the per-role limits here already sum past max_connections (200). The
      # role owns the zitadel database, so ZITADEL's `init zitadel` creates
      # its schemas without any superuser credential.
      - name: zitadel
        login: true
        connectionLimit: 25
        ensure: present
        passwordSecret:
          name: zitadel-db-creds
      # Grafana (bootstrap/templates/observability/monitoring.yaml): one
      # replica; Grafana's pool defaults to max_open_conn unlimited but idles
      # at 2, and its migrations run on one connection. 10 leaves headroom.
      - name: grafana
        login: true
        connectionLimit: 10
        ensure: present
        passwordSecret:
          name: grafana-db-creds
      #   passwordSecret:
      #     name: team1-app1-db-creds

  bootstrap:
    initdb:
      database: backstage
      owner: backstage
      encoding: UTF8
      localeCType: C
      localeCollate: C
      secret:
        name: backstage-db-creds

  monitoring:
    enablePodMonitor: false  # scraped via vmpodscrape.yaml; true would add a converted duplicate scrape
