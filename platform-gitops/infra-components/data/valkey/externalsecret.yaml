# ACL file for platform Valkey, rendered from secret/platform/valkey.
#
# Least privilege per client; the `default` user is disabled so an
# unauthenticated connection can do nothing.
#   telegram-producer  XADD to its own stream and the audit stream only
#   github-producer    XADD to its own stream and the audit stream only
#   synthetic-producer XADD to mctl:events:synthetic only -- the operator's
#                      end-to-end probe, never used by a service
#   claude-remote      consume the event streams with a consumer group; XADD
#                      only to the audit stream and write only its own
#                      mctl:events:state:* keys (ACL selectors), so the consumer
#                      cannot forge an event into a producer's stream
#   exporter           metrics read access for redis_exporter
# Producers cannot read any stream, so a compromised client stays inside its lane.
#
# Seeded by the bootstrap-platform ClusterWorkflowTemplate (write_if_missing).
# Properties are hex (no spaces), which the ACL `>password` syntax requires.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: valkey-acl
  namespace: platform-events
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: valkey-acl
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users.acl: |
          user default off
          user telegram-producer on >{{ .telegramProducer }} resetkeys ~mctl:events:telegram ~mctl:events:audit resetchannels -@all +xadd +ping +hello
          user github-producer on >{{ .githubProducer }} resetkeys ~mctl:events:github ~mctl:events:audit resetchannels -@all +xadd +ping +hello
          user synthetic-producer on >{{ .syntheticProducer }} resetkeys ~mctl:events:synthetic ~mctl:events:audit resetchannels -@all +xadd +ping +hello
          user claude-remote on >{{ .claudeRemote }} resetkeys ~mctl:events:telegram ~mctl:events:github ~mctl:events:synthetic resetchannels -@all +xreadgroup +xack +xautoclaim +xclaim +xpending +xgroup|create +xinfo|groups +xinfo|stream +ping +hello (~mctl:events:audit +xadd) (~mctl:events:state:* +set +get +exists +incr +expire +del)
          user exporter on >{{ .exporter }} resetkeys ~* resetchannels -@all +info +ping +hello +client|list +config|get +slowlog|get +latency|latest +xinfo|stream +xinfo|groups +type +scan +dbsize +memory|usage
  data:
    - secretKey: telegramProducer
      remoteRef:
        key: platform/valkey
        property: telegram-producer-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubProducer
      remoteRef:
        key: platform/valkey
        property: github-producer-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: syntheticProducer
      remoteRef:
        key: platform/valkey
        property: synthetic-producer-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: claudeRemote
      remoteRef:
        key: platform/valkey
        property: claude-remote-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: exporter
      remoteRef:
        key: platform/valkey
        property: exporter-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The exporter's own password, kept out of the ACL secret so the exporter
# container never sees the other users' credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: valkey-exporter
  namespace: platform-events
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: valkey-exporter
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: platform/valkey
        property: exporter-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
