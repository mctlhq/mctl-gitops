apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: platform-events
  labels:
    app.kubernetes.io/name: valkey
spec:
  serviceName: valkey-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
      annotations:
        # Valkey reads valkey.conf and the ACL file at start only. Bump this after
        # changing valkey.conf; after rotating a password in Vault, wait for ESO
        # to refresh valkey-acl and restart the pod the same way.
        mctl.ai/config-revision: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.1.10-alpine
          args: ["valkey-server", "/etc/valkey/conf/valkey.conf"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /etc/valkey/conf
              readOnly: true
            - name: acl
              mountPath: /etc/valkey/acl
              readOnly: true
        - name: exporter
          image: oliver006/redis_exporter:v1.91.1-alpine
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:6379
            - name: REDIS_USER
              value: exporter
            - name: REDIS_EXPORTER_CHECK_STREAMS
              value: "mctl:events:*"
          envFrom:
            - secretRef:
                name: valkey-exporter
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: conf
          configMap:
            name: valkey-config
        - name: acl
          secret:
            secretName: valkey-acl
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi
