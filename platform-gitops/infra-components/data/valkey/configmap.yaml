apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
  namespace: platform-events
data:
  valkey.conf: |
    port 6379
    bind 0.0.0.0 -::*
    protected-mode yes
    aclfile /etc/valkey/acl/users.acl
    dir /data
    # AOF with fsync every second: at most ~1s of stream entries can be lost on a
    # crash. Acceptable because producers republish from their outbox.
    appendonly yes
    appendfsync everysec
    save ""
    # Streams are trimmed by producers with MAXLEN ~; this is the hard ceiling.
    maxmemory 200mb
    maxmemory-policy noeviction
    loglevel notice
