# Daily Forgejo volume archive → R2.
#
# What is covered where:
#   - Postgres (users, issues, PRs, permissions): shared-pg's CNPG barman backup
#     to R2, nothing to do here.
#   - The volume (/data): bare repositories, LFS objects, attachments, avatars,
#     and gitea/conf/app.ini — which holds SECRET_KEY. Without that key a
#     restored database cannot decrypt 2FA secrets or mirror credentials, so the
#     DB backup alone is not a restore. That is what this CronJob archives.
#
# The archive is crash-consistent, not a snapshot: a push landing during the
# tar can leave that one repository's newest objects out. `git fsck` after a
# restore finds it; the commit itself still exists wherever it was pushed from.
#
# forgejo-data is ReadWriteOnce on an hcloud volume, which can only attach to
# one node, so the Job pod is pinned next to the running Forgejo pod. If
# Forgejo is down the Job cannot schedule, fails at activeDeadlineSeconds, and
# ForgejoBackupStale (vm-rules/backup-alerts.yaml) reports the missed day.
#
# The aws-cli image has no tar, so the archive is built by an init container
# running the Forgejo image itself (busybox tar, uid 1000 = file owner).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup
  namespace: forgejo
spec:
  # 03:30 UTC: after vault-backup (03:00), off the CNPG window (02:00).
  schedule: "30 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forgejo-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: forgejo
                      app.kubernetes.io/instance: forgejo
                  topologyKey: kubernetes.io/hostname
          volumes:
            # No readOnly here: on the claim it makes the hcloud CSI driver
            # mount the block device a second time with `-o ro`, which fails
            # with "Resource busy" because Forgejo already has it mounted rw on
            # this node (seen on the first manual run, 2026-10-03). Read-only
            # is enforced on the volumeMount below instead, which kubelet turns
            # into a ro bind mount of the already-staged volume.
            - name: data
              persistentVolumeClaim:
                claimName: forgejo-data
            - name: archive
              emptyDir:
                sizeLimit: 12Gi
          initContainers:
            - name: archive
              image: code.forgejo.org/forgejo/forgejo:15.0.9-rootless
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  # queues/ and indexers/ are rebuilt by Forgejo on start and
                  # churn constantly; everything else is state.
                  tar -czf /archive/forgejo-data.tar.gz \
                    -C /data \
                    --exclude=./gitea/queues \
                    --exclude=./gitea/indexers \
                    .
                  # A missing app.ini means we archived the wrong thing (empty
                  # or unmounted volume) — fail loudly instead of uploading it.
                  tar -tzf /archive/forgejo-data.tar.gz | grep -q 'gitea/conf/app.ini$'
                  ls -lh /archive/forgejo-data.tar.gz
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: archive
                  mountPath: /archive
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          containers:
            - name: upload
              image: amazon/aws-cli:2.22.35
              envFrom:
                - secretRef:
                    name: forgejo-backup-r2
              env:
                # aws-cli wants a writable HOME for its cache; the image's is
                # root's and this pod runs as 1000.
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: archive
                  mountPath: /archive
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  KEY="forgejo-backups/forgejo-data-${TIMESTAMP}.tar.gz"

                  echo "Uploading ${KEY}..."
                  aws s3 cp /archive/forgejo-data.tar.gz "s3://${BUCKET}/${KEY}" \
                    --endpoint-url "${ENDPOINT}" --region auto

                  echo "Cleaning old archives (keep last 14)..."
                  aws s3 ls "s3://${BUCKET}/forgejo-backups/" \
                    --endpoint-url "${ENDPOINT}" --region auto \
                    | sort | head -n -14 | while read -r line; do
                    FILE=$(echo "$line" | awk '{print $4}')
                    if [ -n "$FILE" ]; then
                      aws s3 rm "s3://${BUCKET}/forgejo-backups/${FILE}" \
                        --endpoint-url "${ENDPOINT}" --region auto
                    fi
                  done

                  echo "Backup complete: ${KEY}"
