# Forgejo credentials, all from Vault (ClusterSecretStore vault-backend).
#
#   secret/platform/forgejo           admin-username, admin-password, metrics-token
#   secret/platform/forgejo/database  username, password  (same path the shared-pg
#                                     managed role reads, cnpg/shared/secrets.yaml,
#                                     so Postgres and Forgejo never disagree)
#   secret/platform/forgejo/r2-backup access-key-id, secret-access-key, bucket,
#                                     endpoint — an R2 token scoped to the dedicated
#                                     forgejo-backup bucket (Object Read & Write).
#                                     Deliberately NOT platform/vault/r2-backup: R2
#                                     tokens scope per bucket, so that key would
#                                     reach Vault snapshots and every CNPG backup
#                                     from this internet-facing namespace.
#
# The first two are seeded by the bootstrap-platform ClusterWorkflowTemplate
# (write_if_missing); the R2 token is created by hand in the Cloudflare dashboard
# (R2 buckets and tokens are not in Terraform), see docs/runbooks/forgejo.md.
#
# conversionStrategy / decodingStrategy / metadataPolicy below are ESO's own
# CRD defaults, spelled out on purpose: ignoring them instead via a
# `.spec.data[].remoteRef.*` jq path is what wedges an Application under
# ServerSideApply + RespectIgnoreDifferences — the array can then never
# shrink (#789, upstream argo-cd#17694).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: forgejo-admin
    creationPolicy: Owner
  # Keys are the ones the chart's init container reads for gitea.admin.existingSecret.
  data:
    - secretKey: username
      remoteRef:
        key: platform/forgejo
        property: admin-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: platform/forgejo
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Bearer token for /metrics. Mounted into Forgejo (FORGEJO__METRICS__TOKEN) and
# read by vmagent through vmservicescrape.yaml; kept out of forgejo-admin so the
# scraper never sees the admin password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-metrics
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: forgejo-metrics
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/forgejo
        property: metrics-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-db-creds
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: forgejo-db-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: platform/forgejo/database
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: platform/forgejo/database
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-backup-r2
  namespace: forgejo
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: forgejo-backup-r2
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: platform/forgejo/r2-backup
        property: access-key-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: platform/forgejo/r2-backup
        property: secret-access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: BUCKET
      remoteRef:
        key: platform/forgejo/r2-backup
        property: bucket
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ENDPOINT
      remoteRef:
        key: platform/forgejo/r2-backup
        property: endpoint
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
