# Renames the OAuth2 authentication source ZITADEL to MCTL in place, so the
# sign-in button reads "Sign in with MCTL" (owner decision 2026-10-04).
#
# Forgejo has no display name separate from the source name, and the chart's
# init container finds its source BY NAME: changing gitea.oauth[0].name alone
# would make it run add-oauth and create a second source, while every account
# link (external_login_user, keyed by source ID) stayed on the old one. So
# this hook renames the existing row by ID first, and the chart, rolled with
# name MCTL in the same sync, then finds and updates it.
#
# Ordering within one sync: forgejo-db-creds (wave -2, externalsecret.yaml)
# and the egress policy below (wave -2), then this Job (Sync hook, wave -1),
# then the chart's resources (wave 0), whose new init script restarts the pod.
# Both callbacks are registered in ZITADEL (zitadel-iac forgejo.tf) while this
# rolls out; the follow-up that drops the ZITADEL callback also removes this
# file.
#
# Fail closed. The run succeeds only when it observed one of:
#   - one OAuth2 source ZITADEL and no source MCTL: rename it, then re-read
#     and require the same ID under MCTL and no ZITADEL left;
#   - one OAuth2 source MCTL and no ZITADEL: already renamed, nothing to do;
#   - neither, in a readable table: nothing to rename, the chart adds MCTL;
#   - no login_source table at all (PostgreSQL's 42P01 for that relation):
#     a fresh database, the chart's `forgejo migrate` creates it.
# Anything else (both names, duplicates, a non-OAuth2 source holding either
# name, an unreadable list, an unknown table header, any other error) fails
# the Job, which fails the sync before the chart could add a duplicate.
#
# Egress: shared-pg, and auth.mctl.ai through Cloudflare. update-oauth
# re-registers the provider, which fetches the discovery document; when that
# fails Forgejo restores the old row and the command fails (seen in the local
# test), so without this rule the rename can never apply. Same Cloudflare IPv4
# ranges as allow-forgejo-oidc-egress in networkpolicy.yaml. DNS comes from
# allow-dns-egress there, which selects every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-source-rename-egress
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-auth-source-rename
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 173.245.48.0/20
        - ipBlock:
            cidr: 103.21.244.0/22
        - ipBlock:
            cidr: 103.22.200.0/22
        - ipBlock:
            cidr: 103.31.4.0/22
        - ipBlock:
            cidr: 141.101.64.0/18
        - ipBlock:
            cidr: 108.162.192.0/18
        - ipBlock:
            cidr: 190.93.240.0/20
        - ipBlock:
            cidr: 188.114.96.0/20
        - ipBlock:
            cidr: 197.234.240.0/22
        - ipBlock:
            cidr: 198.41.128.0/17
        - ipBlock:
            cidr: 162.158.0.0/15
        - ipBlock:
            cidr: 104.16.0.0/13
        - ipBlock:
            cidr: 104.24.0.0/14
        - ipBlock:
            cidr: 172.64.0.0/13
        - ipBlock:
            cidr: 131.0.72.0/22
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-auth-source-rename
  namespace: forgejo
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  # Argo CD does not prune hooks, so the last run would outlive this file;
  # a day is long enough to read its log.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-auth-source-rename
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: rename
          # The image the chart runs (chart 17.1.7 -> 15.0.9, rootless), so
          # the CLI matches the schema it reads.
          image: code.forgejo.org/forgejo/forgejo:15.0.9-rootless
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              OLD=ZITADEL
              NEW=MCTL

              # Only [database] is needed; same settings as the chart's
              # gitea.config.database plus the credentials it takes from env.
              environment-to-ini --config /tmp/app.ini >/dev/null
              fj() { forgejo --config /tmp/app.ini --work-path /tmp/forgejo "$@"; }

              # Prints "id|name|type" per source. Exit 3 = no login_source
              # table; any other failure is an error.
              read_sources() {
                local out
                if ! out=$(fj admin auth list --vertical-bars 2>&1); then
                  if grep -q 'relation "login_source" does not exist (SQLSTATE 42P01)' <<<"$out"; then
                    return 3
                  fi
                  printf '%s\n' "$out" >&2
                  return 1
                fi
                if ! grep -qE '^ID[[:space:]]*\|Name[[:space:]]*\|Type[[:space:]]*\|Enabled' <<<"$out"; then
                  echo "unrecognised 'auth list' output:" >&2
                  printf '%s\n' "$out" >&2
                  return 1
                fi
                awk -F'|' '
                  function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
                  seen { print trim($1) "|" trim($2) "|" trim($3) }
                  /^ID[ \t]*\|Name[ \t]*\|Type[ \t]*\|Enabled/ { seen = 1 }
                ' <<<"$out"
              }

              # Rows with this exact name, any type.
              named() { awk -F'|' -v n="$1" '$2 == n' <<<"$2"; }
              count() { [ -z "$1" ] && echo 0 || wc -l <<<"$1" | tr -d ' '; }
              oauth2_id() { awk -F'|' '$3 == "OAuth2" { print $1 }' <<<"$1"; }

              rc=0
              sources=$(read_sources) || rc=$?
              if [ "$rc" -eq 3 ]; then
                echo "no login_source table yet (fresh database): nothing to rename"
                exit 0
              elif [ "$rc" -ne 0 ]; then
                echo "FAIL: could not read the authentication sources" >&2
                exit 1
              fi

              old=$(named "$OLD" "$sources"); new=$(named "$NEW" "$sources")
              n_old=$(count "$old"); n_new=$(count "$new")
              echo "sources named $OLD: $n_old, named $NEW: $n_new"

              if [ "$n_old" -eq 0 ] && [ "$n_new" -eq 0 ]; then
                echo "neither source exists: nothing to rename, the chart adds $NEW"
                exit 0
              fi
              if [ "$n_old" -eq 0 ] && [ "$n_new" -eq 1 ] && [ -n "$(oauth2_id "$new")" ]; then
                echo "already renamed: OAuth2 source $(oauth2_id "$new") is $NEW"
                exit 0
              fi
              if ! { [ "$n_old" -eq 1 ] && [ "$n_new" -eq 0 ] && [ -n "$(oauth2_id "$old")" ]; }; then
                echo "FAIL: expected exactly one OAuth2 source $OLD and none $NEW, or the reverse:" >&2
                printf '%s\n' "$sources" >&2
                exit 1
              fi

              id=$(oauth2_id "$old")
              echo "renaming OAuth2 source $id: $OLD -> $NEW"
              fj admin auth update-oauth --id "$id" --name "$NEW"

              after=$(read_sources) || {
                echo "FAIL: could not re-read the sources after renaming $id" >&2
                exit 1
              }
              if [ "$(count "$(named "$OLD" "$after")")" -ne 0 ] \
                || [ "$(oauth2_id "$(named "$NEW" "$after")")" != "$id" ]; then
                echo "FAIL: after the rename source $id is not the only $NEW:" >&2
                printf '%s\n' "$after" >&2
                exit 1
              fi
              echo "renamed: OAuth2 source $id is now $NEW"
          env:
            - name: HOME
              value: /tmp
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: shared-pg-rw.platform-db.svc.cluster.local:5432
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__SSL_MODE
              value: disable
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: username
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: password
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
