---
# ExternalSecret for MinIO root credentials in the minio namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-root-credentials
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: minio-root-credentials
    creationPolicy: Owner
  # conversionStrategy / decodingStrategy / metadataPolicy below are ESO's own
  # CRD defaults, spelled out on purpose: ignoring them instead via a
  # `.spec.data[].remoteRef.*` jq path is what wedges an Application under
  # ServerSideApply + RespectIgnoreDifferences — the array can then never
  # shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO version
  # pinned in core-infra/external-secrets.yaml.
  data:
    - secretKey: rootUser
      remoteRef:
        key: platform/minio
        property: root-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: rootPassword
      remoteRef:
        key: platform/minio
        property: root-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

