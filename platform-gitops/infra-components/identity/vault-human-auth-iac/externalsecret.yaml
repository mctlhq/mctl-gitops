# Pull credentials for the private ghcr.io/mctlhq/vault-iac image (the
# vault-human-auth-iac Job). Same source and shape as zitadel-ghcr in
# infra-components/identity/zitadel/externalsecret.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-human-auth-iac-ghcr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      # ESO defaults spelled out: left implicit they read as drift under
      # ServerSideApply and keep the Application OutOfSync, which with
      # selfHeal re-runs the PostSync Job.
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
