# Nothing in this namespace serves anything, and the Job reaches only what it
# needs: DNS, Vault's API, and the Kubernetes API for its state (a Secret and
# a Lease, the kubernetes backend). Service DNAT happens before egress
# filtering on this datapath, so kubernetes.default (10.43.0.1:443) is
# evaluated as the control-plane endpoint on 6443; same rule and reasoning as
# helm-charts/tenant/templates/networkpolicy.yaml. The matching ingress rule
# on Vault's side is in bootstrap/templates/core-infra/vault-netpol.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-human-auth-iac-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-human-auth-iac
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - ipBlock:
            cidr: 10.255.0.0/24
      ports:
        - protocol: TCP
          port: 6443
