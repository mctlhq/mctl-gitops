# ZITADEL credentials, all from Vault (ClusterSecretStore vault-backend).
#
#   secret/platform/zitadel           masterkey, admin-password, login-session-secret
#   secret/platform/zitadel/database  username, password  (same path the shared-pg
#                                     managed role reads, cnpg/shared/secrets.yaml,
#                                     so Postgres and ZITADEL never disagree)
#
# Both are seeded by the bootstrap-platform ClusterWorkflowTemplate
# (write_if_missing), see docs/runbooks/zitadel.md.
#
# Sync wave -1: the chart's init and setup Jobs run as Sync hooks in waves 1
# and 2 and mount these Secrets, so they must exist (and ESO report them
# synced) first.
#
# conversionStrategy / decodingStrategy / metadataPolicy below are ESO's own
# CRD defaults, spelled out on purpose: ignoring them instead via a
# `.spec.data[].remoteRef.*` jq path is what wedges an Application under
# ServerSideApply + RespectIgnoreDifferences — the array can then never
# shrink (#789, upstream argo-cd#17694).
#
# The masterkey encrypts ZITADEL's signing keys and secrets INSIDE the
# database. It must be exactly 32 bytes, must never change after the first
# setup, and a database restore is useless without it. Vault (raft snapshots,
# vault-backup.yaml) is its only copy — do not rotate it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: platform/zitadel
        property: masterkey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# A ZITADEL config file, merged by ZITADEL over the chart's ConfigMap
# (zitadel.configSecretName). It carries only what must not be in git: the DB
# user's password and the break-glass admin's password. The admin password is
# read by the setup job on the FIRST run only; changing it in Vault later does
# not change the account (see the runbook).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-config
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config-yaml: |
          Database:
            Postgres:
              User:
                Username: {{ .dbUsername | quote }}
                Password: {{ .dbPassword | quote }}
          FirstInstance:
            Org:
              Human:
                Password: {{ .adminPassword | quote }}
  data:
    - secretKey: dbUsername
      remoteRef:
        key: platform/zitadel/database
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: dbPassword
      remoteRef:
        key: platform/zitadel/database
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: adminPassword
      remoteRef:
        key: platform/zitadel
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Signs the Login UI's session cookie (login.sessionCookieSecretName). The
# value is a comma-separated list — first entry signs, all verify — so it can
# be rotated without logging everyone out: write "new,old", then "new".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-login-session
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-login-session
    creationPolicy: Owner
  data:
    - secretKey: ZITADEL_SESSION_COOKIE_SECRET
      remoteRef:
        key: platform/zitadel
        property: login-session-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
