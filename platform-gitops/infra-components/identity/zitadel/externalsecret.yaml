# ZITADEL credentials, all from Vault (ClusterSecretStore vault-backend).
#
#   secret/platform/zitadel           masterkey, admin-password, login-session-secret
#   secret/platform/zitadel/database  username, password  (same path the shared-pg
#                                     managed role reads, cnpg/shared/secrets.yaml,
#                                     so Postgres and ZITADEL never disagree)
#
# Both are seeded by the bootstrap-platform ClusterWorkflowTemplate
# (write_if_missing), see docs/runbooks/zitadel.md.
#
# Sync wave -1: the chart's init and setup Jobs run as Sync hooks in waves 1
# and 2 and mount these Secrets, so they must exist (and ESO report them
# synced) first.
#
# conversionStrategy / decodingStrategy / metadataPolicy below are ESO's own
# CRD defaults, spelled out on purpose: ignoring them instead via a
# `.spec.data[].remoteRef.*` jq path is what wedges an Application under
# ServerSideApply + RespectIgnoreDifferences — the array can then never
# shrink (#789, upstream argo-cd#17694).
#
# The masterkey encrypts ZITADEL's signing keys and secrets INSIDE the
# database. It must be exactly 32 bytes, must never change after the first
# setup, and a database restore is useless without it. Vault (raft snapshots,
# vault-backup.yaml) is its only copy — do not rotate it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: platform/zitadel
        property: masterkey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# A ZITADEL config file, merged by ZITADEL over the chart's ConfigMap
# (zitadel.configSecretName). It carries only what must not be in git: the DB
# user's password and the break-glass admin's password. The admin password is
# read by the setup job on the FIRST run only; changing it in Vault later does
# not change the account (see the runbook).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-config
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config-yaml: |
          Database:
            Postgres:
              User:
                Username: {{ .dbUsername | quote }}
                Password: {{ .dbPassword | quote }}
          FirstInstance:
            Org:
              Human:
                Password: {{ .adminPassword | quote }}
  data:
    - secretKey: dbUsername
      remoteRef:
        key: platform/zitadel/database
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: dbPassword
      remoteRef:
        key: platform/zitadel/database
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: adminPassword
      remoteRef:
        key: platform/zitadel
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Signs the Login UI's session cookie (login.sessionCookieSecretName). The
# value is a comma-separated list — first entry signs, all verify — so it can
# be rotated without logging everyone out: write "new,old", then "new".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-login-session
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-login-session
    creationPolicy: Owner
  data:
    - secretKey: ZITADEL_SESSION_COOKIE_SECRET
      remoteRef:
        key: platform/zitadel
        property: login-session-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Pull credentials for the private ghcr.io/mctlhq/zitadel-iac image (the
# zitadel-iac Job, #1520). Same source and shape as mctl-api's ghcr-credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-ghcr
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      # ESO defaults spelled out, like the ExternalSecrets above: left implicit
      # they read as drift under ServerSideApply and keep the Application
      # OutOfSync, which with selfHeal re-runs every PostSync hook.
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Tenant users for the zitadel-iac pod (#1520 S3). One Vault secret per
# tenant, secret/platform/zitadel/users/<tenant>, one field per user: the field
# name is the user name, the value a JSON object {email, first_name,
# last_name, preferred_language}. This repository is public, so the list
# lives only in Vault.
#
# `find` lists every secret under the path (recursively; an empty or missing
# path is an error, never an empty list), `rewrite` keeps only the tenant name
# as the key, and the template folds the lot into one JSON object, users.json,
# which reaches OpenTofu as TF_VAR_tenant_users. Adding a tenant is a new
# Vault secret; no change here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-iac-users
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-iac-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        users.json: "{{ . | toJson }}"
  dataFrom:
    - find:
        path: platform/zitadel/users
        name:
          regexp: "^platform/zitadel/users/[a-z0-9-]+$"
        conversionStrategy: Default
        decodingStrategy: None
      rewrite:
        - regexp:
            source: "^platform/zitadel/users/"
            target: ""
---
# Personal platform admin accounts for the zitadel-iac pod (admins.tf). One
# Vault secret, secret/platform/zitadel/admins, one field per user: the field
# name is the user name in the MCTL organization, the value a JSON object
# {email, first_name, last_name, preferred_language}. This repository is
# public, so the list lives only in Vault.
#
# Fail closed: a missing path never yields an empty list. ESO reports
# SecretSyncedError and creates no Secret, so the pod cannot start; once the
# Secret exists, a failed read keeps its last content (deletionPolicy
# Retain), so a lost read never plans the removal of an admin.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-iac-admins
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-iac-admins
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        admins.json: "{{ . | toJson }}"
  dataFrom:
    - extract:
        key: platform/zitadel/admins
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The Resend API key ZITADEL sends mail with (#1520 S3), the SMTP password of
# zitadel_email_provider_smtp.resend_2465. A sending-only key for mctl.ai.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-iac-smtp
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-iac-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/zitadel/smtp
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
