# Service: redloop-synthetic-staging
# Team: redloop
# Chart: base-service

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.30-alpine"
  digest: "sha256:782bb89768cc87b7f95c18b95baa1af250e5d451f26794f59363540161147c01"
  pullPolicy: IfNotPresent

service:
  port: 80
  containerPort: 8080

backstage:
  kubernetesId: redloop-synthetic-staging

automountServiceAccountToken: false

podSecurityContext:
  runAsUser: 101
  runAsGroup: 101

containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

env:
  APP_ENV: staging
  SERVICE_NAME: redloop-synthetic-staging

# Zero Secrets or Database Dependencies
externalSecret: {}
envFrom: []
dbSecret: null

ingress:
  enabled: true
  hosts:
    - staging-redloop.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  tls:
    - secretName: redloop-synthetic-staging-tls
      hosts:
        - staging-redloop.mctl.ai

probes:
  liveness:
    path: /healthz
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5

configMaps:
  redloop-synthetic-staging-conf:
    default.conf: |
      server {
          listen 8080;
          server_name staging-redloop.mctl.ai;

          # Synthetic landing page for passive crawling
          location = / {
              default_type text/html;
              add_header X-Content-Type-Options "nosniff";
              # Note: Intentionally omit CSP and HSTS to verify scanner detection
              return 200 '<!DOCTYPE html><html><head><title>MCTL RedLoop Staging</title></head><body><h1>Synthetic Security Audit Fixture</h1><p>Dedicated staging target for Phase P2 audit verification.</p></body></html>\n';
          }

          # Health endpoint for blackbox exporter and readiness probes
          location = /healthz {
              default_type application/json;
              return 200 '{"status":"healthy","service":"redloop-synthetic-staging","env":"staging"}\n';
          }

          # Standard static assets
          location = /robots.txt {
              default_type text/plain;
              return 200 "User-agent: *\nDisallow: /admin\n";
          }

          location /static/ {
              default_type application/javascript;
              return 200 'console.log("synthetic staging asset");\n';
          }

          # Catch-all 404 for unapproved paths
          location / {
              default_type text/plain;
              return 404 "Not Found\n";
          }
      }

extraVolumes:
  - name: nginx-conf
    configMap:
      name: redloop-synthetic-staging-conf

extraVolumeMounts:
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d/default.conf
    subPath: default.conf
