# Service: redloop-synthetic-staging
# Team: redloop
# Chart: base-service
#
# Phase P2 — Chainguard Wolfi image (Gate 4 CVE remediation)
# Scan evidence: run #44048121064 — 0 CRITICAL, 0 HIGH, CVE-2026-111497 CLEAN
# See: .github/workflows/redloop-image-scan.yml (PR #2728, merge 1e927341)

image:
  # Switched from nginxinc/nginx-unprivileged (1 CRITICAL: CVE-2026-111497 / brotli-libs)
  # to Chainguard Wolfi (nginx 1.31.8, 0 CVEs at all severities).
  # Digest is immutable linux/amd64; image created 2026-11-15T22:10:17Z.
  # tag: "latest" is the only public Chainguard tag; the digest field below
  # provides the immutable pin — Kubernetes resolves by digest at pull time.
  repository: docker.io/chainguard/nginx
  tag: "latest"
  digest: "sha256:d1007c59cae10bf40b014b8597443f0f945a9728ff91eb05b0ced0809de9fc98"
  pullPolicy: IfNotPresent

service:
  port: 80
  containerPort: 8080

backstage:
  kubernetesId: redloop-synthetic-staging

automountServiceAccountToken: false

# Chainguard nginx runs as UID/GID 65532 (user: nginx, defined in /etc/passwd).
# nginx-unprivileged used 101; updated to match the Chainguard image USER.
# runAsNonRoot is preserved via containerSecurityContext below.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Chainguard nginx requires two writable paths under readOnlyRootFilesystem:
#   /run              — pid file (/run/nginx.pid, per nginx.conf)
#   /var/lib/nginx/tmp — nginx proxy/cache temp files (dir uid=65532, 0777 in image)
# /tmp is kept (chart default) for any runtime temp use.
# /var/log/nginx/{access,error}.log are symlinks to /dev/stdout and /dev/stderr
# (verified from image layers) — no writable volume needed there.
writablePaths:
  - /tmp
  - /run
  - /var/lib/nginx/tmp

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

env:
  APP_ENV: staging
  SERVICE_NAME: redloop-synthetic-staging

# Zero Secrets or Database Dependencies
externalSecret: {}
envFrom: []
dbSecret: null

ingress:
  enabled: false
  hosts:
    - staging-redloop.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  tls:
    - secretName: redloop-synthetic-staging-tls
      hosts:
        - staging-redloop.mctl.ai

probes:
  liveness:
    path: /healthz
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5

configMaps:
  redloop-synthetic-staging-conf:
    default.conf: |
      server {
          listen 8080;
          server_name staging-redloop.mctl.ai;

          # Synthetic landing page for passive crawling
          location = / {
              default_type text/html;
              add_header X-Content-Type-Options "nosniff";
              # Note: Intentionally omit CSP and HSTS to verify scanner detection
              return 200 '<!DOCTYPE html><html><head><title>MCTL RedLoop Staging</title></head><body><h1>Synthetic Security Audit Fixture</h1><p>Dedicated staging target for Phase P2 audit verification.</p></body></html>\n';
          }

          # Health endpoint for blackbox exporter and readiness probes
          location = /healthz {
              default_type application/json;
              return 200 '{"status":"healthy","service":"redloop-synthetic-staging","env":"staging"}\n';
          }

          # Standard static assets
          location = /robots.txt {
              default_type text/plain;
              return 200 "User-agent: *\nDisallow: /admin\n";
          }

          location /static/ {
              default_type application/javascript;
              return 200 'console.log("synthetic staging asset");\n';
          }

          # Catch-all 404 for unapproved paths
          location / {
              default_type text/plain;
              return 404 "Not Found\n";
          }
      }

extraVolumes:
  - name: nginx-conf
    configMap:
      name: redloop-synthetic-staging-conf

extraVolumeMounts:
  # Mount as nginx.default.conf to replace the Chainguard image's built-in
  # default server block (nginx.default.conf on port 8080). If mounted as
  # default.conf instead, both files are loaded and nginx picks nginx.default.conf
  # first (alphabetically), causing all custom locations to 404.
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d/nginx.default.conf
    subPath: default.conf
