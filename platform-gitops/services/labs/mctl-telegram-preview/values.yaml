# Service: mctl-telegram-preview
# Team: labs
# Preview track: auto-deployed on every push to main in mctlhq/mctl-telegram.
# Stable track: tg.mctl.ai — updated by tagged releases only.

# Chart: base-service

# MTProto auth keys must never be opened by overlapping pods. Keep rollouts
# stop-before-start until mctl-telegram has an exclusive session-owner runtime.
strategy:
  type: Recreate
  # Explicit null removes the Deployment's default RollingUpdate settings
  # when ArgoCD applies this transition with server-side apply.
  rollingUpdate: null

image:
  repository: ghcr.io/mctlhq/mctl-telegram
  tag: "main-ff83e73"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: mctl-telegram-preview
resources:
  # Right-sized 2026-08-03 (CPU request only): p95 28m/max 53m over 24h —
  # no burst rationale was ever applied to the request, only the cpu limit
  # below. Memory left untouched: max is 152MB (~30%) of the 512Mi limit,
  # at the trim threshold, not idle enough to cut.
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    # MTProto DH handshake is CPU-heavy; same headroom as stable.
    cpu: 1000m
    memory: 512Mi
env:
  APP_ENV: preview
  AUTH_MODE: local-jwt
  AUTH_REQUIRED: "true"
  ALLOW_SEND: "true"
  LOG_LEVEL: info
  PUBLIC_BASE_URL: https://tg-preview.mctl.ai
  OAUTH_ISSUER_URL: https://tg-preview.mctl.ai
  OAUTH_CODE_TTL: "30m"
  # Was "8760h" — a 1-year access token, carried as a deliberate
  # non-production exception so developers and reviewers would not have to
  # re-authenticate. It bought that convenience by disabling the thing that
  # limits the blast radius of a leak: a token minted here stayed valid until
  # 2027, and one of them did leak, into chat logs and several on-disk client
  # configs. Refresh-token rotation now works end-to-end (verified against
  # this deployment 2026-08-16), so the convenience no longer needs paying
  # for — a client whose hour is up renews silently and nobody is prompted.
  # Match stable rather than inventing a third value.
  OAUTH_ACCESS_TOKEN_TTL: "1h"
  # OriginGuard allowlist. Unset, it defaults to the PUBLIC_BASE_URL origin only,
  # which 403s the browser Origin headers sent by the ChatGPT and Claude connector
  # runtimes. Broadened here to validate connector access on preview before the
  # same change ships to stable tg.mctl.ai. Arbitrary origins still get 403.
  ALLOWED_ORIGINS: "https://tg-preview.mctl.ai,https://chatgpt.com,https://chat.openai.com,https://claude.ai,https://antigravity.google"
  # redirect_uri host allowlist for unregistered client_ids and for every
  # redirect_uri supplied at RFC 7591 dynamic registration (0.50.0+; earlier
  # images ignore this key and use the built-in list). Setting it REPLACES the
  # built-in default rather than extending it, so the defaults are restated
  # here — dropping one silently breaks that client's registration.
  # antigravity.google is the addition: the Antigravity CLI registers with a
  # redirect on its own hosted domain, and without it every attempt 400s,
  # leaving a hand-pasted static bearer token as the only way in.
  # Loopback hosts are accepted regardless of this list.
  OAUTH_ALLOWED_IMPLICIT_HOSTS: "claude.ai,claude.com,chatgpt.com,antigravity.google,localhost,127.0.0.1"
  # Reuse stable demo video; preview doesn't serve its own.
  DEMO_VIDEO_URL: https://tg.mctl.ai/demo/walkthrough.mp4?v=2
  # Preview bot numeric ID (part before the colon in the bot token).
  # Bot is configured with domain tg-preview.mctl.ai in BotFather Login Widget settings.
  # The matching TELEGRAM_OIDC_CLIENT_SECRET is sourced from
  # secret/data/platform/mctl-telegram-preview/oauth via the oauth ExternalSecret.
  TELEGRAM_OIDC_CLIENT_ID: "8923492300"
  TG_LOGIN_ADMINS: "210408407,8745115872,924671154"
  AUTO_APPROVE_CLIENTS: "false"
  # Reviewer demo mode not needed on preview.
  DEMO_REVIEWER_ENABLED: "false"
  # C1 (communication agent staging, observe-only) — see
  # docs/plans/communication-agent.md. AGENT_ENABLED mounts /api/agent/v1 and
  # lets POST /api/agent/token mint a worker credential and PUT
  # /api/admin/agent/profile provision a test account's agent_profiles row.
  #
  # 2026-07-31: switched from bounded test windows to a SUSTAINED real-traffic
  # observe-mode soak, toward the plan's MVP DoD (>=30 real dialogs,
  # classification >=90%, 0 leaks, 0 wrong-peer sends — see "Rollout gates"
  # in the plan doc). Kill switch is OFF so propose_reply can actually draft
  # (confirmed live: with it on, propose_reply denies outright at the policy
  # layer before ever reaching pending_approval — it is not just a send-time
  # gate). Safety comes from agent_profiles.mode=observe AND
  # autopilot_paused=false (DB-level, not here — see internal/agent/policy/
  # policy.go): these are two SEPARATE gates, not one. autopilot_paused=true
  # is an unconditional hard DENY checked before mode is even read — it does
  # NOT downgrade to require-approval, so leaving it true (as an earlier
  # version of this comment incorrectly claimed) silently blocks every draft
  # with zero owner-visible signal, confirmed live 2026-08-01 (action id 42,
  # "autopilot paused for this account"). mode=observe is the actual
  # downgrade-to-RequireApproval gate ("observe mode: never auto-send").
  #
  # CHANGED 2026-08-27: the soak now runs mode=guarded with
  # autopilot_paused=false and intent_allowlist="discovery,schedule", so
  # replies with those two intents SEND AUTONOMOUSLY:
  #   discovery — the neutral "which company / what role is this" question;
  #     5 of the 6 drafts the owner had approved by then were this.
  #   schedule  — proposing a call. Narrower in practice than it sounds: the
  #     agent has no calendar access, so it cannot commit to a specific time.
  # Together they cover 6 of the 6 approved drafts. Everything else
  # (clarify, acknowledge_shared_opportunity, and every owner-facing summary)
  # still routes to approval, because an intent absent from the allowlist is
  # denied by intentAllowed — an EMPTY allowlist permits NOTHING, which is why
  # this had to be set explicitly rather than cleared.
  #
  # The remaining guardrails are all in policy.go and stay active in guarded
  # mode: no URLs, no credential-shaped content, max 6 autonomous turns per
  # conversation, max 2 sends/minute, silence once the owner replies in-thread
  # ("conversation taken over"), blocked-sender list, and the disclosure line
  # appended to every reply. AGENT_KILL_SWITCH below is the one-flip stop: it
  # denies at the policy layer before a draft is ever produced.
  #
  # disclosure_text was reworded at the same time, and is now the bilingual
  # single line "— ИИ-ассистент / AI assistant". Bilingual on purpose: this
  # footer is the ONLY notice a recipient gets, the soak takes unrestricted
  # inbound DMs, and the agent already answers some recruiters in English —
  # messages 77 and 83 of the live thread are English replies. A Russian-only
  # line discloses nothing to those recipients. It used to read "...and reviewed before
  # sending", which stops being true the moment a reply goes out unattended;
  # the long English sentence also sat awkwardly under a Russian reply.
  #
  # It cannot be emptied. policy.go denies a reply outright when
  # disclosure_text is blank, and that check sits BEFORE the observe/guarded
  # split — so clearing the field does not drop the footer, it switches the
  # agent off entirely ("no disclosure text configured"). That is deliberate:
  # with autopilot on, these messages reach real people with the owner
  # nowhere in the loop, and the line is the only thing telling the recipient
  # they are corresponding with software.
  #
  # sender_allowlist is empty (allow-all) so real inbound DMs accumulate as
  # the 30 dialogs, not synthetic test traffic. Note this is the opposite
  # default from intent_allowlist above: empty means allow-all here and
  # deny-all there.
  # THE SOAK RUNS ON THE OPERATOR'S PERSONAL ACCOUNT 210408407, DELIBERATELY.
  #
  # Earlier revisions of this comment said it "MUST bind to 8745115872
  # (@mctlhq)" in the imperative mood while the deployment did the opposite —
  # the exact trap #869 is about. The migration was actually attempted on
  # 2026-08-27 and reverted the same evening, because it does not work:
  #
  #   Every job and every incoming event in this deployment belongs to
  #   user_id 1 (210408407) — 7058 events and 3195 jobs as of that date, all
  #   of them real recruiter DMs to the operator. @mctlhq has none and will
  #   have none: nobody messages a service account. Job claiming is scoped to
  #   the token's user (agentapi.handleClaimJobs -> Queue.Claim(ctx,
  #   id.UserID, ...)), so pointing AGENT_API_TOKEN at @mctlhq leaves the
  #   worker authenticated, healthy and polling an empty queue forever, while
  #   the operator's jobs pile up unclaimed. A soak with no traffic is not a
  #   soak.
  #
  # The privacy argument for the switch also does not survive contact with the
  # code. Ingest is driven by the listener supervisor, which starts one
  # listener per agent_profile with listener_enabled on that account's own
  # MTProto session — not by the worker's token. Changing the token moves who
  # PROCESSES the events, never who GENERATES them. To take the operator's
  # correspondence out of scope you switch off listener_enabled for user 1, or
  # end the soak; there is no third option, and swapping the token only
  # created the illusion of one.
  #
  # @mctlhq is logged in here and left as groundwork (send_enabled=false,
  # listener_enabled=false so it holds no pointless MTProto connection). If
  # the soak is ever re-pointed at it, it must be given real traffic first.
  #
  # Do not turn DEMO_REVIEWER_ENABLED on as a substitute for a real login: the
  # password bypass authenticates a user but creates no MTProto session, so
  # the soak would still have nothing to read.

  AGENT_ENABLED: "true"
  AGENT_KILL_SWITCH: "false"
  # Absolute-TTL exemptions (mctl-telegram#410, 0.51.0+). Preview had none,
  # which meant the soak identity acquired expires_at = connected_at + 90d the
  # moment it logged in: 2026-11-25 for the @mctlhq session created on
  # 2026-08-27. That is the same shape of failure as incident 2f3d550f on
  # production, where the operator's session hit the ceiling and the sweeper
  # revoked it 79 seconds later, mid-use.
  #
  # Both listed identities are non-interactive from the platform's point of
  # view — nobody is going to notice a silent revocation until something
  # downstream is already broken:
  #   8745115872 — the soak/ingest identity. Recovery is an in-pod QR login,
  #     which cannot happen unattended.
  #   210408407 — the operator's own preview MCP session (Antigravity/Cursor).
  #     Recovery is phone+SMS+2FA, i.e. a human on the hook every 90 days for
  #     a session in daily use. That is exactly what #413 removed on prod.
  #
  # THE EXEMPTION IS NOT ABSOLUTE-ONLY. An earlier version of this comment
  # claimed the idle sweep still applied — it does not. SweepIdleSessions
  # splices the same ttlExemptClause into its WHERE (store.go), so a listed id
  # is skipped by BOTH the 90-day ceiling and the 30-day idle check. An exempt
  # session that stops being used is therefore never retired automatically.
  #
  # That is why only 210408407 is listed. It is in daily interactive use, so
  # the idle sweep would never fire on it anyway and the exemption costs
  # nothing beyond what it is meant to buy. 8745115872 is deliberately NOT
  # here: after the reverted migration it holds no traffic and
  # listener_enabled=false, so exempting it would keep an unused MTProto
  # credential alive forever for no purpose. Letting the idle sweep retire it
  # in 30 days is the correct outcome — if the soak is ever pointed at that
  # account, it needs a fresh login regardless, and the id can be added back
  # at that moment.
  SESSION_TTL_EXEMPT_TG_IDS: "210408407"
ingress:
  enabled: true
  hosts:
    - tg-preview.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-telegram-preview-tls
      hosts:
        - tg-preview.mctl.ai
extraContainers: []
dbSecret:
  vaultPath: "teams/labs/mctl-telegram-preview/database"
  secretName: "labs-mctl-telegram-preview-db-creds"
dbInitJob:
  enabled: false
  database: "labs-mctl-telegram-preview"
  waitTable: "identities"
  sql: |
    INSERT INTO identities (provider, provider_id, status, metadata)
    VALUES ('telegram', '__TELEGRAM_ID__', 'approved', '{}')
    ON CONFLICT (provider, provider_id) DO UPDATE SET status = 'approved';
envFrom:
  - secretRef:
      name: "labs-mctl-telegram-preview-db-creds"
  - secretRef:
      name: "labs-mctl-telegram-preview-tg-api"
  - secretRef:
      name: "labs-mctl-telegram-preview-encryption"
  - secretRef:
      name: "labs-mctl-telegram-preview-oauth"
  - secretRef:
      name: "labs-mctl-telegram-preview-login"
extraExternalSecrets:
  # TG_API_ID / TG_API_HASH are MTProto app-level credentials — shared with stable.
  labs-mctl-telegram-preview-tg-api:
    # Platform-scoped path — cluster store required; tenant-store only resolves this tenant's prefix.
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-tg-api
    data:
      - secretKey: TG_API_ID
        remoteKey: secret/data/platform/mctl-telegram/api
        property: TG_API_ID
      - secretKey: TG_API_HASH
        remoteKey: secret/data/platform/mctl-telegram/api
        property: TG_API_HASH
  # Separate ENCRYPTION_KEY: preview DB sessions must not share the stable key.
  labs-mctl-telegram-preview-encryption:
    # Platform-scoped path — cluster store required; tenant-store only resolves this tenant's prefix.
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-encryption
    data:
      - secretKey: ENCRYPTION_KEY
        remoteKey: secret/data/platform/mctl-telegram-preview/encryption
        property: ENCRYPTION_KEY
  labs-mctl-telegram-preview-oauth:
    # Platform-scoped path — cluster store required; tenant-store only resolves this tenant's prefix.
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-oauth
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=false
    data:
      - secretKey: OAUTH_JWT_SIGNING_KEY
        remoteKey: secret/data/platform/mctl-telegram-preview/oauth
        property: jwt-signing-key
      - secretKey: TELEGRAM_OIDC_CLIENT_SECRET
        remoteKey: secret/data/platform/mctl-telegram-preview/oauth
        property: oidc-client-secret
  labs-mctl-telegram-preview-login:
    # Platform-scoped path — cluster store required; tenant-store only resolves this tenant's prefix.
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-login
    data:
      - secretKey: TELEGRAM_LOGIN_BOT_TOKEN
        remoteKey: secret/data/platform/mctl-telegram-preview/login
        property: TELEGRAM_LOGIN_BOT_TOKEN
