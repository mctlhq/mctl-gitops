# Service: mctl-telegram-preview
# Team: labs
# Preview track: auto-deployed on every push to main in mctlhq/mctl-telegram.
# Stable track: tg.mctl.ai — updated by tagged releases only.

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-telegram
  tag: "main-ca3deb4"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: mctl-telegram-preview
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    # MTProto DH handshake is CPU-heavy; same headroom as stable.
    cpu: 1000m
    memory: 512Mi
env:
  APP_ENV: preview
  AUTH_MODE: local-jwt
  AUTH_REQUIRED: "true"
  ALLOW_SEND: "true"
  LOG_LEVEL: info
  PUBLIC_BASE_URL: https://tg-preview.mctl.ai
  OAUTH_ISSUER_URL: https://tg-preview.mctl.ai
  OAUTH_CODE_TTL: "30m"
  # OriginGuard allowlist. Unset, it defaults to the PUBLIC_BASE_URL origin only,
  # which 403s the browser Origin headers sent by the ChatGPT and Claude connector
  # runtimes. Broadened here to validate connector access on preview before the
  # same change ships to stable tg.mctl.ai. Arbitrary origins still get 403.
  ALLOWED_ORIGINS: "https://tg-preview.mctl.ai,https://chatgpt.com,https://chat.openai.com,https://claude.ai"
  # Reuse stable demo video; preview doesn't serve its own.
  DEMO_VIDEO_URL: https://tg.mctl.ai/demo/walkthrough.mp4?v=2
  # Preview bot numeric ID (part before the colon in the bot token).
  # Bot is configured with domain tg-preview.mctl.ai in BotFather Login Widget settings.
  # The matching TELEGRAM_OIDC_CLIENT_SECRET is sourced from
  # secret/data/platform/mctl-telegram-preview/oauth via the oauth ExternalSecret.
  TELEGRAM_OIDC_CLIENT_ID: "8923492300"
  TG_LOGIN_ADMINS: "210408407"
  AUTO_APPROVE_CLIENTS: "true"
  # Reviewer demo mode not needed on preview.
  DEMO_REVIEWER_ENABLED: "false"
  # C1 (communication agent staging, observe-only) — see
  # docs/plans/communication-agent.md. AGENT_ENABLED mounts /api/agent/v1 and
  # lets POST /api/agent/token mint a worker credential and PUT
  # /api/admin/agent/profile provision a test account's agent_profiles row.
  #
  # AGENT_KILL_SWITCH opened 2026-07-26 (explicit, separate operator decision)
  # for the approve/send E2E test: internal/agent/control/notifier.go's
  # DeliverPending gates ALL owner-facing Saved Messages delivery (drafts +
  # approval requests) on this same flag, not just the executor's actual
  # send-to-original-peer step — with it "true", the C1 test account's
  # already-queued owner_notifications rows from earlier successful jobs
  # were silently stuck pending with nothing indicating why (found by
  # reading notifier.go directly after several clean job runs produced no
  # visible draft). mode=observe (autopilot_paused=true) still requires
  # explicit /mctl approve for anything to actually send; policy.go still
  # unconditionally denies URLs/credentials/restricted profile fields
  # regardless of this flag. Left open intentionally for continued C1
  # observation, not a one-shot test — revert to "true" only on an explicit
  # decision to pause C1 again.
  AGENT_ENABLED: "true"
  AGENT_KILL_SWITCH: "false"
  AGENT_PROFILE_PATH: /etc/mctl-agent/profile.yaml
  # 210408407 = @MashkovD, the operator's own admin account (TG_LOGIN_ADMINS
  # above) — used as the C1 test target instead of the originally-planned
  # dedicated reviewer account (8745115872, see
  # reference_mctl_telegram_account_ids memory) because that account has
  # never signed in on tg-preview.mctl.ai (no `users` row yet, so
  # PUT /api/admin/agent/profile 404s on it) and standing up a login path for
  # it wasn't worth the detour for an observe-only, kill-switch-closed test.
  # Must match whichever account's agent_profiles row is used for C1 testing:
  # internal/agent/executor.Executor.ProfileOwnerTGID scopes the profile's
  # restricted-field enforcement (approval_required/never_auto_send) to
  # exactly this one Telegram account, so a mismatch here would silently
  # leave that enforcement inert for the account actually under test. The C1
  # listener only ever activates for an account with a matching
  # agent_profiles.listener_enabled row, which nothing creates automatically.
  AGENT_PROFILE_OWNER_TG_ID: "210408407"
ingress:
  enabled: true
  hosts:
    - tg-preview.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-telegram-preview-tls
      hosts:
        - tg-preview.mctl.ai
extraContainers: []
# C1 owner profile (internal/agent/profile.Data, see AGENT_PROFILE_PATH
# above). Sourced 2026-07-25 from the owner's own public LinkedIn profile
# (linkedin.com/in/dmitriimashkov) at their request. restricted.
# salary_expectations is NOT a stated figure -- it is a labeled market-rate
# estimate (cost-of-living adjusted for Montenegro off US DevOps/platform
# salary survey data) placeholder, marked never_auto_send so it cannot leave
# the system even under an approved reply until replaced with a real number.
#
# !!! DO NOT ever replace the restricted.* placeholder values below with a
# real figure directly in this file. !!! A plain ConfigMap is git-tracked:
# any real compensation/reference/PII data written here becomes permanent,
# plaintext git history readable by every repo reader and every cluster
# identity with ConfigMap-read RBAC in this namespace -- approval_required/
# never_auto_send only gate the AGENT's behavior, they do nothing to
# protect data at rest. (Flagged by Codex review on mctl-gitops#623.)
# Before entering a real restricted value: migrate this file's restricted
# section to a Vault-backed Secret (ExternalSecret, same pattern as
# labs-mctl-telegram-preview-oauth/-login/-encryption below) instead of
# this ConfigMap. Tracked as a follow-up, not yet filed as of this PR --
# do not proceed past the placeholder without it.
configMaps:
  agent-owner-profile:
    profile.yaml: |
      identity:
        name: "Dmitrii Mashkov"
        role: "Back End Developer @ Libertex Group | Building Scalable Solutions"
        location: "Podgorica, Montenegro"
        company: "Libertex Group"
        education: "Kuban State University (KubSU)"
      public_profile:
        summary: >-
          Backend / platform engineer focused on Kubernetes, GitOps, and
          cloud infrastructure automation. Building mctl.ai, an AI-native
          platform for Kubernetes and cloud operations built on Backstage,
          Argo, K3s, HashiCorp Vault, VictoriaMetrics and Grafana, and MCTL
          Telegram, a remote MCP connector for Telegram. Google Cloud
          certified (Associate Cloud Engineer; Terraform on Google Cloud;
          Cloud Security Fundamentals; Secure Google Cloud Network).
        open_to: "Europe (+1 more) — On-site, Hybrid, Remote"
      skills:
        - Kubernetes
        - GitOps
        - Terraform
        - AWS (EKS)
        - Google Cloud Platform
        - Platform Engineering
        - Backstage
        - Argo Workflows / Argo Rollouts / Argo CD
        - HashiCorp Vault
        - VictoriaMetrics
        - Grafana
        - Go (backend development)
        - CI/CD
        - MCP (Model Context Protocol) / AI tooling
      preferences:
        work_mode: "Remote, Hybrid, or On-site"
        region: "Europe"
      restricted:
        salary_expectations:
          value: >-
            PLACEHOLDER, not a confirmed figure from the owner: rough
            market-rate estimate for a mid-level backend/platform engineer
            with Kubernetes/GitOps/Terraform/cloud experience, cost-of-living
            adjusted for a Montenegro-based remote candidate off US DevOps
            salary survey data (~EUR 3,500-5,000/month gross, wide-uncertainty
            estimate). Replace with the owner's actual figure before any
            guarded-mode use.
          approval_required: true
          never_auto_send: true
extraVolumes:
  - name: agent-owner-profile
    configMap:
      name: agent-owner-profile
extraVolumeMounts:
  - name: agent-owner-profile
    mountPath: /etc/mctl-agent/profile.yaml
    subPath: profile.yaml
    readOnly: true
dbSecret:
  vaultPath: "teams/labs/mctl-telegram-preview/database"
  secretName: "labs-mctl-telegram-preview-db-creds"
dbInitJob:
  enabled: false
  database: "labs-mctl-telegram-preview"
  waitTable: "identities"
  sql: |
    INSERT INTO identities (provider, provider_id, status, metadata)
    VALUES ('telegram', '__TELEGRAM_ID__', 'approved', '{}')
    ON CONFLICT (provider, provider_id) DO UPDATE SET status = 'approved';
envFrom:
  - secretRef:
      name: "labs-mctl-telegram-preview-db-creds"
  - secretRef:
      name: "labs-mctl-telegram-preview-tg-api"
  - secretRef:
      name: "labs-mctl-telegram-preview-encryption"
  - secretRef:
      name: "labs-mctl-telegram-preview-oauth"
  - secretRef:
      name: "labs-mctl-telegram-preview-login"
extraExternalSecrets:
  # TG_API_ID / TG_API_HASH are MTProto app-level credentials — shared with stable.
  labs-mctl-telegram-preview-tg-api:
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-tg-api
    data:
      - secretKey: TG_API_ID
        remoteKey: secret/data/platform/mctl-telegram/api
        property: TG_API_ID
      - secretKey: TG_API_HASH
        remoteKey: secret/data/platform/mctl-telegram/api
        property: TG_API_HASH
  # Separate ENCRYPTION_KEY: preview DB sessions must not share the stable key.
  labs-mctl-telegram-preview-encryption:
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-encryption
    data:
      - secretKey: ENCRYPTION_KEY
        remoteKey: secret/data/platform/mctl-telegram-preview/encryption
        property: ENCRYPTION_KEY
  labs-mctl-telegram-preview-oauth:
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-oauth
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=false
    data:
      - secretKey: OAUTH_JWT_SIGNING_KEY
        remoteKey: secret/data/platform/mctl-telegram-preview/oauth
        property: jwt-signing-key
      - secretKey: TELEGRAM_OIDC_CLIENT_SECRET
        remoteKey: secret/data/platform/mctl-telegram-preview/oauth
        property: oidc-client-secret
  labs-mctl-telegram-preview-login:
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-login
    data:
      - secretKey: TELEGRAM_LOGIN_BOT_TOKEN
        remoteKey: secret/data/platform/mctl-telegram-preview/login
        property: TELEGRAM_LOGIN_BOT_TOKEN
