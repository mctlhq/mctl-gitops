# Service: mctl-telegram-preview
# Team: labs
# Preview track: auto-deployed on every push to main in mctlhq/mctl-telegram.
# Stable track: tg.mctl.ai — updated by tagged releases only.

# Chart: base-service

# MTProto auth keys must never be opened by overlapping pods. Keep rollouts
# stop-before-start until mctl-telegram has an exclusive session-owner runtime.
strategy:
  type: Recreate
  # Explicit null removes the Deployment's default RollingUpdate settings
  # when ArgoCD applies this transition with server-side apply.
  rollingUpdate: null

image:
  repository: ghcr.io/mctlhq/mctl-telegram
  tag: "main-6627cf0"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: mctl-telegram-preview
resources:
  # Right-sized 2026-08-03 (CPU request only): p95 28m/max 53m over 24h —
  # no burst rationale was ever applied to the request, only the cpu limit
  # below. Memory left untouched: max is 152MB (~30%) of the 512Mi limit,
  # at the trim threshold, not idle enough to cut.
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    # MTProto DH handshake is CPU-heavy; same headroom as stable.
    cpu: 1000m
    memory: 512Mi
env:
  APP_ENV: preview
  AUTH_MODE: local-jwt
  AUTH_REQUIRED: "true"
  ALLOW_SEND: "true"
  LOG_LEVEL: info
  PUBLIC_BASE_URL: https://tg-preview.mctl.ai
  OAUTH_ISSUER_URL: https://tg-preview.mctl.ai
  OAUTH_CODE_TTL: "30m"
  # Was "8760h" — a 1-year access token, carried as a deliberate
  # non-production exception so developers and reviewers would not have to
  # re-authenticate. It bought that convenience by disabling the thing that
  # limits the blast radius of a leak: a token minted here stayed valid until
  # 2027, and one of them did leak, into chat logs and several on-disk client
  # configs. Refresh-token rotation now works end-to-end (verified against
  # this deployment 2026-08-16), so the convenience no longer needs paying
  # for — a client whose hour is up renews silently and nobody is prompted.
  # Match stable rather than inventing a third value.
  OAUTH_ACCESS_TOKEN_TTL: "1h"
  # OriginGuard allowlist. Unset, it defaults to the PUBLIC_BASE_URL origin only,
  # which 403s the browser Origin headers sent by the ChatGPT and Claude connector
  # runtimes. Broadened here to validate connector access on preview before the
  # same change ships to stable tg.mctl.ai. Arbitrary origins still get 403.
  ALLOWED_ORIGINS: "https://tg-preview.mctl.ai,https://chatgpt.com,https://chat.openai.com,https://claude.ai,https://antigravity.google"
  # redirect_uri host allowlist for unregistered client_ids and for every
  # redirect_uri supplied at RFC 7591 dynamic registration (0.50.0+; earlier
  # images ignore this key and use the built-in list). Setting it REPLACES the
  # built-in default rather than extending it, so the defaults are restated
  # here — dropping one silently breaks that client's registration.
  # antigravity.google is the addition: the Antigravity CLI registers with a
  # redirect on its own hosted domain, and without it every attempt 400s,
  # leaving a hand-pasted static bearer token as the only way in.
  # Loopback hosts are accepted regardless of this list.
  OAUTH_ALLOWED_IMPLICIT_HOSTS: "claude.ai,claude.com,chatgpt.com,antigravity.google,localhost,127.0.0.1"
  # Reuse stable demo video; preview doesn't serve its own.
  DEMO_VIDEO_URL: https://tg.mctl.ai/demo/walkthrough.mp4?v=2
  # Preview bot numeric ID (part before the colon in the bot token).
  # Bot is configured with domain tg-preview.mctl.ai in BotFather Login Widget settings.
  # The matching TELEGRAM_OIDC_CLIENT_SECRET is sourced from
  # secret/data/platform/mctl-telegram-preview/oauth via the oauth ExternalSecret.
  TELEGRAM_OIDC_CLIENT_ID: "8923492300"
  TG_LOGIN_ADMINS: "210408407,8745115872,924671154"
  AUTO_APPROVE_CLIENTS: "false"
  # Reviewer demo mode not needed on preview.
  DEMO_REVIEWER_ENABLED: "false"
  # C1 (communication agent staging, observe-only) — see
  # docs/plans/communication-agent.md. AGENT_ENABLED mounts /api/agent/v1 and
  # lets POST /api/agent/token mint a worker credential and PUT
  # /api/admin/agent/profile provision a test account's agent_profiles row.
  #
  # 2026-07-31: switched from bounded test windows to a SUSTAINED real-traffic
  # observe-mode soak, toward the plan's MVP DoD (>=30 real dialogs,
  # classification >=90%, 0 leaks, 0 wrong-peer sends — see "Rollout gates"
  # in the plan doc). Kill switch is OFF so propose_reply can actually draft
  # (confirmed live: with it on, propose_reply denies outright at the policy
  # layer before ever reaching pending_approval — it is not just a send-time
  # gate). Safety comes from agent_profiles.mode=observe AND
  # autopilot_paused=false (DB-level, not here — see internal/agent/policy/
  # policy.go): these are two SEPARATE gates, not one. autopilot_paused=true
  # is an unconditional hard DENY checked before mode is even read — it does
  # NOT downgrade to require-approval, so leaving it true (as an earlier
  # version of this comment incorrectly claimed) silently blocks every draft
  # with zero owner-visible signal, confirmed live 2026-08-01 (action id 42,
  # "autopilot paused for this account"). mode=observe is the actual
  # downgrade-to-RequireApproval gate ("observe mode: never auto-send"), so
  # every drafted reply still sits in pending_approval until the owner
  # manually /mctl approve's it — nothing sends autonomously during this
  # soak. sender_allowlist is empty (allow-all) so real inbound DMs
  # accumulate as the 30 dialogs, not synthetic test traffic.
  # Soak/ingest MUST bind to 8745115872 (@mctlhq), not operator 210408407:
  # the operator personal account is also used for interactive preview MCP
  # and must not be the shared MTProto session (AUTH_KEY_DUPLICATED with
  # production). Git cannot complete that switch — it needs a real Telegram
  # OIDC login as @mctlhq on tg-preview.mctl.ai, PUT /api/admin/agent/profile
  # for telegram_id 8745115872, and a reminted aud=agent token in Vault
  # (secret/data/platform/labs/agent-worker-preview/api). Do not turn
  # DEMO_REVIEWER_ENABLED on as a substitute. Revisit when the soak ends.
  AGENT_ENABLED: "true"
  AGENT_KILL_SWITCH: "false"
ingress:
  enabled: true
  hosts:
    - tg-preview.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-telegram-preview-tls
      hosts:
        - tg-preview.mctl.ai
extraContainers: []
dbSecret:
  vaultPath: "teams/labs/mctl-telegram-preview/database"
  secretName: "labs-mctl-telegram-preview-db-creds"
dbInitJob:
  enabled: false
  database: "labs-mctl-telegram-preview"
  waitTable: "identities"
  sql: |
    INSERT INTO identities (provider, provider_id, status, metadata)
    VALUES ('telegram', '__TELEGRAM_ID__', 'approved', '{}')
    ON CONFLICT (provider, provider_id) DO UPDATE SET status = 'approved';
envFrom:
  - secretRef:
      name: "labs-mctl-telegram-preview-db-creds"
  - secretRef:
      name: "labs-mctl-telegram-preview-tg-api"
  - secretRef:
      name: "labs-mctl-telegram-preview-encryption"
  - secretRef:
      name: "labs-mctl-telegram-preview-oauth"
  - secretRef:
      name: "labs-mctl-telegram-preview-login"
extraExternalSecrets:
  # TG_API_ID / TG_API_HASH are MTProto app-level credentials — shared with stable.
  labs-mctl-telegram-preview-tg-api:
    # Platform-scoped path — cluster store required; tenant-store only resolves this tenant's prefix.
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-tg-api
    data:
      - secretKey: TG_API_ID
        remoteKey: secret/data/platform/mctl-telegram/api
        property: TG_API_ID
      - secretKey: TG_API_HASH
        remoteKey: secret/data/platform/mctl-telegram/api
        property: TG_API_HASH
  # Separate ENCRYPTION_KEY: preview DB sessions must not share the stable key.
  labs-mctl-telegram-preview-encryption:
    # Platform-scoped path — cluster store required; tenant-store only resolves this tenant's prefix.
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-encryption
    data:
      - secretKey: ENCRYPTION_KEY
        remoteKey: secret/data/platform/mctl-telegram-preview/encryption
        property: ENCRYPTION_KEY
  labs-mctl-telegram-preview-oauth:
    # Platform-scoped path — cluster store required; tenant-store only resolves this tenant's prefix.
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-oauth
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=false
    data:
      - secretKey: OAUTH_JWT_SIGNING_KEY
        remoteKey: secret/data/platform/mctl-telegram-preview/oauth
        property: jwt-signing-key
      - secretKey: TELEGRAM_OIDC_CLIENT_SECRET
        remoteKey: secret/data/platform/mctl-telegram-preview/oauth
        property: oidc-client-secret
  labs-mctl-telegram-preview-login:
    # Platform-scoped path — cluster store required; tenant-store only resolves this tenant's prefix.
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: labs-mctl-telegram-preview-login
    data:
      - secretKey: TELEGRAM_LOGIN_BOT_TOKEN
        remoteKey: secret/data/platform/mctl-telegram-preview/login
        property: TELEGRAM_LOGIN_BOT_TOKEN
