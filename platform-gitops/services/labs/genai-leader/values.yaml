# Service: genai-leader
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/genai-leader
  tag: "0.1.1"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: genai-leader
# Non-root on a read-only root filesystem (base-service hardening, step 2).
# runAsNonRoot is checked by kubelet against a numeric user only, so the
# ids this image already runs as are pinned (observed 2026-10-16); the
# chart's writablePaths gives it a writable /tmp.
podSecurityContext:
  runAsUser: 101
  runAsGroup: 101
containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - labs-genai-leader.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: genai-leader-tls
      hosts:
        - labs-genai-leader.mctl.ai
probes:
  liveness:
    path: /healthz
  readiness:
    path: /healthz
extraContainers: []
