# Worker: smoke-test-svc
# Team: labs
# Chart: base-service (ingress disabled)

image:
  repository: ghcr.io/mctlhq/smoke-test-svc
  tag: "smoke-test-7pkk9-deploy"
imagePullSecrets:
  - name: ghcr-credentials
ingress:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 60
    periodSeconds: 15
env:
  SMOKE_ENV: deploy_action
extraContainers: []
externalSecret:
  targetSecret: smoke-test-svc-secrets
  data:
    - secretKey: SMOKE_SECRET
      remoteKey: teams/labs/smoke-test-svc
      property: SMOKE_SECRET
envFrom:
  - secretRef:
      name: smoke-test-svc-secrets
