# Service: agent-worker-preview
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/agent-worker-preview
  tag: "0.45.0"

imagePullSecrets:
  - name: ghcr-credentials

service:
  port: 8080

backstage:
  kubernetesId: agent-worker-preview

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  APP_ENV: production

ingress:
  enabled: true
  hosts:
    - 
