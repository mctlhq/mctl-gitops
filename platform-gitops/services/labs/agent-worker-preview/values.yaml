# Worker: agent-worker-preview
# Team: labs
# Chart: base-service (ingress disabled)

# Kept at 0 until the C1 rollout sequence mints AGENT_API_TOKEN/sets
# AGENT_API_BASE_URL (docs/plans/communication-agent.md's staged rollout
# order) — this was never explicitly set during the original onboarding, so
# the pod ran at the chart's replicaCount=1 default and crash-looped for 3+
# hours on startup ("AGENT_API_BASE_URL is required") before this was
# caught. Bump to 1 only as an explicit, separate step once the worker's
# required env is actually configured below.
replicaCount: 0

image:
  repository: ghcr.io/mctlhq/agent-worker-preview
  tag: "0.45.0"

imagePullSecrets:
  - name: ghcr-credentials

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 60
    periodSeconds: 15

# AGENT_API_TOKEN is the aud=agent worker credential minted via
# POST /api/agent/token, scoped to a single Telegram account (210408407,
# matching mctl-telegram-preview's AGENT_PROFILE_OWNER_TG_ID and the
# agent_profiles row created for C1 testing). Stored in Vault, never in git —
# see extraExternalSecrets below.
env:
  AGENT_API_BASE_URL: "https://tg-preview.mctl.ai"

envFrom:
  - secretRef:
      name: labs-agent-worker-preview-api

extraExternalSecrets:
  labs-agent-worker-preview-api:
    refreshInterval: 1h
    targetSecret: labs-agent-worker-preview-api
    data:
      - secretKey: AGENT_API_TOKEN
        remoteKey: secret/data/platform/labs/agent-worker-preview/api
        property: AGENT_API_TOKEN
