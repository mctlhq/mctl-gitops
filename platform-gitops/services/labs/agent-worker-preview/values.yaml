# Worker: agent-worker-preview
# Team: labs
# Chart: base-service (ingress disabled)

# Bumped to 1 now that AGENT_API_BASE_URL/AGENT_API_TOKEN are wired (#628).
# Still safe at this point: mctl-telegram-preview's AGENT_KILL_SWITCH stays
# "true" and the C1 agent_profiles row (210408407) has listener_enabled=false,
# so no DM ever reaches this worker yet — this step only proves the process
# itself starts healthy against real config, per docs/plans/communication-agent.md's
# staged rollout order.
replicaCount: 1

image:
  repository: ghcr.io/mctlhq/agent-worker-preview
  tag: "0.45.0"

imagePullSecrets:
  - name: ghcr-credentials

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 60
    periodSeconds: 15

# AGENT_API_TOKEN is the aud=agent worker credential minted via
# POST /api/agent/token, scoped to a single Telegram account (210408407,
# matching mctl-telegram-preview's AGENT_PROFILE_OWNER_TG_ID and the
# agent_profiles row created for C1 testing). Stored in Vault, never in git —
# see extraExternalSecrets below.
env:
  AGENT_API_BASE_URL: "https://tg-preview.mctl.ai"

envFrom:
  - secretRef:
      name: labs-agent-worker-preview-api

extraExternalSecrets:
  labs-agent-worker-preview-api:
    refreshInterval: 1h
    targetSecret: labs-agent-worker-preview-api
    data:
      - secretKey: AGENT_API_TOKEN
        remoteKey: secret/data/platform/labs/agent-worker-preview/api
        property: AGENT_API_TOKEN
