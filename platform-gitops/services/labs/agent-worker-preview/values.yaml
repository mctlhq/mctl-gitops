# Worker: agent-worker-preview
# Team: labs
# Chart: base-service (ingress disabled)

# Kept at 0 until the C1 rollout sequence mints AGENT_API_TOKEN/sets
# AGENT_API_BASE_URL (docs/plans/communication-agent.md's staged rollout
# order) — this was never explicitly set during the original onboarding, so
# the pod ran at the chart's replicaCount=1 default and crash-looped for 3+
# hours on startup ("AGENT_API_BASE_URL is required") before this was
# caught. Bump to 1 only as an explicit, separate step once the worker's
# required env is actually configured below.
replicaCount: 0

image:
  repository: ghcr.io/mctlhq/agent-worker-preview
  tag: "0.45.0"

imagePullSecrets:
  - name: ghcr-credentials

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 60
    periodSeconds: 15

env: {}
