# Worker: agent-worker-preview
# Team: labs
# Chart: base-service (ingress disabled)

# Bumped to 1 now that AGENT_API_BASE_URL/AGENT_API_TOKEN are wired (#628).
# Still safe at this point: mctl-telegram-preview's AGENT_KILL_SWITCH stays
# "true" and the C1 agent_profiles row (210408407) has listener_enabled=false,
# so no DM ever reaches this worker yet — this step only proves the process
# itself starts healthy against real config, per docs/plans/communication-agent.md's
# staged rollout order.
replicaCount: 1
image:
  repository: ghcr.io/mctlhq/agent-worker-preview
  tag: "main-925b67f"
imagePullSecrets:
  - name: ghcr-credentials
ingress:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 60
    periodSeconds: 15
# AGENT_API_TOKEN is the aud=agent worker credential minted via
# POST /api/agent/token, scoped to a single Telegram account (210408407,
# matching mctl-telegram-preview's AGENT_PROFILE_OWNER_TG_ID and the
# agent_profiles row created for C1 testing). Stored in Vault, never in git —
# see extraExternalSecrets below.
#
# AGENT_API_BASE_URL must be the full /api/agent/v1 root, not just the host —
# internal/agentworker/client.go appends paths like "/events" directly onto
# it with no further prefix. An earlier version of this file set it to just
# "https://tg-preview.mctl.ai", which made every poll 404 and left the pod
# stuck failing readiness indefinitely (no crash loop, since /healthz doesn't
# depend on the poll loop, but never Ready either). In-cluster service DNS
# is used instead of the public hostname since the worker and
# mctl-telegram-preview run in the same namespace/cluster.
# AGENT_SYSTEM_PROMPT is optional per docs/agent-worker.md but was left
# unset during the original C1 onboarding — confirmed live 2026-07-25 that
# the bare jobPrompt() alone ("A new Telegram message arrived... decide what
# to do") leaves the model with no stated role, so it's this deployment's
# only source of the actual communication-agent persona/task instructions.
# AGENT_MAX_BUDGET_USD caps a single job's spend — cheap insurance on top of
# the dedicated OAuth token (see the anthropic ExternalSecret below) given
# this org's Claude Code monthly quota is scarce enough that this session
# personally hit a hard 429 once already.
env:
  AGENT_API_BASE_URL: "http://labs-mctl-telegram-preview-base-service:8080/api/agent/v1"
  AGENT_MAX_BUDGET_USD: "0.50"
  AGENT_SYSTEM_PROMPT: >-
    You are the owner's communication agent for incoming Telegram direct messages, currently handling the HR/recruiter scenario: classifying inbound DMs, extracting job-opportunity details, and drafting replies for the owner to review. You are running in OBSERVE mode: every reply you propose requires the owner's manual approval before it can ever be sent — propose_reply will return require_approval, not send anything directly, and that is expected, not a failure.

    On each job: call get_event and get_conversation_context to see the message and conversation so far. If get_recruiter_profile is relevant to answering a question about the owner's background, call it too. If the message is a genuine job opportunity or recruiter outreach, call save_job_lead with what you can extract (company, role, key details) — safe to call with partial data, later calls upsert. Then call propose_reply with a short, polite, professional draft reply addressing what the sender asked. Do not include any links, phone numbers, verification codes, or credentials in the reply — the server enforces this regardless, but do not attempt it. Do not state a specific salary figure; if compensation comes up, note that expectations can be discussed after an initial conversation.

    If the message is not a recruiter/job message (spam, unrelated chat, already handled), it is fine to take no action beyond reviewing it.

    Call complete_agent_job exactly once, as the last thing you do, after you have taken every action this turn warrants — status=completed if you persisted a result (a lead save or a reply proposal), status=ignored if this message genuinely needed no action.
envFrom:
  - secretRef:
      name: labs-agent-worker-preview-api
  - secretRef:
      name: labs-agent-worker-preview-anthropic
extraExternalSecrets:
  labs-agent-worker-preview-api:
    refreshInterval: 1h
    targetSecret: labs-agent-worker-preview-api
    data:
      - secretKey: AGENT_API_TOKEN
        remoteKey: secret/data/platform/labs/agent-worker-preview/api
        property: AGENT_API_TOKEN
  # Dedicated Claude Code OAuth token for this worker's `claude -p` invocations
  # — deliberately NOT the CLAUDE_CODE_OAUTH_TOKEN/_2 secrets shared by
  # claude-review.yml across the org, which this same session watched exhaust
  # its monthly quota and stall the interactive session + every repo's PR
  # review gate simultaneously (see project_communication_agent memory's
  # "production quota domain" note). internal/agentworker/claudeinvoker.go's
  # minimalEnv() passes any CLAUDE_*-prefixed env var through to the spawned
  # `claude` process unmodified, so this is picked up with no other wiring.
  labs-agent-worker-preview-anthropic:
    refreshInterval: 1h
    targetSecret: labs-agent-worker-preview-anthropic
    data:
      - secretKey: CLAUDE_CODE_OAUTH_TOKEN
        remoteKey: secret/data/platform/labs/agent-worker-preview/anthropic
        property: CLAUDE_CODE_OAUTH_TOKEN
extraContainers: []
