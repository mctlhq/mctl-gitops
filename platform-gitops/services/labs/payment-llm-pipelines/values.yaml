# Service: payment-llm-pipelines
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/payment-llm-pipelines
  tag: "0.1.0-r2"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: payment-llm-pipelines
# Non-root on a read-only root filesystem (base-service hardening, step 2).
# runAsNonRoot is checked by kubelet against a numeric user only, so the
# ids this image already runs as are pinned (observed 2026-10-16); the
# chart's writablePaths gives it a writable /tmp.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
  MOCK: "1"
  APP_VERSION: 0.1.0
  GIT_COMMIT: c04e0e5
ingress:
  enabled: true
  hosts:
    - labs-payment-llm-pipelines.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: payment-llm-pipelines-tls
      hosts:
        - labs-payment-llm-pipelines.mctl.ai
probes:
  liveness:
    path: /healthz
  readiness:
    path: /healthz
extraContainers: []
