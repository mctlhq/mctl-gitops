# Service: mctl-alice
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-alice
  tag: "2.2.9"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: mctl-alice
replicaCount: 1
# Explicit on purpose. The live Deployment still had `Recreate`, left by a
# manual `kubectl patch` on 2026-09-20 and owned by that field manager, so
# an empty `strategy` here never reached it under server-side apply. Recreate
# was needed only while the pod held a ReadWriteOnce PVC; storage moved to
# shared Postgres (CNPG), so a rolling update is safe and avoids the gap.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
# Non-root on a read-only root filesystem (base-service hardening, step 2).
# runAsNonRoot is checked by kubelet against a numeric user only, so the
# ids this image already runs as are pinned (observed 2026-10-16); the
# chart's writablePaths gives it a writable /tmp.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  PORT: "8080"
  NODE_ENV: production
  PUBLIC_BASE_URL: https://alice.mctl.ai
  AUTH_REQUIRED: "true"
  # Rate-limit key for anonymous clients (mctl-alice >= 2.2.9). Traefik
  # rewrites X-Forwarded-For to the Cloudflare edge address, so the client is
  # only visible in CF-Connecting-IP, which Cloudflare overwrites on every
  # request; the websecure allowlist admits only Cloudflare addresses.
  CLIENT_IP_HEADER: cf-connecting-ip
probes:
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 30
    periodSeconds: 15
ingress:
  enabled: true
  hosts:
    - alice.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-alice-tls
      hosts:
        - alice.mctl.ai
envFrom:
  - secretRef:
      name: mctl-alice-secrets
  - secretRef:
      name: labs-mctl-alice-db-creds
# PostgreSQL storage backend: SQLite data (oauth.db & telemetry.db) from the
# dedicated 10Gi PVC was backed up out-of-band prior to cutover. Dedicated
# volume persistence is removed in favor of shared-pg in platform-db.
dbSecret:
  vaultPath: teams/labs/mctl-alice/database
  secretName: labs-mctl-alice-db-creds
externalSecret:
  targetSecret: mctl-alice-secrets
  data:
    - secretKey: ENCRYPTION_KEY
      remoteKey: teams/labs/mctl-alice
      property: ENCRYPTION_KEY
    - secretKey: YANDEX_COOKIE
      remoteKey: teams/labs/mctl-alice
      property: YANDEX_COOKIE
    - secretKey: YANDEX_OAUTH_TOKEN
      remoteKey: teams/labs/mctl-alice
      property: YANDEX_OAUTH_TOKEN
    - secretKey: YANDEX_CLIENT_ID
      remoteKey: teams/labs/mctl-alice
      property: YANDEX_CLIENT_ID
    - secretKey: YANDEX_CLIENT_SECRET
      remoteKey: teams/labs/mctl-alice
      property: YANDEX_CLIENT_SECRET
extraContainers: []
# Deny /metrics at the edge. mctl-alice serves /metrics on the app port for
# the in-cluster VMServiceScrape (bootstrap/templates/mctl-platform/
# mctl-alice-monitor.yaml), the same shape as mctl-telegram, and these are the
# same two objects mctl-telegram uses for it (mctlhq/mctl-telegram#588; read
# the comments there for why each field is what it is). The app itself also
# answers 404 to a /metrics request carrying X-Forwarded-For or another proxy
# header (mctl-alice >= the release with mctlhq/mctl-alice#93); this route is
# the primary control and that check the second layer.
#
# Labels are literal, not `include "base-service.labels"`: a values file must
# parse as YAML before extra-objects.yaml runs tpl over it, so only quoted
# scalars can carry templates here.
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: '{{ include "base-service.fullname" . }}-deny-metrics'
      labels:
        app.kubernetes.io/name: base-service
        app.kubernetes.io/instance: labs-mctl-alice
        app.kubernetes.io/part-of: mctl-platform
        app.kubernetes.io/managed-by: Helm
        mctl.me/component: metrics-edge-deny
    spec:
      # traefik v3 has no 403 middleware; an allowlist nothing can match
      # (192.0.2.0/24, TEST-NET-1, RFC 5737) is how "deny" is spelled.
      # ipAllowList is the traefik.io (v3) field name.
      ipAllowList:
        sourceRange:
          - 192.0.2.0/24
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: '{{ include "base-service.fullname" . }}-metrics-deny'
      labels:
        app.kubernetes.io/name: base-service
        app.kubernetes.io/instance: labs-mctl-alice
        app.kubernetes.io/part-of: mctl-platform
        app.kubernetes.io/managed-by: Helm
        mctl.me/component: metrics-edge-deny
    spec:
      # websecure only: the web entrypoint redirects every request to https
      # before any router matches (traefik static config, kube-hetzner).
      entryPoints:
        - websecure
      routes:
        # Explicit priority so the deny wins over the chart Ingress's
        # Host(...) && PathPrefix(/) regardless of rule-length ordering.
        - match: Host(`alice.mctl.ai`) && PathPrefix(`/metrics`)
          kind: Rule
          priority: 1000
          middlewares:
            - name: '{{ include "base-service.fullname" . }}-deny-metrics'
          services:
            - name: '{{ include "base-service.fullname" . }}'
              # Literal; keep in sync with service.port above.
              port: 8080
      tls:
        secretName: mctl-alice-tls
