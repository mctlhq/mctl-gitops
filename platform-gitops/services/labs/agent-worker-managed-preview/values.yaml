# Worker: agent-worker-managed-preview
# Team: labs
# Chart: base-service (ingress disabled)

# Platform-operated pool worker for the `managed` communication-agent runtime
# (mctlhq/mctl-telegram#1088, ADR 0008 section 6; gitops#2345). It runs an
# account's jobs on an OpenAI-compatible model reached through the dedicated
# `mctl-telegram` Cloudflare AI Gateway (infrastructure/cloudflare/account/
# ai-gateway.tf). Separate from agent-worker-preview, which is the own-runtime
# worker and the own-runtime rollback target; this deployment never touches it.
#
# Staged rollout. This file lands INERT: replicaCount 0 and no ExternalSecret.
# base-service renders every extraExternalSecrets entry unconditionally, and an
# ExternalSecret whose Vault path does not exist yet would leave the
# Application Degraded (ArgoCDApplicationDegraded) for the whole
# pre-activation window. The three ExternalSecrets and the envFrom are added in
# activation step 4, after the Vault secrets are written; replicaCount goes to
# 1 in a later, separate PR (step 5). The exact entries and the order are in
# platform-gitops/agents-state/mctl-gitops/proposals/
# issue-2345-feat-labs-agent-worker-managed-preview-m/requirements.md,
# "Activation". Env names are the ones mctl-telegram cmd/agent-worker/main.go
# reads: AGENT_API_TOKEN, AGENT_OPENAI_API_KEY, AGENT_GATEWAY_TOKEN.
#
# Rollback, in order: account back to runtime "own", replicaCount 0, revoke the
# pool token jti, MANAGED_RUNTIME_ENABLED "false" in mctl-telegram-preview.
replicaCount: 0
image:
  repository: ghcr.io/mctlhq/agent-worker-preview
  tag: "main-a787e97"
  # tag is auto-bumped by mctl-telegram's preview-deploy.yml on every push to
  # main (mctl-telegram#1094: its dispatch skips until this file exists on
  # main, then bumps it) — do not hand-pin it.
imagePullSecrets:
  - name: ghcr-credentials
ingress:
  enabled: false
resources:
  # No `claude` CLI subprocess in the OpenAI runner, so far smaller than
  # agent-worker-preview.
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 256Mi
automountServiceAccountToken: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
probes:
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 60
    periodSeconds: 15
env:
  # Must be the full /api/agent/v1 root (the client appends paths directly).
  AGENT_API_BASE_URL: "http://labs-mctl-telegram-preview-base-service:8080/api/agent/v1"
  AGENT_RUNNER: "openai"
  # Per-job tokens derived from the aud=agent-pool token; never falls back to
  # an account token (mctl-telegram#1090). No AGENT_SYSTEM_PROMPT on purpose:
  # in the managed runtime the prompt comes from the account's assistant
  # install, not from this deployment.
  AGENT_POOL_MODE: "true"
  # C1 gate dev/eval model (mctl-telegram#1093, mctlhq/.github#293).
  AGENT_MODEL: "Qwen/Qwen3.6-35B-A3B"
  # Account id is the non-secret value already committed in
  # ai-gateway-custom-providers.json and admins/mctl-support/values.yaml.
  AGENT_OPENAI_BASE_URL: "https://gateway.ai.cloudflare.com/v1/6a09f637d20e1f66a8e9d45ebe778058/mctl-telegram/custom-hetzner/v1"
  # Keep equal to MANAGED_MAX_JOB_COST_USD in mctl-telegram-preview.
  AGENT_MAX_BUDGET_USD: "0.25"
  AGENT_MAX_TURNS: "12"
  # Conservative; Hetzner measured about 35 req/min per key.
  AGENT_OPENAI_MIN_INTERVAL: "6s"
  AGENT_WORKER_CONCURRENCY: "1"
  # Shadow prices: Nebius GLM-5.1, the production model (as in
  # admins/mctl-support/values.yaml), so the preview ledger and caps behave as
  # production would.
  MODEL_INPUT_USD_PER_MTOK: "1.40"
  MODEL_OUTPUT_USD_PER_MTOK: "4.40"
  # Non-secret quota-domain label (the Vault path of the Hetzner key), exported
  # on mctl_agent_credential_domain. Read through requireEnv: fail-fast if unset.
  AGENT_CREDENTIAL_DOMAIN_ID: "platform/labs/agent-worker-managed-preview/openai"
extraVolumes:
  - name: agent-tmp
    emptyDir:
      sizeLimit: 64Mi
extraVolumeMounts:
  - name: agent-tmp
    mountPath: /tmp
extraContainers: []
