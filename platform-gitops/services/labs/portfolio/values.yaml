# Service: portfolio
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/portfolio
  tag: "0.1.44"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 80
backstage:
  kubernetesId: portfolio
# nginx starts as root, chowns its cache directories and switches its
# workers to the `nginx` user, so it needs these capabilities back on top of
# the chart's `drop: [ALL]`; NET_BIND_SERVICE is for port 80. Lists replace
# rather than merge, hence `drop` is repeated. Remove this override when the
# image moves to nginx-unprivileged (base-service hardening, step 2).
containerSecurityContext:
  capabilities:
    drop: [ALL]
    add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
  # Root image: opted out of the chart's step-2 default until it moves to
  # nginx-unprivileged, together with the capabilities above.
  runAsNonRoot: false
  readOnlyRootFilesystem: false
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - labs-portfolio.mctl.ai
    - dmitriimashkov.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: portfolio-tls
      hosts:
        - labs-portfolio.mctl.ai
    - secretName: portfolio-custom-tls
      hosts:
        - dmitriimashkov.com
extraContainers: []
