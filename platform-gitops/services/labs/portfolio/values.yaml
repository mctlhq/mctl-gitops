# Service: portfolio
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/portfolio
  tag: "0.1.17"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 80
backstage:
  kubernetesId: portfolio
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - labs-portfolio.mctl.ai
    - preview.dmitriimashkov.com
    - dmitriimashkov.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: portfolio-tls
      hosts:
        - labs-portfolio.mctl.ai
    - secretName: portfolio-custom-tls
      hosts:
        - preview.dmitriimashkov.com
        - dmitriimashkov.com
extraContainers: []
