# Worker: psa-smoke
# Team: labs
# Chart: base-service (ingress disabled)

image:
  repository: ghcr.io/mctlhq/psa-smoke
  tag: "psa1966-onboard"
imagePullSecrets:
  - name: ghcr-credentials
ingress:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24
  readiness: null
  liveness: null
env:
  PSA_SMOKE: "2"
externalSecret:
  targetSecret: psa-smoke-secrets
  data:
    - secretKey: PSA_SECRET
      remoteKey: teams/labs/psa-smoke
      property: PSA_SECRET
envFrom:
  - secretRef:
      name: labs-psa-smoke-db-creds
  - secretRef:
      name: psa-smoke-secrets
dbSecret:
  vaultPath: teams/labs/psa-smoke/database
  secretName: labs-psa-smoke-db-creds
extraContainers: []
