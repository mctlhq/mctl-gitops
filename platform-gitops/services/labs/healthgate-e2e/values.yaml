# Service: healthgate-e2e
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/healthgate-e2e
  tag: "0.1.67"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 9999
backstage:
  kubernetesId: healthgate-e2e
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - labs-healthgate-e2e.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: healthgate-e2e-tls
      hosts:
        - labs-healthgate-e2e.mctl.ai
containerSecurityContext:
  runAsUser: 101
  runAsGroup: 101
