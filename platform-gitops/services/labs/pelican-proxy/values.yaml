# Service: pelican-proxy
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/pelican-proxy
  tag: "0.17.0"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8787
backstage:
  kubernetesId: pelican-proxy
resources:
  # CORRECTED 2026-08-03: the 24h sample used for the first trim (p95
  # 8.5m/32MB) badly understated real usage — a 7d pull shows max 71.7m
  # CPU / 182MB mem, p95 163MB mem (already ~60% of the 256Mi limit set
  # a few hours earlier). That trim triggered a real CPU-throttling alert
  # within ~20min of rollout. Re-set with margin over the 7d max instead
  # of the 24h one: ~4x CPU, ~1.9x mem over the 7d peak.
  requests:
    cpu: 75m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 512Mi
env:
  APP_ENV: production
  CATALOG_INGEST_URL: https://pelican-catalog-worker.pelican-libertex.workers.dev/__ingest
ingress:
  enabled: true
  hosts:
    - labs-pelican-proxy.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: pelican-proxy-tls
      hosts:
        - labs-pelican-proxy.mctl.ai
externalSecret:
  targetSecret: pelican-proxy-secrets
  data:
    - secretKey: LIBERTEX_EMAIL
      remoteKey: teams/labs/pelican-proxy
      property: LIBERTEX_EMAIL
    - secretKey: LIBERTEX_PASSWORD
      remoteKey: teams/labs/pelican-proxy
      property: LIBERTEX_PASSWORD
    - secretKey: INGEST_SECRET
      remoteKey: teams/labs/pelican-proxy
      property: INGEST_SECRET
    - secretKey: CATALOG_INGEST_SECRET
      remoteKey: teams/labs/pelican-proxy
      property: CATALOG_INGEST_SECRET
envFrom:
  - secretRef:
      name: pelican-proxy-secrets
extraContainers: []
