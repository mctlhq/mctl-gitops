# Service: mctl-academy
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-academy
  tag: "0.1.30"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: mctl-academy
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - academy.mctl.ai
    - labs-mctl-academy.mctl.ai
    - labs-mctl-academy.mctl.me
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-academy-tls
      hosts:
        - academy.mctl.ai
        - labs-mctl-academy.mctl.ai
        - labs-mctl-academy.mctl.me
dbSecret:
  vaultPath: "teams/labs/mctl-academy/database"
  secretName: "labs-mctl-academy-db-creds"
dbInitJob:
  enabled: false
  database: "labs-mctl-academy"
  waitTable: "identities"
  sql: |
    INSERT INTO identities (provider, provider_id, status, metadata)
    VALUES ('telegram', '__TELEGRAM_ID__', 'approved', '{}')
    ON CONFLICT (provider, provider_id) DO UPDATE SET status = 'approved';
envFrom:
  - secretRef:
      name: "labs-mctl-academy-db-creds"
  - secretRef:
      name: mctl-academy-secrets
externalSecret:
  targetSecret: mctl-academy-secrets
  data:
    - secretKey: GITHUB_CLIENT_ID
      remoteKey: teams/labs/mctl-academy
      property: GITHUB_CLIENT_ID
    - secretKey: GITHUB_CLIENT_SECRET
      remoteKey: teams/labs/mctl-academy
      property: GITHUB_CLIENT_SECRET
    - secretKey: PUBLIC_BASE_URL
      remoteKey: teams/labs/mctl-academy
      property: PUBLIC_BASE_URL
    - secretKey: BETTER_AUTH_SECRET
      remoteKey: teams/labs/mctl-academy
      property: BETTER_AUTH_SECRET
    - secretKey: BETTER_AUTH_URL
      remoteKey: teams/labs/mctl-academy
      property: BETTER_AUTH_URL
extraContainers: []
