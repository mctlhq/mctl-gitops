# Service: smoke-rotation
# Team: labs

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/smoke-rotation
  tag: "es1856-smoke"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: smoke-rotation
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - labs-smoke-rotation.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: smoke-rotation-tls
      hosts:
        - labs-smoke-rotation.mctl.ai
