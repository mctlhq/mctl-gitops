apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: news-factory
  namespace: namax66
  description: "news-factory service"
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=namax66-news-factory
    backstage.io/kubernetes-id: news-factory
    backstage.io/kubernetes-namespace: namax66
    argocd/app-name: namax66-news-factory
    github.com/source-repo: NaMax66/sales-with.ai
    # mctl.me/auto-deploy — triggered by GitHub App webhook on tag push
    #   "true" or "auto" — deploy immediately via scaffolder
    #   "confirm"         — notify only, user deploys manually from UI
    #   "false" or absent — skip
    mctl.me/auto-deploy: "false"
  links:
    - url: https://ops.mctl.ai/applications/argocd/namax66-news-factory
      title: ArgoCD
      icon: dashboard
    - url: https://github.com/NaMax66/sales-with.ai
      title: Source Repository
      icon: github
    - url: https://workflows.mctl.ai
      title: Argo Workflows
      icon: github
  labels:
    team: namax66
    env: apps
spec:
  type: worker
  lifecycle: production
  owner: group:default/namax66
  system: system:default/team-namax66
