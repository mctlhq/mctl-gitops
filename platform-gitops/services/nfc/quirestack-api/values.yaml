# Service: quirestack-api
# Team: nfc

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/quirestack-api
  tag: "0.1.4"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 3001
backstage:
  kubernetesId: quirestack-api
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - nfc-quirestack-api.mctl.ai
    - nfc-quirestack-api.mctl.me
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: quirestack-api-tls
      hosts:
        - nfc-quirestack-api.mctl.ai
        - nfc-quirestack-api.mctl.me
probes:
  liveness: null
  readiness: null
externalSecret: {}
envFrom:
  - secretRef:
      name: quirestack-api-secrets
dbSecret:
  vaultPath: "teams/nfc/quirestack-api/database"
  secretName: "nfc-quirestack-api-db-creds"
dbInitJob:
  enabled: false
  database: "nfc-quirestack-api"
  waitTable: "identities"
  sql: |
    INSERT INTO identities (provider, provider_id, status, metadata)
    VALUES ('telegram', '__TELEGRAM_ID__', 'approved', '{}')
    ON CONFLICT (provider, provider_id) DO UPDATE SET status = 'approved';
envFrom: []
extraContainers: []
