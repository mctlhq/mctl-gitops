# Service: quirestack-api
# Team: nfc

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/quirestack-api
  tag: "0.1.3"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 3001
backstage:
  kubernetesId: quirestack-api
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - nfc-quirestack-api.mctl.ai
    - nfc-quirestack-api.mctl.me
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: quirestack-api-tls
      hosts:
        - nfc-quirestack-api.mctl.ai
        - nfc-quirestack-api.mctl.me
probes:
  liveness: null
  readiness: null
externalSecret:
  targetSecret: quirestack-api-secrets
  data:
    - secretKey: DATABASE_URL
      remoteKey: teams/nfc/quirestack-api
      property: DATABASE_URL
envFrom:
  - secretRef:
      name: quirestack-api-secrets
