# Service: quirestack-web
# Team: nfc

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/quirestack-web
  tag: "0.1.8"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 3000
backstage:
  kubernetesId: quirestack-web
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
  API_URL: https://nfc-quirestack-api.mctl.ai
  BETTER_AUTH_URL: https://nfc-quirestack-web.mctl.ai
ingress:
  enabled: true
  hosts:
    - nfc-quirestack-web.mctl.ai
    - nfc-quirestack-web.mctl.me
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: quirestack-web-tls
      hosts:
        - nfc-quirestack-web.mctl.ai
        - nfc-quirestack-web.mctl.me
# ExternalSecret refresh updates the Secret but does not restart this pod.
# After rotating BETTER_AUTH_SECRET, perform an explicit rollout so Next.js
# server-action references are rebuilt against the new runtime secret
# (incident-c33cf596). The one-time incident rollout is intentionally not
# kept as a permanent annotation.
envFrom:
  - secretRef:
      name: nfc-quirestack-api-db-creds
  - secretRef:
      name: quirestack-web-secrets
externalSecret:
  targetSecret: quirestack-web-secrets
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteKey: teams/nfc/quirestack-web
      property: BETTER_AUTH_SECRET
probes:
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
extraContainers: []
