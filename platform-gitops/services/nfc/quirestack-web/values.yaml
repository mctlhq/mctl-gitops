# Service: quirestack-web
# Team: nfc

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/quirestack-web
  tag: "0.1.8"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 3000
backstage:
  kubernetesId: quirestack-web
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
  API_URL: https://nfc-quirestack-api.mctl.ai
  BETTER_AUTH_URL: https://nfc-quirestack-web.mctl.ai
ingress:
  enabled: true
  hosts:
    - nfc-quirestack-web.mctl.ai
    - nfc-quirestack-web.mctl.me
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: quirestack-web-tls
      hosts:
        - nfc-quirestack-web.mctl.ai
        - nfc-quirestack-web.mctl.me
envFrom:
  - secretRef:
      name: nfc-quirestack-api-db-creds
  - secretRef:
      name: quirestack-web-secrets
externalSecret:
  targetSecret: quirestack-web-secrets
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteKey: teams/nfc/quirestack-web
      property: BETTER_AUTH_SECRET
probes:
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
extraContainers: []

dbSecret:
  vaultPath: "teams/nfc/quirestack-web/database"
  secretName: "nfc-quirestack-web-db-creds"
dbInitJob:
  enabled: false
  database: "nfc-quirestack-web"
  waitTable: "identities"
  sql: |
    INSERT INTO identities (provider, provider_id, status, metadata)
    VALUES ('telegram', '__TELEGRAM_ID__', 'approved', '{}')
    ON CONFLICT (provider, provider_id) DO UPDATE SET status = 'approved';
envFrom:
  - secretRef:
      name: "nfc-quirestack-web-db-creds"
