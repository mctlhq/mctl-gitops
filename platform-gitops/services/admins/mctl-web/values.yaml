# Service: mctl-web
# Team: admins
# Environment: production
# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-web
  tag: "7.7.1"
imagePullSecrets:
  - name: ghcr-credentials
service:
  # 6.0.0 (pre-redesign rollback) runs nginx on port 80. The base-service
  # chart binds the container port and the Service port to this single
  # value, so it must change together with the image tag.
  port: 80
# nginx starts as root, chowns its cache directories and switches its
# workers to the `nginx` user, so it needs these capabilities back on top of
# the chart's `drop: [ALL]`; NET_BIND_SERVICE is for port 80. Lists replace
# rather than merge, hence `drop` is repeated. Remove this override when the
# image moves to nginx-unprivileged (base-service hardening, step 2).
containerSecurityContext:
  capabilities:
    drop: [ALL]
    add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
resources:
  # Right-sized 2026-08-03: p95 0.2m/max 0.51m CPU, 14.4MB/14.4MB mem over
  # 24h — was still at untouched chart defaults.
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 150m
    memory: 256Mi
env:
  APP_ENV: production
  t: "123"
  r: "321"
  NUXT_PUBLIC_FRONT_BASE: https://mctl.ai
  NUXT_VUE_DEVTOOLS: "true"
ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - mctl.ru
    - mctl.ai
  tls:
    - secretName: mctl-web-tls
      hosts:
        - mctl.ru
        - mctl.ai
blueGreen:
  enabled: true
  autoPromotionEnabled: true
externalSecret: {}
envFrom: []
extraContainers: []
