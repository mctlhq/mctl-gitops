# Service: mctl-web
# Team: admins
# Environment: production
# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-web
  tag: "7.11.0"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 80
  # nginx-unprivileged listens on 8080 (mctl-web 7.10.0+). The Service and
  # Ingress stay on 80 and reach it through the named targetPort; changing
  # port itself on a live Service fails to apply (gitops#1933).
  containerPort: 8080
# nginx-unprivileged runs as uid/gid 101. Pinned here so kubelet and the
# deploy-time image-user check can verify runAsNonRoot without reading the
# image; the rest comes from the chart's step-2 defaults, including the /tmp
# emptyDir that nginx writes its pid file and temp directories into.
containerSecurityContext:
  runAsUser: 101
  runAsGroup: 101
resources:
  # Right-sized 2026-08-03: p95 0.2m/max 0.51m CPU, 14.4MB/14.4MB mem over
  # 24h — was still at untouched chart defaults.
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 150m
    memory: 256Mi
env:
  APP_ENV: production
  NUXT_PUBLIC_FRONT_BASE: https://mctl.ai
ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - mctl.ru
    - mctl.ai
  tls:
    - secretName: mctl-web-tls
      hosts:
        - mctl.ru
        - mctl.ai
externalSecret: {}
envFrom: []
extraContainers: []
