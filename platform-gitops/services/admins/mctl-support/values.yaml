# Service: mctl-support
# Team: admins
# Tenant support agent over A2A (mctlhq/mctl-support, epic mctlhq/.github#243).

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-support
  tag: "0.3.2"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: mctl-support
# Two replicas share one Postgres task store; a task sent to one replica is
# readable and cancellable through the other. Roll one pod at a time and never
# drop below two.
replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# The service holds no Kubernetes identity. It mints its tenant-bound run
# token from the caller's bearer through mctl-api, never through a projected
# ServiceAccount token, so none is mounted.
automountServiceAccountToken: false
# Non-root on a read-only root filesystem. The image pins uid/gid 10001
# (Dockerfile); the chart's writablePaths gives it a writable /tmp.
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
containerSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
# SUPPORT_EXECUTOR=agent runs the model loop (S1b/S1c). Provider and model are
# the owner's decision of 2026-10-28 (mctlhq/mctl-support#5): Anthropic,
# claude-sonnet-5-5, the reference production model; GLM-5.1 on Nebius was
# evaluated and rejected for the S1e gate. Sonnet needs mctl-support 0.3.0 or
# later, which passes thinking blocks back within a task. The prices are that
# model's per-million-token list prices; the spend caps keep their service
# defaults (task 0.50, tenant 10, workspace 50 USD per UTC month).
# SUPPORT_ALLOWED_TENANTS is the pilot allowlist.
#
# Egress: base-service pods in admins match allow-mctl-services-internet-egress,
# so the network does not limit where this pod connects. Containment comes
# from the run token (scope support, one tenant, read-only routes) and the
# agent having no shell, fs, web or kubectl tools, not from a NetworkPolicy.
env:
  APP_ENV: production
  SUPPORT_ENV: production
  SUPPORT_EXECUTOR: agent
  SUPPORT_ALLOWED_TENANTS: namax66,karabu
  SUPPORT_PUBLIC_URL: https://support.mctl.ai
  MCTL_API_URL: https://api.mctl.ai
  MCTL_AUTH_ISSUER: https://api.mctl.ai
  MODEL_PROVIDER: anthropic
  ANTHROPIC_MODEL: claude-sonnet-5-5
  MODEL_INPUT_USD_PER_MTOK: "2.00"
  MODEL_OUTPUT_USD_PER_MTOK: "10.00"
  SUPPORT_METRICS_PORT: "9090"
# /metrics on its own listener, scraped by
# bootstrap/templates/mctl-platform/mctl-support-monitor.yaml (a native
# VMServiceScrape, hence serviceMonitor: false).
metrics:
  enabled: true
  port: 9090
  serviceMonitor: false
# Traces to the in-cluster collector (docs/runbooks/otel-collector.md). The
# service names itself mctl-support.
otel:
  enabled: true
# support.mctl.ai is the public host; DNS is the *.mctl.ai wildcard, so no
# record is needed. It is reserved for this namespace in
# bootstrap/values.yaml (reservedPlatformHosts). admins-mctl-support.mctl.ai
# stays as the canonical host.
ingress:
  enabled: true
  hosts:
    - support.mctl.ai
    - admins-mctl-support.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-support-tls
      hosts:
        - support.mctl.ai
        - admins-mctl-support.mctl.ai
# /readyz checks the database.
probes:
  liveness:
    path: /healthz
  readiness:
    path: /readyz
# The service migrates its own schema on start (advisory-locked, so two
# replicas starting together are safe); no db-init job.
envFrom:
  - secretRef:
      name: admins-mctl-support-db-creds
  - secretRef:
      name: admins-mctl-support-model
  - secretRef:
      name: admins-mctl-support-mctl-api
dbSecret:
  vaultPath: teams/admins/mctl-support/database
  secretName: admins-mctl-support-db-creds
extraContainers: []
# Platform-scoped Vault paths, so the cluster store; a tenant store only
# resolves its own team's prefix. Each ExternalSecret reads single
# properties, never a whole path.
extraExternalSecrets:
  # The model provider API key (MODEL_PROVIDER=anthropic).
  admins-mctl-support-model:
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: admins-mctl-support-model
    data:
      - secretKey: ANTHROPIC_API_KEY
        remoteKey: secret/data/platform/mctl-support/model
        property: anthropic-api-key
  # mctl-api credentials of two single-capability principals:
  # - usage writer (append usage records only): the same value mctl-api and
  #   the agent runner pods read (bootstrap/values.yaml usageWriter);
  # - support incident producer (create source=support incidents only): the
  #   same value mctl-api reads (bootstrap/values.yaml
  #   supportIncidentProducer).
  admins-mctl-support-mctl-api:
    store: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1h
    targetSecret: admins-mctl-support-mctl-api
    data:
      - secretKey: SUPPORT_USAGE_WRITER_TOKEN
        remoteKey: secret/data/platform/mctl-agents
        property: usage-writer-token
      - secretKey: SUPPORT_INCIDENT_PRODUCER_TOKEN
        remoteKey: secret/data/platform/mctl-support/incident-producer
        property: token
