# Service: mctl-docs
# Team: admins

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-docs
  tag: "0.1.54"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 80
  # nginx-unprivileged listens on 8080. The Service and Ingress stay on 80
  # and reach it through the named targetPort; changing port itself on a
  # live Service fails to apply (gitops#1933).
  containerPort: 8080
backstage:
  kubernetesId: mctl-docs
# nginx-unprivileged runs as uid/gid 101. Pinned here so kubelet and the
# deploy-time image-user check can verify runAsNonRoot without reading the
# image; the rest comes from the chart's step-2 defaults.
containerSecurityContext:
  runAsUser: 101
  runAsGroup: 101
resources:
  # Right-sized 2026-08-03: static site, p95 0.19m/max 0.77m CPU, 14.6MB/
  # 15.1MB mem over 24h — was still at untouched chart defaults.
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 150m
    memory: 256Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - docs.mctl.ai
    - admins-mctl-docs.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-docs-tls
      hosts:
        - docs.mctl.ai
        - admins-mctl-docs.mctl.ai
extraContainers: []
