# Service: mctl-docs
# Team: admins

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-docs
  tag: "0.1.27"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 80
backstage:
  kubernetesId: mctl-docs
resources:
  # Right-sized 2026-08-03: static site, p95 0.19m/max 0.77m CPU, 14.6MB/
  # 15.1MB mem over 24h — was still at untouched chart defaults.
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 150m
    memory: 256Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - docs.mctl.ai
    - admins-mctl-docs.mctl.ai
    - admins-mctl-docs.mctl.me
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-docs-tls
      hosts:
        - docs.mctl.ai
        - admins-mctl-docs.mctl.ai
        - admins-mctl-docs.mctl.me
extraContainers: []
