# Worker: mctl-agents-worker
# Team: admins
# Chart: base-service (ingress disabled)
#
# Temporal worker for the dev-workflow control plane (plan phase 4):
# DevLoopWorkflow (issue -> investigate -> approve -> implement) plus its
# activities (resolve_agent_release, submit_and_wait, record_execution).
# Rides the same ghcr.io/mctlhq/mctl-agents image every CWFT already uses,
# with a different command — no separate build. Unlike kuptsi-app's
# temporal-worker (a sibling container on an HTTP service), this is a
# standalone Deployment: nothing here serves inbound traffic, so there is
# no main container to ride alongside.
#
# orchestrator/temporal/ shipped in mctl-agents PR #105, first released in
# 1.22.0 — replicaCount and image.tag bumped together in the same commit,
# per the crash-loop warning this comment used to carry (module doesn't
# exist before 1.22.0, so splitting the two edits would crash-loop the pod
# in the window between them).
#
# This tag is bumped by hand. `chore: bump admins/mctl-agents to <x>` (the
# automated bump) only rewrites the six CWFT image params in
# argo-workflows/cluster-templates/ — it does not touch this file, so the
# worker silently stays behind until someone edits it here.
replicaCount: 1
image:
  repository: ghcr.io/mctlhq/mctl-agents
  tag: "1.35.0"
imagePullSecrets:
  - name: ghcr-credentials
command: ["python", "-m", "orchestrator.temporal.worker"]
ingress:
  enabled: false
# The chart's own values.yaml defaults probes.liveness/readiness to
# httpGet /healthz and /readyz — fine for an HTTP service, fatal here: this
# worker is a pure asyncio process with no HTTP server at all, so an
# inherited default would CrashLoopBackOff it against a port nothing
# listens on. Helm deep-merges values.yaml files, so `probes: {}` merges
# nothing away and the chart defaults survive untouched (verified via `helm
# template`) — each leaf must be nulled individually instead. `probes:
# null` outright (tried first) also fails: the deployment template
# dereferences .Values.probes.startup unconditionally before checking
# truthiness, which errors on a nil .Values.probes even though startup has
# no chart default to begin with.
probes:
  liveness: null
  readiness: null
resources:
  # Light footprint on purpose: this process only polls HTTP endpoints
  # (mctl-api, Temporal frontend) — it never spawns the Claude Code CLI or
  # clones a repo, unlike agent-worker-preview or the Argo CWFT pods.
  #
  # That stopped being true when the incident responder moved into
  # IncidentLoopWorkflow as an in-process activity: it ran a Claude SDK
  # session here, against a pod with no gitops checkout to write proposals
  # into, and was OOMKilled every tick (8 restarts, 2026-08-15). Reverting
  # to an Argo submit (mctl-agents 1.28.2, #180) makes the claim above
  # accurate again — which is why 256Mi stays.
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
automountServiceAccountToken: false
# 1.28.0 is the first tag with USER app (uid 1000) in the image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
env:
  TEMPORAL_ADDRESS: temporal-frontend.temporal.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: mctl-agents
  LOG_LEVEL: info
  # GitHub App installation tokens expire after 60 min. rotate-github-app-tokens
  # mints a fresh one every 30 min into Vault, but env vars are frozen at
  # container start, so a long-lived pod like this one is authenticated for at
  # most an hour and then 401s forever. orchestrator/github_token.py exists for
  # exactly this and re-reads the token before every gh/git subprocess — but
  # only when GITHUB_TOKEN_FILE points at a mounted file, which was never set
  # here. Its docstring assumes issue-poll is a short-lived Argo cron pod whose
  # run "fits inside one token's TTL"; that stopped being true when issue-poll
  # moved into this permanent Temporal worker.
  GITHUB_TOKEN_FILE: /var/run/secrets/github/GITHUB_TOKEN
envFrom:
  - secretRef:
      name: mctl-agents-worker-secrets
# Same Secret, mounted as a file so kubelet keeps it current. envFrom alone
# cannot: a Secret update never propagates into an already-running process's
# environment, only into a projected volume.
extraVolumes:
  - name: github-token
    secret:
      secretName: mctl-agents-worker-secrets
      items:
        - key: GITHUB_TOKEN
          path: GITHUB_TOKEN
extraVolumeMounts:
  - name: github-token
    mountPath: /var/run/secrets/github
    readOnly: true
# MCTL_TOKEN is the same static admin service token the Argo CWFT pods use
# (Vault path secret/platform/mctl-agents, key mctl-token — see
# platform-gitops/argo-workflows/secrets/mctl-agents-secrets.yaml) — this
# worker calls the identical mctl-api operations-execute / workflows /
# agents endpoints those pods' orchestrator code calls, just from a
# long-running process instead of a per-run Argo pod.
externalSecret:
  # Platform-scoped paths — must use the cluster store; tenant-store only
  # resolves secret/data/teams/admins/*.
  store: vault-backend
  storeKind: ClusterSecretStore
  # 15m, not the 1h default: the GitHub App token this syncs lives 60 min, so
  # an hourly refresh gives the mounted file zero margin — it could serve an
  # already-expired token right up to the next sync.
  refreshInterval: 15m
  targetSecret: mctl-agents-worker-secrets
  data:
    - secretKey: MCTL_TOKEN
      remoteKey: platform/mctl-agents
      property: mctl-token
    # The Claude Agent SDK authenticates from CLAUDE_CODE_OAUTH_TOKEN. Without
    # it every agent run inside this worker ends as
    # 'Not logged in · Please run /login' (apiKeySource: none) — observed on
    # every incident-responder tick, and independent of the GitHub token fix
    # above. The Argo CronWorkflow pods have always read this key from the same
    # Vault path via mctl-agents-secrets in the argo-workflows namespace; the
    # wiring was simply never added when issue-poll moved into this worker.
    #
    # Delivered via envFrom, so a rotation needs a pod restart to take effect.
    # That is acceptable here (unlike the 60-min GitHub App token that needed
    # GITHUB_TOKEN_FILE): this is a long-lived Pro/Max OAuth token, rotated by
    # hand, not on a schedule.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteKey: platform/mctl-agents
      property: claude-code-oauth-token
    - secretKey: GITHUB_TOKEN
      remoteKey: platform/mctl-agent/tokens
      property: github-token
    # No GH_TOKEN here on purpose. The gh CLI gives GH_TOKEN precedence over
    # GITHUB_TOKEN (verified in-pod: with both set, `gh auth status` reports
    # "The token in GH_TOKEN is invalid"), so a frozen GH_TOKEN from pod start
    # would shadow the GITHUB_TOKEN that github_token.py keeps refreshing and
    # defeat the whole mechanism above. Nothing in orchestrator/ reads GH_TOKEN
    # by name — gh picks up GITHUB_TOKEN on its own.
