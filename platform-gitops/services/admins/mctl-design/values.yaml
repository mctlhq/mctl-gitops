# Service: mctl-design
# Team: admins

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-design
  tag: "6b82efc7081c"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 80
backstage:
  kubernetesId: mctl-design
resources:
  # Right-sized 2026-08-03: static site, p95 0.17m/max 0.2m CPU, 8.4MB/8.6MB
  # mem over 24h — was still at untouched chart defaults.
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 150m
    memory: 256Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - ui.mctl.ai
    - admins-mctl-design.mctl.ai
    - admins-mctl-design.mctl.me
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-design-tls
      hosts:
        - ui.mctl.ai
        - admins-mctl-design.mctl.ai
        - admins-mctl-design.mctl.me
extraContainers: []
