# Service: mctl-design
# Team: admins

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-design
  tag: "23aa2723a651"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 80
backstage:
  kubernetesId: mctl-design
# nginx starts as root, chowns its cache directories and switches its
# workers to the `nginx` user, so it needs these capabilities back on top of
# the chart's `drop: [ALL]`; NET_BIND_SERVICE is for port 80. Lists replace
# rather than merge, hence `drop` is repeated. Remove this override when the
# image moves to nginx-unprivileged (base-service hardening, step 2).
containerSecurityContext:
  capabilities:
    drop: [ALL]
    add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
  # Root image: opted out of the chart's step-2 default until it moves to
  # nginx-unprivileged, together with the capabilities above.
  runAsNonRoot: false
  readOnlyRootFilesystem: false
resources:
  # Right-sized 2026-08-03: static site, p95 0.17m/max 0.2m CPU, 8.4MB/8.6MB
  # mem over 24h — was still at untouched chart defaults.
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 150m
    memory: 256Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - ui.mctl.ai
    - admins-mctl-design.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-design-tls
      hosts:
        - ui.mctl.ai
        - admins-mctl-design.mctl.ai
extraContainers: []
