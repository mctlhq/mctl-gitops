# Service: mctl-academy
# Team: ovk

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/mctl-academy
  tag: "0.1.0"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: mctl-academy
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
ingress:
  enabled: true
  hosts:
    - ovk-mctl-academy.mctl.ai
    - ovk-mctl-academy.mctl.me
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: mctl-academy-tls
      hosts:
        - ovk-mctl-academy.mctl.ai
        - ovk-mctl-academy.mctl.me
