# Service: draw-with-friends
# Team: karabu

# Chart: base-service

image:
  repository: ghcr.io/mctlhq/draw-with-friends
  tag: "0.2.0"
imagePullSecrets:
  - name: ghcr-credentials
service:
  port: 8080
backstage:
  kubernetesId: draw-with-friends
# Non-root on a read-only root filesystem (base-service hardening, step 2).
# runAsNonRoot is checked by kubelet against a numeric user only, so the
# ids this image already runs as are pinned (observed 2026-10-16); the
# chart's writablePaths gives it a writable /tmp.
podSecurityContext:
  runAsUser: 100
  runAsGroup: 101
containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
# Memory lowered 2026-10-20: 7d peak working set 48Mi. The old 256Mi request
# took half of karabu's 512Mi requests quota, so a second replica or a
# rollout surge left no room for a deploy workflow.
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
env:
  APP_ENV: production
  NODE_ENV: production
  INVITE_HINT: "true"
ingress:
  enabled: true
  hosts:
    - karabu-draw-with-friends.mctl.ai
    - draw-with-friends.mctl.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: draw-with-friends-tls
      hosts:
        - karabu-draw-with-friends.mctl.ai
        - draw-with-friends.mctl.ai
envFrom:
  - secretRef:
      name: karabu-draw-with-friends-db-creds
  - secretRef:
      name: draw-with-friends-secrets
dbSecret:
  vaultPath: teams/karabu/draw-with-friends/database
  secretName: karabu-draw-with-friends-db-creds
externalSecret:
  targetSecret: draw-with-friends-secrets
  data:
    - secretKey: SESSION_SECRET
      remoteKey: teams/karabu/draw-with-friends
      property: SESSION_SECRET
    - secretKey: INVITE_CODE
      remoteKey: teams/karabu/draw-with-friends
      property: INVITE_CODE
extraContainers: []
