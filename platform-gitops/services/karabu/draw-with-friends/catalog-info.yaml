apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: draw-with-friends
  namespace: karabu
  description: "draw-with-friends service"
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=karabu-draw-with-friends
    backstage.io/kubernetes-id: draw-with-friends
    backstage.io/kubernetes-namespace: karabu
    argocd/app-name: karabu-draw-with-friends
    github.com/source-repo: EmiliiaMashkova/draw-with-friends
    # mctl.me/auto-deploy — triggered by GitHub App webhook on tag push
    #   "true" or "auto" — deploy immediately via scaffolder
    #   "confirm"         — notify only, user deploys manually from UI
    #   "false" or absent — skip
    mctl.me/auto-deploy: "false"
  links:
    - url: https://ops.mctl.ai/applications/argocd/karabu-draw-with-friends
      title: ArgoCD
      icon: dashboard
    - url: https://github.com/EmiliiaMashkova/draw-with-friends
      title: Source Repository
      icon: github
    - url: https://workflows.mctl.ai
      title: Argo Workflows
      icon: github
    - url: https://karabu-draw-with-friends.mctl.ai
      title: Service URL
      icon: web
  labels:
    team: karabu
    env: apps
spec:
  type: service
  lifecycle: production
  owner: group:default/karabu
  system: system:default/team-karabu
