{{- /*
  The kubernetes state backend lists Secrets and Leases by label, and list
  cannot be narrowed by resourceNames, so this Role can read every Secret in
  this namespace. That is why the Job has a namespace of its own rather than
  `vault`, which holds the unseal keys. What else lives here: the OIDC client
  it already reads, the image pull credentials, and the Secrets Reflector
  copies into every namespace (github-actions-pat, postgres-credentials and
  others; mctl-gitops#1230), which anything allowed to read Secrets in any
  namespace can read today. Its Vault access comes from auth/kubernetes, not from anything
  stored here.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-human-auth-iac
  labels:
    app.kubernetes.io/name: vault-human-auth-iac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-human-auth-iac-state
  labels:
    app.kubernetes.io/name: vault-human-auth-iac
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-human-auth-iac-state
  labels:
    app.kubernetes.io/name: vault-human-auth-iac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-human-auth-iac-state
subjects:
  - kind: ServiceAccount
    name: vault-human-auth-iac
    namespace: {{ .Release.Namespace }}
