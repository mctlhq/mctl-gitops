{{- $_ := required "image.digest is required: pin the vault-iac image by digest" .Values.image.digest -}}
{{- /*
  The same run as the PostSync Job, hourly. The tenant list and the OIDC
  client arrive in a Secret zitadel-iac writes, which ArgoCD never diffs, so
  without this a new tenant would wait for an unrelated sync.
  Runs never overlap (Forbid), and the state Lease serialises a run against
  the PostSync Job.
*/ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-human-auth-iac
  labels:
    app.kubernetes.io/name: vault-human-auth-iac
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-human-auth-iac
        spec:
          {{- include "vault-human-auth-iac.podSpec" . | nindent 10 }}
