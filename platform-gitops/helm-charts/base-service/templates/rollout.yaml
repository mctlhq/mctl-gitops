{{- if .Values.blueGreen.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "base-service.fullname" . }}
  annotations:
    # Switching blueGreen off removes this object from the rendered chart
    # while the Deployment that replaces it is added. Without PruneLast,
    # ArgoCD prunes in the same wave it creates, so the Rollout's pod and
    # this Service's endpoints go away before the Deployment's pod is
    # Ready. PruneLast defers the prune until the rest of the sync is
    # healthy. ArgoCD reads it from the live object, so it must be here
    # before the switch, not added with it.
    argocd.argoproj.io/sync-options: PruneLast=true
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
    {{- include "base-service.extraLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 2 }}
  selector:
    matchLabels:
      {{- include "base-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.configMaps .Values.podAnnotations }}
      annotations:
        {{- if .Values.configMaps }}
        # See deployment.yaml's identical annotation for why this is needed
        # (subPath ConfigMap mounts don't live-update in a running pod).
        checksum/config-maps: {{ .Values.configMaps | toYaml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "base-service.selectorLabels" . | nindent 8 }}
        {{- include "base-service.extraLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- include "base-service.podLabels" . | nindent 8 }}
        {{- end }}
    spec:
      {{- if ne (.Values.automountServiceAccountToken | toString) "<nil>" }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "base-service.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $writable := include "base-service.writablePaths" . | fromJsonArray }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- include "base-service.hardenedContainers" (dict "containers" . "defaults" $.Values.extraContainerSecurityContext) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be pinned per service (semver or @sha256 digest)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.preStopSleepSeconds }}
          {{- $grace := $.Values.terminationGracePeriodSeconds | default 30 }}
          {{- if ge (int .) (int $grace) }}
          {{- fail (printf "preStopSleepSeconds (%v) must be below terminationGracePeriodSeconds (%v)" . $grace) }}
          {{- end }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort | default .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.probes.startup }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.probes.startup.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold | default 30 }}
          {{- end }}
          {{- if .Values.probes.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.env .Values.envValueFrom .Values.otel.enabled (default dict .Values.workContext).enabled }}
          env:
            {{- include "base-service.env" . | trim | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.extraVolumeMounts $writable }}
          volumeMounts:
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- range $writable }}
            - name: {{ include "base-service.writableVolumeName" . }}
              mountPath: {{ . }}
            {{- end }}
          {{- end }}
        {{- with .Values.extraContainers }}
        {{- include "base-service.hardenedContainers" (dict "containers" . "defaults" $.Values.extraContainerSecurityContext) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.extraVolumes .Values.persistence $writable }}
      volumes:
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- range $writable }}
        - name: {{ include "base-service.writableVolumeName" . }}
          emptyDir: {}
        {{- end }}
        {{- range $name, $spec := .Values.persistence }}
        {{- if (ne $spec.enabled false) }}
        - name: pvc-{{ $name }}
          persistentVolumeClaim:
            claimName: {{ include "base-service.fullname" $ }}-{{ $name }}
        {{- end }}
        {{- end }}
      {{- end }}
  strategy:
    blueGreen:
      activeService: {{ include "base-service.fullname" . }}
      previewService: {{ include "base-service.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      # Keep the old ReplicaSet for 30s after promotion so endpoints can
      # drain. There is no pre-promotion analysis: a preview pod that never
      # becomes Ready just stalls the rollout, nothing aborts it.
      scaleDownDelaySeconds: 30
{{- end }}
