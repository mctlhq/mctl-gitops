{{- if .Values.dbSecret }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "base-service.fullname" . }}-db-creds
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.dbSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.dbSecret.store | default "vault-backend" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecret.secretName | default (printf "%s-db-creds" (include "base-service.fullname" .)) }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ "{{ .username }}" }}:{{ "{{ .password }}" }}@{{ "{{ .host }}" }}:{{ "{{ .port }}" }}/{{ "{{ .database }}" }}"
        DB_HOST: '{{ "{{ .host }}" }}'
        DB_PORT: '{{ "{{ .port }}" }}'
        DB_NAME: '{{ "{{ .database }}" }}'
        DB_USER: '{{ "{{ .username }}" }}'
        DB_PASSWORD: '{{ "{{ .password }}" }}'
        username: '{{ "{{ .username }}" }}'
        password: '{{ "{{ .password }}" }}'
  {{- /* conversionStrategy / decodingStrategy / metadataPolicy below are
      ESO's own CRD defaults, spelled out on purpose: ignoring them instead
      via a `.spec.data[].remoteRef.*` jq path is what wedges an Application
      under ServerSideApply + RespectIgnoreDifferences — the array can then
      never shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO
      version pinned in bootstrap core-infra/external-secrets.yaml. */}}
  data:
    - secretKey: host
      remoteRef:
        key: {{ .Values.dbSecret.vaultPath }}
        property: host
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: port
      remoteRef:
        key: {{ .Values.dbSecret.vaultPath }}
        property: port
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: database
      remoteRef:
        key: {{ .Values.dbSecret.vaultPath }}
        property: database
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: username
      remoteRef:
        key: {{ .Values.dbSecret.vaultPath }}
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: {{ .Values.dbSecret.vaultPath }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
