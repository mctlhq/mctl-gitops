{{- /* serviceMonitor: false keeps the metrics port but renders no
    monitoring.coreos.com ServiceMonitor, which the VM operator converts and
    ArgoCD then reports as drift; scrape with a native VMServiceScrape instead. */}}
{{- if and .Values.metrics.enabled (ne (toString .Values.metrics.serviceMonitor) "false") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "base-service.fullname" . }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
    {{- include "base-service.extraLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "base-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.interval }}
{{- end }}
