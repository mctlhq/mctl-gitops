{{- if .Values.registryCredentials }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "base-service.fullname" . }}-registry
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.registryCredentials.refreshInterval | default "24h" }}
  secretStoreRef:
    name: {{ .Values.registryCredentials.store | default "vault-backend" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.registryCredentials.secretName | default (printf "%s-registry" (include "base-service.fullname" .)) }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ "{{ .dockerconfigjson }}" }}"
  {{- /* conversionStrategy / decodingStrategy / metadataPolicy below are
      ESO's own CRD defaults, spelled out on purpose: ignoring them instead
      via a `.spec.data[].remoteRef.*` jq path is what wedges an Application
      under ServerSideApply + RespectIgnoreDifferences — the array can then
      never shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO
      version pinned in bootstrap core-infra/external-secrets.yaml. */}}
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.registryCredentials.vaultKey }}
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
