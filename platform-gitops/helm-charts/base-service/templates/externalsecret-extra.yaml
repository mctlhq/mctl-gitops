{{- range $name, $es := .Values.extraExternalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "base-service.labels" $ | nindent 4 }}
  {{- with $es.annotations }}
  annotations:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    {{- include "base-service.secretStoreRef" (dict "store" $es.store "kind" $es.storeKind) | nindent 4 }}
  target:
    name: {{ $es.targetSecret | default $name }}
    creationPolicy: Owner
    {{- if or $es.targetTemplateType $es.targetTemplateMetadataAnnotations }}
    template:
      {{- if $es.targetTemplateType }}
      type: {{ $es.targetTemplateType }}
      {{- end }}
      {{- if $es.targetTemplateMetadataAnnotations }}
      metadata:
        annotations:
          {{- range $k, $v := $es.targetTemplateMetadataAnnotations }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
      {{- end }}
    {{- end }}
  {{- /* conversionStrategy / decodingStrategy / metadataPolicy below are
      ESO's own CRD defaults, spelled out on purpose: ignoring them instead
      via a `.spec.data[].remoteRef.*` jq path is what wedges an Application
      under ServerSideApply + RespectIgnoreDifferences — the array can then
      never shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO
      version pinned in bootstrap core-infra/external-secrets.yaml. */}}
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        property: {{ .property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
