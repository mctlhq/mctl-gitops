{{- range $name, $es := .Values.extraExternalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "base-service.labels" $ | nindent 4 }}
  {{- with $es.annotations }}
  annotations:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    {{- include "base-service.secretStoreRef" (dict "store" $es.store "kind" $es.storeKind) | nindent 4 }}
  target:
    name: {{ $es.targetSecret | default $name }}
    creationPolicy: Owner
    {{- if or $es.targetTemplateType $es.targetTemplateMetadataAnnotations }}
    template:
      {{- /* A service-account-token target makes ESO mint a Secret the API server
          then fills with a long-lived token for whatever ServiceAccount is named
          — the operator's privilege, not the requester's (CVE-2026-42876, fixed
          in ESO >= 2.4.1 which needs k8s >= 1.34; this cluster is on 1.33).
          targetTemplateType is reachable from a caller-supplied config_patch via
          update-config, so this is refused at render time as well as at
          admission. Mount tokens through a Pod's serviceAccountName instead. */}}
      {{- if eq ($es.targetTemplateType | default "" | toString) "kubernetes.io/service-account-token" }}
      {{- fail (printf "extraExternalSecrets.%s: targetTemplateType kubernetes.io/service-account-token is not allowed (CVE-2026-42876)" $name) }}
      {{- end }}
      {{- if $es.targetTemplateType }}
      type: {{ $es.targetTemplateType }}
      {{- end }}
      {{- if $es.targetTemplateMetadataAnnotations }}
      metadata:
        annotations:
          {{- range $k, $v := $es.targetTemplateMetadataAnnotations }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
      {{- end }}
    {{- end }}
  {{- /* conversionStrategy / decodingStrategy / metadataPolicy below are
      ESO's own CRD defaults, spelled out on purpose: ignoring them instead
      via a `.spec.data[].remoteRef.*` jq path is what wedges an Application
      under ServerSideApply + RespectIgnoreDifferences — the array can then
      never shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO
      version pinned in bootstrap core-infra/external-secrets.yaml. */}}
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        property: {{ .property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
