{{- if (default dict .Values.workContext).enabled }}
{{- if not .Values.workContext.tokenVaultKey }}
{{- fail "workContext.enabled is true but workContext.tokenVaultKey is empty -- set it to the Vault path carrying the surface:telegram token (e.g. secret/data/platform/mctl-api/surface-tokens)" }}
{{- end }}
{{- if not .Values.workContext.tokenVaultProperty }}
{{- fail "workContext.enabled is true but workContext.tokenVaultProperty is empty -- set it to the Vault property carrying the surface:telegram token (e.g. telegram-token)" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "base-service.workContextSecretName" . }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.workContext.refreshInterval | default "1h" }}
  secretStoreRef:
    {{- include "base-service.secretStoreRef" (dict "store" .Values.workContext.store "kind" .Values.workContext.storeKind) | nindent 4 }}
  target:
    name: {{ include "base-service.workContextSecretName" . }}
    creationPolicy: Owner
  {{- /* conversionStrategy / decodingStrategy / metadataPolicy below are
      ESO's own CRD defaults, spelled out on purpose: ignoring them instead
      via a `.spec.data[].remoteRef.*` jq path is what wedges an Application
      under ServerSideApply + RespectIgnoreDifferences -- the array can then
      never shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO
      version pinned in bootstrap core-infra/external-secrets.yaml. */}}
  data:
    - secretKey: {{ .Values.workContext.tokenEnvName | default "MCTL_SURFACE_TELEGRAM_TOKEN" }}
      remoteRef:
        key: {{ .Values.workContext.tokenVaultKey }}
        property: {{ .Values.workContext.tokenVaultProperty }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
