{{- /*
Render arbitrary extra manifests supplied per-service in .Values.extraObjects.

Optional per-object key `renderIf`: a template string evaluated against the
root context ($). The object is rendered ONLY when that string renders to
exactly "true" (after trimming whitespace); ANY other result — "false", "",
"1", "yes", a non-match — is treated as false and the object is skipped. This
is intentionally dumb: no truthy coercion, so behaviour stays predictable.
Objects WITHOUT a `renderIf` key always render (backward compatible). The
`renderIf` key itself is stripped from the emitted manifest.

Example (gate a CronJob on an env flag):
  extraObjects:
    - renderIf: '{{ eq (.Values.env.MY_FLAG | toString) "true" }}'
      apiVersion: batch/v1
      kind: CronJob
      ...
*/ -}}
{{- range $obj := .Values.extraObjects }}
{{- $cond := "" }}
{{- if hasKey $obj "renderIf" }}{{- $cond = $obj.renderIf }}{{- end }}
{{- if or (not $cond) (eq (tpl ($cond | toString) $ | trim) "true") }}
{{- $rendered := tpl (toYaml (omit $obj "renderIf")) $ }}
{{- /* Same guard as base-service.podLabels, applied to the arbitrary manifests
    this template emits. Without it the podLabels check is trivially sidestepped:
    an extraObject can be a Pod or Deployment whose template carries
    workflows.argoproj.io/workflow, and the forged pod then matches the
    NetworkPolicy exceptions meant for Argo-created pods. Matching the rendered
    text rather than a specific field keeps selectors, annotations and nested
    pod templates covered. No current service references the prefix, so this
    rejects only new attempts. */}}
{{- if regexMatch "workflows\\.argoproj\\.io/" $rendered }}
{{- fail "extraObjects may not reference workflows.argoproj.io/*: that label gates NetworkPolicy exceptions for Argo-created pods" }}
{{- end }}
{{- /* Confine extra objects to the release namespace. The apps AppProject sets
    destinations.namespace: "*" and whitelists networking.k8s.io/*, so without
    this an extraObject could be a NetworkPolicy carrying
    metadata.namespace: vault — and because NetworkPolicies are additive, a
    permissive ingress rule there would override the platform allowlists
    entirely, no label forgery needed. An object that omits the namespace
    lands in the release namespace, which is the normal case. */}}
{{- $objNs := (get ((fromYaml $rendered) | default dict) "metadata" | default dict) }}
{{- $objNs = get $objNs "namespace" | default "" }}
{{- if and $objNs (ne ($objNs | toString) $.Release.Namespace) }}
{{- fail (printf "extraObjects may not target namespace %q (release namespace is %q): cross-namespace objects can relax platform NetworkPolicies" ($objNs | toString) $.Release.Namespace) }}
{{- end }}
---
{{ $rendered }}
{{- end }}
{{- end }}
