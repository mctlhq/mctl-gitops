{{- $image := required "image.digest is required: pin the zitadel-iac image by digest" .Values.image.digest -}}
{{- /*
  The same run as the PostSync Job, hourly. Users are added in Vault, which
  ArgoCD never diffs, so without this they would wait for an unrelated sync.
  Runs never overlap (Forbid), and the state Lease serialises a run against
  the PostSync Job.
*/ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zitadel-iac
  labels:
    app.kubernetes.io/name: zitadel-iac
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zitadel-iac
        spec:
          {{- include "zitadel-iac.podSpec" . | nindent 10 }}
