{{- /*
  The kubernetes state backend lists Secrets and Leases by label, and list
  cannot be narrowed by resourceNames, so this Role can read every Secret in
  the zitadel namespace, the masterkey included. That is not an escalation:
  whoever can change this Job can already change the ZITADEL Deployment that
  mounts the masterkey, and the System API key this Job holds is IAM_OWNER.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-iac
  labels:
    app.kubernetes.io/name: zitadel-iac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-iac-state
  labels:
    app.kubernetes.io/name: zitadel-iac
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-iac-state
  labels:
    app.kubernetes.io/name: zitadel-iac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-iac-state
subjects:
  - kind: ServiceAccount
    name: zitadel-iac
