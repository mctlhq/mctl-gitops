{{- $image := required "image.digest is required: pin the zitadel-iac image by digest" .Values.image.digest -}}
{{- /*
  Applies iac/ after every sync of the zitadel Application, once ZITADEL is
  up (PostSync). The plan is checked before apply: any action outside
  .Values.allowedActions fails the Job, and the plan is in its log. A plan
  with no changes exits without applying. The pod is in _pod.tpl.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-iac
  labels:
    app.kubernetes.io/name: zitadel-iac
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-iac
    spec:
      {{- include "zitadel-iac.podSpec" . | nindent 6 }}
