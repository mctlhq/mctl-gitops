# Rendered as the third source of the `zitadel` Application
# (bootstrap/templates/core-infra/zitadel.yaml), into the zitadel namespace.

image:
  # Built from platform-gitops/images/zitadel-iac by build-image.yaml; pinned
  # by digest, so a re-pushed tag can never change what applies identity.
  repository: ghcr.io/mctlhq/zitadel-iac
  tag: "1.13.1-3.8.7-3.3.0"
  # build-image.yaml run 37161742223, from 9335d152 (#1528).
  digest: "sha256:2178588a9f1a8f1d269cfc1b134606e9155802a39a6e30b299a16e782fed6cf4"

# The plan actions the Job may apply, space-separated. A plan containing any
# other action fails the Job before apply, with the plan in its log.
#   S1 (import only): "no-op read". Imports are planned as no-op.
#   S2 (passkey-only login policy): adds "update".
#   S3 (SMTP, tenant orgs and users): adds "create".
#   S4 (Forgejo OIDC application): no new action; its project, application
#   and the data of forgejo/forgejo-oidc-zitadel are creates.
#   #1500 (Argo CD OIDC applications, roles, grants, groups action): no new
#   action; all creates, plus a read of the admin user lookup.
#   mctl-api#434 (mctl-api project, API application, the data of
#   mctl-api/mctl-api-oidc-zitadel): no new action; all creates.
#   mctl-api#434 `mctl` CLI client: a create, plus in-place updates of the
#   MCTL API project (has_project_check) and of the data of
#   mctl-api/mctl-api-oidc-zitadel.
#   #1500 step 3 (Cloudflare Access public client, its project, role, grant
#   and zitadel/cloudflare-access-oidc): no new action; all creates, plus a
#   read of the user lookup.
#   Vault human sign-in (Vault project, roles, grants, OIDC application, the
#   data of vault-human-auth-iac/vault-oidc-zitadel): no new action; all
#   creates, plus an in-place update of the groups action's script.
#   #1501 (ERPact project, Frappe OIDC application, verified e-mail action,
#   the data of erpact/erpact-oidc-zitadel): no new action; creates, plus an
#   in-place update of the erpact organization's userinfo trigger.
#   Argo Workflows sign-in (workflows.tf: project, roles, grants, OIDC
#   application, the data of argo-workflows/argo-workflows-sso-zitadel): no
#   new action; all creates, plus an in-place update of the groups action's
#   script.
#   Grafana sign-in (grafana.tf: project, admin role and grants, OIDC
#   application, the data of monitoring/grafana-oidc-zitadel): no new
#   action; all creates, plus an in-place update of the groups action's
#   script.
#   Grafana sign-out (grafana.tf: a second post-logout URI and the
#   signout-redirect-url key of monitoring/grafana-oidc-zitadel): no new
#   action; in-place updates.
#   Platform admins (admins.tf: personal MCTL users from Vault
#   secret/platform/zitadel/admins, and their Argo CD, Vault and Cloudflare
#   Access grants): no new action; all creates. Removing an admin from Vault
#   plans deletes, which allowedDeletes refuses until the addresses are listed.
#   mctl-api#435 (identity link web client in the MCTL API project): a
#   create, plus an in-place update of the data of mctl-api/mctl-api-oidc-zitadel.
#   Login V2 texts (login_texts.tf: one default hosted login translation per
#   language, 15): no new action; all creates. Removing a language from
#   login_texts.json plans a destroy, which allowedDeletes refuses until the
#   address is listed.
#   ERPact access for platform admins (erpact.tf: Frappe role, project grant
#   to MCTL, user grants, the verified e-mail action in the MCTL
#   organization): no new action; creates, plus in-place updates of the
#   erpact-frappe redirect URIs, of erpact/erpact-oidc-zitadel and of the
#   MCTL organization's userinfo trigger. The action's address move is a
#   no-op.
#   GitHub login claim (github-login.tf: the mctlGithubLogin action in each
#   organization, and user metadata for users whose Vault entry declares
#   github_login): no new action; creates, plus in-place updates of every
#   organization's userinfo trigger; adding or changing a login later updates
#   the metadata and the action in place. Dropping a user's github_login plans a
#   delete of its metadata, which allowedDeletes refuses until listed.
#   Tenant access to MCTL API (mctl-api.tf: one project grant per tenant
#   organization, no role keys): no new action; all creates. Removing a
#   tenant plans a destroy of its grant, which allowedDeletes refuses until
#   the address is listed.
#   mctl-api#467 (mctl-api.tf: the mctl-api-oauth web client of
#   /oauth/authorize's ZITADEL upstream, in the MCTL API project): no new
#   action; a create, plus an in-place update of the data of
#   mctl-api/mctl-api-oidc-zitadel (two keys added).
#   Labs apps sign-in (labs-apps.tf: a project and an OIDC application each
#   for coolify-mcp and mctl-academy, one grant of each project per tenant
#   organization with no role keys, the data of labs/coolify-mcp-oidc-zitadel
#   and labs/mctl-academy-oidc-zitadel): no new action; all creates. Removing
#   a tenant plans a destroy of its two grants, which allowedDeletes refuses
#   until the addresses are listed.
# Widen deliberately, in the PR that needs it. "delete" is never an action
# class here; deletes are allowed per address in allowedDeletes below.
allowedActions: "no-op read update create"

# Resource addresses the Job may destroy or replace, space-separated. Any
# other delete in a plan fails the Job. Name the exact address, in the PR
# that needs it, and empty the list once it has applied.
#   (#1533 listed zitadel_email_provider_smtp.resend for the SMTP port move;
#   applied 2026-10-04, emptied again here.)
allowedDeletes: ""

# The CronJob's schedule. Users come from Vault, which no sync observes, so
# this is how a user added there reaches ZITADEL.
schedule: "17 * * * *"
