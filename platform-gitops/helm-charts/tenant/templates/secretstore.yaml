{{- if .Values.tenant.secretStore.enabled }}
{{- $tenantName := include "tenant.name" . }}
{{- $namespaces := list }}
{{- if .Values.tenant.teams }}
  {{- range .Values.tenant.teams }}
    {{- $namespaces = append $namespaces (printf "%s-%s" $tenantName .name) }}
  {{- end }}
{{- else }}
  {{- $namespaces = append $namespaces $tenantName }}
{{- end }}
{{- $store := .Values.tenant.secretStore }}
{{- range $ns := $namespaces }}
---
# ServiceAccount whose token the namespaced SecretStore presents to Vault.
# Bound in Vault to role eso-tenant-{tenant} via bound_service_account_namespaces,
# so a token minted in another namespace cannot assume this tenant's role even if
# the SA name is identical.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $store.serviceAccountName }}
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
---
# Tenant-scoped Vault store.
#
# This is a namespaced SecretStore rather than a ClusterSecretStore on purpose:
# a ClusterSecretStore is usable from every namespace and authenticates as the
# ESO controller's own ServiceAccount, so any tenant could name another tenant's
# remoteRef.key and have ESO fetch it. Vault-side scoping does the real work —
# role eso-tenant-{tenant} only reads secret/data/teams/{tenant}/*
# (vault-policy-tenant-eso.hcl.tmpl). Both halves are required; the store alone
# is not a boundary.
#
# path/version must match the ClusterSecretStore, otherwise every existing
# remoteRef.key in the repo resolves differently under KV v2.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ $store.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $store.server | quote }}
      path: {{ $store.path | quote }}
      version: {{ $store.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ $store.authMountPath | quote }}
          role: {{ printf "eso-tenant-%s" $tenantName | quote }}
          serviceAccountRef:
            name: {{ $store.serviceAccountName }}
{{- end }}
{{- end }}
