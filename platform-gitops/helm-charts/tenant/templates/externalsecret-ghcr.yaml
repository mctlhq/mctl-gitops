{{- if .Values.tenant.ghcrCredentials.enabled }}
{{- $tenantName := include "tenant.name" . }}
{{- $namespaces := list }}
{{- if .Values.tenant.teams }}
  {{- range .Values.tenant.teams }}
    {{- $namespaces = append $namespaces (printf "%s-%s" $tenantName .name) }}
  {{- end }}
{{- else }}
  {{- $namespaces = append $namespaces $tenantName }}
{{- end }}
{{- range $ns := $namespaces }}
---
# GHCR pull credentials, baselined for every tenant namespace.
#
# base-service's Deployment template hardcodes imagePullSecrets:
# [{name: ghcr-credentials}], so every service in this namespace needs this
# Secret to exist regardless of whether the tenant runs openclaw. Tenants
# that already get ghcr-credentials another way (admins via the
# platform-level mctl-agent-ghcr ExternalSecret, labs/ovk via their own
# openclaw values.yaml extraExternalSecrets) MUST set
# tenant.ghcrCredentials.enabled: false — a second Owner ExternalSecret
# targeting the same Secret name fights the first one for ownership
# (see services/admins/openclaw/values.yaml's extraExternalSecrets comment:
# this exact collision held the admins-openclaw Application Degraded for
# 684 reconciliations over 7 days before it was traced and fixed).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      data:
        .dockerconfigjson: "{{ "{{ .dockerconfigjson }}" }}"
  {{- /* conversionStrategy / decodingStrategy / metadataPolicy below are
      ESO's own CRD defaults, spelled out on purpose: ignoring them instead
      via a `.spec.data[].remoteRef.*` jq path is what wedges an Application
      under ServerSideApply + RespectIgnoreDifferences — the array can then
      never shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO
      version pinned in bootstrap core-infra/external-secrets.yaml. */}}
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: platform/backstage/ghcr-credentials
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
{{- end }}
