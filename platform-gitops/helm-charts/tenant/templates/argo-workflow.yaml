{{- $tenantName := include "tenant.name" . }}
{{- /* Build list of namespaces: multi-team → [{tenant}-{team}, ...], legacy → [{tenant}] */}}
{{- $namespaces := list }}
{{- if .Values.tenant.teams }}
  {{- range .Values.tenant.teams }}
    {{- $namespaces = append $namespaces (printf "%s-%s" $tenantName .name) }}
  {{- end }}
{{- else }}
  {{- $namespaces = append $namespaces $tenantName }}
{{- end }}

{{- range $ns := $namespaces }}
# ServiceAccount used by Argo Workflows pods running in this namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow-sa
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
---
# Allow workflow pods to create workflows, read pods/logs/secrets in tenant namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-runner
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtaskresults"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-runner
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: argo-workflow-runner
  apiGroup: rbac.authorization.k8s.io
---
# Namespace-scoped smoke-test permissions: verify deployments, pods, secrets,
# and ExternalSecrets ONLY in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-smoke-verify
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  {{- /* Blanket write was dropped: this Role is also bound to the central
      argo-workflows/argo-workflow-sa in every tenant namespace, so patch/update
      on all ExternalSecrets let one workflow repoint another tenant's secret at
      an arbitrary Vault path. Smoke tests refresh via the ArgoCD app's
      refresh=hard annotation (wft-smoke-test), not by patching. */}}
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch"]
  {{- with $.Values.tenant.externalSecretPatchTargets }}
  {{- /* Named exception for cwft-rotate-github-token, which force-refreshes a
      specific ExternalSecret after minting each 1h GitHub App token. Without a
      patch grant the rotation records the target as failed and mctl-agent waits
      on the normal ESO interval, which can leave it holding an expired token.
      resourceNames keeps this to the listed objects, so it does not restore the
      cross-tenant repointing primitive above. */}}
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: ["patch", "update"]
  {{- end }}
---
# Bind tenant's local workflow SA to smoke-verify Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-smoke-verify
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: argo-workflow-smoke-verify
  apiGroup: rbac.authorization.k8s.io
---
# Bind central workflow SA (argo-workflows ns) to smoke-verify Role in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-smoke-verify-central
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: argo-workflows
roleRef:
  kind: Role
  name: argo-workflow-smoke-verify
  apiGroup: rbac.authorization.k8s.io
---
# SSO RBAC: the team's SSO SA (in argo-workflows ns) may view workflows here,
# never create or change them. Tenant workflows are submitted by the portal
# and mctl-api with their own credentials, after their own team and input
# checks, which a workflow created in the UI would skip. Platform admins keep
# write access through the argo-workflows-admin SA ('admins' in groups,
# argo-workflows/config/sa-and-rbac.yaml).
# Named apart from the old sso-team-workflows binding (argo-workflows-admin)
# because a RoleBinding's roleRef cannot change in place: Argo CD prunes the
# old one and creates this one. argo-workflows-view (get/list/watch on the
# Argo CRDs), like argo-workflows-admin, comes from the upstream
# argo-workflows chart pinned in bootstrap/templates/core-infra/argo-workflows.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sso-team-workflows-view
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sso-team-{{ $tenantName }}
    namespace: argo-workflows
roleRef:
  kind: ClusterRole
  name: argo-workflows-view
  apiGroup: rbac.authorization.k8s.io
---
# SSO RBAC: what the Argo UI needs, as the team's SSO SA, to show a run's
# events and logs. Live logs come from pods/log; archived logs are read from
# the artifact repository with the credentials Secret the controller config
# names (bootstrap core-infra/argo-workflows.yaml artifactRepository), which
# argo-server fetches with the signed-in user's client. That one Secret is all
# it reads: the old binding to the cluster-wide argo-workflows-admin-extra
# gave tenant members get on every Secret here, including the gitops deploy
# key and github-actions-pat the tenant workflows mount. Named apart from the
# old sso-team-logs binding because a roleRef cannot change in place.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sso-team-log-viewer
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["minio-artifact-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sso-team-log-viewer
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sso-team-{{ $tenantName }}
    namespace: argo-workflows
roleRef:
  kind: Role
  name: sso-team-log-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Allow mctl-api to submit and manage workflows in this namespace: create,
# watch, and patch to resume or abort the suspended Workflow of a secret
# handoff (mctl-api internal/operations/executor.go, secret_handoff.go);
# resourcequotas for its quota reads (internal/k8s/quotas.go). Its own Role,
# not argo-workflow-runner: that one is the workflow pods' and carries get on
# every Secret here, which mctl-api never reads (see mctl-api-secret-handoff
# below). Named apart from the old mctl-api-workflow-submitter binding
# because a roleRef cannot change in place.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mctl-api-workflows
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mctl-api-workflows
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: mctl-api
    namespace: mctl-api
roleRef:
  kind: Role
  name: mctl-api-workflows
  apiGroup: rbac.authorization.k8s.io
---
# mctl-api hands secret workflow inputs (deploy-service secret_env_vars) to
# the workflow through a Secret it creates here, owned by the Workflow, so
# the values never become workflow parameters, which are plain data on the
# Workflow object (mctl-api internal/operations/secret_handoff.go,
# tpl-vault-write write-service-secrets-from-secret). create only: it cannot
# read back, change or delete any Secret through this Role, and an existing
# name makes the create fail rather than overwrite.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mctl-api-secret-handoff
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mctl-api-secret-handoff
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: mctl-api
    namespace: mctl-api
roleRef:
  kind: Role
  name: mctl-api-secret-handoff
  apiGroup: rbac.authorization.k8s.io
---
# Helm deploy permissions for preview environments (helm install/uninstall in own namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-helm-deploy
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts", "pods"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-helm-deploy
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: argo-workflow-helm-deploy
  apiGroup: rbac.authorization.k8s.io
---
# Bind CENTRAL workflow SA (argo-workflows ns) to helm-deploy Role for preview workflows.
# The tenant-local binding above targets the per-namespace SA; this one targets the SA
# that actually runs workflow pods (which live in the argo-workflows namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-helm-deploy-central
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: argo-workflows
roleRef:
  kind: Role
  name: argo-workflow-helm-deploy
  apiGroup: rbac.authorization.k8s.io
---
# Artifact repository credentials — required by Argo Workflows argoexec init
# container. Secret name kept as "minio-artifact-credentials" (legacy), but
# points at the Cloudflare R2 bucket used since the 2026-07 migration — see
# argo-workflows/config/vault-auth.yaml for the argo-workflows-namespace copy
# this must stay in sync with. K8s resolves this SecretKeySelector within the
# workflow's own namespace, so every tenant needs its own up-to-date copy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-artifact-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: minio-artifact-credentials
    creationPolicy: Owner
  {{- /* conversionStrategy / decodingStrategy / metadataPolicy below are
      ESO's own CRD defaults, spelled out on purpose: ignoring them instead
      via a `.spec.data[].remoteRef.*` jq path is what wedges an Application
      under ServerSideApply + RespectIgnoreDifferences — the array can then
      never shrink (#789, upstream argo-cd#17694). Keep in sync with the ESO
      version pinned in bootstrap core-infra/external-secrets.yaml. */}}
  data:
    - secretKey: accessKey
      remoteRef:
        key: platform/r2-loki-argo
        property: access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secretKey
      remoteRef:
        key: platform/r2-loki-argo
        property: secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The two credentials the tenant workflows mount: mctl-api submits
# deploy-service, preview-deploy, provision-database and retire-service in the
# team's namespace (operations.WorkflowNamespace), and those clone and push
# mctl-gitops with the deploy key and dispatch build-image.yaml with the token.
# Same Vault paths as the argo-workflows copies in
# argo-workflows/secrets/workflow-credentials.yaml, which documents rotation.
#
# They used to be Reflector copies of the argo-workflows Secrets, limited by a
# namespace list on the source that create-tenant and delete-tenant had to
# keep in step (gitops#1850). Rendered here, a namespace has them exactly
# while its tenant exists, and the tenant app prunes them on delete.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mctl-gitops-deploy-key
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mctl-gitops-deploy-key
    creationPolicy: Owner
  data:
    - secretKey: ssh-privatekey
      remoteRef:
        key: platform/argo-workflows/gitops-deploy-key
        property: ssh-privatekey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-actions-pat
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: github-actions-pat
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/argo-workflows/github-actions-pat
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Allow tenant-local argo-workflow-sa to refresh Argo CD Applications and the
# apps ApplicationSet, and to delete the tenant's own Applications on retire.
# RBAC cannot scope Applications to the tenant's own (team label), so the
# Application verbs stay namespace-wide; the admission policies
# mctl-tenant-workflow-sa-argocd-* (bootstrap system/admission-policies.yaml)
# restrict deletes to owned Applications and updates to refresh annotations.
# list is for deploy-service's `get applications -l team=<ns>`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-argocd-{{ $ns }}
  namespace: argocd
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch", "delete"]
  # Only deploy-service touches an ApplicationSet: a refresh of apps.
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    resourceNames: ["apps"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-argocd-{{ $ns }}
  namespace: argocd
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: argo-workflow-argocd-{{ $ns }}
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
