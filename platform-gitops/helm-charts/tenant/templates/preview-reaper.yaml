{{- if .Values.tenant.preview.enabled }}
{{- $tenantName := include "tenant.name" . }}
# Hourly TTL enforcement for {{ $tenantName }}-preview. Lives in the tenant
# namespace and runs as its argo-workflow-sa, the one SA bound to
# argo-workflow-helm-deploy in the preview namespace (preview.yaml). A single
# central reaper would need Helm rights in every tenant's preview namespace,
# i.e. write access to all their preview secrets, which gitops#1969 removed.
# The steps are in ClusterWorkflowTemplate preview-reaper: the controller
# runs with templateReferencing: Strict.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: preview-reaper
  namespace: {{ $tenantName }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  schedule: "17 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: preview-reaper
      clusterScope: true
{{- end }}
