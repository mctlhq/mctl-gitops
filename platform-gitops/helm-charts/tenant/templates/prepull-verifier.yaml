{{- /*
Read-only identity of the base-service pre-pull PreSync Job (see base-service
templates/prepull.yaml). It lives here because the `apps` project that deploys
base-service does not allow RBAC objects.
*/ -}}
{{- if .Values.tenant.prepullVerifier.enabled }}
{{- $ns := include "tenant.name" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prepull-verifier
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prepull-verifier
  namespace: {{ $ns }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prepull-verifier
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prepull-verifier
subjects:
  - kind: ServiceAccount
    name: prepull-verifier
    namespace: {{ $ns }}
{{- end }}
