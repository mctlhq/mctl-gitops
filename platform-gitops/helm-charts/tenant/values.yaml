# =============================================================================
# tenant: default values
# Override per-tenant in platform-gitops/tenants/{name}/values.yaml
# =============================================================================

tenant:
  # -- Required: tenant slug (lowercase, DNS-safe)
  name: ""

  # -- Optional: human-readable display name
  displayName: ""

  # -- Optional: description
  description: ""

  # -- Optional: GitHub team slug (for ArgoCD RBAC mapping)
  githubTeam: ""

  # -- Optional: contact email
  contactEmail: ""

  # -- Resource quotas for the namespace
  quotas:
    # Aggregate CPU/memory requests across all pods
    requests.cpu: "500m"
    requests.memory: "2Gi"
    # Aggregate CPU/memory limits across all pods (sized for one OpenClaw pod + one service + deploy workflow)
    limits.cpu: "4"
    limits.memory: "6Gi"
    # Maximum number of pods
    pods: "10"
    # Maximum number of PVCs
    persistentvolumeclaims: "2"
    # Maximum number of services
    services: "10"

  # -- GHCR pull credentials ExternalSecret (targets Secret "ghcr-credentials",
  # which base-service's Deployment always references via imagePullSecrets).
  # Defaults on so every current/future tenant gets it automatically. Set to
  # false only for tenants that already own that Secret another way (e.g.
  # via a platform-level or per-service openclaw ExternalSecret) — a second
  # Owner ExternalSecret targeting the same Secret name causes ArgoCD
  # self-heal drift fights between the two owners.
  ghcrCredentials:
    enabled: true

  # -- Tenant-scoped Vault SecretStore, rendered into every namespace this
  # tenant owns. base-service points its ExternalSecrets here by default, so
  # tenant secrets never resolve through the cluster-wide vault-backend store
  # (which any namespace can use, and which now only reaches platform/*).
  # Requires the matching Vault role/policy eso-tenant-{tenant} to exist —
  # wft-create-tenant creates it; see vault-config/README.md to backfill.
  secretStore:
    enabled: true
    name: "tenant-store"
    serviceAccountName: "tenant-eso"
    server: "http://vault.vault.svc.cluster.local:8200"
    # KV v2 mount — must match the ClusterSecretStore or every remoteRef.key moves
    path: "secret"
    version: "v2"
    authMountPath: "kubernetes"

  # -- LimitRange defaults (applied to containers without explicit limits)
  limitRange:
    enabled: true
    default:
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "50m"
      memory: "128Mi"
    max:
      cpu: "1500m"
      memory: "3Gi"

  # -- Network policies
  networking:
    # Allow pods within the same namespace to communicate
    allowIntraNamespace: true
    # Allow egress to cluster-internal services (Vault, ArgoCD, DNS, etc.)
    allowClusterEgress: true
    # Allow egress to the internet (0.0.0.0/0)
    # Closed by default; opt in per tenant (admin/platform teams, services
    # calling external APIs). Argo Workflow pods get internet egress
    # unconditionally via allow-workflow-internet-egress, so builds/deploys
    # work either way. All existing tenants set this explicitly.
    allowInternetEgress: false
    # Specific CIDR ranges to allow (in addition to cluster egress)
    # allowedCIDRs: []

  # -- Pod Security Standards level for the namespace
  # "baseline" allows workflow/CI pods running as root (required for apk, git, etc.)
  # "restricted" enforces non-root + no privilege escalation (stricter, for app-only namespaces)
  podSecurityLevel: "baseline"
